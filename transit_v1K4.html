 *   discountAmount.adult（FR 用：減收金額）、totalFare.adult（TF 用：
 *   兩程合共車資）、timeLimit（轉乘時限，分鐘）、remark（附加條款）。
 */
function _ctbTrimUp(s) {
  return String(s || "").trim().toUpperCase();
}

/* ---------------- 城巴轉乘適用登車範圍解析與核對 ----------------
 * concessionApi 每條 ir 記錄嘅 remark 欄位，係用嚟講明「呢個轉乘優惠淨係
 * 適用於響邊個範圍登車嘅乘客」。同一組 routeA→routeB，官方時常會回傳幾條
 * bound/direction/secondDirection 都完全一樣，但 discount 類型（L1/L2/FR/
 * TF）同 remark 唔同嘅記錄——即係話，淨係靠原有嘅「方向比對」評分，呢幾
 * 條記錄分數會打平手，變成永遠揀到排得最前嗰一條，完全冇理會乘客實際上
 * 車站係咪真係落喺呢條記錄講明嘅範圍入面，容易「撞中」錯誤嘅折扣類型。
 * 例如（實測 608→22 嘅其中一組）：
 *   discount:"L1"（回贈首程車費）remark:「只適用於在東區海底隧道巴士轉乘
 *     站或之後沿途各站登上首程路線的乘客。」
 *   discount:"L2"（次程免費）    remark:「只適用於在香港島沿途各站登上首
 *     程路線的乘客。」
 * 呢兩條記錄先前完全冇被 remark 篩走任何一條，最終揀邊條淨係睇邊條排先，
 * 同乘客實際喺邊度上首程車完全冇關係，車費就有機會計錯。
 */

// 1. 輔助函數：處理多重站點分隔符 (支援 "或", "/", ",", "、")
function _ctbSplitAnchors(str) {
  if (!str) return [];
  // 依據標點及連接詞分割，並自動移除站名尾部的空格
  return str.split(/[\/或,、]/).map(s => s.trim()).filter(Boolean);
}

// 2. 預處理及範圍解析
function _ctbParseRemarkConstraints(remarkText) {
  const out = [];
  const raw = String(remarkText || "").trim();
  if (!raw) return out;

  // 預處理：將「不適用於」替換為新句子，以便獨立解析為 exclude 規則
  const normalizedRaw = raw.replace(/不適用於/g, "。不適用於");

  // 拆分邏輯：以換行、句號分句，並處理 Markdown-like 列表符號 "-"
  const sentences = normalizedRaw
    .split(/[\r\n]+|(?<=。)/)
    .flatMap(s => s.split(/(?:^- \s*)/)) 
    .map(s => s.trim())
    .filter(Boolean);

  for (let sentence of sentences) {
    let isExclude = false;
    
    // 檢查是否為排除條款
    if (sentence.includes("不適用於")) {
      isExclude = true;
      sentence = sentence.replace(/^不適用於\s*/, "");
    }

    // 清理句首干擾詞 (支援「優惠只適用於：」、「- 在」、「於」等)
    sentence = sentence.replace(/^(?:- \s*)?(?:優惠)?只適用於[：:]?\s*/, "");
    sentence = sentence.replace(/^(?:在|於)\s*/, "");

    if (!sentence) continue;

    const c = _ctbParseOneRemarkSentence(sentence);
    if (c) {
      if (isExclude) c.exclude = true;
      out.push(c);
    } else {
      console.debug(`[城巴轉乘] remark 句子未能識別格式，略過檢查：「${sentence}」`);
    }
  }
  return out;
}

// 3. 增強版 remark 句式解析器
function _ctbParseOneRemarkSentence(sentence) {
  let m;

  // 判定動作：預設為登車 (board)，若包含「下車」則為 alight
  const isAlight = sentence.includes("下車");
  const action = isAlight ? "alight" : "board";

  // 句式 A：繳付全程車資
  m = sentence.match(/(首程|次程)(?:繳付全程車資)/);
  if (m) {
    return { leg: m[1] === "次程" ? "second" : "first", action, type: "full_fare" };
  }

  // 句式 B：轉乘方向 (例如「轉乘往港珠澳大橋香港口岸」)
  m = sentence.match(/轉乘往(.+)/);
  if (m) {
    return { leg: "second", action: "board", type: "direction", anchors: _ctbSplitAnchors(m[1]) };
  }

  // 句式 C：分段收費 (例如「次程享用維港灣往弼街分段收費」)
  m = sentence.match(/(首程|次程)?(?:享用)?(.+?)(?:分段收費)/);
  if (m) {
    const leg = (m[1] === "次程" || sentence.includes("次程")) ? "second" : "first";
    return { leg, action, type: "section_fare", anchors: [m[2].trim()] };
  }

  // 句式 D：區間範圍 (支援「到」、「至」、「及...之間」)
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)(?:及|至|到)(.+?)(?:之間)?(?:沿途)?(?:各站)?(?:登(?:上.*?|車)|下車)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    return {
      leg: finalLeg,
      action,
      type: "between",
      anchors: [..._ctbSplitAnchors(m[2]), ..._ctbSplitAnchors(m[3])]
    };
  }

  // 句式 E：指定位置之前/前 (支援「各站前」、「以前」)
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)(?:站)?(?:各站)?(?:或)?(?:之前|以前|前)(?:沿途)?(?:各站)?(?:登(?:上.*?|車)|下車)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    return {
      leg: finalLeg,
      action,
      type: "before",
      anchors: _ctbSplitAnchors(m[2])
    };
  }

  // 句式 F：指定位置之後/後 (支援「後各站」)
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)(?:站)?(?:各站)?(?:或)?(?:之後|其後|後)(?:沿途)?(?:各站)?(?:登(?:上.*?|車)|下車)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    return {
      leg: finalLeg,
      action,
      type: "after",
      anchors: _ctbSplitAnchors(m[2])
    };
  }

  // 句式 G：指定位置或區域登/下車 (支援 "/"、"或"、"," 分隔及括號)
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)(?:沿途)?(?:各站)?(?:登(?:上.*?|車(?:往.*?)?)|下車)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    return {
      leg: finalLeg,
      action,
      type: "along",
      anchors: _ctbSplitAnchors(m[2])
    };
  }

  return null;
}

// 去除空白同全／半形括號，方便兩個站名之間做子字串比對
// （例如完整站名「德輔道西 (林士街)」對 remark 講嘅「德輔道西」）。
function _ctbNormalizeStopName(s) {
  return String(s || "").replace(/[\s()（）]/g, "").trim();
}

// 攞返某一程車嘅上車站，喺佢自己路線嘅站序陣列入面嘅索引（用嚟同 remark
// 講嘅「或之前／或之後」比先後）。搵唔到就回傳 null（代表冇資料驗證）。
function _ctbLegBoardIdx(leg) {
  if (!leg || !leg.r || !leg.r.stops || !leg.boardStopId) return null;
  const co = leg.co || leg.primaryCo;
  const stops = leg.r.stops[co] || leg.r.stops[Object.keys(leg.r.stops)[0]];
  if (!stops) return null;
  const idx = stops.indexOf(leg.boardStopId);
  return idx === -1 ? null : idx;
}

// 同上，但攞落車站（alightStopId）嘅站序索引——用嚟核對「首程係咪響
// 官方建議轉車站或之後先落車」（KMB recommended_bbi／城巴 stopName 都會
// 用到）。搵唔到就回傳 null（代表冇資料驗證）。
function _legAlightIdx(leg) {
  if (!leg || !leg.r || !leg.r.stops || !leg.alightStopId) return null;
  const co = leg.co || leg.primaryCo;
  const stops = leg.r.stops[co] || leg.r.stops[Object.keys(leg.r.stops)[0]];
  if (!stops) return null;
  const idx = stops.indexOf(leg.alightStopId);
  return idx === -1 ? null : idx;
}

// 喺某一程車嘅路線站序入面，用名稱子字串比對搵返 remark 提到嘅 anchor 站
// 排喺第幾個位（雙向 includes：完整站名包含 anchor，或者 anchor 包含完整
// 站名，都當撞中，應付「德輔道西」對「德輔道西 (林士街)」呢類簡寫）。
function _ctbFindAnchorIdx(leg, anchorNameRaw) {
  if (!leg || !leg.r || !leg.r.stops) return null;
  const anchorName = _ctbNormalizeStopName(anchorNameRaw);
  if (!anchorName) return null;
  const co = leg.co || leg.primaryCo;
  const stops = leg.r.stops[co] || leg.r.stops[Object.keys(leg.r.stops)[0]];
  if (!stops) return null;
  for (let i = 0; i < stops.length; i++) {
    const s = (typeof etaDb !== "undefined" && etaDb.stopList) ? etaDb.stopList[stops[i]] : null;
    if (!s) continue;
    const zh = _ctbNormalizeStopName(s.name?.zh || s.name || "");
    if (!zh) continue;
    if (zh.includes(anchorName) || anchorName.includes(zh)) return i;
  }
  return null;
}


// 核對城巴 concessionApi 嘅 stopName 欄位（建議轉車站，例如「香港仔隧道
// 巴士轉乘站」）——呢個同上面靠 remark 解析出嚟嘅 constraints 係獨立、
// 互補嘅檢查：好多 ir 記錄嘅 remark 完全冇提及邊度上/落車（例如淨係話
// 「減收 $X」冇附加條款），令 remarkConstraints 係空陣列，一律當合資
// 格；但呢啲記錄往往都有 stopName 講明官方建議嘅轉車站，只不過以前呢
// 個欄位得個「存底」，從冇被用嚟驗證過。而家加返呢一層：要求首程實際
// 落車站，喺首程路線嘅站序入面，index ≥ 建議轉車站嘅 index，先當合資
// 格——即係「首程行到建議轉車站或之後先落車」，同 remark 入面「或之後
// 各站」呢類寫法邏輯一致。同樣，搵唔到資料驗證（stopName 冇提供、喺站
// 序表比對唔到）就保持「驗證唔到就放過」，唔會誤刪本身有效嘅優惠。
function _ctbStopNameConstraintSatisfied(stopNameRaw, prevLeg, nextLeg) {
  const stopNameStr = String(stopNameRaw || "").trim();
  if (!stopNameStr) return true;
  const alightIdx = _legAlightIdx(prevLeg);
  if (alightIdx === null) return true;
  const recIdx = _ctbFindAnchorIdx(prevLeg, stopNameStr);
  if (recIdx === null) return true;
  return alightIdx >= recIdx;
}

// 少數 remark 用嘅係「香港島／九龍／新界」呢類大範圍地名（唔係具體站名），
// 冇辦法直接同單一站名做子字串比對。呢度借用現有嘅 HK_ISLAND_KEYWORDS／
// isHKIslandCoord（見上面 Trip detection 部分）做粗略嘅地區判斷，盡量補
// 返呢類 remark 嘅驗證能力；判斷唔到就當冇資料驗證。
const _CTB_KOWLOON_KEYWORDS = /尖沙咀|尖東|旺角|油麻地|佐敦|深水埗|長沙灣|荔枝角|美孚|九龍城|土瓜灣|紅磡|啟德|新蒲崗|黃大仙|鑽石山|慈雲山|牛池灣|九龍灣|牛頭角|觀塘|藍田|油塘|秀茂坪|順利|九龍塘|何文田|大角咀|石硤尾/;
function _ctbGuessHkRegion(name, lat, lng) {
  if ((typeof HK_ISLAND_KEYWORDS !== "undefined" && HK_ISLAND_KEYWORDS.test(name)) ||
      (typeof isHKIslandCoord === "function" && Number.isFinite(lat) && Number.isFinite(lng) && isHKIslandCoord(lat, lng))) {
    return "hkisland";
  }
  if (_CTB_KOWLOON_KEYWORDS.test(name) || (Number.isFinite(lat) && Number.isFinite(lng) && lat > 22.298 && lat <= 22.355 && lng >= 114.09 && lng <= 114.24)) {
    return "kowloon";
  }
  if (Number.isFinite(lat) && Number.isFinite(lng)) return "nt"; // 新界／離島等其餘地方
  return null;
}
// 地名／區域識別
function _ctbAnchorRegion(anchorName) {
  if (/香港島|港島/.test(anchorName)) return "hkisland";
  if (/九龍/.test(anchorName)) return "kowloon";
  if (/大嶼山/.test(anchorName)) return "lantau";
  if (/新界|北區|大埔|元朗|屯門|沙田|葵青|荃灣|西貢|將軍澳/.test(anchorName)) return "nt";
  return null;
}

// 核對單一個 constraint 係咪俾「乘客實際上車站」滿足。原則：只要冇足夠
// 資料去驗證（搵唔到 anchor 對應邊個站、攞唔到上車站索引等），就寧願放
// 過（回傳 true），好過因為解析／比對唔到就誤刪咗本身有效嘅優惠；但只
// 要搵到足夠資料證明唔滿足，就要老實咁擋走呢條記錄。
function _ctbConstraintSatisfied(constraint, prevLeg, nextLeg) {
  const leg = constraint.leg === "second" ? nextLeg : prevLeg;
  if (!leg) return true;

  // 【可靠性修正】並非每種 constraint 都有 anchors（例如句式 A「首程/次程
  // 繳付全程車資」type:"full_fare" 就完全冇 anchors 呢個欄位，因為佢淨係
  // 講緊車資規則，唔涉及任何站名/地點）。以往落面幾段直接用
  // `constraint.anchors.length` / `for...of constraint.anchors`，一旦
  // 撞到冇 anchors 嘅 constraint（例如 full_fare、或者未來新增嘅句式）
  // 就會因為 anchors 係 undefined 而拋 "constraint.anchors is not
  // iterable" TypeError，累到成個候選（甚至成程搜尋）中斷。而家統一喺
  // 呢度將 anchors 正規化做一個保證存在嘅陣列，落面全部改用呢個本地
  // 變數，就算冇 anchors 都只會當「冇資料可以驗證」（沿用返呢個函數
  // 一貫嘅「驗證唔到就放過」原則），唔會再拋錯。
  const anchors = Array.isArray(constraint.anchors) ? constraint.anchors : [];

  // 處理站點區間範圍（between）
  if (constraint.type === "between") {
    const actualIdx = _ctbLegBoardIdx(leg);
    if (actualIdx === null) return true;
    if (anchors.length >= 2) {
      const idxA = _ctbFindAnchorIdx(leg, anchors[0]);
      const idxB = _ctbFindAnchorIdx(leg, anchors[1]);
      if (idxA !== null && idxB !== null) {
        const minIdx = Math.min(idxA, idxB);
        const maxIdx = Math.max(idxA, idxB);
        return actualIdx >= minIdx && actualIdx <= maxIdx;
      }
    }
    return true;
  }

  // 處理指定地點/區域登車（along）
  if (constraint.type === "along") {
    const board = (typeof etaDb !== "undefined" && etaDb.stopList) ? etaDb.stopList[leg.boardStopId] : null;
    const boardName = _ctbNormalizeStopName(board?.name?.zh || board?.name || "");
    if (boardName) {
      for (const anchorName of anchors) {
        const a = _ctbNormalizeStopName(anchorName);
        if (a && (boardName.includes(a) || a.includes(boardName))) return true;
      }
    }
    const boardLoc = board?.location;
    const boardRegion = boardLoc ? _ctbGuessHkRegion(boardName, boardLoc.lat, boardLoc.lng) : null;
    let anyRegionAnchor = false;
    if (boardRegion) {
      for (const anchorName of anchors) {
        const region = _ctbAnchorRegion(anchorName);
        if (region) {
          anyRegionAnchor = true;
          if (region === boardRegion) return true;
        }
      }
      if (anyRegionAnchor) return false;
    }
    return true;
  }

  // 處理次程行車方向 (direction，例如 remark 講明「轉乘往港珠澳大橋香港
  // 口岸」)——呢類 constraint 講嘅係「次程呢程車實際去緊邊個方向／目的
  // 地」，同上面 before/after／between 嗰種「喺邊個站範圍上車」完全唔同
  // 層次，唔應該用站名索引去比對，必須直接攞次程路線嘅實際目的地嚟核
  // 對。以前呢類 constraint 冇專屬分支，跌落最底嗰段「其餘冇專屬分支嘅
  // 類型」按 before/after 邏輯處理——但 direction 嘅 anchors（例如「港珠
  // 澳大橋香港口岸」）通常喺次程路線嘅站序入面搵唔到（唔係站名，係終點
  // 地區名），令 anyAnchorResolvable 一直係 false，結果一律「驗證唔到就
  // 放過」，變相完全冇檢查次程方向就當合資格。
  if (constraint.type === "direction") {
    const destZh = (leg.r && leg.r.dest && leg.r.dest.zh) || "";
    if (!destZh || !anchors.length) return true; // 冇資料可以核對，維持「驗證唔到就放過」原則
    const d = _ctbNormalizeStopName(destZh);
    for (const anchorName of anchors) {
      const a = _ctbNormalizeStopName(anchorName);
      if (a && d && (d.includes(a) || a.includes(d))) return true;
    }
    return false;
  }

  // 處理「之後 (after)」與「之前 (before)」，以及其餘冇專屬分支嘅類型
  // （例如 full_fare、section_fare）：冇 anchors 可驗證就
  // 直接放過（return true），有 anchors 先按 before/after 邏輯核對。
  const actualIdx = _ctbLegBoardIdx(leg);
  if (actualIdx === null) return true;

  let anyAnchorResolvable = false;
  for (const anchorName of anchors) {
    const anchorIdx = _ctbFindAnchorIdx(leg, anchorName);
    if (anchorIdx === null) continue;
    anyAnchorResolvable = true;
    if (constraint.type === "after" && actualIdx >= anchorIdx) return true;
    if (constraint.type === "before" && actualIdx <= anchorIdx) return true;
  }
  return !anyAnchorResolvable;
}

// 一條候選記錄嘅所有 remarkConstraints 要全部滿足（AND），先算呢條候選對
// 「乘客實際嘅首／次程上車站」嚟講係適用嘅。
function _ctbAllConstraintsSatisfied(remarkConstraints, prevLeg, nextLeg) {
  if (!Array.isArray(remarkConstraints) || !remarkConstraints.length) return true;
  return remarkConstraints.every(c => _ctbConstraintSatisfied(c, prevLeg, nextLeg));
}

// 將 concessionApi 回應（見上面註解嘅格式）整理做扁平陣列，方便逐條篩選比對。
function parseCtbLiveInterchangeResponse(json, routeA, routeB) {
  const out = [];
  if (!json || typeof json !== "object") return out;
  for (const key of Object.keys(json)) {
    const entry = json[key];
    if (!entry || _ctbTrimUp(entry.route) !== routeA) continue;
    const irList = Array.isArray(entry.ir) ? entry.ir : [];
    for (const ir of irList) {
      if (!ir || _ctbTrimUp(ir.route) !== routeB) continue;
      out.push({
        bound: entry.bound || "",
        direction: entry.direction || "",
        secondProvider: (ir.secondProvider || "").trim(),
        secondDirection: ir.direction || "",
        stopName: ir.stopName || "",
        discount: (ir.discount || "").trim().toUpperCase(),
        discountAmount: ir.discountAmount || null,
        totalFare: ir.totalFare || null,
        timeLimit: Number.isFinite(parseFloat(ir.timeLimit)) ? parseFloat(ir.timeLimit) : null,
        remark: (ir.remark || "").trim(),
        // 解析 remark 入面「只適用於響邊個範圍登車」嘅條件，等揀最夾候選
        // 記錄嘅時候，可以連同乘客實際嘅上車站一齊核對（見下面
        // _ctbParseRemarkConstraints／_ctbConstraintSatisfied）。同一條
        // routeA→routeB，官方好多時會回傳幾條 bound/direction 都一樣、但
        // discount 類型／remark 唔同嘅記錄（例如一條話「東區海底隧道轉乘
        // 站或之後上車先啱」，另一條話「香港島沿途各站上車先啱」），單靠
        // 方向比對揀唔返「乘客實際上車站啱唔啱嗰一條」，一定要睇埋 remark。
        remarkConstraints: _ctbParseRemarkConstraints((ir.remark || "").trim())
      });
    }
  }
  return out;
}

async function _fetchCtbViaJinaMarkdown(targetUrl) {
  try {
    const proxyUrl = `https://r.jina.ai/${targetUrl}`;
    const r = await fetch(proxyUrl);
    if (!r.ok) {
      console.warn(`[城巴轉乘] 載入 markdown 回應非 2xx (status ${r.status})：${targetUrl}`);
      return null;
    }
    const text = await r.text();
    const json = _extractJsonFromJinaMarkdown(text);
    if (!json) {
      console.warn(`[城巴轉乘] 由 r.jina.ai markdown 內容摘唔到 JSON：${targetUrl}`);
    }
    return json;
  } catch (err) {
    console.error(`[城巴轉乘] 載入 markdown 失敗，放棄呢次查詢：${targetUrl}`, err);
    return null;
  }
}

function _extractJsonFromJinaMarkdown(text) {
  if (!text) return null;

  // 情況一：整個回應本身已經係原始 JSON（冇 markdown 包裝）
  try {
    return JSON.parse(text.trim());
  } catch (_) { /* 唔係就試下面嘅 markdown 摘取方式 */ }

  let body = text;
  const markerIdx = body.indexOf("Markdown Content:");
  if (markerIdx !== -1) {
    body = body.slice(markerIdx + "Markdown Content:".length);
  }
  body = body.trim();

  // 剝走可能存在嘅 ```json ... ``` 或 ``` ... ``` code fence
  const fenceMatch = body.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
  if (fenceMatch) body = fenceMatch[1].trim();

  try {
    return JSON.parse(body);
  } catch (err) {
    // 保險：如果前後仲有雜訊文字，摘返最外層 {...} 再試一次
    const first = body.indexOf("{");
    const last = body.lastIndexOf("}");
    if (first !== -1 && last !== -1 && last > first) {
      try {
        return JSON.parse(body.slice(first, last + 1));
      } catch (err2) {
        console.warn("[城巴轉乘] 摘取最外層 {...} 後仍 parse 唔到 JSON:", err2, body.slice(0, 200));
        return null;
      }
    }
    console.warn("[城巴轉乘] 由 markdown 內容 parse JSON 失敗:", err, body.slice(0, 200));
    return null;
  }
}

// 帶快取（以 Promise 儲存，避免短時間內重覆 fetch 同一組合）嘅即時查詢。
// routeA = 首程路線編號，routeB = 次程路線編號（皆已經過 _routeKeyForBbi 處理）。
// 回傳 parseCtbLiveInterchangeResponse() 嘅輸出陣列；查詢失敗回傳 []。
function fetchCtbLiveInterchange(routeA, routeB) {
  const cacheKey = `${routeA}|${routeB}`;
  if (ctbLiveInterchangeCache.has(cacheKey)) return ctbLiveInterchangeCache.get(cacheKey);

  const targetUrl = `https://www.citybus.com.hk/concessionApi/public/bbi/api/v1/route/tc/${encodeURIComponent(routeA.toLowerCase())}/${encodeURIComponent(routeB.toLowerCase())}`;
  const promise = _fetchCtbViaJinaMarkdown(targetUrl)
    .then(json => {
      const parsed = parseCtbLiveInterchangeResponse(json, routeA, routeB);
      console.debug(`[城巴轉乘] ${routeA} → ${routeB}：撞中 ${parsed.length} 條記錄`, parsed);
      return parsed;
    })
    .catch(err => {
      console.error(`城巴轉乘優惠即時查詢失敗 (${routeA} → ${routeB}):`, err);
      return [];
    });

  ctbLiveInterchangeCache.set(cacheKey, promise);
  return promise;
}

// 按實際落車/上車方向嘅目的地文字，喺多個候選記錄入面揀返最夾嘅一條
// （例如 S52 兩個方向都可能同時查到 ir 記錄，要揀返同呢程實際方向相符嗰條）。
function _pickBestCtbLiveMatch(candidates, prevLeg, nextLeg, gap) {
  const prevDestZh = (prevLeg.r && prevLeg.r.dest && prevLeg.r.dest.zh) || "";
  const nextDestZh = (nextLeg.r && nextLeg.r.dest && nextLeg.r.dest.zh) || "";

  let best = null;
  let bestScore = -1;
  for (const c of candidates) {
    if (c.timeLimit !== null && gap > c.timeLimit) continue; // 超過轉乘時限，唔適用
    // 同一組 bound/direction/secondDirection 有時會撞出幾條 discount 類型
    // 唔同嘅記錄（例如 L1 vs L2），單靠下面嘅方向評分分唔出邊條先啱，一
    // 定要用 remark 講明嘅上車範圍，同乘客實際嘅首／次程上車站對比先
    // 揀得準；唔符合範圍嘅記錄喺呢度直接擋走，唔會入到落面評分。
    if (!_ctbAllConstraintsSatisfied(c.remarkConstraints, prevLeg, nextLeg)) continue;
    // 【建議轉車站位置檢定】同上面 remark constraints 互補：就算 remark
    // 冇講明上/落車範圍，都要核對官方 stopName 講嘅建議轉車站，確保首程
    // 冇喺建議轉車站之前就提早落車轉車（見 _ctbStopNameConstraintSatisfied
    // 頂部註解）。
    if (!_ctbStopNameConstraintSatisfied(c.stopName, prevLeg, nextLeg)) continue;
    let score = 0;
    if (prevDestZh && c.direction && (c.direction === prevDestZh || prevDestZh.includes(c.direction) || c.direction.includes(prevDestZh))) score += 2;
    if (nextDestZh && c.secondDirection && (c.secondDirection === nextDestZh || nextDestZh.includes(c.secondDirection) || c.secondDirection.includes(nextDestZh))) score += 1;
    if (score > bestScore) { bestScore = score; best = c; }
  }
  return best;
}

// 即時計算城巴（含跨公司）轉乘優惠。回傳：
//   discount          : FR 類「減收」金額（要喺次程車費度直接扣）
//   totalFareOverride : TF 類「兩程合共車資」（要用「兩程合計 - 呢個數」嚟計扣減）
//   rebateFirstLeg     : L1 類「回贈首程車費」金額（要喺首程車費度扣）
//   secondLegFree      : L2 類「次程免費」金額（要喺次程車費度扣）
async function _ctbLiveDiscountFor(prevLeg, nextLeg) {
  const none = { discount: 0, totalFareOverride: null, rebateFirstLeg: 0, secondLegFree: 0 };
  // concessionApi 淨係城巴自己（含接駁其他巴士公司）嘅轉乘優惠資料，同
  // 港鐵完全冇關。
  if (prevLeg.co === "mtr" || nextLeg.co === "mtr") return none;
  // 【修正一】concessionApi 淨係城巴自己（連同接駁其他專營巴士公司，例如
  // 九巴/龍運/新巴）嘅轉乘優惠資料，專線/紅色小巴（co === "gmb"）從來
  // 都唔屬於呢個優惠計劃——就算首程或次程其中一程係城巴，只要另一程係
  // 小巴，都一定冇任何城巴轉乘優惠。以前呢度淨係檢查「兩程都唔係城巴就
  // 放過」，冇理會另一程係咪小巴，令城巴轉小巴（例如 962X→55）被誤判
  // 成「有機會撞中優惠」，白白查一次 API、甚至誤套用埋唔屬於佣嘅折扣。
  if (prevLeg.co === "gmb" || nextLeg.co === "gmb") return none;
  // concessionApi 係城巴自己嘅轉乘優惠資料，只要首程或次程其中一程係城巴
  // 就有機會撞中（可以係城巴轉城巴，亦可以係城巴轉/接其他公司，例如龍運）。
  if (prevLeg.co !== "ctb" && nextLeg.co !== "ctb") return none;
  const gap = _transferGapMinutes(prevLeg, nextLeg);
  if (gap === null) return none;

  const routeA = _routeKeyForBbi(prevLeg.routeNo);
  const routeB = _routeKeyForBbi(nextLeg.routeNo);
  if (!routeA || !routeB) return none;

  const candidates = await fetchCtbLiveInterchange(routeA, routeB);
  if (!candidates.length) return none;

  const best = _pickBestCtbLiveMatch(candidates, prevLeg, nextLeg, gap);
  if (!best) return none;

  const result = { discount: 0, totalFareOverride: null, rebateFirstLeg: 0, secondLegFree: 0 };
  switch (best.discount) {
    case "FR": {
      // 減收 discountAmount
      const amt = parseFloat(best.discountAmount && best.discountAmount.adult);
      if (Number.isFinite(amt)) result.discount = amt;
      break;
    }
    case "TF": {
      // 兩程優惠車資合共 totalFare
      const tf = parseFloat(best.totalFare && best.totalFare.adult);
      if (Number.isFinite(tf)) result.totalFareOverride = tf;
      break;
    }
    case "L1":
      // 回贈首程車費
      result.rebateFirstLeg = typeof prevLeg.fare === "number" ? prevLeg.fare : 0;
      break;
    case "L2":
      // 次程免費
      result.secondLegFree = typeof nextLeg.fare === "number" ? nextLeg.fare : 0;
      break;
    default:
      break;
  }
  return result;
}

// 輕鐵 ↔ 屯馬綫／港鐵巴士（新界西北）轉乘優惠
//   1) 輕鐵 ↔ 屯馬綫：如果輕鐵嗰程車費不超過 $5.4，並喺轉乘站 30 分鐧內
//      入站（不論方向：輕鐧轉屯馬綫，或屯馬綫轉輕鐵），輕鐵車費可
//      獲豁免（豁免對象一律係輕鐵嗰程,唔係屯馬綫嗰程）。
//   2) 輕鐵 ↔ 港鐵巴士（新界西北）：60 分鐧內轉乘（不論方向），較低嗰
//      程車費（輕鐧或港鐧巴士，睇邊個平）可獲豁免。
//   3) 容許三重轉乘：輕鐧→屯馬綫→輕鐧／輕鐧→屯馬綫→港鐧巴士／
//      港鐧巴士→屯馬綫→輕鐧，三重轉乘全程時限放寬到 120 分鐧（首程
//      跟尾程之間），中間嗰程屯馬綫純粹做橋，實際仲係比較輕鐧同港鐧
//      巴士兩程（如果三程都係輕鐧/屯馬綫/輕鐧,就兩程輕鐧各自獨立評
//      估自己嗰邊嘅 30 分鐧/$5.4 條件）。
//   4) 港鐵巴士 ↔ 屯馬綫（不經輕鐧）：25 分鐧內轉乘（不論方向），全額
//      豁免港鐧巴士嗰程車費，全程淨係收屯馬綫嗰程車費。

function isTmlLeg(leg) {
  return !!(leg && leg.co === "mtr" && leg.r && leg.r.mtrLineCode === "TML");
}
function isLrLeg(leg) {
  return !!(leg && leg.co === "lightrail");
}
function isMtrbLeg(leg) {
  return !!(leg && leg.co === "mtrb");
}

const LR_TML_FARE_CAP = 5.4;   // 輕鐵一程車費上限,先合資格獲屯馬綫轉乘豁免
const LR_TML_GAP_MIN = 30;     // 輕鐵 ↔ 屯馬綫轉乘時限（分鐧）
const LR_MTRB_GAP_MIN = 60;    // 輕鐵 ↔ 港鐵巴士轉乘時限（分鐧）
const LR_TRIPLE_GAP_MIN = 120; // 三重轉乘全程時限（分鐧）
// 【港鐧巴士 ↔ 屯馬綫（不經輕鐧）轉乘優惠】港鐧巴士（西鐵綠色專營巴士
// 服務，例如 K65）喺轉車站規定時限內以八達通轉乘屯馬綫（或反方向），
// 港鐧巴士嗰程車費可全額豁免，全程淨係收屯馬綫嗰程車費。呢個同上面
// 輕鐧涉及嘅轉乘優惠（會比較邊程平嚟豁免）唔同，港鐧巴士呢邊唔理車費
// 邊程貴,一律豁免港鐧巴士嗰程。同樣係根據用戶提供文字規則寫嘅簡化實作,
// 冇經過官方逐項核實,如有出入請以官方公佈為準。
const MTRB_TML_GAP_MIN = 30;   // 港鐧巴士 ↔ 屯馬綫轉乘時限（分鐧）

// 傳入完整 rideLegs,回傳一個同 rideLegs 長度一致嘅 discounts 陣列
// （每個 index 代表嗰一程應豁免幾多錢）,交返 computeTripFare() 同其他
// 折扣（九巴 BBI／城巴轉乘等）一齊用 Math.max 疊加。
function _lrInterchangeDiscounts(rideLegs) {
  const discounts = new Array(rideLegs.length).fill(0);
  if (rideLegs.length < 2) return discounts;

  const handledPairs = new Set(); // 已經被三重轉乘處理咗嘅相鄰對,下面單一轉乘邏輯唔會再重複計

  // 先處理三重轉乘（3 程,中間一定係屯馬綫做「橋」）
  for (let i = 0; i + 2 < rideLegs.length; i++) {
    const legA = rideLegs[i], legB = rideLegs[i + 1], legC = rideLegs[i + 2];
    if (!isTmlLeg(legB)) continue;

    const isTriple =
      (isLrLeg(legA) && isLrLeg(legC)) ||
      (isLrLeg(legA) && isMtrbLeg(legC)) ||
      (isMtrbLeg(legA) && isLrLeg(legC));
    if (!isTriple) continue;

    const totalGap = _transferGapMinutes(legA, legC); // 首程到尾程嘅全程時限
    if (totalGap === null || totalGap > LR_TRIPLE_GAP_MIN) continue;

    if (isLrLeg(legA) && isLrLeg(legC)) {
      // 輕鐵→屯馬綫→輕鐵：兩程輕鐵各自獨立符合返自己嗰邊嘅 30 分/$5.4 先豁免
      const gap1 = _transferGapMinutes(legA, legB);
      if (gap1 !== null && gap1 <= LR_TML_GAP_MIN && typeof legA.originalFare === "number" && legA.originalFare <= LR_TML_FARE_CAP) {
        discounts[i] = Math.max(discounts[i], legA.originalFare);
      }
      const gap2 = _transferGapMinutes(legB, legC);
      if (gap2 !== null && gap2 <= LR_TML_GAP_MIN && typeof legC.originalFare === "number" && legC.originalFare <= LR_TML_FARE_CAP) {
        discounts[i + 2] = Math.max(discounts[i + 2], legC.originalFare);
      }
    } else {
      // 輕鐵→屯馬綫→港鐵巴士 或 港鐵巴士→屯馬綫→輕鐵：屯馬綫做橋,
      // 實際比較嘅係輕鐵嗰程 vs 港鐵巴士嗰程,揀平嗰程豁免。
      const lrIdx = isLrLeg(legA) ? i : i + 2;
      const mtrbIdx = isMtrbLeg(legA) ? i : i + 2;
      const lrLeg = rideLegs[lrIdx];
      const mtrbLeg = rideLegs[mtrbIdx];
      if (typeof lrLeg.originalFare === "number" && typeof mtrbLeg.originalFare === "number") {
        if (lrLeg.originalFare <= mtrbLeg.originalFare) {
          discounts[lrIdx] = Math.max(discounts[lrIdx], lrLeg.originalFare);
        } else {
          discounts[mtrbIdx] = Math.max(discounts[mtrbIdx], mtrbLeg.originalFare);
        }
      }
    }

    handledPairs.add(`${i}-${i + 1}`);
    handledPairs.add(`${i + 1}-${i + 2}`);
  }

  // 處理普通單一轉乘
  for (let i = 1; i < rideLegs.length; i++) {
    const key = `${i - 1}-${i}`;
    if (handledPairs.has(key)) continue;
    const prevLeg = rideLegs[i - 1], nextLeg = rideLegs[i];

    if ((isLrLeg(prevLeg) && isTmlLeg(nextLeg)) || (isTmlLeg(prevLeg) && isLrLeg(nextLeg))) {
      const lrIdx = isLrLeg(prevLeg) ? i - 1 : i;
      const lrLeg = rideLegs[lrIdx];
      const gap = _transferGapMinutes(prevLeg, nextLeg);
      if (gap !== null && gap <= LR_TML_GAP_MIN && typeof lrLeg.originalFare === "number" && lrLeg.originalFare <= LR_TML_FARE_CAP) {
        discounts[lrIdx] = Math.max(discounts[lrIdx], lrLeg.originalFare);
      }
    } else if ((isLrLeg(prevLeg) && isMtrbLeg(nextLeg)) || (isMtrbLeg(prevLeg) && isLrLeg(nextLeg))) {
      const gap = _transferGapMinutes(prevLeg, nextLeg);
      if (gap !== null && gap <= LR_MTRB_GAP_MIN &&
          typeof prevLeg.originalFare === "number" && typeof nextLeg.originalFare === "number") {
        if (prevLeg.originalFare <= nextLeg.originalFare) {
          discounts[i - 1] = Math.max(discounts[i - 1], prevLeg.originalFare);
        } else {
          discounts[i] = Math.max(discounts[i], nextLeg.originalFare);
        }
      }
    } else if ((isMtrbLeg(prevLeg) && isTmlLeg(nextLeg)) || (isTmlLeg(prevLeg) && isMtrbLeg(nextLeg))) {
      // 港鐵巴士 ↔ 屯馬綫：全額豁免港鐵巴士
      const mtrbIdx = isMtrbLeg(prevLeg) ? i - 1 : i;
      const mtrbLeg = rideLegs[mtrbIdx];
      const gap = _transferGapMinutes(prevLeg, nextLeg);
      if (gap !== null && gap <= MTRB_TML_GAP_MIN && typeof mtrbLeg.originalFare === "number") {
        discounts[mtrbIdx] = Math.max(discounts[mtrbIdx], mtrbLeg.originalFare);
      }
    }
  }

  return discounts;
}

// 計算整個行程嘅車費：由各程車費相加做基礎，再扣減沿途所有符合資格嘅轉乘優惠。
// 回傳 { totalFare, discount } ；如果冇齊車費資料就回傳 { totalFare: null, discount: 0 }。
async function computeTripFare(rideLegs) {
  // 【修正二】補全港鐵車費：巴士轉乘港鐵時，港鐵 leg 嘅 fare 可能因
  // mtrFareDb 仲未載入而係 null，令整個行程車費無法計算。
  // 【修正三】補全輕鐵車費：同理，lrFareDb 可能仲未載入令 fare 係 null。
  // 呢度喺 hasFullFareInfo 檢查之前補番一次，確保只要資料最終攞到手，
  // 車費就一定能反映落結果度。
  for (const leg of rideLegs) {
    if (typeof leg.fare === "number") continue;
    if (leg.co === "mtr") {
      const fromCode = String(leg.boardStopId || "").replace(/^MTR-/i, "");
      const toCode = String(leg.alightStopId || "").replace(/^MTR-/i, "");
      try { const f = getMtrFare(fromCode, toCode); if (typeof f === "number") leg.fare = f; } catch (_e) {}
    } else if (leg.co === "lightrail") {
      const lrCodes = (leg.r && leg.r.lrStationCodes) || [];
      const stopIds = (leg.r && leg.r.stops && leg.r.stops.lightrail) || [];
      const boardIdx = stopIds.indexOf(leg.boardStopId);
      const alightIdx = stopIds.indexOf(leg.alightStopId);
      if (boardIdx !== -1 && alightIdx !== -1) {
        try {
          const f = await getLightRailFare(lrCodes[boardIdx], lrCodes[alightIdx]);
          if (typeof f === "number") leg.fare = f;
        } catch (_e) {}
      }
    }
  }

  const hasFullFareInfo = rideLegs.length > 0 && rideLegs.every(leg => typeof leg.fare === "number");
  if (!hasFullFareInfo) return { totalFare: null, discount: 0 };

  // 備份並還原原始車費，避免多次計算或排序時折扣重複遞減
  for (const leg of rideLegs) {
    if (leg.originalFare === undefined) {
      leg.originalFare = leg.fare;
    } else {
      leg.fare = leg.originalFare;
    }
    leg.hasUnquantifiedCtbDiscount = false;
  }

  // 港鐵連續車程直接計算全程車費
  {
    let i = 0;
    while (i < rideLegs.length) {
      if (rideLegs[i].co !== "mtr") { i++; continue; }
      let j = i;
      while (j + 1 < rideLegs.length && rideLegs[j + 1].co === "mtr") j++;
      if (j > i) {
        const fromCode = String(rideLegs[i].boardStopId || "").replace(/^MTR-/, "");
        const toCode = String(rideLegs[j].alightStopId || "").replace(/^MTR-/, "");
        let throughFare = null;
        try { throughFare = getMtrFare(fromCode, toCode); } catch (e) { throughFare = null; }
        if (typeof throughFare === "number") {
          rideLegs[i].originalFare = throughFare;
          rideLegs[i].fare = throughFare;
          for (let k = i + 1; k <= j; k++) {
            rideLegs[k].originalFare = 0;
            rideLegs[k].fare = 0;
          }
        }
      }
      i = j + 1;
    }
  }

  // 記錄每一程應扣減的折扣金額。注意：呢個陣列可以喺同一次遍歷入面被
  // 「前一程」（例如城巴 L1「回贈首程車費」）同「下一程」（例如 FR/L2/
  // 九巴 BBI）兩邊都寫入，所以要用 Math.max 疊加，唔可以直接覆寫，
  // 避免蓋走另一個轉乘對已經計落嘅折扣。
  const discounts = new Array(rideLegs.length).fill(0);

  // 輕鐵 ↔ 屯馬綫／港鐵巴士轉乘優惠（見 _lrInterchangeDiscounts() 頂部
  // 註解）獨立計算,同下面九巴/城巴嘅折扣一樣用 Math.max 疊加落同一個
  // discounts 陣列,避免互相蓋走。
  const lrDiscounts = _lrInterchangeDiscounts(rideLegs);
  for (let i = 0; i < discounts.length; i++) {
    discounts[i] = Math.max(discounts[i], lrDiscounts[i]);
  }

  let kmbTransferCount = 0; // 追蹤九巴連續轉車次數
  for (let i = 1; i < rideLegs.length; i++) {
    const prevLeg = rideLegs[i - 1];
    const nextLeg = rideLegs[i];

    let kmbDiscount = 0;
    if (prevLeg.co === "kmb" && nextLeg.co === "kmb") {
      kmbTransferCount++;
      kmbDiscount = _kmbBbiDiscountFor(prevLeg, nextLeg, kmbTransferCount);
    } else {
      kmbTransferCount = 0; // 如果中途轉乘了其他公司，重置計數
    }

    if (kmbDiscount > 0) {
      discounts[i] = Math.max(discounts[i], kmbDiscount);
      continue;
    }

    // 龍運「E」線 ←→ 嶼巴南大嶼山路線轉乘優惠
    const nlbDiscount = _kmbNlbTransferDiscountFor(prevLeg, nextLeg);
    if (nlbDiscount > 0) {
      discounts[i] = Math.max(discounts[i], nlbDiscount);
      continue;
    }

    if (prevLeg.co !== "ctb" && nextLeg.co !== "ctb") continue;
    // 【修正一】小巴（co === "gmb"）唔屬於城巴轉乘優惠計劃，就算另一程係
    // 城巴都唔應該當有機會有優惠——避免好似 962X→55（小巴）咁被誤判、
    // 誤套用折扣。詳細原因見 _ctbLiveDiscountFor() 頂部註解。
    if (prevLeg.co === "gmb" || nextLeg.co === "gmb") continue;

    // 【可靠性】呢個轉乘優惠查詢牽涉緊即時 API 回應解析、remark 文字
    // parsing 等好多環節，任何一環出現預期外嘅格式都可能拋錯；一旦拋
    // 出嚟冇接住，會累到成個 computeTripFare（甚至上游成程 dfs 搜尋）
    // 中斷。呢度加返 try/catch 頂住：查優惠失敗就當冇優惠（none），
    // 唔應該因為「有冇轉乘優惠」呢個次要功能拖冧核心車費／搜尋結果。
    let ctb;
    try {
      ctb = await _ctbLiveDiscountFor(prevLeg, nextLeg);
    } catch (e) {
      console.warn("[城巴轉乘優惠] 查詢/計算失敗，當冇優惠處理：", e);
      ctb = { discount: 0, totalFareOverride: null, rebateFirstLeg: 0, secondLegFree: 0 };
    }
    if (ctb.totalFareOverride !== null) {
      // TF：呢兩程合計直接用返官方公佈嘅套餐總價
      const twoLegSum = prevLeg.originalFare + nextLeg.originalFare;
      const diff = twoLegSum - ctb.totalFareOverride;
      if (diff > 0) discounts[i] = Math.max(discounts[i], diff);
    } else if (ctb.rebateFirstLeg > 0) {
      // L1：回贈首程車費 —— 扣減記落上一程（i-1），唔係呢一程
      discounts[i - 1] = Math.max(discounts[i - 1], ctb.rebateFirstLeg);
    } else if (ctb.secondLegFree > 0) {
      // L2：次程免費 —— 扣減記落呢一程（i）
      discounts[i] = Math.max(discounts[i], ctb.secondLegFree);
    } else if (ctb.discount > 0) {
      // FR：減收指定金額 —— 扣減記落呢一程（i）
      discounts[i] = Math.max(discounts[i], ctb.discount);
    }
  }

  // 將計算得到的轉乘優惠直接套用到各程的 fare 上，供畫面渲染正確的折後價錢
  let totalDiscount = 0;
  for (let i = 0; i < rideLegs.length; i++) {
    if (discounts[i] > 0) {
      const capped = Math.min(discounts[i], rideLegs[i].originalFare);
      rideLegs[i].fare = Math.max(0, Math.round((rideLegs[i].originalFare - capped) * 10) / 10);
      totalDiscount += capped;
    }
  }

  const sum = rideLegs.reduce((s, leg) => s + leg.originalFare, 0);
  const totalFare = Math.round((sum - totalDiscount) * 10) / 10;
  return { totalFare: Math.max(0, totalFare), discount: Math.round(totalDiscount * 10) / 10 };
}

// 背景載入體積較大嘅 bbi_f1 / bbi_b1（九巴 BBI 轉乘優惠明細），唔阻住主要搜尋功能。
async function loadBbiHeavyData() {
  try {
    const [f1, b1] = await Promise.all([
      fetch("https://raw.githubusercontent.com/LOOHP/HK-KMB-Calculator/data/data/bbi_f1.json").then(r => r.ok ? r.json() : null),
      fetch("https://raw.githubusercontent.com/LOOHP/HK-KMB-Calculator/data/data/bbi_b1.json").then(r => r.ok ? r.json() : null)
    ]);
    bbiF1Db = f1;
    bbiB1Db = b1;
  } catch (err) {
    console.error("背景載入九巴 BBI 轉乘優惠資料失敗:", err);
  } finally {
    bbiHeavyLoaded = true; // 就算失敗都要標記完成，避免一直嘗試阻住計算
  }
}

// 載入其餘車費 JSON（體積細，隨主要資料一齊載入）
async function loadBbiLightData() {
  try {
    // 城巴轉乘優惠已經改用 fetchCtbLiveInterchange() 即時查詢城巴官方
    const [stopIds, regionalFare, ctbRouteIds, mtrBusRoutes] = await Promise.all([
      fetch("https://raw.githubusercontent.com/LOOHP/HK-KMB-Calculator/data/data/kmb_bbi_stop_id.json").then(r => r.ok ? r.json() : null),
      fetch("https://raw.githubusercontent.com/LOOHP/HK-KMB-Calculator/data/data/regional_two_way_section_fare.json").then(r => r.ok ? r.json() : null),
      fetch("https://raw.githubusercontent.com/LOOHP/HK-KMB-Calculator/data/data/ctb_route_ids.json").then(r => r.ok ? r.json() : null),
      fetch("https://raw.githubusercontent.com/LOOHP/HK-KMB-Calculator/data/data/mtr_bus_routes.json").then(r => r.ok ? r.json() : null)
    ]);
    kmbBbiStopDb = stopIds;
    buildKmbBbiInterchangeNames(kmbBbiStopDb);
    regionalTwoWayFareDb = regionalFare;
    ctbRouteIdsDb = ctbRouteIds;
    buildCtbLiveBoundsIndex(ctbRouteIdsDb);
    mtrBusRouteFareDb = buildMtrBusFareIndex(mtrBusRoutes);
  } catch (err) {
    console.error("載入轉乘車費輔助資料失敗:", err);
  } finally {
    bbiLightLoaded = true;
  }
}

// 背景載入嶼巴（NLB）官方路線列表 API，建立 nlbId -> 服務種類標籤對照表，
// 等自選行程選單可以喺同一巴士號碼／方向出現多個分支時加返標籤分辨（見
// getNlbVariantDesc()）。
async function loadNlbRouteList() {
  try {
    const res = await fetch("https://rt.data.gov.hk/v2/transport/nlb/route.php?action=list");
    const json = res.ok ? await res.json() : null;
    const list = json && Array.isArray(json.routes) ? json.routes : [];
    const map = new Map();
    for (const rt of list) {
      if (!rt || rt.routeId === undefined || rt.routeId === null) continue;
      const nameC = String(rt.routeName_c || "");
      const arrowIdx = nameC.indexOf(">");
      const origPart = (arrowIdx !== -1 ? nameC.substring(0, arrowIdx) : nameC).trim();
      if (!origPart) continue;
      map.set(String(rt.routeId), `從 ${origPart}`);
    }
    nlbRouteTagDb = map;
  } catch (err) {
    console.error("背景載入嶼巴路線列表失敗:", err);
    nlbRouteTagDb = null;
  }
}

// 載入官方路線列表 API，快速建立「路線 + service_type」現正有效嘅組合索引
async function loadKmbRouteVariantIndex() {
  try {
    const res = await fetch("https://data.etabus.gov.hk/v1/transport/kmb/route/");
    const json = res.ok ? await res.json() : null;
    const list = json && Array.isArray(json.data) ? json.data : [];
    const map = new Map();
    for (const rec of list) {
      const routeNo = String(rec.route || "").toUpperCase().trim();
      const svcType = String(rec.service_type || "").trim();
      if (!routeNo) continue;
      if (!map.has(routeNo)) map.set(routeNo, new Set());
      if (svcType) map.get(routeNo).add(svcType);
    }
    kmbLiveServiceTypesByRoute = map;
  } catch (err) {
    console.error("背景載入九巴官方路線列表失敗:", err);
    kmbLiveServiceTypesByRoute = null;
  } finally {
    kmbRouteIndexLoaded = true;
  }
}

// 利用 ctb_route_ids.json（已喺 loadBbiLightData 載入做 ctbRouteIdsDb）建立
// 「路線 + 方向」現正存在嘅組合索引，用嚟輔助核實城巴路線方向係咪確實存在。
function buildCtbLiveBoundsIndex(ctbRouteIdsDb) {
  const map = new Map();
  if (!ctbRouteIdsDb) { ctbLiveBoundsByRoute = map; return; }
  for (const [routeNo, boundsObj] of Object.entries(ctbRouteIdsDb)) {
    const key = String(routeNo || "").toUpperCase().trim();
    if (!key || !boundsObj) continue;
    if (!map.has(key)) map.set(key, new Set());
    for (const bound of Object.keys(boundsObj)) {
      map.get(key).add(String(bound).toUpperCase());
    }
  }
  ctbLiveBoundsByRoute = map;
}

// 快速核實某條九巴路線嘅 service_type 現時是否仍然喺官方路線列表入面存在。
function isKmbServiceTypeLive(routeNo, serviceType) {
  if (!kmbRouteIndexLoaded || !kmbLiveServiceTypesByRoute) return null;
  const key = String(routeNo || "").toUpperCase().trim();
  const types = kmbLiveServiceTypesByRoute.get(key);
  if (!types) return null; // 呢條路線完全搵唔到，可能係命名/資料源差異，交返上層處理
  if (!serviceType) return true; // 冇特別註明 service_type 就唔額外收緊
  return types.has(String(serviceType).trim());
}

/* ---------------- 港鐵巴士靜態路線／站點資料 ---------------- */
const MTR_BUS_STOPS_CSV_URL = "https://seep.eu.org/https://opendata.mtr.com.hk/data/mtr_bus_stops.csv";

async function loadMtrBusStaticData() {
  try {
    const res = await fetch(MTR_BUS_STOPS_CSV_URL);
    if (!res.ok) return { stops: {}, routes: {} };
    const text = await res.text();
    const rows = parseHeadwayCsv(text); // 重用現有支援引號嘅CSV parser

    const newStops = {};
    const grouped = new Map(); // "ROUTE_ID|DIRECTION" -> [{seq, stopId}]

    for (const row of rows) {
      const routeId = row.ROUTE_ID, dir = row.DIRECTION, stationId = row.STATION_ID;
      const lat = parseFloat(row.STATION_LATITUDE), lng = parseFloat(row.STATION_LONGITUDE);
      if (!routeId || !stationId || !Number.isFinite(lat) || !Number.isFinite(lng)) continue;

      const internalStopId = "MTRB_" + stationId;
      if (!newStops[internalStopId]) {
        newStops[internalStopId] = {
          name: { zh: row.STATION_NAME_CHI || row.STATION_NAME_ENG || stationId, en: row.STATION_NAME_ENG || row.STATION_NAME_CHI || stationId },
          location: { lat, lng },
          mtrBusStationId: stationId // 用嚟同 rt.data.gov.hk 即時 API 返回嘅 busStopId 直接比對
        };
      }

      const key = routeId + "|" + dir;
      if (!grouped.has(key)) grouped.set(key, []);
      grouped.get(key).push({ seq: parseInt(row.STATION_SEQNO, 10) || 0, stopId: internalStopId });
    }

    const newRoutes = {};
    for (const [key, list] of grouped.entries()) {
      const [routeId, dir] = key.split("|");
      list.sort((a, b) => a.seq - b.seq);
      const stopIds = list.map(x => x.stopId);
      if (stopIds.length < 2) continue;
      const origStop = newStops[stopIds[0]];
      const destStop = newStops[stopIds[stopIds.length - 1]];
      const routeKey = `MTRB+${routeId}+${dir}`;
      newRoutes[routeKey] = {
        route: routeId,
        co: ["mtrb"],
        bound: { mtrb: dir },
        orig: { zh: origStop.name.zh, en: origStop.name.en },
        dest: { zh: destStop.name.zh, en: destStop.name.en },
        stops: { mtrb: stopIds },
        fares: null,
        faresHoliday: null,
        isMtrBusVerified: true
      };
    }
    return { stops: newStops, routes: newRoutes };
  } catch (err) {
    console.error("載入港鐵巴士資料失敗", err);
    return { stops: {}, routes: {} };
  }
}

/* ---------------- data load ---------------- */
async function loadRouteFareData() {
  const fareBtn = document.querySelector('.crit-btn[data-crit="fare"]');
  try {
    const fareData = await fetch("https://seep.eu.org/https://hkbus.github.io/hk-bus-crawling/routeFareList.min.json").then(r => r.ok ? r.json() : {});
    routeFareDb = fareData;

    if (routeFareDb && typeof routeFareDb === 'object' && etaDb) {
      const FARE_FIELDS_ONLY = ["fares", "faresHoliday", "serviceType", "jt", "freq"];
      for (const [routeId, routeData] of Object.entries(routeFareDb)) {
        if (!etaDb.routeList[routeId]) {
          etaDb.routeList[routeId] = routeData;
        } else {
          // 如果已有該路線，只補充車費／班次相關欄位，保留 etaDb 本身權威嘅
          // stops／bound／orig／dest，避免覆蓋出唔一致嘅站序
          const existing = etaDb.routeList[routeId];
          for (const field of FARE_FIELDS_ONLY) {
            if (routeData[field] !== undefined && routeData[field] !== null) {
              existing[field] = routeData[field];
            }
          }

          // 【用 routeFareList 嘅 stops 補漏，唔盲目覆蓋已驗證嘅站序】
          // 之前試過幾次撞到「路線明明有經過某個站，但因為淨係得某個
          // 公司變體先有記錄，或者成個 etaDb 主資料都漏埋咗嗰個站」，
          // 令搜尋誤以為要行去下一個更遠嘅站先上到車。routeFareList.min.json
          // 有一份獨立、通常更齊全嘅逐站記錄，而家攞嚟補呢個漏——但
          // 唔係盲目覆蓋成個 stops：
          //   1. 呢條路線喺 etaDb 完全冇記錄嘅公司變體，直接補上（純粹
          //      新增，冇風險）。
          //   2. 兩邊都有記錄嘅公司變體，淨係當 routeFareList 嗰份係
          //      現有站序嘅「有序超集」（即係冚晒現有全部站、順序又
          //      冇打亂，淨係中間補多咗漏低嘅分站）先會採用，避免推翻
          //      一個同 ETA API 站序對得上、但排列方式唔同嘅現有版本。
          if (routeData.stops && typeof routeData.stops === "object") {
            if (!existing.stops) existing.stops = {};
            for (const [co, fareStops] of Object.entries(routeData.stops)) {
              if (!Array.isArray(fareStops) || !fareStops.length) continue;
              const existingStops = existing.stops[co];
              if (!existingStops || !existingStops.length) {
                existing.stops[co] = fareStops;
              } else if (fareStops.length > existingStops.length && _isStopSeqSuperset(fareStops, existingStops)) {
                existing.stops[co] = fareStops;
              }
            }
          }
        }
      }
    }
  } catch (err) {
    console.error("背景載入車費資料失敗:", err);
  } finally {
    // 【由 buildRouteSiblingIndex() 改用返 buildIndices()】上面啱啱可能
    // 幫某啲路線補咗漏低嘅站／公司變體，但 stopRouteIndex 喺 init() 嗰陣
    // 已經起好咗（喺呢個 loadRouteFareData() 之前），如果淨係重建
    // buildRouteSiblingIndex()，新補入嘅站唔會反映落 stopRouteIndex，
    // 搜尋擴展仍然搵佢唔到。buildIndices() 內部本身都會再叫一次
    // buildRouteSiblingIndex()，所以呢度改用佢就夠。
    buildIndices();
    if (fareBtn) {
      fareBtn.disabled = false;
      fareBtn.title = "";
      fareBtn.textContent = "車費";
    }
  }
}

// 統一港鐵巴士公司代號
const MTR_BUS_COMPANY_ALIASES = ["mtr-bus", "lrtfeeder"];
function normalizeMtrBusCompanyCode(routeList) {
  if (!routeList) return;
  for (const r of Object.values(routeList)) {
    if (!r || !r.co) continue;
    if (Array.isArray(r.co)) {
      if (r.co.some(c => MTR_BUS_COMPANY_ALIASES.includes(c))) {
        r.co = r.co.map(c => MTR_BUS_COMPANY_ALIASES.includes(c) ? "mtrb" : c);
      }
    } else if (MTR_BUS_COMPANY_ALIASES.includes(r.co)) {
      r.co = "mtrb";
    }
    for (const alias of MTR_BUS_COMPANY_ALIASES) {
      if (r.stops && r.stops[alias] && !r.stops.mtrb) {
        r.stops.mtrb = r.stops[alias];
        delete r.stops[alias];
      }
      if (r.bound && typeof r.bound === "object" && r.bound[alias] !== undefined && r.bound.mtrb === undefined) {
        r.bound.mtrb = r.bound[alias];
        delete r.bound[alias];
      }
      if (r.serviceType && typeof r.serviceType === "object" && r.serviceType[alias] !== undefined && r.serviceType.mtrb === undefined) {
        r.serviceType.mtrb = r.serviceType[alias];
        delete r.serviceType[alias];
      }
    }
  }
}

function getCompanies(r) {
  const companies = [];
  if (!r || !r.co) return companies;
  const coList = Array.isArray(r.co) ? r.co : [r.co];
  for (const c of coList) {
    if (r.stops && r.stops[c] && r.stops[c].length) {
      companies.push(c);
    }
  }
  return companies;
}

// 【判斷一個站序係咪另一個站序嘅「有序超集」】用嚟安全咁合併
// routeFareList.min.json 嘅 stops 資料——如果 fareList 嗰個版本包含晒
// 現有版本嘅全部站、順序又冇打亂（唔需要連續，容許中間插多咗漏咗嘅
// 分站），先至當佢係「補漏版」，可以放心攞嚟代替；如果唔係超集關係
// （例如兩份資料根本對唔上、次序有出入），就寧願保留現有、已經驗證
// 過嘅站序，唔好胡亂覆蓋。
function _isStopSeqSuperset(superArr, subArr) {
  if (!Array.isArray(superArr) || !Array.isArray(subArr)) return false;
  let i = 0;
  for (const s of superArr) {
    if (i < subArr.length && s === subArr[i]) i++;
  }
  return i === subArr.length;
}

function buildIndices(){
  stopRouteIndex = new Map();
  _coLocatedRoutesCache.clear(); _stationGroupCache.clear(); _stationGroupRouteCountCache.clear(); // stopRouteIndex 重建，舊 cache 已經過期
  for (const [routeId, r] of Object.entries(etaDb.routeList)){
    const companies = getCompanies(r);
    if (!companies.length) continue;

    const primaryCo = companies[0];
    const primaryStops = r.stops[primaryCo];
    const primaryStopSet = new Set(primaryStops);
    primaryStops.forEach((stopId, idx) => {
      if (!stopId) return;
      if (!stopRouteIndex.has(stopId)) stopRouteIndex.set(stopId, []);
      stopRouteIndex.get(stopId).push({routeId, idx, companies, primaryCo});
    });

    // 【修正：補返其餘公司變體先有嘅站】部分聯營／同號多公司路線，唔同
    // 公司變體嘅站陣列唔完全一致——常見於總站/起點站淨係出現喺某個
    // 非 primaryCo 嘅公司變體入面，primaryCo 本身完全冇呢個站。之前呢
    // 度淨係用 primaryCo 起 stopRouteIndex，會令到兩個地方唔一致：
    // 「搵候選上車站」嗰步（見改善上車站搜尋段落）係跨晒 companies 全
    // 部變體去搵最近站，可以搵到一個 0 米（即起點正正就喺嗰個站）嘅
    // 候選；但去到實際 beam search 擴展（`stopRouteIndex.get(stopId)`）
    // 嗰陣，因為 primaryCo 冇呢個站，條路線根本唔會出現喺 routesHere
    // 度，結果呢個「應該最近、唔使行」嘅上車站其實用唔到，逼住搜尋
    // 揀第二個遠好多嘅站上車（例如要多行成公里）。而家將其餘公司變
    // 體入面、primaryCo 未覆蓋到嘅站都一拼補落 stopRouteIndex，等呢啲
    // 站喺實際搜尋擴展都真係用得返。
    for (const co of companies) {
      if (co === primaryCo) continue;
      const stops = r.stops[co];
      if (!stops) continue;
      stops.forEach((stopId, idx) => {
        if (!stopId || primaryStopSet.has(stopId)) return;
        if (!stopRouteIndex.has(stopId)) stopRouteIndex.set(stopId, []);
        stopRouteIndex.get(stopId).push({routeId, idx, companies, primaryCo: co});
      });
    }
  }
  buildGridIndex(etaDb.stopList);
  // 建立 serviceType 兄弟變體索引（見上面 routeSiblingIndex 頂部註解）。
  // loadRouteFareData() 有機會之後再補入額外路線（例如純粹存在於
  // routeFareList.min.json 但唔喺主 etaDb 入面嘅變體），所以嗰邊完成
  // 之後會再呼叫一次呢個 function 重建索引，確保新補入嘅路線都計得到。
  buildRouteSiblingIndex();
}

init();

/* ---------------- stop search / autocomplete ---------------- */
function searchStops(query, limit=18){
  const q = query.trim();
  if (!q || !etaDb) return [];
  const qLower = q.toLowerCase();
  const out = [];
  for (const [stopId, s] of Object.entries(etaDb.stopList)){
    const entries = stopRouteIndex.get(stopId);
    if (!entries) continue;
    const zh = s.name.zh || "";
    const en = s.name.en || "";
    if (zh.includes(q) || en.toLowerCase().includes(qLower)){
      if (!s.location) continue; // 防禦：個別站（例如座標比對失敗嘅港鐵站）可能冇座標
      const isMtr = entries.some(e => Array.isArray(e.companies) && e.companies.includes("mtr"));
      // 【修正：輕鐵 logo 而家只認真正嘅輕鐵站,唔再靠撞名】以前呢度淨係
      // 撞 lightRailDb.stopNameSet（純粹中文名一樣就算），會令好多同名
      // 但其實係普通巴士/小巴站嘅站牌都被加咗個輕鐵 logo，睇落好似「呢
      // 個巴士站係輕鐵站」，容易誤導。真正嘅輕鐧站喺 _buildLightRailRouteList()
      // 注入 etaDb.stopList 嗰陣，stopId 一定係 `LR-<code>` 呢個固定格式
      // （見 7195 行 stopIds = stationCodes.map(code => `LR-${code}`)），
      // 同任何巴士/小巴/港鐧嘅 stopId 都唔會撞——而家直接用呢個 stopId
      // 格式嚴格判斷,唔再用名稱比對咁寬鬆。
      const isLightRail = stopId.startsWith("LR-");
      out.push({stopId, zh, en, lat:s.location.lat, lng:s.location.lng, isMtr, isLightRail});
      if (out.length >= 400) break;
    }
  }
  out.sort((a,b)=>{
    const aS = a.zh.startsWith(q) ? 0 : 1;
    const bS = b.zh.startsWith(q) ? 0 : 1;
    if (aS !== bS) return aS - bS;
    return a.zh.length - b.zh.length;
  });

  // 取消將名稱相同/相似＋位置相近的站牌合併做代表性選項：
  // 站牌合併會將實際位置不同（例如市中心上車點 vs 總站）嘅站隱藏埋，
  // 令用戶無法喺 autocomplete 揀返最啱嘅實際上車站（例如 E42 喺市中心
  // 已經可以上車，但合併後只剩總站選項，變相迫用戶步行去總站）。
  // 現直接列出所有比對到嘅站牌，唔再經 isSameTransferPoint() 合併；
  // 路線搜尋（runBeamSearch/nearbyStops）本身已經會涵蓋鄰近站牌的路線，
  // 呢度只需要如實反映實際存在嘅每一個站牌畀用戶自行揀選。
  return out.slice(0, limit);
}

function wireAutocomplete(input, suggestEl, onPick){
  let debounce;
  input.addEventListener("input", () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      const results = searchStops(input.value);
      renderSuggest(suggestEl, results, onPick);
    }, 120);
  });
  input.addEventListener("focus", () => {
    if (input.value.trim()) {
      renderSuggest(suggestEl, searchStops(input.value), onPick);
    }
  });
  document.addEventListener("click", (e) => {
    if (!suggestEl.contains(e.target) && e.target !== input) suggestEl.hidden = true;
  });
}
function renderSuggest(suggestEl, results, onPick){
  suggestEl.innerHTML = "";
  if (!results.length){
    suggestEl.innerHTML = `<div class="empty">搵唔到相符嘅站</div>`;
    suggestEl.hidden = false;
    return;
  }
  for (const r of results){
    const btn = document.createElement("button");
    btn.type = "button";
    // 港鐵 logo：呢個站牌本身有港鐵路線提供服務（見 searchStops() 嘅
    // isMtr）。輕鐧 logo：見上面 searchStops() 嘅 isLightRail——已經改用
    // stopId 係唔係 `LR-` 開頭嚴格判斷（只有真正嘅輕鐧站，見
    // _buildLightRailRouteList()），唔再靠站名撞中 CSV 名單，所以唔會再
    // 對同名嘅普通巴士/小巴站錯誤加呢個 logo。兩個 logo 依家擺喺中文
    // 站名右邊（而唔係前面），避免遮住站名開頭嗰個字。
    const mtrIconHtml = r.isMtr
      ? `<img class="station-mode-icon" src="https://upload.wikimedia.org/wikipedia/en/archive/b/b9/20210510163405%21HK_MTR_logo.svg" title="港鐵">`
      : "";
    const lrIconHtml = r.isLightRail
      ? `<img class="station-mode-icon" src="https://static.wikia.nocookie.net/hk-rail/images/1/1d/LR_old.svg/revision/latest/scale-to-width-down/250?cb=20090629110056&path-prefix=zh" alt="輕鐵" title="鄰近輕鐵站">`
      : "";
    btn.innerHTML = `${escapeHtml(r.zh||r.en)}${mtrIconHtml}${lrIconHtml}<small>${escapeHtml(r.en||"")}</small>`;
    btn.addEventListener("click", () => {
      onPick({stopId:r.stopId, name:r.zh||r.en, lat:r.lat, lng:r.lng});
      suggestEl.hidden = true;
    });
    suggestEl.appendChild(btn);
  }
  suggestEl.hidden = false;
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------------- 巴士站選點地圖 (Leaflet + OpenStreetMap) ----------------
   放大地圖至約 1 公里範圍後,根據 etaDb 嘅地理資料 (nearbyStops()) 顯示
   附近巴士站,撳站牌彈出視窗可以直接設為起點/終點,令選點更加可視化。 */
let stopMap = null;
let stopMarkersLayer = null;
let originPickMarker = null;
let destPickMarker = null;
const MAP_STOP_VIEW_SPAN_M = 1000; // 地圖視窗闊度縮到幾多米內先顯示站牌
const MAP_STOP_MAX_MARKERS = 80;   // 效能上限,最多同時顯示幾多個站牌

function initStopMap(){
  if (typeof L === "undefined") return; // Leaflet CDN 未載入就靜默跳過,唔阻住主功能
  stopMap = L.map("stopMap", { zoomControl: true }).setView([22.3193, 114.1694], 12); // 預設香港中心
  // 改用 dark gray 底色地圖 (Esri World Dark Gray Canvas),深色底方便襯托
  // 起點/終點色點同站牌 marker,同時保留街道/地區名等參考資訊圖層。
  L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
    maxNativeZoom: 16,
    maxZoom: 19,
    attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors, and the GIS User Community'
  }).addTo(stopMap);
  L.tileLayer("https://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", {
    maxNativeZoom: 16,
    maxZoom: 19,
    pane: "overlayPane"
  }).addTo(stopMap);
  stopMarkersLayer = L.layerGroup().addTo(stopMap);

  stopMap.on("moveend", refreshMapStops);
  refreshMapStops();
}

// 計算現時地圖視窗嘅實際闊/高度 (米),用嚟判斷有冇拉近到約 1 公里範圍
function mapViewSpanM(map){
  const b = map.getBounds();
  const sw = b.getSouthWest(), ne = b.getNorthEast();
  const widthM = L.latLng(sw.lat, sw.lng).distanceTo(L.latLng(sw.lat, ne.lng));
  const heightM = L.latLng(sw.lat, sw.lng).distanceTo(L.latLng(ne.lat, sw.lng));
  return Math.max(widthM, heightM);
}

function refreshMapStops(){
  if (!stopMap || !stopMarkersLayer) return;
  const hintEl = $("#mapZoomHint");
  stopMarkersLayer.clearLayers();

  if (!etaDb || !etaDb.stopList){
    if (hintEl){ hintEl.textContent = "資料庫載入中,稍後即可喺地圖揀站"; hintEl.classList.remove("active"); }
    return;
  }

  const spanM = mapViewSpanM(stopMap);
  if (spanM > MAP_STOP_VIEW_SPAN_M){
    if (hintEl){ hintEl.textContent = "放大地圖至約 1 公里範圍，即顯示附近巴士站可供選擇"; hintEl.classList.remove("active"); }
    return;
  }

  const center = stopMap.getCenter();
  const radius = Math.min(spanM, MAP_STOP_VIEW_SPAN_M);
  const near = nearbyStops(center.lat, center.lng, radius)
    .sort((a, b) => a.dist - b.dist)
    .slice(0, MAP_STOP_MAX_MARKERS);

  if (hintEl){
    hintEl.textContent = near.length
      ? `顯示附近 ${near.length} 個巴士站，撳站牌可設為起點/終點`
      : "呢個範圍暫時搵唔到巴士站";
    hintEl.classList.add("active");
  }

  for (const { stopId, dist } of near){
    const s = etaDb.stopList[stopId];
    if (!s || !s.location || !Number.isFinite(s.location.lat) || !Number.isFinite(s.location.lng)) continue;
    const zhName = (s.name && (s.name.zh || s.name.en)) || "未知站點";
    const enName = (s.name && s.name.en) || "";
    const marker = L.marker([s.location.lat, s.location.lng]);

    const popupEl = document.createElement("div");
    popupEl.innerHTML = `
      <div class="map-popup-title">${escapeHtml(zhName)}</div>
      <div class="map-popup-sub">${escapeHtml(enName)} · 距離約 ${Math.round(dist)} 米</div>
      <div class="map-pick-btns">
        <button type="button" class="origin-btn">設為起點</button>
        <button type="button" class="dest-btn">設為終點</button>
      </div>
    `;
    const stopForPick = { stopId, name: zhName, lat: s.location.lat, lng: s.location.lng };
    popupEl.querySelector(".origin-btn").addEventListener("click", () => {
      origin = stopForPick;
      originInput.value = zhName;
      marker.closePopup();
      updatePickedMarkersOnMap();
    });
    popupEl.querySelector(".dest-btn").addEventListener("click", () => {
      destination = stopForPick;
      destInput.value = zhName;
      marker.closePopup();
      updatePickedMarkersOnMap();
    });
    marker.bindPopup(popupEl);
    marker.addTo(stopMarkersLayer);
  }
}

// 喺地圖上用鮮明色點標示現時揀咗嘅起點(紅)／終點(墨綠),等用戶一眼睇到
// 而家揀咗邊個站,唔理係透過地圖、自動完成搜尋抑或 GPS 定位揀嘅。
function updatePickedMarkersOnMap(){
  if (!stopMap) return;
  if (originPickMarker){ stopMap.removeLayer(originPickMarker); originPickMarker = null; }
  if (destPickMarker){ stopMap.removeLayer(destPickMarker); destPickMarker = null; }

  const mkIcon = (color) => L.divIcon({
    className: "",
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2.5px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.5);"></div>`,
    iconSize: [16, 16], iconAnchor: [8, 8]
  });

  if (origin && Number.isFinite(origin.lat) && Number.isFinite(origin.lng)){
    originPickMarker = L.marker([origin.lat, origin.lng], { icon: mkIcon("#c8102e"), zIndexOffset: 1000 })
      .bindTooltip("起點")
      .addTo(stopMap);
  }
  if (destination && Number.isFinite(destination.lat) && Number.isFinite(destination.lng)){
    destPickMarker = L.marker([destination.lat, destination.lng], { icon: mkIcon("#f6a800"), zIndexOffset: 1000 })
      .bindTooltip("終點")
      .addTo(stopMap);
  }
}

/* ---------------- Check Shape of Route ---------------- */
function analyzeCandidateShape(segs, straightLineTotalM){
  let accumulated = 0;
  const rideLegs = [];
  for (const s of segs){
    if (s.type === "ride"){
      const bLoc = etaDb.stopList[s.boardStopId];
      const aLoc = etaDb.stopList[s.alightStopId];
      if (bLoc && aLoc) accumulated += distM(bLoc.location, aLoc.location);
      rideLegs.push(s);
    } else if (s.type === "walk"){
      accumulated += s.distM || 0;
    }
  }

  let isCircuitous = false;
  if (straightLineTotalM > 300){
    const ratio = accumulated / straightLineTotalM;
    //放寬至 4.5 倍
    if (ratio > 4.5) isCircuitous = true;
  }

  let hasRedundantHop = false;

  for (let i = 0; i < rideLegs.length; i++) {
    const seg = rideLegs[i];
    const alightLoc = etaDb.stopList[seg.alightStopId]?.location;
    
    if (alightLoc) {
      const distToOrigin = distM(alightLoc, { lat: origin.lat, lng: origin.lng });
      if (distToOrigin <= 400) {
        hasRedundantHop = true;
        break;
      }
    }

    const nextSeg = segs[segs.indexOf(seg) + 1];
    if (nextSeg && nextSeg.type === "walk" && nextSeg.toStopId) {
      const walkToLoc = etaDb.stopList[nextSeg.toStopId]?.location;
      if (walkToLoc) {
        const distToOrigin = distM(walkToLoc, { lat: origin.lat, lng: origin.lng });
        if (distToOrigin <= 400) {
          hasRedundantHop = true;
          break;
        }
      }
    }
  }

  // 【修正一：聯營路線嘅站可能只出現喺另一個公司變體度】以前呢個掃描
  // 淨係睇 prevSeg.r.stops[prevSeg.primaryCo] 一個公司變體嘅站序，但同
  // 一條路線如果係聯營路線（例如城巴/新巴聯營、九巴/龍運聯營），呢程
  // 實際評估用嗰個 primaryCo（純粹搜尋過程隨機揀咗其中一間做代表）未
  // 必包含晒成條實際路線行經嘅全部站——某段可能淨係登記喺另一個公司
  // 變體嘅站序入面。結果就係好似「九龍城→紅磡→（轉車）→中環，中途
  // 115 本身已經行到去金鐘」呢類情況，因為金鐘嗰個站淨係出現喺 115 嘅
  // 另一個公司變體，用返 primaryCo 完全睇唔到，令最後一程（104）被誤
  // 判成「必要」，明明搭 115 已經可以直達，都照樣顯示多餘一程轉車。而
  // 家改用同「後便先至搭」檢測（下面）一致嘅做法：primaryCo 變體維持
  // 「淨係睇實際上車站之後 LOOKAHEAD_STOPS 個站」嘅窗口，其餘變體因為
  // 冇對得上嘅 boardIdx 基準，就掃晒成條站序。
  function _prevLegPassesNear(prevSeg, targetLoc) {
    if (!targetLoc) return false;
    const companies = Array.isArray(prevSeg.companies) && prevSeg.companies.length
      ? prevSeg.companies
      : (prevSeg.primaryCo ? [prevSeg.primaryCo] : []);
    for (const co of companies) {
      const stopsForCo = prevSeg.r.stops[co];
      if (!stopsForCo) continue;
      const isPrimary = co === prevSeg.primaryCo && Number.isFinite(prevSeg.boardIdx);
      const startK = isPrimary ? prevSeg.boardIdx + 1 : 0;
      const endK = isPrimary ? Math.min(stopsForCo.length - 1, prevSeg.boardIdx + LOOKAHEAD_STOPS) : stopsForCo.length - 1;
      for (let k = startK; k <= endK; k++) {
        const cLoc = etaDb.stopList[stopsForCo[k]]?.location;
        if (!cLoc) continue;
        if (distM(cLoc, targetLoc.location) <= MAX_TRANSFER_WALK_M) return true;
      }
    }
    return false;
  }

  if (!hasRedundantHop) {
    for (let i = 0; i < rideLegs.length && !hasRedundantHop; i++){
      const prevSeg = rideLegs[i];
      if (!prevSeg.r || !prevSeg.r.stops) continue;

      for (let j = i + 2; j < rideLegs.length && !hasRedundantHop; j++){
        const laterSeg = rideLegs[j];
        const targetLoc = etaDb.stopList[laterSeg.boardStopId];
        if (_prevLegPassesNear(prevSeg, targetLoc)) { hasRedundantHop = true; break; }
      }

      for (let j = i + 1; j < rideLegs.length && !hasRedundantHop; j++){
        const laterSeg = rideLegs[j];
        const targetLoc = etaDb.stopList[laterSeg.alightStopId];
        if (_prevLegPassesNear(prevSeg, targetLoc)) { hasRedundantHop = true; break; }
      }
    }
  }

  // 【新增偵測：後便先至搭嗰條路線，原來一開始已經上到】常見情況：
  // 喺起點搭路線 A 去到某站先轉搭路線 B，但其實路線 B 本身喺起點（或者
  // 好近起點）已經有站，根本唔使搭 A 先至轉車——一開始就等路線 B 就得。
  // 判斷方法：睇下呢程（第 2 程或之後）嘅路線，喺佢「實際上車站」之前
  // 嘅站序入面，係咪已經有一個站企埋喺原本起點好近（用返同轉車一樣嘅
  // MAX_TRANSFER_WALK_M 做門檻）——如果係，即係話呢班車一開始已經截得
  // 到，中間嗰程完全係多餘。
  // 【修正】呢條路線可能有幾個公司變體（例如同號多間公司聯營），起點
  // 附近嗰個站可能淨係出現喺另一個變體嘅站陣列度，而唔喺呢程實際用嗰
  // 個 primaryCo 度——所以呢度改為掃晒條路線嘅全部公司變體，唔止睇
  // laterSeg.primaryCo 嗰個。primaryCo 嗰個變體仲會額外限制淨係睇
  // 「實際上車站之前」嘅站（避免將順住路線去到好後面、方向可能已經唔
  // 同嘅站都當做「一開始已經上到」）；其餘變體因為冇對得上嘅 boardIdx
  // 基準，就掃晒成條站序。
  if (!hasRedundantHop && origin) {
    const originLocForRedundant = { lat: origin.lat, lng: origin.lng };
    for (let j = 1; j < rideLegs.length && !hasRedundantHop; j++) {
      const laterSeg = rideLegs[j];
      const laterCompanies = Array.isArray(laterSeg.companies) && laterSeg.companies.length
        ? laterSeg.companies
        : (laterSeg.primaryCo ? [laterSeg.primaryCo] : []);
      for (const co of laterCompanies) {
        const stopsForCo = laterSeg.r?.stops?.[co];
        if (!stopsForCo) continue;
        const scanEnd = (co === laterSeg.primaryCo && Number.isFinite(laterSeg.boardIdx))
          ? laterSeg.boardIdx
          : stopsForCo.length;
        for (let k = 0; k < scanEnd; k++) {
          const cLoc = etaDb.stopList[stopsForCo[k]]?.location;
          if (!cLoc) continue;
          if (distM(cLoc, originLocForRedundant) <= MAX_TRANSFER_WALK_M) {
            hasRedundantHop = true;
            break;
          }
        }
        if (hasRedundantHop) break;
      }
    }
  }

  return {isCircuitous, hasRedundantHop};
}

/* ---------------- Route Graph Beam Search ---------------- */
// 【改善路線多樣性】以往每個 leg-count bucket 淨係揀返 heuristic（純粹
// 距離／detour／轉車懲罰嘅靜態分數，同真實班次疏密完全無關）排名最好嗰
// minQuotaPerBucket 個候選，好容易畀「heuristic 相近嘅同一條路線」霸咗
// 晒個 quota，令另一條實際班次密好多嘅路線連入去 evaluateCandidate()
// 用實時／推算班次重新評估嘅機會都冇，最終結果死咬住某一條路線，唔理
// 佢等車等成點。
//
// 【v2：擴展到次程】以往嘅多樣性判斷淨係睇「最後一程」嘅路線編號，會
// 漏咗一種常見情況：首程唔同、但次程（轉車之後嗰一程）全部撞埋用同
// 一條路線嘅候選，一樣可以毫無限制咁樣塞滿個 bucket——如果嗰條次程
// 路線 heuristic 稍為好少少，就會將所有用其他次程路線嘅候選擠出
// quota，落到 evaluateCandidate() 先發現呢條次程路線其實班次疏、落車
// 後要等成 20 分鐘先有下一班，但已經冇其他次程路線嘅候選入圍比較。
// 用戶反映嘅「次程等待太耐，應該考慮返其他路線」正正就係呢個根因。
//
// 而家攞成程（唔止最後一程）每一程用過嘅路線編號，逐一計入多樣性判斷：
// 只要候選入面任何一程嘅路線已經用滿 perRouteCap，就當呢個候選「唔夠
// 多樣化」，推遲去 deferred，優先畀真正用緊其他路線（包括其他次程路線）
// 嘅候選入選，等佢哋都有機會入到 evaluateCandidate() 用真實班次重新
// 評估、比較邊條路線落車後等車時間較短。如果因為呢個上限令 quota 未
// 揾夠數，就放寬上限、跟返 heuristic 順序補滿，確保唔會無故減少總候選
// 數量。
function _rideRouteIdsOf(cand){
  return cand.segs.filter(s => s.type === "ride").map(s => s.routeId);
}

function _pickDiverseFromBucket(bucket, quota, perRouteCap){
  const picked = [];
  const routeUseCount = new Map();
  const deferred = [];
  for (const c of bucket){
    if (picked.length >= quota) { deferred.push(c); continue; }
    const routeIds = _rideRouteIdsOf(c);
    const maxUsed = routeIds.length
      ? Math.max(...routeIds.map(id => routeUseCount.get(id) || 0))
      : 0;
    if (maxUsed < perRouteCap){
      picked.push(c);
      for (const id of routeIds) routeUseCount.set(id, (routeUseCount.get(id) || 0) + 1);
    } else {
      deferred.push(c);
    }
  }
  // 上限太嚴令 quota 未填滿：跟返原本 heuristic 順序（deferred 已保持
  // 順序）放寬補位，唔會因為多樣性檢查反而揀少咗候選。
  let idx = 0;
  while (picked.length < quota && idx < deferred.length){
    picked.push(deferred[idx]);
    idx++;
  }
  return { picked, leftover: deferred.slice(idx) };
}

function selectDiverseCandidates(candidates, limit){
  if (candidates.length <= limit) return candidates.slice();

  const byLegs = new Map();
  for (const c of candidates){
    if (!byLegs.has(c.legs)) byLegs.set(c.legs, []);
    byLegs.get(c.legs).push(c);
  }
  for (const arr of byLegs.values()) arr.sort((a,b) => a.heuristic - b.heuristic);

  const legCounts = [...byLegs.keys()].sort((a,b) => a - b);
  const minQuotaPerBucket = Math.max(4, Math.floor(limit / Math.max(1, legCounts.length)));
  const perRouteCap = Math.max(1, Math.ceil(minQuotaPerBucket / 3));

  const result = [];
  const leftoverByLegs = new Map();
  for (const lc of legCounts){
    const bucket = byLegs.get(lc);
    const { picked, leftover } = _pickDiverseFromBucket(bucket, minQuotaPerBucket, perRouteCap);
    result.push(...picked);
    leftoverByLegs.set(lc, leftover);
  }

  if (result.length < limit){
    const rest = [];
    for (const lc of legCounts) rest.push(...leftoverByLegs.get(lc));
    rest.sort((a,b) => a.legs - b.legs || a.heuristic - b.heuristic);
    result.push(...rest.slice(0, limit - result.length));
  }

  result.sort((a,b) => a.legs - b.legs || a.heuristic - b.heuristic);
  return result.slice(0, limit);
}

// 【Beam search 樞紐站救援用嘅判斷】用返統一嘅 isInterchangeHub()
// （官方轉車站／大型轉車站關鍵字／資料驅動嘅「路線好多」判斷），加
// 埋港鐵站本身天然係樞紐呢一項，畀落面 beam cut 之後嘅救援機制用（見
// runBeamSearch() 入面 HUB_RESCUE_MAX 一段）。成本低，可以隨便喺搜尋
// 主迴圈入面逐個候選調用。
function _isHubRescueStop(stopId) {
  if (!etaDb.stopList[stopId]) return false;
  if (isInterchangeHub(stopId)) return true;
  // 港鐵站本身就係天然嘅樞紐（可以轉去任何一條港鐵線／再轉出去接駁巴士），
  // 淨係要睇呢個站有冇 mtr 公司嘅路線經過。
  const entries = stopRouteIndex.get(stopId);
  if (entries && entries.some(rt => rt.companies && rt.companies.includes("mtr"))) return true;
  return false;
}

// 呢個 function 本身唔會直接打行人路網 API（真實步行距離計算留返去
// evaluateCandidate() 等後續階段先做）
async function runBeamSearch(origin, destination, blacklist = new Set(), atTime = new Date()) {
  // walkPenaltyMultiplier 已經整合去全域嘅 WALK_PENALTY_MULTIPLIER／
  // WALK_PENALTY_MULTIPLIER_RELAXED（見頂部 Route Scoring System 一段），
  // 呢度唔再重複宣告。
  const isLantauTrip = computeIsLantauTrip(origin, destination);
  // 起點同終點本身係唔係都同香港島冇關（唔喺島上，名稱又冇撞中港島地區關鍵字）。
  // 如果係，代表呢趟行程根本冇任何一端需要去香港島，途中如果兜咗去香港島
  // （例如新界去離島，中途經中環轉車），就純粹係搜尋邏輯揀錯方向嘅無謂detour，
  // 下面 hkIslandDetourPenalty 會靠呢個 flag 嚴懲呢種情況，唔會好似
  // crossHarbourPenalty 咁因為落車站係「官方轉車站」就豁免。
  const tripTouchesHKIsland =
      HK_ISLAND_KEYWORDS.test(origin.name || "") || isHKIslandCoord(origin.lat, origin.lng) ||
      HK_ISLAND_KEYWORDS.test(destination.name || "") || isHKIslandCoord(destination.lat, destination.lng);
  const straightLineTotalM = distM({lat:origin.lat,lng:origin.lng},{lat:destination.lat,lng:destination.lng});
  // 【長途行程專用闊 beam】BEAM_WIDTH=400 呢個上限係跨全部候選狀態用同一個
  // 「距終點仲有幾遠」嘅 heuristic 一齊排、一齊斬——對於好多本地、短途嘅
  // O-D 嚟講冇問題，但對於好似馬鞍山去嶺南大學／調景嶺／石澳呢種真正需要
  // 2-3 次轉車嘅跨大區行程，第一程（甚至第二程）落車之後往往仲離終點好遠
  // （呢個係去程必經嘅過程，唔係行錯路），喺 heuristic 排序上天然會輸畀好多
  // 「睇落好似幾近咗少少、但其實去唔到／唔係啱路線」嘅本地短途候選，喺
  // 400 個名額入面被擠走，令搜尋去到後續 round 之前就已經冇咗呢條正確
  // 路徑嘅苗頭。呢度按直線距離判斷係唔係「跨大區長途」，係就用兩倍
  // BEAM_WIDTH，等呢類必要嘅多程候選有更大機會捱到落去後續 round。
  const LONG_HAUL_STRAIGHT_LINE_M = 12000;
  // 【新增：市區中長途／跨海行程門檻】以前 LONG_HAUL 門檻定得太高
  // （12公里），令好多好似大角咀↔香港仔呢類直線距離喺 6-12 公里之間、
  // 但實際需要過海／跨區轉車（例如經隧道巴士或港鐧轉一次）嘅市區行程，
  // 完全攞唔到任何 beam width／detour 容忍度嘅放寬，同真正嘅本地短途
  // 行程一樣淨係得基本 400 個名額、scale=1——但呢類行程明明已經需要
  // 「暫時偏離直線方向」先接得上轉車走廊，跟本地短途行程嘅搜尋難度完
  // 全唔同，結果好易完全搵唔到任何候選（beam search 一開始已經冚咗）。
  // 而家加多一級：直線距離超過 6 公里就當「中長途」，開始漸進放寬。
  const MID_HAUL_STRAIGHT_LINE_M = 6000;
  // 【新增第三級：極長途跨區行程】屯門↔小西灣、天水圍↔石澳呢類幾乎
  // 打斜貫穿成個香港嘅行程，直線距離通常喺 20 公里以上，往往需要 2-3
  // 次轉車先接得上（例如新界西→市區→港島東），中途每一個交匯點都可能
  // 有唔止一種合理組合（例如荃灣轉一次 vs 美孚轉一次，都去得到）。
  // 2.5 倍闊 beam 對於呢類要捱到第 3、4 程先分出勝負嘅行程，好多時仍
  // 然唔夠闊——後段真正行得通嘅組合，可能喺仲未行到嗰度之前，已經因
  // 為前幾程 heuristic 稍為輸畀啲「睇落較近、但其實去唔到／去錯方向」
  // 嘅候選而被擠走。呢度加多一級，直線距離再遠啲就用返更闊嘅 4 倍
  // BEAM_WIDTH，等呢類極長途、多程先分勝負嘅行程有更大機會保留多過
  // 一種可行組合捱到落去後續 round。
  const VERY_LONG_HAUL_STRAIGHT_LINE_M = 20000;
  const isVeryLongHaulTrip = straightLineTotalM > VERY_LONG_HAUL_STRAIGHT_LINE_M;
  const effectiveBeamWidth = isVeryLongHaulTrip
      ? BEAM_WIDTH * 4
      : (straightLineTotalM > LONG_HAUL_STRAIGHT_LINE_M) ? BEAM_WIDTH * 2.5
      : (straightLineTotalM > MID_HAUL_STRAIGHT_LINE_M) ? BEAM_WIDTH * 1.5
      : BEAM_WIDTH;
  // 【通用、唔靠地方名嘅遠途剪枝容忍度】以前靠 REMOTE_PENINSULA_KEYWORDS
  // 人手歸納「呢類半島/偏遠地方通常要兜路」，而家改用直線距離本身做
  // 連續縮放——距離越遠，路線本身越有可能需要「暫時偏離直線方向」先
  // 接得上必經嘅轉車走廊（例如新界東去港島東南、新界東去大嶼山西，
  // 途中必經市區/機場走廊，中途嗰幾程 dGoal 未必單調收窄），對邊個
  // 地方都一致生效，唔理個名叫咩。
  // 【放寬起始點】以前呢個放寬淨係喺 LONG_HAUL 門檻（12公里）先開始，
  // 12公里以下一律維持 scale=1，令上面提到嘅市區中長途／跨海行程（例如
  // 大角咀↔香港仔，直線約 8 公里）完全攞唔到任何容忍度。而家改為由
  // MID_HAUL 門檻（6公里）就開始線性放寬，一路連續遞增到原有嘅 2.2 倍
  // 封頂（依然對應約 26.4 公里或以上），6公里以下嘅真正本地短途行程
  // 完全唔受影響，維持原有剪枝力度。
  const DETOUR_TOLERANCE_RAMP_END_M = MID_HAUL_STRAIGHT_LINE_M * 4.4; // 26.4km，維持原有封頂距離
  const detourToleranceScale = straightLineTotalM <= MID_HAUL_STRAIGHT_LINE_M
      ? 1
      : Math.min(2.2, 1 + (straightLineTotalM - MID_HAUL_STRAIGHT_LINE_M) / (DETOUR_TOLERANCE_RAMP_END_M - MID_HAUL_STRAIGHT_LINE_M) * 1.2);
  // 【精簡】唔再按直線距離分長途／極長途，統一用固定嘅步行半徑
  // （ENDPOINT_WALK_RADIUS_M＝650米／MAX_TRANSFER_WALK_M）同懲罰係數。
  const adaptiveTransferWalkM = MAX_TRANSFER_WALK_M;
  const adaptiveEndpointWalkM = ENDPOINT_WALK_RADIUS_M;
  const detourScale = 0.6;
  const backtrackScale = 1.0;
  const transferScale = 1.0;

  let legsAllowed = MAX_LEGS;

  const directExists = hasDirectService(origin, destination, atTime);

  // 【搜尋失敗診斷】呢個物件全程收集緊呢次搜尋嘅內部數據，唔理
  // DEBUG_MODE 開唔開都會收集（成本好低，淨係推少少數字入陣列），
  // 但淨係喺 DEBUG_MODE 開咗嘅時候先會拎出嚟畀用戶睇。
  const searchDebugInfo = {
    originName: origin.name || (origin.stopId ? origin.stopId : "(GPS)"),
    destName: destination.name || (destination.stopId ? destination.stopId : "(GPS)"),
    straightLineTotalM: Math.round(straightLineTotalM),
    effectiveBeamWidth,
    isLantauTrip,
    isVeryLongHaulTrip,
    directExists,
    discoveryRadiusM: null,
    nearbyRouteCount: 0,
    boardCandidates: [], // 逐條路線最近嘅上車站（直線 + 真實步行距離）
    rounds: [],          // 逐個 round 嘅搜尋進度
    finalCandidateCount: 0
  };

  let originAlts = [];
  let origStopId = origin.stopId;

  if (!origStopId) {
    // 支援 GPS 起點：尋找 150 米內最接近的車站
    let closestId = null;
    let minD = Infinity;
    for (const [stopId, s] of Object.entries(etaDb.stopList)) {
      const d = distM({lat: origin.lat, lng: origin.lng}, s.location);
      if (d < minD) {
        minD = d;
        closestId = stopId;
      }
    }
    if (minD <= 150) {
      origStopId = closestId;
    }
  }

  // 同一站群嘅所有站牌 —— 步行距離視為 0
  // 【改用 getStationGroupIds() cache，唔再逐個站牌掃成個 etaDb.stopList】
  // 以前呢度每次搜尋都要 for...of Object.entries(etaDb.stopList) 成個
  // stopList 行一次先搵到起點嘅站群成員，係一個逐站牌比對嘅 O(全部站數)
  // 線性掃描；而家改用 getStationGroupIds()（一次過用 MERGE_RADIUS_M +
  // isSameTransferPoint() 搵晒成個站群、並且結果有 cache），除咗快好多
  // 之外，仲令「呢個站群有邊幾個成員」呢件事全個檔案（起點搜尋、beam
  // search 途中嘅 getRoutesAtStopWithColocated 等）用返同一份、一致嘅
  // 定義，唔會出現兩個地方對「同一站群」計出唔同答案。
  const groupStopsMap = new Map();
  if (origStopId && etaDb.stopList[origStopId]) {
    for (const gid of getStationGroupIds(origStopId)) {
      groupStopsMap.set(gid, { stopId: gid, dist: 0 });
    }
  }

  // 有冇搵到直達站，等步行轉乘方案都有平等機會入圍
  const nearbyAltsList = origin.stopId
    ? [{stopId: origin.stopId, dist: 0}].concat(nearbyStops(origin.lat, origin.lng, adaptiveEndpointWalkM).filter(s => s.stopId !== origin.stopId))
    : nearbyStops(origin.lat, origin.lng, adaptiveEndpointWalkM);

  // (1) 同 (2) 取聯集，同一個 stopId 出現喺兩邊就揀較細嘅步行距離
  const originAltsMap = new Map(groupStopsMap);
  for (const alt of nearbyAltsList) {
    const existing = originAltsMap.get(alt.stopId);
    if (!existing || alt.dist < existing.dist) originAltsMap.set(alt.stopId, alt);
  }
  originAlts = Array.from(originAltsMap.values());

  // 改善上車站搜尋
  // 【統一半徑邏輯】發現半徑同接受半徑一律用同一個 ENDPOINT_WALK_RADIUS_M
  // （650 米），唔再用「發現用兩倍闊半徑、接受用窄啲嘅半徑」咁分開處理。
  // 呢個統一嘅半徑就係用戶願意由起點行去搭車嘅上限；搵到附近有路線
  // 經過就用返範圍入面最近嗰個站，唔應該搵到之後又要行出範圍之外。
  {
    const routeDiscoveryRadiusM = adaptiveEndpointWalkM;
    const discoveryStops = nearbyStops(origin.lat, origin.lng, routeDiscoveryRadiusM);

    // 【修正「輸入同一個總站嘅唔同站牌，結果完全唔一樣」】以前呢度淨係
    // 用起點原始座標做半徑搜索，完全冇理會上面 groupStopsMap 已經靠
    // 站名＋距離識別到嘅「同一個站群」。如果一個總站入面某個站牌（例如
    // 巴士總站嗰邊嘅上車位）啱啱好企出咗 routeDiscoveryRadiusM 之外，
    // 但佗其實同起點係同一個站群（isSameTransferPoint 已經確認），呢條
    // 路線就會完全冇被搵到，落面成個「揾最近上車站」機制都無從得知佗
    // 存在——結果就係輸入同一個總站嘅唔同站牌，因為邊個站牌啱啱好喺
    // 半徑之內，搜出嚟嘅方案可以完全唔一樣（本應搭到嘅短途直達車，變
    // 成要行遠好多、轉車先到）。而家將 groupStopsMap 嘅成員都當成 0 米
    // 補落 discoveryStops，等同一個站群入面任何一個站牌有嘅路線，都一
    // 定會被搵到，唔會因為半徑差幾米就整條漏走。
    for (const g of groupStopsMap.values()) {
      if (!discoveryStops.some(ds => ds.stopId === g.stopId)) {
        discoveryStops.push({ stopId: g.stopId, dist: 0 });
      }
    }

    // 【搵路線改為「成個站群」為單位，唔再逐個站牌獨立搵】以前呢度淨係
    // 用 stopRouteIndex.get(ds.stopId) 攞返「呢個站牌自己」直接屬於嘅
    // 路線——如果某條路線嘅站牌記錄剛好落喺同一站群入面另一個 stopId
    // （例如巴士總站分咗上落客位、又或者唔同公司各自獨立嘅 stopId），
    // 但 discoveryStops 入面掃到嘅係呢個站群嘅另一個站牌，就會完全睇
    // 唔到呢條路線嘅存在。而家改用 getRoutesAtStopWithColocated()——
    // 佢會自動用 getStationGroupIds() 將成個站群（轉乘點）嘅路線合埋
    // 一齊先至回傳，等發現路線嗰步真正做到「以站群為單位」，唔會因為
    // 途經路線記錄落喺群入面邊一個具體站牌而漏走。
    const candidateRouteKeys = new Set(); // "routeId"（唔再綁死單一 co）
    for (const ds of discoveryStops) {
      const routesHereForDiscovery = getRoutesAtStopWithColocated(ds.stopId);
      for (const rt of routesHereForDiscovery) {
        candidateRouteKeys.add(rt.routeId);
      }
    }

    // 【方向（bearing）救援機制】如果正常發現半徑（routeDiscoveryRadiusM）
    // 之內完全搵唔到任何路線經過（例如起點所在條街本身冇巴士站直達，
    // 要行遠少少先接得上車），以前就會直接判呢個起點「附近搵唔到任何
    // 路線」，成個搜尋提早收工。而家唔即刻放棄，改用 bearing 判斷：
    // 攞返「起點望向目的地」嘅方位角做基準，喺一個放大咗嘅半徑之內
    // 重新搵過附近站，但呢次唔係逢路線都要，淨係揀返「呢條車由候選
    // 上車站出發、沿住自己站序去多幾個站之後」嘅方位角，同基準夾角
    // 喺 90 度之內（即係大致朝住目的地方向，唔係背道而馳）嘅路線，
    // 先當佢係值得一試嘅候選——等呢批路線都有機會入到落面嘅 beam
    // search，由 beam search 自己逐步判斷沿途有冇合適嘅站可以轉車去
    // 終點，而唔係一開始就因為「起點行得去嘅範圍內冇直達路線」而完全
    // 放棄搜尋。
    const bearingRescuedRouteIds = new Set();
    let bearingRescueRadiusM = routeDiscoveryRadiusM;
    if (candidateRouteKeys.size === 0) {
      const goalBearing = bearingDeg(
        { lat: origin.lat, lng: origin.lng },
        { lat: destination.lat, lng: destination.lng }
      );
      bearingRescueRadiusM = routeDiscoveryRadiusM * 2;
      const BEARING_RESCUE_MAX_DIFF = 90;
      const BEARING_AHEAD_STOPS = 6; // 用返上車站之後第幾個站嚟判斷「呢條車實際去緊邊」
      const rescueStops = nearbyStops(origin.lat, origin.lng, bearingRescueRadiusM);
      for (const rs of rescueStops) {
        const routesHere = getRoutesAtStopWithColocated(rs.stopId);
        for (const rt of routesHere) {
          if (candidateRouteKeys.has(rt.routeId) || bearingRescuedRouteIds.has(rt.routeId)) continue;
          const rr = etaDb.routeList[rt.routeId];
          if (!rr) continue;
          const routeCompanies = getCompanies(rr);
          let aligned = false;
          for (const co of routeCompanies) {
            const stopsArrForRoute = rr.stops[co];
            if (!stopsArrForRoute) continue;
            const boardIdx = stopsArrForRoute.indexOf(rs.stopId);
            if (boardIdx < 0) continue;
            const aheadIdx = Math.min(stopsArrForRoute.length - 1, boardIdx + BEARING_AHEAD_STOPS);
            if (aheadIdx <= boardIdx) continue;
            const boardLoc = etaDb.stopList[rs.stopId]?.location;
            const aheadLoc = etaDb.stopList[stopsArrForRoute[aheadIdx]]?.location;
            const rideBearing = bearingDeg(boardLoc, aheadLoc);
            const diff = bearingDiffDeg(rideBearing, goalBearing);
            if (diff !== null && diff <= BEARING_RESCUE_MAX_DIFF) { aligned = true; break; }
          }
          if (aligned) {
            candidateRouteKeys.add(rt.routeId);
            bearingRescuedRouteIds.add(rt.routeId);
            if (!discoveryStops.some(ds => ds.stopId === rs.stopId)) {
              discoveryStops.push({ stopId: rs.stopId, dist: rs.dist });
            }
          }
        }
      }
      if (DEBUG_MODE) {
        console.log(
          `[方向救援] 起點=${origin.name || ""}｜正常半徑（${Math.round(routeDiscoveryRadiusM)}米）內搵唔到任何路線，` +
          `改用方位角喺 ${Math.round(bearingRescueRadiusM)} 米內搵到 ${bearingRescuedRouteIds.size} 條方向大致啱（同終點方位角相差 ≤${BEARING_RESCUE_MAX_DIFF}°）嘅路線。`
        );
      }
    }

    const bestPerOrigin = new Map(); // stopId -> {stopId, dist}
    for (const o of originAlts) {
      const existing = bestPerOrigin.get(o.stopId);
      if (!existing || o.dist < existing.dist) bestPerOrigin.set(o.stopId, o);
    }

    // 網址加 ?debug=1，可以喺 console 睇返實際發現咗邊啲路線。
    const debugRows = [];

    // 【第一輪：搜尋階段，繼續用 distM() 直線距離】沿住每條候選路線嘅
    // 成條站序，搵返直線距離最近嘅頭 3 個候選上車站。呢一步純粹用嚟
    // 快速篩選，唔應該喺呢度就直接落實佢做「真正最近」——直線距離
    // 完全冇考慮實際路網（例如中間隔咗條河、要過天橋兜大圈），所以
    // 落面會揀返呢批候選入面嘅少數幾個，再用真實步行路線重新排位。
    const routeTopCandidates = new Map(); // routeId -> {rr, topCandidates:[{stopId,dist}]}
    for (const routeId of candidateRouteKeys) {
      const rr = etaDb.routeList[routeId];
      if (!rr) continue;
      const routeCompanies = getCompanies(rr);
      if (!routeCompanies.length) continue;

      // 沿路線成條站序搵返直線距離最近嗰幾個站
      const topCandidates = []; // [{stopId, dist}]，由近到遠，最多 3 個
      const TOP_K = 3;
      for (const co of routeCompanies) {
        const stopsArrForRoute = rr.stops[co];
        if (!stopsArrForRoute) continue;
        for (const candId of stopsArrForRoute) {
          const cs = etaDb.stopList[candId];
          if (!cs || !cs.location) continue;
          const d = distM({lat: origin.lat, lng: origin.lng}, cs.location);
          if (topCandidates.length < TOP_K) {
            topCandidates.push({ stopId: candId, dist: d });
            topCandidates.sort((a, b) => a.dist - b.dist);
          } else if (d < topCandidates[TOP_K - 1].dist) {
            // 同一個 stopId（唔同公司變體撞到同一個實際站）唔重複佔位
            if (!topCandidates.some(c => c.stopId === candId)) {
              topCandidates[TOP_K - 1] = { stopId: candId, dist: d };
              topCandidates.sort((a, b) => a.dist - b.dist);
            }
          }
        }
      }
      if (topCandidates.length) {
        routeTopCandidates.set(routeId, { rr, topCandidates });
      }
    }

    // 【第二輪：用真實步行距離重新判斷邊個先係真正近嘅上車站】收集晒
    // 全部候選路線嘅頭 3 個候選站，去重之後先至逐個叫一次
    // getRealWalkingDataCached()——好多路線喺同一帶會撞正同一批候選
    // 站，去重可以大幅減少實際發出嘅行人路網 API 請求數量；而且 walkCache
    // 本身都有記憶化，就算冧咗去重都唔會重複打 API。
    const uniqueCandLocs = new Map(); // stopId -> location
    for (const { topCandidates } of routeTopCandidates.values()) {
      for (const cand of topCandidates) {
        if (!uniqueCandLocs.has(cand.stopId)) {
          const loc = etaDb.stopList[cand.stopId]?.location;
          if (loc) uniqueCandLocs.set(cand.stopId, loc);
        }
      }
    }
    const originLoc = { lat: origin.lat, lng: origin.lng };
    const realDistByStop = new Map(); // stopId -> 真實步行距離（米），攞唔到就冇呢個 key
    await Promise.all(Array.from(uniqueCandLocs.entries()).map(async ([stopId, loc]) => {
      const cacheKey = `boardcand_${origin.lat.toFixed(5)},${origin.lng.toFixed(5)}_${stopId}`;
      const realWalk = await getRealWalkingDataCached(cacheKey, originLoc, loc);
      if (realWalk && realWalk.success && Number.isFinite(realWalk.distM)) {
        realDistByStop.set(stopId, realWalk.distM);
      }
    }));

    // 【修正：已經存在嘅候選站要用返真實距離校正，唔可以畀 accept-radius
    // 卡住】`bestPerOrigin` 入面好多站係之前用「附近隨便搵站」（直線距
    // 離、見上面 originAlts 初始化）已經預先擺低嘅，本身唔受下面嗰個
    // 「每條路線嘅接受半徑」把關限制。落面嗰個 accept-radius 迴圈淨係
    // 負責「應唔應該新增一個站做候選」，如果一個站本身已經存在
    // （pre-seed 嗰陣用緊直線距離），但佢真實步行距離超出咗接受半徑，
    // 個迴圈會直接 skip 唔更新——結果呢個站嘅距離就會一直停留喺個舊
    // 直線估算（例如 148 米），永遠冇機會校正做真實嘅 734／367 米，
    // 令 heuristic 一直用緊錯嘅（偏細嘅）數字去計分。而家喺呢度加一步：
    // 唔理接受半徑點話，凡係已經有真實步行距離嘅站，如果佢本身已經喺
    // bestPerOrigin 度，就直接校正做真實距離——呢個純粹係「修正一個已
    // 經存在嘅候選嘅距離數字」，唔係「新增候選」，所以唔應該受接受半徑
    // 呢個入場門檻限制。
    for (const [stopId, realDist] of realDistByStop.entries()) {
      const existing = bestPerOrigin.get(stopId);
      if (existing) existing.dist = realDist;
    }

    for (const [routeId, { rr, topCandidates }] of routeTopCandidates.entries()) {
      // 攞得到真實步行距離就用真實嘅，攞唔到（例如行人路網 API 請求失敗）就
      // 保底跌返用直線距離，唔會令成條路線因為單一次網絡失敗就消失。
      const rankedCandidates = topCandidates
        .map(c => ({ stopId: c.stopId, straightDist: c.dist, dist: realDistByStop.has(c.stopId) ? realDistByStop.get(c.stopId) : c.dist }))
        .sort((a, b) => a.dist - b.dist);

      const bestStopId = rankedCandidates[0]?.stopId || null;
      const bestDist = rankedCandidates[0]?.dist ?? Infinity;

      if (DEBUG_MODE) {
        const bestName = bestStopId ? (etaDb.stopList[bestStopId]?.name?.zh || etaDb.stopList[bestStopId]?.name?.en || bestStopId) : "(冇搵到有效站)";
        debugRows.push({
          route: rr.route || routeId,
          routeId,
          bestStopId, bestName,
          bestDistM: Math.round(bestDist),
          straightDistM: Math.round(rankedCandidates[0]?.straightDist ?? Infinity),
          usedRealWalk: realDistByStop.has(bestStopId)
        });
      }

      // 【接受半徑同發現半徑統一】兩者一律用返同一個 routeDiscoveryRadiusM
      // （即 ENDPOINT_WALK_RADIUS_M＝650 米），唔再用任何倍數放大或收窄。
      // 一個站喺發現階段搵得到，代表佢喺 650 米之內，接受把關就理應直接
      // 放行，唔會再出現「發現半徑放行、接受半徑又剔走」嘅自相矛盾；亦
      // 唔會再有 1.1／1.3／2 倍呢類令用戶行超出 650 米先上到車嘅情況。
      // 【方向救援例外】如果呢條路線係上面 bearing 救援機制先搵到嘅
      // （即正常半徑內原本冇任何路線），就要用返嗰個放大咗嘅
      // bearingRescueRadiusM 嚟接受佢嘅上車站，唔可以又用返窄嗰個
      // routeDiscoveryRadiusM——如果咁做，個路線啱啱先喺救援步驟入面用
      // 闊半徑搵到，落到呢度又即刻因為窄半徑而俾剔走，等於白搵。
      const acceptRadiusM = bearingRescuedRouteIds.has(routeId) ? bearingRescueRadiusM : routeDiscoveryRadiusM;
      // 頭三近嘅候選站（跨埋所有公司變體、已經用真實步行距離排過位）
      // 逐個攞去把關，過到就放入 bestPerOrigin，等佢哋都有機會入到
      // beam search，落到 evaluateCandidate() 嗰陣再用真實行人路網步行
      // 距離重新評估一次（嗰邊仲會有 3 倍/1.3 倍嘅嚴格淘汰檢查）。
      for (const cand of rankedCandidates) {
        if (cand.dist > acceptRadiusM) continue;
        const existing = bestPerOrigin.get(cand.stopId);
        if (!existing || cand.dist < existing.dist) {
          bestPerOrigin.set(cand.stopId, { stopId: cand.stopId, dist: cand.dist });
        }
      }
    }

    searchDebugInfo.discoveryRadiusM = Math.round(routeDiscoveryRadiusM);
    searchDebugInfo.nearbyRouteCount = candidateRouteKeys.size;
    searchDebugInfo.boardCandidates = debugRows.slice();

    if (DEBUG_MODE) {
      debugRows.sort((a,b) => a.bestDistM - b.bestDistM);
      console.log(
        `[上車站偵錯] 起點=${origin.name || ""}｜發現半徑=${Math.round(routeDiscoveryRadiusM)}米｜` +
        `喺附近搵到 ${discoveryStops.length} 個鄰近站，涉及 ${candidateRouteKeys.size} 條路線變體。` +
        `逐條路線嘅最近上車站（由近到遠，已用真實步行距離重新排位）：`
      );
      console.table(debugRows);
    }

    originAlts = Array.from(bestPerOrigin.values());
  }

  let frontier = [];
  // 【改善 walkPenaltyMultiplier：唔應該對所有候選上車站一律用同一個
  // 懲罰倍數】以前唔理三七廿一，成條 originAlts 入面所有候選都用返
  // WALK_PENALTY_MULTIPLIER(1.8) 懲罰佢嘅步行距離。但如果起點本身（即
  // dist===0 嗰個站）根本冇服務到某個候選站先有嘅路線，行去嗰個候選站
  // 其實係唯一方法先搭到嗰條路線，唔應該懲罰到好似「明明有得揀、卻要
  // 行」咁重。而家先計起點本身（0 米）覆蓋到邊啲路線，落面逐個候選
  // 站再睇：如果佢自己嗰啲路線,起點本身都已經有(即係行呢步係無謂嘅)，
  // 就維持 WALK_PENALTY_MULTIPLIER；如果起點完全冇任何一條佢嘅路線
  // (行呢步係必要嘅)，就放寬用 WALK_PENALTY_MULTIPLIER_RELAXED。
  const ownStopRouteIds = new Set();
  for (const o2 of originAlts) {
    if ((o2.dist || 0) === 0) {
      for (const rt of getRoutesAtStopWithColocated(o2.stopId)) ownStopRouteIds.add(rt.routeId);
    }
  }

  for (const oc of originAlts){
    // 【修正：起點候選過濾要同落面 beam search 擴展步驟（getRoutesAtStopWithColocated）
    // 用返同一套「站群」判斷】以前呢度淨係用 stopRouteIndex.has(oc.stopId)——即係
    // 「呢個 stopId 自己」有冇直接 index 到任何路線——嚟決定呢個候選起點值唔值得擺
    // 入 frontier。但如果起點本身（0 米，即 origin.stopId）同附近某條路線嘅記錄剛好
    // 落喺同一站群入面另一個 stopId（例如巴士總站分咗幾個上落客位、或者第二間公司
    // 獨立登記嘅 stopId），stopRouteIndex.has(origin.stopId) 就會答「冇」，令呢個
