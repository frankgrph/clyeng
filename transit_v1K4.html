<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>行程搜尋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght=400;500;700;900&family=JetBrains+Mono:wght=400;500;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://data.etabus.gov.hk">
<link rel="preconnect" href="https://rt.data.gov.hk">
<link rel="preconnect" href="https://seep.eu.org">
<link rel="dns-prefetch" href="https://opendata.mtr.com.hk">
<link rel="dns-prefetch" href="https://raw.githubusercontent.com">
<link rel="dns-prefetch" href="https://timeinterval.hkbuseta.com">
<!-- Leaflet 地圖 (用嚟喺放大至約1公里範圍後，可視化選擇附近巴士站做起點/終點) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<style>
  :root{
    --ink:#14181c;
    --paper:#f3f1ea;
    --card:#ffffff;
    --line:#dcd7c9;
    --kmb:#c8102e;
    --ctb:#f6a800;
    --nlb:#0f6b3f;
    --gmb:#1b6e6e;
    --mtr:#a3004c;
    --mtrb: #a51c30;
    --lr:#6b8e23;
    --accent:#c8102e;
    --accent-ink:#ffffff;
    --muted:#6b6458;
    --walk:#8a8377;
    --good:#0f6b3f;
    --radius:14px;
  }

@font-face {
  font-family: 'Johnston100-Medium';
  src: url("https://seep.eu.org/https://mrdarrengriffin.com/Johnston100-Medium.woff2") format("woff2"), url("https://seep.eu.org/https://mrdarrengriffin.com/Johnston100-Medium.woff") format("woff");
  font-display: swap; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Johnston100-Medium',"Noto Sans HK",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:60px;
  }
  .mono{font-family:"JetBrains Mono",monospace;}
  header.top{
    background:var(--ink);
    color:#f4f1e8;
    padding:22px 20px 26px;
    position:relative;
    overflow:hidden;
  }
  header.top::after{
    content:"";
    position:absolute; right:-40px; top:-40px; width:180px;height:180px;
    background:radial-gradient(circle, rgba(200,16,46,.55), transparent 70%);
    pointer-events:none;
  }
  header.top h1{
    margin:0 0 4px;
    font-size:22px;
    letter-spacing:.5px;
    font-weight:900;
  }
  header.top p{
    margin:0;
    font-size:12.5px;
    color:#b9b2a1;
  }
  .badge-strip{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .co-chip{font-size:10.5px; padding:3px 8px; font-weight:700; letter-spacing:.4px;}
  .co-chip.kmb{background:var(--kmb);color:#fff;}
  .co-chip.ctb{background:var(--ctb);color:#fff;}
  .co-chip.nlb{background:var(--nlb);color:#fff;}
  .co-chip.gmb{background:var(--gmb);color:#fff;}
  .co-chip.mtr{background:var(--mtr);color:#fff;}
  .co-chip.mtrb {background:var(--mtrb);color:#fff;}
  .co-chip.lightrail{background:var(--lr);color:#fff;}

  main{max-width:640px;margin:0 auto;padding:16px;}

  .panel{
    background:var(--card);
    padding:16px;
    margin-bottom:14px;
  }
  .field{position:relative;margin-bottom:10px;}
  .field label{
    display:block; font-size:11px; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.6px; margin-bottom:4px;
  }
  .field input{
    width:100%; padding:11px 12px; font-size:15px;
    border:1.5px solid var(--line);
    background:#fbfaf6; color:var(--ink); font-family:inherit;
  }
  .field input:focus{outline:none; border-color:var(--accent);}
  .swap-row{display:flex; align-items:center; gap:8px;}
  .swap-row .fields{flex:1;}
  #swapBtn{
    width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);
    background:#fbfaf6; cursor:pointer; font-size:16px; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s;
  }
  #swapBtn:active{transform:rotate(180deg);}

  /* 巴士站選點地圖 */
  #stopMapWrap{margin-bottom:12px;}
  #stopMap{
    height:260px; width:100%; border:1.5px solid var(--line);
    background:#e5e2d8; position:relative; z-index:0;
  }
  #mapZoomHint{
    font-size:11.5px; color:var(--muted); margin-top:5px; text-align:center;
  }
  #mapZoomHint.active{color:var(--good); font-weight:700;}
  .map-popup-title{font-size:13px; font-weight:800; color:var(--ink);}
  .map-popup-sub{font-size:11px; color:var(--muted); margin-top:2px;}
  .map-pick-btns{display:flex; gap:6px; margin-top:7px;}
  .map-pick-btns button{
    flex:1; font-size:11.5px; font-weight:700; padding:6px 4px;
    border:1.5px solid var(--line); background:#fbfaf6; cursor:pointer;
    font-family:inherit; color:var(--ink);
  }
  .map-pick-btns button.origin-btn:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .map-pick-btns button.dest-btn:hover{background:var(--ink); color:#fff; border-color:var(--ink);}
  .leaflet-popup-content{margin:8px 10px;}
  .leaflet-popup-content-wrapper{font-family:inherit;}

  .suggest{
    position:absolute; z-index:20; left:0; right:0; top:100%;
    background:var(--card); border:1px solid var(--line); border-top:none;
    max-height:260px; overflow-y:auto;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
  }
  .suggest button{
    display:block; width:100%; text-align:left; padding:9px 12px;
    background:none; border:none; border-bottom:1px solid #f0eee6;
    font-size:13.5px; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .suggest button:hover{background:#f6f4ec;}
  .suggest button small{display:block;color:var(--muted); font-size:11px;}
  .suggest .empty{padding:10px 12px; color:var(--muted); font-size:12.5px;}

  .criteria-row { display: flex; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
  .crit-btn{
    flex:1; padding:9px 6px; font-size:12.5px; font-weight:700;
    border:1.5px solid var(--line); background:#fbfaf6;
    cursor:pointer; color:var(--muted);
  }
  .crit-btn.active{background:var(--ink); border-color:var(--ink); color:#fff;}
  .crit-btn[disabled]{opacity:.45; cursor:not-allowed;}

  #searchBtn{
    width:100%; margin-top:12px; padding:13px; font-size:15px; font-weight:900;
    background:var(--accent); color:#fff; border:none;
    cursor:pointer; letter-spacing:.4px;
  }
  #searchBtn:disabled{background:#b7b0a0; cursor:wait;}

  .status-line{font-size:12px; color:var(--muted); margin-top:8px; min-height:16px;}
  .status-line.err{color:#a4132b;}

  .result-meta{
    display:flex; justify-content:space-between; align-items:center;
    font-size:11.5px; color:var(--muted); margin:2px 2px 10px;
  }
  #refreshBtn{
    background:none;border:1px solid var(--line);border-radius:8px;
    font-size:11.5px; padding:4px 9px; cursor:pointer; color:var(--ink); font-family:inherit;
  }

  .result-card{
    background:var(--card);
    margin-bottom:12px; overflow:hidden;
  }
  .result-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; background:#fbfaf6; border-bottom:1px solid var(--line);
  }
  .result-head .times{font-size:19px; font-weight:700;}
  .result-head .times .arr{color:var(--accent);}
  .result-head .sep{color:var(--muted); font-weight:400; padding:0 4px;}
  .result-head .stats{text-align:right; font-size:11.5px; color:var(--muted);}
  .result-head .stats b{color:var(--ink); font-size:16px;}
  .rank-tag{
    display:inline-block; font-size:10px; font-weight:800; letter-spacing:.4px;
    background:var(--ink); color:#fff; padding:2px 7px; margin-right:8px;
  }

  .legs{padding:12px 14px 14px;}
  .leg{display:flex; gap:10px; padding:7px 0;}
  .leg .rail{width:20px; flex-shrink:0; display:flex; flex-direction:column; align-items:center;}
  .leg .dot{width:9px;height:9px;border-radius:50%;background:var(--ink); margin-top:4px;}
  .leg .bar{flex:1; width:2px; background:var(--line); margin:2px 0;}
  .leg.walk .bar, .leg.walk .dot{background:var(--walk);}
  .leg .content{flex:1; padding-bottom:2px;}
  .leg .stopname{font-size:13.5px; font-weight:700;}
  .leg .stopname .t{float:right; font-size:12.5px; color:var(--muted);}
  .leg.ride .stopname .t{color:var(--ink); font-weight:700;}
  .ridebox{
    margin:4px 0 4px 0; padding:8px 10px; background:#fbfaf6;
    font-size:12.5px;
  }
  .ridebox .routeno{
    font-family:"Johnston100-Medium", sans-serif; font-weight:500; font-size:18px; color:#fff;
    padding:2px 4px; border-radius:5px; margin-right:6px;
  }
  .ridebox .routeno.kmb{background:var(--kmb);}
  .ridebox .routeno.ctb{background:var(--ctb);}
  .ridebox .routeno.nlb{background:var(--nlb);}
  .ridebox .routeno.gmb{background:var(--gmb);}
  .ridebox .routeno.mtr{background:var(--mtr);}
  .ridebox .routeno.mtrb{background:var(--mtrb);}
  .ridebox .routeno.lightrail{background:var(--lr);}
  .ridebox .dur{color:var(--muted);}
  .ridebox .live-tag{font-size:10px; padding:1px 6px; border-radius:10px; background:#e4f3ea; color:var(--good); font-weight:700; margin-left:4px;}
  .ridebox .est-tag{font-size:10px; padding:1px 6px; background:#f4e9c9; color:#7a5c00; font-weight:700; margin-left:4px;}
  .ridebox .ctb-discount-hint{font-size:10px; padding:1px 6px; border-radius:10px; background:#e7ecff; color:#3448c5; font-weight:700; margin-left:4px;}
  .walkbox{font-size:12px; color:var(--walk); padding:2px 0 2px;}
  .samestop{font-size:10.5px; color:var(--good); font-weight:700;}

  .empty-state, .loading-state{
    text-align:center; padding:36px 16px; color:var(--muted); font-size:13.5px;
  }
  .loading-state .spinner{
    width:26px;height:26px;border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent);
    margin:0 auto 12px; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .note{font-size:11.5px; color:var(--muted); line-height:1.6; padding:2px 4px;}
  .note b{color:var(--ink);}
  footer.disclaimer{
    max-width:640px;margin:6px auto 0;padding:14px 16px 0; font-size:11px; color:#8a8474; line-height:1.7;
  }

  /* 自選模式專屬樣式 */
  .custom-leg-card {
    background: #fbfaf6;
    border: 1.5px solid var(--line);
    padding: 14px;
    margin-bottom: 12px;
    position: relative;
  }
  .custom-leg-card .leg-title {
    font-size: 13px;
    font-weight: 900;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .custom-leg-card .delete-leg-btn {
    background: none;
    border: none;
    color: var(--kmb);
    font-weight: 700;
    cursor: pointer;
    font-size: 12px;
  }
  .custom-leg-card .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  .custom-leg-card select, .custom-leg-card input {
    width: 100%;
    padding: 10px;
    font-size: 13.5px;
    border: 1px solid var(--line);
    background: #fff;
    font-family: inherit;
    color: var(--ink);
  }
  .custom-leg-card select:focus, .custom-leg-card input:focus {
    outline: none;
    border-color: var(--accent);
  }
  /* 一般搜尋模式起點/終點自動完成選單：港鐵／輕鐵站名旁邊嘅細 logo。
     Logo 擺喺中文站名右邊（見 renderSuggest()）,所以用 margin-left
     嚌住個 logo 同前面文字之間嘅空隙,唔再用 margin-right。 */
  .station-mode-icon {
    width: 13px;
    height: 13px;
    vertical-align: -1px;
    margin-left: 4px;
    display: inline-block;
  }
</style>
</head>
<body>

<header class="top">
  <h1>行程搜尋</h1>
  <p>輸入起點同終點,参考 API 自動計算實時行程</p>
  <div class="badge-strip">
    <span class="co-chip kmb">九巴 KMB</span>
    <span class="co-chip ctb">城巴 CTB</span>
    <span class="co-chip nlb">嶼巴 NLB</span>
    <span class="co-chip gmb">專線小巴 GMB</span>
    <span class="co-chip mtrb">港鐵巴士 MTRB</span>
    <span class="co-chip lightrail">輕鐵 LRT</span>
  </div>
</header>

<main>
  <div class="panel">
    <div id="standardInputsWrap">
      <!-- 巴士站選點地圖：放大至約1公里範圍後,會根據地理資料顯示附近巴士站,
           撳站牌可直接設為起點/終點,令選點更可視化 -->
      <div id="stopMapWrap">
        <div id="stopMap"></div>
        <div id="mapZoomHint">放大地圖至約 1 公里範圍，即顯示附近巴士站可供選擇</div>
      </div>

      <!-- GPS 起點按鈕 -->
      <button id="gpsBtn" style="width:100%; margin-bottom:12px; padding:11px; background:#fbfaf6; border:1.5px solid var(--line); cursor:pointer; color:var(--ink); font-size: 13.5px; font-weight: 700;">GPS 設定起點</button>
      
      <div class="swap-row">
        <div class="fields">
          <div class="field">
            <label>起點</label>
            <input id="originInput" type="text" placeholder="輸入出發巴士站名稱" autocomplete="off">
            <div class="suggest" id="originSuggest" hidden></div>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>終點</label>
            <input id="destInput" type="text" placeholder="輸入到達巴士站名稱" autocomplete="off">
            <div class="suggest" id="destSuggest" hidden></div>
          </div>
        </div>
        <button id="swapBtn" title="對調起點終點">⇅</button>
      </div>
    </div>

    <label style="display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:10px 2px 6px;">排序準則</label>
    <div class="criteria-row">
      <button class="crit-btn active" data-crit="time">最早到達</button>
      <button class="crit-btn" data-crit="fare" disabled title="資料載入中">車費</button>
      <button class="crit-btn" data-crit="transfers">轉車最少</button>
      <button class="crit-btn" data-crit="custom" id="customModeBtn">自選行程</button>
    </div>

    <!-- 出發時間按鈕與 Time Picker -->
    <label style="display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:12px 2px 6px;">出發時間</label>
    <div class="criteria-row">
      <button class="crit-btn active" id="timeNowBtn">現在出發</button>
      <button class="crit-btn" id="timeCustomBtn">指定時間出發</button>
    </div>
    <div id="timePickerWrap" style="display:none; margin-top:8px;">
      <input type="datetime-local" id="customTimeInput" style="width:100%; padding:11px 12px; font-size:15px; border:1.5px solid var(--line); background:#fbfaf6; color:var(--ink); font-family:inherit;">
    </div>

    <button id="searchBtn" disabled>載入路線資料中</button>
    <div class="status-line" id="statusLine"></div>

    <div id="customPanel" style="display:none; margin-top: 12px; padding: 0;">
      <div id="customLegsContainer"></div>
      <button id="addCustomLegBtn" style="width:100%; margin-top:8px; padding:10px; background:#fbfaf6; border:1.5px dashed var(--line); cursor:pointer; color:var(--ink); font-size: 13.5px; font-weight: bold;">+ 增加一程</button>
      <button id="calcCustomBtn" style="width:100%; margin-top:12px; padding:13px; font-size:15px; font-weight:900; background:var(--ink); color:#fff; border:none; cursor:pointer; letter-spacing:.4px;">計算自選行程到站時間</button>
    </div>
  </div>

  <div id="resultsWrap"></div>

  <footer class="disclaimer">
    <b>關於此工具：</b>本工具使用 data.gov.hk 提供嘅九巴/龍運、城巴、嶼巴、專線小巴實時到站 API。輸入起點同終點,自動計算實時行程組合。
  </footer>
</main>

<script type="module">
import { fetchEtaDb, fetchEtas } from "https://esm.sh/hk-bus-eta@3?bundle";

/* ---------------- constants ---------------- */
const WALK_SPEED_MPS = 1.2;          // ~4.3km/h 步行(連搵路)
const SAME_STOP_ALIGHT_BUFFER_MIN = 1; // 同站轉乘落車緩衝時間
const DEBUG_MODE = (() => {
  try { return new URLSearchParams(location.search).get("debug") === "1"; }
  catch (e) { return false; }
})(); // 網址加 ?debug=1 可以喺搜尋結果度顯示 GTFS 比對失敗率統計，方便排查
const MAX_TRANSFER_WALK_M = 350;     // 轉車步行上限
const AVG_ROAD_SPEED_MPS = 6.5;      // ≈ 23km/h，冇觀測數據時嘅保底概算車速
const MAX_LEGS = 4;                  // 最多3次轉車 = 4程
// 【4 次轉車救援上限】絕大部分行程 3 次轉車（4程）內已經到達；但少數真正
// 冇捷徑、必須轉足 4 次（5程）先到嘅極長途組合，會喺 runBeamSearch() 主
// round 迴圈入面，淨係喺用盡 MAX_LEGS 都仲一個完成候選都搵唔到嗰陣，先
// 臨時將 legsAllowed 加一，換多一 round 機會（見 runBeamSearch() 入面
// 「【4 次轉車救援】」一段）。呢個做法令已經 4 程內完成嘅搜尋完全唔受
// 影響（唔會多付任何額外 round 嘅成本），淨係真正需要嗰批先會觸發。
const MAX_LEGS_EXTENDED = 5;
const BEAM_WIDTH = 400;
const LOOKAHEAD_STOPS = 70;
const MAX_CANDIDATES_TO_EVAL = 200;
const RESULTS_TO_SHOW = 10;
const FRESH_ETA_WINDOW_MIN = 120;
const ONESIDED_MAX_HOPS = 14;        // 逐站比對上限（最多掃14個站）
const PRIORITY1_ALIGHT_FRESH_WINDOW_MIN = 60; // 第一優先：落車時間須喺查詢後一小時內先適用

const LONG_TRIP_TOTAL_MIN_THRESHOLD = 45; // 總路程超過幾多分鐘算長途

// 起點上車站搜尋範圍統一為 650 米，唔再按直線距離分長途／
// 【統一】發現半徑同接受半徑一律用返呢個同一個數值，唔再分開用
// 「發現用闊半徑、接受用窄半徑」嘅雙軌制——搵到附近有啱路線經過嘅
// 巴士站就用返嗰個範圍入面最近嘅站，唔應該引導用戶行出 650 米之外
// 去搭一條「理論上搵到、但要行好遠先上到車」嘅路線。
const ENDPOINT_WALK_RADIUS_M = 650;

/* ---------------- state ---------------- */
let etaDb = null;
let routeFareDb = null;      // 路線車費及港鐵巴士數據
let timeIntervalDb = null;   // 站與站預計車程 JSON 數據

/* ---- 轉乘車費相關資料庫估算邏輯 ----
 * 資料源自 LOOHP/HK-KMB-Calculator（九巴轉乘車費計算機）每日自動更新之開放資料。 */
let kmbBbiStopDb = null;             // KMB BBI 轉車站站名對照表
let regionalTwoWayFareDb = null;     // 九巴短途分段雙向收費表
let ctbRouteIdsDb = null;            // 城巴路線編號/方向對照表
let ctbLiveInterchangeCache = new Map();
let mtrBusRouteFareDb = null;        // 港鐵巴士車費
let bbiF1Db = null;                  // 九巴 BBI 轉乘優惠 (方向 1)

/* ---------------- geo helpers ---------------- */
function distM(a, b) {
  // 防禦：如果任一點缺座標（例如個別港鐵站因為官方 CSV／社群 exits.mtr.json
  // 兩個資料來源用字有異體字差異——例如「茘景」(官方) vs「荔景」(社群)——
  // 令 stationCoordByCode 對唔到、location 變成 null），就當呢一段冇額外
  // 距離，唔再直接噴出 "Cannot read properties of null (reading 'lat')"
  // 令成個（尤其係自選）行程計唔到。
  if (!a || !b || !Number.isFinite(a.lat) || !Number.isFinite(a.lng) || !Number.isFinite(b.lat) || !Number.isFinite(b.lng)) {
    return 0;
  }
  const latDist = Math.abs(b.lat - a.lat) * 111320;
  const avgLat = (a.lat + b.lat) / 2;
  const lngDist = Math.abs(b.lng - a.lng) * (40075000 * Math.cos(avgLat * Math.PI / 180) / 360);
  const manhattanDist = latDist + lngDist;
  return manhattanDist * 1.2;
}
const CELL = 0.005;
function cellKey(lat,lng){ return Math.floor(lat/CELL)+","+Math.floor(lng/CELL); }

// 【方向（bearing）輔助函數】計算由 a 望向 b 嘅羅盤方位角（0-360度，
// 正北=0，順時針計）。用嚟判斷「呢一程實際去緊邊」，同「應該去緊邊」
// （例如朝住終點嘅方向）夾唔夾。
function bearingDeg(a, b) {
  if (!a || !b || !Number.isFinite(a.lat) || !Number.isFinite(a.lng) || !Number.isFinite(b.lat) || !Number.isFinite(b.lng)) return null;
  const lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const y = Math.sin(dLng) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
  const brng = Math.atan2(y, x) * 180 / Math.PI;
  return (brng + 360) % 360;
}
// 兩個方位角之間嘅夾角（0-180度，唔理順定逆時針），用嚟量度「差幾遠」。
function bearingDiffDeg(b1, b2) {
  if (b1 === null || b1 === undefined || b2 === null || b2 === undefined) return null;
  const diff = Math.abs(b1 - b2) % 360;
  return diff > 180 ? 360 - diff : diff;
}

// === 地政總署三維行人道路網 (取代舊有 OSRM 估算,提升步行距離準確度) ===
// 資料集: https://data.gov.hk/tc-data/dataset/hk-landsd-openmap-3d-pedestrian-network
// 做法:以 ArcGIS REST API 攞返起訖點附近嘅行人路網折線,砌成圖(節點/邊),
// 再用 Dijkstra 搵最短路網距離,比起單純直線估算更貼近實際行人路徑
// (例如天橋/隧道/多層轉乘嘅實際繞路)。
const PEDNET_MAPSERVER = "https://cors-anywhere.herokuapp.com/https://portal.csdi.gov.hk/server/rest/services/common/landsd_rcd_1637222018065_52265/MapServer/0/query";
const PEDNET_MAX_QUERY_DIST_M = 1500; // 起訖點直線距離超過呢個數,查行人路網已經冇乜意義,直接降級用直線估算
const PEDNET_QUERY_BUFFER_M = 250;    // 查詢範圍(bbox)喺起訖點外圍額外留返幾多米緩衝
const PEDNET_SNAP_RADIUS_M = 300;     // 起/訖點同路網最近節點嘅可接受距離,超過視為路網資料唔覆蓋呢個位置
const pedNetGraphCache = new Map();   // bbox key -> 已組裝好嘅圖,避免同一帶重複打 API

function metersToDegLat(m){ return m / 111320; }
function metersToDegLng(m, lat){ return m / (111320 * Math.cos(lat * Math.PI / 180)); }

// 向地政總署三維行人道路網 API 攞返起訖點附近範圍嘅行人路網折線,並組成
// 可用嚟行 Dijkstra 嘅圖。用 bbox 做快取 key,減少對同一帶重複發請求。
async function fetchPedestrianNetworkGraph(fromLoc, toLoc){
  const minLat = Math.min(fromLoc.lat, toLoc.lat);
  const maxLat = Math.max(fromLoc.lat, toLoc.lat);
  const minLng = Math.min(fromLoc.lng, toLoc.lng);
  const maxLng = Math.max(fromLoc.lng, toLoc.lng);
  const midLat = (minLat + maxLat) / 2;
  const bufLat = metersToDegLat(PEDNET_QUERY_BUFFER_M);
  const bufLng = metersToDegLng(PEDNET_QUERY_BUFFER_M, midLat);
  const xmin = minLng - bufLng, xmax = maxLng + bufLng;
  const ymin = minLat - bufLat, ymax = maxLat + bufLat;

  const cacheKey = `${xmin.toFixed(5)},${ymin.toFixed(5)},${xmax.toFixed(5)},${ymax.toFixed(5)}`;
  if (pedNetGraphCache.has(cacheKey)) return pedNetGraphCache.get(cacheKey);

  const params = new URLSearchParams({
    f: "geojson",
    geometry: `${xmin},${ymin},${xmax},${ymax}`,
    geometryType: "esriGeometryEnvelope",
    inSR: "4326",
    outSR: "4326",
    spatialRel: "esriSpatialRelIntersects",
    outFields: "OBJECTID",
    returnGeometry: "true"
  });

  let graph = null;
  try {
    const res = await fetch(`${PEDNET_MAPSERVER}?${params.toString()}`);
    if (!res.ok) throw new Error("三維行人道路網 API error");
    const geo = await res.json();
    graph = buildPedNetGraph(geo);
  } catch (err) {
    console.warn("無法取得地政總署三維行人道路網資料,降級至直線估算:", err);
    graph = null;
  }
  pedNetGraphCache.set(cacheKey, graph);
  return graph;
}

// 將 GeoJSON 折線資料組成圖:節點=座標(四捨五入至約 0.1 米精度嚌埋
// 相同節點),邊=每條折線內相鄰兩點,邊嘅權重用 distM() 量度嘅實際距離。
function buildPedNetGraph(geo){
  if (!geo || !Array.isArray(geo.features) || !geo.features.length) return null;
  const nodeKey = (lng, lat) => `${lat.toFixed(6)},${lng.toFixed(6)}`;
  const nodes = new Map(); // key -> {lat,lng}
  const adj = new Map();   // key -> [{to, dist}]

  const addEdge = (aLng, aLat, bLng, bLat) => {
    const ak = nodeKey(aLng, aLat), bk = nodeKey(bLng, bLat);
    if (ak === bk) return;
    if (!nodes.has(ak)) nodes.set(ak, { lat: aLat, lng: aLng });
    if (!nodes.has(bk)) nodes.set(bk, { lat: bLat, lng: bLng });
    const d = distM({ lat: aLat, lng: aLng }, { lat: bLat, lng: bLng });
    if (!adj.has(ak)) adj.set(ak, []);
    if (!adj.has(bk)) adj.set(bk, []);
    adj.get(ak).push({ to: bk, dist: d });
    adj.get(bk).push({ to: ak, dist: d });
  };

  const walkLine = (coords) => {
    for (let i = 0; i < coords.length - 1; i++){
      const [aLng, aLat] = coords[i];
      const [bLng, bLat] = coords[i + 1];
      addEdge(aLng, aLat, bLng, bLat);
    }
  };

  for (const f of geo.features){
    const geom = f.geometry;
    if (!geom) continue;
    if (geom.type === "LineString") walkLine(geom.coordinates);
    else if (geom.type === "MultiLineString") geom.coordinates.forEach(walkLine);
  }

  return nodes.size ? { nodes, adj } : null;
}

// 搵返圖入面距離某座標最近嘅節點,等於將起/訖點「吸落」去行人路網。
function findNearestGraphNode(graph, loc){
  let bestKey = null, bestDist = Infinity;
  for (const [key, n] of graph.nodes.entries()){
    const d = distM(loc, n);
    if (d < bestDist){ bestDist = d; bestKey = key; }
  }
  return bestKey ? { key: bestKey, dist: bestDist } : null;
}

// 標準 Dijkstra,搵兩個節點之間嘅最短路網距離。單次查詢嘅圖規模細
// (只覆蓋起訖點附近細範圍),用簡單陣列充當 priority queue 已經夠快。
function dijkstraShortestDist(graph, startKey, endKey){
  if (startKey === endKey) return 0;
  const dist = new Map([[startKey, 0]]);
  const visited = new Set();
  const pq = [[0, startKey]];

  while (pq.length){
    pq.sort((a, b) => a[0] - b[0]);
    const [d, u] = pq.shift();
    if (visited.has(u)) continue;
    visited.add(u);
    if (u === endKey) return d;
    for (const { to, dist: w } of (graph.adj.get(u) || [])){
      if (visited.has(to)) continue;
      const nd = d + w;
      if (nd < (dist.get(to) ?? Infinity)){
        dist.set(to, nd);
        pq.push([nd, to]);
      }
    }
  }
  return Infinity;
}

// 用地政總署三維行人道路網取代舊有 OSRM,計算兩點之間實際嘅步行路徑
// 距離。搵唔到路網資料、起訖點太遠離已知路網、或者兩點之間根本冇路徑
// 連通,都會 return { success:false },等呼叫方跌落用直線距離 *1.2 保底
// (見 distM() 同各呼叫處嘅 fallback 邏輯),行為同以往 OSRM 失敗時一致。
async function getRealWalkingData(fromLoc, toLoc) {
  const straightM = distM(fromLoc, toLoc);
  if (straightM > PEDNET_MAX_QUERY_DIST_M) return { success: false };

  try {
    const graph = await fetchPedestrianNetworkGraph(fromLoc, toLoc);
    if (!graph) return { success: false };

    const fromNode = findNearestGraphNode(graph, fromLoc);
    const toNode = findNearestGraphNode(graph, toLoc);
    if (!fromNode || !toNode) return { success: false };
    if (fromNode.dist > PEDNET_SNAP_RADIUS_M || toNode.dist > PEDNET_SNAP_RADIUS_M) return { success: false };

    const pathDist = dijkstraShortestDist(graph, fromNode.key, toNode.key);
    if (!Number.isFinite(pathDist)) return { success: false };

    const totalDistM = fromNode.dist + pathDist + toNode.dist; // 補返起/訖點行去路網最近節點嗰一小段
    return {
      distM: totalDistM,      // 沿三維行人道路網計算嘅實際步行距離 (米)
      durationS: totalDistM / WALK_SPEED_MPS, // 用返本身嘅步行速率估計時間 (秒)
      success: true
    };
  } catch (err) {
    console.warn("三維行人道路網步行距離計算失敗,降級至直線估算:", err);
    return { success: false };
  }
}

const walkCache = new Map();
async function getRealWalkingDataCached(cacheKey, fromLoc, toLoc) {
  if (walkCache.has(cacheKey)) {
    return walkCache.get(cacheKey);
  }
  const result = await getRealWalkingData(fromLoc, toLoc);
  walkCache.set(cacheKey, result);
  return result;
}


function buildGridIndex(stopList){
  gridIndex = new Map();
  for (const [stopId, s] of Object.entries(stopList)) {
    if (!s || !s.location) continue;
    const key = cellKey(s.location.lat, s.location.lng);
    if (!gridIndex.has(key)) gridIndex.set(key, []);
    gridIndex.get(key).push(stopId);
  }
}

/* === 站點合併與緩衝區判定 === */
// 【邏輯修正】原本合併半徑 150 米，對於大型總站/公共運輸交匯處（例如
// 「馬鞍山市中心」「機場地面運輸中心」呢類多月台大站）經常唔夠——同一個
// 總站入面唔同公司/唔同月台嘅站牌，實際相距超過 150 米係好平常嘅事，令
// 名稱相符但距離啱啱好踩過界嘅站牌被誤判做「唔同站」。放寬到 220 米，
// 並將「純距離兜底」門檻由 40 米放寬到 60 米（頂住兩個站名寫法完全唔同、
// 但實際上係同一個處所嘅邊緣情況）。
const MERGE_RADIUS_M = 220;
const MERGE_FALLBACK_DIST_M = 60;

// 常見「總站/交匯處」類後綴詞——呢類字眼喺唔同資料源（KMB/CTB/GMB/MTR
// 巴士）入面有冇、寫法都可能唔一致（例如「馬鞍山市中心總站」對比
// 「馬鞍山市中心」），但實際上係指緊同一個處所。比較站名之前先將呢啲
// 後綴詞剝走，減少因為呢類寫法差異導致嘅假陰性（誤判做唔同站）。
// 由長到短排列，確保長後綴（如「巴士總站」）優先於短後綴（如「站」）被
// 剝走，避免斬多咗令原本有意義嘅字眼都被切走。
const STOP_SUFFIX_WORDS = [
  "公共運輸交匯處", "公共交通交匯處", "運輸交匯處", "交匯處",
  "巴士總站", "小巴總站", "總站", "巴士站", "小巴站"
];

function cleanStopName(name) {
  if (!name) return "";
  let s = name.toString()
             .replace(/[\(（].*?[\)）]/g, "") // 移除括號及其內容，例如 (B1)、（落客站）
             .replace(/[\s,，.。\-_]/g, "")
             .toLowerCase()
             .trim();
  for (const suffix of STOP_SUFFIX_WORDS) {
    if (s.length > suffix.length && s.endsWith(suffix)) {
      s = s.slice(0, -suffix.length);
      break; // 剝一次就夠，避免連環誤剝
    }
  }
  return s;
}

function isSameTransferPoint(stopA, stopB) {
    if (!stopA || !stopB) return false;
    const dist = distM(stopA.location, stopB.location);
    if (dist > MERGE_RADIUS_M) return false;
    
    const zhA = cleanStopName(stopA.name.zh);
    const zhB = cleanStopName(stopB.name.zh);
    const enA = cleanStopName(stopA.name.en);
    const enB = cleanStopName(stopB.name.en);
    
    // 1. 中文名稱完全相同或包含關係 (例如 "創紀之城" vs "創紀之城(B1)")
    if (zhA && zhB) {
        if (zhA === zhB || zhA.includes(zhB) || zhB.includes(zhA)) return true;
    }
    // 2. 英文名稱完全相同或包含關係
    if (enA && enB) {
        if (enA === enB || enA.includes(enB) || enB.includes(enA)) return true;
    }
    // 3. 極近距離（如60米內），即使命名略有不同，也視為同站群（防止跨公司命名細微差異）
    if (dist <= MERGE_FALLBACK_DIST_M) return true;
    
    return false;
}

function nearbyStops(lat, lng, radiusM) {
    const found = [];
    const seenStopIds = new Set();

    // 【效能修正】上次為咗唔漏站，一律喺 latSpan/lngSpan 度多加一格緩衝，
    // 保證半徑內嘅站一定掃得到，但代價係好多時候會掃多過實際需要嘅格數
    // （呢個 function 喺搜尋主迴圈入面——尤其係轉車步行搜尋——會被逐個
    // 候選狀態調用，多掃嘅格數會逐輪疊加，直接拖慢撳「搜尋」之後嘅等候
    // 時間）。而家改為根據起點喺佢所在格仔入面嘅實際偏移量，分別計算四
    // 個方向（南／北／東／西）各自需要幾多格先夠覆蓋 radiusM，唔再無條件
    // 兩邊都加多一格——結果保證一樣完整（半徑內嘅站保證掃得到），但一般
    // 情況下要掃嘅格仔會少好多。
    const latMPerDeg = 111320;
    const lngMPerDeg = Math.max(111320 * Math.cos(lat * Math.PI / 180), 1);
    const latCellM = latMPerDeg * CELL;
    const lngCellM = lngMPerDeg * CELL;

    const latCell = Math.floor(lat / CELL), lngCell = Math.floor(lng / CELL);
    const latOffsetM = (lat - latCell * CELL) * latMPerDeg;   // 起點喺格內嘅偏移（南面起計）
    const lngOffsetM = (lng - lngCell * CELL) * lngMPerDeg;   // 起點喺格內嘅偏移（西面起計）

    const negLatSpan = Math.max(0, Math.ceil((radiusM - latOffsetM) / latCellM));
    const posLatSpan = Math.max(0, Math.ceil((radiusM - (latCellM - latOffsetM)) / latCellM));
    const negLngSpan = Math.max(0, Math.ceil((radiusM - lngOffsetM) / lngCellM));
    const posLngSpan = Math.max(0, Math.ceil((radiusM - (lngCellM - lngOffsetM)) / lngCellM));

    for (let dlat=-negLatSpan; dlat<=posLatSpan; dlat++){
        for (let dlng=-negLngSpan; dlng<=posLngSpan; dlng++){
            const bucket = gridIndex.get((latCell+dlat)+","+(lngCell+dlng));
            if (!bucket) continue;
            for (const stopId of bucket){
                if (seenStopIds.has(stopId)) continue;
                const s = etaDb.stopList[stopId];
                if (!s) continue;
                const d = distM({lat,lng}, s.location);
                if (d <= radiusM) {
                    found.push({stopId, dist: d});
                    seenStopIds.add(stopId);
                }
            }
        }
    }
    
    // 合併同轉乘點的站點：呢類「其他站牌屬於同一轉乘點」嘅站牌，行過去嘅
    // 步行距離應該同已經量度過嘅嗰個代表站牌相若，但必須保留所有站點以
    // 獲取完整的路線覆蓋
    //
    // 【修正】isSameTransferPoint(m, f) 判斷嘅係 m 同 f 呢兩個站牌之間嘅
    // 距離（或者名稱相似度），並唔係話 f 距離查詢點（起點/終點座標）
    // 一定係 0 米。舊版一撞中就將 f.dist 硬set做 0，等於話「凡係同一
    // 站群嘅站牌，全部當企喺用戶腳下」——如果 m 本身真係好近（例如 5
    // 米），噉都仲勉強收貨；但如果 m 只不過喺 40 米 / 150 米合併半徑
    // 邊緣，f 實際距離查詢點可以仲有好幾百米，卻顯示做「步行約 0
    // 米」，同現實唔符（例如彩虹邨同啟晴邨實際上唔可能 0 米）。而家
    // 改為用返 existing（已經用真實 distM() 量度過）嗰個距離，代表
    // 「呢個站牌大約同代表站牌一樣近」，唔會再無中生有噏一個唔存在
    // 嘅 0 米出嚟。
    const merged = [];
    found.forEach(f => {
        const existing = merged.find(m => isSameTransferPoint(etaDb.stopList[m.stopId], etaDb.stopList[f.stopId]));
        if (!existing) {
            merged.push(f);
        } else {
            f.dist = existing.dist; // 同一站群的不同站牌，步行距離約等於代表站牌嘅實際距離
            merged.push(f); // 必須保留！否則該站牌特有的路線會被過濾，造成搜尋結果缺失
        }
    });
    
    merged.sort((a,b) => a.dist - b.dist);
    return merged;
}

// 【新增修正：唔同公司獨立 stopId、但實際係同一個物理站】stopRouteIndex.
// get(stopId) 只會攞到「呢個 stopId 自己」直接屬於嘅路線（連埋
// buildIndices() 已經補嘅、同一條路線嘅其他公司變體）。但如果起點／轉
// 車站用戶揀（或者 beam search 行到）嗰個 stopId 淨係屬於 A 公司，而
// 喺同一個物理位置仲有 B 公司自己另一個完全獨立嘅 stopId（兩個 stopId
// 之間冇任何 routeId 關聯，純粹座標／名稱啱啱好近），而用戶想搭嗰條
// 路線淨係喺 B 公司嗰個 stopId 先有記錄——噉 stopRouteIndex.get(A 個
// stopId) 就永遠搵唔到呢條路線，逼住個搜尋行去路線嘅下一個站先上到
// 車（明明個站已經企喺路線嘅站腳下）。而家用返 MERGE_RADIUS_M 範圍 +
// isSameTransferPoint() 判斷，搵埋附近所有「同一個轉乘點」嘅站牌，將
// 佢哋各自嘅可達路線都合併埋一齊，當呢個站都搭得到（0 米，冇額外步
// 行）。用 Map 做 cache，避免同一個 stopId 喺 beam search 入面每次擴展
// 都重新掃一次附近站。
// 【站群化】以前「搵呢個站有咩路線」／「搵起點附近有咩路線」兩處各自
// 用 nearbyStops()+isSameTransferPoint() 逐個站牌掃一次，等於將「轉乘
// 點/站群」呢個概念拆散做逐個站牌獨立處理，唔同函數重複計、亦好易走
// 漏（例如某個站牌啱啱好喺半徑邊緣就唔覆蓋到）。而家統一抽出呢個
// getStationGroupIds()：俾一個 stopId，一次過用 MERGE_RADIUS_M +
// isSameTransferPoint() 搵晒成個轉乘點/站群入面所有 stopId（包括自己），
// 結果 cache 埋，等成個搜尋（唔理係搵起點候選、定係 beam search 行到
// 中途任何一個站）都可以一致噉「成個站群」為單位嚟諗，而唔係每次淨係
// 掂到邊個站牌就淨係睇嗰個站牌自己。
function getStationGroupIds(stopId) {
  if (_stationGroupCache.has(stopId)) return _stationGroupCache.get(stopId);

  const stopObj = etaDb.stopList[stopId];
  if (!stopObj || !stopObj.location) {
    const solo = [stopId];
    _stationGroupCache.set(stopId, solo);
    return solo;
  }

  const groupIds = [stopId];
  const nearby = nearbyStops(stopObj.location.lat, stopObj.location.lng, MERGE_RADIUS_M);
  for (const ns of nearby) {
    if (ns.stopId === stopId) continue;
    const siblingObj = etaDb.stopList[ns.stopId];
    if (!siblingObj || !isSameTransferPoint(stopObj, siblingObj)) continue;
    groupIds.push(ns.stopId);
  }

  // 由於群組關係係雙向、對稱嘅（A 同 B 同一站群，B 睇返 A 都一定係同一
  // 站群），呢度將計到嘅結果，連埋每個成員嘅角度都一拼寫入 cache，避免
  // 之後逐個成員再重新掃一次（大幅減少 beam search 密集調用時嘅重複
  // 運算）。
  for (const gid of groupIds) {
    if (!_stationGroupCache.has(gid)) _stationGroupCache.set(gid, groupIds);
  }
  return groupIds;
}

function getRoutesAtStopWithColocated(stopId) {
  if (_coLocatedRoutesCache.has(stopId)) return _coLocatedRoutesCache.get(stopId);

  const own = stopRouteIndex.get(stopId) || [];
  const stopObj = etaDb.stopList[stopId];
  if (!stopObj || !stopObj.location) {
    _coLocatedRoutesCache.set(stopId, own);
    return own;
  }

  const ownRouteIds = new Set(own.map(e => e.routeId));
  const merged = own.slice();

  // 【成個站群一齊搵，而唔係逐個站牌搵】用 getStationGroupIds() 一次過
  // 攞返成個轉乘點/站群嘅全部 stopId，將群入面每個成員自己嘅路線都合埋
  // 一齊，代表「呢個站群」整體覆蓋到嘅路線範圍，唔會因為某條路線淨係
  // 喺群入面另一個站牌先有記錄就漏走。
  const groupIds = getStationGroupIds(stopId);
  for (const gid of groupIds) {
    if (gid === stopId) continue;
    const siblingRoutes = stopRouteIndex.get(gid) || [];
    for (const entry of siblingRoutes) {
      if (ownRouteIds.has(entry.routeId)) continue; // 呢條路線本身站牌已經搭得到，唔使補
      ownRouteIds.add(entry.routeId);
      merged.push(entry);
    }
  }

  _coLocatedRoutesCache.set(stopId, merged);
  return merged;
}

function stopName(stopId){
  const s = etaDb.stopList[stopId];
  if (!s) return stopId;
  return s.name.zh || s.name.en || stopId;
}
function fmtTime(d){
  if (!d || isNaN(d)) return "--:--";
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function fmtDist(m){
  return m < 1000 ? Math.round(m)+"米" : (m/1000).toFixed(1)+"公里";
}

/* ---------------- Route Scoring System ---------------- */
const PENALTY_TRANSFER = 3;      
const PENALTY_CROSS_CO = 5;     
// 【整合：以前 MULTIPLIER_WALK(=1.1，用喺 minutes 嘅最終評分) 同
// runBeamSearch() 入面 local 嘅 walkPenaltyMultiplier(=1.5，用喺 metres
// 嘅搜尋 heuristic) 係兩個完全獨立、數值都唔一致嘅「步行懲罰倍數」，
// 兩個地方各自維護，好易愈行愈唔一致。而家統一用返一個全域常數，令
// 「步行應該比搭車辛苦幾多倍」呢個判斷全個 file 一致。
// WALK_PENALTY_MULTIPLIER：origin 附近有另一個站已經覆蓋緊「目標路線」
// 嗰陣用嘅「維持懲罰」倍數——呢種情況行去第二個站係無謂嘅，要用力勸退。
const WALK_PENALTY_MULTIPLIER = 1.5;
const WALK_PENALTY_MULTIPLIER_RELAXED = 1.0;

/* ==================================================================
 * 轉乘質性評分機制 (Transfer Quality Score) —— 全面重構
 * ------------------------------------------------------------------
 * 背景：以往「轉車判斷」相關嘅賞罰分同「行程耗時」混埋喺同一條
 * score 度計，一個轉車位揀得幾好，都可能因為總耗時稍為長咗少少就
 * 被拖累排名，甚至喺仲未用真實班次評估之前就被搜尋/篩選階段當「差
 * 方案」提早淘汰。而家將「轉乘質性」獨立開一套 100 分為滿分、完全
 * 唔理耗時嘅評分（calculateTransferQualityScore()），有賞有罰：
 *
 *   能覆蓋行程起終點的直達車               +20
 *   次程路線能直達終點                     +20
 *   官方轉車站 / 九巴 BBI 官方轉乘站        +15
 *   同一轉乘點／同站群轉乘                  +15
 *   使用大型轉車站（樞紐站）                +5
 *   同公司轉乘（輕鐵/港鐵巴士同港鐵當同一
 *              公司；九巴同龍運喺呢個 app
 *              入面本身已經統一歸類做同一
 *              個 co，毋須額外處理）         +10
 *   次程路線能直達終點（轉完呢一程之後
 *              唔會再需要轉第三程）          +20
 *   非必要跨公司轉乘                        -10
 *   非必要轉乘／無謂駁腳                    -20
 *   無謂步行                                -15
 *
 * 保留嘅原有豁免：
 *   - 從區內前往位於區內轉車站嘅轉車：官方轉車站／BBI 轉乘站本身已經
 *     代表呢一步轉車有正當理由，豁免「非必要跨公司轉乘」呢項扣分
 *     （只計賞、唔計呢項罰）。
 *   - 深夜 (00:00-06:00)：「非必要跨公司轉乘」同「非必要轉乘/無謂
 *     駁腳」呢兩項扣分全部豁免，賞分（官方轉車站/同站群/大型轉車站/
 *     同公司）照計。
 *
 * 「非必要轉乘/無謂駁腳」嘅判斷（上一程坐到底其實已經夠近終點）唔設
 * 官方轉車站豁免——呢個轉車本身就唔應該發生，唔會因為揀啱轉車站而
 * 變成應該。呢個轉車發生嗰陣，所有「賞」都唔會發放（見下面實作），
 * 避免獎勵分抵銷返「呢步轉車根本無謂」呢個訊號。
 * 其餘未被明確提及、但原本已經存在嘅轉乘相關懲罰／獎勵（例如九巴
 * 自家轉車站 bonus），已經摺埋落上面呢 8 條規則入面，唔再獨立另計。
 * ================================================================== */
const TQS_MAX = 100;
const TQS_MIN = 0;
const TQS_BONUS_DIRECT = 70;
const TQS_BONUS_NEXT_LEG_DIRECT_TO_DEST = 20;
const TQS_BONUS_OFFICIAL_INTERCHANGE = 10;
const TQS_BONUS_SAME_STOP_GROUP = 10;
const TQS_BONUS_LARGE_INTERCHANGE = 5;
const TQS_BONUS_SAME_COMPANY = 10;
const TQS_PENALTY_CROSS_COMPANY = 10;
const TQS_PENALTY_REDUNDANT_TRANSFER = 20;
const TQS_PENALTY_UNNECESSARY_WALK = 15;


// 站群本身有唔同路線經過，就應該當佢係轉車站，畀返應得
// 嘅轉乘 bonus／搜尋豁免，等 beam search 唔會漏搵到「呢度轉車其實
// 更平更快」呢類方案。
// getStationGroupRouteCount()：攞返呢個 stopId 所屬站群，一共有幾多
// 條唔同嘅路線經過（用 getRoutesAtStopWithColocated() 已經合埋成個
// 站群嘅路線，再用 routeId 去重）。
function getStationGroupRouteCount(stopId) {
  if (_stationGroupRouteCountCache.has(stopId)) return _stationGroupRouteCountCache.get(stopId);
  if (!etaDb || !etaDb.stopList[stopId]) {
    _stationGroupRouteCountCache.set(stopId, 0);
    return 0;
  }
  const routes = getRoutesAtStopWithColocated(stopId);
  const uniqueRouteIds = new Set(routes.map(r => r.routeId));
  const count = uniqueRouteIds.size;
  // 成個站群嘅路線數量本身就係「呢個站群」嘅屬性，唔理你問嘅係群入面
  // 邊一個具體 stopId，答案應該一致——將計到嘅結果，連埋每個成員都一
  // 拼寫入 cache，避免之後逐個成員再重新計一次。
  const groupIds = getStationGroupIds(stopId);
  for (const gid of groupIds) {
    if (!_stationGroupRouteCountCache.has(gid)) _stationGroupRouteCountCache.set(gid, count);
  }
  return count;
}

// 「有幾多條路線先算多」嘅門檻：普通一個巴士站牌一般得幾條路線
// （2-8條左右），真正好似怡和大廈、彩虹、旺角站咁「乜路線都經過」
// 嘅實務樞紐，通常都成 10 條以上。呢個數值日後可以按實際搜尋結果
// 微調。
const HUB_ROUTE_COUNT_THRESHOLD = 10;
function isDataDrivenHubStop(stopId) {
  if (!stopId) return false;
  return getStationGroupRouteCount(stopId) >= HUB_ROUTE_COUNT_THRESHOLD;
}

// 【統一嘅「呢度算唔算轉車站」判斷】結合兩個角度：官方/正式命名嘅轉
// 乘設施（isOfficialInterchangeName）、同埋資料驅動嘅「呢個站群路線
// 好多」（isDataDrivenHubStop）。呢個函數專門畀需要「淨係得個
// stopId、想知道呢個轉車位應唔應該攞轉車 bonus／豁免搜尋懲罰」嘅地
// 方用（例如 beam search 主迴圈嘅轉車評分、_isHubRescueStop() 嘅樞
// 紐救援），令呢類地方唔再淨係睇官方命名，都可以夾埋「呢度好多線經
// 過」嚟判斷。
function isInterchangeHub(stopId) {
  if (!stopId) return false;
  const s = etaDb && etaDb.stopList ? etaDb.stopList[stopId] : null;
  const zh = s?.name?.zh || "";
  const en = s?.name?.en || "";
  if (isOfficialInterchangeName(zh) || isOfficialInterchangeName(en)) return true;
  return isDataDrivenHubStop(stopId);
}

// 公司分組：輕鐵／港鐵巴士 同 港鐵 當同一集團
function transferCompanyGroupId(co) {
  if (!co) return co;
  if (co === "mtr" || co === "lightrail" || co === "mtrb" || co === "mtr-bus") return "mtr-group";
  return co;
}

// 判斷「上一程坐到底其實已經夠近終點」——即依家呢次轉車係咪無謂駁腳。
// 判斷邏輯同 runBeamSearch() 入面嘅 prevRouteAlreadyReachesDest 一致
// （見該處註解），呢度獨立實作一份輕量版本畀 calculateTransferQualityScore()
// 用，避免要抽出成個 beam search 嘅 state 先計到。
function _legRouteAlreadyReachesDestination(rideLeg, destPoint) {
  if (!rideLeg || rideLeg.type !== "ride" || !rideLeg.r || !rideLeg.co || !destPoint) return false;
  const stopsArr = rideLeg.r.stops && rideLeg.r.stops[rideLeg.co];
  if (!stopsArr) return false;
  const alightIdx = stopsArr.indexOf(rideLeg.alightStopId);
  if (alightIdx < 0) return false;
  const walkLimit = Math.max(ENDPOINT_WALK_RADIUS_M, MAX_TRANSFER_WALK_M);
  for (let k = alightIdx; k < stopsArr.length; k++) {
    const laterStop = etaDb.stopList[stopsArr[k]];
    if (!laterStop || !laterStop.location) continue;
    if (distM(laterStop.location, destPoint) <= walkLimit) return true;
  }
  return false;
}

// 判斷次程路線能唔能夠直達終點
function _legRouteCanReachDestinationDirectly(rideLeg, destPoint) {
  if (!rideLeg || rideLeg.type !== "ride" || !rideLeg.r || !rideLeg.co || !destPoint) return false;
  const stopsArr = rideLeg.r.stops && rideLeg.r.stops[rideLeg.co];
  if (!stopsArr) return false;
  const boardIdx = stopsArr.indexOf(rideLeg.boardStopId);
  if (boardIdx < 0) return false;
  const walkLimit = Math.max(ENDPOINT_WALK_RADIUS_M, MAX_TRANSFER_WALK_M);
  for (let k = boardIdx; k < stopsArr.length; k++) {
    const laterStop = etaDb.stopList[stopsArr[k]];
    if (!laterStop || !laterStop.location) continue;
    if (distM(laterStop.location, destPoint) <= walkLimit) return true;
  }
  return false;
}

// 計算轉乘評分：100 分為滿分，完全獨立於行程耗時，有賞有罰。
function calculateTransferQualityScore(legs, directExists, isDeepNight, destPoint) {
  let scoreAdjust = 0;
  const rideLegs = legs.filter(l => l.type === "ride");

  // 能覆蓋行程起終點的直達車：全程淨係一程車，唔使轉乘
  if (rideLegs.length === 1 && directExists) {
    scoreAdjust += TQS_BONUS_DIRECT;
  }

  let prevCompany = null;
  let prevRideLeg = null;

  legs.forEach((leg, idx) => {
    if (leg.type === "walk") {
      const isTransferWalk = !directExists && idx > 0 && idx < legs.length - 1;
      if (isTransferWalk) {
        const fromStop = leg.fromStopId ? etaDb.stopList[leg.fromStopId] : null;
        const toStop = leg.toStopId ? etaDb.stopList[leg.toStopId] : null;
        const isSameGroupWalk = isSameTransferPoint(fromStop, toStop);
        const isOfficialWalk = isOfficialInterchangeName(fromStop?.name?.zh || "") ||
                                isOfficialInterchangeName(toStop?.name?.zh || "");
        // 無謂步行：轉乘步行揀咗一個唔屬於官方轉車站、亦唔屬於同一轉乘
        // 點/站群嘅站去轉車，純粹搜尋行去另一個唔相干嘅站，屬於無謂駁腳。
        if (!isSameGroupWalk && !isOfficialWalk) {
          scoreAdjust -= TQS_PENALTY_UNNECESSARY_WALK;
        }
      }
      return;
    }

    // leg.type === "ride"
    if (prevCompany !== null) {
      const isRedundantTransfer = _legRouteAlreadyReachesDestination(prevRideLeg, destPoint);

      if (isRedundantTransfer) {
        // 深夜取消轉乘及跨公司懲罰
        if (!isDeepNight) scoreAdjust -= TQS_PENALTY_REDUNDANT_TRANSFER;
        // 無謂駁腳唔會再攞任何賞分（同站群/官方轉車站/大型站/同公司）
      } else {
        const alightStopObj = prevRideLeg ? etaDb.stopList[prevRideLeg.alightStopId] : null;
        const boardStopObj = etaDb.stopList[leg.boardStopId];
        const alightStopName = alightStopObj?.name?.zh || "";
        const boardStopName = boardStopObj?.name?.zh || "";

        const isOfficialInterchange = isOfficialInterchangeName(alightStopName) || isOfficialInterchangeName(boardStopName);
        const isSameStopGroup = isSameTransferPoint(alightStopObj, boardStopObj);
        // 站群本身路線好多（唔理有冇特別命名），都當佢係大型轉車站
        const isLargeInterchange = isDataDrivenHubStop(prevRideLeg?.alightStopId) || isDataDrivenHubStop(leg.boardStopId);
        const isSameCompany = transferCompanyGroupId(leg.co) === transferCompanyGroupId(prevCompany);
        // 【修正二】聯營路線（一條路線本身由幾間公司夾埋一齊營運，例如
        // 城巴/新巴聯營、九巴/龍運聯營）嘅 leg.co／primaryCo 淨係揀咗其
        // 中一間公司做代表，唔反映真正嘅「呢步轉車係唔係跨公司」——用呢
        // 個代表 co 嚟判斷 isSameCompany，攞嚟加分或減分都冧唔到道理
        // （例如同一程聯營路線,可能純粹因為評估時揀咗唔同代表 co,就分別
        // 撞正「同公司」或者「跨公司」,結果同一個轉車位竟然可以因為代表
        // co 揀法唔同而評分唔一樣）。只要轆前／後任何一程本身係聯營路線
        // （companies.length > 1），呢一步轉車就完全唔應該因為代表 co
        // 啱唔啱而加或減分，一律中立處理（其他同轉車質性無關嘅賞分，例
        // 如官方轉車站／同站群／大型轉車站，唔受影響）。
        const isJointRouteTransfer =
          (Array.isArray(prevRideLeg?.companies) && prevRideLeg.companies.length > 1) ||
          (Array.isArray(leg?.companies) && leg.companies.length > 1);

        if (isOfficialInterchange) scoreAdjust += TQS_BONUS_OFFICIAL_INTERCHANGE;
        if (isSameStopGroup) scoreAdjust += TQS_BONUS_SAME_STOP_GROUP;
        if (isLargeInterchange) scoreAdjust += TQS_BONUS_LARGE_INTERCHANGE;
        if (isSameCompany && !isJointRouteTransfer) scoreAdjust += TQS_BONUS_SAME_COMPANY;

        // 次程路線能直達終點：轉呢一程之後就唔會再需要轉第三程，避免
        // 無謂轉車。
        const isNextLegDirectToDest = _legRouteCanReachDestinationDirectly(leg, destPoint);
        if (isNextLegDirectToDest) scoreAdjust += TQS_BONUS_NEXT_LEG_DIRECT_TO_DEST;

        // 非必要跨公司轉乘：官方轉車站／BBI 轉乘站＝「從區內前往位於區內
        // 轉車站」，豁免呢項罰分；深夜同樣豁免；聯營路線（見上面
        // isJointRouteTransfer 註解）亦豁免。
        if (!isSameCompany && !isOfficialInterchange && !isDeepNight && !isJointRouteTransfer) {
          scoreAdjust -= TQS_PENALTY_CROSS_COMPANY;
        }
      }
    }

    prevCompany = leg.co;
    prevRideLeg = leg;
  });

  return Math.max(TQS_MIN, Math.min(TQS_MAX, scoreAdjust));
}

// 轉車站群感知上車站搜尋
function _groupBoardIndices(r, co, boardStopId) {
  const stops = r && r.stops ? r.stops[co] : null;
  if (!stops || !etaDb || !etaDb.stopList) return [];
  const anchorStop = etaDb.stopList[boardStopId];
  const out = [];
  const seenStopIds = new Set();
  stops.forEach((stopId, idx) => {
    if (!stopId || seenStopIds.has(stopId)) return;
    if (stopId === boardStopId) {
      out.push({ idx, stopId });
      seenStopIds.add(stopId);
      return;
    }
    const s = etaDb.stopList[stopId];
    if (anchorStop && s && isSameTransferPoint(anchorStop, s)) {
      out.push({ idx, stopId });
      seenStopIds.add(stopId);
    }
  });
  return out;
}

// 檢查某條路線喺附近時段內係咪有班次

// freq 日子類型判定某日子係否官方公佈嘅公眾假期
function _isDesignatedPublicHoliday(when) {
  if (!routeFareDb || !Array.isArray(routeFareDb.holidays)) return false;
  const yyyy = when.getFullYear();
  const mm = String(when.getMonth() + 1).padStart(2, '0');
  const dd = String(when.getDate()).padStart(2, '0');
  return routeFareDb.holidays.includes(`${yyyy}${mm}${dd}`);
}

// 【freq 日子類型核實，加強版】routeFareList.min.json 入面 freq 嘅最外層
// 「日子類型」key，原來因應唔同巴士公司嘅爬蟲寫法，其實有兩種完全唔同
// 嘅格式：
//   1) 文字格式：部分公司直接寫 "weekday"/"saturday"/"sunday"/"holiday"
//      呢類可讀字串。
//   2) 數字 bitmask 格式（用戶提供咗實際數據反推確認）：例如城巴 1 號線
//      嘅 freq key 係 "287"/"288"/"448"，同官方時間表（06:00-18:35
//      15-20分鐘／18:35-23:00 20-25分鐘 = 平日；06:00-10:00 20分鐘／
//      10:00-19:00 12-15分鐘／19:00-23:00 20-25分鐘 = 星期六；06:00-19:00
//      15-20分鐘／19:00-23:00 20-25分鐘 = 星期日及公眾假期）逐段核對後，
//      得出嚴格對應嘅位元定義：
//        bit0 (1)   = 星期一      bit4 (16)  = 星期五
//        bit1 (2)   = 星期二      bit5 (32)  = 星期六
//        bit2 (4)   = 星期三      bit6 (64)  = 星期日
//        bit3 (8)   = 星期四      bit7 (128) = 公眾假期
//      287 = 1+2+4+8+16+256 = 星期一至五（+256 係三個範例都出現嘅固定
//      基數，同日子判斷無關，判斷時要 &0xFF 篩走佢先比對）；
//      288 = 32+256 = 星期六；
//      448 = 64+128+256 = 星期日＋公眾假期（合併做一個 block，同官方
//      時間表「星期日及公眾假期」呢個分類完全對應）。
function _resolveFreqDayTypeKey(freq, when) {
  if (!freq) return null;
  const dayTypes = Object.keys(freq);
  if (!dayTypes.length) return null;

  const day = when.getDay(); // 0 = 星期日, 1 = 星期一, ..., 6 = 星期六

  // 1. 文字格式處理（如 "weekday", "saturday", "sunday", "holiday" 等）
  let textKey = null;
  if (day === 0) {
    textKey = dayTypes.find(k => /sun|holiday/i.test(k));
  } else if (day === 6) {
    textKey = dayTypes.find(k => /sat/i.test(k)) || dayTypes.find(k => /weekend|holiday/i.test(k));
  } else {
    textKey = dayTypes.find(k => /weekday|normal/i.test(k)) || dayTypes.find(k => /mon|tue|wed|thu|fri/i.test(k));
  }
  if (textKey) return textKey;

  // 2. 檢查是否全為數字 Bitmask 格式
  const allNumeric = dayTypes.every(k => /^\d+$/.test(k));
  if (!allNumeric) return null;

  // 位元定義:
  // bit0(1) = 一, bit1(2) = 二, bit2(4) = 三, bit3(8) = 四, bit4(16) = 五, bit5(32) = 六, bit6(64) = 日, bit7(128) = 公眾假期
  const DOW_BIT = [64, 1, 2, 4, 8, 16, 32]; // 索引對應 Date.getDay()
  const dowBit = DOW_BIT[day];
  const isHoliday = _isDesignatedPublicHoliday(when);

  // 解析所有 Key 並以 & 0xFF 取得純 8-bit 遮罩（自動消除 256 基數）
  const parsedKeys = dayTypes.map(k => ({
    key: k,
    mask: parseInt(k, 10) & 0xff
  }));

  // 計算設定的 Bit 數（用於精確度排序，包含越少非相關日子的 Block 優先）
  const countBits = (n) => {
    let count = 0;
    let val = n;
    while (val > 0) {
      if (val & 1) count++;
      val >>= 1;
    }
    return count;
  };

  // 情境 A：今日係公眾假期
  if (isHoliday) {
    // 優先 1：尋找有 set 128 bit (公眾假期) 的 Key（如 448 [192], 480 [224], 511 [255]）
    const holidayKeys = parsedKeys.filter(item => (item.mask & 128) === 128);
    if (holidayKeys.length > 0) {
      holidayKeys.sort((a, b) => countBits(a.mask) - countBits(b.mask));
      return holidayKeys[0].key;
    }

    // 優先 2：若沒有任何 Key set 128 bit（例如小巴只有 "31" [平日] 和 "96" [六日/假期]）
    // 假期自動降級套用包含 星期日 (64) 或 星期六 (32) 的假日 Block
    const weekendOrSunKeys = parsedKeys.filter(item => (item.mask & (64 | 32)) > 0);
    if (weekendOrSunKeys.length > 0) {
      weekendOrSunKeys.sort((a, b) => countBits(a.mask) - countBits(b.mask));
      return weekendOrSunKeys[0].key;
    }
  }

  // 情境 B：非公眾假期
  // 優先 1：符合今日星期幾 (dowBit)，且沒有 set 128 bit（避免平峰期誤配假期專用 Block）
  const strictDowKeys = parsedKeys.filter(item => (item.mask & dowBit) === dowBit && (item.mask & 128) === 0);
  if (strictDowKeys.length > 0) {
    strictDowKeys.sort((a, b) => countBits(a.mask) - countBits(b.mask));
    return strictDowKeys[0].key;
  }

  // 優先 2：放寬條件，只要包含今日 dowBit 即可（例如正常星期日匹配 448 [192]，或每日服務 511 [255]）
  const anyDowKeys = parsedKeys.filter(item => (item.mask & dowBit) === dowBit);
  if (anyDowKeys.length > 0) {
    anyDowKeys.sort((a, b) => countBits(a.mask) - countBits(b.mask));
    return anyDowKeys[0].key;
  }

  return null;
}

// 【freq 數值格式核實】routeFareList.min.json 嘅 freq 內層，每個時段 key
// 對應嘅值，用戶提供咗實際 API 回應確認真正格式係一個陣列
// [結束時間字串, 班距秒數字串]，例如 "0600": ["0720", "1200"] 代表
// 06:00-07:20 呢一段，班距係 1200 秒（= 20 分鐘），唔係之前程式碼一直
// 假設嗰種「15-20」直接寫明分鐘範圍嘅字串。
function _freqEntryToMinutes(entry) {
  if (entry == null) return null;
  if (Array.isArray(entry)) {
    const headwaySecs = Number(entry[1]);
    if (Number.isFinite(headwaySecs) && headwaySecs > 0) {
      return Math.max(1, Math.round(headwaySecs / 60));
    }
    return null;
  }
  const nums = String(entry).match(/\d+/g);
  if (!nums) return null;
  return Math.max(...nums.map(Number));
}

// 【共用、修正「null 值」同「搵唔到」混淆嘅根本 bug】routeFareList.min.json
// 嘅 freq 內層，每個時段 key 對應嘅值，其實有兩種完全唔同嘅語義（用戶提供
// 咗 E42／N281／N42 嘅實際數據反推確認）：
//   1) 陣列 [結束時間, 班距秒數]：呢個 key 代表一個「由 key 到結束時間」嘅
//      連續行車時段，程入面每隔「班距秒數」就有一班車（例如 E42 嘅
//      "0530": ["0710","1200"] = 05:30-07:10 呢段，每 1200 秒＝20 分鐘一班）。
//   2) null：呢個 key 本身就係一個獨立、已知嘅實際開車時刻，唔存在「班距」
//      呢回事——常見於通宵線、每日得兩三班嘅超低頻路線。例如 N42（耀安→
//      東涌）成日淨係 "0350": null 同 "0450": null 兩個 key，代表淨係得
//      呢兩班車，唔係一個由 03:50 開始、每隔某個班距一班嘅時段。
//
// 舊寫法一律用 `matchedEntry = table[key]` 之後淨係靠 `matchedEntry == null`
// 判斷「有冇搵到啱嘅時段」——完全冇考慮到「搵到咗個 key、但佢個值本身合法
// 咁就係 null（即上面情況 2 嘅獨立班次）」同「乜嘢 key 都冇搵到」根本係
// 兩回事，前者被誤判做後者，跌落去攞完全唔啱嘅「保底估算」邏輯，就係
// 分站時間亂晒、深夜／清晨顯示唔存在班次嘅根本原因。而家用明確嘅「揾到
// 未揾到」控制流程（唔靠值嘅 truthy/falsy）,並且將「陣列時段」同「null
// 單點」分開處理，各自用返啱嘅語義：
//   - 陣列時段：而家啱啱好跌喺呢個時段入面 = 即刻開始等，等候時間 = 呢個
//     時段嘅班距；
//   - null 單點：呢個 key 本身就已經係實際開車時刻，唔使再加任何班距
//     估算，只要計返「距離呢一刻仲有幾耐」就得（如果已經過咗，就搵下一個
//     未過嘅單點／時段）。
// 傳返 { etaDate, isFutureBlock, isPointDeparture } 或者 null
// （代表喺呢個 lookaheadMin 範圍內，今日確實冇更多已知班次）。
function _nextGridDeparture(blockStartMins, headwayMins, nowMins) {
  const elapsed = nowMins - blockStartMins;
  const steps = Math.ceil(elapsed / headwayMins);
  return blockStartMins + Math.max(0, steps) * headwayMins;
}

function _toMinutes(timeStr) {
  if (!timeStr) return 0;
  const s = String(timeStr).padStart(4, '0');
  const hh = parseInt(s.substring(0, s.length - 2), 10) || 0;
  const mm = parseInt(s.substring(s.length - 2), 10) || 0;
  return hh * 60 + mm;
}

function _computeFreqDeparture(table, now, lookaheadMin) {
  if (!table) return null;
  const keys = Object.keys(table);
  if (!keys.length) return null;

  const nowMins = now.getHours() * 60 + now.getMinutes();
  const sortedKeys = keys.slice().sort((a, b) => _toMinutes(a) - _toMinutes(b));

  // 【唔再「搵到第一個岩就即刻 return」】sortedKeys 係按鐘面時間排序（例如
  // 0600 排喺 2300 之前），但如果最後一個時段跨咗午夜（例如尾班車時段
  // "2300": ["0100",...]，代表 23:00 至翌日 01:00），喺凌晨查詢嗰陣，真正
  // 生效緊嘅正正係呢一段排得最後嘅時段，但按列表順序行落去之前，會俾一個
  // 排得前啲、其實仲未開始嘅日頭時段（例如 0600 嗰段）當成「未來第一個
  // 時段」提早 return 咗。所以而家逐個 key 都收集齊晒合資格嘅候選，最後
  // 先揀「等候時間最短」嗰一個，唔受列表排序影響。
  let best = null; // { diffMins, etaDate, isFutureBlock, isPointDeparture }
  const consider = (diffMins, isFutureBlock, isPointDeparture) => {
    if (diffMins < 0 || diffMins > lookaheadMin) return;
    if (!best || diffMins < best.diffMins) {
      best = {
        diffMins,
        etaDate: new Date(now.getTime() + diffMins * 60000),
        isFutureBlock,
        isPointDeparture
      };
    }
  };

  for (let i = 0; i < sortedKeys.length; i++) {
    const startKey = sortedKeys[i];
    const entry = table[startKey];

    let startMins = _toMinutes(startKey);
    let endMins = 0;
    let headwayMins = 20;

    if (Array.isArray(entry)) {
      // 解析 ["1920", "1200"] 格式 -> [結束時間字串, 班距秒數]
      endMins = _toMinutes(entry[0]);
      // 修正跨午夜時段
      if (endMins <= startMins) endMins += 24 * 60;
      headwayMins = Math.max(1, Math.round(Number(entry[1]) / 60));
    } else if (typeof entry === 'string' || typeof entry === 'number') {
      headwayMins = _freqEntryToMinutes(entry) || 20;
      const nextKey = i < sortedKeys.length - 1 ? sortedKeys[i + 1] : null;
      endMins = nextKey ? _toMinutes(nextKey) : 1440;
    } else if (entry === null) {
      // 處理單點定時班次 (如通宵線/特別班)
      if (startMins >= nowMins) {
        consider(startMins - nowMins, true, true);
      }
      continue;
    }

    let effectiveNowMins = null;
    if (nowMins >= startMins && nowMins < endMins) {
      effectiveNowMins = nowMins;
    } else if (endMins > 1440 && (nowMins + 1440) >= startMins && (nowMins + 1440) < endMins) {
      effectiveNowMins = nowMins + 1440;
    }

    if (effectiveNowMins !== null) {
      const elapsed = effectiveNowMins - startMins;
      const steps = Math.ceil(elapsed / headwayMins);
      const nextDepMins = startMins + steps * headwayMins;

      // 若算出的班次已超出該區間 endMins，絕不向外推演，直接跳至下個時段
      if (nextDepMins < endMins) {
        consider(nextDepMins - effectiveNowMins, false, false);
      }
      continue;
    }

    // 當前時間尚未到達該時段（未來第一個時段）
    if (nowMins < startMins) {
      consider(startMins - nowMins, true, false);
    }
  }

  // 找不到任何符合的時間區間，直接返回 null，不進行任何臆測或虛假班次補算
  if (!best) return null;
  return {
    etaDate: best.etaDate,
    isFutureBlock: best.isFutureBlock,
    isPointDeparture: best.isPointDeparture
  };
}

// 【serviceType 兄弟變體：索引建立】喺 etaDb.routeList 已經齊全（包括
// loadRouteFareData() 有可能額外補入嘅路線）之後，將每一條 route 物件
// 按「路線編號＋營辦商＋方向」分組。同一個分組入面嘅物件，即係同一條
// 路線、同一個方向、唔同 serviceType 嘅變體。
function _routeBoundValue(r, co) {
  if (!r || !r.bound) return "";
  return (typeof r.bound === "object") ? (r.bound[co] || "") : (r.bound || "");
}

function _routeSiblingKey(routeNo, co, boundVal) {
  return `${String(routeNo || "").toUpperCase()}|${co}|${boundVal || ""}`;
}

function buildRouteSiblingIndex() {
  if (!etaDb || !etaDb.routeList) return;
  routeSiblingIndex = new Map();
  for (const r of Object.values(etaDb.routeList)) {
    if (!r || !r.route || !Array.isArray(r.co)) continue;
    for (const co of r.co) {
      if (!r.stops || !r.stops[co] || !r.stops[co].length) continue;
      const key = _routeSiblingKey(r.route, co, _routeBoundValue(r, co));
      if (!routeSiblingIndex.has(key)) routeSiblingIndex.set(key, []);
      routeSiblingIndex.get(key).push(r);
    }
  }
}

// 搵返同一個路線編號＋方向＋營辦商底下，其他有停靠 boardStopId 嘅
// serviceType 兄弟變體（唔包括 r 本身）。冇 boardStopId 就放寬做「淨係
// 排走 r 本身」，交由 caller（例如冇分站資訊嘅呼叫情況）自行決定點用。
function _findSiblingRoutesForStop(r, co, boardStopId) {
  if (!routeSiblingIndex || !r) return [];
  const key = _routeSiblingKey(r.route, co, _routeBoundValue(r, co));
  const list = routeSiblingIndex.get(key);
  if (!list || !list.length) return [];
  return list.filter(sib => {
    if (sib === r) return false;
    if (!boardStopId) return true;
    const sibStops = sib.stops && sib.stops[co];
    return !!(sibStops && sibStops.includes(boardStopId));
  });
}

// 【共用】揾返 r 本身、或者（如果 r 自己嗰個 serviceType 冇資料）佢嘅
// serviceType 兄弟變體入面，喺 atTime 呢一刻真正有得比對嘅 freq 時段表。
// 只有「揾到 dayKey，並且嗰個 dayKey 底下確實有非空嘅時段表」先算「有
// 資料」；如果 r 自己冇（freq 缺失、搵唔到日子類型、或者嗰個日子類型
// 底下係空表），先至去試兄弟變體（限於同樣停靠 boardStopId 嗰啲，避免
// 借用一個根本冇經過呢個站嘅變體嘅班次表）。搵到就連埋來源（source）
// 一齊傳返，等 caller 有需要時可以知道實際係邊一個 serviceType 變體
// 提供緊呢個時段表。搵唔到就傳 null，等 caller 自行決定跌落去乜嘢保底
// 邏輯（例如通宵線冇任何 freq 資料時嘅粗略估算）。
function _resolveEffectiveFreqTable(r, atTime, boardStopId, primaryCo) {
  if (!r) return null;
  const co = primaryCo || r.primaryCo || (Array.isArray(r.co) ? r.co[0] : null);

  const tryOne = (candidate) => {
    if (!candidate || !candidate.freq) return null;
    const dayKey = _resolveFreqDayTypeKey(candidate.freq, atTime);
    if (!dayKey) return null;
    const table = candidate.freq[dayKey];
    if (!table || !Object.keys(table).length) return null;
    return table;
  };

  const ownTable = tryOne(r);
  if (ownTable) return { table: ownTable, source: r };

  if (!co) return null;
  const siblings = _findSiblingRoutesForStop(r, co, boardStopId);
  for (const sib of siblings) {
    const table = tryOne(sib);
    if (table) return { table, source: sib };
  }
  return null;
}

// 【班次估算 - 合併全部 serviceType 變體】_resolveEffectiveFreqTable() 本身
// 只會喺 r 自己嗰個 serviceType 完全冇 freq 資料先去揾第一個搵到嘅兄弟
// 變體頂住，一旦 r 自己有 freq（哪怕淨係得好疏嘅班距），就永遠唔會理其他
// 兄弟變體嘅班次表——但同一個路線編號＋方向＋公司（例如 11 號線），好多
// 時官方會拆成幾個 serviceType（例如假日特別班、繁忙時間加班、繞經
// 變體），各自得返一份唔完整嘅 freq，實際嗰個站嘅真正候車時間，應該係
// 「呢幾個變體之中，最快到嘅一班」，而唔係死咬住搜尋揀中嗰一個 serviceType
// 嘅班次表。用戶反映東涌等 11 號線去大澉，成程等咗接近一個鐘，但如果連埋
// 11 嘅其他 serviceType 變體嘅 freq 一齊考慮，好可能其中一個變體喺呢個
// 時段其實仲有更密嘅班次。而家新增呢個函數，攞返 r 自己（如果有資料）＋
// 全部有停靠 boardStopId 嘅兄弟變體嘅 freq 表（唔止揾到第一個就停），
// 等 caller 可以逐個表計出候車時間，揀返全部之中最快嘅一班。
function _resolveAllEffectiveFreqTables(r, atTime, boardStopId, primaryCo) {
  if (!r) return [];
  const co = primaryCo || r.primaryCo || (Array.isArray(r.co) ? r.co[0] : null);
  const results = [];

  const tryOne = (candidate) => {
    if (!candidate || !candidate.freq) return null;
    const dayKey = _resolveFreqDayTypeKey(candidate.freq, atTime);
    if (!dayKey) return null;
    const table = candidate.freq[dayKey];
    if (!table || !Object.keys(table).length) return null;
    return table;
  };

  const ownTable = tryOne(r);
  if (ownTable) results.push({ table: ownTable, source: r });

  if (co) {
    const siblings = _findSiblingRoutesForStop(r, co, boardStopId);
    for (const sib of siblings) {
      const table = tryOne(sib);
      if (table) results.push({ table, source: sib });
    }
  }
  return results;
}

// 【班次估算 - 合併全部變體之中最快一班】用上面攞返嘅一批 freq 表，逐個
// call _computeFreqDeparture()，揀返「等候時間最短」嗰一個結果（連埋佢
// 嘅 source route 物件一齊傳返，等 caller 需要嘅話知道實際係邊個
// serviceType 變體提供緊呢班車）。搵唔到就傳 null。
function _computeEarliestFreqDeparture(tables, now, lookaheadMin) {
  let best = null; // { etaDate, isFutureBlock, isPointDeparture, source }
  for (const { table, source } of tables) {
    const result = _computeFreqDeparture(table, now, lookaheadMin);
    if (!result) continue;
    if (!best || result.etaDate < best.etaDate) {
      best = { ...result, source };
    }
  }
  return best;
}

function isRouteActiveAroundTime(r, atTime, boardStopId = null, windowMin = 90) {
  if (!r || !atTime) return false;
  
  // 1. 如果資料庫的路線已區分 service_type 且 freq 綁定在變體上
  // 我們需要確保目前查詢的 boardStopId 真的屬於這個變體的營運區間
  // 【修正】以前呢度淨係睇 r.stops[r.primaryCo]（單一公司變體）有冇
  // 呢個站，如果 boardStopId 淨係存在喺呢條路線嘅另一個公司變體
  // （同「改善上車步行距離估算」／stopRouteIndex 之前撞到嗰個 bug
  // 一模一樣嘅成因），就會誤判做「呢個站根本唔屬於呢條路線」，直接
  // return false——喺 beam search 嗰步造成緊「呢個上車站對呢條路線
  // 完全靜靜雞消失」，連 evaluateCandidate 都未行到就已經冚咗，亦都
  // 唔會有任何 [候選被淘汰] log（因為個 log 喺 evaluateCandidate 度，
  // 呢度仲未去到嗰步）。而家改為掃晒條路線嘅全部公司變體，唔止睇
  // primaryCo 嗰個。
  if (boardStopId && r.stops) {
    const companiesToCheck = (typeof getCompanies === "function" ? getCompanies(r) : null) || (r.primaryCo ? [r.primaryCo] : []);
    const foundInAnyCo = companiesToCheck.some(co => Array.isArray(r.stops[co]) && r.stops[co].includes(boardStopId));
    if (!foundInAnyCo) return false;
  }

  // 0. 快速核實：就住九巴路線，先用官方路線列表 API（比慢速 GTFS 快）核實
  // 呢個 service_type 變體係咪現時依然存在。搵到明確「唔存在」就即刻當
  // 冇服務，唔使再行落去等 GTFS 逐個 trip 慢慢比對——呢一步專門針對
  // 資料庫入面殘留咗已停辦嘅特別班次變體（例如已取消嘅特別繁忙時間班次）
  // 而導致誤判「有直達車」嘅情況。
  if (r.primaryCo === "kmb" && r.service_type) {
    const liveCheck = isKmbServiceTypeLive(r.route, r.service_type);
    if (liveCheck === false) return false;
  }

  try {
    const freq = r.freq;
    if (freq) {
      const dayTypes = Object.keys(freq);
      if (!dayTypes.length) return true;
    }

    // 【serviceType 兄弟變體】r 自己嗰個 serviceType 嘅 freq 如果冇資料
    // （缺失、搵唔到今日日子類型、或者嗰個日子類型底下係空表），先至去
    // 睇下同一條路線編號＋方向＋營辦商底下，其他有停靠 boardStopId 嘅
    // serviceType 兄弟變體係咪有資料——例如九巴 3M 入向拆開咗
    // serviceType "1"（全程 12 站、全日 freq）同 serviceType "2"（只有
    // 前 8 站、freq 淨係得早上幾個校巴時段）兩個 route 物件，如果搜尋
    // 揀中嗰個係 serviceType "2"，但現時時段唔喺佣 freq 覆蓋範圍內，就
    // 應該問返 serviceType "1"（兩者共用嗰 8 個站）呢個時候係否有服務，
    // 而唔係即刻斷定「呢個站冇服務」。
    const resolved = _resolveEffectiveFreqTable(r, atTime, boardStopId, r.primaryCo);
    if (!resolved) {
      // 連兄弟變體都搵唔到任何有效嘅 freq 資料：如果 r 本身根本冇 freq
      // （常見於主線資料庫收錄唔齊全），保守假設「可能運作」；但如果 r
      // 屬於特別班次變體（r.service_type > 1，例如 A41 繞經國泰城），
      // 冇任何 freq 資料代表冇任何證據話呢個時段佢確實運作，寧願當佢
      // 冇服務，都好過畀一條唔啱嘅特別班次變體隨時當「有直達車」用。
      if (!freq) {
        return !(r.service_type && r.service_type > 1);
      }
      return false;
    }

    // 【修正同一個 null 單點 bug】以往呢度自己另外寫多一份 getIntervalRange
    // 逐個 key 比對嘅邏輯，對 null 單點（見 _computeFreqDeparture 頂部
    // 註解）一樣會誤判做「有一個 60 分鐘闊嘅時段」，令一個單一、獨立嘅
    // 已知開車時刻（例如 N42 尾班車 04:50），被當成「04:50-05:50 呢成
    // 個鐘都算有服務」，同事實唔符。而家改用返同 scheduleFallback／
    // evaluateCandidate 一致嘅 _computeFreqDeparture()，正確分辨陣列時段
    // 同 null 單點，只要佢傳返有效結果（唔理係啱啱好喺時段入面、定係
    // windowMin 之內即將有嘅未來班次），就當呢一刻合理有服務。
    const result = _computeFreqDeparture(resolved.table, atTime, windowMin);
    return !!result;
  } catch (err) {
    return false; 
  }
}

// 判定起點附近與終點附近是否存在任何一條直達巴士路線
// 判定範圍統一為起點半徑 650 米，唔再按車程遠近分長途／極長途另外調整。
// atTime：指定搜尋時間點，用嚟檢查「現時時段內」係咪真係有直達班次運作（見上面 isRouteActiveAroundTime）
function hasDirectService(orig, dest, atTime = null) {
  if (!etaDb || !stopRouteIndex || !orig || !dest) return false;

  const directCheckRadiusM = ENDPOINT_WALK_RADIUS_M;

  // 獲取起訖點半徑範圍內的所有站點
  const originStops = [{ stopId: orig.stopId, dist: 0 }]
    .concat(nearbyStops(orig.lat, orig.lng, directCheckRadiusM))
    .map(s => s.stopId);
  const uniqueOriginStops = [...new Set(originStops)];

  const destStops = [{ stopId: dest.stopId, dist: 0 }]
    .concat(nearbyStops(dest.lat, dest.lng, directCheckRadiusM))
    .map(s => s.stopId);
  const uniqueDestStops = [...new Set(destStops)];

  // 掃描是否存在直達路線
  for (const origId of uniqueOriginStops) {
    const origRoutes = stopRouteIndex.get(origId) || [];
    for (const origRoute of origRoutes) {
      const r = etaDb.routeList[origRoute.routeId];
      if (!r) continue;
      
      const companies = getCompanies(r);
      for (const co of companies) {
        const stops = r.stops[co];
        if (!stops) continue;
        const oIdx = stops.indexOf(origId);
        if (oIdx === -1) continue;
        
        for (const destId of uniqueDestStops) {
          const dIdx = stops.indexOf(destId);
          // 必須在同一條路線中，且起點在終點之前
          if (dIdx !== -1 && oIdx < dIdx) {
            // 只計現時時段內確實有運作嘅直達班次，
            if (atTime && !isRouteActiveAroundTime(r, atTime, origId)) continue;
            return true; 
          }
        }
      }
    }
  }
  return false;
}

async function calculateRouteScore(legs, searchTime) {
  if (!legs || legs.length === 0) return { actualDuration: 0, score: Infinity, transferQualityScore: 0, transferCount: 0 };
  
  // 定義深夜時段 (00:00-06:00)
  const tripStartTime = legs[0].departTime;
  const isDeepNight = tripStartTime.getHours() >= 0 && tripStartTime.getHours() < 6;

  // 判定是否存在現時時段內實際運作嘅直達服務
  const safeOrigin = origin || { name: "", lat: 0, lng: 0 };
  const safeDestination = destination || { name: "", lat: 0, lng: 0 };
  const directExists = hasDirectService(origin, destination, searchTime || tripStartTime);

  let transferCount = legs.filter(l => l.type === "ride").length - 1;
  if (transferCount < 0) transferCount = 0;

  const startTime = legs[0].departTime;
  const endTime = legs[legs.length - 1].arriveTime;
  const actualDuration = (endTime - startTime) / 60000; 
  
  const waitTime = searchTime ? Math.max(0, (startTime - searchTime) / 60000) : 0;
  const totalMinutes = actualDuration + waitTime;

  // ---- 耗時分數：只反映時間快慢，唔再混入轉乘判斷嘅賞罰 ----
  let score = Math.ceil(totalMinutes / 5) * 0.5;

  // 起點/終點嘅步行（唔係轉乘步行）辛苦程度按分鐘數額外計落耗時分數，
  // 呢個純粹反映「行路 vs 搭車」邊個辛苦啲，同轉乘質性判斷無關，維持
  // 喺呢度獨立計算。
  legs.forEach((leg, idx) => {
    if (leg.type !== "walk") return;
    const isTransferWalk = !directExists && (idx > 0 && idx < legs.length - 1);
    if (!isTransferWalk) {
      score += leg.minutes * WALK_PENALTY_MULTIPLIER;
    }
  });

  // ---- 轉乘質性評分：100 分為滿分，完全獨立於耗時（見上面「轉乘質性
  // 評分機制」說明），有賞有罰，唔會影響 score，避免拖累/提早淘汰好方案 ----
  const transferQualityScore = calculateTransferQualityScore(
    legs, directExists, isDeepNight, { lat: safeDestination.lat, lng: safeDestination.lng }
  );

  const isLantau = computeIsLantauTrip(safeOrigin, safeDestination);
  
  // === 判定北大嶼山本地行程 ===
  const isLocalTCOrAirport = isLantau && isTungChungOrAirportLocal(safeOrigin, safeDestination);

  // === 大嶼山路線評分邏輯（車型/路線偏好，不屬於轉乘判斷，維持獨立計落 score） ===
  if (isLantau) {
    legs.forEach(leg => {
      if (leg.type !== "ride") return;
      if (isLocalTCOrAirport) {
        const isERoute = /^E\d+/i.test(leg.routeNo) && !/^E21/i.test(leg.routeNo);
        const isCityboundE = isERoute && leg.r && !LANTAU_KEYWORDS.test(leg.r.dest?.zh || "");
        const isSouthLantauRoute = /^(3M|11|23)$/i.test(leg.routeNo);
        const isSouthLantauOutbound = isSouthLantauRoute && leg.r && !/東涌|機場/i.test(leg.r.dest?.zh || "");

        if (isCityboundE || isSouthLantauOutbound) {
          score += 10; 
        }
      } else {
        const alightStopName = etaDb.stopList[leg.alightStopId]?.name?.zh || "";
        const isLantauGatewayInterchange = /青嶼幹線|屯門赤鱲角隧道/i.test(alightStopName);
        const isCityboundAE = /^[AE]/i.test(leg.routeNo) && leg.r && !LANTAU_KEYWORDS.test(leg.r.dest?.zh || "");
        const isExemptGateway = isLantauGatewayInterchange && isCityboundAE;

        const isPreferred = /^E21/i.test(leg.routeNo) || /^S/i.test(leg.routeNo) || leg.co === "nlb" || isExemptGateway;
        if (!isPreferred) {
          score += 40; 
        }
      }
    });
  }

// 如果用戶設定排序準則為車費，分數計算權重轉化為以車費為主，時間為次
  if (sortMode === "fare") {
    const rideLegsForScore = legs.filter(l => l.type === "ride");
    const fareResultForScore = await computeTripFare(rideLegsForScore);
    // 冇齊車費資料嘅組合，車費排序時要排到最後，唔應該當佢係 0 蚊而錯誤排前
    score = (typeof fareResultForScore.totalFare === "number" ? fareResultForScore.totalFare : 9999) * 10 + actualDuration * 0.1;
  }

  return { actualDuration, score, transferQualityScore, transferCount };
}

/* ---------------- Trip detection ---------------- */
const LANTAU_KEYWORDS = /機場|東涌|迪士尼|博覽館|港珠澳|大嶼山|赤鱲角|國泰城|航天城|後勤區|飛機|大澳|梅窩|塘福|石壁|石門甲|昂坪|愉景灣|欣澳|東邨|東薈城|空運|航空|大橋香港口岸|客運大樓|貨運站|地面運輸中心|維修區/i;
const OFFICIAL_INTERCHANGE_REGEX = /轉車站|轉乘站|城門隧道|大欖隧道|大老山隧道|獅子山隧道|青沙公路|屯門公路|粉嶺公路|將軍澳隧道|啟德隧道|西區海底隧道|海底隧道|東區海底隧道|青嶼幹線|屯門赤鱲角隧道|將藍隧道|香港仔隧道/i;

// 九巴路線，引用轉車站名單（kmb_bbi_stop_id.json）擴充官方轉車站嘅判斷。
let kmbBbiInterchangeNames = new Set();
function buildKmbBbiInterchangeNames(kmbBbiStopDb) {
  kmbBbiInterchangeNames = new Set();
  if (!kmbBbiStopDb) return;
  for (const entries of Object.values(kmbBbiStopDb)) {
    if (!Array.isArray(entries)) continue;
    for (const e of entries) {
      const zh = (e && e.zh) ? cleanStopName(e.zh) : "";
      if (zh) kmbBbiInterchangeNames.add(zh);
    }
  }
}
function isOfficialInterchangeName(name) {
  if (!name) return false;
  if (OFFICIAL_INTERCHANGE_REGEX.test(name)) return true;
  if (!kmbBbiInterchangeNames.size) return false;
  const cleaned = cleanStopName(name);
  if (!cleaned) return false;
  for (const bbiName of kmbBbiInterchangeNames) {
    if (cleaned.includes(bbiName) || bbiName.includes(cleaned)) return true;
  }
  return false;
}

function isLantauCoord(lat, lng){
  return lat >= 22.19 && lat <= 22.36 && lng >= 113.83 && lng <= 114.06;
}
function computeIsLantauTrip(origin, destination){
  if (LANTAU_KEYWORDS.test(origin.name) || LANTAU_KEYWORDS.test(destination.name)) return true;
  if (isLantauCoord(origin.lat, origin.lng) || isLantauCoord(destination.lat, destination.lng)) return true;
  return false;
}

const HK_ISLAND_KEYWORDS = /中環|金鐘|灣仔|銅鑼灣|天后|炮台山|北角|鰂魚涌|太古|西灣河|筲箕灣|柴灣|小西灣|堅尼地城|西營盤|香港大學|薄扶林|數碼港|香港仔|黃竹坑|鴨脷洲|海洋公園|赤柱|淺水灣|跑馬地|大坑/i;

function isHKIslandCoord(lat, lng){
  return lat >= 22.19 && lat <= 22.30 && lng >= 114.11 && lng <= 114.27;
}

function computeIsCrossHarbourTrip(orig, dest){
  const origHKI = HK_ISLAND_KEYWORDS.test(orig.name) || isHKIslandCoord(orig.lat, orig.lng);
  const destHKI = HK_ISLAND_KEYWORDS.test(dest.name) || isHKIslandCoord(dest.lat, dest.lng);
  return origHKI !== destHKI;
}

// 【落車半徑統一為 750 米】以前呢個 function 會按地區分開兩檔（港島／
// 九龍 500 米，新界及離島 700 米），原意係市區站密啲、行少啲都夠。
// 但實際上市區路線好多時都唔係逢街逢巷都有巴士站覆蓋，一劃到 500 米
// 就會逼行程為咗「唔想落車行多兩步」而加插一次本身完全冇必要嘅轉車
// ——結果換嚟嘅唔係更方便，而係多咗一程車、多等一次車。而家唔再分
// 地區，統一用返 750 米呢一個較寬鬆嘅落車步行半徑，等落車站選擇更貼
// 近實際市區覆蓋情況，亦避免純粹為咗遷就落車步行距離而產生嘅無謂轉車。
function getRegionWalkLimit(lat, lng, name) {
  return 750;
}

// 判定行程是否屬於「東涌市中心內」或「來往機場」的本地行程
function isTungChungOrAirportLocal(orig, dest) {
  if (!orig || !dest) return false;
  
  // 東涌各屋邨及機場相關關鍵字
  const localKeywords = /東涌|逸東|滿東|迎東|裕雅|富東|裕東|映灣園|藍天海岸|昇薈|東環|機場|博覽館|航天城|國泰城|後勤區|飛機維修區|民航處|客運大樓|地面運輸中心/i;
  
  // 北大嶼山本地（東涌及機場）的經緯度範圍
  const isLocalCoord = (lat, lng) => lat >= 22.27 && lat <= 22.34 && lng >= 113.88 && lng <= 113.97;
  
  const origLocal = localKeywords.test(orig.name) || isLocalCoord(orig.lat, orig.lng);
  const destLocal = localKeywords.test(dest.name) || isLocalCoord(dest.lat, dest.lng);
  
  return origLocal && destLocal;
}

/* ---------------- 車費計算 ---------------- */
function isHolidayFareDate(when) {
  const w = when || new Date();
  if (w.getDay() === 0) return true; // 星期日普遍當假日收費
  if (!routeFareDb || !Array.isArray(routeFareDb.holidays)) return false;
  const yyyy = w.getFullYear();
  const mm = String(w.getMonth() + 1).padStart(2, '0');
  const dd = String(w.getDate()).padStart(2, '0');
  return routeFareDb.holidays.includes(`${yyyy}${mm}${dd}`);
}

function _fareNameNorm(s) {
  return String(s || "")
    .replace(/\(.*?\)|（.*?）/g, "")   // 去除括住嘅備註，例如「(拍卡機設於翠寧花園)」
    .replace(/[\s　]/g, "")
    .trim();
}

// 港鐵巴士全程劃一收費
function buildMtrBusFareIndex(mtrBusRoutesJson) {
  const out = {};
  if (!mtrBusRoutesJson || typeof mtrBusRoutesJson !== "object") return out;
  for (const rec of Object.values(mtrBusRoutesJson)) {
    if (!rec || !rec.route) continue;
    const bound = (rec.bound && rec.bound["mtr-bus"]) || "O";
    const fares = Array.isArray(rec.fares) ? rec.fares.map(parseFloat).filter(Number.isFinite) : [];
    const faresHol = Array.isArray(rec.faresHoliday) ? rec.faresHoliday.map(parseFloat).filter(Number.isFinite) : [];
    if (!fares.length) continue;
    const flatFare = fares[0];
    const flatFareHol = faresHol.length ? faresHol[0] : null;
    if (!out[rec.route]) out[rec.route] = {};
    out[rec.route][bound] = { fare: flatFare, fareHoliday: flatFareHol };
  }
  return out;
}

// 九巴短途分段雙向收費
function _findStopIdxByName(stops, targetName) {
  const target = _fareNameNorm(targetName);
  if (!target || !stops) return -1;
  let best = -1;
  for (let i = 0; i < stops.length; i++) {
    const s = etaDb.stopList[stops[i]];
    if (!s) continue;
    const name = _fareNameNorm(s.name?.zh || s.name?.en || "");
    if (!name) continue;
    if (name === target) return i; // 完全相符優先
    if (best === -1 && (name.includes(target) || target.includes(name))) best = i;
  }
  return best;
}

function getRegionalTwoWayFare(r, co, boardIdx, alightIdx) {
  if (!regionalTwoWayFareDb || !Array.isArray(regionalTwoWayFareDb.routes)) return null;
  if (co !== "kmb" && co !== "nlb") return null;
  const routeNo = String(r.route || "").toUpperCase();
  const candidates = regionalTwoWayFareDb.routes.filter(x => String(x.route_number || "").toUpperCase() === routeNo);
  if (!candidates.length) return null;
  const stops = (r.stops && (r.stops[co] || r.stops[r.primaryCo])) || null;
  if (!stops) return null;

  let bestFare = null;
  for (const cand of candidates) {
    const idxA = _findStopIdxByName(stops, cand.start);
    const idxB = _findStopIdxByName(stops, cand.end);
    if (idxA < 0 || idxB < 0) continue;
    const lo = Math.min(idxA, idxB), hi = Math.max(idxA, idxB);
    // 雙向收費：只要上車同落車都喺呢個範圍之內就適用（唔理方向）
    if (boardIdx >= lo && boardIdx <= hi && alightIdx >= lo && alightIdx <= hi) {
      const f = parseFloat(cand.fare);
      if (Number.isFinite(f) && (bestFare === null || f < bestFare)) bestFare = f;
    }
  }
  return bestFare;
}

function getSegFare(r, co, boardIdx, alightIdx, when) {
  if (!r || boardIdx == null || alightIdx == null || alightIdx <= boardIdx) return null;

const stops = (r.stops && (r.stops[co] || r.stops[r.primaryCo])) || null;

  // 城門隧道轉車站，途經路線必須使用上車站計算優惠的車費
  if (stops && boardIdx + 1 < stops.length) {
    const currentStopId = stops[boardIdx];
    const nextStopId = stops[boardIdx + 1];
    if (currentStopId && nextStopId) {
      const currentName = _fareNameNorm(etaDb.stopList[currentStopId]?.name?.zh || "");
      const nextName = _fareNameNorm(etaDb.stopList[nextStopId]?.name?.zh || "");
      if (currentName.includes("城門隧道轉車站") && nextName.includes("城門隧道轉車站")) {
        boardIdx = boardIdx + 1;
      }
    }
  }

  // 港鐵巴士劃一收費，唔理會上落車站
  if ((co === "mtrb" || co === "mtr-bus") && mtrBusRouteFareDb) {
    const routeEntry = mtrBusRouteFareDb[r.route];
    if (routeEntry) {
      const bound = (r.bound && (r.bound[co] || r.bound.mtrb || r.bound["mtr-bus"])) || Object.keys(routeEntry)[0];
      const info = routeEntry[bound] || routeEntry[Object.keys(routeEntry)[0]];
      if (info) {
        const isHol = isHolidayFareDate(when);
        const v = (isHol && Number.isFinite(info.fareHoliday)) ? info.fareHoliday : info.fare;
        if (Number.isFinite(v)) return Math.round(v * 10) / 10;
      }
    }
  }

  // 九巴短途雙向分段收費
  const regionalFare = getRegionalTwoWayFare(r, co, boardIdx, alightIdx);

  const isHol = isHolidayFareDate(when);
  const table = (isHol && Array.isArray(r.faresHoliday) && r.faresHoliday.length) ? r.faresHoliday : r.fares;

  let normalFare = null;
  if (Array.isArray(table) && table.length) {
    const stops = (r.stops && (r.stops[co] || r.stops[r.primaryCo])) || null;
    if (stops && table.length === stops.length - 1) {
      //直接讀取上車站對應的車費，不與落車站相減
      const fareVal = parseFloat(table[boardIdx]);
      if (Number.isFinite(fareVal)) {
        normalFare = Math.round(fareVal * 10) / 10;
      }
    } else if (table.length === 1) {
      // 修正 NLB 假日車費未能顯示
      const fareVal = parseFloat(table[0]);
      if (Number.isFinite(fareVal)) {
        normalFare = Math.round(fareVal * 10) / 10;
      }
    } else if (stops && stops.length > 1) {
      const ratio = boardIdx / (stops.length - 1);
      const idx = Math.min(table.length - 1, Math.max(0, Math.floor(ratio * table.length)));
      const fareVal = parseFloat(table[idx]);
      if (Number.isFinite(fareVal)) {
        normalFare = Math.round(fareVal * 10) / 10;
      }
    }
  }

  if (regionalFare !== null) {
    // 短途雙向收費只喺佢平過正常收費先套用，避免因為地名配對誤中而抬高／扣減錯車費
    if (normalFare === null || regionalFare < normalFare) return Math.round(regionalFare * 10) / 10;
  }
  return normalFare;
}

/* ---------------- 轉乘優惠計算 ----------------*/
function _routeKeyForBbi(routeNo) {
  return String(routeNo || "").toUpperCase().trim();
}

// 轉乘優惠時限
function _transferGapMinutes(prevLeg, nextLeg) {
  if (!prevLeg || !nextLeg || !prevLeg.arriveTime || !nextLeg.departTime) return null;
  return Math.max(0, (nextLeg.departTime.getTime() - prevLeg.arriveTime.getTime()) / 60000);
}

// 解析 recommended_bbi 欄位（例如「尖沙咀轉車站 - 中間道 (YT562)」），去
// 走尾段括號入面嘅站代碼（YT562），剩低可以同站名資料庫比對嘅純站名。
// 如果原文係「任何能接駁第二程路線的巴士站」（或類似冇指明具體站嘅寫
// 法），代表呢個優惠冇特定轉車站限制，回傳 null（落面嘅檢查會直接放行）。
function _extractBbiStopName(recommendedBbi) {
  const s = String(recommendedBbi || "").trim();
  if (!s) return null;
  if (/任何.*(巴士站|接駁)/.test(s)) return null;
  const stripped = s.replace(/\s*[（(][^）)]*[）)]\s*$/, "").trim();
  return stripped || null;
}

function _kmbBbiDiscountFor(prevLeg, nextLeg, transferIndex = 1) {
  if (!bbiHeavyLoaded || (!bbiF1Db && !bbiB1Db)) return 0;
  if (prevLeg.co !== "kmb" || nextLeg.co !== "kmb") return 0;
  const gap = _transferGapMinutes(prevLeg, nextLeg);
  if (gap === null) return 0;

  const key = _routeKeyForBbi(prevLeg.routeNo);
  const nextRoute = _routeKeyForBbi(nextLeg.routeNo);
  const tables = [bbiF1Db, bbiB1Db];

  let best = 0;
  for (const table of tables) {
    if (!table) continue;
    const entries = table[key] || table[prevLeg.routeNo] || null;
    if (!Array.isArray(entries)) continue;
    for (const e of entries) {
      if (_routeKeyForBbi(e.bbi_route_number) !== nextRoute) continue;

      // 【修正一】核實本程方向是否符合優惠要求嘅首程方向（bbi_direction 欄位）
      // bbi_f1/b1 每條記錄都有 bbi_direction 指明首程路線要去哪個方向先啱
      // 呢個優惠，唔核實就有機會將兩個方向都錯誤地當合資格。
      if (e.bbi_direction) {
        const prevDest = (prevLeg.r && prevLeg.r.dest && prevLeg.r.dest.zh) || "";
        if (prevDest && !prevDest.includes(e.bbi_direction) && !e.bbi_direction.includes(prevDest)) continue;
      }
      // 核實次程方向是否符合優惠要求嘅次程方向（destination 欄位）
      if (e.destination) {
        const nextDest = (nextLeg.r && nextLeg.r.dest && nextLeg.r.dest.zh) || "";
        if (nextDest && !nextDest.includes(e.destination) && !e.destination.includes(nextDest)) continue;
      }

      // 連續轉乘
      const maxChange = parseInt(e.max_change, 10);
      if (Number.isFinite(maxChange) && maxChange > 0 && transferIndex > maxChange) continue;

      const timeLimit = parseFloat(e.time_limit);
      if (Number.isFinite(timeLimit) && gap > timeLimit) continue;

      // 【建議轉車站位置檢定】轉乘優惠必須響資料列明嘅 recommended_bbi
      // （建議轉車站）或之後嘅分站先享有——以前呢個欄位得個「存底」冇被
      // 用嚟驗證，就算首程好早就落咗車轉車（未去到官方建議嘅轉車站），
      // 都照樣攞晒優惠。而家改為：搵到 recommended_bbi 對應响首程路線站
      // 序入面嘅位置，就要求首程實際落車站index ≥ 建議轉車站index，先
      // 當合資格。原始資料入面「任何能接駁第二程路線的巴士站」呢類冇指
      // 明具體站嘅寫法，代表冇位置限制，直接放行；搵唔到對應站（名稱喺
      // 站序表比對唔到）都保持「驗證唔到就放過」，避免因命名差異令本身
      // 有效嘅優惠被誤刪。
      const recommendedName = _extractBbiStopName(e.recommended_bbi);
      if (recommendedName) {
        const recIdx = _ctbFindAnchorIdx(prevLeg, recommendedName);
        const alightIdx = _legAlightIdx(prevLeg);
        if (recIdx !== null && alightIdx !== null && alightIdx < recIdx) continue;
      }

      // 正確處理方式：
      //   free          : discount_raw 係「免費」，第二程應該全免（要扣嘅
      //                   金額係第二程原價，而唔係原始資料入面嘅 0）
      //   discount/return: discount_raw 係「減 $X」/「回贈 $X」，$X 本身
      //                   就已經係應扣金額，可以直接使用
      //   combined_fare : discount_raw 係「兩程合共 $X」，要用「兩程車費
      //                   相加」減返 $X，先係應該扣減嘅金額
      //   fixed_fare    : discount_raw 係「付 $X」，即第二程固定收 $X，
      //                   要用「第二程原價」減返 $X，先係應該扣減嘅金額
      //   其餘／解析唔到嘅類型：寧願唔套用優惠，都好過亂計錯車費
      const rawVal = parseFloat(e.discount);
      let candidateDiscount = 0;
      switch (e.discount_type) {
        case "free":
          candidateDiscount = (typeof nextLeg.fare === "number") ? nextLeg.fare : 0;
          break;
        case "discount":
        case "return":
          if (Number.isFinite(rawVal)) candidateDiscount = rawVal;
          break;
        case "combined_fare":
          if (Number.isFinite(rawVal) && typeof prevLeg.fare === "number" && typeof nextLeg.fare === "number") {
            candidateDiscount = (prevLeg.fare + nextLeg.fare) - rawVal;
          }
          break;
        case "fixed_fare":
          if (Number.isFinite(rawVal) && typeof nextLeg.fare === "number") {
            candidateDiscount = nextLeg.fare - rawVal;
          }
          break;
        default:
          candidateDiscount = 0;
      }

      if (candidateDiscount > best) best = candidateDiscount;
    }
  }
  return Math.max(0, best);
}

// 龍運「E」線 ←→ 嶼巴大嶼山路線轉乘優惠
const NLB_E_TRANSFER_DISCOUNT = { "3M": 1.0, "11": 1.0, "23": 1.0, "36": 1.0, "37": 1.0, "37H": 1.0, "37M": 1.0, "38": 1.0, "38X": 1.0, "X11R": 2.0 };
const NLB_E_TRANSFER_TIME_LIMIT_MIN = 150; // 兩小時半

function _kmbNlbTransferDiscountFor(prevLeg, nextLeg) {
  if (!prevLeg || !nextLeg) return 0;

  // 龍運「E」線喺呢個 app 入面歸類做 co === "kmb"，用路線編號開首係否
  // "E" 加數字嚟識別（例如 E31、E32A、E36P），避免同九巴市區路線混淆。
  const isLwbERoute = (leg) => leg.co === "kmb" && /^E\d/i.test(String(leg.routeNo || "").trim());

  const nlbDiscountKeyFor = (leg) => {
    if (leg.co !== "nlb") return null;
    const rn = String(leg.routeNo || "").trim().toUpperCase();
    return Object.prototype.hasOwnProperty.call(NLB_E_TRANSFER_DISCOUNT, rn) ? rn : null;
  };

  let nlbKey = null;
  if (isLwbERoute(prevLeg)) {
    nlbKey = nlbDiscountKeyFor(nextLeg);
  } else if (isLwbERoute(nextLeg)) {
    nlbKey = nlbDiscountKeyFor(prevLeg);
  }
  if (!nlbKey) return 0;

  const gap = _transferGapMinutes(prevLeg, nextLeg);
  if (gap === null || gap > NLB_E_TRANSFER_TIME_LIMIT_MIN) return 0;

  return NLB_E_TRANSFER_DISCOUNT[nlbKey];
}

/* ---------------- 城巴 concessionApi 即時轉乘優惠查詢 ----------------
 * value.ir 係一個陣列，每個元素代表一個「次程」選擇，包含：
 *   secondProvider / route（次程公司／路線編號）、direction（次程方向）、
 *   stopName（建議轉車站名）、discount（"FR"/"TF"/"L1"/"L2"）、
