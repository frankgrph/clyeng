  const safeDestination = destination || { name: "", lat: 0, lng: 0 };
  const directExists = hasDirectService(origin, destination, searchTime || tripStartTime);

  let transferCount = legs.filter(l => l.type === "ride").length - 1;
  if (transferCount < 0) transferCount = 0;

  const startTime = legs[0].departTime;
  const endTime = legs[legs.length - 1].arriveTime;
  const actualDuration = (endTime - startTime) / 60000; 
  
  const waitTime = searchTime ? Math.max(0, (startTime - searchTime) / 60000) : 0;
  const totalMinutes = actualDuration + waitTime;

  // ---- 耗時分數：只反映時間快慢，唔再混入轉乘判斷嘅賞罰 ----
  let score = Math.ceil(totalMinutes / 5) * 0.5;

  // 起點/終點嘅步行（唔係轉乘步行）辛苦程度按分鐘數額外計落耗時分數，
  // 呢個純粹反映「行路 vs 搭車」邊個辛苦啲，同轉乘質性判斷無關，維持
  // 喺呢度獨立計算。
  legs.forEach((leg, idx) => {
    if (leg.type !== "walk") return;
    const isTransferWalk = !directExists && (idx > 0 && idx < legs.length - 1);
    if (!isTransferWalk) {
      score += leg.minutes * WALK_PENALTY_MULTIPLIER;
    }
  });

  // ---- 轉乘質性評分：100 分為滿分，完全獨立於耗時（見上面「轉乘質性
  // 評分機制」說明），有賞有罰，唔會影響 score，避免拖累/提早淘汰好方案 ----
  const transferQualityScore = calculateTransferQualityScore(
    legs, directExists, isDeepNight, { lat: safeDestination.lat, lng: safeDestination.lng }
  );

  const isLantau = computeIsLantauTrip(safeOrigin, safeDestination);
  
  // 判定北大嶼山本地行程
  const isLocalTCOrAirport = isLantau && isTungChungOrAirportLocal(safeOrigin, safeDestination);

  // 大嶼山路線評分邏輯(路線偏好，不屬於轉乘判斷，維持獨立計落 score
  if (isLantau) {
    legs.forEach(leg => {
      if (leg.type !== "ride") return;
      if (isLocalTCOrAirport) {
        const isERoute = /^E\d+/i.test(leg.routeNo) && !/^E21/i.test(leg.routeNo);
        const isCityboundE = isERoute && leg.r && !LANTAU_KEYWORDS.test(leg.r.dest?.zh || "");
        const isSouthLantauRoute = /^(3M|11|23)$/i.test(leg.routeNo);
        const isSouthLantauOutbound = isSouthLantauRoute && leg.r && !/東涌|機場/i.test(leg.r.dest?.zh || "");

        if (isCityboundE || isSouthLantauOutbound) {
          score += 10; 
        }
      } else {
        const alightStopName = etaDb.stopList[leg.alightStopId]?.name?.zh || "";
        const isLantauGatewayInterchange = /青嶼幹線|屯門赤鱲角隧道/i.test(alightStopName);
        const isCityboundAE = /^[AE]/i.test(leg.routeNo) && leg.r && !LANTAU_KEYWORDS.test(leg.r.dest?.zh || "");
        const isExemptGateway = isLantauGatewayInterchange && isCityboundAE;

        const isPreferred = /^E21/i.test(leg.routeNo) || /^S/i.test(leg.routeNo) || leg.co === "nlb" || isExemptGateway;
        if (!isPreferred) {
          score += 40; 
        }
      }
    });
  }

// 如果用戶設定排序準則為車費，分數計算權重轉化為以車費為主，時間為次
  if (sortMode === "fare") {
    const rideLegsForScore = legs.filter(l => l.type === "ride");
    const fareResultForScore = await computeTripFare(rideLegsForScore);
    // 冇齊車費資料嘅組合，車費排序時要排到最後，唔應該當佢係 0 蚊而錯誤排前
    score = (typeof fareResultForScore.totalFare === "number" ? fareResultForScore.totalFare : 9999) * 10 + actualDuration * 0.1;
  }

  return { actualDuration, score, transferQualityScore, transferCount };
}

/* ---------------- Trip detection ---------------- */
const LANTAU_KEYWORDS = /機場|東涌|迪士尼|博覽館|港珠澳|大嶼山|赤鱲角|國泰城|航天城|後勤區|飛機|大澳|梅窩|塘福|石壁|石門甲|昂坪|愉景灣|欣澳|東邨|東薈城|空運|航空|大橋香港口岸|客運大樓|貨運站|地面運輸中心|維修區/i;
const OFFICIAL_INTERCHANGE_REGEX = /轉車站|轉乘站|城門隧道|大欖隧道|大老山隧道|獅子山隧道|青沙公路|屯門公路|粉嶺公路|將軍澳隧道|啟德隧道|西區海底隧道|海底隧道|東區海底隧道|青嶼幹線|屯門赤鱲角隧道|將藍隧道|香港仔隧道/i;

// 九巴路線，引用轉車站名單（kmb_bbi_stop_id.json）擴充官方轉車站嘅判斷。
let kmbBbiInterchangeNames = new Set();
function buildKmbBbiInterchangeNames(kmbBbiStopDb) {
  kmbBbiInterchangeNames = new Set();
  if (!kmbBbiStopDb) return;
  for (const entries of Object.values(kmbBbiStopDb)) {
    if (!Array.isArray(entries)) continue;
    for (const e of entries) {
      const zh = (e && e.zh) ? cleanStopName(e.zh) : "";
      if (zh) kmbBbiInterchangeNames.add(zh);
    }
  }
}
function isOfficialInterchangeName(name) {
  if (!name) return false;
  if (OFFICIAL_INTERCHANGE_REGEX.test(name)) return true;
  if (!kmbBbiInterchangeNames.size) return false;
  const cleaned = cleanStopName(name);
  if (!cleaned) return false;
  for (const bbiName of kmbBbiInterchangeNames) {
    if (cleaned.includes(bbiName) || bbiName.includes(cleaned)) return true;
  }
  return false;
}

function isLantauCoord(lat, lng){
  return lat >= 22.19 && lat <= 22.36 && lng >= 113.83 && lng <= 114.06;
}
function computeIsLantauTrip(origin, destination){
  if (LANTAU_KEYWORDS.test(origin.name) || LANTAU_KEYWORDS.test(destination.name)) return true;
  if (isLantauCoord(origin.lat, origin.lng) || isLantauCoord(destination.lat, destination.lng)) return true;
  return false;
}

const HK_ISLAND_KEYWORDS = /中環|金鐘|灣仔|銅鑼灣|天后|炮台山|北角|鰂魚涌|太古|西灣河|筲箕灣|柴灣|小西灣|堅尼地城|西營盤|香港大學|薄扶林|數碼港|香港仔|黃竹坑|鴨脷洲|海洋公園|赤柱|淺水灣|跑馬地|大坑/i;

function isHKIslandCoord(lat, lng){
  return lat >= 22.19 && lat <= 22.30 && lng >= 114.11 && lng <= 114.27;
}

function computeIsCrossHarbourTrip(orig, dest){
  const origHKI = HK_ISLAND_KEYWORDS.test(orig.name) || isHKIslandCoord(orig.lat, orig.lng);
  const destHKI = HK_ISLAND_KEYWORDS.test(dest.name) || isHKIslandCoord(dest.lat, dest.lng);
  return origHKI !== destHKI;
}

// 落車半徑統一為 750 米
function getRegionWalkLimit(lat, lng, name) {
  return 750;
}

// 判定行程是否屬於「東涌市中心內」或「來往機場」的本地行程
function isTungChungOrAirportLocal(orig, dest) {
  if (!orig || !dest) return false;
  
  // 東涌各屋邨及機場相關關鍵字
  const localKeywords = /東涌|逸東|滿東|迎東|裕雅|富東|裕東|映灣園|藍天海岸|昇薈|東環|機場|博覽館|航天城|國泰城|後勤區|飛機維修區|民航處|客運大樓|地面運輸中心/i;
  
  // 北大嶼山本地（東涌及機場）的經緯度範圍
  const isLocalCoord = (lat, lng) => lat >= 22.27 && lat <= 22.34 && lng >= 113.88 && lng <= 113.97;
  
  const origLocal = localKeywords.test(orig.name) || isLocalCoord(orig.lat, orig.lng);
  const destLocal = localKeywords.test(dest.name) || isLocalCoord(dest.lat, dest.lng);
  
  return origLocal && destLocal;
}

/* ---------------- 車費計算 ---------------- */
function isHolidayFareDate(when) {
  const w = when || new Date();
  if (w.getDay() === 0) return true; // 星期日普遍當假日收費
  if (!routeFareDb || !Array.isArray(routeFareDb.holidays)) return false;
  const yyyy = w.getFullYear();
  const mm = String(w.getMonth() + 1).padStart(2, '0');
  const dd = String(w.getDate()).padStart(2, '0');
  return routeFareDb.holidays.includes(`${yyyy}${mm}${dd}`);
}

function _fareNameNorm(s) {
  return String(s || "")
    .replace(/\(.*?\)|（.*?）/g, "")   // 去除括住嘅備註，例如「(拍卡機設於翠寧花園)」
    .replace(/[\s　]/g, "")
    .trim();
}

// 港鐵巴士全程劃一收費
function buildMtrBusFareIndex(mtrBusRoutesJson) {
  const out = {};
  if (!mtrBusRoutesJson || typeof mtrBusRoutesJson !== "object") return out;
  for (const rec of Object.values(mtrBusRoutesJson)) {
    if (!rec || !rec.route) continue;
    const bound = (rec.bound && rec.bound["mtr-bus"]) || "O";
    const fares = Array.isArray(rec.fares) ? rec.fares.map(parseFloat).filter(Number.isFinite) : [];
    const faresHol = Array.isArray(rec.faresHoliday) ? rec.faresHoliday.map(parseFloat).filter(Number.isFinite) : [];
    if (!fares.length) continue;
    const flatFare = fares[0];
    const flatFareHol = faresHol.length ? faresHol[0] : null;
    if (!out[rec.route]) out[rec.route] = {};
    out[rec.route][bound] = { fare: flatFare, fareHoliday: flatFareHol };
  }
  return out;
}

// 九巴短途分段雙向收費
function _findStopIdxByName(stops, targetName) {
  const target = _fareNameNorm(targetName);
  if (!target || !stops) return -1;
  let best = -1;
  for (let i = 0; i < stops.length; i++) {
    const s = etaDb.stopList[stops[i]];
    if (!s) continue;
    const name = _fareNameNorm(s.name?.zh || s.name?.en || "");
    if (!name) continue;
    if (name === target) return i; // 完全相符優先
    if (best === -1 && (name.includes(target) || target.includes(name))) best = i;
  }
  return best;
}

function getRegionalTwoWayFare(r, co, boardIdx, alightIdx) {
  if (!regionalTwoWayFareDb || !Array.isArray(regionalTwoWayFareDb.routes)) return null;
  if (co !== "kmb" && co !== "nlb") return null;
  const routeNo = String(r.route || "").toUpperCase();
  const candidates = regionalTwoWayFareDb.routes.filter(x => String(x.route_number || "").toUpperCase() === routeNo);
  if (!candidates.length) return null;
  const stops = (r.stops && (r.stops[co] || r.stops[r.primaryCo])) || null;
  if (!stops) return null;

  let bestFare = null;
  for (const cand of candidates) {
    const idxA = _findStopIdxByName(stops, cand.start);
    const idxB = _findStopIdxByName(stops, cand.end);
    if (idxA < 0 || idxB < 0) continue;
    const lo = Math.min(idxA, idxB), hi = Math.max(idxA, idxB);
    // 雙向收費：只要上車同落車都喺呢個範圍之內就適用（唔理方向）
    if (boardIdx >= lo && boardIdx <= hi && alightIdx >= lo && alightIdx <= hi) {
      const f = parseFloat(cand.fare);
      if (Number.isFinite(f) && (bestFare === null || f < bestFare)) bestFare = f;
    }
  }
  return bestFare;
}

// 城巴官方車費 JSON 入面「地名」可能帶埋一個 "#" 尾碼（表示有備註,例如
// 拍卡機位置特殊）,同 _fareNameNorm() 一齊清理先可以同站名比對。
function _ctbFareNameClean(s) {
  return _fareNameNorm(String(s || "").replace(/#/g, ""));
}

// 背景攞、解析某條城巴路線嘅官方分段車費表,並 cache 住個 Promise,
// 同一條路線之後再問就唔使重複發request。每個 route_desc_zh 係
// 「起點(可以有幾個候選地名,用逗號分隔) > 終點(同樣可以有幾個候選)」,
// 例如「龜背灣, 大潭道 \u003E 赤柱炮台 (閘口)∕馬坑」表示由「龜背灣」
// 或者「大潭道」呢兩個位隨便一個起計,去到「赤柱炮台」呢一段嘅收費。
// two_way = true 代表呢個係雙向都用同一個價嘅短途分段收費(通常喺總站
// 附近),唔理上車定落車喺邊個方向。
async function fetchCtbOfficialFare(routeNo) {
  const key = String(routeNo || "").toUpperCase().trim();
  if (!key) return null;
  if (ctbOfficialFareCache.has(key)) return ctbOfficialFareCache.get(key);

  const promise = (async () => {
    try {
      const res = await fetch(`https://seep.eu.org/https://www.citybus.com.hk/app/newfare/data/${encodeURIComponent(key)}.json`);
      if (!res.ok) return null;
      const json = await res.json();
      const arr = json && Array.isArray(json[key]) ? json[key] : null;
      if (!arr || !arr.length) return null;

      const parsed = [];
      for (const rec of arr) {
        if (!rec) continue;
        const desc = String(rec.route_desc_zh || "");
        // 官方 JSON 入面個箭嘴字元係 "\u003E"（即 ">"）,唔理原始字串
        // 用邊種寫法都兼顧埋
        const arrowIdx = desc.search(/>|\u003E/);
        if (arrowIdx === -1) continue;
        const origPart = desc.slice(0, arrowIdx);
        const destPart = desc.slice(arrowIdx + 1);
        const origNames = origPart.split(/[,，]/).map(_ctbFareNameClean).filter(Boolean);
        const destNames = destPart.split(/[,，]/).map(_ctbFareNameClean).filter(Boolean);
        const fare = parseFloat(rec.fare);
        if (!origNames.length || !destNames.length || !Number.isFinite(fare)) continue;
        parsed.push({
          origNames,
          destNames,
          fare,
          twoWay: String(rec.two_way).trim().toLowerCase() === "true"
        });
      }
      return parsed.length ? parsed : null;
    } catch (err) {
      console.error("背景載入城巴官方分段車費失敗:", routeNo, err);
      return null;
    }
  })();

  ctbOfficialFareCache.set(key, promise);
  return promise;
}

// 喺 stops 陣列度搵第一個同「候選地名列表」(names) 相符嘅站,搵唔到就
// 逐個試下一個候選
function _findStopIdxByNameList(stops, names) {
  if (!Array.isArray(names)) return -1;
  for (const n of names) {
    const idx = _findStopIdxByName(stops, n);
    if (idx >= 0) return idx;
  }
  return -1;
}

// 根據城巴官方分段車費表,計算某程「上車站 boardIdx → 落車站
// alightIdx」實際應收幾多錢。搵唔到啱嘅分段就交返 null,等
// getSegFare() 用返其他方式(逐站陣列/估算)頂住。
async function getCtbOfficialSegFare(r, boardIdx, alightIdx, stops) {
  if (!r || !r.route || !stops) return null;
  const table = await fetchCtbOfficialFare(r.route);
  if (!table) return null;

  let bestFull = null;    // 全程／單向分段收費入面,最貼合呢程嘅一個
  let bestTwoWay = null;  // 短途雙向收費入面,最貼合呢程嘅一個

  for (const entry of table) {
    const oIdx = _findStopIdxByNameList(stops, entry.origNames);
    const dIdx = _findStopIdxByNameList(stops, entry.destNames);
    if (oIdx < 0 || dIdx < 0) continue;
    const lo = Math.min(oIdx, dIdx), hi = Math.max(oIdx, dIdx);

    if (entry.twoWay) {
      // 短途雙向收費:唔理乘搭方向,只要上車同落車都喺呢個區間之內就啱用
      if (boardIdx >= lo && boardIdx <= hi && alightIdx >= lo && alightIdx <= hi) {
        if (bestTwoWay === null || entry.fare < bestTwoWay) bestTwoWay = entry.fare;
      }
    } else {
      // 【修正：單向分段誤用落相反方向】stops 呢個陣列已經係「呢一個特定
      // 方向」（例如淨係「往中環」或者淨係「往馬鞍山」其中一個）嘅逐站
      // 順序。一個 two_way=false 嘅單向分段(例如「錦駿苑,馬鞍山路 >
      // 馬鞍山市中心」)理論上淨係喺「新界方向」(即返入馬鞍山市中心嗰個
      // 方向)先啱用；如果搭嗰程係「港島方向」(即由馬鞍山市中心出發去
      // 中環),喺呢個方向嘅 stops 陣列度，其實會係「馬鞍山市中心」行先
      // (index 細)、「錦駿苑」行後(index 大)，即 oIdx > dIdx——同官方
      // 資料寫嘅「起點在前、終點在後」順序啱好相反,証明呢個分段其實係
      // 形容緊相反方向,唔應該喺呢個方向度撞中。以前用 min/max 嘅寫法
      // 完全冧唔到方向,將 oIdx > dIdx 都當撞中,先會令新界方向專屬嘅
      // 分段錯誤咁套用埋落港島方向嘅行程。而家改為要求 oIdx <= dIdx
      // (即官方寫法嘅「起點在前」喺呢個方向嘅 stops 陣列入面都成立)
      // 先當呢個分段適用；oIdx > dIdx 就代表呢條分段屬於相反方向,直接
      // 跳過,交返嗰個相反方向嘅 route 物件(自己嗰份 stops 陣列入面
      // oIdx/dIdx 自然會啱返)先啱用。
      if (oIdx <= dIdx && boardIdx >= oIdx && alightIdx <= dIdx && boardIdx <= alightIdx) {
        if (bestFull === null || entry.fare < bestFull) bestFull = entry.fare;
      }
    }
  }

  // 短途雙向收費通常淨係涵蓋路線頭／尾一小段,如果啱啱好喺呢個區間
  // 之內、又平過全程／分段收費,先當佢啱用(同九巴短途分段邏輯
  // getRegionalTwoWayFare() 做法一致,避免地名配對誤中令車費計錯)。
  if (bestTwoWay !== null && (bestFull === null || bestTwoWay < bestFull)) {
    return Math.round(bestTwoWay * 10) / 10;
  }
  if (bestFull !== null) return Math.round(bestFull * 10) / 10;
  return null;
}

async function getSegFare(r, co, boardIdx, alightIdx, when) {
  if (!r || boardIdx == null || alightIdx == null || alightIdx <= boardIdx) return null;

const stops = (r.stops && (r.stops[co] || r.stops[r.primaryCo])) || null;

  // 城門隧道轉車站，途經路線必須使用上車站計算優惠的車費
  if (stops && boardIdx + 1 < stops.length) {
    const currentStopId = stops[boardIdx];
    const nextStopId = stops[boardIdx + 1];
    if (currentStopId && nextStopId) {
      const currentName = _fareNameNorm(etaDb.stopList[currentStopId]?.name?.zh || "");
      const nextName = _fareNameNorm(etaDb.stopList[nextStopId]?.name?.zh || "");
      if (currentName.includes("城門隧道轉車站") && nextName.includes("城門隧道轉車站")) {
        boardIdx = boardIdx + 1;
      }
    }
  }

  // 港鐵巴士劃一收費，唔理會上落車站
  if ((co === "mtrb" || co === "mtr-bus") && mtrBusRouteFareDb) {
    const routeEntry = mtrBusRouteFareDb[r.route];
    if (routeEntry) {
      const bound = (r.bound && (r.bound[co] || r.bound.mtrb || r.bound["mtr-bus"])) || Object.keys(routeEntry)[0];
      const info = routeEntry[bound] || routeEntry[Object.keys(routeEntry)[0]];
      if (info) {
        const isHol = isHolidayFareDate(when);
        const v = (isHol && Number.isFinite(info.fareHoliday)) ? info.fareHoliday : info.fare;
        if (Number.isFinite(v)) return Math.round(v * 10) / 10;
      }
    }
  }

  // 城巴官方逐程分段車費(優先於下面通用嘅逐站陣列/估算邏輯,因為呢份
  // 係城巴自己 app 用嘅權威資料,可以準確反映短途雙向分段收費)
  if (co === "ctb" && stops) {
    try {
      const ctbOfficialFare = await getCtbOfficialSegFare(r, boardIdx, alightIdx, stops);
      if (ctbOfficialFare !== null) return ctbOfficialFare;
    } catch (err) {
      console.error("城巴官方車費查詢失敗:", r.route, err);
    }
  }

  // 九巴短途雙向分段收費
  const regionalFare = getRegionalTwoWayFare(r, co, boardIdx, alightIdx);

  const isHol = isHolidayFareDate(when);
  const table = (isHol && Array.isArray(r.faresHoliday) && r.faresHoliday.length) ? r.faresHoliday : r.fares;

  let normalFare = null;
  if (Array.isArray(table) && table.length) {
    const stops = (r.stops && (r.stops[co] || r.stops[r.primaryCo])) || null;
    if (stops && table.length === stops.length - 1) {
      //直接讀取上車站對應的車費，不與落車站相減
      const fareVal = parseFloat(table[boardIdx]);
      if (Number.isFinite(fareVal)) {
        normalFare = Math.round(fareVal * 10) / 10;
      }
    } else if (table.length === 1) {
      // 修正 NLB 假日車費未能顯示
      const fareVal = parseFloat(table[0]);
      if (Number.isFinite(fareVal)) {
        normalFare = Math.round(fareVal * 10) / 10;
      }
    } else if (stops && stops.length > 1) {
      const ratio = boardIdx / (stops.length - 1);
      const idx = Math.min(table.length - 1, Math.max(0, Math.floor(ratio * table.length)));
      const fareVal = parseFloat(table[idx]);
      if (Number.isFinite(fareVal)) {
        normalFare = Math.round(fareVal * 10) / 10;
      }
    }
  }

  if (regionalFare !== null) {
    // 短途雙向收費只喺佢平過正常收費先套用，避免因為地名配對誤中而抬高／扣減錯車費
    if (normalFare === null || regionalFare < normalFare) return Math.round(regionalFare * 10) / 10;
  }
  return normalFare;
}

/* ---------------- 轉乘優惠計算 ----------------*/
function _routeKeyForBbi(routeNo) {
  return String(routeNo || "").toUpperCase().trim();
}

// 轉乘優惠時限
function _transferGapMinutes(prevLeg, nextLeg) {
  if (!prevLeg || !nextLeg || !prevLeg.arriveTime || !nextLeg.departTime) return null;
  return Math.max(0, (nextLeg.departTime.getTime() - prevLeg.arriveTime.getTime()) / 60000);
}

// 解析 recommended_bbi 欄位（例如「尖沙咀轉車站 - 中間道 (YT562)」），去
// 走尾段括號入面嘅站代碼（YT562），剩低可以同站名資料庫比對嘅純站名。
// 如果原文係「任何能接駁第二程路線的巴士站」（或類似冇指明具體站嘅寫
// 法），代表呢個優惠冇特定轉車站限制，回傳 null（落面嘅檢查會直接放行）。
function _extractBbiStopName(recommendedBbi) {
  const s = String(recommendedBbi || "").trim();
  if (!s) return null;
  if (/任何.*(巴士站|接駁)/.test(s)) return null;
  const stripped = s.replace(/\s*[（(][^）)]*[）)]\s*$/, "").trim();
  return stripped || null;
}

function _kmbBbiDiscountFor(prevLeg, nextLeg, transferIndex = 1) {
  if (!bbiHeavyLoaded || (!bbiF1Db && !bbiB1Db)) return 0;
  if (prevLeg.co !== "kmb" || nextLeg.co !== "kmb") return 0;
  const gap = _transferGapMinutes(prevLeg, nextLeg);
  if (gap === null) return 0;

  const key = _routeKeyForBbi(prevLeg.routeNo);
  const nextRoute = _routeKeyForBbi(nextLeg.routeNo);
  const tables = [bbiF1Db, bbiB1Db];

  let best = 0;
  for (const table of tables) {
    if (!table) continue;
    const entries = table[key] || table[prevLeg.routeNo] || null;
    if (!Array.isArray(entries)) continue;
    for (const e of entries) {
      if (_routeKeyForBbi(e.bbi_route_number) !== nextRoute) continue;

      // 【修正一】核實本程方向是否符合優惠要求嘅首程方向（bbi_direction 欄位）
      // bbi_f1/b1 每條記錄都有 bbi_direction 指明首程路線要去哪個方向先啱
      // 呢個優惠，唔核實就有機會將兩個方向都錯誤地當合資格。
      if (e.bbi_direction) {
        const prevDest = (prevLeg.r && prevLeg.r.dest && prevLeg.r.dest.zh) || "";
        if (prevDest && !prevDest.includes(e.bbi_direction) && !e.bbi_direction.includes(prevDest)) continue;
      }
      // 核實次程方向是否符合優惠要求嘅次程方向（destination 欄位）
      if (e.destination) {
        const nextDest = (nextLeg.r && nextLeg.r.dest && nextLeg.r.dest.zh) || "";
        if (nextDest && !nextDest.includes(e.destination) && !e.destination.includes(nextDest)) continue;
      }

      // 連續轉乘
      const maxChange = parseInt(e.max_change, 10);
      if (Number.isFinite(maxChange) && maxChange > 0 && transferIndex > maxChange) continue;

      const timeLimit = parseFloat(e.time_limit);
      if (Number.isFinite(timeLimit) && gap > timeLimit) continue;

      // 【建議轉車站位置檢定】轉乘優惠必須響資料列明嘅 recommended_bbi
      // （建議轉車站）或之後嘅分站先享有——以前呢個欄位得個「存底」冇被
      // 用嚟驗證，就算首程好早就落咗車轉車（未去到官方建議嘅轉車站），
      // 都照樣攞晒優惠。而家改為：搵到 recommended_bbi 對應响首程路線站
      // 序入面嘅位置，就要求首程實際落車站index ≥ 建議轉車站index，先
      // 當合資格。原始資料入面「任何能接駁第二程路線的巴士站」呢類冇指
      // 明具體站嘅寫法，代表冇位置限制，直接放行；搵唔到對應站（名稱喺
      // 站序表比對唔到）都保持「驗證唔到就放過」，避免因命名差異令本身
      // 有效嘅優惠被誤刪。
      const recommendedName = _extractBbiStopName(e.recommended_bbi);
      if (recommendedName) {
        const recIdx = _ctbFindAnchorIdx(prevLeg, recommendedName);
        const alightIdx = _legAlightIdx(prevLeg);
        if (recIdx !== null && alightIdx !== null && alightIdx < recIdx) continue;
      }

      // 正確處理方式：
      //   free          : discount_raw 係「免費」，第二程應該全免（要扣嘅
      //                   金額係第二程原價，而唔係原始資料入面嘅 0）
      //   discount/return: discount_raw 係「減 $X」/「回贈 $X」，$X 本身
      //                   就已經係應扣金額，可以直接使用
      //   combined_fare : discount_raw 係「兩程合共 $X」，要用「兩程車費
      //                   相加」減返 $X，先係應該扣減嘅金額
      //   fixed_fare    : discount_raw 係「付 $X」，即第二程固定收 $X，
      //                   要用「第二程原價」減返 $X，先係應該扣減嘅金額
      //   其餘／解析唔到嘅類型：寧願唔套用優惠，都好過亂計錯車費
      const rawVal = parseFloat(e.discount);
      let candidateDiscount = 0;
      switch (e.discount_type) {
        case "free":
          candidateDiscount = (typeof nextLeg.fare === "number") ? nextLeg.fare : 0;
          break;
        case "discount":
        case "return":
          if (Number.isFinite(rawVal)) candidateDiscount = rawVal;
          break;
        case "combined_fare":
          if (Number.isFinite(rawVal) && typeof prevLeg.fare === "number" && typeof nextLeg.fare === "number") {
            candidateDiscount = (prevLeg.fare + nextLeg.fare) - rawVal;
          }
          break;
        case "fixed_fare":
          if (Number.isFinite(rawVal) && typeof nextLeg.fare === "number") {
            candidateDiscount = nextLeg.fare - rawVal;
          }
          break;
        default:
          candidateDiscount = 0;
      }

      if (candidateDiscount > best) best = candidateDiscount;
    }
  }
  return Math.max(0, best);
}

// 龍運「E」線 ←→ 嶼巴大嶼山路線轉乘優惠
const NLB_E_TRANSFER_DISCOUNT = { "3M": 1.0, "11": 1.0, "23": 1.0, "36": 1.0, "37": 1.0, "37H": 1.0, "37M": 1.0, "38": 1.0, "38X": 1.0, "X11R": 2.0 };
const NLB_E_TRANSFER_TIME_LIMIT_MIN = 150; // 兩小時半

function _kmbNlbTransferDiscountFor(prevLeg, nextLeg) {
  if (!prevLeg || !nextLeg) return 0;

  // 龍運「E」線喺呢個 app 入面歸類做 co === "kmb"，用路線編號開首係否
  // "E" 加數字嚟識別（例如 E31、E32A、E36P），避免同九巴市區路線混淆。
  const isLwbERoute = (leg) => leg.co === "kmb" && /^E\d/i.test(String(leg.routeNo || "").trim());

  const nlbDiscountKeyFor = (leg) => {
    if (leg.co !== "nlb") return null;
    const rn = String(leg.routeNo || "").trim().toUpperCase();
    return Object.prototype.hasOwnProperty.call(NLB_E_TRANSFER_DISCOUNT, rn) ? rn : null;
  };

  let nlbKey = null;
  if (isLwbERoute(prevLeg)) {
    nlbKey = nlbDiscountKeyFor(nextLeg);
  } else if (isLwbERoute(nextLeg)) {
    nlbKey = nlbDiscountKeyFor(prevLeg);
  }
  if (!nlbKey) return 0;

  const gap = _transferGapMinutes(prevLeg, nextLeg);
  if (gap === null || gap > NLB_E_TRANSFER_TIME_LIMIT_MIN) return 0;

  return NLB_E_TRANSFER_DISCOUNT[nlbKey];
}

/* ---------------- 城巴 concessionApi 即時轉乘優惠查詢 ----------------
 * value.ir 係一個陣列，每個元素代表一個「次程」選擇，包含：
 *   secondProvider / route（次程公司／路線編號）、direction（次程方向）、
 *   stopName（建議轉車站名）、discount（"FR"/"TF"/"L1"/"L2"）、
 *   discountAmount.adult（FR 用：減收金額）、totalFare.adult（TF 用：
 *   兩程合共車資）、timeLimit（轉乘時限，分鐘）、remark（附加條款）。
 */
function _ctbTrimUp(s) {
  return String(s || "").trim().toUpperCase();
}

/* ---------------- 城巴轉乘適用登車範圍解析與核對 ----------------
 * concessionApi 每條 ir 記錄嘅 remark 欄位，係用嚟講明「呢個轉乘優惠淨係
 * 適用於響邊個範圍登車嘅乘客」。同一組 routeA→routeB，官方時常會回傳幾條
 * bound/direction/secondDirection 都完全一樣，但 discount 類型（L1/L2/FR/
 * TF）同 remark 唔同嘅記錄——即係話，淨係靠原有嘅「方向比對」評分，呢幾
 * 條記錄分數會打平手，變成永遠揀到排得最前嗰一條，完全冇理會乘客實際上
 * 車站係咪真係落喺呢條記錄講明嘅範圍入面，容易「撞中」錯誤嘅折扣類型。
 * 例如（實測 608→22 嘅其中一組）：
 *   discount:"L1"（回贈首程車費）remark:「只適用於在東區海底隧道巴士轉乘
 *     站或之後沿途各站登上首程路線的乘客。」
 *   discount:"L2"（次程免費）    remark:「只適用於在香港島沿途各站登上首
 *     程路線的乘客。」
 * 呢兩條記錄先前完全冇被 remark 篩走任何一條，最終揀邊條淨係睇邊條排先，
 * 同乘客實際喺邊度上首程車完全冇關係，車費就有機會計錯。
 */

// 1. 輔助函數：處理多重站點分隔符 (支援 "或", "/", ",", "、")
function _ctbSplitAnchors(str) {
  if (!str) return [];
  // 依據標點及連接詞分割，並自動移除站名尾部的空格
  return str.split(/[\/或,、]/).map(s => s.trim()).filter(Boolean);
}

// 2. 預處理及範圍解析
function _ctbParseRemarkConstraints(remarkText) {
  const out = [];
  const raw = String(remarkText || "").trim();
  if (!raw) return out;

  // 預處理：將「不適用於」替換為新句子，以便獨立解析為 exclude 規則
  const normalizedRaw = raw.replace(/不適用於/g, "。不適用於");

  // 拆分邏輯：以換行、句號分句，並處理 Markdown-like 列表符號 "-"
  const sentences = normalizedRaw
    .split(/[\r\n]+|(?<=。)/)
    .flatMap(s => s.split(/(?:^- \s*)/)) 
    .map(s => s.trim())
    .filter(Boolean);

  for (let sentence of sentences) {
    let isExclude = false;
    
    // 檢查是否為排除條款
    if (sentence.includes("不適用於")) {
      isExclude = true;
      sentence = sentence.replace(/^不適用於\s*/, "");
    }

    // 清理句首干擾詞 (支援「優惠只適用於：」、「- 在」、「於」等)
    sentence = sentence.replace(/^(?:- \s*)?(?:優惠)?只適用於[：:]?\s*/, "");
    sentence = sentence.replace(/^(?:在|於)\s*/, "");

    if (!sentence) continue;

    const c = _ctbParseOneRemarkSentence(sentence);
    if (c) {
      if (isExclude) c.exclude = true;
      out.push(c);
    } else {
      console.debug(`[城巴轉乘] remark 句子未能識別格式，略過檢查：「${sentence}」`);
    }
  }
  return out;
}

// 3. 增強版 remark 句式解析器
function _ctbParseOneRemarkSentence(sentence) {
  let m;

  // 判定動作：預設為登車 (board)，若包含「下車」則為 alight
  const isAlight = sentence.includes("下車");
  const action = isAlight ? "alight" : "board";

  // 句式 A：繳付全程車資
  m = sentence.match(/(首程|次程)(?:繳付全程車資)/);
  if (m) {
    return { leg: m[1] === "次程" ? "second" : "first", action, type: "full_fare" };
  }

  // 句式 B：轉乘方向 (例如「轉乘往港珠澳大橋香港口岸」)
  m = sentence.match(/轉乘往(.+)/);
  if (m) {
    return { leg: "second", action: "board", type: "direction", anchors: _ctbSplitAnchors(m[1]) };
  }

  // 句式 C：分段收費 (例如「次程享用維港灣往弼街分段收費」)
  m = sentence.match(/(首程|次程)?(?:享用)?(.+?)(?:分段收費)/);
  if (m) {
    const leg = (m[1] === "次程" || sentence.includes("次程")) ? "second" : "first";
    return { leg, action, type: "section_fare", anchors: [m[2].trim()] };
  }

  // 句式 D：區間範圍 (支援「到」、「至」、「及...之間」)
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)(?:及|至|到)(.+?)(?:之間)?(?:沿途)?(?:各站)?(?:登(?:上.*?|車)|下車)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    return {
      leg: finalLeg,
      action,
      type: "between",
      anchors: [..._ctbSplitAnchors(m[2]), ..._ctbSplitAnchors(m[3])]
    };
  }

  // 句式 E：指定位置之前/前 (支援「各站前」、「以前」)
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)(?:站)?(?:各站)?(?:或)?(?:之前|以前|前)(?:沿途)?(?:各站)?(?:登(?:上.*?|車)|下車)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    return {
      leg: finalLeg,
      action,
      type: "before",
      anchors: _ctbSplitAnchors(m[2])
    };
  }

  // 句式 F：指定位置之後/後 (支援「後各站」)
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)(?:站)?(?:各站)?(?:或)?(?:之後|其後|後)(?:沿途)?(?:各站)?(?:登(?:上.*?|車)|下車)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    return {
      leg: finalLeg,
      action,
      type: "after",
      anchors: _ctbSplitAnchors(m[2])
    };
  }

  // 句式 G：指定位置或區域登/下車 (支援 "/"、"或"、"," 分隔及括號)
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)(?:沿途)?(?:各站)?(?:登(?:上.*?|車(?:往.*?)?)|下車)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    return {
      leg: finalLeg,
      action,
      type: "along",
      anchors: _ctbSplitAnchors(m[2])
    };
  }

  return null;
}

// 去除空白同全／半形括號，方便兩個站名之間做子字串比對
// （例如完整站名「德輔道西 (林士街)」對 remark 講嘅「德輔道西」）。
function _ctbNormalizeStopName(s) {
  return String(s || "").replace(/[\s()（）]/g, "").trim();
}

// 攞返某一程車嘅上車站，喺佢自己路線嘅站序陣列入面嘅索引（用嚟同 remark
// 講嘅「或之前／或之後」比先後）。搵唔到就回傳 null（代表冇資料驗證）。
function _ctbLegBoardIdx(leg) {
  if (!leg || !leg.r || !leg.r.stops || !leg.boardStopId) return null;
  const co = leg.co || leg.primaryCo;
  const stops = leg.r.stops[co] || leg.r.stops[Object.keys(leg.r.stops)[0]];
  if (!stops) return null;
  const idx = stops.indexOf(leg.boardStopId);
  return idx === -1 ? null : idx;
}

// 同上，但攞落車站（alightStopId）嘅站序索引——用嚟核對「首程係咪響
// 官方建議轉車站或之後先落車」（KMB recommended_bbi／城巴 stopName 都會
// 用到）。搵唔到就回傳 null（代表冇資料驗證）。
function _legAlightIdx(leg) {
  if (!leg || !leg.r || !leg.r.stops || !leg.alightStopId) return null;
  const co = leg.co || leg.primaryCo;
  const stops = leg.r.stops[co] || leg.r.stops[Object.keys(leg.r.stops)[0]];
  if (!stops) return null;
  const idx = stops.indexOf(leg.alightStopId);
  return idx === -1 ? null : idx;
}

// 喺某一程車嘅路線站序入面，用名稱子字串比對搵返 remark 提到嘅 anchor 站
// 排喺第幾個位（雙向 includes：完整站名包含 anchor，或者 anchor 包含完整
// 站名，都當撞中，應付「德輔道西」對「德輔道西 (林士街)」呢類簡寫）。
function _ctbFindAnchorIdx(leg, anchorNameRaw) {
  if (!leg || !leg.r || !leg.r.stops) return null;
  const anchorName = _ctbNormalizeStopName(anchorNameRaw);
  if (!anchorName) return null;
  const co = leg.co || leg.primaryCo;
  const stops = leg.r.stops[co] || leg.r.stops[Object.keys(leg.r.stops)[0]];
  if (!stops) return null;
  for (let i = 0; i < stops.length; i++) {
    const s = (typeof etaDb !== "undefined" && etaDb.stopList) ? etaDb.stopList[stops[i]] : null;
    if (!s) continue;
    const zh = _ctbNormalizeStopName(s.name?.zh || s.name || "");
    if (!zh) continue;
    if (zh.includes(anchorName) || anchorName.includes(zh)) return i;
  }
  return null;
}


// 核對城巴 concessionApi 嘅 stopName 欄位（建議轉車站，例如「香港仔隧道
// 巴士轉乘站」）——呢個同上面靠 remark 解析出嚟嘅 constraints 係獨立、
// 互補嘅檢查：好多 ir 記錄嘅 remark 完全冇提及邊度上/落車（例如淨係話
// 「減收 $X」冇附加條款），令 remarkConstraints 係空陣列，一律當合資
// 格；但呢啲記錄往往都有 stopName 講明官方建議嘅轉車站，只不過以前呢
// 個欄位得個「存底」，從冇被用嚟驗證過。而家加返呢一層：要求首程實際
// 落車站，喺首程路線嘅站序入面，index ≥ 建議轉車站嘅 index，先當合資
// 格——即係「首程行到建議轉車站或之後先落車」，同 remark 入面「或之後
// 各站」呢類寫法邏輯一致。同樣，搵唔到資料驗證（stopName 冇提供、喺站
// 序表比對唔到）就保持「驗證唔到就放過」，唔會誤刪本身有效嘅優惠。
function _ctbStopNameConstraintSatisfied(stopNameRaw, prevLeg, nextLeg) {
  const stopNameStr = String(stopNameRaw || "").trim();
  if (!stopNameStr) return true;
  const alightIdx = _legAlightIdx(prevLeg);
  if (alightIdx === null) return true;
  const recIdx = _ctbFindAnchorIdx(prevLeg, stopNameStr);
  if (recIdx === null) return true;
  return alightIdx >= recIdx;
}

// 少數 remark 用嘅係「香港島／九龍／新界」呢類大範圍地名（唔係具體站名），
// 冇辦法直接同單一站名做子字串比對。呢度借用現有嘅 HK_ISLAND_KEYWORDS／
// isHKIslandCoord（見上面 Trip detection 部分）做粗略嘅地區判斷，盡量補
// 返呢類 remark 嘅驗證能力；判斷唔到就當冇資料驗證。
const _CTB_KOWLOON_KEYWORDS = /尖沙咀|尖東|旺角|油麻地|佐敦|深水埗|長沙灣|荔枝角|美孚|九龍城|土瓜灣|紅磡|啟德|新蒲崗|黃大仙|鑽石山|慈雲山|牛池灣|九龍灣|牛頭角|觀塘|藍田|油塘|秀茂坪|順利|九龍塘|何文田|大角咀|石硤尾/;
function _ctbGuessHkRegion(name, lat, lng) {
  if ((typeof HK_ISLAND_KEYWORDS !== "undefined" && HK_ISLAND_KEYWORDS.test(name)) ||
      (typeof isHKIslandCoord === "function" && Number.isFinite(lat) && Number.isFinite(lng) && isHKIslandCoord(lat, lng))) {
    return "hkisland";
  }
  if (_CTB_KOWLOON_KEYWORDS.test(name) || (Number.isFinite(lat) && Number.isFinite(lng) && lat > 22.298 && lat <= 22.355 && lng >= 114.09 && lng <= 114.24)) {
    return "kowloon";
  }
  if (Number.isFinite(lat) && Number.isFinite(lng)) return "nt"; // 新界／離島等其餘地方
  return null;
}
// 地名／區域識別
function _ctbAnchorRegion(anchorName) {
  if (/香港島|港島/.test(anchorName)) return "hkisland";
  if (/九龍/.test(anchorName)) return "kowloon";
  if (/大嶼山/.test(anchorName)) return "lantau";
  if (/新界|北區|大埔|元朗|屯門|沙田|葵青|荃灣|西貢|將軍澳/.test(anchorName)) return "nt";
  return null;
}

// 核對單一個 constraint 係咪俾「乘客實際上車站」滿足。原則：只要冇足夠
// 資料去驗證（搵唔到 anchor 對應邊個站、攞唔到上車站索引等），就寧願放
// 過（回傳 true），好過因為解析／比對唔到就誤刪咗本身有效嘅優惠；但只
// 要搵到足夠資料證明唔滿足，就要老實咁擋走呢條記錄。
function _ctbConstraintSatisfied(constraint, prevLeg, nextLeg) {
  const leg = constraint.leg === "second" ? nextLeg : prevLeg;
  if (!leg) return true;

  // 【可靠性修正】並非每種 constraint 都有 anchors（例如句式 A「首程/次程
  // 繳付全程車資」type:"full_fare" 就完全冇 anchors 呢個欄位，因為佢淨係
  // 講緊車資規則，唔涉及任何站名/地點）。以往落面幾段直接用
  // `constraint.anchors.length` / `for...of constraint.anchors`，一旦
  // 撞到冇 anchors 嘅 constraint（例如 full_fare、或者未來新增嘅句式）
  // 就會因為 anchors 係 undefined 而拋 "constraint.anchors is not
  // iterable" TypeError，累到成個候選（甚至成程搜尋）中斷。而家統一喺
  // 呢度將 anchors 正規化做一個保證存在嘅陣列，落面全部改用呢個本地
  // 變數，就算冇 anchors 都只會當「冇資料可以驗證」（沿用返呢個函數
  // 一貫嘅「驗證唔到就放過」原則），唔會再拋錯。
  const anchors = Array.isArray(constraint.anchors) ? constraint.anchors : [];

  // 處理站點區間範圍（between）
  if (constraint.type === "between") {
    const actualIdx = _ctbLegBoardIdx(leg);
    if (actualIdx === null) return true;
    if (anchors.length >= 2) {
      const idxA = _ctbFindAnchorIdx(leg, anchors[0]);
      const idxB = _ctbFindAnchorIdx(leg, anchors[1]);
      if (idxA !== null && idxB !== null) {
        const minIdx = Math.min(idxA, idxB);
        const maxIdx = Math.max(idxA, idxB);
        return actualIdx >= minIdx && actualIdx <= maxIdx;
      }
    }
    return true;
  }

  // 處理指定地點/區域登車（along）
  if (constraint.type === "along") {
    const board = (typeof etaDb !== "undefined" && etaDb.stopList) ? etaDb.stopList[leg.boardStopId] : null;
    const boardName = _ctbNormalizeStopName(board?.name?.zh || board?.name || "");
    if (boardName) {
      for (const anchorName of anchors) {
        const a = _ctbNormalizeStopName(anchorName);
        if (a && (boardName.includes(a) || a.includes(boardName))) return true;
      }
    }
    const boardLoc = board?.location;
    const boardRegion = boardLoc ? _ctbGuessHkRegion(boardName, boardLoc.lat, boardLoc.lng) : null;
    let anyRegionAnchor = false;
    if (boardRegion) {
      for (const anchorName of anchors) {
        const region = _ctbAnchorRegion(anchorName);
        if (region) {
          anyRegionAnchor = true;
          if (region === boardRegion) return true;
        }
      }
      if (anyRegionAnchor) return false;
    }
    return true;
  }

  // 處理次程行車方向 (direction，例如 remark 講明「轉乘往港珠澳大橋香港
  // 口岸」)——呢類 constraint 講嘅係「次程呢程車實際去緊邊個方向／目的
  // 地」，同上面 before/after／between 嗰種「喺邊個站範圍上車」完全唔同
  // 層次，唔應該用站名索引去比對，必須直接攞次程路線嘅實際目的地嚟核
  // 對。以前呢類 constraint 冇專屬分支，跌落最底嗰段「其餘冇專屬分支嘅
  // 類型」按 before/after 邏輯處理——但 direction 嘅 anchors（例如「港珠
  // 澳大橋香港口岸」）通常喺次程路線嘅站序入面搵唔到（唔係站名，係終點
  // 地區名），令 anyAnchorResolvable 一直係 false，結果一律「驗證唔到就
  // 放過」，變相完全冇檢查次程方向就當合資格。
  if (constraint.type === "direction") {
    const destZh = (leg.r && leg.r.dest && leg.r.dest.zh) || "";
    if (!destZh || !anchors.length) return true; // 冇資料可以核對，維持「驗證唔到就放過」原則
    const d = _ctbNormalizeStopName(destZh);
    for (const anchorName of anchors) {
      const a = _ctbNormalizeStopName(anchorName);
      if (a && d && (d.includes(a) || a.includes(d))) return true;
    }
    return false;
  }

  // 處理「之後 (after)」與「之前 (before)」，以及其餘冇專屬分支嘅類型
  // （例如 full_fare、section_fare）：冇 anchors 可驗證就
  // 直接放過（return true），有 anchors 先按 before/after 邏輯核對。
  const actualIdx = _ctbLegBoardIdx(leg);
  if (actualIdx === null) return true;

  let anyAnchorResolvable = false;
  for (const anchorName of anchors) {
    const anchorIdx = _ctbFindAnchorIdx(leg, anchorName);
    if (anchorIdx === null) continue;
    anyAnchorResolvable = true;
    if (constraint.type === "after" && actualIdx >= anchorIdx) return true;
    if (constraint.type === "before" && actualIdx <= anchorIdx) return true;
  }
  return !anyAnchorResolvable;
}

// 一條候選記錄嘅所有 remarkConstraints 要全部滿足（AND），先算呢條候選對
// 「乘客實際嘅首／次程上車站」嚟講係適用嘅。
function _ctbAllConstraintsSatisfied(remarkConstraints, prevLeg, nextLeg) {
  if (!Array.isArray(remarkConstraints) || !remarkConstraints.length) return true;
  return remarkConstraints.every(c => _ctbConstraintSatisfied(c, prevLeg, nextLeg));
}

// 將 concessionApi 回應（見上面註解嘅格式）整理做扁平陣列，方便逐條篩選比對。
function parseCtbLiveInterchangeResponse(json, routeA, routeB) {
  const out = [];
  if (!json || typeof json !== "object") return out;
  for (const key of Object.keys(json)) {
    const entry = json[key];
    if (!entry || _ctbTrimUp(entry.route) !== routeA) continue;
    const irList = Array.isArray(entry.ir) ? entry.ir : [];
    for (const ir of irList) {
      if (!ir || _ctbTrimUp(ir.route) !== routeB) continue;
      out.push({
        bound: entry.bound || "",
        direction: entry.direction || "",
        secondProvider: (ir.secondProvider || "").trim(),
        secondDirection: ir.direction || "",
        stopName: ir.stopName || "",
        discount: (ir.discount || "").trim().toUpperCase(),
        discountAmount: ir.discountAmount || null,
        totalFare: ir.totalFare || null,
        timeLimit: Number.isFinite(parseFloat(ir.timeLimit)) ? parseFloat(ir.timeLimit) : null,
        remark: (ir.remark || "").trim(),
        // 解析 remark 入面「只適用於響邊個範圍登車」嘅條件，等揀最夾候選
        // 記錄嘅時候，可以連同乘客實際嘅上車站一齊核對（見下面
        // _ctbParseRemarkConstraints／_ctbConstraintSatisfied）。同一條
        // routeA→routeB，官方好多時會回傳幾條 bound/direction 都一樣、但
        // discount 類型／remark 唔同嘅記錄（例如一條話「東區海底隧道轉乘
        // 站或之後上車先啱」，另一條話「香港島沿途各站上車先啱」），單靠
        // 方向比對揀唔返「乘客實際上車站啱唔啱嗰一條」，一定要睇埋 remark。
        remarkConstraints: _ctbParseRemarkConstraints((ir.remark || "").trim())
      });
    }
  }
  return out;
}

async function _fetchCtbViaJinaMarkdown(targetUrl) {
  try {
    const proxyUrl = `https://r.jina.ai/${targetUrl}`;
    const r = await fetch(proxyUrl);
    if (!r.ok) {
      console.warn(`[城巴轉乘] 載入 markdown 回應非 2xx (status ${r.status})：${targetUrl}`);
      return null;
    }
    const text = await r.text();
    const json = _extractJsonFromJinaMarkdown(text);
    if (!json) {
      console.warn(`[城巴轉乘] 由 r.jina.ai markdown 內容摘唔到 JSON：${targetUrl}`);
    }
    return json;
  } catch (err) {
    console.error(`[城巴轉乘] 載入 markdown 失敗，放棄呢次查詢：${targetUrl}`, err);
    return null;
  }
}

function _extractJsonFromJinaMarkdown(text) {
  if (!text) return null;

  // 情況一：整個回應本身已經係原始 JSON（冇 markdown 包裝）
  try {
    return JSON.parse(text.trim());
  } catch (_) { /* 唔係就試下面嘅 markdown 摘取方式 */ }

  let body = text;
  const markerIdx = body.indexOf("Markdown Content:");
  if (markerIdx !== -1) {
    body = body.slice(markerIdx + "Markdown Content:".length);
  }
  body = body.trim();

  // 剝走可能存在嘅 ```json ... ``` 或 ``` ... ``` code fence
  const fenceMatch = body.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
  if (fenceMatch) body = fenceMatch[1].trim();

  try {
    return JSON.parse(body);
  } catch (err) {
    // 保險：如果前後仲有雜訊文字，摘返最外層 {...} 再試一次
    const first = body.indexOf("{");
    const last = body.lastIndexOf("}");
    if (first !== -1 && last !== -1 && last > first) {
      try {
        return JSON.parse(body.slice(first, last + 1));
      } catch (err2) {
        console.warn("[城巴轉乘] 摘取最外層 {...} 後仍 parse 唔到 JSON:", err2, body.slice(0, 200));
        return null;
      }
    }
    console.warn("[城巴轉乘] 由 markdown 內容 parse JSON 失敗:", err, body.slice(0, 200));
    return null;
  }
}

// 帶快取（以 Promise 儲存，避免短時間內重覆 fetch 同一組合）嘅即時查詢。
// routeA = 首程路線編號，routeB = 次程路線編號（皆已經過 _routeKeyForBbi 處理）。
// 回傳 parseCtbLiveInterchangeResponse() 嘅輸出陣列；查詢失敗回傳 []。
function fetchCtbLiveInterchange(routeA, routeB) {
  const cacheKey = `${routeA}|${routeB}`;
  if (ctbLiveInterchangeCache.has(cacheKey)) return ctbLiveInterchangeCache.get(cacheKey);

  const targetUrl = `https://www.citybus.com.hk/concessionApi/public/bbi/api/v1/route/tc/${encodeURIComponent(routeA.toLowerCase())}/${encodeURIComponent(routeB.toLowerCase())}`;
  const promise = _fetchCtbViaJinaMarkdown(targetUrl)
    .then(json => {
      const parsed = parseCtbLiveInterchangeResponse(json, routeA, routeB);
      console.debug(`[城巴轉乘] ${routeA} → ${routeB}：撞中 ${parsed.length} 條記錄`, parsed);
      return parsed;
    })
    .catch(err => {
      console.error(`城巴轉乘優惠即時查詢失敗 (${routeA} → ${routeB}):`, err);
      return [];
    });

  ctbLiveInterchangeCache.set(cacheKey, promise);
  return promise;
}

// 按實際落車/上車方向嘅目的地文字，喺多個候選記錄入面揀返最夾嘅一條
// （例如 S52 兩個方向都可能同時查到 ir 記錄，要揀返同呢程實際方向相符嗰條）。
function _pickBestCtbLiveMatch(candidates, prevLeg, nextLeg, gap) {
  const prevDestZh = (prevLeg.r && prevLeg.r.dest && prevLeg.r.dest.zh) || "";
  const nextDestZh = (nextLeg.r && nextLeg.r.dest && nextLeg.r.dest.zh) || "";

  let best = null;
  let bestScore = -1;
  for (const c of candidates) {
    if (c.timeLimit !== null && gap > c.timeLimit) continue; // 超過轉乘時限，唔適用
    // 同一組 bound/direction/secondDirection 有時會撞出幾條 discount 類型
    // 唔同嘅記錄（例如 L1 vs L2），單靠下面嘅方向評分分唔出邊條先啱，一
    // 定要用 remark 講明嘅上車範圍，同乘客實際嘅首／次程上車站對比先
    // 揀得準；唔符合範圍嘅記錄喺呢度直接擋走，唔會入到落面評分。
    if (!_ctbAllConstraintsSatisfied(c.remarkConstraints, prevLeg, nextLeg)) continue;
    // 【建議轉車站位置檢定】同上面 remark constraints 互補：就算 remark
    // 冇講明上/落車範圍，都要核對官方 stopName 講嘅建議轉車站，確保首程
    // 冇喺建議轉車站之前就提早落車轉車（見 _ctbStopNameConstraintSatisfied
    // 頂部註解）。
    if (!_ctbStopNameConstraintSatisfied(c.stopName, prevLeg, nextLeg)) continue;
    let score = 0;
    if (prevDestZh && c.direction && (c.direction === prevDestZh || prevDestZh.includes(c.direction) || c.direction.includes(prevDestZh))) score += 2;
    if (nextDestZh && c.secondDirection && (c.secondDirection === nextDestZh || nextDestZh.includes(c.secondDirection) || c.secondDirection.includes(nextDestZh))) score += 1;
    if (score > bestScore) { bestScore = score; best = c; }
  }
  return best;
}

// 即時計算城巴（含跨公司）轉乘優惠。回傳：
//   discount          : FR 類「減收」金額（要喺次程車費度直接扣）
//   totalFareOverride : TF 類「兩程合共車資」（要用「兩程合計 - 呢個數」嚟計扣減）
//   rebateFirstLeg     : L1 類「回贈首程車費」金額（首程本身維持全費，
//                         實際係喺【次程】上車嗰陣用「次程原價 − 呢個
//                         金額」嚟收，即係要喺次程車費度扣，唔係首程）
//   secondLegFree      : L2 類「次程免費」金額（要喺次程車費度扣，令
//                         次程上車完全免費）
async function _ctbLiveDiscountFor(prevLeg, nextLeg) {
  const none = { discount: 0, totalFareOverride: null, rebateFirstLeg: 0, secondLegFree: 0 };
  // concessionApi 淨係城巴自己（含接駁其他巴士公司）嘅轉乘優惠資料，同
  // 港鐵完全冇關。
  if (prevLeg.co === "mtr" || nextLeg.co === "mtr") return none;
  // 【修正一】concessionApi 淨係城巴自己（連同接駁其他專營巴士公司，例如
  // 九巴/龍運/新巴）嘅轉乘優惠資料，專線/紅色小巴（co === "gmb"）從來
  // 都唔屬於呢個優惠計劃——就算首程或次程其中一程係城巴，只要另一程係
  // 小巴，都一定冇任何城巴轉乘優惠。以前呢度淨係檢查「兩程都唔係城巴就
  // 放過」，冇理會另一程係咪小巴，令城巴轉小巴（例如 962X→55）被誤判
  // 成「有機會撞中優惠」，白白查一次 API、甚至誤套用埋唔屬於佣嘅折扣。
  if (prevLeg.co === "gmb" || nextLeg.co === "gmb") return none;
  // concessionApi 係城巴自己嘅轉乘優惠資料，只要首程或次程其中一程係城巴
  // 就有機會撞中（可以係城巴轉城巴，亦可以係城巴轉/接其他公司，例如龍運）。
  if (prevLeg.co !== "ctb" && nextLeg.co !== "ctb") return none;
  const gap = _transferGapMinutes(prevLeg, nextLeg);
  if (gap === null) return none;

  const routeA = _routeKeyForBbi(prevLeg.routeNo);
  const routeB = _routeKeyForBbi(nextLeg.routeNo);
  if (!routeA || !routeB) return none;

  const candidates = await fetchCtbLiveInterchange(routeA, routeB);
  if (!candidates.length) return none;

  const best = _pickBestCtbLiveMatch(candidates, prevLeg, nextLeg, gap);
  if (!best) return none;

  const result = { discount: 0, totalFareOverride: null, rebateFirstLeg: 0, secondLegFree: 0 };
  switch (best.discount) {
    case "FR": {
      // 減收 discountAmount
      const amt = parseFloat(best.discountAmount && best.discountAmount.adult);
      if (Number.isFinite(amt)) result.discount = amt;
      break;
    }
    case "TF": {
      // 兩程優惠車資合共 totalFare
      const tf = parseFloat(best.totalFare && best.totalFare.adult);
      if (Number.isFinite(tf)) result.totalFareOverride = tf;
      break;
    }
    case "L1":
      // 回贈首程車費：金額 = 首程（較先嗰程）嘅原價，實際扣減會落
      // 喺次程（上車嗰程）身上，即「次程原價 − 首程車費」（睇下面
      // computeTripFare 點套用）。
      result.rebateFirstLeg = typeof prevLeg.fare === "number" ? prevLeg.fare : 0;
      break;
    case "L2":
      // 次程免費：上車（次程）嗰程完全唔收錢
      result.secondLegFree = typeof nextLeg.fare === "number" ? nextLeg.fare : 0;
      break;
    default:
      break;
  }
  return result;
}

// 輕鐵 ↔ 屯馬綫／港鐵巴士（新界西北）轉乘優惠
//   1) 輕鐵 ↔ 屯馬綫：如果輕鐵嗰程車費不超過 $5.4，並喺轉乘站 30 分鐧內
//      入站（不論方向：輕鐧轉屯馬綫，或屯馬綫轉輕鐵），輕鐵車費可
//      獲豁免（豁免對象一律係輕鐵嗰程,唔係屯馬綫嗰程）。
//   2) 輕鐵 ↔ 港鐵巴士（新界西北）：60 分鐧內轉乘（不論方向），較低嗰
//      程車費（輕鐧或港鐧巴士，睇邊個平）可獲豁免。
//   3) 容許三重轉乘：輕鐧→屯馬綫→輕鐧／輕鐧→屯馬綫→港鐧巴士／
//      港鐧巴士→屯馬綫→輕鐧，三重轉乘全程時限放寬到 120 分鐧（首程
//      跟尾程之間），中間嗰程屯馬綫純粹做橋，實際仲係比較輕鐧同港鐧
//      巴士兩程（如果三程都係輕鐧/屯馬綫/輕鐧,就兩程輕鐧各自獨立評
//      估自己嗰邊嘅 30 分鐧/$5.4 條件）。
//   4) 港鐵巴士 ↔ 屯馬綫（不經輕鐧）：25 分鐧內轉乘（不論方向），全額
//      豁免港鐧巴士嗰程車費，全程淨係收屯馬綫嗰程車費。

function isTmlLeg(leg) {
  return !!(leg && leg.co === "mtr" && leg.r && leg.r.mtrLineCode === "TML");
}
function isLrLeg(leg) {
  return !!(leg && leg.co === "lightrail");
}
function isMtrbLeg(leg) {
  return !!(leg && leg.co === "mtrb");
}
// 【港鐧重鐵判斷（收 co 字串）】專門畀「站內轉乘」呢類判斷用——淨係
// co==="mtr"（重鐵）先算，唔計輕鐧／港鐧巴士：地政總署室內地圖 API
// 只覆蓋重鐵車站室內空間，輕鐧月台喺路面、冇呢種「出入閘機、行幾百米
// 通道」嘅室內轉乘特性，唔應該套用呢個邏輯。
function isRailCo(co) {
  return co === "mtr";
}

const LR_TML_FARE_CAP = 5.4;   // 輕鐵一程車費上限,先合資格獲屯馬綫轉乘豁免
const LR_TML_GAP_MIN = 30;     // 輕鐵 ↔ 屯馬綫轉乘時限（分鐧）
const LR_MTRB_GAP_MIN = 60;    // 輕鐵 ↔ 港鐵巴士轉乘時限（分鐧）
const LR_TRIPLE_GAP_MIN = 120; // 三重轉乘全程時限（分鐧）
// 【港鐧巴士 ↔ 屯馬綫（不經輕鐧）轉乘優惠】港鐧巴士（西鐵綠色專營巴士
// 服務，例如 K65）喺轉車站規定時限內以八達通轉乘屯馬綫（或反方向），
// 港鐧巴士嗰程車費可全額豁免，全程淨係收屯馬綫嗰程車費。呢個同上面
// 輕鐧涉及嘅轉乘優惠（會比較邊程平嚟豁免）唔同，港鐧巴士呢邊唔理車費
// 邊程貴,一律豁免港鐧巴士嗰程。同樣係根據用戶提供文字規則寫嘅簡化實作,
// 冇經過官方逐項核實,如有出入請以官方公佈為準。
const MTRB_TML_GAP_MIN = 30;   // 港鐧巴士 ↔ 屯馬綫轉乘時限（分鐧）

// 傳入完整 rideLegs,回傳一個同 rideLegs 長度一致嘅 discounts 陣列
// （每個 index 代表嗰一程應豁免幾多錢）,交返 computeTripFare() 同其他
// 折扣（九巴 BBI／城巴轉乘等）一齊用 Math.max 疊加。
function _lrInterchangeDiscounts(rideLegs) {
  const discounts = new Array(rideLegs.length).fill(0);
  if (rideLegs.length < 2) return discounts;

  const handledPairs = new Set(); // 已經被三重轉乘處理咗嘅相鄰對,下面單一轉乘邏輯唔會再重複計

  // 先處理三重轉乘（3 程,中間一定係屯馬綫做「橋」）
  for (let i = 0; i + 2 < rideLegs.length; i++) {
    const legA = rideLegs[i], legB = rideLegs[i + 1], legC = rideLegs[i + 2];
    if (!isTmlLeg(legB)) continue;

    const isTriple =
      (isLrLeg(legA) && isLrLeg(legC)) ||
      (isLrLeg(legA) && isMtrbLeg(legC)) ||
      (isMtrbLeg(legA) && isLrLeg(legC));
    if (!isTriple) continue;

    const totalGap = _transferGapMinutes(legA, legC); // 首程到尾程嘅全程時限
    if (totalGap === null || totalGap > LR_TRIPLE_GAP_MIN) continue;

    if (isLrLeg(legA) && isLrLeg(legC)) {
      // 輕鐵→屯馬綫→輕鐵：兩程輕鐵各自獨立符合返自己嗰邊嘅 30 分/$5.4 先豁免
      const gap1 = _transferGapMinutes(legA, legB);
      if (gap1 !== null && gap1 <= LR_TML_GAP_MIN && typeof legA.originalFare === "number" && legA.originalFare <= LR_TML_FARE_CAP) {
        discounts[i] = Math.max(discounts[i], legA.originalFare);
      }
      const gap2 = _transferGapMinutes(legB, legC);
      if (gap2 !== null && gap2 <= LR_TML_GAP_MIN && typeof legC.originalFare === "number" && legC.originalFare <= LR_TML_FARE_CAP) {
        discounts[i + 2] = Math.max(discounts[i + 2], legC.originalFare);
      }
    } else {
      // 輕鐵→屯馬綫→港鐵巴士 或 港鐵巴士→屯馬綫→輕鐵：屯馬綫做橋,
      // 實際比較嘅係輕鐵嗰程 vs 港鐵巴士嗰程,揀平嗰程豁免。
      const lrIdx = isLrLeg(legA) ? i : i + 2;
      const mtrbIdx = isMtrbLeg(legA) ? i : i + 2;
      const lrLeg = rideLegs[lrIdx];
      const mtrbLeg = rideLegs[mtrbIdx];
      if (typeof lrLeg.originalFare === "number" && typeof mtrbLeg.originalFare === "number") {
        if (lrLeg.originalFare <= mtrbLeg.originalFare) {
          discounts[lrIdx] = Math.max(discounts[lrIdx], lrLeg.originalFare);
        } else {
          discounts[mtrbIdx] = Math.max(discounts[mtrbIdx], mtrbLeg.originalFare);
        }
      }
    }

    handledPairs.add(`${i}-${i + 1}`);
    handledPairs.add(`${i + 1}-${i + 2}`);
  }

  // 處理普通單一轉乘
  for (let i = 1; i < rideLegs.length; i++) {
    const key = `${i - 1}-${i}`;
    if (handledPairs.has(key)) continue;
    const prevLeg = rideLegs[i - 1], nextLeg = rideLegs[i];

    if ((isLrLeg(prevLeg) && isTmlLeg(nextLeg)) || (isTmlLeg(prevLeg) && isLrLeg(nextLeg))) {
      const lrIdx = isLrLeg(prevLeg) ? i - 1 : i;
      const lrLeg = rideLegs[lrIdx];
      const gap = _transferGapMinutes(prevLeg, nextLeg);
      if (gap !== null && gap <= LR_TML_GAP_MIN && typeof lrLeg.originalFare === "number" && lrLeg.originalFare <= LR_TML_FARE_CAP) {
        discounts[lrIdx] = Math.max(discounts[lrIdx], lrLeg.originalFare);
      }
    } else if ((isLrLeg(prevLeg) && isMtrbLeg(nextLeg)) || (isMtrbLeg(prevLeg) && isLrLeg(nextLeg))) {
      const gap = _transferGapMinutes(prevLeg, nextLeg);
      if (gap !== null && gap <= LR_MTRB_GAP_MIN &&
          typeof prevLeg.originalFare === "number" && typeof nextLeg.originalFare === "number") {
        if (prevLeg.originalFare <= nextLeg.originalFare) {
          discounts[i - 1] = Math.max(discounts[i - 1], prevLeg.originalFare);
        } else {
          discounts[i] = Math.max(discounts[i], nextLeg.originalFare);
        }
      }
    } else if ((isMtrbLeg(prevLeg) && isTmlLeg(nextLeg)) || (isTmlLeg(prevLeg) && isMtrbLeg(nextLeg))) {
      // 港鐵巴士 ↔ 屯馬綫：全額豁免港鐵巴士
      const mtrbIdx = isMtrbLeg(prevLeg) ? i - 1 : i;
      const mtrbLeg = rideLegs[mtrbIdx];
      const gap = _transferGapMinutes(prevLeg, nextLeg);
      if (gap !== null && gap <= MTRB_TML_GAP_MIN && typeof mtrbLeg.originalFare === "number") {
        discounts[mtrbIdx] = Math.max(discounts[mtrbIdx], mtrbLeg.originalFare);
      }
    }
  }

  return discounts;
}

// 計算整個行程嘅車費：由各程車費相加做基礎，再扣減沿途所有符合資格嘅轉乘優惠。
// 回傳 { totalFare, discount } ；如果冇齊車費資料就回傳 { totalFare: null, discount: 0 }。
async function computeTripFare(rideLegs) {
  // 【修正二】補全港鐵車費：巴士轉乘港鐵時，港鐵 leg 嘅 fare 可能因
  // mtrFareDb 仲未載入而係 null，令整個行程車費無法計算。
  // 【修正三】補全輕鐵車費：同理，lrFareDb 可能仲未載入令 fare 係 null。
  // 呢度喺 hasFullFareInfo 檢查之前補番一次，確保只要資料最終攞到手，
  // 車費就一定能反映落結果度。
  for (const leg of rideLegs) {
    if (typeof leg.fare === "number") continue;
    if (leg.co === "mtr") {
      const fromCode = String(leg.boardStopId || "").replace(/^MTR-/i, "");
      const toCode = String(leg.alightStopId || "").replace(/^MTR-/i, "");
      try { const f = getMtrFare(fromCode, toCode); if (typeof f === "number") leg.fare = f; } catch (_e) {}
    } else if (leg.co === "lightrail") {
      const lrCodes = (leg.r && leg.r.lrStationCodes) || [];
      const stopIds = (leg.r && leg.r.stops && leg.r.stops.lightrail) || [];
      const boardIdx = stopIds.indexOf(leg.boardStopId);
      const alightIdx = stopIds.indexOf(leg.alightStopId);
      if (boardIdx !== -1 && alightIdx !== -1) {
        try {
          const f = await getLightRailFare(lrCodes[boardIdx], lrCodes[alightIdx]);
          if (typeof f === "number") leg.fare = f;
        } catch (_e) {}
      }
    }
  }

  const hasFullFareInfo = rideLegs.length > 0 && rideLegs.every(leg => typeof leg.fare === "number");
  if (!hasFullFareInfo) return { totalFare: null, discount: 0 };

  // 備份並還原原始車費，避免多次計算或排序時折扣重複遞減
  for (const leg of rideLegs) {
    if (leg.originalFare === undefined) {
      leg.originalFare = leg.fare;
    } else {
      leg.fare = leg.originalFare;
    }
    leg.hasUnquantifiedCtbDiscount = false;
  }

  // 港鐵連續車程直接計算全程車費
  {
    let i = 0;
    while (i < rideLegs.length) {
      if (rideLegs[i].co !== "mtr") { i++; continue; }
      let j = i;
      while (j + 1 < rideLegs.length && rideLegs[j + 1].co === "mtr") j++;
      if (j > i) {
        const fromCode = String(rideLegs[i].boardStopId || "").replace(/^MTR-/, "");
        const toCode = String(rideLegs[j].alightStopId || "").replace(/^MTR-/, "");
        let throughFare = null;
        try { throughFare = getMtrFare(fromCode, toCode); } catch (e) { throughFare = null; }
        if (typeof throughFare === "number") {
          rideLegs[i].originalFare = throughFare;
          rideLegs[i].fare = throughFare;
          for (let k = i + 1; k <= j; k++) {
            rideLegs[k].originalFare = 0;
            rideLegs[k].fare = 0;
          }
        }
      }
      i = j + 1;
    }
  }

  // 記錄每一程應扣減的折扣金額。注意：呢個陣列可以喺唔同嘅轉乘優惠計算
  // （輕鐵/屯馬綫三重轉乘、九巴 BBI、城巴 FR/TF/L1/L2 等）之間被同一個
  // index 重複寫入，所以要用 Math.max 疊加，唔可以直接覆寫，避免蓋走
  // 另一個轉乘對已經計落嘅折扣。（城巴 L1/L2/FR/TF 依家一律扣落「次程」
  // 即上車嗰程 i，首程 i-1 維持全費唔會被呢幾類城巴折扣影響。）
  const discounts = new Array(rideLegs.length).fill(0);

  // 輕鐵 ↔ 屯馬綫／港鐵巴士轉乘優惠（見 _lrInterchangeDiscounts() 頂部
  // 註解）獨立計算,同下面九巴/城巴嘅折扣一樣用 Math.max 疊加落同一個
  // discounts 陣列,避免互相蓋走。
  const lrDiscounts = _lrInterchangeDiscounts(rideLegs);
  for (let i = 0; i < discounts.length; i++) {
    discounts[i] = Math.max(discounts[i], lrDiscounts[i]);
  }

  let kmbTransferCount = 0; // 追蹤九巴連續轉車次數
  for (let i = 1; i < rideLegs.length; i++) {
    const prevLeg = rideLegs[i - 1];
    const nextLeg = rideLegs[i];

    let kmbDiscount = 0;
    if (prevLeg.co === "kmb" && nextLeg.co === "kmb") {
      kmbTransferCount++;
      kmbDiscount = _kmbBbiDiscountFor(prevLeg, nextLeg, kmbTransferCount);
    } else {
      kmbTransferCount = 0; // 如果中途轉乘了其他公司，重置計數
    }

    if (kmbDiscount > 0) {
      discounts[i] = Math.max(discounts[i], kmbDiscount);
      continue;
    }

    // 龍運「E」線 ←→ 嶼巴大嶼山路線轉乘優惠
    const nlbDiscount = _kmbNlbTransferDiscountFor(prevLeg, nextLeg);
    if (nlbDiscount > 0) {
      discounts[i] = Math.max(discounts[i], nlbDiscount);
      continue;
    }

    if (prevLeg.co !== "ctb" && nextLeg.co !== "ctb") continue;
    // 【修正一】小巴（co === "gmb"）唔屬於城巴轉乘優惠計劃，就算另一程係
    // 城巴都唔應該當有機會有優惠——避免好似 962X→55（小巴）咁被誤判、
    // 誤套用折扣。詳細原因見 _ctbLiveDiscountFor() 頂部註解。
    if (prevLeg.co === "gmb" || nextLeg.co === "gmb") continue;

    // 【可靠性】呢個轉乘優惠查詢牽涉緊即時 API 回應解析、remark 文字
    // parsing 等好多環節，任何一環出現預期外嘅格式都可能拋錯；一旦拋
    // 出嚟冇接住，會累到成個 computeTripFare（甚至上游成程 dfs 搜尋）
    // 中斷。呢度加返 try/catch 頂住：查優惠失敗就當冇優惠（none），
    // 唔應該因為「有冇轉乘優惠」呢個次要功能拖冧核心車費／搜尋結果。
    let ctb;
    try {
      ctb = await _ctbLiveDiscountFor(prevLeg, nextLeg);
    } catch (e) {
      console.warn("[城巴轉乘優惠] 查詢/計算失敗，當冇優惠處理：", e);
      ctb = { discount: 0, totalFareOverride: null, rebateFirstLeg: 0, secondLegFree: 0 };
    }
    if (ctb.totalFareOverride !== null) {
      // TF：呢兩程合計直接用返官方公佈嘅套餐總價
      const twoLegSum = prevLeg.originalFare + nextLeg.originalFare;
      const diff = twoLegSum - ctb.totalFareOverride;
      if (diff > 0) discounts[i] = Math.max(discounts[i], diff);
    } else if (ctb.rebateFirstLeg > 0) {
      // L1：回贈首程車費 —— 實際八達通運作係喺【上次程（呢一程 i）】嗰陣
      // 即時用「次程原價 − 首程車費」嚟收，唔係將首程（i-1）變做免費。
      // 首程（i-1）上車嗰陣已經全費收咗，唔應該被呢個折扣影響；扣減
      // 應該記落次程（i），金額 = 首程車費（見上面 rebateFirstLeg 嘅計法）。
      // 總車費結果同「扣落首程」數學上一樣（都係得次程原價），但逐程
      // 顯示先啱：首程全費、次程只收差價，先啱返現實八達通嘅收費畫面。
      discounts[i] = Math.max(discounts[i], ctb.rebateFirstLeg);
    } else if (ctb.secondLegFree > 0) {
      // L2：次程免費 —— 上車（呢一程 i）嗰陣完全唔收錢，扣減記落呢一程（i）
      discounts[i] = Math.max(discounts[i], ctb.secondLegFree);
    } else if (ctb.discount > 0) {
      // FR：減收指定金額 —— 扣減記落呢一程（i）
      discounts[i] = Math.max(discounts[i], ctb.discount);
    }
  }

  // 將計算得到的轉乘優惠直接套用到各程的 fare 上，供畫面渲染正確的折後價錢
  let totalDiscount = 0;
  for (let i = 0; i < rideLegs.length; i++) {
    if (discounts[i] > 0) {
      const capped = Math.min(discounts[i], rideLegs[i].originalFare);
      rideLegs[i].fare = Math.max(0, Math.round((rideLegs[i].originalFare - capped) * 10) / 10);
      totalDiscount += capped;
    }
  }

  const sum = rideLegs.reduce((s, leg) => s + leg.originalFare, 0);
  const totalFare = Math.round((sum - totalDiscount) * 10) / 10;
  return { totalFare: Math.max(0, totalFare), discount: Math.round(totalDiscount * 10) / 10 };
}

// 背景載入體積較大嘅 bbi_f1 / bbi_b1（九巴 BBI 轉乘優惠明細），唔阻住主要搜尋功能。
async function loadBbiHeavyData() {
  try {
    const [f1, b1] = await Promise.all([
      fetch("https://raw.githubusercontent.com/LOOHP/HK-KMB-Calculator/data/data/bbi_f1.json").then(r => r.ok ? r.json() : null),
      fetch("https://raw.githubusercontent.com/LOOHP/HK-KMB-Calculator/data/data/bbi_b1.json").then(r => r.ok ? r.json() : null)
    ]);
    bbiF1Db = f1;
    bbiB1Db = b1;
  } catch (err) {
    console.error("背景載入九巴 BBI 轉乘優惠資料失敗:", err);
  } finally {
    bbiHeavyLoaded = true; // 就算失敗都要標記完成，避免一直嘗試阻住計算
  }
}

// 載入其餘車費 JSON（體積細，隨主要資料一齊載入）
async function loadBbiLightData() {
  try {
    // 城巴轉乘優惠已經改用 fetchCtbLiveInterchange() 即時查詢城巴官方
    const [stopIds, regionalFare, ctbRouteIds, mtrBusRoutes] = await Promise.all([
      fetch("https://raw.githubusercontent.com/LOOHP/HK-KMB-Calculator/data/data/kmb_bbi_stop_id.json").then(r => r.ok ? r.json() : null),
      fetch("https://raw.githubusercontent.com/LOOHP/HK-KMB-Calculator/data/data/regional_two_way_section_fare.json").then(r => r.ok ? r.json() : null),
      fetch("https://raw.githubusercontent.com/LOOHP/HK-KMB-Calculator/data/data/ctb_route_ids.json").then(r => r.ok ? r.json() : null),
      fetch("https://raw.githubusercontent.com/LOOHP/HK-KMB-Calculator/data/data/mtr_bus_routes.json").then(r => r.ok ? r.json() : null)
    ]);
    kmbBbiStopDb = stopIds;
    buildKmbBbiInterchangeNames(kmbBbiStopDb);
    regionalTwoWayFareDb = regionalFare;
    ctbRouteIdsDb = ctbRouteIds;
    buildCtbLiveBoundsIndex(ctbRouteIdsDb);
    mtrBusRouteFareDb = buildMtrBusFareIndex(mtrBusRoutes);
  } catch (err) {
    console.error("載入轉乘車費輔助資料失敗:", err);
  } finally {
    bbiLightLoaded = true;
  }
}

// 背景載入嶼巴（NLB）官方路線列表 API，建立 nlbId -> 服務種類標籤對照表，
// 等自選行程選單可以喺同一巴士號碼／方向出現多個分支時加返標籤分辨（見
// getNlbVariantDesc()）。
async function loadNlbRouteList() {
  try {
    const res = await fetch("https://rt.data.gov.hk/v2/transport/nlb/route.php?action=list");
    const json = res.ok ? await res.json() : null;
    const list = json && Array.isArray(json.routes) ? json.routes : [];
    const map = new Map();
    for (const rt of list) {
      if (!rt || rt.routeId === undefined || rt.routeId === null) continue;
      const nameC = String(rt.routeName_c || "");
      const arrowIdx = nameC.indexOf(">");
      const origPart = (arrowIdx !== -1 ? nameC.substring(0, arrowIdx) : nameC).trim();
      if (!origPart) continue;
      map.set(String(rt.routeId), `從 ${origPart}`);
    }
    nlbRouteTagDb = map;
  } catch (err) {
    console.error("背景載入嶼巴路線列表失敗:", err);
    nlbRouteTagDb = null;
  }
}

// 載入官方路線列表 API，快速建立「路線 + service_type」現正有效嘅組合索引
async function loadKmbRouteVariantIndex() {
  try {
    const res = await fetch("https://data.etabus.gov.hk/v1/transport/kmb/route/");
    const json = res.ok ? await res.json() : null;
    const list = json && Array.isArray(json.data) ? json.data : [];
    const map = new Map();
    for (const rec of list) {
      const routeNo = String(rec.route || "").toUpperCase().trim();
      const svcType = String(rec.service_type || "").trim();
      if (!routeNo) continue;
      if (!map.has(routeNo)) map.set(routeNo, new Set());
      if (svcType) map.get(routeNo).add(svcType);
    }
    kmbLiveServiceTypesByRoute = map;
  } catch (err) {
    console.error("背景載入九巴官方路線列表失敗:", err);
    kmbLiveServiceTypesByRoute = null;
  } finally {
    kmbRouteIndexLoaded = true;
  }
}

// 利用 ctb_route_ids.json（已喺 loadBbiLightData 載入做 ctbRouteIdsDb）建立
// 「路線 + 方向」現正存在嘅組合索引，用嚟輔助核實城巴路線方向係咪確實存在。
function buildCtbLiveBoundsIndex(ctbRouteIdsDb) {
  const map = new Map();
  if (!ctbRouteIdsDb) { ctbLiveBoundsByRoute = map; return; }
  for (const [routeNo, boundsObj] of Object.entries(ctbRouteIdsDb)) {
    const key = String(routeNo || "").toUpperCase().trim();
    if (!key || !boundsObj) continue;
    if (!map.has(key)) map.set(key, new Set());
    for (const bound of Object.keys(boundsObj)) {
      map.get(key).add(String(bound).toUpperCase());
    }
  }
  ctbLiveBoundsByRoute = map;
}

// 快速核實某條九巴路線嘅 service_type 現時是否仍然喺官方路線列表入面存在。
function isKmbServiceTypeLive(routeNo, serviceType) {
  if (!kmbRouteIndexLoaded || !kmbLiveServiceTypesByRoute) return null;
  const key = String(routeNo || "").toUpperCase().trim();
  const types = kmbLiveServiceTypesByRoute.get(key);
  if (!types) return null; // 呢條路線完全搵唔到，可能係命名/資料源差異，交返上層處理
  if (!serviceType) return true; // 冇特別註明 service_type 就唔額外收緊
  return types.has(String(serviceType).trim());
}

/* ---------------- 港鐵巴士靜態路線／站點資料 ---------------- */
const MTR_BUS_STOPS_CSV_URL = "https://seep.eu.org/https://opendata.mtr.com.hk/data/mtr_bus_stops.csv";
// loadMtrBusStaticData() 判斷出嚟嘅循環線 ROUTE_ID 集合，喺 init() 攞到
// 之後暫存喺度；因為 loadRouteFareData() 入面嘅 _markCircularRoutes()
// 會成個 circularRouteCos 推倒重嚟，所以要等嗰次跑完先至補寫返落去，
// 唔可以喺呢度就寫（見 loadRouteFareData() 入面嘅補寫邏輯）。
let mtrBusCircularRouteIds = new Set();

// 【路線分支識別，改用 REFERENCE_ID 分組】原本以為 mtr_bus_stops.csv 入面
// 同一條「母線」嘅唔同分支會用唔同嘅 ROUTE_ID 表示（例如 K75P/K75P1），
// REFERENCE_ID 淨係指返去嗰條母線。但實測整份 CSV 之後發現完全唔係咁：
// 好多路線（506、K51、K52、K66、K68、K73、K75P、K75S……）嘅唔同分支其實
// 共用返同一個 ROUTE_ID（例如 K73／K73-1／K73-2 三條分支嘅 ROUTE_ID 全部
// 都係 "K73"），真正分辨得到「呢行屬於邊條分支」嘅其實係 REFERENCE_ID
// 呢一欄——每條分支各自有自己獨一無二嘅 REFERENCE_ID（母線本身嘅
// REFERENCE_ID 就等於自己個 ROUTE_ID；分支嘅 REFERENCE_ID 就係嗰個分支
// 實際嘅巴士牌代號，例如 "K73-1"）。以前淨係用 ROUTE_ID+DIRECTION 分組，
// 會將呢啲分支嘅站全部混埋一齊、再靠 STATION_SEQNO 排序，搞到成條線嘅
// 站序亂晒（「所有分支嘅站都當同一條線」），落面轉車搜尋、站序顯示全部
// 跟住錯。而家分組 key 改用 REFERENCE_ID+DIRECTION，每條分支各自攞返
// 屬於自己嘅站；「route」顯示欄位都改用 REFERENCE_ID（即巴士牌實際顯示
// 嗰個分支代號），ROUTE_ID 就淨係做返佢應有嘅角色——記低呢班分支共同
// 所屬嘅「母線」代號（motherRouteId），畀分支選擇 UI 同「XX 分支」標籤
// 用嚟分辨、群組返同一條母線底下嘅兄弟分支。
async function loadMtrBusStaticData() {
  try {
    const res = await fetch(MTR_BUS_STOPS_CSV_URL);
    if (!res.ok) return { stops: {}, routes: {}, circularRouteIds: new Set() };
    const text = await res.text();
    const rows = parseHeadwayCsv(text); // 重用現有支援引號嘅CSV parser

    const newStops = {};
    const grouped = new Map(); // "REFERENCE_ID|DIRECTION" -> [{seq, stopId}]
    const motherRouteByRef = new Map(); // REFERENCE_ID -> ROUTE_ID（所屬母線代號）
    const hasInboundByRef = new Map(); // REFERENCE_ID -> 呢條分支曾經見過 DIRECTION="I" 未

    for (const row of rows) {
      const routeId = row.ROUTE_ID, dir = row.DIRECTION, stationId = row.STATION_ID;
      // REFERENCE_ID 有時會冧咗（舊資料/個別分支冇填），冇嘅話就當自己
      // 獨立成一條線（用返 ROUTE_ID 頂住，唔會撞埋第二條分支）。
      const referenceId = (row.REFERENCE_ID && String(row.REFERENCE_ID).trim()) || routeId;
      const lat = parseFloat(row.STATION_LATITUDE), lng = parseFloat(row.STATION_LONGITUDE);
      if (!routeId || !stationId || !Number.isFinite(lat) || !Number.isFinite(lng)) continue;

      const internalStopId = "MTRB_" + stationId;
      if (!newStops[internalStopId]) {
        const stopInfo = {
          name: { zh: row.STATION_NAME_CHI || row.STATION_NAME_ENG || stationId, en: row.STATION_NAME_ENG || row.STATION_NAME_CHI || stationId },
          location: { lat, lng },
          mtrBusStationId: stationId // 用嚟同 rt.data.gov.hk 即時 API 返回嘅 busStopId 直接比對
        };
        newStops[internalStopId] = stopInfo;
        // 【同 routeFareList.min.json 比對用】routeFareList.min.json 入面
        // 港鐵巴士路線嘅 stops 陣列用嘅係原始（冇 "MTRB_" prefix）嘅
        // STATION_ID，同呢個 app 內部自訂嘅 "MTRB_"+STATION_ID 格式唔一
        // 樣。呢度加多個原始 id 做 alias key 指返去同一個站，等
        // loadRouteFareData() 直接採納 routeFareList 嗰啲已經拆好分支嘅
        // 港鐵巴士路線（見下面 mtrBusBranchGroups 交叉驗證）嗰陣，站名／
        // 座標一樣攞得返，唔會因為 id 格式唔同而變空白。
        if (!newStops[stationId]) newStops[stationId] = stopInfo;
      }

      if (!motherRouteByRef.has(referenceId)) motherRouteByRef.set(referenceId, routeId);

      // 循環線判斷，分支獨立判斷
      // 判斷：呢條分支成程都冇見過 DIRECTION="I"（回程）就視為循環線。
      const isInbound = String(dir || "").toUpperCase().startsWith("I");
      if (isInbound) {
        hasInboundByRef.set(referenceId, true);
      } else if (!hasInboundByRef.has(referenceId)) {
        hasInboundByRef.set(referenceId, false);
      }

      const key = referenceId + "|" + dir;
      if (!grouped.has(key)) grouped.set(key, []);
      grouped.get(key).push({ seq: parseInt(row.STATION_SEQNO, 10) || 0, stopId: internalStopId });
    }

    // REFERENCE_ID 本身唔等於所屬 ROUTE_ID（母線代號）嘅，即係分支
    // （例如 K73-1 嘅母線係 K73；K75P1 嘅母線係 K75P）。
    const branchRefIds = new Set();
    for (const [refId, motherId] of motherRouteByRef.entries()) {
      if (motherId && motherId !== refId) branchRefIds.add(refId);
    }

    // 冇見過 "I" 嘅分支就係循環線
    const circularRouteIds = new Set();
    for (const [refId, inbound] of hasInboundByRef.entries()) {
      if (!inbound) circularRouteIds.add(refId);
    }

    const newRoutes = {};
    for (const [key, list] of grouped.entries()) {
      const [referenceId, dir] = key.split("|");
      list.sort((a, b) => a.seq - b.seq);
      const stopIds = list.map(x => x.stopId);
      if (stopIds.length < 2) continue;
      const origStop = newStops[stopIds[0]];
      const destStop = newStops[stopIds[stopIds.length - 1]];
      const motherRouteId = motherRouteByRef.get(referenceId) || referenceId;
      const routeKey = `MTRB+${referenceId}+${dir}`;
      newRoutes[routeKey] = {
        route: referenceId, // 顯示用路線編號：分支嘅話呢個先係巴士牌實際顯示嗰個分支代號
        co: ["mtrb"],
        bound: { mtrb: dir },
        orig: { zh: origStop.name.zh, en: origStop.name.en },
        dest: { zh: destStop.name.zh, en: destStop.name.en },
        stops: { mtrb: stopIds },
        fares: null,
        faresHoliday: null,
        isMtrBusVerified: true,
        motherRouteId,                              // 所屬母線代號（ROUTE_ID）
        isBranch: branchRefIds.has(referenceId),     // 係咪母線底下嘅分支
        isCircular: circularRouteIds.has(referenceId) // 冇 "I" 方向 = 循環線
      };
    }
    return { stops: newStops, routes: newRoutes, circularRouteIds };
  } catch (err) {
    console.error("載入港鐵巴士資料失敗", err);
    return { stops: {}, routes: {}, circularRouteIds: new Set() };
  }
}

/* ---------------- data load ---------------- */
async function loadRouteFareData() {
  const fareBtn = document.querySelector('.crit-btn[data-crit="fare"]');
  try {
    const fareData = await fetch("https://seep.eu.org/https://hkbus.github.io/hk-bus-crawling/routeFareList.min.json").then(r => r.ok ? r.json() : {});
    routeFareDb = fareData;
    _markCircularRoutes(fareData);
    // 【補寫港鐵巴士循環線】上面 _markCircularRoutes() 岩岩用
    // routeFareList.min.json 嘅資料整個推倒重嚟咗 circularRouteCos；
    // 港鐵巴士（mtrb）嘅循環線判斷嚟自 mtr_bus_stops.csv 嘅
    // DIRECTION 有冇 "I"（見 loadMtrBusStaticData()），呢度要喺
    // reset 完之後先補寫返落去，先至唔會俾上面嗰次 reset 沖走。
    for (const routeId of mtrBusCircularRouteIds) {
      circularRouteCos.set(`mtrb|${routeId}`, true);
    }

    if (routeFareDb && typeof routeFareDb === 'object' && etaDb) {
      // 【港鐵巴士分支：routeFareList.min.json 交叉驗證】loadMtrBusStaticData()
      // 而家已經改用 mtr_bus_stops.csv 嘅 REFERENCE_ID（而唔淨係 ROUTE_ID）
      // 分組起路線，所以 K51/K66/K68/K73/506 呢類「唔同分支共用同一個
      // ROUTE_ID」嘅路線本身喺 CSV 呢層已經拆好晒，唔會再屈埋一齊。但
      // routeFareList.min.json（由 hk-bus-crawling 獨立整理）有時會就住
      // 同一個「route 代號＋方向」再細分出幾個唔同 serviceType（呢層細分
      // CSV 嘅 REFERENCE_ID 分唔到），所以呢度保留呢個交叉驗證做多一重
      // 保險：一旦發現 routeFareList.min.json 就住某條分支嘅 route+方向
      // 有 2 個或以上唔同 serviceType 記錄，就信 routeFareList 呢邊分得
      // 更幼嗰批資料，刪走我哋自己靠 CSV REFERENCE_ID 砌出嚟嗰條（下面
      // 主 loop 照舊會將 routeFareList 逐條 serviceType 記錄，用返佢
      // 自己嗰個 key，原封不動咁加返落 etaDb.routeList）。
      // 【正規化 route／方向做 key】routeFareDb 嘅 route／bound 字串偶爾會
      // 出現大小寫或前後空白唔一致嘅情況（同 CSV 嗰邊 ROUTE_ID／DIRECTION
      // 未必完全一致嘅寫法），如果唔先 trim＋uppercase 就直接攞嚟砌 key，
      // 落面同 _mtrbMotherCode()（本身有 uppercase＋trim）比對嗰陣會撞唔
      // 中，令成組交叉驗證／freq 補漏靜靜雞失效。
      const mtrBusBranchGroups = new Map(); // "route|方向" -> Set(routeFareDb 嘅 key)
      for (const [key, routeData] of Object.entries(routeFareDb)) {
        if (!routeData || !routeData.route || !routeData.bound || typeof routeData.bound !== "object") continue;
        const coList = Array.isArray(routeData.co) ? routeData.co : (routeData.co ? [routeData.co] : []);
        for (const co of coList) {
          if (!MTR_BUS_COMPANY_ALIASES.includes(co)) continue;
          const dir = String(routeData.bound[co] || "").toUpperCase().trim();
          if (!dir) continue;
          const routeNorm = String(routeData.route).toUpperCase().trim();
          const groupKey = `${routeNorm}|${dir}`;
          if (!mtrBusBranchGroups.has(groupKey)) mtrBusBranchGroups.set(groupKey, new Set());
          mtrBusBranchGroups.get(groupKey).add(key);
        }
      }
      for (const [groupKey, keys] of mtrBusBranchGroups.entries()) {
        if (keys.size < 2) continue; // 得一條記錄，冇再細分，唔使理
        const [route, dir] = groupKey.split("|");
        const ownKey = `MTRB+${route}+${dir}`;
        if (etaDb.routeList[ownKey]) {
          if (DEBUG_MODE) {
            console.log(`[港鐵巴士分支交叉驗證] routeFareList.min.json 就 ${route}(${dir}) 揾到 ${keys.size} 個 serviceType，比 CSV REFERENCE_ID 分得更幼，改用 routeFareList 呢邊嘅資料頂替。`);
          }
          delete etaDb.routeList[ownKey];
        }
      }

      // 【港鐵巴士「現正服務」標籤補漏】loadMtrBusStaticData() 靠
      // mtr_bus_stops.csv 砌出嚟嘅分支淨係得站序，成個 freq 欄位由頭到尾
      // 都冇填過，令 _hasConfirmedFreqServiceNow() 見到 r.freq 唔存在即刻
      // return false，「現正服務」標籤永遠唔會喺呢啲分支度現身。上面
      // FARE_FIELDS_ONLY 嗰個主 loop（下面）淨係喺 routeId 呢個 composite
      // key 完全一樣先會補班次資料，但 CSV 呢邊用嘅係自己一套
      // "MTRB+referenceId+方向" key，同 routeFareList.min.json 嗰種
      // "route+serviceType+orig+dest" key 格式完全兩回事，永遠撞唔中。
      // 呢度改用 mtrBusBranchGroups 已經整好嘅「母線代號＋方向」分組做
      // 橋，將同一組入面隨便一個 routeFareList 記錄嘅 freq／fares 借畀
      // 仲存在、自己冇 freq 嘅 CSV 分支頂住——呢個係近似值（分支嘅實際
      // 班次可能同正線／其他 serviceType 唔完全一樣），但好過完全冇
      // 資料令標籤永遠唔顯示。
      for (const [groupKey, keys] of mtrBusBranchGroups.entries()) {
        const [route, dir] = groupKey.split("|"); // 已經喺上面砌 groupKey 嗰陣 trim＋uppercase 過
        let repFreq = null, repFares = null, repFaresHoliday = null;
        for (const k of keys) {
          const rd = routeFareDb[k];
          if (!rd) continue;
          if (!repFreq && rd.freq) repFreq = rd.freq;
          if (!repFares && rd.fares) repFares = rd.fares;
          if (!repFaresHoliday && rd.faresHoliday) repFaresHoliday = rd.faresHoliday;
          if (repFreq && repFares && repFaresHoliday) break;
        }
        if (!repFreq) continue;
        for (const cand of Object.values(etaDb.routeList)) {
          if (!cand || !cand.isMtrBusVerified || cand.freq) continue;
          const candDir = String((cand.bound && cand.bound.mtrb) || "").toUpperCase().trim();
          if (candDir !== dir) continue;
          // 【比對放寬：母線代號 OR 分支自己嘅 REFERENCE_ID】routeFareList.
          // min.json 通常用母線代號（同 CSV 嘅 motherRouteId 睇齊）嚟分組，
          // 但保留多一條路：如果佢哋嗰邊反而係用分支自己嗰個代號
          // （即同 cand.route／REFERENCE_ID 睇齊），一樣要撞得中先啱，
          // 唔好因為兩邊分組準則有出入就令呢條分支永遠攞唔到 freq。
          const candMother = _mtrbMotherCode(cand);
          const candOwn = String(cand.route || "").toUpperCase().trim();
          if (candMother !== route && candOwn !== route) continue;
          cand.freq = repFreq;
          if (repFares && !cand.fares) cand.fares = repFares;
          if (repFaresHoliday && !cand.faresHoliday) cand.faresHoliday = repFaresHoliday;
        }
      }

      // 【純比對／debug 用，唔改動任何資料】列出 CSV 靠 REFERENCE_ID
      // 揾到、同一條母線底下嘅分支有幾多條，方便核實新分組邏輯有冇跟
      // routeFareList.min.json 嘅 serviceType 數目大致夾得住。
      if (DEBUG_MODE) {
        const csvBranchesByMother = new Map(); // "母線代號|方向" -> Set(REFERENCE_ID)
        for (const r of Object.values(etaDb.routeList)) {
          if (!r || !r.isMtrBusVerified || !r.motherRouteId) continue;
          const dir = r.bound && r.bound.mtrb;
          const gk = `${r.motherRouteId}|${dir}`;
          if (!csvBranchesByMother.has(gk)) csvBranchesByMother.set(gk, new Set());
          csvBranchesByMother.get(gk).add(r.route);
        }
        for (const [gk, refIds] of csvBranchesByMother.entries()) {
          if (refIds.size > 1) {
            console.log(`[港鐵巴士分支交叉驗證] 母線 ${gk} 靠 REFERENCE_ID 分組揾到 ${refIds.size} 條分支：${[...refIds].join("、")}`);
          }
        }
      }

      const FARE_FIELDS_ONLY = ["fares", "faresHoliday", "serviceType", "jt", "freq"];
      for (const [routeId, routeData] of Object.entries(routeFareDb)) {
        if (!etaDb.routeList[routeId]) {
          etaDb.routeList[routeId] = routeData;
        } else {
          // 如果已有該路線，只補充車費／班次相關欄位，保留 etaDb 本身權威嘅
          // stops／bound／orig／dest，避免覆蓋出唔一致嘅站序
          const existing = etaDb.routeList[routeId];
          for (const field of FARE_FIELDS_ONLY) {
            if (routeData[field] !== undefined && routeData[field] !== null) {
              existing[field] = routeData[field];
            }
          }

          // 【用 routeFareList 嘅 stops 補漏，唔盲目覆蓋已驗證嘅站序】
          // 之前試過幾次撞到「路線明明有經過某個站，但因為淨係得某個
          // 公司變體先有記錄，或者成個 etaDb 主資料都漏埋咗嗰個站」，
          // 令搜尋誤以為要行去下一個更遠嘅站先上到車。routeFareList.min.json
          // 有一份獨立、通常更齊全嘅逐站記錄，而家攞嚟補呢個漏——但
          // 唔係盲目覆蓋成個 stops：
          //   1. 呢條路線喺 etaDb 完全冇記錄嘅公司變體，直接補上（純粹
          //      新增，冇風險）。
          //   2. 兩邊都有記錄嘅公司變體，淨係當 routeFareList 嗰份係
          //      現有站序嘅「有序超集」（即係冚晒現有全部站、順序又
          //      冇打亂，淨係中間補多咗漏低嘅分站）先會採用，避免推翻
          //      一個同 ETA API 站序對得上、但排列方式唔同嘅現有版本。
          if (routeData.stops && typeof routeData.stops === "object") {
            if (!existing.stops) existing.stops = {};
            for (const [co, fareStops] of Object.entries(routeData.stops)) {
              if (!Array.isArray(fareStops) || !fareStops.length) continue;
              const existingStops = existing.stops[co];
              if (!existingStops || !existingStops.length) {
                existing.stops[co] = fareStops;
              } else if (fareStops.length > existingStops.length && _isStopSeqSuperset(fareStops, existingStops)) {
                existing.stops[co] = fareStops;
              }
            }
          }
        }
      }
    }
  } catch (err) {
    console.error("背景載入車費資料失敗:", err);
  } finally {
    // 【修正：屯馬綫 ↔ 港鐧巴士轉乘優惠冇生效】init() 一開始已經叫過一次
    // normalizeMtrBusCompanyCode()，將「lrtfeeder」/「mtr-bus」統一正規化
    // 做「mtrb」——但嗰次淨係處理咗嗰陣已經存在嘅 etaDb.routeList。上面
    // 呢個 loadRouteFareData() background 載入完成後，會將 routeFareList.
    // min.json 入面新嘅路線變體（好多 K51-K76 呢類西鐧巴士都係用
    // 「lrtfeeder」呢個公司代號）直接寫入 etaDb.routeList，時間上一定喺
    // 頭先嗰次 normalize 之後先發生，所以呢啲新補入嘅路線 co 一直保持
    // 「lrtfeeder」／「mtr-bus」原始字串，從未被正規化做「mtrb」。連鎖
    // 效果就係 isMtrbLeg()（靠 leg.co === "mtrb" 判斷）永遠撞唔中呢啲
    // 路線，令屯馬綫 ↔ 港鐧巴士轉乘優惠（_lrInterchangeDiscounts()）完全
    // 冇機會觸發。而家喺呢一步再 normalize 一次，等新補入嘅路線都跟返
    // 同一個公司代號。
    normalizeMtrBusCompanyCode(etaDb.routeList);
    // 【由 buildRouteSiblingIndex() 改用返 buildIndices()】上面啱啱可能
    // 幫某啲路線補咗漏低嘅站／公司變體，但 stopRouteIndex 喺 init() 嗰陣
    // 已經起好咗（喺呢個 loadRouteFareData() 之前），如果淨係重建
    // buildRouteSiblingIndex()，新補入嘅站唔會反映落 stopRouteIndex，
    // 搜尋擴展仍然搵佢唔到。buildIndices() 內部本身都會再叫一次
    // buildRouteSiblingIndex()，所以呢度改用佢就夠。
    buildIndices();
    if (fareBtn) {
      fareBtn.disabled = false;
      fareBtn.title = "";
      fareBtn.textContent = "車費";
    }
  }
}

// 統一港鐵巴士公司代號
const MTR_BUS_COMPANY_ALIASES = ["mtr-bus", "lrtfeeder"];
function normalizeMtrBusCompanyCode(routeList) {
  if (!routeList) return;
  for (const r of Object.values(routeList)) {
    if (!r || !r.co) continue;
    if (Array.isArray(r.co)) {
      if (r.co.some(c => MTR_BUS_COMPANY_ALIASES.includes(c))) {
        r.co = r.co.map(c => MTR_BUS_COMPANY_ALIASES.includes(c) ? "mtrb" : c);
      }
    } else if (MTR_BUS_COMPANY_ALIASES.includes(r.co)) {
      r.co = "mtrb";
    }
    for (const alias of MTR_BUS_COMPANY_ALIASES) {
      if (r.stops && r.stops[alias] && !r.stops.mtrb) {
        r.stops.mtrb = r.stops[alias];
        delete r.stops[alias];
      }
      if (r.bound && typeof r.bound === "object" && r.bound[alias] !== undefined && r.bound.mtrb === undefined) {
        r.bound.mtrb = r.bound[alias];
        delete r.bound[alias];
      }
      if (r.serviceType && typeof r.serviceType === "object" && r.serviceType[alias] !== undefined && r.serviceType.mtrb === undefined) {
        r.serviceType.mtrb = r.serviceType[alias];
        delete r.serviceType[alias];
      }
    }
  }
}
