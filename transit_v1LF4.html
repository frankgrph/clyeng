function getCompanies(r) {
  const companies = [];
  if (!r || !r.co) return companies;
  const coList = Array.isArray(r.co) ? r.co : [r.co];
  for (const c of coList) {
    if (r.stops && r.stops[c] && r.stops[c].length) {
      companies.push(c);
    }
  }
  return companies;
}

// 【循環線方向修正輔助】搵返某個 stopId 喺一條路線嘅站序陣列入面
// 出現喺邊個 idx（跨晒所有公司變體搵，搵到第一個就返）。搵唔到就
// 返 -1。畀「揀返上車站」嗰步用嚟比較「去程」同「回程」邊個先出現。
function _stopIdxInRoute(rr, stopId) {
  if (!rr || !rr.stops || !stopId) return -1;
  const cos = getCompanies(rr);
  for (const co of cos) {
    const arr = rr.stops[co];
    if (!arr) continue;
    const idx = arr.indexOf(stopId);
    if (idx !== -1) return idx;
  }
  return -1;
}

// 【判斷一個站序係咪另一個站序嘅「有序超集」】用嚟安全咁合併
// routeFareList.min.json 嘅 stops 資料——如果 fareList 嗰個版本包含晒
// 現有版本嘅全部站、順序又冇打亂（唔需要連續，容許中間插多咗漏咗嘅
// 分站），先至當佢係「補漏版」，可以放心攞嚟代替；如果唔係超集關係
// （例如兩份資料根本對唔上、次序有出入），就寧願保留現有、已經驗證
// 過嘅站序，唔好胡亂覆蓋。
function _isStopSeqSuperset(superArr, subArr) {
  if (!Array.isArray(superArr) || !Array.isArray(subArr)) return false;
  let i = 0;
  for (const s of superArr) {
    if (i < subArr.length && s === subArr[i]) i++;
  }
  return i === subArr.length;
}

// ============================================================
// 【聯營路線・跨公司 serviceType 錯配偵測／合併】
// ------------------------------------------------------------
// 背景：少數聯營路線（例如 118P、118R），九巴同城巴各自嘅原始資料對
// 「同一條實際行車路線」定義咗唔同嘅 serviceType（甚至同一條記錄入面
// co 陣列雖然寫齊晒兩間公司，但 stops 實際上得一間公司有齊資料）。結果
// etaDb.routeList 會出現兩條獨立嘅 key，各自淨係得一間公司嘅站序，但
// 佢哋停嘅站、行嘅路線本質上係同一條分支——落到用戶眼中會誤以為係兩
// 條唔同嘅分支揀，路線搜尋、鄰近站搜尋、beam search 擴展都會各自得返
// 一半公司嘅資料，唔完整。
//
// 呢個 function 用「同路線編號＋同方向＋站數相符＋實際公司資料互不重
// 疊＋起訖站文字大致夾得住」呢幾個信號一齊判斷，先確認兩條記錄真係屬
// 於同一條分支，然後將佢哋合併做一條記錄（stops／bound／co 攞埋兩邊、
// serviceType／seq 轉做「co -> 原本嗰個公司自己嘅數值」嘅物件，同其他
// 地方 r.serviceType[coKey] / r.seq[coKey] 嘅讀法一致），刪走多餘嗰條
// key，等呢種情況都當返做同一個分支處理。
function _coArrOf(r) {
  if (!r || !r.co) return [];
  return Array.isArray(r.co) ? r.co.filter(Boolean) : [r.co];
}

function _jointBranchLabelText(obj) {
  if (!obj) return "";
  if (typeof obj === "string") return obj;
  return obj.zh || obj.en || "";
}

function _jointBranchNormText(s) {
  if (!s) return "";
  return String(s).toUpperCase().replace(/[^A-Z0-9\u4e00-\u9fff]/g, "");
}

// 兩個站名文字經正規化（去晒標點/空格、轉大寫）之後，只要其中一個係
// 另一個嘅子字串就當夾得住——處理「城巴/聯營資料版本」用全稱（例如
// 「基榮小學, 荔枝角道」）、「九巴自己版本」用簡稱（「基榮小學」）呢
// 種常見落差。
function _jointBranchTextOverlaps(a, b) {
  const na = _jointBranchNormText(a);
  const nb = _jointBranchNormText(b);
  if (!na || !nb) return false;
  return na.includes(nb) || nb.includes(na);
}

// 方向：唔理邊間公司，撈第一個非空嘅 O/I（或者 OI）出嚟。
function _jointBranchDirection(r) {
  if (!r || !r.bound) return null;
  if (typeof r.bound === "string") return r.bound.trim().toUpperCase() || null;
  for (const v of Object.values(r.bound)) {
    if (v) return String(v).trim().toUpperCase();
  }
  return null;
}

// 站數：優先用實際已有站序資料嘅公司嗰邊 stops[co].length；完全冇站序
// 資料先跌返用 seq（呢個 schema 入面 seq 本身就係代表分站數目，見
// _ctbExpectedStopCount() 嘅同一套 fallback 邏輯）。
function _jointBranchStopCount(r) {
  if (!r) return null;
  const companies = getCompanies(r);
  let maxLen = 0;
  for (const co of companies) {
    const arr = r.stops && r.stops[co];
    if (Array.isArray(arr) && arr.length > maxLen) maxLen = arr.length;
  }
  if (maxLen) return maxLen;
  if (r.seq != null) {
    if (typeof r.seq === "object") {
      const vals = Object.values(r.seq).map(v => parseInt(v, 10)).filter(Number.isFinite);
      if (vals.length) return Math.max(...vals);
    } else {
      const n = parseInt(r.seq, 10);
      if (Number.isFinite(n)) return n;
    }
  }
  return null;
}

// 判斷 rA／rB 係咪應該當做同一分支嘅「serviceType 兄弟記錄」（而唔係
// 兩條真係唔同嘅分支）。要幾個信號一齊夾得住先算數，寧缺莫濫：
//   1. 路線編號一樣
//   2. 方向一樣（O/I/OI）
//   3. 兩邊實際有站序資料嘅公司完全冇重疊（唔重疊先代表係「同一條路
//      線、兩間公司各自得返一半資料」，如果重疊即係同一間公司自己都
//      有兩個唔同 serviceType，好可能係真係唔同嘅分支，唔應該夾埋）
//   4. 分站數目一致（兩邊都有得核實嘅情況下）
//   5. 起訖站文字大致夾得住（防止純粹路線編號、方向、站數啱好撞埋一
//      齊嘅唔相關記錄被錯誤合併）
function _areJointServiceTypeSiblings(rA, rB) {
  if (!rA || !rB || rA === rB) return false;
  if (!rA.route || !rB.route) return false;
  if (String(rA.route).toUpperCase().trim() !== String(rB.route).toUpperCase().trim()) return false;

  const dirA = _jointBranchDirection(rA);
  const dirB = _jointBranchDirection(rB);
  if (!dirA || !dirB || dirA !== dirB) return false;

  const companiesA = getCompanies(rA);
  const companiesB = getCompanies(rB);
  if (!companiesA.length || !companiesB.length) return false;
  const setA = new Set(companiesA);
  if (companiesB.some(c => setA.has(c))) return false; // 有重疊，唔算兄弟記錄

  const countA = _jointBranchStopCount(rA);
  const countB = _jointBranchStopCount(rB);
  if (countA != null && countB != null && countA !== countB) return false;

  const origOverlap = _jointBranchTextOverlaps(_jointBranchLabelText(rA.orig), _jointBranchLabelText(rB.orig));
  const destOverlap = _jointBranchTextOverlaps(_jointBranchLabelText(rA.dest), _jointBranchLabelText(rB.dest));
  if (!origOverlap || !destOverlap) return false;

  return true;
}

// 幫一個「原本淨係得單一 scalar serviceType／seq」嘅記錄，轉做
// 「co -> 呢間公司自己嗰個數值」嘅物件，等合併之後其他地方讀
// r.serviceType[coKey] / r.seq[coKey] 都攞得返正確數值。如果原本已經
// 係物件，就直接攞返嚟用（保留佢已有嘅其他公司 key）。
function _jointBranchToPerCoMap(rawVal, companies) {
  if (rawVal && typeof rawVal === "object" && !Array.isArray(rawVal)) return { ...rawVal };
  const out = {};
  if (rawVal == null) return out;
  for (const co of companies) out[co] = rawVal;
  return out;
}

// 將 secondary 呢條記錄嘅資料併入 primary（喺原地修改 primary），然後
// 由 caller 負責喺 routeList 度刪走 secondary 個 key。
function _mergeJointServiceTypeSiblingInto(primary, secondary) {
  const companiesPrimary = getCompanies(primary);
  const companiesSecondary = getCompanies(secondary);

  // co：兩邊實際公司做聯集
  const mergedCo = new Set([..._coArrOf(primary), ..._coArrOf(secondary), ...companiesPrimary, ...companiesSecondary]);
  primary.co = Array.from(mergedCo);

  // stops：secondary 補返 primary 未有嘅公司
  primary.stops = primary.stops || {};
  for (const co of companiesSecondary) {
    if (!primary.stops[co] && secondary.stops && secondary.stops[co]) {
      primary.stops[co] = secondary.stops[co];
    }
  }

  // bound：一樣，補返未有嘅公司（方向已經喺 _areJointServiceTypeSiblings
  // 核實過一致，呢度純粹補齊 key）
  primary.bound = primary.bound && typeof primary.bound === "object" ? { ...primary.bound } : {};
  if (secondary.bound && typeof secondary.bound === "object") {
    for (const [co, dir] of Object.entries(secondary.bound)) {
      if (primary.bound[co] === undefined) primary.bound[co] = dir;
    }
  } else if (secondary.bound && companiesSecondary.length && primary.bound[companiesSecondary[0]] === undefined) {
    primary.bound[companiesSecondary[0]] = secondary.bound;
  }

  // serviceType／seq：轉做 co -> 數值嘅物件，兩邊夾埋
  const svcPrimary = _jointBranchToPerCoMap(primary.serviceType, companiesPrimary);
  const svcSecondary = _jointBranchToPerCoMap(secondary.serviceType, companiesSecondary);
  primary.serviceType = { ...svcPrimary, ...svcSecondary };

  const seqPrimary = _jointBranchToPerCoMap(primary.seq, companiesPrimary);
  const seqSecondary = _jointBranchToPerCoMap(secondary.seq, companiesSecondary);
  const mergedSeq = { ...seqPrimary, ...seqSecondary };
  primary.seq = Object.keys(mergedSeq).length ? mergedSeq : primary.seq;

  // 車費／班次相關：邊條有真實資料就用邊條，primary 優先
  for (const field of ["fares", "faresHoliday", "freq", "gtfsId", "jt", "nlbId"]) {
    if ((primary[field] === undefined || primary[field] === null) &&
        secondary[field] !== undefined && secondary[field] !== null) {
      primary[field] = secondary[field];
    }
  }

  // 記低合併過嘅來源，方便 debug 追查
  primary._jointMergedFrom = Array.isArray(primary._jointMergedFrom) ? primary._jointMergedFrom : [];
  primary._jointMergedFrom.push(secondary.route + "|" + (secondary._jointBranchKeyId || ""));
}

// 主入口：掃描 routeList，將符合「serviceType 兄弟記錄」條件嘅記錄夾埋
// 一齊，回傳實際合併咗幾多對，方便 DEBUG_MODE 落 log 核實。
function mergeJointServiceTypeSiblingBranches(routeList) {
  if (!routeList) return 0;

  // 用「路線編號＋方向」粗略分組，避免成個 routeList O(n^2) 逐條比對。
  const groups = new Map();
  for (const [routeId, r] of Object.entries(routeList)) {
    if (!r || !r.route) continue;
    r._jointBranchKeyId = routeId;
    const dir = _jointBranchDirection(r);
    if (!dir) continue;
    const gk = `${String(r.route).toUpperCase().trim()}|${dir}`;
    if (!groups.has(gk)) groups.set(gk, []);
    groups.get(gk).push(routeId);
  }

  let mergedCount = 0;
  for (const ids of groups.values()) {
    if (ids.length < 2) continue;
    for (let i = 0; i < ids.length; i++) {
      const idA = ids[i];
      const rA = routeList[idA];
      if (!rA) continue; // 已經俾人合併走咗
      for (let j = i + 1; j < ids.length; j++) {
        const idB = ids[j];
        const rB = routeList[idB];
        if (!rB) continue;
        if (!_areJointServiceTypeSiblings(rA, rB)) continue;

        // 邊條做 primary：優先揀已經有車費／班次資料、或者已覆蓋較多
        // 公司嗰一條，減少之後仲要靠 loadRouteFareData() 補漏。
        const scoreA = (rA.fares ? 1 : 0) + (rA.freq ? 1 : 0) + (rA.gtfsId ? 1 : 0) + _coArrOf(rA).length;
        const scoreB = (rB.fares ? 1 : 0) + (rB.freq ? 1 : 0) + (rB.gtfsId ? 1 : 0) + _coArrOf(rB).length;
        const [primaryId, secondaryId] = scoreA >= scoreB ? [idA, idB] : [idB, idA];
        const primary = routeList[primaryId];
        const secondary = routeList[secondaryId];

        _mergeJointServiceTypeSiblingInto(primary, secondary);
        delete routeList[secondaryId];
        mergedCount++;

        if (DEBUG_MODE) {
          console.log(`[聯營 serviceType 兄弟分支合併] ${primary.route} 將 ${secondaryId} 併入 ${primaryId}（合併後公司：${_coArrOf(primary).join("、")}）`);
        }

        // secondaryId 已經冇咗，跳去比較下一個 j
      }
    }
  }
  return mergedCount;
}

function buildIndices(){
  // 【聯營路線・跨公司 serviceType 錯配偵測】喺起 stopRouteIndex 之前
  // 先行合併，等下面逐條路線起 index 嗰陣，已經係合併完、公司資料齊
  // 晒嘅版本，唔會將本質上同一條分支拆開兩份、各自得一半公司嘅資料。
  mergeJointServiceTypeSiblingBranches(etaDb.routeList);

  stopRouteIndex = new Map();
  _coLocatedRoutesCache.clear(); _stationGroupCache.clear(); _stationGroupRouteCountCache.clear(); // stopRouteIndex 重建，舊 cache 已經過期
  for (const [routeId, r] of Object.entries(etaDb.routeList)){
    const companies = getCompanies(r);
    if (!companies.length) continue;

    const primaryCo = companies[0];
    const primaryStops = r.stops[primaryCo];
    const primaryStopSet = new Set(primaryStops);
    primaryStops.forEach((stopId, idx) => {
      if (!stopId) return;
      if (!stopRouteIndex.has(stopId)) stopRouteIndex.set(stopId, []);
      stopRouteIndex.get(stopId).push({routeId, idx, companies, primaryCo});
    });

    // 【修正：補返其餘公司變體先有嘅站】部分聯營／同號多公司路線，唔同
    // 公司變體嘅站陣列唔完全一致——常見於總站/起點站淨係出現喺某個
    // 非 primaryCo 嘅公司變體入面，primaryCo 本身完全冇呢個站。之前呢
    // 度淨係用 primaryCo 起 stopRouteIndex，會令到兩個地方唔一致：
    // 「搵候選上車站」嗰步（見改善上車站搜尋段落）係跨晒 companies 全
    // 部變體去搵最近站，可以搵到一個 0 米（即起點正正就喺嗰個站）嘅
    // 候選；但去到實際 beam search 擴展（`stopRouteIndex.get(stopId)`）
    // 嗰陣，因為 primaryCo 冇呢個站，條路線根本唔會出現喺 routesHere
    // 度，結果呢個「應該最近、唔使行」嘅上車站其實用唔到，逼住搜尋
    // 揀第二個遠好多嘅站上車（例如要多行成公里）。而家將其餘公司變
    // 體入面、primaryCo 未覆蓋到嘅站都一拼補落 stopRouteIndex，等呢啲
    // 站喺實際搜尋擴展都真係用得返。
    for (const co of companies) {
      if (co === primaryCo) continue;
      const stops = r.stops[co];
      if (!stops) continue;
      stops.forEach((stopId, idx) => {
        if (!stopId || primaryStopSet.has(stopId)) return;
        if (!stopRouteIndex.has(stopId)) stopRouteIndex.set(stopId, []);
        stopRouteIndex.get(stopId).push({routeId, idx, companies, primaryCo: co});
      });
    }
  }
  buildGridIndex(etaDb.stopList);
  // 建立 serviceType 兄弟變體索引（見上面 routeSiblingIndex 頂部註解）。
  // loadRouteFareData() 有機會之後再補入額外路線（例如純粹存在於
  // routeFareList.min.json 但唔喺主 etaDb 入面嘅變體），所以嗰邊完成
  // 之後會再呼叫一次呢個 function 重建索引，確保新補入嘅路線都計得到。
  buildRouteSiblingIndex();
}

init();

/* ---------------- stop search / autocomplete ---------------- */
function searchStops(query, limit=18){
  const q = query.trim();
  if (!q || !etaDb) return [];
  const qLower = q.toLowerCase();
  const out = [];
  for (const [stopId, s] of Object.entries(etaDb.stopList)){
    const entries = stopRouteIndex.get(stopId);
    if (!entries) continue;
    const zh = s.name.zh || "";
    const en = s.name.en || "";
    if (zh.includes(q) || en.toLowerCase().includes(qLower)){
      if (!s.location) continue; // 防禦：個別站（例如座標比對失敗嘅港鐵站）可能冇座標
      const isMtr = entries.some(e => Array.isArray(e.companies) && e.companies.includes("mtr"));
      // 【修正：輕鐵 logo 而家只認真正嘅輕鐵站,唔再靠撞名】以前呢度淨係
      // 撞 lightRailDb.stopNameSet（純粹中文名一樣就算），會令好多同名
      // 但其實係普通巴士/小巴站嘅站牌都被加咗個輕鐵 logo，睇落好似「呢
      // 個巴士站係輕鐵站」，容易誤導。真正嘅輕鐧站喺 _buildLightRailRouteList()
      // 注入 etaDb.stopList 嗰陣，stopId 一定係 `LR-<code>` 呢個固定格式
      // （見 7195 行 stopIds = stationCodes.map(code => `LR-${code}`)），
      // 同任何巴士/小巴/港鐧嘅 stopId 都唔會撞——而家直接用呢個 stopId
      // 格式嚴格判斷,唔再用名稱比對咁寬鬆。
      const isLightRail = stopId.startsWith("LR-");
      out.push({stopId, zh, en, lat:s.location.lat, lng:s.location.lng, isMtr, isLightRail});
      if (out.length >= 400) break;
    }
  }
  out.sort((a,b)=>{
    const aS = a.zh.startsWith(q) ? 0 : 1;
    const bS = b.zh.startsWith(q) ? 0 : 1;
    if (aS !== bS) return aS - bS;
    return a.zh.length - b.zh.length;
  });

  // 取消將名稱相同/相似＋位置相近的站牌合併做代表性選項：
  // 站牌合併會將實際位置不同（例如市中心上車點 vs 總站）嘅站隱藏埋，
  // 令用戶無法喺 autocomplete 揀返最啱嘅實際上車站（例如 E42 喺市中心
  // 已經可以上車，但合併後只剩總站選項，變相迫用戶步行去總站）。
  // 現直接列出所有比對到嘅站牌，唔再經 isSameTransferPoint() 合併；
  // 路線搜尋（runBeamSearch/nearbyStops）本身已經會涵蓋鄰近站牌的路線，
  // 呢度只需要如實反映實際存在嘅每一個站牌畀用戶自行揀選。
  return out.slice(0, limit);
}

function wireAutocomplete(input, suggestEl, onPick){
  let debounce;
  input.addEventListener("input", () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      const results = searchStops(input.value);
      renderSuggest(suggestEl, results, onPick);
    }, 120);
  });
  input.addEventListener("focus", () => {
    if (input.value.trim()) {
      renderSuggest(suggestEl, searchStops(input.value), onPick);
    }
  });
  document.addEventListener("click", (e) => {
    if (!suggestEl.contains(e.target) && e.target !== input) suggestEl.hidden = true;
  });
}
function renderSuggest(suggestEl, results, onPick){
  suggestEl.innerHTML = "";
  if (!results.length){
    suggestEl.innerHTML = `<div class="empty">搵唔到相符嘅站</div>`;
    suggestEl.hidden = false;
    return;
  }
  for (const r of results){
    const btn = document.createElement("button");
    btn.type = "button";
    // 港鐵 logo：呢個站牌本身有港鐵路線提供服務（見 searchStops() 嘅
    // isMtr）。輕鐧 logo：見上面 searchStops() 嘅 isLightRail——已經改用
    // stopId 係唔係 `LR-` 開頭嚴格判斷（只有真正嘅輕鐧站，見
    // _buildLightRailRouteList()），唔再靠站名撞中 CSV 名單，所以唔會再
    // 對同名嘅普通巴士/小巴站錯誤加呢個 logo。兩個 logo 依家擺喺中文
    // 站名右邊（而唔係前面），避免遮住站名開頭嗰個字。
    const mtrIconHtml = r.isMtr
      ? `<img class="station-mode-icon" src="https://upload.wikimedia.org/wikipedia/en/archive/b/b9/20210510163405%21HK_MTR_logo.svg" title="港鐵">`
      : "";
    const lrIconHtml = r.isLightRail
      ? `<img class="station-mode-icon" src="https://static.wikia.nocookie.net/hk-rail/images/1/1d/LR_old.svg/revision/latest/scale-to-width-down/250?cb=20090629110056&path-prefix=zh" alt="輕鐵" title="鄰近輕鐵站">`
      : "";
    btn.innerHTML = `${escapeHtml(r.zh||r.en)}${mtrIconHtml}${lrIconHtml}<small>${escapeHtml(r.en||"")}</small>`;
    btn.addEventListener("click", () => {
      onPick({stopId:r.stopId, name:r.zh||r.en, lat:r.lat, lng:r.lng});
      suggestEl.hidden = true;
    });
    suggestEl.appendChild(btn);
  }
  suggestEl.hidden = false;
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

wireAutocomplete(originInput, originSuggest, (stop) => {

  originInput.value = stop.name;
  updatePickedMarkersOnMap();

/* ---------------- 巴士站選點地圖 (Leaflet + OpenStreetMap) ---------------- */
let stopMap = null;
let stopMarkersLayer = null;
let originPickMarker = null;
let destPickMarker = null;
const MAP_STOP_VIEW_SPAN_M = 2000; // 地圖視窗闊度縮到幾多米內先顯示站牌
const MAP_STOP_MAX_MARKERS = 80;   // 效能上限,最多同時顯示幾多個站牌

let mapWasDragged = false;
let openStopMarker = null;

function initStopMap(){
  if (typeof L === "undefined") return; // Leaflet CDN 未載入就靜默跳過,唔阻住主功能
  stopMap = L.map("stopMap", { zoomControl: true }).setView([22.3193, 114.1694], 13); // 預設香港中心

  // 改用 CARTO 底圖
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    maxZoom: 19,
    subdomains: 'abcd',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(stopMap);

  stopMarkersLayer = L.layerGroup().addTo(stopMap);

  // 一開始郁地圖(拖曳/縮放)就即刻收埋現正顯示緊嘅站牌彈出視窗,唔會
  // 卡住喺畫面度跟住個地圖到處飄
  stopMap.on("movestart", () => {
    if (openStopMarker) { openStopMarker.closePopup(); openStopMarker = null; }
    mapWasDragged = false;
  });
  stopMap.on("drag", () => { mapWasDragged = true; });
  stopMap.on("dragend", () => {
    // 延遲少少先重設,等鬆手嗰一刻可能誤觸嘅 marker click handler
    // 都仲檢查得到呢個 flag,擋走呢個「假 click」
    setTimeout(() => { mapWasDragged = false; }, 60);
  });

  stopMap.on("moveend", refreshMapStops);
  refreshMapStops();
}

// 計算現時地圖視窗嘅實際闊/高度 (米),用嚟判斷有冇拉近到約 1 公里範圍
function mapViewSpanM(map){
  const b = map.getBounds();
  const sw = b.getSouthWest(), ne = b.getNorthEast();
  const widthM = L.latLng(sw.lat, sw.lng).distanceTo(L.latLng(sw.lat, ne.lng));
  const heightM = L.latLng(sw.lat, sw.lng).distanceTo(L.latLng(ne.lat, sw.lng));
  return Math.max(widthM, heightM);
}

function refreshMapStops(){
  if (!stopMap || !stopMarkersLayer) return;
  const hintEl = $("#mapZoomHint");
  stopMarkersLayer.clearLayers();
  openStopMarker = null; // 舊 marker 已經連同佢哋嘅 popup 一齊清走,追蹤變數都要一齊重設

  if (!etaDb || !etaDb.stopList){
    if (hintEl){ hintEl.textContent = "地圖載入中"; hintEl.classList.remove("active"); }
    return;
  }

  const spanM = mapViewSpanM(stopMap);
  if (spanM > MAP_STOP_VIEW_SPAN_M){
    if (hintEl){ hintEl.textContent = "放大地圖至 2 公里範圍，即顯示附近可供選擇巴士站"; hintEl.classList.remove("active"); }
    return;
  }

  const center = stopMap.getCenter();
  const radius = Math.min(spanM, MAP_STOP_VIEW_SPAN_M);
  const near = nearbyStops(center.lat, center.lng, radius)
    .sort((a, b) => a.dist - b.dist)
    .slice(0, MAP_STOP_MAX_MARKERS);

  if (hintEl){
    hintEl.textContent = near.length
      ? `顯示附近 ${near.length} 個巴士站，選擇站牌設定起點/終點`
      : "範圍沒有巴士站可供選擇";
    hintEl.classList.add("active");
  }

  for (const { stopId, dist } of near){
    const s = etaDb.stopList[stopId];
    if (!s || !s.location || !Number.isFinite(s.location.lat) || !Number.isFinite(s.location.lng)) continue;
    const zhName = (s.name && (s.name.zh || s.name.en)) || "未知站點";
    const enName = (s.name && s.name.en) || "";
    const marker = L.marker([s.location.lat, s.location.lng]);

    const popupEl = document.createElement("div");
    popupEl.innerHTML = `
      <div class="map-popup-title">${escapeHtml(zhName)}</div>
      <div class="map-popup-sub">${escapeHtml(enName)} · 距離約 ${Math.round(dist)} 米</div>
      <div class="map-pick-btns">
        <button type="button" class="origin-btn">設為起點</button>
        <button type="button" class="dest-btn">設為終點</button>
      </div>
    `;
    const stopForPick = { stopId, name: zhName, lat: s.location.lat, lng: s.location.lng };
    popupEl.querySelector(".origin-btn").addEventListener("click", () => {
      origin = stopForPick;
      originInput.value = zhName;
      marker.closePopup();
      updatePickedMarkersOnMap();
    });
    popupEl.querySelector(".dest-btn").addEventListener("click", () => {
      destination = stopForPick;
      destInput.value = zhName;
      marker.closePopup();
      updatePickedMarkersOnMap();
    });
    marker.bindPopup(popupEl);
    // 移除 bindPopup() 預設加落嘅 click handler,換成自己揸,先可以喺
    // 「啱啱拖曳緊/拖曳完」嘅時候主動忽略呢下 click,唔畀誤觸嘅彈出
    // 視窗卡住唔識自動收埋(詳見 initStopMap() 頂部註解)
    marker.off("click", marker._openPopup, marker);
    marker.on("click", () => {
      if (mapWasDragged) return; // 拖曳緊/啱啱拖曳完,呢下 click 好可能係誤觸,唔理佢
      if (openStopMarker && openStopMarker !== marker) openStopMarker.closePopup();
      openStopMarker = marker;
      marker.openPopup();
    });
    marker.on("popupclose", () => {
      if (openStopMarker === marker) openStopMarker = null;
    });
    marker.addTo(stopMarkersLayer);
  }
}

// 喺地圖上用鮮明色點標示現時揀咗嘅起點(紅)／終點(墨綠),等用戶一眼睇到
// 而家揀咗邊個站,唔理係透過地圖、自動完成搜尋抑或 GPS 定位揀嘅。
function updatePickedMarkersOnMap(){
  if (!stopMap) return;
  if (originPickMarker){ stopMap.removeLayer(originPickMarker); originPickMarker = null; }
  if (destPickMarker){ stopMap.removeLayer(destPickMarker); destPickMarker = null; }

  const mkIcon = (color) => L.divIcon({
    className: "",
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2.5px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.5);"></div>`,
    iconSize: [16, 16], iconAnchor: [8, 8]
  });

  if (origin && Number.isFinite(origin.lat) && Number.isFinite(origin.lng)){
    originPickMarker = L.marker([origin.lat, origin.lng], { icon: mkIcon("#c8102e"), zIndexOffset: 1000 })
      .bindTooltip("起點")
      .addTo(stopMap);
  }
  if (destination && Number.isFinite(destination.lat) && Number.isFinite(destination.lng)){
    destPickMarker = L.marker([destination.lat, destination.lng], { icon: mkIcon("#f6a800"), zIndexOffset: 1000 })
      .bindTooltip("終點")
      .addTo(stopMap);
  }
}
