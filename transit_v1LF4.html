        if (!freqByTrip.has(f.trip_id)) freqByTrip.set(f.trip_id, []);
        freqByTrip.get(f.trip_id).push(f);
      }

      const stopTimesByTrip = new Map();
      for (const st of stopTimes) {
        if (!stopTimesByTrip.has(st.trip_id)) stopTimesByTrip.set(st.trip_id, []);
        stopTimesByTrip.get(st.trip_id).push(st);
      }
      for (const seqs of stopTimesByTrip.values()) {
        seqs.sort((a, b) => parseInt(a.stop_sequence, 10) - parseInt(b.stop_sequence, 10));
      }

      // 建立 GTFS 站點經緯度索引
      const stopCoords = new Map();
      for (const s of stops) {
        stopCoords.set(s.stop_id, {
          lat: parseFloat(s.stop_lat),
          lng: parseFloat(s.stop_lon),
          name: s.stop_name
        });
      }

      // 建立「淨路線編號」次索引（唔理營辦商），供 exact key 對唔上時嘅 fuzzy fallback 使用
      const tripsByRouteNoOnly = new Map();
      for (const [key, ids] of tripsByRouteKey.entries()) {
        const routeNoPart = key.split("|")[1] || "";
        if (!routeNoPart) continue;
        if (!tripsByRouteNoOnly.has(routeNoPart)) tripsByRouteNoOnly.set(routeNoPart, []);
        tripsByRouteNoOnly.get(routeNoPart).push(...ids);
      }

      return { tripInfo, tripsByRouteKey, tripsByRouteNoOnly, calendarByService, calendarDatesByService, freqByTrip, stopTimesByTrip, stopCoords };
    } catch (err) {
      return null;
    }
  })();
  return headwayDataPromise;
}

/* 檢查某公司／路線喺指定日期是否有 GTFS 服務（對比 calendar.txt / calendar_dates.txt）。
 * 只要路線入面任何一條 trip 嘅 service_id 喺當日生效就當有服務。
 * 供第二優先（純 GTFS 預定路線推算）用嚟確認條路線今日的確喺服務時間以內。 */
async function isServiceActiveForRouteOnDate(co, routeNo, when) {
  try {
    const data = await loadHeadwayData();
    if (!data) return null; // 冇 GTFS 數據時無法判斷，交返上層自行處理
    const tripIds = resolveGtfsTripIds(data, co, routeNo);
    if (!tripIds || !tripIds.length) return null;
    for (const tripId of tripIds) {
      const info = data.tripInfo.get(tripId);
      if (!info) continue;
      const calRow = data.calendarByService.get(info.serviceId);
      const calExMap = data.calendarDatesByService.get(info.serviceId);
      if (isCalendarServiceActiveOnDate(calRow, calExMap, when)) return true;
    }
    return false;
  } catch (err) {
    return null;
  }
}

async function isRouteCurrentlyInService(co, routeNo, when){
  try {
    const data = await loadHeadwayData();
    if (!data) return null;

    const tripIds = resolveGtfsTripIds(data, co, routeNo);
    if (!tripIds || !tripIds.length) return null; 

    const yesterday = new Date(when.getTime() - 86400000);
    const minsOfDayToday = when.getHours() * 60 + when.getMinutes();
    const minsOfDayYesterday = minsOfDayToday + 24 * 60; // 相對於昨日的分鐘數 (如凌晨1點 = 25 * 60)

    let hasActiveServiceToday = false;
    let isOperatingAtThisExactTime = false;
    let currentHeadwaySecs = null;

    for (const tripId of tripIds){
      const info = data.tripInfo.get(tripId);
      if (!info) continue;
      
      const calRow = data.calendarByService.get(info.serviceId);
      const calExMap = data.calendarDatesByService.get(info.serviceId);

      const isActiveToday = isCalendarServiceActiveOnDate(calRow, calExMap, when);
      const isActiveYesterday = isCalendarServiceActiveOnDate(calRow, calExMap, yesterday);
      if (!isActiveToday && !isActiveYesterday) continue; 
      hasActiveServiceToday = true; 

      const validBases = [];
      if (isActiveToday) validBases.push(minsOfDayToday);
      if (isActiveYesterday) validBases.push(minsOfDayYesterday);

      const freqBlocks = data.freqByTrip.get(tripId);
      for (const adjMinsOfDay of validBases) {
        if (freqBlocks && freqBlocks.length > 0) {
          for (const f of freqBlocks) {
            const startMin = gtfsTimeToMinutes(f.start_time);
            let endMin = gtfsTimeToMinutes(f.end_time);
            if (startMin != null && endMin != null) {
              if (endMin < startMin) endMin += 24 * 60;
              // GTFS 規範：frequencies.txt 嘅 end_time 係「不包含」邊界，
              // 最後一班車嘅開出時間必須早於（而非等於）end_time，
              // 所以呢度用 < endMin（而唔係 <= endMin）先啱，避免誤判 end_time 嗰一刻仍然「有車」。
              if (adjMinsOfDay >= startMin && adjMinsOfDay < endMin) {
                isOperatingAtThisExactTime = true;
                currentHeadwaySecs = parseInt(f.headway_secs, 10);
                break;
              }
            }
          }
        } else {
          const rList = data.stopTimesByTrip.get(tripId);
          if (rList && rList.length > 0) {
            const firstStop = rList[0];
            const lastStop = rList[rList.length - 1];
            const startMin = gtfsTimeToMinutes(firstStop.departure_time || firstStop.arrival_time);
            let endMin = gtfsTimeToMinutes(lastStop.arrival_time);
            if (startMin != null && endMin != null) {
              if (endMin < startMin) endMin += 24 * 60;
              if (adjMinsOfDay >= startMin && adjMinsOfDay <= endMin + 30) {
                isOperatingAtThisExactTime = true;
              }
            }
          }
        }
        if (isOperatingAtThisExactTime) break;
      }
    } 
            
    if (isOperatingAtThisExactTime) {
      if (currentHeadwaySecs !== null) return Math.ceil(currentHeadwaySecs / 60); 
      return true; 
    }
    return hasActiveServiceToday ? false : null;
  } catch (err) {
    return null;
  }
}

/* ---------------- 拓樸估算：直線與物理路網距離車程 ---------------- */
// timeIntervalDb 嘅真實格式係「相鄰站鄰接圖」：{ 上站stopId: { 下站stopId: 觀測行車秒數 } }，
// 呢個係 timeinterval.hkbuseta.com 根據大量歷史實時 ETA 差值推算返嚟嘅逐段觀測行車時間，
// 唔係之前誤以為嘅「routeId -> 累積秒數陣列」格式。呢度沿住路線本身嘅逐站順序 (boardIdx
// 至 alightIdx) 一段段攞返鄰接圖入面嘅觀測秒數加埋，先係啱嘅解讀方式。
//
// 【港鐵巴士 stopId 對唔上，全部跌落去用粗略距離估算】loadMtrBusStaticData() 為咗同
// rt.data.gov.hk 即時 API 返回嘅 busStopId 精確配對，幫每個港鐵巴士站自訂咗「MTRB_」
// 呢個內部 prefix（例如 "MTRB_1234"）。但 timeinterval.hkbuseta.com 嘅 all.json 係跨
// KMB／CTB／GMB／港鐵巴士等唔同來源彙整返嚟，鄰接圖入面用嘅係每間公司自己嘅原始
// stopId——港鐵巴士嗰邊即係冇 "MTRB_" 呢個 prefix 嘅原始 STATION_ID。結果係，成程都撞
// 唔中鄰接圖入面任何一段，sumTimeIntervalSeconds() 見到任何一段冧咗就即刻放棄成程（見
// 落面「缺任何一段就唔當完整」嘅設計），令港鐵巴士路線幾乎每次都跌落去用低面粗略嘅
// 距離／車速估算，先會出現同實際大幅落差嘅情況。而家喺呢度加一步：搵內部 id 撞唔中
// 就試埋 loadMtrBusStaticData() 記低嗰個原始 mtrBusStationId 再撞多次。
function _timeIntervalLookupIds(stopId) {
  const ids = [stopId];
  const stopInfo = etaDb && etaDb.stopList ? etaDb.stopList[stopId] : null;
  if (stopInfo && stopInfo.mtrBusStationId && stopInfo.mtrBusStationId !== stopId) {
    ids.push(stopInfo.mtrBusStationId);
  }
  return ids;
}

function _lookupTimeIntervalSeconds(fromStopId, toStopId) {
  if (!timeIntervalDb) return NaN;
  for (const f of _timeIntervalLookupIds(fromStopId)) {
    const fromMap = timeIntervalDb[f];
    if (!fromMap) continue;
    for (const t of _timeIntervalLookupIds(toStopId)) {
      const sec = Number(fromMap[t]);
      if (Number.isFinite(sec) && sec > 0) return sec;
    }
  }
  return NaN;
}

function sumTimeIntervalSeconds(stops, boardIdx, alightIdx) {
  if (!timeIntervalDb || !stops) return null;
  let totalSec = 0;
  for (let i = boardIdx; i < alightIdx; i++) {
    const sec = _lookupTimeIntervalSeconds(stops[i], stops[i + 1]);
    if (!Number.isFinite(sec) || sec <= 0) return null; // 缺任何一段就唔當「完整」，交返上層 fallback
    totalSec += sec;
  }
  return totalSec;
}

// 【按一次時間而觀察的車程時間：times_hourly/{星期}/{鐘頭}/all.json】
// 官方 README 講明：呢個「逐鐘頭」檔案本身會有唔少段落缺數據係正常
// 現象（樣本量比全日平均檔細好多），所以官方建議一係逐段做 fallback，
// 一係就退返用 /times/all.json 呢個全日平均檔做底線。呢度做法：一個鐘
// 頭嘅 all.json 用 busTimeIntervalHourlyCache 快取（key = "dow/hh"，
// 同 getMtrIntervalSeconds() 嗰個 mtrIntervalCache 做法一致，快取住個
// fetch promise，唔淨係快取結果，避免同一鐘頭撞正多個並發請求重複 fetch）；
// 逐段查嗰陣，先撞呢個鐘頭專屬檔案，冇撞中先跌落去用全日平均
// timeIntervalDb 頂住，保證唔會因為某一段冇鐘頭數據就令成程「唔完整」。
async function _loadHourlyTimeIntervalDb(dow, hh) {
  const cacheKey = `${dow}/${hh}`;
  if (!busTimeIntervalHourlyCache.has(cacheKey)) {
    const p = fetch(`https://seep.eu.org/https://timeinterval.hkbuseta.com/times_hourly/${dow}/${hh}/all.json`)
      .then(res => res.ok ? res.json() : null)
      .catch(() => null);
    busTimeIntervalHourlyCache.set(cacheKey, p);
  }
  return await busTimeIntervalHourlyCache.get(cacheKey);
}

function _lookupTimeIntervalSecondsFrom(db, fromStopId, toStopId) {
  if (!db) return NaN;
  for (const f of _timeIntervalLookupIds(fromStopId)) {
    const fromMap = db[f];
    if (!fromMap) continue;
    for (const t of _timeIntervalLookupIds(toStopId)) {
      const sec = Number(fromMap[t]);
      if (Number.isFinite(sec) && sec > 0) return sec;
    }
  }
  return NaN;
}

// 逐段查詢：優先用 `when` 所屬「星期＋鐘頭」嘅觀測車程，冇（或冇撞中呢
// 一段）先退返用全日平均 timeIntervalDb。冇提供 `when` 就直接用平均值。
async function _lookupTimeIntervalSecondsAsync(fromStopId, toStopId, when) {
  if (when instanceof Date && !isNaN(when)) {
    try {
      const dow = when.getDay();
      const hh = String(when.getHours()).padStart(2, "0");
      const hourlyDb = await _loadHourlyTimeIntervalDb(dow, hh);
      const sec = _lookupTimeIntervalSecondsFrom(hourlyDb, fromStopId, toStopId);
      if (Number.isFinite(sec) && sec > 0) return sec;
    } catch (e) { /* 鐘頭檔案撞唔中／出錯，靜默跌落去用全日平均頂住 */ }
  }
  return _lookupTimeIntervalSecondsFrom(timeIntervalDb, fromStopId, toStopId);
}

// sumTimeIntervalSeconds() 嘅「按時間」版本：畀 estimateSegmentDuration／
// getBaselineSegmentMinutes 呢類已經知道具體出發時間嘅場合用，令估算車程
// 盡量貼近嗰個特定星期＋鐘頭嘅實況（例如返工繁忙時間 vs 深夜），而唔係
// 一律用全日平均。任何一段（鐘頭+平均都）撞唔中就當唔完整，交返上層 fallback。
async function sumTimeIntervalSecondsAsync(stops, boardIdx, alightIdx, when) {
  if (!stops) return null;
  let totalSec = 0;
  for (let i = boardIdx; i < alightIdx; i++) {
    const sec = await _lookupTimeIntervalSecondsAsync(stops[i], stops[i + 1], when);
    if (!Number.isFinite(sec) || sec <= 0) return null;
    totalSec += sec;
  }
  return totalSec;
}

async function estimateSegmentDuration(r, co, boardIdx, alightIdx, now = new Date()){
  const stops = r.stops[co] || r.stops[r.primaryCo];
  // 【檢查循環線方向・唔應該用假數字冚住「根本去唔到」呢種情況】
  // boardIdx >= alightIdx 代表由呢個上車站序去落車站序,沿正常行車
  // 方向根本走唔到（常見於循環線因分類誤判而撈錯咗轉車站群另一個站
  // 牌，見上面 dfs() 嘅 dep 迴圈嗰個 idx 檢查）。呢種情況一律返 null
  // 代表「計唔到」，唔應該夾硬填一個「2 分鐧」咁嘅假數字，等上層可以
  // 正確咁當呢個候選唔可行,而唔係顯示一個荒謬嘅短車程。真係冇 stops
  // 資料（!stops）先當「數據不足」用 2 分鐧頂住。
  if (boardIdx >= alightIdx) return null;
  if (!stops) return 2;

  // 輕鐧用嘅係獨立、逐小時
  // 更新嘅 LR.json（見 getLightRailSegmentMinutes()／getLightRailIntervalSeconds()），
  // 同其他公司共用嘅 all.json 鄰接圖（下面 sumTimeIntervalSeconds 用嗰個）
  if (co === "lightrail" && Array.isArray(r.lrStationCodes) && r.lrStationCodes.length) {
    try {
      const lrMins = await getLightRailSegmentMinutes(r.lrStationCodes, boardIdx, alightIdx, now);
      if (lrMins !== null) return Math.max(lrMins, 1.0);
    } catch (e) { /* 跌落去用返粗略估算，唔會令預估爆錶 */ }
    // LR.json 冇齊觀測數據時嘅粗略估算，同 dfs() 入面嘅 fallback 一致
    // （輕鐧站與站之間一般 1-2 分鐧）。
    return Math.max(1, (alightIdx - boardIdx) * 1.6);
  }

  // 優先使用 JSON 提供之逐站觀測車程時間 (特別針對單邊 ETA 或純 GTFS 路線)
  // 按 now 所屬嗰個「星期＋鐘頭」揀返最貼近實況嘅觀測數據，冇先退返全日平均
  const intervalSec = await sumTimeIntervalSecondsAsync(stops, boardIdx, alightIdx, now);
  if (intervalSec !== null) {
    return Math.max(intervalSec / 60, 1.0);
  }

  const hour = now.getHours();
  const isRushHour = (hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 19);
  let totalMinutes = 0;
  
  for (let i = boardIdx; i < alightIdx; i++){
    const a = etaDb.stopList[stops[i]];
    const b = etaDb.stopList[stops[i+1]];
    
    if (a && b) {
      const segmentDistM = distM(a.location, b.location);
      let speedKmh = 20;
      let multiplier = 1.15; 

      if (segmentDistM > 3500) {
        multiplier = 1.3; 
        speedKmh = isRushHour ? 40 : 50; 
      } else if (segmentDistM > 1500) {
        multiplier = 1.2;
        speedKmh = isRushHour ? 25 : 38; 
      } else if (segmentDistM > 600) {
        multiplier = 1.15;
        speedKmh = isRushHour ? 12 : 18; 
      } else if (segmentDistM > 250) {
        multiplier = 1.15;
        speedKmh = isRushHour ? 10 : 14; 
      } else {
        multiplier = 1.3;
        speedKmh = isRushHour ? 8 : 11; 
      }

      const travelMin = ((segmentDistM * multiplier) / 1000) / speedKmh * 60;
      totalMinutes += Math.max(travelMin, 1.0);
    }
  }
  return Math.max(totalMinutes, 1.5);
}

/* ---------------- 站與站「預定」行車時間基準：優先用 timeinterval.hkbuseta.com
 * 嘅逐站觀測數據 (較貼近現實，且覆蓋唔少 GTFS 冧唔到嘅專線小巴/GMB 路線)，
 * 唔齊全先退返用 GTFS stop_times.txt 靜態排班表。呢個函數係計算「基準行車時間」
 * 嘅統一入口，畀 calibrateDurationOneSidedGeneral 用嚟同實時 ETA 比對。 ---------------- */
async function getBaselineSegmentMinutes(co, routeNo, stops, from, to, when) {
  if (!stops || !stops[from] || !stops[to] || from >= to) return null;
  const intervalSec = await sumTimeIntervalSecondsAsync(stops, from, to, when);
  if (intervalSec !== null) return Math.max(intervalSec / 60, 1.0);
  return await estimateDurationFromStopTimes(co, routeNo, stops[from], stops[to], when);
}

/* ---------------- 官方排班表估算：從 stop_times.txt 獲取時間 ---------------- */
async function estimateDurationFromStopTimes(co, routeNo, boardStopId, alightStopId, when) {
  try {
    const data = await loadHeadwayData();
    if (!data || !data.stopTimesByTrip) return null;

    const tripIds = resolveGtfsTripIds(data, co, routeNo);
    if (!tripIds || !tripIds.length) return null;

    let activeTripId = null;
    for (const tripId of tripIds) {
      const info = data.tripInfo.get(tripId);
      if (!info) continue;
      
      const calRow = data.calendarByService.get(info.serviceId);
      const calExMap = data.calendarDatesByService.get(info.serviceId);
      if (isCalendarServiceActiveOnDate(calRow, calExMap, when)) {
        activeTripId = tripId;
        break; 
      }
    }

    if (!activeTripId) return null;

    return await getTripStopDurationByTripId(activeTripId, boardStopId, alightStopId);
  } catch (err) {
    return null;
  }
}

/* ---------------- 分站時間合理性驗證：動態經緯度匹配 ----------------
 * 不再使用容易出錯的靜態 index 數組，改為利用 GPS 物理位置（150米容錯）動態匹配 GTFS 對應站點。
 * 1) 路線比對：exact「營辦商+編號」搵唔到就 fuzzy 退到「淨編號」比對（resolveGtfsTripIds）。
 * 2) 頻率班次展開：以往淨係讀 stop_times.txt 入面嗰一條「範本」trip 嘅單一時間，
 *    對於用 frequencies.txt 定義班次（無實際逐班 stop_times）嘅高頻路線／專線小巴，
 *    會誤以為成日淨得一班車。而家會將 frequencies.txt 嘅 start_time/end_time/headway_secs
 *    展開做嗰個時段入面實際嘅逐班到站時間（模板到站時間 - 模板頭站開出時間 = 到站相對於
 *    行程起點嘅時間差，加返落每一個展開咗嘅發車時刻度就得到實際到站時間)。
 * 3) 搜尋範圍收窄做「現時鄰近 windowMinutes 分鐘（預設2小時，前後對稱）」，
 *    一來符合「鄰近兩小時仲有冇班次」嘅要求，二來俾埋過去嗰半段畀上層邏輯
 *    用嚟判斷「今日呢條路線係咪其實仲有服務、只係啱啱好而家喺兩班車之間嘅空檔」，
 *    避免將高頻路線嘅正常班距空隙誤判做「尾班車已經開出」。
 */
async function getStopArrivalScheduleList(co, routeNo, targetStopId, when, windowMinutes = 120) {
  try {
    const data = await loadHeadwayData();
    if (!data || !data.stopTimesByTrip || !data.stopCoords) return { found: false, all: [] };

    const tripIds = resolveGtfsTripIds(data, co, routeNo);
    if (!tripIds || !tripIds.length) return { found: false, all: [] };

    const targetStop = etaDb.stopList[targetStopId];
    if (!targetStop) return { found: false, all: [] };
    const targetLoc = targetStop.location;

    const baseDate = new Date(when.getFullYear(), when.getMonth(), when.getDate());
    const windowStart = new Date(when.getTime() - windowMinutes * 60000);
    const windowEnd = new Date(when.getTime() + windowMinutes * 60000);
    const results = [];

    for (const tripId of tripIds) {
      const info = data.tripInfo.get(tripId);
      const rList = data.stopTimesByTrip.get(tripId);
      if (!rList || !rList.length || !info) continue;

      if (!isCalendarServiceActiveOnDate(data.calendarByService.get(info.serviceId), data.calendarDatesByService.get(info.serviceId), when)) continue;

      // 在 GTFS trip 中以物理距離尋找與目標站最接近的節點。
      // 【放寬容錯半徑】由 200 米放寬到同 MERGE_RADIUS_M（見檔案 529-536
      // 行註解）一致嘅 220 米——大型總站/公共運輸交匯處入面，唔同公司／
      // 唔同月台嘅實際站牌位置相距超過 200 米係好平常嘅事，200 米嘅門檻
      // 喺呢類大站經常配對唔中啱嘅 GTFS 節點，令總站呢個候選搵唔到準確嘅
      // 靜態時刻表。
      let bestNode = null;
      let minDist = MERGE_RADIUS_M; // 容許同「同一個站」判定一致嘅偏差
      for (const node of rList) {
        const coord = data.stopCoords.get(node.stop_id);
        if (!coord) continue;
        const d = distM(targetLoc, coord);
        if (d < minDist) { minDist = d; bestNode = node; }
      }
      if (!bestNode) continue;

      const templateMin = gtfsTimeToMinutes(bestNode.arrival_time || bestNode.departure_time);
      if (templateMin == null) continue;

      const freqBlocks = data.freqByTrip.get(tripId);
      if (freqBlocks && freqBlocks.length) {
        // === 頻率式班次：以 frequencies.txt 嘅 headway 展開實際多班次時間 ===
        const firstStop = rList[0];
        const firstMin = gtfsTimeToMinutes(firstStop.departure_time || firstStop.arrival_time);
        const offsetFromStart = (firstMin != null) ? (templateMin - firstMin) : 0;

        for (const f of freqBlocks) {
          const startMin = gtfsTimeToMinutes(f.start_time);
          let endMin = gtfsTimeToMinutes(f.end_time);
          const headwaySecs = parseInt(f.headway_secs, 10);
          if (startMin == null || endMin == null || !headwaySecs) continue;
          if (endMin < startMin) endMin += 24 * 60;

          const headwayMin = headwaySecs / 60;
          let n = 0;
          let guard = 0;
          while (guard < 3000) {
            guard++;
            const instanceStartMin = startMin + n * headwayMin;
            // GTFS 規範：frequencies.txt 嘅 end_time 係「不包含」邊界 —— 呢個時段入面
            // 最後一班車嘅開出時間必須早於 end_time（如果 start_time == end_time，
            // 即使得一個起點都唔應該當有班次），所以呢度要用 >=（而唔係 >）先啱，
            // 否則會喺 end_time 嗰一刻多展開一班實際上唔存在嘅「幽靈班次」。
            if (instanceStartMin >= endMin) break;
            const arrivalMin = instanceStartMin + offsetFromStart;
            const etaDate = gtfsMinutesToDate(arrivalMin, baseDate);
            if (etaDate >= windowStart && etaDate <= windowEnd) {
              results.push({ tripId, etaDate, viaFrequency: true, headwaySecs });
            } else if (etaDate > windowEnd) {
              break;
            }
            n++;
          }
        }
      } else {
        // === 固定班次：直接使用 stop_times.txt 記錄嘅時間 ===
        const etaDate = gtfsMinutesToDate(templateMin, baseDate);
        if (etaDate >= windowStart && etaDate <= windowEnd) {
          results.push({ tripId, etaDate, viaFrequency: false });
        }
      }
    }
    results.sort((a, b) => a.etaDate - b.etaDate);
    return { found: true, all: results };
  } catch (err) {
    return { found: false, all: [] };
  }
}

// 【專門判斷「今日尾班車係咪已經開出」，唔受 ±windowMinutes 範圍限制】
// getStopArrivalScheduleList() 嘅 windowMinutes（一般 ±120～±130 分鐘）係為
// 咗「附近有冇班次」呢個一般用途而設，但對於好似 798P 呢類全日淨係一、兩班
// （例如淨朝早一班）嘅稀疏路線，一旦而家嘅時間同嗰班車相隔超過 windowMinutes，
// 個窗口入面就乜都搵唔到（recentPastTrips 同 futureTrips 都係空），令上層
// pastLastKnownTrip 呢個「尾班車已開」嘅判斷完全失效，於是又跌落去用粗略嘅
// scheduleFallback／r.freq 估算，砌一個唔存在嘅「推算班次」出嚟。
// 呢個函數改為掃描「今日成日」（唔限窗口），直接答返：
//   - true  : 今日之後（now 或以後）仲有至少一班預定班次
//   - false : 今日確實搵到過班次紀錄，但全部都已經早過 now（尾班車已開出）
//   - null  : 完全搵唔到任何可信紀錄（冇資料判斷，交返上層原有處理）
async function hasAnyRemainingTripToday(co, routeNo, targetStopId, when) {
  try {
    const data = await loadHeadwayData();
    if (!data || !data.stopTimesByTrip || !data.stopCoords) return null;

    const tripIds = resolveGtfsTripIds(data, co, routeNo);
    if (!tripIds || !tripIds.length) return null;

    const targetStop = etaDb.stopList[targetStopId];
    if (!targetStop) return null;
    const targetLoc = targetStop.location;

    const baseDate = new Date(when.getFullYear(), when.getMonth(), when.getDate());
    const cutoff = new Date(when.getTime() - 30000);

    let sawAnyTripToday = false;
    let hasFutureTripToday = false;

    for (const tripId of tripIds) {
      const info = data.tripInfo.get(tripId);
      const rList = data.stopTimesByTrip.get(tripId);
      if (!rList || !rList.length || !info) continue;
      if (!isCalendarServiceActiveOnDate(data.calendarByService.get(info.serviceId), data.calendarDatesByService.get(info.serviceId), when)) continue;

      let bestNode = null;
      let minDist = MERGE_RADIUS_M; // 放寬到同「同一個站」判定一致嘅 220 米，理由見上面 getStopArrivalScheduleList()
      for (const node of rList) {
        const coord = data.stopCoords.get(node.stop_id);
        if (!coord) continue;
        const d = distM(targetLoc, coord);
        if (d < minDist) { minDist = d; bestNode = node; }
      }
      if (!bestNode) continue;

      const templateMin = gtfsTimeToMinutes(bestNode.arrival_time || bestNode.departure_time);
      if (templateMin == null) continue;

      const freqBlocks = data.freqByTrip.get(tripId);
      if (freqBlocks && freqBlocks.length) {
        const firstStop = rList[0];
        const firstMin = gtfsTimeToMinutes(firstStop.departure_time || firstStop.arrival_time);
        const offsetFromStart = (firstMin != null) ? (templateMin - firstMin) : 0;

        for (const f of freqBlocks) {
          const startMin = gtfsTimeToMinutes(f.start_time);
          let endMin = gtfsTimeToMinutes(f.end_time);
          const headwaySecs = parseInt(f.headway_secs, 10);
          if (startMin == null || endMin == null || !headwaySecs) continue;
          if (endMin < startMin) endMin += 24 * 60;

          const headwayMin = headwaySecs / 60;
          let n = 0, guard = 0;
          while (guard < 3000) {
            guard++;
            const instanceStartMin = startMin + n * headwayMin;
            if (instanceStartMin >= endMin) break;
            const arrivalMin = instanceStartMin + offsetFromStart;
            const etaDate = gtfsMinutesToDate(arrivalMin, baseDate);
            sawAnyTripToday = true;
            if (etaDate >= cutoff) { hasFutureTripToday = true; break; }
            n++;
          }
        }
      } else {
        const etaDate = gtfsMinutesToDate(templateMin, baseDate);
        sawAnyTripToday = true;
        if (etaDate >= cutoff) hasFutureTripToday = true;
      }

      if (hasFutureTripToday) break;
    }

    if (!sawAnyTripToday) return null; // 冇搵到今日任何可信班次紀錄，唔足夠判斷
    return hasFutureTripToday;
  } catch (err) {
    return null;
  }
}

async function getTripStopDurationByTripId(tripId, boardStopId, alightStopId) {
  try {
    const data = await loadHeadwayData();
    if (!data || !data.stopTimesByTrip || !data.stopCoords) return null;
    const rList = data.stopTimesByTrip.get(tripId);
    if (!rList || !rList.length) return null;

    const boardLoc = etaDb.stopList[boardStopId]?.location;
    const alightLoc = etaDb.stopList[alightStopId]?.location;
    if (!boardLoc || !alightLoc) return null;

    let boardNode = null;
    let minDistBoard = MERGE_RADIUS_M; // 放寬到同「同一個站」判定一致嘅 220 米，理由見 getStopArrivalScheduleList()
    let boardSeq = -1;
    let alightNode = null;
    let minDistAlight = MERGE_RADIUS_M;
    let alightSeq = -1;

    for (const node of rList) {
      const coord = data.stopCoords.get(node.stop_id);
      if (!coord) continue;
      const seq = parseInt(node.stop_sequence, 10);
      
      const dBoard = distM(boardLoc, coord);
      if (dBoard < minDistBoard) {
        minDistBoard = dBoard;
        boardNode = node;
        boardSeq = seq;
      }
      
      const dAlight = distM(alightLoc, coord);
      if (dAlight < minDistAlight) {
        minDistAlight = dAlight;
        alightNode = node;
        alightSeq = seq;
      }
    }

    if (boardNode && alightNode && boardSeq < alightSeq) {
      const boardMin = gtfsTimeToMinutes(boardNode.departure_time || boardNode.arrival_time);
      const alightMin = gtfsTimeToMinutes(alightNode.arrival_time);
      if (boardMin != null && alightMin != null && alightMin >= boardMin) {
        return Math.max(alightMin - boardMin, 1.5);
      }
    }
    return null;
  } catch (err) {
    return null;
  }
}

function resolveStopIdxForCo(r, seg, co, primaryIdx) {
  const primaryStops = r.stops[seg.primaryCo];
  if (!primaryStops || primaryIdx < 0 || primaryIdx >= primaryStops.length) return -1;
  if (co === seg.primaryCo) return primaryIdx;
  const refStopId = primaryStops[primaryIdx];
  return findEquivalentStopIdx(r, co, refStopId);
}

/* ---------------- 泛用單邊/相鄰/前班次校準：第一優先／第二優先車程估算 ----------------
 *
 * 第一優先（完整起訖 ETA，直接相減）：
 *   適用於呢班車喺起點同終點（或途經站）都有實時 ETA 嘅情況。
 *   由上車站開始，逐個站攞返 json 實時 ETA，同 GTFS 預定嘅站與站行車時間（getBaseDurationFn）
 *   對比是否合理（容忍 0.4x ~ 3x），逐站配對落去，一直去到落車站為止。
 *   如果成條鏈都配對成功（即由上車站到落車站全部站都對得上），先算「完整」，
 *   可以直接用實時 ETA 相減 (matchedActualMin) 得出精準行車時間。
 *   但要留意：落車時間必須喺查詢時間（now）之後一小時之內先當呢個結果新鮮可靠，
 *   太遠期嘅 ETA 準確度成疑，唔應該用嚟做「精準」行車時間。
 *
 * 第二優先（起點有 ETA、終點缺乏實時 ETA，主要依賴 GTFS 預定路線）：
 *   如果對唔晒（落車時間唔喺一小時新鮮窗口內），
 *   就退返用已經配對到嘅（哪怕係部分）實時站點，計算「實際 / GTFS 預定」嘅比率，
 *   將呢個比率套用喺餘下（未有實時 ETA 覆蓋）嘅 GTFS 預定路段度，
 *   從而推算出貼近現況嘅估計行車時間。
 *   呢個做法必須先確認條路線喺當日（dep.etaDate 所在日期）根據 calendar.txt /
 *   calendar_dates.txt 仍然喺服務時間以內，如果當日冇服務就直接放棄呢個估算
 */
async function calibrateDurationOneSidedGeneral(r, seg, usedCo, dep, currentTime, matchedRefs, getBaseDurationFn, now) {
  const primaryStops = r.stops[seg.primaryCo];
  if (!primaryStops) return null;

  // 第一優先需要行到落車站先算「完整」；受限於 ONESIDED_MAX_HOPS，避免逐站掃太多次 API。
  const hopCeilingIdx = Math.min(seg.alightIdx, seg.boardIdx + ONESIDED_MAX_HOPS);

  let matchedActualMin = 0;
  let matchedBaseMin = 0;
  let matchedHops = 0;
  let lastMatchedIdx = seg.boardIdx;
  let lastMatchedTime = dep.etaDate;

  // 【效能修正】以往呢個逐站比對係一個 for 迴圈入面逐個 await getEtasCached，
  // 最多 14 個站就要 14 次「攞完先攞下一個」嘅序列請求，非常慢。呢啲請求其實
  // 互不相依（每一站攞返嚟嘅原始 ETA 清單，並唔需要靠前一站嘅配對結果），
  // 所以而家先用 Promise.all 一次過並行攞晒所有候選站嘅 ETA 清單，
  // 再喺低下逐站做返配對邏輯（呢部分冇 API 請求，純粹本地比對，好快）。
  const hopIndices = [];
  for (let i = seg.boardIdx + 1; i <= hopCeilingIdx; i++) hopIndices.push(i);
  const hopLists = await Promise.all(hopIndices.map(async (candidateIdx) => {
    const coIdx = resolveStopIdxForCo(r, seg, usedCo, candidateIdx);
    if (coIdx < 0) return null;
    try {
      const list = await getEtasCached(seg.routeId, r, usedCo, coIdx);
      return (list && list.length) ? list : null;
    } catch (e) { return null; }
  }));

  // === 逐站將 json 實時 ETA 對比 GTFS 預定行車時間，確認是否同一班次 ===
  // 就算起訖點都有實時 ETA，都必須逐站行呢條鏈落去，唔可以淨係憑起訖兩點
  // 就直接相減，避免誤配到前一（幾）班已經開出嘅車嘅 ETA，導致估快車程。
  for (let hi = 0; hi < hopIndices.length; hi++) {
    const candidateIdx = hopIndices[hi];
    const list = hopLists[hi];
    if (!list) continue;

    const baseChunk = await getBaseDurationFn(lastMatchedIdx, candidateIdx);
    if (baseChunk === null || baseChunk <= 0) continue;

    let best = null, bestErr = Infinity;
    for (const e of list) {
      if (e.isFallback) continue; // 只計真正實時 ETA，唔可以係 GTFS 推算出嚟嘅假班次
      if (e.etaDate <= lastMatchedTime) continue;
      const diffMins = (e.etaDate.getTime() - lastMatchedTime.getTime()) / 60000;
      if (diffMins < baseChunk * 0.4 || diffMins > baseChunk * 3) continue; // 同 GTFS 預定時間比對是否合理
      const err = Math.abs(diffMins - baseChunk);
      if (err < bestErr) { bestErr = err; best = { diffMins, etaDate: e.etaDate }; }
    }

    if (!best) continue;

    matchedActualMin += best.diffMins;
    matchedBaseMin += baseChunk;
    matchedHops++;
    lastMatchedIdx = candidateIdx;
    lastMatchedTime = best.etaDate;
  }

  const reachedAlightStop = matchedHops > 0 && lastMatchedIdx >= seg.alightIdx;

  // === 第一優先：完整起訖 ETA 鏈，直接相減 ===
  if (reachedAlightStop) {
    const referenceNow = now instanceof Date ? now : currentTime;
    const minutesFromQuery = (lastMatchedTime.getTime() - referenceNow.getTime()) / 60000;
    if (minutesFromQuery <= PRIORITY1_ALIGHT_FRESH_WINDOW_MIN) {
      return Math.max(matchedActualMin, 1.5);
    }
    // 落車時間超出查詢後一小時嘅新鮮窗口，呢個「完整鏈」結果唔當精準，
    // falls through 落第二優先，用返比率推算方式。
  }

  // === 第二優先：起點（或部分途經站）有 ETA，但去唔到終點實時 ETA，主要靠 GTFS 校準 ===
  let ratio = null;
  if (matchedHops > 0 && matchedBaseMin > 0) {
    ratio = matchedActualMin / matchedBaseMin;
  } else if (matchedRefs && matchedRefs.length > 0) {
    // 【修正】以往呢度淨係揀「同 dep.etaDate 絕對時間最接近」嘅終點 ETA 當參考，
    // 完全冇檢查個差值是否合理 —— 若果終點站啱啱好有一班「較早、已經喺上車站
    // 開出咗」嘅車嘅 ETA 喺絕對時間上更接近，就會誤將嗰班已經開出嘅前一班車
    // 嘅到站時間當做同一班車，計出嚴重偏快、唔合理嘅車程。而家改為：預先攞
    // 返 GTFS 預定嘅全程行車時間（refBase）做參考基準，只揀「實際差值喺
    // refBase 嘅 0.4x～3x 合理範圍內」嘅終點 ETA，喺呢啲合理候選入面揀
    // 「差值最細（即最快到達、最貼近下一班車）」嗰個，先真正對應返同一班車，
    // 而唔係盲目揀絕對時間最近嘅嗰個。
    const refBase = await getBaseDurationFn(seg.boardIdx, seg.alightIdx);
    if (refBase && refBase > 0) {
      let bestRef = null, bestDiffMin = Infinity;
      for (const ref of matchedRefs) {
        if (ref.isFallback) continue; // 同樣只信真正實時 ETA
        const actualDurMin = (ref.etaDate.getTime() - dep.etaDate.getTime()) / 60000;
        if (!(actualDurMin > 0) || !Number.isFinite(actualDurMin)) continue;
        if (actualDurMin < refBase * 0.4 || actualDurMin > refBase * 3) continue; // 同 GTFS 預定時間比對是否合理
        if (actualDurMin < bestDiffMin) { bestDiffMin = actualDurMin; bestRef = { actualDurMin }; }
      }
      if (bestRef) {
        ratio = bestRef.actualDurMin / refBase;
      }
    }
  }

  if (ratio === null || !Number.isFinite(ratio)) return null;
  ratio = Math.min(2.5, Math.max(0.4, ratio));

  // 第二優先需要靠 GTFS 預定路線推算餘下路段，所以必須先確認條路線
  // 喺 dep.etaDate 當日（根據 calendar.txt / calendar_dates.txt）仍然喺服務時間以內。
  const serviceActive = await isServiceActiveForRouteOnDate(usedCo, r.route, dep.etaDate);
  if (serviceActive === false) return null;

  // 如果之前「完整鏈」有配對到落車站，但因為唔夠新鮮而 fall through 落嚟，
  // 就直接用已配對到嘅實際時間，唔需要再用比率去推算（本身已經係最準確嘅數據）。
  if (reachedAlightStop) {
    return Math.max(matchedActualMin, 1.5);
  }

  const remainBase = await getBaseDurationFn(lastMatchedIdx, seg.alightIdx);
  if (remainBase === null) return null;
  const total = matchedActualMin + (remainBase * ratio);
  return Math.max(total, 1.5);
}

// 【轉車站重新優化】beam search 揀 A 程落車站嗰陣，純粹跟「距離終點最近」
// 呢個 heuristic 揀（見 runBeamSearch() 嘅 alightDist 相關邏輯）——嗰一步
// 根本仲未知道 B 程會用邊條路線，所以完全冇考慮「呢個落車站離 B 程嘅上車站
// 有幾遠」。結果好可能 A 程沿住自己路線行多幾個站，先真正最貼近 B 程嘅
// 上車站（例如觀塘轉車站呢類官方轉車站，兩條路線可能啱啱好喺嗰個站，或者
// 好近嘅站分別停靠），但因為 beam search 揀落車站嗰陣睇唔到呢個關係，就
// 揀咗一個要行 300 幾米先轉到車嘅組合。
//
// 呢個 function 喺 A、B 兩程路線已經固定之後（即係 evaluateCandidate() 呢
// 一步）先做，喺 A 程原本落車站、B 程原本上車站附近（各自 ±TRANSFER_REOPT_
// WINDOW 個站，唔會超出各自路線嘅站序範圍，亦唔會超越自己嗰程嘅上／落車站）
// 逐一比對兩程站與站之間嘅真實距離，揀返所有組合入面最近嘅一對。如果比原本
// 嗰對近夠多（超過 TRANSFER_REOPT_MIN_IMPROVEMENT_M），先採用呢個新組合做
// 落車／上車站，並同步更新（近到當同一個站群就整段刪走；仲有明顯步行距離
// 就更新／新增轉車步行段）。
const TRANSFER_REOPT_WINDOW = 20;
const TRANSFER_REOPT_MIN_IMPROVEMENT_M = 80;
const TRANSFER_REOPT_SAME_STOP_M = 30;

function _optimizeTransferPoints(originalSegs) {
  const segs = originalSegs.map(s => ({ ...s }));

  for (let i = 0; i < segs.length; i++) {
    if (segs[i].type !== "ride") continue;

    let j = i + 1;
    let walkIdx = -1;
    if (j < segs.length && segs[j].type === "walk") { walkIdx = j; j++; }
    if (j >= segs.length || segs[j].type !== "ride") continue;

    const legA = segs[i];
    const legB = segs[j];

    // 只處理站到站嘅轉車步行（唔理起點／終點嗰種掛鈎 GPS 座標而非
    // stopId 嘅步行段），避免搞亂咗起點/終點嗰段。
    if (walkIdx >= 0) {
      const w = segs[walkIdx];
      if (!w.fromStopId || !w.toStopId) continue;
    }

    const stopsA = legA.r && legA.r.stops ? legA.r.stops[legA.primaryCo] : null;
    const stopsB = legB.r && legB.r.stops ? legB.r.stops[legB.primaryCo] : null;
    if (!stopsA || !stopsB) continue;

    const aLoLimit = Math.max(legA.boardIdx + 1, legA.alightIdx - TRANSFER_REOPT_WINDOW);
    const aHiLimit = Math.min(stopsA.length - 1, legA.alightIdx + TRANSFER_REOPT_WINDOW);
    const bLoLimit = Math.max(0, legB.boardIdx - TRANSFER_REOPT_WINDOW);
    const bHiLimit = Math.min(legB.alightIdx - 1, legB.boardIdx + TRANSFER_REOPT_WINDOW);

    const curALoc = etaDb.stopList[legA.alightStopId]?.location;
    const curBLoc = etaDb.stopList[legB.boardStopId]?.location;
    const currentDist = (curALoc && curBLoc) ? distM(curALoc, curBLoc) : Infinity;

    let bestAIdx = legA.alightIdx;
    let bestBIdx = legB.boardIdx;
    let bestDist = currentDist;
    let bbiRecommendedApplied = false;

    for (let ai = aLoLimit; ai <= aHiLimit; ai++) {
      const aStopId = stopsA[ai];
      const aLoc = etaDb.stopList[aStopId]?.location;
      if (!aLoc) continue;
      for (let bi = bLoLimit; bi <= bHiLimit; bi++) {
        const bStopId = stopsB[bi];
        const bLoc = etaDb.stopList[bStopId]?.location;
        if (!bLoc) continue;
        const d = distM(aLoc, bLoc);
        if (d < bestDist) {
          bestDist = d;
          bestAIdx = ai;
          bestBIdx = bi;
        }
      }
    }

    // 【官方轉車站／港鐵站全程掃描】上面 ±TRANSFER_REOPT_WINDOW（20 個站）
    // 嘅窄窗口，只夠應付兩程喺地理上本身就好接近嘅轉車位。但好多真正
    // 需要用嘅長途組合（例如馬鞍山市中心 682＞大老山隧道轉車站＞798
    // 去將軍澳、九龍城碼頭 11B＞觀塘＞93A 去寶琳），個官方轉車站／港鐵站
    // 可能喺 A 程或 B 程嘅站序好後／好前面，早就超出咗 ±20 個站嘅範圍，
    // 令上面嗰個窗口掃描完全睇唔到呢個轉乘機會，淨係揀窗口入面「啱啱好
    // 較近、但其實唔啱」嘅組合，甚至完全冇改善（因為兩程窗口根本冇重疊）。
    // 而家額外做一次全程（唔設 ±20 限制）掃描，專門搵兩程路線入面有冇
    // 共同嘅「官方轉車站」（isOfficialInterchangeName——涵蓋「XX轉車站」
    // 「大老山隧道」等關鍵字，以及九巴 BBI 轉車站名單）或者同一個轉乘點
    // （isSameTransferPoint——包括同一個港鐵/輕鐵站、同名巴士總站等）。
    // 呢類官方設計好嘅轉乘點，就算窗口版揀到嘅組合睇落去（純直線距離）
    // 差唔多近，都應該優先採用——因為佢哋通常有蓋走廊／同月台轉乘等
    // 設計，比起純粹「啱啱行埋近」嘅隨機站對可靠得多，亦係用戶實際會
    // 諗到、會用嘅轉車位。
    const OFFICIAL_TRANSFER_MAX_DIST_M = 400;
    let bestOfficialAIdx = -1, bestOfficialBIdx = -1, bestOfficialDist = Infinity;
    for (let ai = legA.boardIdx + 1; ai <= stopsA.length - 1; ai++) {
      const aStopId = stopsA[ai];
      const aStop = etaDb.stopList[aStopId];
      if (!aStop || !aStop.location) continue;
      const aIsOfficial = isOfficialInterchangeName(aStop.name?.zh) || isOfficialInterchangeName(aStop.name?.en);
      for (let bi = 0; bi <= legB.alightIdx - 1; bi++) {
        const bStopId = stopsB[bi];
        const bStop = etaDb.stopList[bStopId];
        if (!bStop || !bStop.location) continue;
        const sameStop = isSameTransferPoint(aStop, bStop);
        if (!sameStop) {
          const bIsOfficial = isOfficialInterchangeName(bStop.name?.zh) || isOfficialInterchangeName(bStop.name?.en);
          if (!(aIsOfficial && bIsOfficial)) continue;
        }
        const d = distM(aStop.location, bStop.location);
        if (!sameStop && d > OFFICIAL_TRANSFER_MAX_DIST_M) continue;
        if (d < bestOfficialDist) {
          bestOfficialDist = d;
          bestOfficialAIdx = ai;
          bestOfficialBIdx = bi;
        }
      }
    }
    if (bestOfficialAIdx >= 0 && bestOfficialDist < bestDist) {
      bestDist = bestOfficialDist;
      bestAIdx = bestOfficialAIdx;
      bestBIdx = bestOfficialBIdx;
    }

    // 【九巴 BBI 建議轉車站優先】上面兩種掃描都係「靠估」——一種靠站名
    // 關鍵字（isOfficialInterchangeName），一種靠物理位置夠近（isSameTransferPoint／
    // 400 米內）。但九巴自己嘅轉乘優惠資料（bbi_f1／bbi_b1.json）入面，
    // 每一對「路線A轉路線B」記錄實際上都帶住一個 recommended_bbi（建議
    // 轉車站）欄位，先係真正貼合返呢兩條路線點轉車嘅官方資料，比起上面
    // 兩種靠估嘅方法可靠得多。而家搵到呢個建議站，就算原本嗰對已經係
    // 同一個站（0 米，睇落已經最貼），都應該優先跟返官方建議——因為
    // 落錯站分分鐘連轉乘優惠都攞唔到（見 _kmbBbiDiscountFor() 嘅「建議
    // 轉車站位置檢定」），所以呢一步唔受落面「必須有距離改善」嘅門檻
    // 限制，搵到就用，只要求同 legB 路線實際物理距離唔會離晒譜。
    if (legA.primaryCo === "kmb" && legB.primaryCo === "kmb" && bbiHeavyLoaded && (bbiF1Db || bbiB1Db)) {
      const bbiKey = _routeKeyForBbi(legA.r.route);
      const bbiNextRoute = _routeKeyForBbi(legB.r.route);
      let bbiRecommendedName = null;
      for (const table of [bbiF1Db, bbiB1Db]) {
        if (!table) continue;
        const entries = table[bbiKey] || table[legA.r.route] || null;
        if (!Array.isArray(entries)) continue;
        for (const e of entries) {
          if (_routeKeyForBbi(e.bbi_route_number) !== bbiNextRoute) continue;
          if (e.bbi_direction) {
            const prevDest = legA.r.dest?.zh || "";
            if (prevDest && !prevDest.includes(e.bbi_direction) && !e.bbi_direction.includes(prevDest)) continue;
          }
          if (e.destination) {
            const nextDest = legB.r.dest?.zh || "";
            if (nextDest && !nextDest.includes(e.destination) && !e.destination.includes(nextDest)) continue;
          }
          const name = _extractBbiStopName(e.recommended_bbi);
          if (name) { bbiRecommendedName = name; break; }
        }
        if (bbiRecommendedName) break;
      }

      if (bbiRecommendedName) {
        const bbiAIdx = _ctbFindAnchorIdx(legA, bbiRecommendedName);
        if (bbiAIdx !== null && bbiAIdx > legA.boardIdx && bbiAIdx <= stopsA.length - 1) {
          const anchorLoc = etaDb.stopList[stopsA[bbiAIdx]]?.location;
          if (anchorLoc) {
            let bbiBestBIdx = -1, bbiBestBDist = Infinity;
            for (let bi = 0; bi <= legB.alightIdx - 1; bi++) {
              const bLoc = etaDb.stopList[stopsB[bi]]?.location;
              if (!bLoc) continue;
              const d = distM(anchorLoc, bLoc);
              if (d < bbiBestBDist) { bbiBestBDist = d; bbiBestBIdx = bi; }
            }
            const BBI_RECOMMENDED_MAX_DIST_M = 600;
            if (bbiBestBIdx >= 0 && bbiBestBDist <= BBI_RECOMMENDED_MAX_DIST_M) {
              bestAIdx = bbiAIdx;
              bestBIdx = bbiBestBIdx;
              bestDist = bbiBestBDist;
              bbiRecommendedApplied = true;
            }
          }
        }
      }
    }

    if (bbiRecommendedApplied || bestDist < currentDist - TRANSFER_REOPT_MIN_IMPROVEMENT_M) {
      const newAlightStopId = stopsA[bestAIdx];
      const newBoardStopId = stopsB[bestBIdx];

      legA.alightIdx = bestAIdx;
      legA.alightStopId = newAlightStopId;
      legB.boardIdx = bestBIdx;
      legB.boardStopId = newBoardStopId;

      if (bestDist <= TRANSFER_REOPT_SAME_STOP_M) {
        // 新組合已經係同一個站／同一個站群，唔再需要轉車步行段
        if (walkIdx >= 0) segs.splice(walkIdx, 1);
      } else {
        const mins = Math.max(1, Math.ceil(bestDist / WALK_SPEED_MPS / 60));
        const newWalkSeg = {
          type: "walk",
          fromStopId: newAlightStopId,
          toStopId: newBoardStopId,
          fromName: stopName(newAlightStopId),
          toName: stopName(newBoardStopId),
          distM: Math.round(bestDist),
          minutes: mins
        };
        if (walkIdx >= 0) {
          segs[walkIdx] = newWalkSeg;
        } else {
          segs.splice(i + 1, 0, newWalkSeg);
        }
      }
    }
  }

  return segs;
}

/* ---------------- 實時路徑及時間評估主引擎 ----------------
 * opts.treatSecondaryLegsRelaxed：自選行程模式專用。第一程之後（rideCount > 0）
 * 嘅車程，若無實時 ETA，唔應該再受制於「headwayResult===false 就即刻判死」嘅
 * 嚴格檢查（呢個檢查原意係為咗喺 beam search 大量候選之中減少假班次，但自選
 * 行程係用戶親自揀嘅路線＋站，唔應該因為呢個嚴格檢查而完全計唔到），改為
 * 寬鬆模式：仍然會用 isServiceActiveForRouteOnDate 呢個 GTFS calendar 檢查
 * 把關（明確確認「今日冇服務」先至唔畀 fallback），但唔再要求一定要有「鄰近
 * 班次」先可以嘗試估算。 */
async function evaluateCandidate(cand, now, relaxed = false, opts = {}) {
  const { treatSecondaryLegsRelaxed = false, skipTransferReopt = false } = opts;
  // 自選行程模式：轉車站係用戶自己逐程揀嘅，唔應該再被
  // _optimizeTransferPoints()（搵附近有冇更近嘅站對）靜雞雞覆寫。
  const segs = skipTransferReopt
    ? cand.segs.map(s => ({ ...s }))
    : _optimizeTransferPoints(cand.segs);

  const isLantauTrip = computeIsLantauTrip(origin || {name:"", lat:0, lng:0}, destination || {name:"", lat:0, lng:0});

  let estimatedCandidateTotalMin = 0;
  for (const seg of segs){
    if (seg.type === "walk"){
      estimatedCandidateTotalMin += Math.max(1, Math.ceil(seg.distM / WALK_SPEED_MPS / 60));
    } else if (seg.type === "ride"){
      estimatedCandidateTotalMin += await estimateSegmentDuration(seg.r, seg.primaryCo, seg.boardIdx, seg.alightIdx);
    }
  }
  const isCandidateLongHaul = estimatedCandidateTotalMin > LONG_TRIP_TOTAL_MIN_THRESHOLD;

  // 總行程時間上限統一 300 分鐘
  const MAX_TOTAL_TRIP_MINUTES = 300;

  async function dfs(segIdx, currentTime, pathLegs, rideCount) {
    if (segIdx >= segs.length) {
      if (rideCount === 0) return null;
      const totalMinutes = Math.round((currentTime.getTime() - now.getTime()) / 60000);
      if (totalMinutes > MAX_TOTAL_TRIP_MINUTES) {
        return null;
      }
      
      let hasMisusedAirportRoute = false;
            for (const leg of pathLegs) {
               if (leg.type === "ride" && /^[AE]/i.test(leg.routeNo) && !isLantauTrip) {
                   // 市區內來往，且該 A/E 線市區方向，不視為濫用/誤搭
                   const isCitybound = leg.r && !LANTAU_KEYWORDS.test(leg.r.dest?.zh || "");
                   if (!isCitybound) {
                       hasMisusedAirportRoute = true;
                   }
               }
            }
      const isSpeculative = pathLegs.some(leg => leg.type === "ride" && leg.isSpeculative);
      const rideLegsForFare = pathLegs.filter(leg => leg.type === "ride");
      const fareResult = await computeTripFare(rideLegsForFare);

      // 轉乘質性評分（100分為滿分，獨立於耗時，見 calculateTransferQualityScore()）。
      // 呢個分數淨係用嚟做結果嘅次要排序／展示參考，唔會用嚟淘汰候選，
      // 避免「避免過早將好方案淘汰」呢個原則被違反。
      let transferQualityScore = 100;
      try {
        const tripStartTime = pathLegs[0]?.departTime || now;
        const isDeepNightForPlan = tripStartTime.getHours() >= 0 && tripStartTime.getHours() < 6;
        const planDirectExists = hasDirectService(origin, destination, now);
        transferQualityScore = calculateTransferQualityScore(
          pathLegs, planDirectExists, isDeepNightForPlan,
          { lat: destination?.lat, lng: destination?.lng }
        );
      } catch (e) {
        // 質性評分只係輔助排序，計算失敗都唔應該累事令成個行程消失
        transferQualityScore = 100;
      }

      return {
        legs: pathLegs,
        transfers: rideCount - 1,
        totalMinutes,
        // 【搜尋一刻做統一起點】以前頭部顯示嘅時間範圍係直接攞
        // pathLegs[0].departTime——如果第一程係步行（即刻由搜尋一刻
        // 出發），呢個時間啱好等於 now；但如果第一程直接係搭車（唔
        // 使行去第二個站），pathLegs[0].departTime 就會係「班車實際
        // 開車嗰一刻」，跳過咗喺原站等車嗰段時間，變成兩類方案嘅顯示
        // 起點基準不一致，睇落好似「行遠啲去搭車」嗰個方案無端端著咗
        // 數（總用時計法一致，純粹顯示唔一致，會令人誤會計算方法本
        // 身唔公平）。呢度統一記低真正嘅搜尋起點 now，等顯示同
        // totalMinutes 用返同一個基準。
        searchStartTime: now,
        arriveTime: currentTime,
        hasMisusedAirportRoute,
        hasImplausibleWait: false,
        isCircuitous: cand.isCircuitous,
        hasRedundantHop: cand.hasRedundantHop,
        isSpeculative,
        totalFare: fareResult.totalFare,
        fareDiscount: fareResult.discount,
        transferQualityScore
      };
    }

    const seg = segs[segIdx];

    // 自選行程模式：第一程之後（rideCount > 0）嘅車程一律當寬鬆模式處理，
    // 冇實時 ETA 時改為靠 GTFS 估算是否有服務，唔會因為冇「鄰近實時班次」
    const segRelaxed = relaxed || (treatSecondaryLegsRelaxed && rideCount > 0);

    if (seg.type === "walk") {
      let mins = Math.max(1, Math.ceil(seg.distM / WALK_SPEED_MPS / 60));
      let actualDistM = seg.distM;

      // 【連續港鐧車程之間嘅站內轉乘】如果呢段 walk seg 前後兩程都係
      // 港鐧重鐵（例如金鐧港島綫轉南港島綫），用戶全程都喺閘機入面轉
      // 車，唔應該當一般轉乘咁計「出咗閘行出街，再入返閘」嗰段戶外
      // 步行路線（getRealWalkingDataCached）——嗰種計法係為咗兩個獨立
      // 車站／巴士站之間嘅戶外轉乘設計，套落同一個站體入面會攞到完全
      // 唔啱嘅出入口建議，仲會令步行時間計錯。呢度改用地政總署室內
      // 地圖 API 直接計月台↔月台嘅室內距離；攞唔到（例如兩個站解析
      // 唔到同一個 venue，代表其實唔係同一個站體）先落級用返原本嘅
      // 戶外步行路線計法。
      const prevPathLeg = pathLegs.length ? pathLegs[pathLegs.length - 1] : null;
      const nextSeg = segIdx + 1 < segs.length ? segs[segIdx + 1] : null;
      const isRailToRailInterchange = !!(
        seg.fromStopId && seg.toStopId &&
        prevPathLeg && prevPathLeg.type === "ride" && isRailCo(prevPathLeg.co) &&
        nextSeg && nextSeg.type === "ride" && isRailCo(nextSeg.primaryCo)
      );

      let handledAsRailIndoorTransfer = false;
      if (isRailToRailInterchange) {
        const indoorTransferM = await getMtrIndoorTransferM(seg.fromStopId, seg.toStopId);
        if (indoorTransferM !== null) {
          actualDistM = indoorTransferM;
          mins = Math.max(1, Math.ceil(actualDistM / WALK_SPEED_MPS / 60));
          handledAsRailIndoorTransfer = true;
        }
      }

      if (!handledAsRailIndoorTransfer && seg.distM > 100) {
        let fromLoc = null;
        let toLoc = null;
        let cacheKey = null;

        if (seg.fromStopId && seg.toStopId) {
          fromLoc = etaDb.stopList[seg.fromStopId]?.location;
          toLoc = etaDb.stopList[seg.toStopId]?.location;
          cacheKey = `${seg.fromStopId}_${seg.toStopId}`;
        } else if (seg.fromStopId) {
          fromLoc = etaDb.stopList[seg.fromStopId]?.location;
          toLoc = { lat: seg.toLat, lng: seg.toLng };
          cacheKey = `${seg.fromStopId}_${seg.toLat.toFixed(5)},${seg.toLng.toFixed(5)}`;
        } else if (seg.toStopId) {
          fromLoc = { lat: seg.fromLat, lng: seg.fromLng };
          toLoc = etaDb.stopList[seg.toStopId]?.location;
          cacheKey = `${seg.fromLat.toFixed(5)},${seg.fromLng.toFixed(5)}_${seg.toStopId}`;
        }

        if (fromLoc && toLoc && cacheKey) {
          const realWalk = await getRealWalkingDataCached(cacheKey, fromLoc, toLoc);
          if (realWalk.success) {
            // 【自選行程唔應該因為步行距離就成程「無法計算」】以下呢兩重步行
            // 距離把關（真實/直線比例 >3倍、同真實距離上限 walkCapM*1.3）
            // 原意係喺自動搜尋（beam search）度過濾明顯唔合理嘅候選，避免
            // 顯示「行成公里先接到車」呢類方案。但自選行程（treatSecondaryLegsRelaxed）
            // 係用戶自己揀晒每一程嘅路線／上落車站，佢哋好清楚自己想用邊個
            // 轉車點（例如天水圍港鐧站去輕鐵站，因為輕鐵站座標本身係靠
            // exits.mtr.json 撞名嘅後備估算，未必精準，真實行人路網距離可能
            // 被高估），一旦撞正呢重上限就會令成個組合完全顯示唔到「無法
            // 計算該行程」，用戶連個步行時間都睇唔到。所以自選行程唔再
            // 因為呢兩重檢查而 return null，淨係照用返行人路網嘅真實距離／
            // 車程計落去，等用戶自己判斷是否接受呢段步行。
            if (!treatSecondaryLegsRelaxed && (realWalk.distM / seg.distM) > 3.0) {
              return null; 
            }

            // 【地政總署室內步行路網補充】realWalk.distM 淨係「出口座標」去
            // 目的地嗰段戶外距離，完全冇計落月台經閘機、通道行到出口嗰段
            // 室內距離。呢度分別為 seg 兩端（如果係港鐵站）加返呢一段補充。
            let indoorSupplementM = 0;
            if (seg.fromStopId && seg.fromStopId.startsWith("MTR-")) {
              indoorSupplementM += await getMtrIndoorSupplementM(seg.fromStopId, fromLoc);
            }
            if (seg.toStopId && seg.toStopId.startsWith("MTR-")) {
              indoorSupplementM += await getMtrIndoorSupplementM(seg.toStopId, toLoc);
            }

            actualDistM = realWalk.distM + indoorSupplementM;
            mins = Math.max(1, Math.ceil(actualDistM / WALK_SPEED_MPS / 60));

            const isOriginWalk = rideCount === 0;
            const hasMoreRideAhead = segs.slice(segIdx + 1).some(s => s.type === "ride");
            let walkCapM;
            if (isOriginWalk) {
              walkCapM = getRegionWalkLimit(origin?.lat, origin?.lng, origin?.name);
            } else if (!hasMoreRideAhead) {
              walkCapM = getRegionWalkLimit(destination?.lat, destination?.lng, destination?.name);
            } else {
              walkCapM = MAX_TRANSFER_WALK_M;
            }
            if (!treatSecondaryLegsRelaxed && actualDistM > walkCapM * 1.3) {
              return null;
            }
          }
        }
      }

      const fromName = seg.fromStopId ? stopName(seg.fromStopId) : (seg.fromName || origin?.name || "起點");
      const toName = seg.toStopId ? stopName(seg.toStopId) : (seg.toName || destination?.name || "終點");
      
      let nextLegs = pathLegs.slice();
      const lastLeg = nextLegs.length > 0 ? nextLegs[nextLegs.length - 1] : null;
      let arrTime;
      
      if (lastLeg && lastLeg.type === "walk") {
        const updatedWalk = { ...lastLeg };
        updatedWalk.distM += Math.round(actualDistM);
        updatedWalk.minutes += mins;
        updatedWalk.toName = toName;
        updatedWalk.toStopId = seg.toStopId || null; 
        updatedWalk.arriveTime = new Date(updatedWalk.arriveTime.getTime() + mins * 60000);
        nextLegs[nextLegs.length - 1] = updatedWalk;
        arrTime = updatedWalk.arriveTime;
      } else {
        arrTime = new Date(currentTime.getTime() + mins * 60000);
        nextLegs.push({
          type: "walk", 
          fromStopId: seg.fromStopId || null, 
          toStopId: seg.toStopId || null,     
          fromName, toName, distM: Math.round(actualDistM),
          minutes: mins, departTime: new Date(currentTime), arriveTime: arrTime
        });
      }
      return await dfs(segIdx + 1, arrTime, nextLegs, rideCount);
    }

    const r = seg.r;

    // 【方向（bearing）判斷 —— 暫時淨係 DEBUG_MODE 出 log，唔影響實際
    // 搜尋/評分結果】檢查呢一程「上車站 → 落車站」嘅方向，係咪大致
    // 指向成個行程嘅終點，定係背道而馳（例如撞正路線嘅相反方向嗰個
    // bound、或者上錯／落錯站）。而家淨係做觀察性記錄，等有需要嗰陣
    // 先決定係咪要落實做扣分／淘汰，唔想未搞清楚會唔會有誤判（例如
    // 終點本身就喺路線嘅「必經迂迴」一段之後）就貿然影響搜尋結果。
    if (DEBUG_MODE && destination && seg.boardStopId && seg.alightStopId) {
      const boardLocForBearing = etaDb.stopList[seg.boardStopId]?.location;
      const alightLocForBearing = etaDb.stopList[seg.alightStopId]?.location;
      const destLocForBearing = { lat: destination.lat, lng: destination.lng };
      const rideBearing = bearingDeg(boardLocForBearing, alightLocForBearing);
      const goalBearing = bearingDeg(boardLocForBearing, destLocForBearing);
      const bearingDiff = bearingDiffDeg(rideBearing, goalBearing);
      if (bearingDiff !== null && bearingDiff > 90) {
        console.log(
          `[方向診斷] 路線=${r?.route || seg.routeId} co=${seg.primaryCo} ` +
          `上車站=${stopName(seg.boardStopId)} 落車站=${stopName(seg.alightStopId)}：` +
          `呢程方向≈${Math.round(rideBearing)}°，去終點方向≈${Math.round(goalBearing)}°，` +
          `相差 ${Math.round(bearingDiff)}°，疑似背道而馳（暫時淨係記錄，唔影響搜尋結果）`
        );
      }
    }

    // 補回落車所需緩衝時間，唔應該假設可以無縫接續下一班車
    const prevLegForSameStop = pathLegs.length > 0 ? pathLegs[pathLegs.length - 1] : null;
    if (prevLegForSameStop && prevLegForSameStop.type === "ride" && prevLegForSameStop.alightStopId === seg.boardStopId) {
      currentTime = new Date(currentTime.getTime() + SAME_STOP_ALIGHT_BUFFER_MIN * 60000);
    }

    // 【港鐵（自選行程專用）】港鐵嘅班次／車程／收費機制同巴士完全唔同
    // （冇 r.freq 時刻表、冇 GTFS stop_times、收費係站對站矩陣唔係逐站
    // 陣列），套用返上面一大段巴士專用嘅 freq／calibration／GTFS 邏輯冇
    // 意義，所以獨立處理，唔會行到落面嗰段巴士邏輯。
    if (seg.primaryCo === "mtr") {
      const stationCodes = r.mtrStationCodes || [];
      const boardCode = stationCodes[seg.boardIdx];
      const alightCode = stationCodes[seg.alightIdx];

      let boardEtas = [];
      try { boardEtas = await getEtasCached(seg.routeId, r, "mtr", seg.boardIdx); } catch (e) { boardEtas = []; }
      boardEtas = (boardEtas || []).filter(e => e.etaDate >= currentTime);

      let depEta;
      if (boardEtas.length) {
        depEta = boardEtas[0];
      } else {
        // 冇實時班次資料（例如指定咗未來時間，或者官方 API 一時攞唔到），
        // 港鐵日間班次密（大部分綫繁忙時間 2-4 分鐘、非繁忙 5-10 分鐘一班），
        // 用一個粗略嘅班距估算頂住，唔會令自選行程完全計唔到。
        const hour = currentTime.getHours();
        const isOffPeak = hour < 6 || hour >= 23;
        const roughHeadway = isOffPeak ? 8 : 4;
        depEta = { etaDate: new Date(currentTime.getTime() + roughHeadway * 60000), rmk: "推算班次", isFallback: true };
      }

      let durationMins = null;
      if (stationCodes.length) {
        try { durationMins = await getMtrSegmentMinutes(stationCodes, seg.boardIdx, seg.alightIdx, depEta.etaDate); }
        catch (e) { durationMins = null; }
      }
      if (durationMins === null) {
        // hketa 逐站數據唔完整時嘅啟發式：港鐵站與站之間（連埋停站時間）
        // 一般 2-3 分鐘，用站數粗略估算。
        durationMins = Math.max(1.5, (seg.alightIdx - seg.boardIdx) * 2.3);
      }

      const alightTime = new Date(depEta.etaDate.getTime() + durationMins * 60000);
      let fare = null;
      try { fare = getMtrFare(boardCode, alightCode); } catch (e) { fare = null; }

      const newLegs = pathLegs.slice();
      newLegs.push({
        type: "ride",
        routeId: seg.routeId,
        routeNo: r.route,
        co: "mtr",
        r,
        boardStopId: seg.boardStopId,
        alightStopId: seg.alightStopId,
        departTime: depEta.etaDate,
        arriveTime: alightTime,
        rmk: depEta.rmk || "",
        isSpeculative: !!depEta.isFallback,
        fare
      });

      return await dfs(segIdx + 1, alightTime, newLegs, rideCount + 1);
    }

    // 【輕鐵（自選行程專用）】輕鐧嘅班次／車程／收費機制都同巴士完全唔
    // 同,做法同上面港鐧 branch 一致,獨立處理,唔會行到落面巴士專用邏輯。
    if (seg.primaryCo === "lightrail") {
      const stationCodes = r.lrStationCodes || [];
      const boardCode = stationCodes[seg.boardIdx];
      const alightCode = stationCodes[seg.alightIdx];

      let boardEtas = [];
      try { boardEtas = await getEtasCached(seg.routeId, r, "lightrail", seg.boardIdx); } catch (e) { boardEtas = []; }
      boardEtas = (boardEtas || []).filter(e => e.etaDate >= currentTime);

      let depEta;
      if (boardEtas.length) {
        depEta = boardEtas[0];
      } else {
        // 【冇實時班次資料時嘅班距估算——同巴士嗰套 _computeFreqDeparture／
        // r.freq 機制完全用唔到】巴士嘅班距估算 (isRouteActiveAroundTime／
        // _computeFreqDeparture) 全部靠 routeFareList.min.json 提供嘅
        // r.freq（逐個時段一個班距）先做到，但輕鐧路線係
        // _buildLightRailRouteList() 由 light_rail_routes_and_stops.csv
        // 砌出嚟嘅虛擬路線，本身完全冇 r.freq 呢個欄位（CSV 根本冇呢類
        // 資料，亦搵唔到官方對應嘅班次時刻表格式），所以 _computeFreqDeparture
        // 對輕鐧嚟講必然傳返 null——唔係佢有 bug，而係佢設計上就冇資料
        // 可以估算輕鐧。以往呢度淨係用一個唔分時段嘅粗略「6/10 分鐧」
        // 二分法頂住，同輕鐧實際日夜班次疏密相差好遠嘅事實唔符（例如
        // 頭班/尾班車前後、深宵時段班次可以疏到 12-15 分鐧一班，但繁忙
        // 時間絕大部分路線都係 4-5 分鐧一班）。而家改用時段分段估算，
        // 貼近輕鐧公開嘅日常服務模式；如果之後攞到官方／觀測嘅逐線班距
        // 資料，呢度應該優先改用嗰份真實數據，而唔係再靠呢個粗略估算。
        const hour = currentTime.getHours();
        const minute = currentTime.getMinutes();
        const hm = hour * 60 + minute;
        let roughHeadway;
        if (hm < 5 * 60 || hm >= 24 * 60 + 30) {
          roughHeadway = 15; // 非服務時間之間嘅極端保底,理論上唔應該行到呢度
        } else if (hm < 6 * 60 + 30) {
          roughHeadway = 12; // 頭班車前後
        } else if (hm < 9 * 60 + 30) {
          roughHeadway = 5;  // 早繁忙時間
        } else if (hm < 16 * 60 + 30) {
          roughHeadway = 8;  // 日間非繁忙
        } else if (hm < 19 * 60 + 30) {
          roughHeadway = 5;  // 晚繁忙時間
        } else if (hm < 23 * 60) {
          roughHeadway = 8;  // 晚間非繁忙
        } else {
          roughHeadway = 12; // 尾班車前後
        }
        depEta = { etaDate: new Date(currentTime.getTime() + roughHeadway * 60000), rmk: "推算班次", isFallback: true };
      }

      let durationMins = null;
      if (stationCodes.length) {
        try { durationMins = await getLightRailSegmentMinutes(stationCodes, seg.boardIdx, seg.alightIdx, depEta.etaDate); }
        catch (e) { durationMins = null; }
      }
      if (durationMins === null) {
        // hketa 逐站數據唔完整時嘅啟發式：輕鐧站與站之間比重鐧密好多,
        // 一般 1-2 分鐧,用站數粗略估算。
        durationMins = Math.max(1, (seg.alightIdx - seg.boardIdx) * 1.6);
      }

      const alightTime = new Date(depEta.etaDate.getTime() + durationMins * 60000);
      let fare = null;
      try { fare = await getLightRailFare(boardCode, alightCode); } catch (e) { fare = null; }

      const newLegs = pathLegs.slice();
      newLegs.push({
        type: "ride",
        routeId: seg.routeId,
        routeNo: r.route,
        co: "lightrail",
        r,
        boardStopId: seg.boardStopId,
        alightStopId: seg.alightStopId,
        departTime: depEta.etaDate,
        arriveTime: alightTime,
        rmk: depEta.rmk || "",
        isSpeculative: !!depEta.isFallback,
        fare
      });

      return await dfs(segIdx + 1, alightTime, newLegs, rideCount + 1);
    }

    // 港鐵巴士
    if (seg.primaryCo === "mtrb") {
      let boardEtas = [];
      try { boardEtas = await getEtasCached(seg.routeId, r, "mtrb", seg.boardIdx); } catch (e) { boardEtas = []; }
      boardEtas = (boardEtas || []).filter(e => e.etaDate >= currentTime);

      let depEta;
      if (boardEtas.length) {
        depEta = boardEtas[0];
      } else {
        const hour = currentTime.getHours();
        const isRush = (hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 19);
        const roughHeadway = isRush ? 10 : 18;
        depEta = { etaDate: new Date(currentTime.getTime() + roughHeadway * 60000), rmk: "推算班次", isFallback: true };
      }

      let durationMins = null;
      try { durationMins = await estimateSegmentDuration(r, "mtrb", seg.boardIdx, seg.alightIdx, depEta.etaDate); }
      catch (e) { durationMins = null; }
      if (!Number.isFinite(durationMins)) {
        durationMins = Math.max(2, (seg.alightIdx - seg.boardIdx) * 2.5);
      }

      const alightTime = new Date(depEta.etaDate.getTime() + durationMins * 60000);
      let fare = null;
      try { fare = await getSegFare(r, "mtrb", seg.boardIdx, seg.alightIdx, depEta.etaDate); } catch (e) { fare = null; }

      const newLegs = pathLegs.slice();
      newLegs.push({
        type: "ride",
        routeId: seg.routeId,
        // 【港鐧巴士分支・行程結果顯示跟返母線】搵到嘅可能係母線底下嘅
        // 分支（例如 K73-1、K73-2），但顯示畀用戶睇嗰個路線編號應該
        // 統一跟返母線代號（例如 K73），唔應該將分支自己嘅 REFERENCE_ID
        // 直接攤出嚟,以免用戶睇到一個唔識嘅代號。
        routeNo: _mtrbMotherCode(r),
        co: "mtrb",
        r,
        boardStopId: seg.boardStopId,
        alightStopId: seg.alightStopId,
        departTime: depEta.etaDate,
        arriveTime: alightTime,
        rmk: depEta.rmk || "",
        isSpeculative: !!depEta.isFallback,
        fare
      });

      return await dfs(segIdx + 1, alightTime, newLegs, rideCount + 1);
    }

    // 轉車站群感知
    let etasBoard = [];
    const fetchPromises = [];
    for (const co of seg.companies) {
      const groupIdxs = _groupBoardIndices(r, co, seg.boardStopId);
      let idxsToQuery = groupIdxs;
      if (!idxsToQuery.length) {
        // 呢個公司嘅站序入面搵唔到同一轉車站群嘅站牌（例如根本冇
        // isSameTransferPoint 資料），退返舊有做法：淨係查
        // findEquivalentStopIdx() 解到嘅單一站序。
        let coIdx = seg.boardIdx;
        if (co !== seg.primaryCo) {
          const equivIdx = findEquivalentStopIdx(r, co, seg.boardStopId);
          if (equivIdx >= 0) coIdx = equivIdx;
        }
        idxsToQuery = [{ idx: coIdx, stopId: seg.boardStopId }];
      }
      for (const { idx, stopId } of idxsToQuery) {
        fetchPromises.push(
          getEtasCached(seg.routeId, r, co, idx)
            .then(list => (list || []).map(e => ({ ...e, _resolvedCo: co, _groupIdx: idx, _groupStopId: stopId })))
        );
      }
    }
    const results = await Promise.all(fetchPromises);
    results.forEach(list => { list.forEach(e => { etasBoard.push(e); }); });
    etasBoard.sort((a,b) => a.etaDate - b.etaDate);

    // 分站上車時間邏輯
    for (let e of etasBoard) {
      const isScheduled = e.isFallback || 
        String(e.rmk || "").toLowerCase().includes("預定") || 
        String(e.rmk || "").toLowerCase().includes("原定") || 
        String(e.rmk || "").toLowerCase().includes("scheduled");
      
      // 用返呢個班次實際查詢緊嘅站序（_groupIdx，可能嚟自轉車站群入面
      // 另一個站牌），唔再淨係死咬住 seg.boardIdx。
      const boardCoIdx = (typeof e._groupIdx === "number") ? e._groupIdx : seg.boardIdx;

      if (isScheduled && boardCoIdx > 0) {
        const stops = r.stops[e._resolvedCo] || r.stops[r.primaryCo];
        let mins = await getBaselineSegmentMinutes(e._resolvedCo, r.route, stops, 0, boardCoIdx, e.etaDate);
        if (mins === null) {
          mins = await estimateSegmentDuration(r, e._resolvedCo, 0, boardCoIdx, e.etaDate);
        }
        e.etaDate = new Date(e.etaDate.getTime() + Math.round(mins) * 60000);
        e.isTerminusAdjusted = true;
      }
    }
    etasBoard.sort((a,b) => a.etaDate - b.etaDate);

    let etasAlight = [];
    const alightPromises = seg.companies.map(co => {
      let alightCoIdx = seg.alightIdx;
      if (co !== seg.primaryCo) {
        const equivIdx = findEquivalentStopIdx(r, co, seg.alightStopId);
        if (equivIdx >= 0) alightCoIdx = equivIdx;
      }
      return getEtasCached(seg.routeId, r, co, alightCoIdx);
    });
    const alightResults = await Promise.all(alightPromises);
    alightResults.forEach((list, index) => {
      const co = seg.companies[index];
      list.forEach(e => { etasAlight.push({...e, _resolvedCo: co}); });
    });
    etasAlight.sort((a,b) => a.etaDate - b.etaDate);

    // === 下車站點預定時間 ===
    for (let e of etasAlight) {
      const isScheduled = e.isFallback || 
        String(e.rmk || "").toLowerCase().includes("預定") || 
        String(e.rmk || "").toLowerCase().includes("原定") || 
        String(e.rmk || "").toLowerCase().includes("scheduled");
      
      let alightCoIdx = seg.alightIdx;
      if (e._resolvedCo !== seg.primaryCo) {
        const equivIdx = findEquivalentStopIdx(r, e._resolvedCo, seg.alightStopId);
        if (equivIdx >= 0) alightCoIdx = equivIdx;
      }

      if (isScheduled && alightCoIdx > 0) {
        const stops = r.stops[e._resolvedCo] || r.stops[r.primaryCo];
        let mins = await getBaselineSegmentMinutes(e._resolvedCo, r.route, stops, 0, alightCoIdx, e.etaDate);
        if (mins === null) {
          mins = await estimateSegmentDuration(r, e._resolvedCo, 0, alightCoIdx, e.etaDate);
        }
        e.etaDate = new Date(e.etaDate.getTime() + Math.round(mins) * 60000);
        e.isTerminusAdjusted = true;
      }
    }
    etasAlight.sort((a,b) => a.etaDate - b.etaDate);

    let validDepEtas = etasBoard.filter(e => e.etaDate >= new Date(currentTime.getTime() - 60000)).slice(0, 5);

    if (validDepEtas.length === 0) {
      // 【聯營路線：兜底推算唔應該淨係睇 seg.primaryCo】用戶反映轉乘聯營
      // 路線（例如九巴／城巴、九巴／龍運同號聯營）嗰陣，明明另一間公司
      // 實際上仲有實時／排班資料，但以前呢一大段兜底推算（GTFS 靜態時間表、
      // 總站實時 ETA 反推、r.freq 班距估算）淨係死咬住 seg.primaryCo——
      // beam search 評估過程隨機揀落嚟做代表嗰一間公司，同「邊間公司實際
      // 上快啲有車」完全冇關係——搞到就算另一間公司其實已經有車就嚟到，
      // 都照樣顯示「推算班次」呢個保守估計，甚至因為淨係查嗰間冇資料嘅
      // 公司而誤判做冇服務。而家改為將以下邏輯包成 tryFallbackForCo(co)，
      // 逐間公司（seg.companies，唔止 primaryCo 一間）各自跑一次，然後
      // 將全部公司搵到嘅候選開車時間合埋一齊，揀最快嗰一班；只有全部
      // 公司都證實「唔應該有服務」，先至真係當呢一程搭唔到（return
      // null）。單一公司經營嘅路線（seg.companies 得一間）行為同以前
      // 完全一樣，唔會受影響。
      const NEARBY_WINDOW_MIN = 260;
      const fallbackCos = (Array.isArray(seg.companies) && seg.companies.length) ? seg.companies : [seg.primaryCo];

      async function tryFallbackForCo(co) {
        const localEtas = [];
        const staticSchedule = await getStopArrivalScheduleList(co, r.route, seg.boardStopId, currentTime, NEARBY_WINDOW_MIN);
        const futureTrips = staticSchedule.found
          ? staticSchedule.all
              .filter(t => t.etaDate >= new Date(currentTime.getTime() - 30000))
          : [];
        const recentPastTrips = staticSchedule.found
          ? staticSchedule.all.filter(t => t.etaDate < new Date(currentTime.getTime() - 30000))
          : [];

        if (staticSchedule.found && futureTrips.length > 0) {
          for (const t of futureTrips.slice(0, 5)) {
            localEtas.push({
              etaDate: t.etaDate,
              _resolvedCo: co,
              isFallback: true,
              isGeneric: false,
              rmk: "預定",
              _tripId: t.tripId
            });
          }
          return { hardFail: false, etas: localEtas };
        }

        const headwayResult = await isRouteCurrentlyInService(co, seg.r.route, currentTime);

        let activeFromEarlierStops = false;
        if (seg.boardIdx > 0) {
           try {
               const originEtas = await getEtasCached(seg.routeId, r, co, 0);
               // 【修正時光倒流】必須用 currentTime（呢一程實際上車嗰一刻，已計及
               // 之前所有程數嘅到達時間）嚟篩總站班次，唔可以用 now（成個搜尋開始
               // 時嘅原始時間）。用 now 會漏咗啲相對 now 嚟講「未來」但相對
               // currentTime（上一程實際到達之後）嚟講其實已經開走嘅班次，推算出
               // 嘅上車時間就會早過上一程到達時間，變成「未到就已經上到車」。
               const futureOriginEtas = (originEtas || [])
                 .filter(e => e.etaDate >= new Date(currentTime.getTime() - 30000));
               if (futureOriginEtas.length > 0) {
                   activeFromEarlierStops = true;

                   // 分站無自己 ETA 時，用總站實時時間推算
                   const stops0 = r.stops[co] || r.stops[r.primaryCo];
                   for (const oe of futureOriginEtas.slice(0, 5)) {
                       let segMins = await getBaselineSegmentMinutes(co, r.route, stops0, 0, seg.boardIdx, oe.etaDate);
                       if (segMins === null) {
                           segMins = await estimateSegmentDuration(r, co, 0, seg.boardIdx, oe.etaDate);
                       }
                       if (Number.isFinite(segMins)) {
                           localEtas.push({
                               etaDate: new Date(oe.etaDate.getTime() + Math.round(segMins) * 60000),
                               _resolvedCo: co,
                               isFallback: true,
                               isTerminusAdjusted: true,
                               isGeneric: false,
                               rmk: "預定"
                           });
                       }
                   }
               }
           } catch (err) {}
        }

        if (localEtas.length > 0) {
          // 已經靠總站實時 ETA＋分站車程估算成功推算出候選，冇必要再落去
          // 用更粗略嘅 headwayResult／scheduleFallback／r.freq 兜底估算。
          return { hardFail: false, etas: localEtas };
        }

        // GTFS 鄰近兩小時窗口內若曾經有班次（哪怕已經係過去），代表條路線今日確實仲有服務，
        // 只係啱啱好搭唔到跟腳嗰班，唔應該即刻當「完全冇服務」咁武斷咁判失敗。
        const hasNearbyGtfsEvidence = recentPastTrips.length > 0;

        const isCustomSecondaryLeg = treatSecondaryLegsRelaxed && rideCount > 0;

        // 【一般搜尋模式全程 freq 核實寬鬆】用戶反映：明明有直達車（例如
        // 6C／102 美孚 直達 衛理道），但因為第一程（rideCount === 0）冇
        // 即時 ETA 就被上面 headwayResult===false 嘅嚴格檢查直接判死，
        // 令成個直達方案完全消失，搜尋結果反而剩低一啲要轉車嘅方案。
        // 呢個問題原本只喺次程（rideCount > 0）先有寬鬆處理，而家擴展到
        // 第一程都可以用同一套核實機制：用 isRouteActiveAroundTime()
        // 核實返 r.freq 官方班次表本身係否認為呢個上車站、呢一刻（未來
        // 一小時窗口內）應該有服務——
        //   - 核實到「有」→ 當呢程寬鬆處理，落去用 scheduleFallback／
        //     estimateSegmentDuration 推算合理車程，唔會因為單一嘅實時
        //     ETA 缺口就令一條確實存在嘅直達路線完全消失。
        //   - 核實到「冇」→ 維持原有嚴格檢查，唔會靠估估一程根本唔存在
        //     嘅車。
        const freqVerifiedThisLeg = !isCustomSecondaryLeg &&
          isRouteActiveAroundTime(r, currentTime, seg.boardStopId, 60);
        const isRelaxableSecondaryLeg = isCustomSecondaryLeg || freqVerifiedThisLeg;

        if (headwayResult === false && !activeFromEarlierStops && !hasNearbyGtfsEvidence && !isRelaxableSecondaryLeg) {
          return { hardFail: true, etas: [] };
        }

        const pastLastKnownTripNarrowWindow = staticSchedule.found && futureTrips.length === 0 && recentPastTrips.length > 0;

        // 修正稀疏班次尾班車誤判
        let pastLastKnownTrip = pastLastKnownTripNarrowWindow;
        if (!pastLastKnownTrip) {
          const wholeDayStatus = await hasAnyRemainingTripToday(co, r.route, seg.boardStopId, currentTime);
          if (wholeDayStatus === false) {
            pastLastKnownTrip = true;
            if (DEBUG_MODE) console.log(`[尾班車判定] 路線=${r.route} co=${co} 上車站=${stopName(seg.boardStopId)}：窄窗口搵唔到紀錄，但全日掃描證實尾班車已開出`);
          }
        }

        // 無論係咪 segRelaxed，用嚟兜底嘅「預計」班次都必須先經 GTFS calendar
        // (calendar.txt / calendar_dates.txt) 確認條路線今日真係有服務，先至
        // 畀 scheduleFallback／落面嘅粗略估算生效，避免喺「今日完全冇服務」
        // 嘅路線度都推算一個唔存在嘅班次出嚟。
        const svcActiveToday = await isServiceActiveForRouteOnDate(co, r.route, currentTime);

        // 修正特別路線幽靈班次
        let kmbServiceTypeDiscontinued = false;
        if (co === "kmb" && r.service_type) {
          const liveCheck = isKmbServiceTypeLive(r.route, r.service_type);
          if (liveCheck === false) kmbServiceTypeDiscontinued = true;
        }

        // 修正「等車時間畀 terminus 車程 double count」
        let segMinsForFallback = 0;
        if (seg.boardIdx > 0) {
          const stopsForAdj = r.stops[co] || r.stops[r.primaryCo];
          let segMinsEstimate = await getBaselineSegmentMinutes(co, r.route, stopsForAdj, 0, seg.boardIdx, currentTime);
          if (segMinsEstimate === null) {
            segMinsEstimate = await estimateSegmentDuration(r, co, 0, seg.boardIdx, currentTime);
          }
          if (Number.isFinite(segMinsEstimate)) segMinsForFallback = segMinsEstimate;
        }
        const fallbackSearchTime = segMinsForFallback > 0
          ? new Date(currentTime.getTime() - Math.round(segMinsForFallback) * 60000)
          : currentTime;

        let fallbackTime = (pastLastKnownTrip && !isRelaxableSecondaryLeg) ? null : scheduleFallback(r, fallbackSearchTime, isCandidateLongHaul, seg.boardStopId);
        if (fallbackTime) {
          // 改善服務檢查
          if (svcActiveToday === false && !isRelaxableSecondaryLeg) {
            fallbackTime = null;
          }
          // service_type 已經證實停辦，屬於比 svcActiveToday 更直接嘅證據
          if (kmbServiceTypeDiscontinued) {
            fallbackTime = null;
          }
        }
        if (fallbackTime) {
          // fallbackTime 本身已經係「總站開出，加返返分站車程後岩岩好到達
          // currentTime」嘅總站開出時間——加返 segMinsForFallback（同上面
          // 搜尋基準時間扣走嗰個一致，避免重複估算兩次唔同嘅車程數值）就
          // 係這個分站嘅實際上車時間。
          const boardTime = segMinsForFallback > 0
            ? new Date(fallbackTime.getTime() + Math.round(segMinsForFallback) * 60000)
            : fallbackTime;
          localEtas.push({
            etaDate: boardTime,
            _resolvedCo: co,
            isFallback: true,
            isGeneric: true,
            isTerminusAdjusted: seg.boardIdx > 0,
            rmk: "預計"
          });
          return { hardFail: false, etas: localEtas };
        }

        if (!segRelaxed && !isRelaxableSecondaryLeg) {
          return { hardFail: true, etas: [] };
        }
        // 【指定時間出發／自選行程第一程之後嘅車程／一般搜尋經 freq 核實
        // 過寬鬆嘅次程，共用嘅最後一重兜底估算】呢度已經冇 scheduleFallback
        // 嘅具體班次時間，純粹靠粗略 headway 估算，所以更加要 respect GTFS
        // calendar 嘅「今日冇服務」判斷，否則喺明確冇服務嘅日子都會生成一個
        // 假嘅「預計」班次。
        if (!isRelaxableSecondaryLeg) {
          if (svcActiveToday === false) {
            return { hardFail: true, etas: [] };
          }
          if (pastLastKnownTrip) {
            return { hardFail: true, etas: [] };
          }
        }

        const lookaheadMin = isCandidateLongHaul ? 150 : 90;
        // 合併全部變體揀最快一班
        let segMinsForFreq = 0;
        if (seg.boardIdx > 0) {
          const stopsForFreqAdj = r.stops[co] || r.stops[r.primaryCo];
          let segMinsFreqEstimate = await getBaselineSegmentMinutes(co, r.route, stopsForFreqAdj, 0, seg.boardIdx, currentTime);
          if (segMinsFreqEstimate === null) {
            segMinsFreqEstimate = await estimateSegmentDuration(r, co, 0, seg.boardIdx, currentTime);
          }
          if (Number.isFinite(segMinsFreqEstimate)) segMinsForFreq = segMinsFreqEstimate;
        }
        const freqSearchTime = segMinsForFreq > 0
          ? new Date(currentTime.getTime() - Math.round(segMinsForFreq) * 60000)
          : currentTime;

        let freqResult = null;
        const allTablesForCandidate = _resolveAllEffectiveFreqTables(r, freqSearchTime, seg.boardStopId, co);
        if (allTablesForCandidate.length) {
          freqResult = _computeEarliestFreqDeparture(allTablesForCandidate, freqSearchTime, lookaheadMin);
        }
        if (!freqResult) {
          return { hardFail: true, etas: [] };
        }
        const freqBoardTime = segMinsForFreq > 0
          ? new Date(freqResult.etaDate.getTime() + Math.round(segMinsForFreq) * 60000)
          : freqResult.etaDate;
        localEtas.push({
          etaDate: freqBoardTime,
          _resolvedCo: co,
          isFallback: true,
          isGeneric: true,
          isTerminusAdjusted: seg.boardIdx > 0,
          rmk: "預計"
        });
        return { hardFail: false, etas: localEtas };
      }

      const perCoResults = await Promise.all(
        fallbackCos.map(co => tryFallbackForCo(co).catch(() => ({ hardFail: true, etas: [] })))
      );
      const mergedEtas = [];
      let allHardFail = true;
      for (const res of perCoResults) {
        if (res && res.etas && res.etas.length) mergedEtas.push(...res.etas);
        if (!res || !res.hardFail) allHardFail = false;
      }
      if (mergedEtas.length === 0) {
        // 全部公司都判「唔應該有服務」（hardFail），或者全部都靜靜雞
        // 冇搵到任何候選（理論上少見），先至真係當呢一程搭唔到。
        return null;
      }
      mergedEtas.sort((a, b) => a.etaDate - b.etaDate);
      validDepEtas.push(...mergedEtas.slice(0, 5));
    }

    const branches = [];
    for (const dep of validDepEtas) {
      // 轉車站群：用返呢班車實際查詢緊嘅站牌
      const boardIdxForDep = (typeof dep._groupIdx === "number") ? dep._groupIdx : seg.boardIdx;
      const boardStopIdForDep = dep._groupStopId || seg.boardStopId;

      // 【檢查循環線方向・站序 idx 先知得唔得】轉車站群配對（_groupIdx）
      // 可能撈到嘅係另一個「同名／同位置」但實際上喺路線站序上已經行埋
      // 咗（甚至喺落車站之後）嘅站牌——常見成因：循環線判斷
      // （isCircularRouteCo）淨係跟「co|route」呢個 key,冇分 serviceType,
      // 如果同一個路線編號底下有其他 serviceType 誤帶 "I" bound,就會
      // 累到成條路線（包括真正循環嗰個 serviceType）被錯判做「非循環
      // 線」，令 _groupBoardIndices() 誤用咗名／位置比對去撈第二個候選
      // 站牌,但嗰個候選其實企咗喺循環線嘅「回程」一段，同落車站嘅方向
      // 完全對唔上。呢度加一重硬性檢查：如果呢班車實際查詢緊嘅上車站序
      // idx 已經唔喺落車站 idx 之前（同一個站序陣列入面),代表沿正常行
      // 車方向根本去唔到落車站,呢個 dep 一律當唔可行,跳過,唔會夾硬計
      // 出一個好似「2 分鐧」咁嘅荒謬短車程。
      if (boardIdxForDep >= seg.alightIdx) continue;

      const segForDep = (boardIdxForDep !== seg.boardIdx || boardStopIdForDep !== seg.boardStopId)
        ? { ...seg, boardIdx: boardIdxForDep, boardStopId: boardStopIdForDep }
        : seg;

      let durationMins = null;

      // 【純 GTFS 排班 fallback】完全冇實時 ETA，靠 GTFS 靜態 trip 直接讀站到站時間
      if (dep._tripId && !dep.isGeneric) {
        durationMins = await getTripStopDurationByTripId(dep._tripId, boardStopIdForDep, seg.alightStopId);
      }

      // 【第一優先／第二優先】起點有實時 ETA：優先嘗試完整起訖 ETA 直接相減（第一優先，
      // 且落車時間須喺查詢後一小時內），唔得先退返用 GTFS 校準比率估算（第二優先，
      // 並確認當日喺 calendar.txt 服務時間以內）。
      if (durationMins === null && !dep.isFallback) {
        durationMins = await calibrateDurationOneSidedGeneral(
          r, segForDep, dep._resolvedCo, dep, currentTime, etasAlight,
          async (from, to) => {
            const stops = r.stops[dep._resolvedCo] || r.stops[r.primaryCo];
            const baseline = await getBaselineSegmentMinutes(dep._resolvedCo, r.route, stops, from, to, dep.etaDate);
            if (baseline !== null) return baseline;
            return await estimateSegmentDuration(r, dep._resolvedCo, from, to, dep.etaDate);
          },
          now
        );
      }

      if (durationMins === null) {
        const stops = r.stops[dep._resolvedCo] || r.stops[r.primaryCo];
        durationMins = await getBaselineSegmentMinutes(dep._resolvedCo, r.route, stops, boardIdxForDep, seg.alightIdx, dep.etaDate);
        if (durationMins === null) {
          durationMins = await estimateSegmentDuration(r, dep._resolvedCo, boardIdxForDep, seg.alightIdx, dep.etaDate);
        }
      }
      // 無論以上邊個估算方式，若最終唔係有限數字（例如 NaN／Infinity），
      // 一律 fallback 用最基本嘅啟發式估算，確保一定計到到站時間，唔會令結果顯示 --:--
      if (!Number.isFinite(durationMins)) {
        durationMins = await estimateSegmentDuration(r, dep._resolvedCo, boardIdxForDep, seg.alightIdx, dep.etaDate);
      }

      // 修正推算車程：用 dep.etaDate（呢一程實際嘅出發時間）揀返嗰個
      // 「星期＋鐘頭」專屬嘅觀測車程，令修正更貼近實際出發嗰一刻嘅路況
      const stopByStopStops = r.stops[dep._resolvedCo] || r.stops[r.primaryCo];
      const stopByStopSec = await sumTimeIntervalSecondsAsync(stopByStopStops, boardIdxForDep, seg.alightIdx, dep.etaDate);
      if (stopByStopSec !== null) {
        const stopByStopMin = stopByStopSec / 60;
        if (stopByStopMin > durationMins) {
          durationMins = stopByStopMin;
        }
      }

      const alightTime = new Date(dep.etaDate.getTime() + durationMins * 60000);
      const fare = await getSegFare(r, dep._resolvedCo, boardIdxForDep, seg.alightIdx, dep.etaDate);
      
      const newLegs = pathLegs.slice();
      newLegs.push({
        type: "ride",
        routeId: seg.routeId,
        routeNo: r.route,
        co: dep._resolvedCo,
        r,
        boardStopId: boardStopIdForDep,
        alightStopId: seg.alightStopId,
        departTime: dep.etaDate,
        arriveTime: alightTime,
        rmk: dep.rmk,
        isSpeculative: dep.isFallback,
        fare
      });

      const res = await dfs(segIdx + 1, alightTime, newLegs, rideCount + 1);
      if (res) branches.push(res);
    }

    if (branches.length === 0) return null;
    branches.sort((a,b) => a.arriveTime - b.arriveTime);
    return branches[0];
  }

  const initialTime = now;
  let finalResult = await dfs(0, initialTime, [], 0);
  
  if (!finalResult && !relaxed) {
    relaxed = true;
    finalResult = await dfs(0, initialTime, [], 0);
  }
  return finalResult;
}

// 利用 Geolocation API 獲取用戶位置並自動填入「起點」的按鈕邏輯
$("#gpsBtn").addEventListener("click", async () => {
  const gpsBtn = $("#gpsBtn");
  if (!navigator.geolocation) {
    alert("瀏覽器不支援 GPS 定位服務");
    return;
  }
  
  gpsBtn.disabled = true;
  gpsBtn.textContent = "定位中";
  
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      
      if (!etaDb) {
        gpsBtn.disabled = false;
        gpsBtn.textContent = "取用 GPS 為起點";
        alert("資料庫載入中，請稍後再試");
        return;
      }
      
      const near = nearbyStops(lat, lng, ENDPOINT_WALK_RADIUS_M);
      if (!near.length) {
        gpsBtn.disabled = false;
        gpsBtn.textContent = "取用 GPS 為起點";
        alert(`附近 ${ENDPOINT_WALK_RADIUS_M} 米內找不到任何巴士站`);
        return;
      }
      
      const closestStopId = near[0].stopId;
      const s = etaDb.stopList[closestStopId];
      // 以往呢度將 origin.lat/lng 都覆寫成「最近巴士站」嘅座標，
      // 導致 runBeamSearch 入面第一個 originAlts（{stopId, dist:0}）永遠假設用戶已經企喺
      // 嗰個站，完全冇補返「由用戶實際 GPS 位置，步行去嗰個上車站」呢一段步行時間／距離。
      // 而家保留返用戶嘅真實 GPS 經緯度，並唔再帶 stopId（等 runBeamSearch 用
      // nearbyStops() 對所有候選車站，計返準確嘅步行距離同時間，包括最近嗰個站）。
      origin = { stopId: null, name: "(s.name.zh || s.name.en)", lat: lat, lng: lng };
      originInput.value = "(s.name.zh || s.name.en)";
      flyStopMapTo(lat, lng);
      updatePickedMarkersOnMap();
      
      gpsBtn.disabled = false;
      gpsBtn.textContent = "定位成功";
      setTimeout(() => {
        gpsBtn.textContent = "取用 GPS 為起點";
      }, 3000);
    },
    (err) => {
      console.error(err);
      gpsBtn.disabled = false;
      gpsBtn.textContent = "取用 GPS 為起點";
      alert("請確保已開啟瀏覽器 GPS 權限");
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
});
