  const { treatSecondaryLegsRelaxed = false, skipTransferReopt = false } = opts;
  // 自選行程模式：轉車站係用戶自己逐程揀嘅，唔應該再被
  // _optimizeTransferPoints()（搵附近有冇更近嘅站對）靜雞雞覆寫。
  const segs = skipTransferReopt
    ? cand.segs.map(s => ({ ...s }))
    : _optimizeTransferPoints(cand.segs);

  const isLantauTrip = computeIsLantauTrip(origin || {name:"", lat:0, lng:0}, destination || {name:"", lat:0, lng:0});

  let estimatedCandidateTotalMin = 0;
  for (const seg of segs){
    if (seg.type === "walk"){
      estimatedCandidateTotalMin += Math.max(1, Math.ceil(seg.distM / WALK_SPEED_MPS / 60));
    } else if (seg.type === "ride"){
      estimatedCandidateTotalMin += await estimateSegmentDuration(seg.r, seg.primaryCo, seg.boardIdx, seg.alightIdx);
    }
  }
  const isCandidateLongHaul = estimatedCandidateTotalMin > LONG_TRIP_TOTAL_MIN_THRESHOLD;

  // 總行程時間上限統一 300 分鐘
  const MAX_TOTAL_TRIP_MINUTES = 300;

  async function dfs(segIdx, currentTime, pathLegs, rideCount) {
    if (segIdx >= segs.length) {
      if (rideCount === 0) return null;
      const totalMinutes = Math.round((currentTime.getTime() - now.getTime()) / 60000);
      if (totalMinutes > MAX_TOTAL_TRIP_MINUTES) {
        return null;
      }
      
      let hasMisusedAirportRoute = false;
            for (const leg of pathLegs) {
               if (leg.type === "ride" && /^[AE]/i.test(leg.routeNo) && !isLantauTrip) {
                   // 市區內來往，且該 A/E 線市區方向，不視為濫用/誤搭
                   const isCitybound = leg.r && !LANTAU_KEYWORDS.test(leg.r.dest?.zh || "");
                   if (!isCitybound) {
                       hasMisusedAirportRoute = true;
                   }
               }
            }
      const isSpeculative = pathLegs.some(leg => leg.type === "ride" && leg.isSpeculative);
      const rideLegsForFare = pathLegs.filter(leg => leg.type === "ride");
      const fareResult = await computeTripFare(rideLegsForFare);

      // 轉乘質性評分（100分為滿分，獨立於耗時，見 calculateTransferQualityScore()）。
      // 呢個分數淨係用嚟做結果嘅次要排序／展示參考，唔會用嚟淘汰候選，
      // 避免「避免過早將好方案淘汰」呢個原則被違反。
      let transferQualityScore = 100;
      try {
        const tripStartTime = pathLegs[0]?.departTime || now;
        const isDeepNightForPlan = tripStartTime.getHours() >= 0 && tripStartTime.getHours() < 6;
        const planDirectExists = hasDirectService(origin, destination, now);
        transferQualityScore = calculateTransferQualityScore(
          pathLegs, planDirectExists, isDeepNightForPlan,
          { lat: destination?.lat, lng: destination?.lng }
        );
      } catch (e) {
        // 質性評分只係輔助排序，計算失敗都唔應該累事令成個行程消失
        transferQualityScore = 100;
      }

      return {
        legs: pathLegs,
        transfers: rideCount - 1,
        totalMinutes,
        // 【搜尋一刻做統一起點】以前頭部顯示嘅時間範圍係直接攞
        // pathLegs[0].departTime——如果第一程係步行（即刻由搜尋一刻
        // 出發），呢個時間啱好等於 now；但如果第一程直接係搭車（唔
        // 使行去第二個站），pathLegs[0].departTime 就會係「班車實際
        // 開車嗰一刻」，跳過咗喺原站等車嗰段時間，變成兩類方案嘅顯示
        // 起點基準不一致，睇落好似「行遠啲去搭車」嗰個方案無端端著咗
        // 數（總用時計法一致，純粹顯示唔一致，會令人誤會計算方法本
        // 身唔公平）。呢度統一記低真正嘅搜尋起點 now，等顯示同
        // totalMinutes 用返同一個基準。
        searchStartTime: now,
        arriveTime: currentTime,
        hasMisusedAirportRoute,
        hasImplausibleWait: false,
        isCircuitous: cand.isCircuitous,
        hasRedundantHop: cand.hasRedundantHop,
        isSpeculative,
        totalFare: fareResult.totalFare,
        fareDiscount: fareResult.discount,
        transferQualityScore
      };
    }

    const seg = segs[segIdx];

    // 【連續港鐵轉乘・無 walk leg 時補返室內步行時間】
    // 某些 beam-search 路徑會因為兩個 MTR leg 直接共用同一個轉乘站節點，
    // _optimizeTransferPoints() 最後冇保留獨立 walk leg。若直接進入下一程 MTR，
    // currentTime 就會零步行地無縫接續，完全漏掉站內月台→月台步行時間。
    // 只有「上一程係 MTR + 今程係 MTR + 中間冇 walk leg」先補；
    // 已經有 walk leg 嘅情況由下面 walk branch 正常用室內 API 計算，避免 double count。
    if (seg.type === "ride" && seg.primaryCo === "mtr") {
      const prevRideForIndoor = pathLegs.length ? pathLegs[pathLegs.length - 1] : null;
      if (prevRideForIndoor && prevRideForIndoor.type === "ride" && prevRideForIndoor.co === "mtr" &&
          prevRideForIndoor.alightStopId && seg.boardStopId) {
        try {
          const indoorTransferM = await getMtrIndoorTransferM(prevRideForIndoor.alightStopId, seg.boardStopId);
          if (indoorTransferM !== null) {
            const indoorTransferMin = Math.max(1, Math.ceil(indoorTransferM / WALK_SPEED_MPS / 60));
            currentTime = new Date(currentTime.getTime() + indoorTransferMin * 60000);
          }
        } catch (e) {
          // 室內 API 失敗時維持原有行為，唔阻住今程繼續搜尋。
        }
      }
    }

    // 自選行程模式：第一程之後（rideCount > 0）嘅車程一律當寬鬆模式處理，
    // 冇實時 ETA 時改為靠 GTFS 估算是否有服務，唔會因為冇「鄰近實時班次」
    const segRelaxed = relaxed || (treatSecondaryLegsRelaxed && rideCount > 0);

    if (seg.type === "walk") {
      let mins = Math.max(1, Math.ceil(seg.distM / WALK_SPEED_MPS / 60));
      let actualDistM = seg.distM;

      // 連續港鐵車程之間站內轉乘
      const prevPathLeg = pathLegs.length ? pathLegs[pathLegs.length - 1] : null;
      const nextSeg = segIdx + 1 < segs.length ? segs[segIdx + 1] : null;
      const isRailToRailInterchange = !!(
        seg.fromStopId && seg.toStopId &&
        prevPathLeg && prevPathLeg.type === "ride" && isRailCo(prevPathLeg.co) &&
        nextSeg && nextSeg.type === "ride" && isRailCo(nextSeg.primaryCo)
      );

      let handledAsRailIndoorTransfer = false;
      if (isRailToRailInterchange) {
        const indoorTransferM = await getMtrIndoorTransferM(seg.fromStopId, seg.toStopId);
        if (indoorTransferM !== null) {
          actualDistM = indoorTransferM;
          mins = Math.max(1, Math.ceil(actualDistM / WALK_SPEED_MPS / 60));
          handledAsRailIndoorTransfer = true;
        }
      }

      if (!handledAsRailIndoorTransfer && seg.distM > 100) {
        let fromLoc = null;
        let toLoc = null;
        let cacheKey = null;

        if (seg.fromStopId && seg.toStopId) {
          fromLoc = etaDb.stopList[seg.fromStopId]?.location;
          toLoc = etaDb.stopList[seg.toStopId]?.location;
          cacheKey = `${seg.fromStopId}_${seg.toStopId}`;
        } else if (seg.fromStopId) {
          fromLoc = etaDb.stopList[seg.fromStopId]?.location;
          toLoc = { lat: seg.toLat, lng: seg.toLng };
          cacheKey = `${seg.fromStopId}_${seg.toLat.toFixed(5)},${seg.toLng.toFixed(5)}`;
        } else if (seg.toStopId) {
          fromLoc = { lat: seg.fromLat, lng: seg.fromLng };
          toLoc = etaDb.stopList[seg.toStopId]?.location;
          cacheKey = `${seg.fromLat.toFixed(5)},${seg.fromLng.toFixed(5)}_${seg.toStopId}`;
        }

        if (fromLoc && toLoc && cacheKey) {
          const realWalk = await getRealWalkingDataCached(cacheKey, fromLoc, toLoc);
          if (realWalk.success) {
            // 【自選行程唔應該因為步行距離就成程「無法計算」】以下呢兩重步行
            // 距離把關（真實/直線比例 >3倍、同真實距離上限 walkCapM*1.3）
            // 原意係喺自動搜尋（beam search）度過濾明顯唔合理嘅候選，避免
            // 顯示「行成公里先接到車」呢類方案。但自選行程（treatSecondaryLegsRelaxed）
            // 係用戶自己揀晒每一程嘅路線／上落車站，佢哋好清楚自己想用邊個
            // 轉車點（例如天水圍港鐧站去輕鐵站，因為輕鐵站座標本身係靠
            // exits.mtr.json 撞名嘅後備估算，未必精準，真實行人路網距離可能
            // 被高估），一旦撞正呢重上限就會令成個組合完全顯示唔到「無法
            // 計算該行程」，用戶連個步行時間都睇唔到。所以自選行程唔再
            // 因為呢兩重檢查而 return null，淨係照用返行人路網嘅真實距離／
            // 車程計落去，等用戶自己判斷是否接受呢段步行。
            if (!treatSecondaryLegsRelaxed && (realWalk.distM / seg.distM) > 3.0) {
              return null; 
            }

            // 【地政總署室內步行路網補充】realWalk.distM 淨係「出口座標」去
            // 目的地嗰段戶外距離，完全冇計落月台經閘機、通道行到出口嗰段
            // 室內距離。呢度分別為 seg 兩端（如果係港鐵站）加返呢一段補充。
            let indoorSupplementM = 0;
            if (seg.fromStopId && seg.fromStopId.startsWith("MTR-")) {
              indoorSupplementM += await getMtrIndoorSupplementM(seg.fromStopId, fromLoc);
            }
            if (seg.toStopId && seg.toStopId.startsWith("MTR-")) {
              indoorSupplementM += await getMtrIndoorSupplementM(seg.toStopId, toLoc);
            }

            actualDistM = realWalk.distM + indoorSupplementM;
            mins = Math.max(1, Math.ceil(actualDistM / WALK_SPEED_MPS / 60));

            const isOriginWalk = rideCount === 0;
            const hasMoreRideAhead = segs.slice(segIdx + 1).some(s => s.type === "ride");
            let walkCapM;
            if (isOriginWalk) {
              walkCapM = getRegionWalkLimit(origin?.lat, origin?.lng, origin?.name);
            } else if (!hasMoreRideAhead) {
              walkCapM = getRegionWalkLimit(destination?.lat, destination?.lng, destination?.name);
            } else {
              walkCapM = MAX_TRANSFER_WALK_M;
            }
            if (!treatSecondaryLegsRelaxed && actualDistM > walkCapM * 1.3) {
              return null;
            }
          }
        }
      }

      const fromName = seg.fromStopId ? stopName(seg.fromStopId) : (seg.fromName || origin?.name || "起點");
      const toName = seg.toStopId ? stopName(seg.toStopId) : (seg.toName || destination?.name || "終點");
      
      let nextLegs = pathLegs.slice();
      const lastLeg = nextLegs.length > 0 ? nextLegs[nextLegs.length - 1] : null;
      let arrTime;
      
      if (lastLeg && lastLeg.type === "walk") {
        const updatedWalk = { ...lastLeg };
        updatedWalk.distM += Math.round(actualDistM);
        updatedWalk.minutes += mins;
        updatedWalk.toName = toName;
        updatedWalk.toStopId = seg.toStopId || null; 
        updatedWalk.arriveTime = new Date(updatedWalk.arriveTime.getTime() + mins * 60000);
        nextLegs[nextLegs.length - 1] = updatedWalk;
        arrTime = updatedWalk.arriveTime;
      } else {
        arrTime = new Date(currentTime.getTime() + mins * 60000);
        nextLegs.push({
          type: "walk", 
          fromStopId: seg.fromStopId || null, 
          toStopId: seg.toStopId || null,     
          fromName, toName, distM: Math.round(actualDistM),
          minutes: mins, departTime: new Date(currentTime), arriveTime: arrTime
        });
      }
      return await dfs(segIdx + 1, arrTime, nextLegs, rideCount);
    }

    const r = seg.r;

    // 【方向（bearing）判斷 —— 暫時淨係 DEBUG_MODE 出 log，唔影響實際
    // 搜尋/評分結果】檢查呢一程「上車站 → 落車站」嘅方向，係咪大致
    // 指向成個行程嘅終點，定係背道而馳（例如撞正路線嘅相反方向嗰個
    // bound、或者上錯／落錯站）。而家淨係做觀察性記錄，等有需要嗰陣
    // 先決定係咪要落實做扣分／淘汰，唔想未搞清楚會唔會有誤判（例如
    // 終點本身就喺路線嘅「必經迂迴」一段之後）就貿然影響搜尋結果。
    if (DEBUG_MODE && destination && seg.boardStopId && seg.alightStopId) {
      const boardLocForBearing = etaDb.stopList[seg.boardStopId]?.location;
      const alightLocForBearing = etaDb.stopList[seg.alightStopId]?.location;
      const destLocForBearing = { lat: destination.lat, lng: destination.lng };
      const rideBearing = bearingDeg(boardLocForBearing, alightLocForBearing);
      const goalBearing = bearingDeg(boardLocForBearing, destLocForBearing);
      const bearingDiff = bearingDiffDeg(rideBearing, goalBearing);
      if (bearingDiff !== null && bearingDiff > 90) {
        console.log(
          `[方向診斷] 路線=${r?.route || seg.routeId} co=${seg.primaryCo} ` +
          `上車站=${stopName(seg.boardStopId)} 落車站=${stopName(seg.alightStopId)}：` +
          `呢程方向≈${Math.round(rideBearing)}°，去終點方向≈${Math.round(goalBearing)}°，` +
          `相差 ${Math.round(bearingDiff)}°，疑似背道而馳（暫時淨係記錄，唔影響搜尋結果）`
        );
      }
    }

    // 補回落車所需緩衝時間，唔應該假設可以無縫接續下一班車
    const prevLegForSameStop = pathLegs.length > 0 ? pathLegs[pathLegs.length - 1] : null;
    if (prevLegForSameStop && prevLegForSameStop.type === "ride" && prevLegForSameStop.alightStopId === seg.boardStopId) {
      currentTime = new Date(currentTime.getTime() + SAME_STOP_ALIGHT_BUFFER_MIN * 60000);
    }

    // 【港鐵（自選行程專用）】港鐵嘅班次／車程／收費機制同巴士完全唔同
    // （冇 r.freq 時刻表、冇 GTFS stop_times、收費係站對站矩陣唔係逐站
    // 陣列），套用返上面一大段巴士專用嘅 freq／calibration／GTFS 邏輯冇
    // 意義，所以獨立處理，唔會行到落面嗰段巴士邏輯。
    if (seg.primaryCo === "mtr") {
      const stationCodes = r.mtrStationCodes || [];
      const boardCode = stationCodes[seg.boardIdx];
      const alightCode = stationCodes[seg.alightIdx];
      // 【漏網之魚：查詢頭/尾班車窗口一直用錯咗「終點站」】
      // first_trains/last_trains 呢份官方資料係以「成程車實際去到嘅終點站」
      // （例如 TML 方向嘅屯門 TUM）做 key，唔係以呢一程 leg 自己上/落嗰
      // 個站做 key（見上面函數頂部註解，鑽石山 DIH 去 ADM／AIR 頭/尾班
      // 車唔同就係呢個原理）。但以前呢度傳落 getMtrServiceWindowMinutes()
      // 嘅 towardsCode 用嘅係 alightCode（即係呢個 leg 自己落車嗰個站，
      // 好多時只係中途站，例如馬鞍山→天水圍呢程 leg，實際整程車係
      // 「往屯門」，落車站天水圍先至唔係終點），令精確 first_trains/
      // last_trains entry 幾乎撞唔中，跌落用返成個站籠統 opening/closing
      // 做保底；如果連呢個保底都喺資料入面缺咗（例如個別站冇
      // opening/closing 紀錄），就成個 mtrWindow 變返 null，完全冇做到
      // 服務時間驗證，等「推算班次」可以噏出深宵 2、3 點都仲有車嘅荒謬
      // 時間出嚟。而家改用返成條路線嘅真正終點站（stationCodes 陣列最
      // 尾個站）做 towardsCode，先啱撞中官方精確嘅頭/尾班車紀錄。
      const routeTerminusCode = stationCodes.length ? stationCodes[stationCodes.length - 1] : alightCode;

      // 用官方 mtrData 頭/尾班車時刻計返「boardCode 去（成條路線嘅）終點站
      // 呢個方向」嘅今日服務窗口(連 r.mtrLineCode 一齊傳落去核實路線一致,
      // 見函數頂部註解嘅鑽石山 DIH 例子)。呢個窗口下面會用兩次：（1）
      // 冇實時班次資料時,喺噏個「推算班次」出嚟之前先核實依家呢個時
      // 間到底有冇車;（2）唔理最終 depEta 係嚟自實時 API 定係推算,都
      // 再驗證一次揀到嗰個開車時間有冇超出呢個官方範圍——後者係為咗
      // 防止實時 API 一時傳返過時／唔合理嘅資料。
      const mtrWindow = getMtrServiceWindowMinutes(boardCode, routeTerminusCode, r.mtrLineCode);
      // 【安全網：連 opening/closing 呢個保底都冇嘅站，唔可以當 24 小時通宵】
      // getMtrServiceWindowMinutes() 撞唔中精確 first_trains/last_trains
      // entry、又冇 station-level opening/closing 紀錄嗰陣會傳返 null，
      // 上面兩處服務時間驗證見到 null 就乜都唔做，等於預設咗「成日 24
      // 小時都有車」，先會出現 02:01 都仲有「推算班次」呢種荒謬結果。
      // 而家補多一個籠統嘅港鐵服務時間安全網（05:30 頭班車、01:15 尾班
      // 車前後，比實際任何一條線都寬鬆少少做緩衝），凡係搵唔到站專屬
      // 資料先至用呢個做保底，避免完全冇驗證。
      const effectiveMtrWindow = mtrWindow || {
        firstMin: 90,   // 05:30（以凌晨 4:00 做服務日分界）
        lastMin: 1275,  // 翌日 01:15
        toServiceMin: (hhmm) => {
          const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || "").trim());
          if (!m) return null;
          const raw = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
          return ((raw - 4 * 60) + 1440) % 1440;
        },
        exact: false
      };


      let boardEtas = [];
      try { boardEtas = await getEtasCached(seg.routeId, r, "mtr", seg.boardIdx); } catch (e) { boardEtas = []; }
      boardEtas = (boardEtas || []).filter(e => e.etaDate >= currentTime);

      let depEta;
      if (boardEtas.length) {
        depEta = boardEtas[0];
      } else {
        // 冇實時班次資料（例如指定咗未來時間，或者官方 API 一時攞唔到），
        // 港鐧日間班次密（大部分綫繁忙時間 2-4 分鐧、非繁忙 5-10 分鐧一
        // 班），用一個粗略嘅班距估算頂住，唔會令自選行程完全計唔到。

        // 【用官方頭/尾班車時刻核實「呢個時間到底有冇車」】以往呢度冇做
        // 呢個判斷——就算指定咗一個港鐧已經收咗站嘅深宵時間,都照樣噏個
        // 「推算班次」出嚟,變相假設成日 24 小時都有車搭。而家先查返
        // mtrWindow,分開兩種「跌出窗口」嘅情況處理,唔可以一概當「冇
        // 車」拒絕：
        // (1) 依家時間已經過咗尾班車——今日真係冇車搭,拒絕呢條候選；
        // (2) 依家時間仲未到頭班車——唔係冇車,淨係「服務仲未開始」,應
        //     該等到頭班車先上車,直接用官方頭班車嗰個實際時間做
        //     depEta,唔應該拒絕成條候選,亦唔應該再用底下嗰個
        //     roughHeadway 估算（嗰個估算會噏一個仲未到頭班車嘅假時
        //     間出嚟,例如頭班車05:57但查05:37,估算會錯誤噏返05:41）。
        if (effectiveMtrWindow) {
          const h = currentTime.getHours();
          const min = currentTime.getMinutes();
          const nowServiceMin = effectiveMtrWindow.toServiceMin(
            String(h).padStart(2, "0") + ":" + String(min).padStart(2, "0")
          );
          if (nowServiceMin > effectiveMtrWindow.lastMin) {
            return null;
          }
          if (nowServiceMin < effectiveMtrWindow.firstMin) {
            const rawFirstMinutesOfDay = (effectiveMtrWindow.firstMin + 4 * 60) % 1440;
            const firstDepDate = new Date(currentTime);
            firstDepDate.setHours(Math.floor(rawFirstMinutesOfDay / 60), rawFirstMinutesOfDay % 60, 0, 0);
            depEta = { etaDate: firstDepDate, rmk: "頭班車", isFallback: true };
          }
        }

        if (!depEta) {
          const hour = currentTime.getHours();
          const isOffPeak = hour < 6 || hour >= 23;
          const roughHeadway = isOffPeak ? 8 : 4;
          depEta = { etaDate: new Date(currentTime.getTime() + roughHeadway * 60000), rmk: "推算班次", isFallback: true };
        }
      }

      // 【驗證所揀時間有冇超出官方頭/尾班車範圍】唔理 depEta 嚟自實時
      // API 定係上面嗰個粗略估算,都用 mtrWindow 再驗證一次——實時 API
      // 理應唔會傳返服務時間以外嘅班次,但一時故障／傳返過時快取資料嗰
      // 種邊緣情況都要頂到,唔應該畀個已知不合理嘅開車時間流入最終行
      // 程結果。
      if (effectiveMtrWindow) {
        const depServiceMin = effectiveMtrWindow.toServiceMin(
          String(depEta.etaDate.getHours()).padStart(2, "0") + ":" + String(depEta.etaDate.getMinutes()).padStart(2, "0")
        );
        if (depServiceMin < effectiveMtrWindow.firstMin || depServiceMin > effectiveMtrWindow.lastMin) {
          return null;
        }
      }

      let durationMins = null;
      if (stationCodes.length) {
        try { durationMins = await getMtrSegmentMinutes(stationCodes, seg.boardIdx, seg.alightIdx, depEta.etaDate); }
        catch (e) { durationMins = null; }
      }
      if (durationMins === null) {
        // hketa 逐站數據唔完整時嘅啟發式：港鐵站與站之間（連埋停站時間）
        // 一般 2-3 分鐘，用站數粗略估算。
        durationMins = Math.max(1.5, (seg.alightIdx - seg.boardIdx) * 2.3);
      }

      const alightTime = new Date(depEta.etaDate.getTime() + durationMins * 60000);
      let fare = null;
      try { fare = getMtrFare(boardCode, alightCode); } catch (e) { fare = null; }

      const newLegs = pathLegs.slice();
      newLegs.push({
        type: "ride",
        routeId: seg.routeId,
        routeNo: r.route,
        co: "mtr",
        r,
        boardStopId: seg.boardStopId,
        alightStopId: seg.alightStopId,
        departTime: depEta.etaDate,
        arriveTime: alightTime,
        rmk: depEta.rmk || "",
        isSpeculative: !!depEta.isFallback,
        fare
      });

      return await dfs(segIdx + 1, alightTime, newLegs, rideCount + 1);
    }

    // 【輕鐵（自選行程專用）】輕鐧嘅班次／車程／收費機制都同巴士完全唔
    // 同,做法同上面港鐧 branch 一致,獨立處理,唔會行到落面巴士專用邏輯。
    if (seg.primaryCo === "lightrail") {
      const stationCodes = r.lrStationCodes || [];
      const boardCode = stationCodes[seg.boardIdx];
      const alightCode = stationCodes[seg.alightIdx];

      // 用官方 lrtData 頭/尾班車時刻計返「boardCode 去 alightCode 呢個
      // 方向」嘅今日服務窗口。下面用兩次：（1）冇實時班次資料時,喺噏
      // 個「推算班次」出嚟之前先核實依家呢個時間到底有冇車;（2）唔理
      // 最終 depEta 係嚟自實時 API 定係推算,都再驗證一次揀到嗰個開車
      // 時間有冇超出呢個官方範圍。
      const lrWindow = getLrServiceWindowMinutes(boardCode, alightCode);
      // 【安全網：同重鐵一樣，搵唔到官方頭/尾班車資料嗰陣唔可以當 24
      // 小時通宵】以前呢度淨係喺 `if (lrWindow) {...}` 先做服務時間驗證，
      // 如果 getLrServiceWindowMinutes() 撞唔中精確 first_trains/
      // last_trains、又冇夠晒全部目的地嘅 min/max 保底（例如個別站資料
      // 缺漏），就會傳返 null，令呢度同底下嗰個「驗證所揀時間有冇超出
      // 官方頭/尾班車範圍」都齊齊被跳過，等於預設咗成日 24 小時都有輕鐵
      // 可搭，先會出現深宵都仲噏得出「推算班次」呢種漏網之魚。而家仿照
      // 重鐵嗰邊做法，補多一個籠統嘅輕鐵服務時間安全網（05:30 頭班車、
      // 00:30 尾班車前後，比實際任何一條輕鐵路線都寬鬆少少做緩衝），凡
      // 係搵唔到站專屬資料先至用呢個做保底，避免完全冇驗證。
      const effectiveLrWindow = lrWindow || {
        firstMin: 90,   // 05:30（以凌晨 4:00 做服務日分界）
        lastMin: 1230,  // 翌日 00:30
        toServiceMin: (hhmm) => {
          const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || "").trim());
          if (!m) return null;
          const raw = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
          return ((raw - 4 * 60) + 1440) % 1440;
        },
        exact: false
      };

      let boardEtas = [];
      try { boardEtas = await getEtasCached(seg.routeId, r, "lightrail", seg.boardIdx); } catch (e) { boardEtas = []; }
      boardEtas = (boardEtas || []).filter(e => e.etaDate >= currentTime);

      let depEta;
      if (boardEtas.length) {
        depEta = boardEtas[0];
      } else {
        // 【冇實時班次資料時嘅班距估算——同巴士嗰套 _computeFreqDeparture／
        // r.freq 機制完全用唔到】巴士嘅班距估算 (isRouteActiveAroundTime／
        // _computeFreqDeparture) 全部靠 routeFareList.min.json 提供嘅
        // r.freq（逐個時段一個班距）先做到，但輕鐧路線係
        // _buildLightRailRouteList() 由 light_rail_routes_and_stops.csv
        // 砌出嚟嘅虛擬路線，本身完全冇 r.freq 呢個欄位（CSV 根本冇呢類
        // 資料，亦搵唔到官方對應嘅班次時刻表格式），所以 _computeFreqDeparture
        // 對輕鐧嚟講必然傳返 null——唔係佢有 bug，而係佢設計上就冇資料
        // 可以估算輕鐧。以往呢度淨係用一個唔分時段嘅粗略「6/10 分鐧」
        // 二分法頂住，同輕鐧實際日夜班次疏密相差好遠嘅事實唔符（例如
        // 頭班/尾班車前後、深宵時段班次可以疏到 12-15 分鐧一班，但繁忙
        // 時間絕大部分路線都係 4-5 分鐧一班）。而家改用時段分段估算，
        // 貼近輕鐧公開嘅日常服務模式；如果之後攞到官方／觀測嘅逐線班距
        // 資料，呢度應該優先改用嗰份真實數據，而唔係再靠呢個粗略估算。
        const hour = currentTime.getHours();
        const minute = currentTime.getMinutes();
        const hm = hour * 60 + minute;

        // 【用官方頭/尾班車時刻表核實「呢個時間到底有冇車」】以往呢度
        // 完全冇做呢個判斷——唔理幾夜／幾早,都照樣用 roughHeadway 噏一個
        // 「推算班次」出嚟,等於預設成日 24 小時都有車搭,同輕鐧實際收咗
        // 車就係冇車呢個事實唔符。而家先查返 lrWindow,分開兩種「跌出
        // 窗口」嘅情況處理,唔可以一概當「冇車」拒絕：
        // (1) 依家時間已經過咗尾班車——今日真係冇車搭,拒絕呢條候選；
        // (2) 依家時間仲未到頭班車——唔係冇車,淨係「服務仲未開始」,應
        //     該等到頭班車先上車,直接用官方頭班車嗰個實際時間做
        //     depEta,唔應該拒絕成條候選,亦唔應該再用底下嗰套鐘數分
        //     段估算（嗰個估算會噏一個仲未到頭班車嘅假時間出嚟）。
        let lrDepEta = null;
        if (effectiveLrWindow) {
          const nowServiceMin = effectiveLrWindow.toServiceMin(
            String(hour).padStart(2, "0") + ":" + String(minute).padStart(2, "0")
          );
          if (nowServiceMin > effectiveLrWindow.lastMin) {
            return null;
          }
          if (nowServiceMin < effectiveLrWindow.firstMin) {
            const rawFirstMinutesOfDay = (effectiveLrWindow.firstMin + 4 * 60) % 1440;
            const firstDepDate = new Date(currentTime);
            firstDepDate.setHours(Math.floor(rawFirstMinutesOfDay / 60), rawFirstMinutesOfDay % 60, 0, 0);
            lrDepEta = { etaDate: firstDepDate, rmk: "頭班車", isFallback: true };
          }
        }
        if (lrDepEta) {
          depEta = lrDepEta;
        } else {
        let roughHeadway;
        if (hm < 5 * 60 || hm >= 24 * 60 + 30) {
          roughHeadway = 15; // 非服務時間之間嘅極端保底,理論上唔應該行到呢度
        } else if (hm < 6 * 60 + 30) {
          roughHeadway = 12; // 頭班車前後
        } else if (hm < 9 * 60 + 30) {
          roughHeadway = 5;  // 早繁忙時間
        } else if (hm < 16 * 60 + 30) {
          roughHeadway = 8;  // 日間非繁忙
        } else if (hm < 19 * 60 + 30) {
          roughHeadway = 5;  // 晚繁忙時間
        } else if (hm < 23 * 60) {
          roughHeadway = 8;  // 晚間非繁忙
        } else {
          roughHeadway = 12; // 尾班車前後
        }
        depEta = { etaDate: new Date(currentTime.getTime() + roughHeadway * 60000), rmk: "推算班次", isFallback: true };
        }
      }

      // 【驗證所揀時間有冇超出官方頭/尾班車範圍】唔理 depEta 嚟自實時
      // API 定係上面嗰個粗略估算,都用 lrWindow 再驗證一次——實時 API
      // 理應唔會傳返服務時間以外嘅班次,但一時故障／傳返過時快取資料嗰
      // 種邊緣情況都要頂到,唔應該畀個已知不合理嘅開車時間流入最終行
      // 程結果。
      if (effectiveLrWindow) {
        const depServiceMin = effectiveLrWindow.toServiceMin(
          String(depEta.etaDate.getHours()).padStart(2, "0") + ":" + String(depEta.etaDate.getMinutes()).padStart(2, "0")
        );
        if (depServiceMin < effectiveLrWindow.firstMin || depServiceMin > effectiveLrWindow.lastMin) {
          return null;
        }
      }

      let durationMins = null;
      if (stationCodes.length) {
        try { durationMins = await getLightRailSegmentMinutes(stationCodes, seg.boardIdx, seg.alightIdx, depEta.etaDate); }
        catch (e) { durationMins = null; }
      }
      if (durationMins === null) {
        // hketa 逐站數據唔完整時嘅啟發式：輕鐧站與站之間比重鐧密好多,
        // 一般 1-2 分鐧,用站數粗略估算。
        durationMins = Math.max(1, (seg.alightIdx - seg.boardIdx) * 1.6);
      }

      const alightTime = new Date(depEta.etaDate.getTime() + durationMins * 60000);
      let fare = null;
      try { fare = await getLightRailFare(boardCode, alightCode); } catch (e) { fare = null; }

      const newLegs = pathLegs.slice();
      newLegs.push({
        type: "ride",
        routeId: seg.routeId,
        routeNo: r.route,
        co: "lightrail",
        r,
        boardStopId: seg.boardStopId,
        alightStopId: seg.alightStopId,
        departTime: depEta.etaDate,
        arriveTime: alightTime,
        rmk: depEta.rmk || "",
        isSpeculative: !!depEta.isFallback,
        fare
      });

      return await dfs(segIdx + 1, alightTime, newLegs, rideCount + 1);
    }

    // 港鐵巴士
    if (seg.primaryCo === "mtrb") {
      let boardEtas = [];
      try { boardEtas = await getEtasCached(seg.routeId, r, "mtrb", seg.boardIdx); } catch (e) { boardEtas = []; }
      boardEtas = (boardEtas || []).filter(e => e.etaDate >= currentTime);

      let depEta;
      if (boardEtas.length) {
        depEta = boardEtas[0];
      } else {
        const hour = currentTime.getHours();
        const isRush = (hour >= 7 && hour <= 9) || (hour >= 17 && hour <= 19);
        const roughHeadway = isRush ? 10 : 18;
        depEta = { etaDate: new Date(currentTime.getTime() + roughHeadway * 60000), rmk: "推算班次", isFallback: true };
      }

      let durationMins = null;
      try { durationMins = await estimateSegmentDuration(r, "mtrb", seg.boardIdx, seg.alightIdx, depEta.etaDate); }
      catch (e) { durationMins = null; }
      if (!Number.isFinite(durationMins)) {
        durationMins = Math.max(2, (seg.alightIdx - seg.boardIdx) * 2.5);
      }

      const alightTime = new Date(depEta.etaDate.getTime() + durationMins * 60000);
      let fare = null;
      try { fare = await getSegFare(r, "mtrb", seg.boardIdx, seg.alightIdx, depEta.etaDate); } catch (e) { fare = null; }

      const newLegs = pathLegs.slice();
      newLegs.push({
        type: "ride",
        routeId: seg.routeId,
        // 港鐵巴士分支・行程結果顯示跟返母線
        routeNo: _mtrbMotherCode(r),
        co: "mtrb",
        r,
        boardStopId: seg.boardStopId,
        alightStopId: seg.alightStopId,
        departTime: depEta.etaDate,
        arriveTime: alightTime,
        rmk: depEta.rmk || "",
        isSpeculative: !!depEta.isFallback,
        fare
      });

      return await dfs(segIdx + 1, alightTime, newLegs, rideCount + 1);
    }

    // 【新渡輪 Sun Ferry：直接用 r.freq 估算開船時間】
    // 新渡輪官方 ETA API 並唔適合當作「下一班由起點開出」資料來源；
    // 搜尋時如果依賴佢，經常攞唔到可用 ETA，甚至令整條渡輪候選消失。
    // routeFareList.min.json 對應路線本身已有 r.freq，就直接按今日日子類型
    // + 當前時間計下一班，完全跳過 GTFS／ETA fallback，確保搜尋結果以官方 freq
    // 時段作為開船時間基準。
    if (seg.primaryCo === "sunferry") {
      const sunFreqDayKey = _resolveFreqDayTypeKey(r.freq, currentTime);
      const sunFreqTable = sunFreqDayKey && r.freq ? r.freq[sunFreqDayKey] : null;
      const sunLookaheadMin = isCandidateLongHaul ? 180 : 120;
      const sunFreqResult = _computeFreqDeparture(sunFreqTable, currentTime, sunLookaheadMin);
      if (!sunFreqResult) return null;

      const depEta = {
        etaDate: sunFreqResult.etaDate,
        rmk: "預計",
        isFallback: true,
        isGeneric: true
      };
      let durationMins = null;
      try {
        durationMins = await getBaselineSegmentMinutes("sunferry", r.route, r.stops?.sunferry || r.stops?.[r.primaryCo], seg.boardIdx, seg.alightIdx, depEta.etaDate);
      } catch (e) {}
      if (durationMins === null || !Number.isFinite(durationMins)) {
        try {
          durationMins = await estimateSegmentDuration(r, "sunferry", seg.boardIdx, seg.alightIdx, depEta.etaDate);
        } catch (e) {}
      }
      if (!Number.isFinite(durationMins)) {
        durationMins = Math.max(5, (seg.alightIdx - seg.boardIdx) * 10);
      }

      const alightTime = new Date(depEta.etaDate.getTime() + durationMins * 60000);
      let fare = null;
      try { fare = await getSegFare(r, "sunferry", seg.boardIdx, seg.alightIdx, depEta.etaDate); } catch (e) {}

      const newLegs = pathLegs.slice();
      newLegs.push({
        type: "ride",
        routeId: seg.routeId,
        routeNo: r.route,
        co: "sunferry",
        r,
        boardStopId: seg.boardStopId,
        alightStopId: seg.alightStopId,
        departTime: depEta.etaDate,
        arriveTime: alightTime,
        rmk: depEta.rmk,
        isSpeculative: true,
        fare
      });
      return await dfs(segIdx + 1, alightTime, newLegs, rideCount + 1);
    }

    // 轉車站群感知
    let etasBoard = [];
    const fetchPromises = [];
    for (const co of seg.companies) {
      const groupIdxs = _groupBoardIndices(r, co, seg.boardStopId);
      let idxsToQuery = groupIdxs;
      if (!idxsToQuery.length) {
        // 呢個公司嘅站序入面搵唔到同一轉車站群嘅站牌（例如根本冇
        // isSameTransferPoint 資料），退返舊有做法：淨係查
        // findEquivalentStopIdx() 解到嘅單一站序。
        let coIdx = seg.boardIdx;
        if (co !== seg.primaryCo) {
          const equivIdx = findEquivalentStopIdx(r, co, seg.boardStopId);
          if (equivIdx >= 0) coIdx = equivIdx;
        }
        idxsToQuery = [{ idx: coIdx, stopId: seg.boardStopId }];
      }
      for (const { idx, stopId } of idxsToQuery) {
        fetchPromises.push(
          getEtasCached(seg.routeId, r, co, idx)
            .then(list => (list || []).map(e => ({ ...e, _resolvedCo: co, _groupIdx: idx, _groupStopId: stopId })))
        );
      }
    }
    const results = await Promise.all(fetchPromises);
    results.forEach(list => { list.forEach(e => { etasBoard.push(e); }); });
    etasBoard.sort((a,b) => a.etaDate - b.etaDate);

    // 分站上車時間邏輯
    for (let e of etasBoard) {
      const isScheduled = e.isFallback || 
        String(e.rmk || "").toLowerCase().includes("預定") || 
        String(e.rmk || "").toLowerCase().includes("原定") || 
        String(e.rmk || "").toLowerCase().includes("scheduled");
      
      // 用返呢個班次實際查詢緊嘅站序（_groupIdx，可能嚟自轉車站群入面
      // 另一個站牌），唔再淨係死咬住 seg.boardIdx。
      const boardCoIdx = (typeof e._groupIdx === "number") ? e._groupIdx : seg.boardIdx;

      if (isScheduled && boardCoIdx > 0) {
        const stops = r.stops[e._resolvedCo] || r.stops[r.primaryCo];
        let mins = await getBaselineSegmentMinutes(e._resolvedCo, r.route, stops, 0, boardCoIdx, e.etaDate);
        if (mins === null) {
          mins = await estimateSegmentDuration(r, e._resolvedCo, 0, boardCoIdx, e.etaDate);
        }
        e.etaDate = new Date(e.etaDate.getTime() + Math.round(mins) * 60000);
        e.isTerminusAdjusted = true;
      }
    }
    etasBoard.sort((a,b) => a.etaDate - b.etaDate);

    let etasAlight = [];
    const alightPromises = seg.companies.map(co => {
      let alightCoIdx = seg.alightIdx;
      if (co !== seg.primaryCo) {
        const equivIdx = findEquivalentStopIdx(r, co, seg.alightStopId);
        if (equivIdx >= 0) alightCoIdx = equivIdx;
      }
      return getEtasCached(seg.routeId, r, co, alightCoIdx);
    });
    const alightResults = await Promise.all(alightPromises);
    alightResults.forEach((list, index) => {
      const co = seg.companies[index];
      list.forEach(e => { etasAlight.push({...e, _resolvedCo: co}); });
    });
    etasAlight.sort((a,b) => a.etaDate - b.etaDate);

    // === 下車站點預定時間 ===
    for (let e of etasAlight) {
      const isScheduled = e.isFallback || 
        String(e.rmk || "").toLowerCase().includes("預定") || 
        String(e.rmk || "").toLowerCase().includes("原定") || 
        String(e.rmk || "").toLowerCase().includes("scheduled");
      
      let alightCoIdx = seg.alightIdx;
      if (e._resolvedCo !== seg.primaryCo) {
        const equivIdx = findEquivalentStopIdx(r, e._resolvedCo, seg.alightStopId);
        if (equivIdx >= 0) alightCoIdx = equivIdx;
      }

      if (isScheduled && alightCoIdx > 0) {
        const stops = r.stops[e._resolvedCo] || r.stops[r.primaryCo];
        let mins = await getBaselineSegmentMinutes(e._resolvedCo, r.route, stops, 0, alightCoIdx, e.etaDate);
        if (mins === null) {
          mins = await estimateSegmentDuration(r, e._resolvedCo, 0, alightCoIdx, e.etaDate);
        }
        e.etaDate = new Date(e.etaDate.getTime() + Math.round(mins) * 60000);
        e.isTerminusAdjusted = true;
      }
    }
    etasAlight.sort((a,b) => a.etaDate - b.etaDate);

    let validDepEtas = etasBoard.filter(e => e.etaDate >= new Date(currentTime.getTime() - 60000)).slice(0, 5);

    if (validDepEtas.length === 0) {
      // 【聯營路線：兜底推算唔應該淨係睇 seg.primaryCo】用戶反映轉乘聯營
      // 路線（例如九巴／城巴、九巴／龍運同號聯營）嗰陣，明明另一間公司
      // 實際上仲有實時／排班資料，但以前呢一大段兜底推算（GTFS 靜態時間表、
      // 總站實時 ETA 反推、r.freq 班距估算）淨係死咬住 seg.primaryCo——
      // beam search 評估過程隨機揀落嚟做代表嗰一間公司，同「邊間公司實際
      // 上快啲有車」完全冇關係——搞到就算另一間公司其實已經有車就嚟到，
      // 都照樣顯示「推算班次」呢個保守估計，甚至因為淨係查嗰間冇資料嘅
      // 公司而誤判做冇服務。而家改為將以下邏輯包成 tryFallbackForCo(co)，
      // 逐間公司（seg.companies，唔止 primaryCo 一間）各自跑一次，然後
      // 將全部公司搵到嘅候選開車時間合埋一齊，揀最快嗰一班；只有全部
      // 公司都證實「唔應該有服務」，先至真係當呢一程搭唔到（return
      // null）。單一公司經營嘅路線（seg.companies 得一間）行為同以前
      // 完全一樣，唔會受影響。
      const NEARBY_WINDOW_MIN = 260;
      const fallbackCos = (Array.isArray(seg.companies) && seg.companies.length) ? seg.companies : [seg.primaryCo];

      async function tryFallbackForCo(co) {
        const localEtas = [];
        const staticSchedule = await getStopArrivalScheduleList(co, r.route, seg.boardStopId, currentTime, NEARBY_WINDOW_MIN);
        const futureTripsRaw = staticSchedule.found
          ? staticSchedule.all
              .filter(t => t.etaDate >= new Date(currentTime.getTime() - 30000))
          : [];
        const recentPastTrips = staticSchedule.found
          ? staticSchedule.all.filter(t => t.etaDate < new Date(currentTime.getTime() - 30000))
          : [];

        // 【r.freq 尾班車時間上限，過濾唔可信嘅 GTFS「未來班次」】見
        // _resolveFreqLastDepartureCutoff() 頂部註解：routeFareList.min.json
        // 嘅 freq 係官方時間表，權威性高過呢度嘅 GTFS 靜態時間表推算。如果
        // GTFS 話有嘅未來班次，其實遲過 r.freq 話嘅尾班車開出時刻（容許 5
        // 分鐘誤差），就當呢班係 GTFS 資料誤差／未更新造成嘅唔存在班次，
        // 過濾走，唔會直接攞嚟用（落去落面 r.freq 兜底邏輯，已經會正確噉
        // 判斷做「今日已過尾班車」）。
        const freqCutoff = _resolveFreqLastDepartureCutoff(r, currentTime, seg.boardStopId, co);
        // 【r.freq 班距一致性檢查】見 _isTimeConsistentWithFreqGrid() 頂部
        // 註解：淨係核實上限唔夠——GTFS 展開出嚟嘅某一班就算冇遲過尾班車，
        // 都可能同官方班距嘅發車格仔對唔上（例如貼咗前一個較密時段嘅格仔
        // 延伸落嚟），呢種情況一樣要當唔可信嘅班次過濾走。
        const futureTrips = (freqCutoff
          ? futureTripsRaw.filter(t => t.etaDate.getTime() <= freqCutoff.getTime() + 5 * 60000)
          : futureTripsRaw
        ).filter(t => _isTimeConsistentWithFreqGrid(r, t.etaDate, seg.boardStopId, co, seg.alightStopId));

        if (staticSchedule.found && futureTrips.length > 0) {
          for (const t of futureTrips.slice(0, 5)) {
            localEtas.push({
              etaDate: t.etaDate,
              _resolvedCo: co,
              isFallback: true,
              isGeneric: false,
              rmk: "預定",
              _tripId: t.tripId
            });
          }
          return { hardFail: false, etas: localEtas };
        }

        const headwayResult = await isRouteCurrentlyInService(co, seg.r.route, currentTime);

        let activeFromEarlierStops = false;
        if (seg.boardIdx > 0) {
           try {
               const originEtas = await getEtasCached(seg.routeId, r, co, 0);
               // 避免時光倒流，必須用 currentTime 嚟篩總站班次
               const futureOriginEtas = (originEtas || [])
                 .filter(e => e.etaDate >= new Date(currentTime.getTime() - 30000));
               if (futureOriginEtas.length > 0) {
                   activeFromEarlierStops = true;

                   // 分站無自己 ETA 時，用總站實時時間推算
                   const stops0 = r.stops[co] || r.stops[r.primaryCo];
                   for (const oe of futureOriginEtas.slice(0, 5)) {
                       let segMins = await getBaselineSegmentMinutes(co, r.route, stops0, 0, seg.boardIdx, oe.etaDate);
                       if (segMins === null) {
                           segMins = await estimateSegmentDuration(r, co, 0, seg.boardIdx, oe.etaDate);
                       }
                       if (Number.isFinite(segMins)) {
                           localEtas.push({
                               etaDate: new Date(oe.etaDate.getTime() + Math.round(segMins) * 60000),
                               _resolvedCo: co,
                               isFallback: true,
                               isTerminusAdjusted: true,
                               isGeneric: false,
                               rmk: "預定"
                           });
                       }
                   }
               }
           } catch (err) {}
        }

        if (localEtas.length > 0) {
          // 已經靠總站實時 ETA＋分站車程估算成功推算出候選，冇必要再落去
          // 用更粗略嘅 headwayResult／scheduleFallback／r.freq 兜底估算。
          return { hardFail: false, etas: localEtas };
        }

        // GTFS 鄰近兩小時窗口內若曾經有班次（哪怕已經係過去），代表條路線今日確實仲有服務，
        // 只係啱啱好搭唔到跟腳嗰班，唔應該即刻當「完全冇服務」咁武斷咁判失敗。
        const hasNearbyGtfsEvidence = recentPastTrips.length > 0;

        const isCustomSecondaryLeg = treatSecondaryLegsRelaxed && rideCount > 0;

        // 【一般搜尋模式全程 freq 核實寬鬆】用戶反映：明明有直達車（例如
        // 6C／102 美孚 直達 衛理道），但因為第一程（rideCount === 0）冇
        // 即時 ETA 就被上面 headwayResult===false 嘅嚴格檢查直接判死，
        // 令成個直達方案完全消失，搜尋結果反而剩低一啲要轉車嘅方案。
        // 呢個問題原本只喺次程（rideCount > 0）先有寬鬆處理，而家擴展到
        // 第一程都可以用同一套核實機制：用 isRouteActiveAroundTime()
        // 核實返 r.freq 官方班次表本身係否認為呢個上車站、呢一刻（未來
        // 一小時窗口內）應該有服務——
        //   - 核實到「有」→ 當呢程寬鬆處理，落去用 scheduleFallback／
        //     estimateSegmentDuration 推算合理車程，唔會因為單一嘅實時
        //     ETA 缺口就令一條確實存在嘅直達路線完全消失。
        //   - 核實到「冇」→ 維持原有嚴格檢查，唔會靠估估一程根本唔存在
        //     嘅車。
        const freqVerifiedThisLeg = !isCustomSecondaryLeg &&
          isRouteActiveAroundTime(r, currentTime, seg.boardStopId, 60);
        const isRelaxableSecondaryLeg = isCustomSecondaryLeg || freqVerifiedThisLeg;

        if (headwayResult === false && !activeFromEarlierStops && !hasNearbyGtfsEvidence && !isRelaxableSecondaryLeg) {
          return { hardFail: true, etas: [] };
        }

        const pastLastKnownTripNarrowWindow = staticSchedule.found && futureTrips.length === 0 && recentPastTrips.length > 0;

        // 修正稀疏班次尾班車誤判
        let pastLastKnownTrip = pastLastKnownTripNarrowWindow;
        if (!pastLastKnownTrip) {
          const wholeDayStatus = await hasAnyRemainingTripToday(co, r.route, seg.boardStopId, currentTime);
          if (wholeDayStatus === false) {
            pastLastKnownTrip = true;
            if (DEBUG_MODE) console.log(`[尾班車判定] 路線=${r.route} co=${co} 上車站=${stopName(seg.boardStopId)}：窄窗口搵唔到紀錄，但全日掃描證實尾班車已開出`);
          }
        }

        // 無論係咪 segRelaxed，用嚟兜底嘅「預計」班次都必須先經 GTFS calendar
        // (calendar.txt / calendar_dates.txt) 確認條路線今日真係有服務，先至
        // 畀 scheduleFallback／落面嘅粗略估算生效，避免喺「今日完全冇服務」
        // 嘅路線度都推算一個唔存在嘅班次出嚟。
        const svcActiveToday = await isServiceActiveForRouteOnDate(co, r.route, currentTime);

        // 修正特別路線幽靈班次
        let kmbServiceTypeDiscontinued = false;
        if (co === "kmb" && r.service_type) {
          const liveCheck = isKmbServiceTypeLive(r.route, r.service_type);
          if (liveCheck === false) kmbServiceTypeDiscontinued = true;
        }

        // 修正「等車時間畀 terminus 車程 double count」
        let segMinsForFallback = 0;
        if (seg.boardIdx > 0) {
          const stopsForAdj = r.stops[co] || r.stops[r.primaryCo];
          let segMinsEstimate = await getBaselineSegmentMinutes(co, r.route, stopsForAdj, 0, seg.boardIdx, currentTime);
          if (segMinsEstimate === null) {
            segMinsEstimate = await estimateSegmentDuration(r, co, 0, seg.boardIdx, currentTime);
          }
          if (Number.isFinite(segMinsEstimate)) segMinsForFallback = segMinsEstimate;
        }
        const fallbackSearchTime = segMinsForFallback > 0
          ? new Date(currentTime.getTime() - Math.round(segMinsForFallback) * 60000)
          : currentTime;

        let fallbackTime = (pastLastKnownTrip && !isRelaxableSecondaryLeg) ? null : scheduleFallback(r, fallbackSearchTime, isCandidateLongHaul, seg.boardStopId, seg.alightStopId);
        if (fallbackTime) {
          // 改善服務檢查
          if (svcActiveToday === false && !isRelaxableSecondaryLeg) {
            fallbackTime = null;
          }
          // service_type 已經證實停辦，屬於比 svcActiveToday 更直接嘅證據
          if (kmbServiceTypeDiscontinued) {
            fallbackTime = null;
          }
        }
        if (fallbackTime) {
          // fallbackTime 本身已經係「總站開出，加返返分站車程後岩岩好到達
          // currentTime」嘅總站開出時間——加返 segMinsForFallback（同上面
          // 搜尋基準時間扣走嗰個一致，避免重複估算兩次唔同嘅車程數值）就
          // 係這個分站嘅實際上車時間。
          const boardTime = segMinsForFallback > 0
            ? new Date(fallbackTime.getTime() + Math.round(segMinsForFallback) * 60000)
            : fallbackTime;
          localEtas.push({
            etaDate: boardTime,
            _resolvedCo: co,
            isFallback: true,
            isGeneric: true,
            isTerminusAdjusted: seg.boardIdx > 0,
            rmk: "預計"
          });
          return { hardFail: false, etas: localEtas };
        }

        if (!segRelaxed && !isRelaxableSecondaryLeg) {
          return { hardFail: true, etas: [] };
        }
        // 【指定時間出發／自選行程第一程之後嘅車程／一般搜尋經 freq 核實
        // 過寬鬆嘅次程，共用嘅最後一重兜底估算】呢度已經冇 scheduleFallback
        // 嘅具體班次時間，純粹靠粗略 headway 估算，所以更加要 respect GTFS
        // calendar 嘅「今日冇服務」判斷，否則喺明確冇服務嘅日子都會生成一個
        // 假嘅「預計」班次。
        if (!isRelaxableSecondaryLeg) {
          if (svcActiveToday === false) {
            return { hardFail: true, etas: [] };
          }
          if (pastLastKnownTrip) {
            return { hardFail: true, etas: [] };
          }
        }

        const lookaheadMin = isCandidateLongHaul ? 150 : 90;
        // 合併全部變體揀最快一班
        let segMinsForFreq = 0;
        if (seg.boardIdx > 0) {
          const stopsForFreqAdj = r.stops[co] || r.stops[r.primaryCo];
          let segMinsFreqEstimate = await getBaselineSegmentMinutes(co, r.route, stopsForFreqAdj, 0, seg.boardIdx, currentTime);
          if (segMinsFreqEstimate === null) {
            segMinsFreqEstimate = await estimateSegmentDuration(r, co, 0, seg.boardIdx, currentTime);
          }
          if (Number.isFinite(segMinsFreqEstimate)) segMinsForFreq = segMinsFreqEstimate;
        }
        const freqSearchTime = segMinsForFreq > 0
          ? new Date(currentTime.getTime() - Math.round(segMinsForFreq) * 60000)
          : currentTime;

        let freqResult = null;
        // 兄弟變體要真係去到 seg.alightStopId 先計落嚟揀「最快」，
        // 唔會誤用一個乘客實際上唔到嘅特別班次變體嘅密集班次。
        const allTablesForCandidate = _resolveAllEffectiveFreqTables(r, freqSearchTime, seg.boardStopId, co, seg.alightStopId);
        if (allTablesForCandidate.length) {
          freqResult = _computeEarliestFreqDeparture(allTablesForCandidate, freqSearchTime, lookaheadMin);
        }
        if (!freqResult) {
          return { hardFail: true, etas: [] };
        }
        const freqBoardTime = segMinsForFreq > 0
          ? new Date(freqResult.etaDate.getTime() + Math.round(segMinsForFreq) * 60000)
          : freqResult.etaDate;
        localEtas.push({
          etaDate: freqBoardTime,
          _resolvedCo: co,
          isFallback: true,
          isGeneric: true,
          isTerminusAdjusted: seg.boardIdx > 0,
          rmk: "預計"
        });
        return { hardFail: false, etas: localEtas };
      }

      const perCoResults = await Promise.all(
        fallbackCos.map(co => tryFallbackForCo(co).catch(() => ({ hardFail: true, etas: [] })))
      );
      const mergedEtas = [];
      let allHardFail = true;
      for (const res of perCoResults) {
        if (res && res.etas && res.etas.length) mergedEtas.push(...res.etas);
        if (!res || !res.hardFail) allHardFail = false;
      }
      if (mergedEtas.length === 0) {
        // 全部公司都判「唔應該有服務」（hardFail），或者全部都靜靜雞
        // 冇搵到任何候選（理論上少見），先至真係當呢一程搭唔到。
        return null;
      }
      mergedEtas.sort((a, b) => a.etaDate - b.etaDate);
      validDepEtas.push(...mergedEtas.slice(0, 5));
    }

    const branches = [];
    for (const dep of validDepEtas) {
      // 轉車站群：用返呢班車實際查詢緊嘅站牌
      const boardIdxForDep = (typeof dep._groupIdx === "number") ? dep._groupIdx : seg.boardIdx;
      const boardStopIdForDep = dep._groupStopId || seg.boardStopId;

      // 【檢查循環線方向・站序 idx 先知得唔得】轉車站群配對（_groupIdx）
      // 可能撈到嘅係另一個「同名／同位置」但實際上喺路線站序上已經行埋
      // 咗（甚至喺落車站之後）嘅站牌——常見成因：循環線判斷
      // （isCircularRouteCo）淨係跟「co|route」呢個 key,冇分 serviceType,
      // 如果同一個路線編號底下有其他 serviceType 誤帶 "I" bound,就會
      // 累到成條路線（包括真正循環嗰個 serviceType）被錯判做「非循環
      // 線」，令 _groupBoardIndices() 誤用咗名／位置比對去撈第二個候選
      // 站牌,但嗰個候選其實企咗喺循環線嘅「回程」一段，同落車站嘅方向
      // 完全對唔上。呢度加一重硬性檢查：如果呢班車實際查詢緊嘅上車站序
      // idx 已經唔喺落車站 idx 之前（同一個站序陣列入面),代表沿正常行
      // 車方向根本去唔到落車站,呢個 dep 一律當唔可行,跳過,唔會夾硬計
      // 出一個好似「2 分鐧」咁嘅荒謬短車程。
      if (boardIdxForDep >= seg.alightIdx) continue;

      const segForDep = (boardIdxForDep !== seg.boardIdx || boardStopIdForDep !== seg.boardStopId)
        ? { ...seg, boardIdx: boardIdxForDep, boardStopId: boardStopIdForDep }
        : seg;

      let durationMins = null;

      // 【純 GTFS 排班 fallback】完全冇實時 ETA，靠 GTFS 靜態 trip 直接讀站到站時間
      if (dep._tripId && !dep.isGeneric) {
        durationMins = await getTripStopDurationByTripId(dep._tripId, boardStopIdForDep, seg.alightStopId);
      }

      // 【第一優先／第二優先】起點有實時 ETA：優先嘗試完整起訖 ETA 直接相減（第一優先，
      // 且落車時間須喺查詢後一小時內），唔得先退返用 GTFS 校準比率估算（第二優先，
      // 並確認當日喺 calendar.txt 服務時間以內）。
      if (durationMins === null && !dep.isFallback) {
        durationMins = await calibrateDurationOneSidedGeneral(
          r, segForDep, dep._resolvedCo, dep, currentTime, etasAlight,
          async (from, to) => {
            const stops = r.stops[dep._resolvedCo] || r.stops[r.primaryCo];
            const baseline = await getBaselineSegmentMinutes(dep._resolvedCo, r.route, stops, from, to, dep.etaDate);
            if (baseline !== null) return baseline;
            return await estimateSegmentDuration(r, dep._resolvedCo, from, to, dep.etaDate);
          },
          now
        );
      }

      if (durationMins === null) {
        const stops = r.stops[dep._resolvedCo] || r.stops[r.primaryCo];
        durationMins = await getBaselineSegmentMinutes(dep._resolvedCo, r.route, stops, boardIdxForDep, seg.alightIdx, dep.etaDate);
        if (durationMins === null) {
          durationMins = await estimateSegmentDuration(r, dep._resolvedCo, boardIdxForDep, seg.alightIdx, dep.etaDate);
        }
      }
      // 無論以上邊個估算方式，若最終唔係有限數字（例如 NaN／Infinity），
      // 一律 fallback 用最基本嘅啟發式估算，確保一定計到到站時間，唔會令結果顯示 --:--
      if (!Number.isFinite(durationMins)) {
        durationMins = await estimateSegmentDuration(r, dep._resolvedCo, boardIdxForDep, seg.alightIdx, dep.etaDate);
      }

      // 修正推算車程：用 dep.etaDate（呢一程實際嘅出發時間）揀返嗰個
      // 「星期＋鐘頭」專屬嘅觀測車程，令修正更貼近實際出發嗰一刻嘅路況
      const stopByStopStops = r.stops[dep._resolvedCo] || r.stops[r.primaryCo];
      const stopByStopSec = await sumTimeIntervalSecondsAsync(stopByStopStops, boardIdxForDep, seg.alightIdx, dep.etaDate);
      if (stopByStopSec !== null) {
        const stopByStopMin = stopByStopSec / 60;
        if (stopByStopMin > durationMins) {
          durationMins = stopByStopMin;
        }
      }

      const alightTime = new Date(dep.etaDate.getTime() + durationMins * 60000);
      const fare = await getSegFare(r, dep._resolvedCo, boardIdxForDep, seg.alightIdx, dep.etaDate);
      
      const newLegs = pathLegs.slice();
      newLegs.push({
        type: "ride",
        routeId: seg.routeId,
        routeNo: r.route,
        co: dep._resolvedCo,
        r,
        boardStopId: boardStopIdForDep,
        alightStopId: seg.alightStopId,
        departTime: dep.etaDate,
        arriveTime: alightTime,
        rmk: dep.rmk,
        isSpeculative: dep.isFallback,
        fare
      });

      const res = await dfs(segIdx + 1, alightTime, newLegs, rideCount + 1);
      if (res) branches.push(res);
    }

    if (branches.length === 0) return null;
    branches.sort((a,b) => a.arriveTime - b.arriveTime);
    return branches[0];
  }

  const initialTime = now;
  let finalResult = await dfs(0, initialTime, [], 0);
  
  if (!finalResult && !relaxed) {
    relaxed = true;
    finalResult = await dfs(0, initialTime, [], 0);
  }
  return finalResult;
}

// 利用 Geolocation API 獲取用戶位置並自動填入「起點」的按鈕邏輯
$("#gpsBtn").addEventListener("click", async () => {
  const gpsBtn = $("#gpsBtn");
  if (!navigator.geolocation) {
    alert("瀏覽器不支援 GPS 定位服務");
    return;
  }
  
  gpsBtn.disabled = true;
  gpsBtn.textContent = "定位中";
  
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      
      if (!etaDb) {
        gpsBtn.disabled = false;
        gpsBtn.textContent = "取用 GPS 為起點";
        alert("資料庫載入中，請稍後再試");
        return;
      }
      
      const near = nearbyStops(lat, lng, ENDPOINT_WALK_RADIUS_M);
      if (!near.length) {
        gpsBtn.disabled = false;
        gpsBtn.textContent = "取用 GPS 為起點";
        alert(`附近 ${ENDPOINT_WALK_RADIUS_M} 米內找不到任何巴士站`);
        return;
      }
      
      const closestStopId = near[0].stopId;
      const s = etaDb.stopList[closestStopId];
      const stopName = (s.name && (s.name.zh || s.name.en)) || "未知站點";
      // 【改為直接揀最近站點做起點】以前呢度保留用戶嘅原始 GPS 經緯度
      // （唔帶 stopId），等 runBeamSearch 自己再算精準嘅步行距離。而家
      // 應用戶要求，GPS 定位完成後直接揀最近嗰個站做起點（stopId／
      // 座標都用返車站本身嘅），同埋一揀完站，地圖即刻縮放去嗰個站
      // 附近嘅範圍，等用戶可以喺地圖上再核實/微調。
      origin = { stopId: closestStopId, name: stopName, lat: s.location.lat, lng: s.location.lng };
      originInput.value = stopName;
      updatePickedMarkersOnMap();
      fitStopMapToPicked();
      
      gpsBtn.disabled = false;
      gpsBtn.textContent = "定位成功";
      setTimeout(() => {
        gpsBtn.textContent = "取用 GPS 為起點";
      }, 3000);
    },
    (err) => {
      console.error(err);
      gpsBtn.disabled = false;
      gpsBtn.textContent = "取用 GPS 為起點";
      alert("請確保已開啟瀏覽器 GPS 權限");
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
});

  const info = lastSearchDebugInfo;

  const boardRows = (info.boardCandidates || [])
    .slice()
    .sort((a, b) => a.bestDistM - b.bestDistM)
    .slice(0, 8)

        <td>${escapeHtml(r.route)}</td>
        <td>${escapeHtml(r.bestName || "")}</td>

      </tr>`).join("");

  const roundRows = (info.rounds || []).map(r => `<tr>
      <td>${r.round + 1}</td>
      <td>${r.statesConsidered}${r.statesAfterBeamCut < r.statesConsidered ? `（beam 斬到 ${r.statesAfterBeamCut}）` : ""}</td>
      <td>${r.minDGoalM === null ? "-" : r.minDGoalM + "米"}</td>
      <td>${r.candidatesSoFar}</td>
    </tr>`).join("");

  return `
    <div style="background:#eae6df; padding:10px 14px; margin-top:10px; font-size:11px; color:#555; border:1px solid var(--line); line-height:1.5; text-align:left;">
      <b>搜尋失敗診斷 (僅 Debug 模式顯示)</b>${stageNote ? `<br>${escapeHtml(stageNote)}` : ""}<br>
      起點：${escapeHtml(info.originName)}｜終點：${escapeHtml(info.destName)}｜直線總距離：${info.straightLineTotalM}米<br>
      beam 闊度：${info.effectiveBeamWidth}｜極長途：${info.isVeryLongHaulTrip ? "係" : "否"}｜大嶼山行程：${info.isLantauTrip ? "係" : "否"}｜有直達服務：${info.directExists ? "係" : "否"}<br>
      起點發現半徑：${info.discoveryRadiusM}米，搵到 ${info.nearbyRouteCount} 條路線變體。
      ${boardRows ? `<br><b>逐條路線最近上車站（頭 8 條，由近到遠）：</b>
      <table style="width:100%; border-collapse:collapse; margin-top:4px;">
        <tr style="text-align:left; color:#777;"><th>路線</th><th>最近上車站</th><th>距離</th></tr>
        ${boardRows}
      </table>` : "（附近搵唔到任何路線經過，可能已超出發現半徑）"}
      ${roundRows ? `<br><b>逐個 round 搜尋進度：</b>
      <table style="width:100%; border-collapse:collapse; margin-top:4px;">
        <tr style="text-align:left; color:#777;"><th>Round</th><th>候選狀態數</th><th>離終點最近</th><th>已搵到組合數</th></tr>
        ${roundRows}
      </table>` : ""}
      最終搵到 ${info.finalCandidateCount} 個候選組合。
    </div>
  `;
}

searchBtn.addEventListener("click", async () => {
  if (!origin || !destination) {
    statusLine.textContent = "請先輸入並選擇起點及終點巴士站";
    statusLine.classList.add("err");
    return;
  }
  if (origin.stopId && origin.stopId === destination.stopId) {
    statusLine.textContent = "起點同終點不能為同一站";
    statusLine.classList.add("err");
    return;
  }

  statusLine.textContent = "";
  statusLine.classList.remove("err");
  searchBtn.disabled = true;
  searchBtn.textContent = "搜尋行程中";
  resultsWrap.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      正在搜尋
    </div>
  `;

  try {
    etaCache.clear();
    const startTime = useSpecifiedTime ? new Date(customTimeInput.value) : new Date();
    
    const candidates = await runBeamSearch(origin, destination, new Set(), startTime);
    
    if (!candidates.length) {
      resultsWrap.innerHTML = `<div class="empty-state">無法搜尋可行行程組合，或超出步行搜尋限制</div>`
        + renderSearchFailureDebugInfo("beam search 無法搜尋可行行程組合");
      searchBtn.disabled = false;
      searchBtn.textContent = "搜尋行程";
      return;
    }

    const evaluated = [];
    // 【效能：擴大每批並行評估數量】以前每批淨係 15 個候選一齊 Promise.all，
    // 之後先評估下一批——每一批都要等一次網絡來回，批數越多，使用者感覺
    // 等得越耐。fetchCtbLiveInterchange／etaCache 等底層 API 呼叫本身已經
    // 有 cache（同一 key 唔會重複發請求），所以擴大批size唔會令請求量倍
    // 增，反而可以將更多本來要分開幾批、逐批等嘅候選一次過夾埋一齊等，
    // 減少總共需要嘅來回次數，令搵到結果嘅時間明顯縮短。
    const step = 30;
    // 長途行程放寬 runBeamSearch() 上限到 90
    const evalStopCap = (lastSearchDebugInfo && lastSearchDebugInfo.isVeryLongHaulTrip) ? 90 : 45;
    const chunks = [];
    for (let i = 0; i < candidates.length; i += step) chunks.push(candidates.slice(i, i + step));
    // 【效能：分批評估改為管道化（pipeline）預取，取代逐批完整等待】
    // 以前一批完全 await 完（Promise.all 全部 resolve、並且 forEach 聚合
    // 完畢）先至開始下一批嘅 evaluateCandidate() 網絡請求，令批與批之間
    // 嘅網絡來回時間純粹一批接一批疊加。因為 step(30) < evalStopCap
    // (45/90)，實務上幾乎一定要行多過一批先夠 cap，所以呢個「等完先開始
    // 下一批」嘅寫法，喺絕大部分搜尋都會白白多等一次來回。而家改為喺
    // 處理緊第 N 批結果嘅同時，已經即刻發出第 N+1 批嘅請求，等兩批嘅
    // 網絡等待時間可以重疊，明顯縮短需要行到第 2、3 批先夠 cap 嘅搜尋
    // （尤其係長途、多程行程）等候時間。底層 evaluateCandidate() 用到嘅
    // etaCache／fetchCtbLiveInterchange 等 API 本身已經有 cache 同去重，
    // 提前發出下一批請求唔會令實際對外請求量倍增。
    let inFlight = chunks.length ? Promise.all(chunks[0].map(c => evaluateCandidate(c, startTime, useSpecifiedTime))) : null;
    for (let ci = 0; ci < chunks.length; ci++) {
      if (!inFlight) break;
      // 指定時間出發時，未來時段未必有實時 ETA 資料，改用寬鬆模式，
      // 靠 GTFS calendar／班次表推算該時段是否有服務，避免因為冇實時
      // 數據就將成條路線判失敗。
      const nextInFlight = (ci + 1 < chunks.length)
        ? Promise.all(chunks[ci + 1].map(c => evaluateCandidate(c, startTime, useSpecifiedTime)))
        : null;
      const chunkRes = await inFlight;
      chunkRes.forEach(r => { if (r) evaluated.push(r); });
      // 改善路線多樣性
      if (evaluated.length >= evalStopCap) break;
      inFlight = nextInFlight;
    }

    if (!evaluated.length) {
      resultsWrap.innerHTML = `<div class="empty-state">無法搜尋行程，或該時段路線皆已停駛。</div>`
        + renderSearchFailureDebugInfo(`beam search 搵到 ${candidates.length} 個候選組合，但全部都喺實時/GTFS 評估階段被拒絕（可能已過尾班車、冇服務，或實時數據連接失敗）。`);
      searchBtn.disabled = false;
      searchBtn.textContent = "搜尋行程";
      return;
    }

    // 【港鐵重鐵：有實際 ETA 時，隱藏同一實體區段嘅推算班次方案】
    // 同一個重鐵上車站 -> 落車站，如果 evaluated 入面已經有一個真正
    // 實時 ETA 版本，就唔應該再將另一個淨係靠 roughHeadway／fallback
    // 算出嚟嘅同段「推算班次」方案留喺結果入面。
    // 原有 seenPlanKeys 只會喺兩個方案最後個 planKey 完全相同時先去重；
    // 如果兩個方案前後多咗唔同 walk leg／其他候選差異，仍然可能漏出一個
    // 「推算班次」版本。呢度獨立按 MTR 實際搭乘區段再篩一次，只針對
    // 港鐵重鐵，其他公司／其他類型完全唔改。
    const liveMtrSegmentKeys = new Set();
    for (const plan of evaluated) {
      for (const leg of (plan.legs || [])) {
        if (leg && leg.type === "ride" && leg.co === "mtr" && !leg.isSpeculative) {
          liveMtrSegmentKeys.add(`${leg.boardStopId}->${leg.alightStopId}`);
        }
      }
    }

    const evaluatedForResults = evaluated.filter(plan => {
      for (const leg of (plan.legs || [])) {
        if (!leg || leg.type !== "ride" || leg.co !== "mtr" || !leg.isSpeculative) continue;
        const key = `${leg.boardStopId}->${leg.alightStopId}`;
        if (liveMtrSegmentKeys.has(key)) return false;
      }
      return true;
    });

    const uniquePlans = [];
    const seenPlanKeys = new Map(); // planKey -> uniquePlans 入面嘅 index，等撞 key 嗰陣可以攞返舊嗰個嚟比較
    for (const plan of evaluatedForResults) {
      // 【港鐵重鐵：搭車段去重唔可以睇 routeId】routeId 對重鐵嚟講會夾住
      // 埋方向嘅終點站（例如「往羅湖」同「往落馬洲」係兩個唔同 routeId），
      // 但兩者喺分岔站之前（例如大圍→太和）其實係同一程 physical 列車，
      // 純粹因為即時班次 API 淨係報中咗其中一個方向嘅 destCode，令另一
      // 方向撞唔中實時資料、要跌落用「推算班次」頂住，變相整多一條內容
      // 重複、但淨係得估算資料嘅虛擬方案同真正有實時資料嗰條一齊出現。
      // 所以呢度重鐵段淨係用「上車站+落車站」做 key，唔理 routeId 方向，
      // 等呢類方向變體撞埋同一個 key。
      //
      // 【頭／尾嘅「入站／離站」步行段唔應該影響重鐵段嘅撞 key】搜尋起訖點
      // 本身可能唔啱好喺車站座標度，會有一小段步行去/返車站。同一個重鐵
      // 候選喺 beam search 唔同分支度，呢段步行有時計得出嚟、有時（例如
      // 起訖點本身就當咗做車站節點）就冇加呢條 walk leg——純粹呢個分別，
      // 就足以令原本 planKey 唔一致，令返同一程重鐵（一個撞中實時、一個
      // 跌落推算班次）當成兩個唔同方案一齊漏出嚟，去唔到重。所以起首／
      // 結尾如果係「連住重鐵搭車段」嘅步行（即入站/離站步行，唔係中途
      // 轉乘步行），唔計落 key 度，淨係睇重鐵段本身嚟判斷撞唔撞 key。
      const legsForKey = plan.legs.slice();
      if (legsForKey.length > 1 && legsForKey[0].type === "walk" &&
          legsForKey[1].type === "ride" && legsForKey[1].co === "mtr") {
        legsForKey.shift();
      }
      if (legsForKey.length > 1 && legsForKey[legsForKey.length - 1].type === "walk" &&
          legsForKey[legsForKey.length - 2].type === "ride" && legsForKey[legsForKey.length - 2].co === "mtr") {
        legsForKey.pop();
      }
      const planKey = legsForKey.map(l => {
        if (l.type !== "ride") return "walk";
        return l.co === "mtr" ? `mtr@${l.boardStopId}->${l.alightStopId}` : l.routeId + "@" + l.boardStopId;
      }).join("->");
      if (!seenPlanKeys.has(planKey)) {
        seenPlanKeys.set(planKey, uniquePlans.length);
        uniquePlans.push(plan);
      } else {
        // 撞 key：如果新嚟嗰個係真正實時（唔係推算班次），而之前留低嗰個
        // 仲係靠推算班次頂住，就用返呢個有實時資料嘅版本代替，等港鐵重鐵
        // 喺有實際 ETA 嘅情況下唔會再顯示「推算班次」嘅重複虛擬方案。
        const idx = seenPlanKeys.get(planKey);
        if (uniquePlans[idx].isSpeculative && !plan.isSpeculative) {
          uniquePlans[idx] = plan;
        }
      }
    }

    // 【診斷用：印低每個候選組合實際評估出嚟嘅關鍵數字】等我哋可以直接
    // 睇到「兩個上車站唔同、但路線一樣」嘅候選，實際評估完之後嘅到達
    // 時間／轉車次數／車費／總步行距離係咪真係一樣——如果 pruneDominatedPlans
    // 冇剔走行遠啲嘅版本，通常代表兩者其中一項數字（最大機會係到達時間）
    // 【接返 hasRedundantHop / isCircuitous 呢兩個旗標】呢兩個旗標之前
    // 喺 analyzeCandidateShape() 度計咗，但一路冇實際攞去做篩選，形同虛設
    // ——即係算法明明已經識別到「呢個組合有多餘轉車／兜咗好遠路」，都照
    // 樣可能揀咗佢做結果排第一。而家優先揀返冇呢兩種問題嘅「乾淨」組
    // 合；如果一個都冇（例如所有候選都要兜路），先至保底用返全部組合，
    // 唔會因為篩選過嚴而變成完全搵唔到結果。
    const cleanPlans = uniquePlans.filter(p => !p.isCircuitous && !p.hasRedundantHop);
    const candidatePool = cleanPlans.length ? cleanPlans : uniquePlans;
    lastResults = pruneDominatedPlans(candidatePool);
    sortResults(lastResults);
    renderResults(lastResults.slice(0, RESULTS_TO_SHOW));

  } catch (err) {
    console.error(err);
    statusLine.textContent = "發生未知錯誤,請重試";
    statusLine.classList.add("err");
    resultsWrap.innerHTML = "";
  } finally {
    searchBtn.disabled = false;
    searchBtn.textContent = "搜尋行程";
  }
});

// 計算成個行程組合入面所有「步行」路段嘅總距離（米），用嚟喺到達時間／
// 轉車次數／車費都一樣嘅情況下，判斷邊個組合先至真係「行少啲」，
// 避免因為 candidates 陣列順序而隨機揀咗個要行多咗嘅版本。
function totalWalkDistM(plan){
  return (plan.legs || []).reduce((sum, l) => sum + (l.type === "walk" ? (l.distM || 0) : 0), 0);
}

// 計算一個方案「第一次真正上到車」嘅時間——即係第一個 type !== "walk"
// 嘅 leg 嘅 departTime，唔係起點行去總站嗰段步行嘅開始時間。用嚟喺
// pruneDominatedPlans() 度判斷「呢個方案使唔使等好耐先開車」，避免將
// 出發快啲、但到達遲少少嘅方案，同到達快啲、但要等好耐先上到車嘅方案
// 混為一談。
function firstBoardTimeOf(plan){
  const legs = plan.legs || [];
  const rideLeg = legs.find(l => l && l.type !== "walk" && l.departTime);
  if (rideLeg) return rideLeg.departTime;
  return plan.searchStartTime || (legs[0] && legs[0].departTime) || null;
}

function sortResults(results){
  const fareOf = p => typeof p.totalFare === "number" ? p.totalFare : Infinity;
  // 轉乘質性分（0-100，見 calculateTransferQualityScore()）只做「最後一項」
  // tie-break：一定要時間/車費/轉車次數/步行距離呢啲主要準則完全打和先會
  // 用到，唔會凌駕主排序準則，亦唔會令任何方案喺呢一步被淘汰——純粹喺
  // 「其他條件都一樣」嘅時候，優先揀轉乘判斷質素較高（賞多罰少）嗰個。
  const qualityOf = p => typeof p.transferQualityScore === "number" ? p.transferQualityScore : 100;
  if (sortMode === "time") {
    // 最早到達模式：淨係比較實際到達時間，唔再加返轉車／跨公司轉車等人為懲罰分數
    // (嗰啲懲罰淨係喺搜尋階段用嚟揀路線，唔應該再影響最終「邊個最早到」嘅排序)，
    // 到達時間一樣先至用總車費做次要比較準則。
    results.sort((a,b) => {
      const timeDiff = a.arriveTime - b.arriveTime;
      if (timeDiff !== 0) return timeDiff;
      const fareDiff = fareOf(a) - fareOf(b);
      if (fareDiff !== 0) return fareDiff;
      // 到達時間、車費都一樣，先至比較邊個組合行少啲路（避免無謂步行嘅版本
      // 純粹因為順序關係排咗喺前面）。
      const walkDiff = totalWalkDistM(a) - totalWalkDistM(b);
      if (walkDiff !== 0) return walkDiff;
      return qualityOf(b) - qualityOf(a);
    });
  } else if (sortMode === "fare") {
    // 車費模式：優先車費平嘅放最上，車費一樣先至比較邊個到達時間較早。
    results.sort((a,b) => {
      const fareDiff = fareOf(a) - fareOf(b);
      if (fareDiff !== 0) return fareDiff;
      const timeDiff = a.arriveTime - b.arriveTime;
      if (timeDiff !== 0) return timeDiff;
      return qualityOf(b) - qualityOf(a);
    });
  } else if (sortMode === "transfers") {
    // 轉車最少模式：優先轉車次數少嘅放最上，轉車次數一樣先至比較總車費邊個平。
    results.sort((a,b) => {
      if (a.transfers !== b.transfers) return a.transfers - b.transfers;
      const fareDiff = fareOf(a) - fareOf(b);
      if (fareDiff !== 0) return fareDiff;
      return qualityOf(b) - qualityOf(a);
    });
  }
}

// 剔除「被支配」嘅組合：如果另一個組合到達時間唔遲於佢、轉車次數唔多過佢、
// 車費都唔貴過佢、行嘅路都唔行多過佢、上車時間都唔遲過佢，而且喺其中最少
// 一項係實際上更好，咁呢個組合就係無謂嘅——
// 【加入「上車時間」做多一個維度】用戶反映：搜尋結果淨係得一個「直達、
// 但要等好耐先開車」嘅方案（例如 08:46 出發搜尋，第一程 10:15 先上車），
// 完全睇唔到其他出發快啲嘅選擇。追查落去，成因係呢度舊有嘅 dominance
// 判斷淨係比較到達時間／轉車次數／車費／步行距離，完全冇比較「幾耐之後
// 先上到車」——只要嗰個「直達」方案到達時間夠早、轉車夠少、車費夠平，
// 就會將所有出發時間早啲、但到達遲少少嘅替代方案全部當「被支配」剔走，
// 令用戶淨係見到單一、要苦等嘅方案。而家加返 firstBoardTimeOf() 呢個
// 維度：一個方案要支配另一個，除咗原有四項準則，仲要「上車時間都唔遲
// 過」先算數——噉樣「出發快啲、到達遲少少」嘅方案就唔會再被「到達快啲、
// 但要等好耐先開車」嘅方案完全殺晒，兩者可以並存喺結果入面，等用戶自己
// 揀「情願早啲出發」定係「情願搭直達車」。
function pruneDominatedPlans(plans){
  return plans.filter(p => {
    const pWalk = totalWalkDistM(p);
    const pSpec = p.isSpeculative ? 1 : 0;
    const pBoard = firstBoardTimeOf(p);
    return !plans.some(q => {
      if (q === p) return false;
      const notLaterArrival = q.arriveTime <= p.arriveTime;
      const notMoreTransfers = q.transfers <= p.transfers;
      const qFare = typeof q.totalFare === "number" ? q.totalFare : null;
      const pFare = typeof p.totalFare === "number" ? p.totalFare : null;
      const notCostlier = (qFare === null || pFare === null) ? true : qFare <= pFare;
      const qWalk = totalWalkDistM(q);
      const notMoreWalk = qWalk <= pWalk;
      const qSpec = q.isSpeculative ? 1 : 0;
      const notMoreSpeculative = qSpec <= pSpec;
      const qBoard = firstBoardTimeOf(q);
      // 冇任何一方有效嘅上車時間資料就唔阻攔，維持原有行為，避免因為
      // 資料缺失反而誤剔走本身正常嘅方案。
      const notLaterBoard = (qBoard && pBoard) ? qBoard <= pBoard : true;
      if (!notLaterArrival || !notMoreTransfers || !notCostlier || !notMoreWalk || !notMoreSpeculative || !notLaterBoard) return false;
      const strictlyBetter =
        q.arriveTime < p.arriveTime ||
        q.transfers < p.transfers ||
        (qFare !== null && pFare !== null && qFare < pFare) ||
        qWalk < pWalk ||
        qSpec < pSpec ||
        (qBoard && pBoard && qBoard < pBoard);
      return strictlyBetter;
    });
  });
}

    card.innerHTML = `
      <div class="result-head">
        <div>
          <span class="rank-tag">${rankText}</span>
          <span class="times">
            ${fmtTime(displayStartTime)}<span class="sep">➔</span><span class="arr">${fmtTime(lastLeg.arriveTime)}</span>
          </span>
        </div>
        <div class="stats">
          <b>${plan.totalMinutes}</b> 分鐘<br>
          ${plan.transfers === 0 ? "直達" : `轉車 ${plan.transfers} 次`}

        🔍 <b>排序總得分 (僅 Debug 模式顯示)</b>：
        轉乘質性得分 <b>${typeof plan.transferQualityScore === "number" ? plan.transferQualityScore : 100}</b> / 100　|　
        總步行距離 <b>${totalWalkDistM(plan)}</b> 米　|　
        到達時間 <b>${fmtTime(lastLeg.arriveTime)}</b>　|　
        車費 <b>${typeof plan.totalFare === "number" ? "$" + plan.totalFare.toFixed(1) : "-"}</b>　|　
        轉車次數 <b>${plan.transfers}</b>
        <br><span style="color:#888;">（依家排序模式：${sortMode === "time" ? "最早到達" : sortMode === "fare" ? "車費最平" : "轉車最少"}，主要準則打和先會用轉乘質性得分斷㨂）</span>

        const isInterchange = lIdx > 0 && lIdx < plan.legs.length - 1;
        // 站內轉乘
        const prevRideLeg = isInterchange ? plan.legs[lIdx - 1] : null;
        const nextRideLeg = isInterchange ? plan.legs[lIdx + 1] : null;
        const isRailInterchangeWalk = !!(isInterchange &&
          prevRideLeg && prevRideLeg.type === "ride" && isRailCo(prevRideLeg.co) &&
          nextRideLeg && nextRideLeg.type === "ride" && isRailCo(nextRideLeg.co));
        // 終點名顯示修正
        const isLastLeg = lIdx === plan.legs.length - 1;
        const destStopHtml = isLastLeg ? `
            <div class="stopname" style="margin-top:4px;">
              ${escapeHtml(leg.toName || destination?.name || "終點")}
              ${leg.arriveTime ? `<span class="t">${fmtTime(leg.arriveTime)}</span>` : ""}
            </div>` : "";
        const walkboxText = isRailInterchangeWalk
          ? `站內轉乘步行時間約 ${leg.minutes} 分鐘`
          : `${isInterchange ? "轉乘步行" : "步行"}約 ${fmtDist(leg.distM)} (約 ${leg.minutes} 分鐘)`;
        legEl.innerHTML = `
          <div class="rail"><div class="dot"></div><div class="bar"></div></div>
          <div class="content">
            <div class="stopname">${escapeHtml(leg.fromName)}</div>
            <div class="walkbox">
              🚶 ${walkboxText}
            </div>
            ${destStopHtml}
          </div>
        `;
      } else {
        legEl.className = "leg ride";
        const isLive = !leg.isSpeculative;
        const tagHtml = isLive 
          ? `<span class="live-tag">實時班次</span>`
          : `<span class="est-tag">推算班次</span>`;
        const fareHtml = (typeof leg.fare === "number") ? `<span class="dur">$${leg.fare.toFixed(1)}</span>` : "";
        // 城巴 L1/L2 轉乘優惠：官方資料證實有折扣資格，但原始資料源冇提供
        // 實際 $ 金額，所以唔改動上面顯示嘅車費數字，淨係加個提示話俾
        // 用戶知實際拍卡應該平過現時顯示嘅價錢
        const ctbDiscountHint = leg.hasUnquantifiedCtbDiscount
          ? `<span class="ctb-discount-hint" title="城巴官方資料顯示呢程符合轉乘優惠資格，但未有提供實際扣減金額，實際車費以拍卡為準">符合城巴轉乘優惠</span>`
          : "";
        
        // 判斷是否為同名站點，若是則標註原站轉乘
        const prevLeg = lIdx > 0 ? plan.legs[lIdx-1] : null;
        const isSameStopTransfer = prevLeg && prevLeg.type === "walk" && prevLeg.distM === 0;
        const sameStopLabel = isSameStopTransfer ? `<span class="samestop"> 原站轉乘</span>` : "";

        // 港鐵出口顯示位（淨係 co==="mtr" 先加，畀落面 async 補填出口資訊）
        const isMtrLeg = leg.co === "mtr";
        const nextLeg = lIdx < plan.legs.length - 1 ? plan.legs[lIdx + 1] : null;
        const nextNextLeg = (nextLeg && nextLeg.type === "walk" && lIdx + 2 < plan.legs.length) ? plan.legs[lIdx + 2] : null;
        const prevPrevLeg = (prevLeg && prevLeg.type === "walk" && lIdx - 2 >= 0) ? plan.legs[lIdx - 2] : null;
        const isBoardRailInterchange = !!(prevPrevLeg && prevPrevLeg.type === "ride" && isRailCo(prevPrevLeg.co));
        const isAlightRailInterchange = !!(nextNextLeg && nextNextLeg.type === "ride" && isRailCo(nextNextLeg.co));
        const boardExitHtml = (isMtrLeg && !isBoardRailInterchange) ? `<span class="mtr-exit" data-exit-role="board"></span>` : "";
        const alightExitHtml = (isMtrLeg && !isAlightRailInterchange) ? `<span class="mtr-exit" data-exit-role="alight"></span>` : "";

        legEl.innerHTML = `
          <div class="rail"><div class="dot"></div><div class="bar"></div></div>
          <div class="content">
            <div class="stopname">
              ${escapeHtml(legDisplayStopName(leg, leg.boardStopId))}${sameStopLabel}${boardExitHtml}
              <span class="t">${fmtTime(leg.departTime)}</span>
            </div>
            <div class="ridebox">
              <span class="routeno ${escapeHtml(String(leg.co || "").trim().toLowerCase())}">${escapeHtml(leg.routeNo)}</span>
              往 ${escapeHtml(leg.r?.dest?.zh || "目的地")} 
              <span class="dur">(約 ${Math.round((leg.arriveTime - leg.departTime)/60000)} 分鐘)</span>
              ${fareHtml}
              ${tagHtml}
              ${ctbDiscountHint}
            </div>
            <div class="stopname" style="margin-top:4px;">
              ${escapeHtml(legDisplayStopName(leg, leg.alightStopId))}${alightExitHtml}
              <span class="t">${fmtTime(leg.arriveTime)}</span>
            </div>
          </div>
        `;

        // 顯示建議出口
        if (isMtrLeg && (!isBoardRailInterchange || !isAlightRailInterchange)) {
          (async () => {
            try {
              const [boardExit, alightExit] = await Promise.all([
                isBoardRailInterchange ? null : pickBestMtrExit(leg.boardStopId, _pointBeforeLeg(plan, lIdx)),
                isAlightRailInterchange ? null : pickBestMtrExit(leg.alightStopId, _pointAfterLeg(plan, lIdx))
              ]);
              if (boardExit) {
                const el = legEl.querySelector('.mtr-exit[data-exit-role="board"]');
                if (el) el.textContent = ` · 建議使用 ${boardExit.exit} 出口入站`;
              }
              if (alightExit) {
                const el = legEl.querySelector('.mtr-exit[data-exit-role="alight"]');
                if (el) el.textContent = ` · 建議使用 ${alightExit.exit} 出口出站`;
              }
            } catch (e) { /* 出口配對非必要 */ }
          })();
        }
      }
      
      if (lIdx === plan.legs.length - 1) {
        const bar = legEl.querySelector(".bar");
        if (bar) bar.style.display = "none";
      }
      
      legsContainer.appendChild(legEl);
    });

    // 輕按方案卡彈出地圖，可視化顯示行程路線
    card.addEventListener("click", () => {
      showTripMap(plan, rankText);
    });

    resultsWrap.appendChild(card);
  });
}
