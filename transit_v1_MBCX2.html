<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>行程搜尋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght=400;500;700;900&family=JetBrains+Mono:wght=400;500;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://data.etabus.gov.hk">
<link rel="preconnect" href="https://rt.data.gov.hk">
<link rel="preconnect" href="https://seep.eu.org">
<link rel="dns-prefetch" href="https://opendata.mtr.com.hk">
<link rel="dns-prefetch" href="https://raw.githubusercontent.com">
<link rel="dns-prefetch" href="https://timeinterval.hkbuseta.com">
<link rel="dns-prefetch" href="https://www.sunferry.com.hk">
<link rel="dns-prefetch" href="https://hkkfeta.com">
<link href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Aboreto&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<style>
  :root{
    --ink:#14181c;
    --paper:#f3f1ea;
    --card:#ffffff;
    --line:#dcd7c9;
    --kmb:#c8102e;
    --ctb:#f6a800;
    --nlb:#0f6b3f;
    --gmb:#1b6e6e;
    --mtr:#a3004c;
    --mtrb: #a51c30;
    --lr:#6b8e23;
    --forf:#ee0029;
    --hkf:#2d5a87;
    --sunf:#0bbbef;
    --accent:#c8102e;
    --accent-ink:#ffffff;
    --muted:#6b6458;
    --walk:#8a8377;
    --good:#0f6b3f;
    --radius:14px;
  }

@font-face {
  font-family: 'Johnston100-Medium';
  src: url("https://seep.eu.org/https://mrdarrengriffin.com/Johnston100-Medium.woff2") format("woff2"), url("https://seep.eu.org/https://mrdarrengriffin.com/Johnston100-Medium.woff") format("woff");
  font-display: swap; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Johnston100-Medium',"Chiron Hei HK","Noto Sans HK",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:60px;
  }
  .mono{font-family:"JetBrains Mono",monospace;}
  header.top{
    background:var(--ink);
    color:#f4f1e8;
    padding:22px 20px 26px;
    position:relative;
    overflow:hidden;
  }
  header.top::after{
    content:"";
    position:absolute; right:-40px; top:-40px; width:180px;height:180px;
    background:radial-gradient(circle, rgba(200,16,46,.55), transparent 70%);
    pointer-events:none;
  }
  header.top h1{
    margin:0 0 4px;
    font-size:22px;
    letter-spacing:.5px;
    font-weight:900;
  }
  header.top p{
    margin:0;
    font-size:12.5px;
    color:#b9b2a1;
  }

  button{
    font-family:'Johnston100-Medium',"Chiron Hei HK",-apple-system,BlinkMacSystemFont,sans-serif;
  }

  .badge-strip{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .co-chip{font-size:10.5px; padding:3px 8px; font-weight:700; letter-spacing:.4px;}
  .co-chip.kmb{background:var(--kmb);color:#fff;}
  .co-chip.ctb{background:var(--ctb);color:#fff;}
  .co-chip.nlb{background:var(--nlb);color:#fff;}
  .co-chip.gmb{background:var(--gmb);color:#fff;}
  .co-chip.mtr{background:var(--mtr);color:#fff;}
  .co-chip.mtrb {background:var(--mtrb);color:#fff;}
  .co-chip.lightrail{background:var(--lr);color:#fff;}

  main{max-width:640px;margin:0 auto;padding:16px;}

  .panel{
    background:var(--card);
    padding:16px;
    margin-bottom:14px;
  }
  .field{position:relative;margin-bottom:10px;}
  .field label{
    display:block; font-size:11px; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.6px; margin-bottom:4px;
  }
  .field input{
    width:100%; padding:11px 12px; font-size:15px;
    border:1.5px solid var(--line);
    background:#fbfaf6; color:var(--ink); font-family:inherit;
  }
  .field input:focus{outline:none; border-color:var(--accent);}
  .swap-row{display:flex; align-items:center; gap:8px;}
  .swap-row .fields{flex:1;}
  #swapBtn{
    width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);
    background:#fbfaf6; cursor:pointer; font-size:16px; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s;
  }
  #swapBtn:active{transform:rotate(180deg);}

  /* 巴士站選點地圖 */
  #stopMapWrap{margin-bottom:12px;}
  #stopMap{
    height:360px; width:100%; border:1.5px solid var(--line);
    background:#e5e2d8; position:relative; z-index:0;
  }
  #mapZoomHint{
    font-size:11.5px; color:var(--muted); margin-top:5px; text-align:center;
  }
  #mapZoomHint.active{color:var(--good); font-weight:700;}
  .map-popup-title{font-size:13px; font-weight:800; color:var(--ink);}
  .map-popup-sub{font-size:11px; color:var(--muted); margin-top:2px;}
  .map-pick-btns{display:flex; gap:6px; margin-top:7px;}
  .map-pick-btns button{
    flex:1; font-size:11.5px; font-weight:700; padding:6px 4px;
    border:1.5px solid var(--line); background:#fbfaf6; cursor:pointer;
    font-family:inherit; color:var(--ink);
  }
  .map-pick-btns button.origin-btn:hover{background:var(--accent); color:#fff; border-color:var(--accent);}
  .map-pick-btns button.dest-btn:hover{background:var(--ink); color:#fff; border-color:var(--ink);}
  .leaflet-popup-content{margin:8px 10px;}
  .leaflet-popup-content-wrapper{font-family:Johnston100-Medium,Chiron Hei HK;}

  .suggest{
    position:absolute; z-index:20; left:0; right:0; top:100%;
    background:var(--card); border:1px solid var(--line); border-top:none;
    max-height:260px; overflow-y:auto;
    box-shadow:0 8px 20px rgba(0,0,0,.08);
  }
  .suggest button{
    display:block; width:100%; text-align:left; padding:9px 12px;
    background:none; border:none; border-bottom:1px solid #f0eee6;
    font-size:13.5px; cursor:pointer; font-family:inherit; color:var(--ink);
  }
  .suggest button:hover{background:#f6f4ec;}
  .suggest button small{display:block;color:var(--muted); font-size:11px;}
  .suggest .empty{padding:10px 12px; color:var(--muted); font-size:12.5px;}

  .criteria-row { display: flex; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
  .crit-btn{
    flex:1; padding:9px 6px; font-size:12.5px; font-weight:700;
    border:1.5px solid var(--line); background:#fbfaf6;
    cursor:pointer; color:var(--muted);
  }
  .crit-btn.active{background:var(--ink); border-color:var(--ink); color:#fff;}
  .crit-btn[disabled]{opacity:.45; cursor:not-allowed;}

  #searchBtn{
    width:100%; margin-top:12px; padding:13px; font-size:15px; font-weight:900;
    background:var(--accent); color:#fff; border:none;
    cursor:pointer; letter-spacing:.4px;
  }
  #searchBtn:disabled{background:#b7b0a0; cursor:wait;}

  .status-line{font-size:12px; color:var(--muted); margin-top:8px; min-height:16px;}
  .status-line.err{color:#a4132b;}

  .result-meta{
    display:flex; justify-content:space-between; align-items:center;
    font-size:11.5px; color:var(--muted); margin:2px 2px 10px;
  }
  #refreshBtn{
    background:none;border:1px solid var(--line);border-radius:8px;
    font-size:11.5px; padding:4px 9px; cursor:pointer; color:var(--ink); font-family:inherit;
  }

  .result-card{
    background:var(--card);
    margin-bottom:12px; overflow:hidden;
    cursor:pointer; /* 可輕按整張卡，喺地圖睇返成個行程路線 */
    -webkit-tap-highlight-color: rgba(200,16,46,.12);
  }
  .result-card:active{ background:#fbfaf6; }
  .result-head .map-hint{
    font-size:10px; color:var(--muted); margin-top:3px; letter-spacing:.2px;
  }
  .result-head .map-hint::before{ content:"🗺️ "; }

/* Footer */
    .footer {
      font-family: 'Aboreto', serif;
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 50px;
      margin-top: -50px;
      background-color: black;
    }

  /* ---------------- 行程地圖 Modal ---------------- */
  #tripMapOverlay{
    position:fixed; inset:0; z-index:2000; background:rgba(20,24,28,.55);
    display:flex; align-items:flex-end; justify-content:center;
  }
  #tripMapOverlay[hidden]{ display:none; }
  #tripMapSheet{
    background:var(--paper); width:100%; max-width:640px; height:88vh;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 -4px 24px rgba(0,0,0,.25);
  }
  #tripMapHead{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; background:var(--ink); color:#f4f1e8; flex-shrink:0;
  }
  #tripMapHead .title{ font-size:14px; font-weight:900; letter-spacing:.3px; }
  #tripMapHead .sub{ font-size:11px; color:#b9b2a1; margin-top:2px; }
  #tripMapCloseBtn{
    background:rgba(255,255,255,.12); border:none; color:#fff; width:30px; height:30px;
    border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0; line-height:1;
  }
  #tripMapCanvas{ flex:1; min-height:0; background:#e6e3d8; }
  #tripMapStatus{
    padding:6px 14px; font-size:11px; color:var(--muted); background:#fbfaf6;
    border-top:1px solid var(--line); flex-shrink:0; line-height:1.5;
  }
  .trip-map-legroute{ font-weight:700; }
  .trip-map-approx{ color:#a4132b; }
  .leaflet-div-icon.trip-stop-dot{ background:#fff; border:2px solid var(--ink); border-radius:50%; }
  .leaflet-div-icon.trip-endpoint-icon{ background:transparent; border:none; }
  .result-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; background:#fbfaf6; border-bottom:1px solid var(--line);
  }
  .result-head .times{font-size:19px; font-weight:700;}
  .result-head .times .arr{color:var(--accent);}
  .result-head .sep{color:var(--muted); font-weight:400; padding:0 4px;}
  .result-head .stats{text-align:right; font-size:11.5px; color:var(--muted);}
  .result-head .stats b{color:var(--ink); font-size:16px;}
  .rank-tag{
    display:inline-block; font-size:10px; font-weight:800; letter-spacing:.4px;
    background:var(--ink); color:#fff; padding:2px 7px; margin-right:8px;
  }

  .legs{padding:12px 14px 14px;}
  .leg{display:flex; gap:10px; padding:7px 0;}
  .leg .rail{width:20px; flex-shrink:0; display:flex; flex-direction:column; align-items:center;}
  .leg .dot{width:9px;height:9px;border-radius:50%;background:var(--ink); margin-top:4px;}
  .leg .bar{flex:1; width:2px; background:var(--line); margin:2px 0;}
  .leg.walk .bar, .leg.walk .dot{background:var(--walk);}
  .leg .content{flex:1; padding-bottom:2px;}
  .leg .stopname{font-size:13.5px; font-weight:700;}
  .leg .stopname .t{float:right; font-size:12.5px; color:var(--muted);}
  .leg.ride .stopname .t{color:var(--ink); font-weight:700;}
  .ridebox{
    margin:4px 0 4px 0; padding:8px 10px; background:#fbfaf6;
    font-size:12.5px;
  }
  .ridebox .routeno{
    font-family:"Johnston100-Medium", sans-serif; font-weight:500; font-size:18px; color:#fff;
    padding:2px 4px; border-radius:5px; margin-right:6px;
  }
  .ridebox .routeno.kmb{background:var(--kmb);}
  .ridebox .routeno.ctb{background:var(--ctb);}
  .ridebox .routeno.nlb{background:var(--nlb);}
  .ridebox .routeno.gmb{background:var(--gmb);}
  .ridebox .routeno.mtr{background:var(--mtr);}
  .ridebox .routeno.mtrb{background:var(--mtrb);}
  .ridebox .routeno.lightrail{background:var(--lr);}
  .ridebox .routeno.fortuneferry{background:var(--forf);}
  .ridebox .routeno.hkkf{background:var(--hkf);}
  .ridebox .routeno.sunferry{background:var(--sunf);}
  .ridebox .dur{color:var(--muted);}
  .ridebox .live-tag{font-size:10px; padding:1px 6px; border-radius:10px; background:#e4f3ea; color:var(--good); font-weight:700; margin-left:4px;}
  .ridebox .est-tag{font-size:10px; padding:1px 6px; background:#f4e9c9; color:#7a5c00; font-weight:700; margin-left:4px;}
  .ridebox .ctb-discount-hint{font-size:10px; padding:1px 6px; border-radius:10px; background:#e7ecff; color:#3448c5; font-weight:700; margin-left:4px;}
  .walkbox{font-size:12px; color:var(--walk); padding:2px 0 2px;}
  .samestop{font-size:10.5px; color:var(--good); font-weight:700;}
  .mtr-exit{font-size:10.5px; color:var(--mtr); font-weight:700;}

  .empty-state, .loading-state{
    text-align:center; padding:36px 16px; color:var(--muted); font-size:13.5px;
  }
  .loading-state .spinner{
    width:26px;height:26px;border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent);
    margin:0 auto 12px; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .note{font-size:11.5px; color:var(--muted); line-height:1.6; padding:2px 4px;}
  .note b{color:var(--ink);}
  footer.disclaimer{
    max-width:640px;margin:6px auto 0;padding:14px 16px 0; font-size:11px; color:#8a8474; line-height:1.7;
  }

  /* 自選模式專屬樣式 */
  .custom-leg-card {
    background: #fbfaf6;
    border: 1.5px solid var(--line);
    padding: 14px;
    margin-bottom: 12px;
    position: relative;
  }
  .custom-leg-card .leg-title {
    font-size: 13px;
    font-weight: 900;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .custom-leg-card .leg-title-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .custom-leg-card .move-up-btn, .custom-leg-card .move-down-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
    padding: 0 2px;
    line-height: 1;
  }
  .custom-leg-card .move-up-btn:hover, .custom-leg-card .move-down-btn:hover {
    color: var(--ink);
  }
  .custom-leg-card .move-up-btn:disabled, .custom-leg-card .move-down-btn:disabled {
    color: #d8d3c4;
    cursor: default;
  }
  .custom-leg-card .delete-leg-btn {
    background: none;
    border: none;
    color: var(--kmb);
    font-weight: 700;
    cursor: pointer;
    font-size: 12px;
  }
  .custom-leg-card .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  .custom-leg-card select, .custom-leg-card input {
    width: 100%;
    padding: 10px;
    font-size: 13.5px;
    border: 1px solid var(--line);
    background: #fff;
    font-family: inherit;
    color: var(--ink);
  }
  .custom-leg-card select:focus, .custom-leg-card input:focus {
    outline: none;
    border-color: var(--accent);
  }
  /* 一般搜尋模式起點/終點自動完成選單：港鐵／輕鐵站名旁邊嘅細 logo。
     Logo 擺喺中文站名右邊（見 renderSuggest()）,所以用 margin-left
     嚌住個 logo 同前面文字之間嘅空隙,唔再用 margin-right。 */
  .station-mode-icon {
    width: 13px;
    height: 13px;
    vertical-align: -1px;
    margin-left: 4px;
    display: inline-block;
  }
</style>
</head>
<body>

<header class="top">
  <h1>行程搜尋</h1>
  <p>輸入起點同終點,参考 API 自動計算實時行程</p>
  <div class="badge-strip">
    <span class="co-chip kmb">九巴 KMB</span>
    <span class="co-chip ctb">城巴 CTB</span>
    <span class="co-chip nlb">嶼巴 NLB</span>
    <span class="co-chip gmb">專線小巴 GMB</span>
    <span class="co-chip mtrb">港鐵巴士 MTRB</span>
    <span class="co-chip lightrail">輕鐵 LRT</span>
  </div>
</header>

<main>
  <div class="panel">
    <div id="standardInputsWrap">
      <!-- 巴士站選點地圖：放大至約1公里範圍後,會根據地理資料顯示附近巴士站,
           撳站牌可直接設為起點/終點,令選點更可視化 -->
      <div id="stopMapWrap">
        <div id="stopMap"></div>
        <div id="mapZoomHint">放大地圖至約 1 公里範圍，即顯示附近巴士站可供選擇</div>
      </div>

      <!-- GPS 起點按鈕 -->
      <button id="gpsBtn" style="width:100%; margin-bottom:12px; padding:11px; background:#fbfaf6; border:1.5px solid var(--line); cursor:pointer; color:var(--ink); font-size: 13.5px; font-weight: 700;">GPS 設定起點</button>
      
      <div class="swap-row">
        <div class="fields">
          <div class="field">
            <label>起點</label>
            <input id="originInput" type="text" placeholder="輸入出發地" autocomplete="off">
            <div class="suggest" id="originSuggest" hidden></div>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>終點</label>
            <input id="destInput" type="text" placeholder="輸入目的地" autocomplete="off">
            <div class="suggest" id="destSuggest" hidden></div>
          </div>
        </div>
        <button id="swapBtn" title="對調起點終點">⇅</button>
      </div>
    </div>

    <label style="display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:10px 2px 6px;">排序準則</label>
    <div class="criteria-row">
      <button class="crit-btn active" data-crit="time">最早到達</button>
      <button class="crit-btn" data-crit="fare" disabled title="資料載入中">車費</button>
      <button class="crit-btn" data-crit="transfers">轉車最少</button>
      <button class="crit-btn" data-crit="custom" id="customModeBtn">自選行程</button>
    </div>

    <!-- 出發時間按鈕與 Time Picker -->
    <label style="display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:12px 2px 6px;">出發時間</label>
    <div class="criteria-row">
      <button class="crit-btn active" id="timeNowBtn">現在出發</button>
      <button class="crit-btn" id="timeCustomBtn">指定時間出發</button>
    </div>
    <div id="timePickerWrap" style="display:none; margin-top:8px;">
      <input type="datetime-local" id="customTimeInput" style="width:100%; padding:11px 12px; font-size:15px; border:1.5px solid var(--line); background:#fbfaf6; color:var(--ink); font-family:inherit;">
    </div>

    <button id="searchBtn" disabled>載入路線資料中</button>
    <div class="status-line" id="statusLine"></div>

    <div id="customPanel" style="display:none; margin-top: 12px; padding: 0;">
      <div id="customLegsContainer"></div>
      <button id="addCustomLegBtn" style="width:100%; margin-top:8px; padding:10px; background:#fbfaf6; border:1.5px solid var(--line); cursor:pointer; color:var(--ink); font-size: 13.5px; font-weight: bold;">+ 增加一程</button>
      <button id="calcCustomBtn" style="width:100%; margin-top:12px; padding:13px; font-size:15px; font-weight:900; background:var(--accent); color:#fff; border:none; cursor:pointer; letter-spacing:.4px;">計算自選行程</button>
    </div>
  </div>

  <div id="resultsWrap"></div>

  <!-- 行程路線地圖 Modal：輕按方案卡後彈出，喺 Leaflet 地圖上畫返成個行程嘅路線 -->
  <div id="tripMapOverlay" hidden>
    <div id="tripMapSheet">
      <div id="tripMapHead">
        <div>
          <div class="title" id="tripMapTitle">行程路線</div>
          <div class="sub" id="tripMapSub"></div>
        </div>
        <button id="tripMapCloseBtn" aria-label="關閉">✕</button>
      </div>
      <div id="tripMapCanvas"></div>
      <div id="tripMapStatus"></div>
    </div>
  </div>

  <footer class="disclaimer">

// 用 union-find 將 dataSheet.stopMap 呢份「兩兩關聯」資料，併埋做連通
// 分量——同一個轉乘點入面成班 stopId（唔理中間轉咗幾多手 kmb/ctb/gmb/
// lightRail 關聯）最終都會歸埋做同一組，唔使逐個 pair 手動查。stopMap
// 本身有少量（樣本量度大約 6%）唔對稱嘅 edge（A 提到 B,但 B 冇提到
// A）,union-find 對呢種情況天然頂得住,唔會漏併。
function buildAuthoritativeStopGroups(stopMap) {
  const result = new Map();
  if (!stopMap) return result;
  const parent = new Map();
  function find(x) {
    let root = x;
    while (parent.get(root) !== root) root = parent.get(root);
    while (parent.get(x) !== root) { const next = parent.get(x); parent.set(x, root); x = next; }
    return root;
  }
  function union(a, b) {
    if (!parent.has(a)) parent.set(a, a);
    if (!parent.has(b)) parent.set(b, b);
    const ra = find(a), rb = find(b);
    if (ra !== rb) parent.set(ra, rb);
  }
  for (const [stopId, entries] of Object.entries(stopMap)) {
    if (!parent.has(stopId)) parent.set(stopId, stopId);
    if (!Array.isArray(entries)) continue;
    for (const entry of entries) {
      const other = entry && entry[1];
      if (!other) continue;
      union(stopId, other);
    }
  }
  const groupsByRoot = new Map();
  for (const id of parent.keys()) {
    const root = find(id);
    if (!groupsByRoot.has(root)) groupsByRoot.set(root, []);
    groupsByRoot.get(root).push(id);
  }
  for (const members of groupsByRoot.values()) {
    for (const id of members) result.set(id, members);
  }
  return result;
}

// 【輕鐧站代號格式唔一致】本 app 自己嗰套 r.lrStationCodes 嚟自
// light_rail_routes_and_stops.csv（例如 "LR1"、"LR010"，同 getLightRailIntervalSeconds()
// 頂部註解提到嗰種前導零唔一致問題一樣），data_full.json 嘅 lrtData 用嘅
// 亦係呢種「LR」字首＋數字嘅格式，但前導零寫法可能唔啱好對得上——逐個
// 候選寫法（原字串／去除前導零／純數字／LR+數字／LR+三位補零）都試一次。
function _lrCodeCandidates(code) {
  const s = String(code == null ? "" : code).trim();
  const out = new Set([s]);
  const stripped = s.replace(/^0+(?=\d)/, "");
  if (stripped) out.add(stripped);
  const numPart = s.replace(/^LR/i, "");
  const n = Number(numPart);
  if (Number.isFinite(n)) {
    out.add(String(n));
    out.add("LR" + n);
    out.add("LR" + String(n).padStart(3, "0"));
  }
  return [...out];
}

// 用 data_full.json 嘅 lrtData（官方輕鐧逐站頭/尾班車時刻）計返「board
// 站去 towardsCode 呢個方向」嘅今日服務窗口,以分鐧為單位、並以清晨
// 4:00 為服務日分界（等尾班車時間例如 "00:49" 可以同頭班車 "05:18" 擺
// 埋同一條數線上比較,唔會因為跨咗午夜就變成「負數」或者「細過頭班
// 車」）。優先撞 towardsCode 嗰個精確目的地 entry——同一個站去唔同方
// 向,頭/尾班車實際可以差好遠,用「掃全部目的地揾 min/max」嗰種籠統範
// 圍會誤將某條線嘅時間應用去另一條線。撞唔中先退落用返嗰個籠統
// min/max 做保底,再撞唔中就傳 null,等叫用嗰邊照舊退落用返 roughHeadway
// 估算,唔強行假設冇車。回傳多個 exact 標記,等用嗰邊知道呢個窗口係精
// 確目的地撞中,定係退落用嘅籠統保底範圍。
function getLrServiceWindowMinutes(boardCode, towardsCode) {
  if (!lrtFirstLastDb) return null;
  let stationData = null;
  for (const cand of _lrCodeCandidates(boardCode)) {
    if (lrtFirstLastDb[cand]) { stationData = lrtFirstLastDb[cand]; break; }
  }
  if (!stationData) return null;

  const toServiceMin = (hhmm) => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || "").trim());
    if (!m) return null;
    const raw = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
    return ((raw - 4 * 60) + 1440) % 1440;
  };

  if (towardsCode && stationData.first_trains && stationData.last_trains) {
    for (const cand of _lrCodeCandidates(towardsCode)) {
      const firstEntry = stationData.first_trains[cand];
      const lastEntry = stationData.last_trains[cand];
      if (firstEntry && lastEntry) {
        const firstMin = toServiceMin(firstEntry.time);
        const lastMin = toServiceMin(lastEntry.time);
        if (firstMin !== null && lastMin !== null) {
          return { firstMin, lastMin, toServiceMin, exact: true };
        }
      }
    }
  }

  // 撞唔中精確目的地（可能 towardsCode 冇傳,或者呢對 board/alight 喺
  // first_trains/last_trains 入面冇收錄）,退落用「掃全部目的地揾
  // min/max」做保底範圍。
  let firstMin = null, lastMin = null;
  for (const entry of Object.values(stationData.first_trains || {})) {
    const t = toServiceMin(entry && entry.time);
    if (t !== null && (firstMin === null || t < firstMin)) firstMin = t;
  }
  for (const entry of Object.values(stationData.last_trains || {})) {
    const t = toServiceMin(entry && entry.time);
    if (t !== null && (lastMin === null || t > lastMin)) lastMin = t;
  }
  if (firstMin === null || lastMin === null) return null;
  return { firstMin, lastMin, toServiceMin, exact: false };
}

// 港鐧（重鐧）版本：同輕鐧一樣,優先撞「board 站 -> 實際 alight 站」嗰個
// 精確 first_trains/last_trains entry——同一個站去唔同方向,頭/尾班車可
// 以差好遠(例如鑽石山 DIH 呢個 KTL/TML 兩線交匯站,去金鐧 ADM 尾班車
// 00:37,去機場 AIR 就 00:21,兩個時間差成十幾分鐧),用全站
// opening/closing 呢種籠統範圍會誤將班次密嗰個方向嘅時間應用去班次疏
// 嗰個方向。
//
// 【重要】仲要核實路線一致：first_trains/last_trains 嗰個 entry 嘅
// path[0].line 代表官方去嗰個 towardsCode 實際搭嗰條線——喺 DIH 呢類
// 兩線交匯站,path[0].line 可能唔係 expectedLine（例如去 ADM 嗰個 entry
// 行 KTL 線,去 AIR 嗰個就行 TML 線）。如果 expectedLine（即係呢條 leg
// 實際行嗰條線,嚟自 r.mtrLineCode）同 path[0].line 唔一致,代表官方
// 呢個 entry 記錄嘅係「轉去另一條線先去到嗰度」嗰個時刻,同而家呢條
// leg 直接沿住 expectedLine 去 alightCode 唔係同一回事,唔應該當佗做
// 精確撞中,寧可撞唔中退落用返 opening/closing 做保底。
function getMtrServiceWindowMinutes(staCode, towardsCode, expectedLine) {
  if (!mtrOpenCloseDb) return null;
  const stationData = mtrOpenCloseDb[staCode];
  if (!stationData) return null;

  const toServiceMin = (hhmm) => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || "").trim());
    if (!m) return null;
    const raw = parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
    return ((raw - 4 * 60) + 1440) % 1440;
  };

  if (towardsCode && stationData.first_trains && stationData.last_trains) {
    const firstEntry = stationData.first_trains[towardsCode];
    const lastEntry = stationData.last_trains[towardsCode];
    if (firstEntry && lastEntry) {
      const lineMatches = (entry) =>
        !expectedLine || !entry.path || !entry.path[0] || entry.path[0].line === expectedLine;
      if (lineMatches(firstEntry) && lineMatches(lastEntry)) {
        const firstMin = toServiceMin(firstEntry.time);
        const lastMin = toServiceMin(lastEntry.time);
        if (firstMin !== null && lastMin !== null) {
          return { firstMin, lastMin, toServiceMin, exact: true };
        }
      }
    }
  }

  if (!stationData.opening || !stationData.closing) return null;
  const firstMin = toServiceMin(stationData.opening);
  const lastMin = toServiceMin(stationData.closing);
  if (firstMin === null || lastMin === null) return null;
  return { firstMin, lastMin, toServiceMin, exact: false };
}

function distM(a, b) {
  // 防禦：如果任一點缺座標（例如個別港鐵站因為官方 CSV／社群 exits.mtr.json
  // 兩個資料來源用字有異體字差異——例如「茘景」(官方) vs「荔景」(社群)——
  // 令 stationCoordByCode 對唔到、location 變成 null），就當呢一段冇額外
  // 距離，唔再直接噴出 "Cannot read properties of null (reading 'lat')"
  // 令成個（尤其係自選）行程計唔到。
  if (!a || !b || !Number.isFinite(a.lat) || !Number.isFinite(a.lng) || !Number.isFinite(b.lat) || !Number.isFinite(b.lng)) {
    return 0;
  }
  const latDist = Math.abs(b.lat - a.lat) * 111320;
  const avgLat = (a.lat + b.lat) / 2;
  const lngDist = Math.abs(b.lng - a.lng) * (40075000 * Math.cos(avgLat * Math.PI / 180) / 360);
  const manhattanDist = latDist + lngDist;
  return manhattanDist * 1.2;
}
const CELL = 0.005;
function cellKey(lat,lng){ return Math.floor(lat/CELL)+","+Math.floor(lng/CELL); }

// 方向計算輔助函數
function bearingDeg(a, b) {
  if (!a || !b || !Number.isFinite(a.lat) || !Number.isFinite(a.lng) || !Number.isFinite(b.lat) || !Number.isFinite(b.lng)) return null;
  const lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const y = Math.sin(dLng) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLng);
  const brng = Math.atan2(y, x) * 180 / Math.PI;
  return (brng + 360) % 360;
}
// 兩個方位角之間嘅夾角（0-180度，唔理順定逆時針），用嚟量度「差幾遠」。
function bearingDiffDeg(b1, b2) {
  if (b1 === null || b1 === undefined || b2 === null || b2 === undefined) return null;
  const diff = Math.abs(b1 - b2) % 360;
  return diff > 180 ? 360 - diff : diff;
}

// 地政總署三維行人路線搜尋
const PEDNET_ROUTE_API = "https://mapapi.hkmapservice.gov.hk/PedRoute/NAServer/route/solve";
const PEDNET_MAX_QUERY_DIST_M = 1500; // 起訖點直線距離超過呢個數,查行人路線已經冇乜意義,直接降級用直線估算
const PEDNET_TRAVEL_MODE = "1";       // 1 = Shortest Path(最短路線),對應返以往 Dijkstra 嘅最短路徑邏輯
const pedRouteCache = new Map();      // 「起點|訖點」座標 key -> 已查詢過嘅路線距離(米,或 null),避免重複打 API

function roundCoordForCache(v){ return Math.round(v * 1e5) / 1e5; } // 約 1 米精度,用嚟做快取 key

// 向地政總署三維行人路線搜尋 API 攞返起、訖兩點之間嘅實際步行路線總長度(米)。
async function fetchPedestrianRouteDistance(fromLoc, toLoc){
  const cacheKey = `${roundCoordForCache(fromLoc.lat)},${roundCoordForCache(fromLoc.lng)}|${roundCoordForCache(toLoc.lat)},${roundCoordForCache(toLoc.lng)}`;
  if (pedRouteCache.has(cacheKey)) return pedRouteCache.get(cacheKey);

  const stops = {
    features: [
      { attributes: { Name: "origin" }, geometry: { x: fromLoc.lng, y: fromLoc.lat } },
      { attributes: { Name: "destination" }, geometry: { x: toLoc.lng, y: toLoc.lat } }
    ]
  };
  const params = new URLSearchParams({
    stops: JSON.stringify(stops),
    travelMode: PEDNET_TRAVEL_MODE,
    outSR: "4326",
    f: "json",
    returnDirections: "false"
  });

  let result = null;
  try {
    const res = await fetch(`${PEDNET_ROUTE_API}?${params.toString()}`);
    if (!res.ok) throw new Error("三維行人路線搜尋 API error");
    const data = await res.json();
    if (data && data.error) throw new Error(data.error.message || "三維行人路線搜尋載入錯誤");
    const totalLength = data?.routes?.features?.[0]?.attributes?.Total_Length;
    if (Number.isFinite(totalLength) && totalLength > 0) result = totalLength;
  } catch (err) {
    console.warn("無法載入地政總署三維行人路線資料,降級至直線估算:", err);
    result = null;
  }
  pedRouteCache.set(cacheKey, result);
  return result;
}

// 用地政總署三維行人路線搜尋取代舊有 OSRM,計算兩點之間實際嘅步行路徑
// 距離。查唔到路線(例如兩點之間根本冇路網連通,或者超出服務範圍),
// 都會 return { success:false },等呼叫方跌落用直線距離 *1.2 保底
// (見 distM() 同各呼叫處嘅 fallback 邏輯),行為同以往 OSRM 失敗時一致。
async function getRealWalkingData(fromLoc, toLoc) {
  const straightM = distM(fromLoc, toLoc);
  if (straightM > PEDNET_MAX_QUERY_DIST_M) return { success: false };

  try {
    const totalDistM = await fetchPedestrianRouteDistance(fromLoc, toLoc);
    if (!Number.isFinite(totalDistM) || totalDistM <= 0) return { success: false };

    return {
      distM: totalDistM,      // 沿三維行人路線搜尋 API 計算嘅實際步行距離 (米)
      durationS: totalDistM / WALK_SPEED_MPS, // 用返本身嘅步行速率估計時間 (秒)
      success: true
    };
  } catch (err) {
    console.warn("三維行人路線步行距離計算失敗,降級至直線估算:", err);
    return { success: false };
  }
}

// === 全局步行距離記憶化快取 ===
const walkCache = new Map();
async function getRealWalkingDataCached(cacheKey, fromLoc, toLoc) {
  if (walkCache.has(cacheKey)) {
    return walkCache.get(cacheKey);
  }
  const result = await getRealWalkingData(fromLoc, toLoc);
  walkCache.set(cacheKey, result);
  return result;
}

// === 地政總署室內地圖 API（港鐵站）——月台↔出口室內步行距離補充 ===
// API 文件: https://portal.csdi.gov.hk/csdi-webpage/apidoc/3d-indoor-mtr-station-map
// 背景：上面「三維行人路線搜尋」（PedRoute NAServer）計算嘅係「出口座標
// （exits.mtr.json，或者冇個別出口資料時用嘅平均座標）」去到目的地嗰段
// 戶外距離；但呢個出口座標本身已經係「行出咗閘口」嗰一點，完全冇計落
// 由月台經閘機、通道、樓梯／扶手電梯，一路行到嗰個出口嘅室內距離——
// 大型轉車站（例如金鐘、九龍塘）月台去到出口隨時要行成幾百米，唔補呢
// 一段會令轉車／步行時間嚴重低估。而家用地政總署嘅室內地圖 API：
//   1) mtr_venue_polygon（唔帶 venue_id 篩選）攞成個港鐧站清單，用站名
//      （中／英文）撞返 venue_id（一次性攞晒，之後淨係喺記憶體查表）。
//   2) mtr_unit_polygon（每個站入面嘅室內分區，例如月台、大堂、通道）
//      + mtr_opening_line（分區之間嘅開口／門口，代表兩個分區互通）—
//      用嚟砌一個「分區質心做節點，開口做邊」嘅室內步行圖。
//   3) 揀返所有屬性欄位入面帶「platform／月台／站台」呢類字眼嘅分區
//      當月台，再用 Dijkstra 揀返「出口所在分區」去最近月台分區嘅室內
//      距離，加落現有戶外步行距離度做補充。
// 呢個 API 冇 documented 出「邊個屬性欄位」講明分區名稱/類別，所以用
// 「掃晒每個字串屬性值撞關鍵字」呢個字段無關做法，唔靠估實際欄位名。
// 攞唔到資料（例如呢個站冇被收錄、API 一時失敗、搵唔到月台分區）都
// 直接回傳 0（唔補），唔會令現有步行距離計算因此中斷或報錯。
const MTR_INDOOR_WFS_BASE = "https://mapapi.hkmapservice.gov.hk/ogc/wfs/indoor";
const MTR_INDOOR_PLATFORM_KEYWORDS = ["platform", "月台", "站台"];

function _mtrIndoorNormalizeName(s) {
  let t = String(s || "").trim();
  if (!t) return "";
  t = t.replace(/\s+/g, "");
  t = t.replace(/(車站|站)$/u, "");
  t = t.toUpperCase().replace(/STATION$/, "");
  return t;
}

// 【港鐵站名 → venue_id】一次性攞晒 mtr_venue_polygon 全部記錄（唔帶
// cql_filter 就係攞全部），撞返站名（中／英文都試），之後淨係查表。
let mtrIndoorVenueByName = null;
let mtrIndoorVenueListPromise = null;
async function _ensureMtrIndoorVenueList() {
  if (mtrIndoorVenueByName) return mtrIndoorVenueByName;
  if (!mtrIndoorVenueListPromise) {
    mtrIndoorVenueListPromise = (async () => {
      const map = new Map();
      try {
        const url = `${MTR_INDOOR_WFS_BASE}/mtr_venue_polygon?service=WFS&version=1.1.0&request=GetFeature&outputFormat=application%2Fjson`;
        const res = await fetch(url);
        if (!res.ok) throw new Error("mtr_venue_polygon API error");
        const data = await res.json();
        for (const f of (data?.features || [])) {
          const p = f?.properties || {};
          const vid = p.venue_id;
          if (!vid) continue;
          const zh = _mtrIndoorNormalizeName(p.venue_name_zh);
          const en = _mtrIndoorNormalizeName(p.venue_name_en);
          if (zh && !map.has(zh)) map.set(zh, vid);
          if (en && !map.has(en)) map.set(en, vid);
        }
      } catch (err) {
        console.warn("無法取得地政總署室內地圖港鐵站清單:", err);
      }
      mtrIndoorVenueByName = map;
    })();
  }
  await mtrIndoorVenueListPromise;
  return mtrIndoorVenueByName;
}

async function _resolveMtrIndoorVenueId(staNameZh, staNameEn) {
  const map = await _ensureMtrIndoorVenueList();
  if (!map || !map.size) return null;
  const zhKey = _mtrIndoorNormalizeName(staNameZh);
  const enKey = _mtrIndoorNormalizeName(staNameEn);
  if (zhKey && map.has(zhKey)) return map.get(zhKey);
  if (enKey && map.has(enKey)) return map.get(enKey);
  return null;
}

// ---- 幾何小工具（GeoJSON 座標一律 [lng,lat]，EPSG:4326） ----
function _mtrIndoorPointInRing(pt, ring) {
  let inside = false;
  const x = pt[0], y = pt[1];
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    const intersect = ((yi > y) !== (yj > y)) &&
      (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function _mtrIndoorPointInGeom(pt, geometry) {
  if (!geometry) return false;
  if (geometry.type === "Polygon") {
    return _mtrIndoorPointInRing(pt, geometry.coordinates[0] || []);
  }
  if (geometry.type === "MultiPolygon") {
    for (const poly of geometry.coordinates) {
      if (_mtrIndoorPointInRing(pt, poly[0] || [])) return true;
    }
  }
  return false;
}

function _mtrIndoorRingCentroid(ring) {
  if (!ring || ring.length < 3) return null;
  let area = 0, cx = 0, cy = 0;
  for (let i = 0; i < ring.length - 1; i++) {
    const x0 = ring[i][0], y0 = ring[i][1], x1 = ring[i + 1][0], y1 = ring[i + 1][1];
    const cross = x0 * y1 - x1 * y0;
    area += cross;
    cx += (x0 + x1) * cross;
    cy += (y0 + y1) * cross;
  }
  area *= 0.5;
  if (Math.abs(area) < 1e-12) {
    let sx = 0, sy = 0;
    for (const [x, y] of ring) { sx += x; sy += y; }
    return { lng: sx / ring.length, lat: sy / ring.length };
  }
  return { lng: cx / (6 * area), lat: cy / (6 * area) };
}

// 揀面積最大嗰個 sub-polygon 嘅質心，代表返呢個分區嘅主體位置
function _mtrIndoorGeomCentroid(geometry) {
  if (!geometry) return null;
  if (geometry.type === "Polygon") return _mtrIndoorRingCentroid(geometry.coordinates[0]);
  if (geometry.type === "MultiPolygon") {
    let best = null, bestArea = -1;
    for (const poly of geometry.coordinates) {
      const ring = poly[0];
      if (!ring || ring.length < 3) continue;
      let area = 0;
      for (let i = 0; i < ring.length - 1; i++) area += ring[i][0] * ring[i + 1][1] - ring[i + 1][0] * ring[i][1];
      area = Math.abs(area / 2);
      if (area > bestArea) { bestArea = area; best = _mtrIndoorRingCentroid(ring); }
    }
    return best;
  }
  return null;
}

function _mtrIndoorPropsHasKeyword(props, keywords) {
  if (!props) return false;
  for (const key in props) {
    const v = props[key];
    if (typeof v !== "string") continue;
    const lower = v.toLowerCase();
    for (const kw of keywords) {
      if (lower.includes(kw)) return true;
    }
  }
  return false;
}

// 【室內步行圖建構】分區（mtr_unit_polygon）做節點，開口（mtr_opening_line）
// 做邊。API 冇提供開口連緊邊兩個分區嘅 id，所以喺開口線中點兩側各取一個
// 貼近少少嘅取樣點，睇吓落喺邊個分區入面，藉此推斷返兩個分區互通。
function _buildMtrIndoorGraph(unitFeatures, openingFeatures) {
  const nodes = [];
  for (const f of unitFeatures) {
    const c = _mtrIndoorGeomCentroid(f?.geometry);
    if (!c) continue;
    nodes.push({
      lat: c.lat, lng: c.lng,
      isPlatform: _mtrIndoorPropsHasKeyword(f?.properties, MTR_INDOOR_PLATFORM_KEYWORDS),
      geometry: f.geometry
    });
  }
  if (!nodes.length) return null;

  const adjacency = nodes.map(() => []);
  const EPS_DEG = 0.00003; // 約 3 米，做開口線兩側嘅取樣偏移

  for (const f of openingFeatures) {
    const geom = f?.geometry;
    if (!geom) continue;
    const lines = geom.type === "LineString" ? [geom.coordinates]
      : geom.type === "MultiLineString" ? geom.coordinates
      : null;
    if (!lines) continue;

    for (const line of lines) {
      if (!line || line.length < 2) continue;
      const midIdx = Math.max(0, Math.floor((line.length - 1) / 2));
      const p0 = line[midIdx];
      const p1 = line[midIdx + 1] || line[midIdx - 1];
      if (!p0 || !p1) continue;
      const dx = p1[0] - p0[0], dy = p1[1] - p0[1];
      const len = Math.hypot(dx, dy);
      if (len < 1e-9) continue;
      const nx = -dy / len, ny = dx / len; // 垂直單位向量
      const midX = (p0[0] + p1[0]) / 2, midY = (p0[1] + p1[1]) / 2;
      const sideA = [midX + nx * EPS_DEG, midY + ny * EPS_DEG];
      const sideB = [midX - nx * EPS_DEG, midY - ny * EPS_DEG];

      let unitA = -1, unitB = -1;
      for (let i = 0; i < nodes.length; i++) {
        if (unitA === -1 && _mtrIndoorPointInGeom(sideA, nodes[i].geometry)) unitA = i;
        if (unitB === -1 && _mtrIndoorPointInGeom(sideB, nodes[i].geometry)) unitB = i;
        if (unitA !== -1 && unitB !== -1) break;
      }
      if (unitA !== -1 && unitB !== -1 && unitA !== unitB) {
        const d = distM({ lat: nodes[unitA].lat, lng: nodes[unitA].lng }, { lat: nodes[unitB].lat, lng: nodes[unitB].lng });
        adjacency[unitA].push({ to: unitB, distM: d });
        adjacency[unitB].push({ to: unitA, distM: d });
      }
    }
  }

  return { nodes, adjacency };
}

const mtrIndoorNetworkCache = new Map(); // venue_id -> Promise<network|null>
async function _loadMtrIndoorNetwork(venueId) {
  if (!venueId) return null;
  if (mtrIndoorNetworkCache.has(venueId)) return mtrIndoorNetworkCache.get(venueId);
  const p = (async () => {
    try {
      const q = (feature) => `${MTR_INDOOR_WFS_BASE}/${feature}?service=WFS&version=1.1.0&request=GetFeature&outputFormat=application%2Fjson&cql_filter=venue_id%3D%27${encodeURIComponent(venueId)}%27`;
      const [unitRes, openingRes] = await Promise.all([
        fetch(q("mtr_unit_polygon")),
        fetch(q("mtr_opening_line"))
      ]);
      if (!unitRes.ok || !openingRes.ok) throw new Error("mtr_unit_polygon/mtr_opening_line API error");
      const [unitData, openingData] = await Promise.all([unitRes.json(), openingRes.json()]);
      return _buildMtrIndoorGraph(unitData?.features || [], openingData?.features || []);
    } catch (err) {
      console.warn(`無法取得地政總署室內路網資料 (venue ${venueId}):`, err);
      return null;
    }
  })();
  mtrIndoorNetworkCache.set(venueId, p);
  return p;
}

function _mtrIndoorNearestUnit(network, loc) {
  if (!network || !network.nodes.length || !loc) return -1;
  let best = -1, bestD = Infinity;
  for (let i = 0; i < network.nodes.length; i++) {
    const n = network.nodes[i];
    const d = distM(loc, { lat: n.lat, lng: n.lng });
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

// 【只喺「月台」分區入面揾最近】同 _mtrIndoorNearestUnit() 唔同——嗰個
// 係「唔理係乜嘢分區,搵全場最近」,啱用喺「戶外出口座標揾去邊個分區
// 起計」(getMtrIndoorSupplementM,起點本身梗係喺出口/大堂嗰邊)。但
// 【月台↔月台站內轉乘】(getMtrIndoorTransferM) 嘅起訖兩點理應本身就
// 已經喺月台,如果直接用 _mtrIndoorNearestUnit() 揾「全場最近」,而
// etaDb.stopList 入面存嘅站點座標好多時其實係(接近)出入口/大堂嗰個
// 位(唔一定啱好落喺月台分區入面),就會揾到大堂/通道分區當做起訖點,
// 令成條路徑變成「出入口→出入口」,同「出咗閘再入返閘」冇分別,完全
// 冇反映到「淨係喺閘內月台轉月台」呢個實際情況。呢個函數揸實淨係喺
// isPlatform 嘅分區入面揾最近嗰一個,保證起訖點一定係月台,先再用
// Dijkstra 揾返兩個月台分區之間嘅室內距離。
function _mtrIndoorNearestPlatformUnit(network, loc, platformIdxSet) {
  if (!network || !network.nodes.length || !loc || !platformIdxSet || !platformIdxSet.size) return -1;
  let best = -1, bestD = Infinity;
  for (const i of platformIdxSet) {
    const n = network.nodes[i];
    const d = distM(loc, { lat: n.lat, lng: n.lng });
    if (d < bestD) { bestD = d; best = i; }
  }
  return best;
}

// 單源 Dijkstra，搵去任何一個 target（月台分區）嘅最短距離。站內分區
// 數量細（一般幾十至頂多幾百個），簡單 O(V^2) 版本已經夠快，唔使拎額外
// 嘅 priority queue 實作。
function _mtrIndoorDijkstra(network, sourceIdx, targetIdxSet) {
  const n = network.nodes.length;
  const dist = new Array(n).fill(Infinity);
  const visited = new Array(n).fill(false);
  dist[sourceIdx] = 0;
  for (let iter = 0; iter < n; iter++) {
    let u = -1, best = Infinity;
    for (let i = 0; i < n; i++) {
      if (!visited[i] && dist[i] < best) { best = dist[i]; u = i; }
    }
    if (u === -1) break;
    visited[u] = true;
    if (targetIdxSet.has(u)) return dist[u];
    for (const edge of network.adjacency[u]) {
      const nd = dist[u] + edge.distM;
      if (nd < dist[edge.to]) dist[edge.to] = nd;
    }
  }
  let minD = Infinity;
  for (const t of targetIdxSet) if (dist[t] < minD) minD = dist[t];
  return Number.isFinite(minD) ? minD : null;
}

// 【月台↔出口室內步行距離】mtrStopId 格式係 "MTR-{站代碼}"（同
// pickBestMtrExit() 一致）；exitLoc 係嗰個出口（或者站嘅平均座標）嘅戶外
// 座標。搵唔到呢個站嘅室內地圖資料、或者搵唔到月台分區，就回傳 0（唔
// 補），等呼叫方保持原有（純戶外）距離計算行為。
const mtrIndoorSupplementCache = new Map();
async function getMtrIndoorSupplementM(mtrStopId, exitLoc) {
  if (!mtrStopId || !mtrStopId.startsWith("MTR-") || !exitLoc) return 0;
  const cacheKey = `${mtrStopId}_${roundCoordForCache(exitLoc.lat)},${roundCoordForCache(exitLoc.lng)}`;
  if (mtrIndoorSupplementCache.has(cacheKey)) return mtrIndoorSupplementCache.get(cacheKey);

  let result = 0;
  try {
    const staInfo = etaDb?.stopList?.[mtrStopId];
    const venueId = await _resolveMtrIndoorVenueId(staInfo?.name?.zh, staInfo?.name?.en);
    if (venueId) {
      const network = await _loadMtrIndoorNetwork(venueId);
      if (network && network.nodes.length) {
        const platformIdxSet = new Set();
        network.nodes.forEach((nd, i) => { if (nd.isPlatform) platformIdxSet.add(i); });
        if (platformIdxSet.size) {
          const exitUnitIdx = _mtrIndoorNearestUnit(network, exitLoc);
          if (exitUnitIdx >= 0 && !platformIdxSet.has(exitUnitIdx)) {
            const d = _mtrIndoorDijkstra(network, exitUnitIdx, platformIdxSet);
            if (Number.isFinite(d)) result = d;
          }
        }
      }
    }
  } catch (err) {
    console.warn(`地政總署室內路網（月台↔出口）距離計算失敗 (${mtrStopId}):`, err);
    result = 0;
  }
  mtrIndoorSupplementCache.set(cacheKey, result);
  return result;
}

// 【月台↔月台室內轉乘距離】用於兩個連續港鐧（重鐵）車程之間嘅轉乘：
// 呢種轉乘用戶淨係喺站內由一個月台行去另一個月台（例如金鐧港島綫轉
// 南港島綫），全程都冇離開過閘機外，唔應該好似一般轉乘咁計「出咗閘
// 行出街，再入返閘」嗰段戶外步行路線同建議出入口——嗰種計法喺同一個
// 站體入面完全唔適用，仲會誤導用戶。
// 做法：分別揾返 fromStopId／toStopId 兩個站解析到嘅 venue_id；如果兩
// 個站根本解析唔到，或者解析到唔同 venue_id（即實際上唔係同一個站
// 體嘅轉車，例如靠 exits.mtr.json 撞名衍生出嚟嘅唔同站），就回傳 null，
// 等呼叫方識別到呢個唔算「真正站內轉乘」，落級用返戶外步行路線計算。
// 如果係同一個 venue_id，就直接用返地政總署室內路網（同 getMtrIndoorSupplementM()
// 用嘅同一套 mtr_unit_polygon + mtr_opening_line 圖），揾返貼近兩個站
// 各自座標嘅室內分區節點做起訖點，行 Dijkstra 攞返純室內嘅月台↔月台
// 距離（如果兩點撞正同一個分區，例如同層對面月台轉乘，直接當 0）。
const mtrIndoorTransferCache = new Map();
async function getMtrIndoorTransferM(fromStopId, toStopId) {
  if (!fromStopId || !toStopId || !fromStopId.startsWith("MTR-") || !toStopId.startsWith("MTR-")) return null;
  const cacheKey = `${fromStopId}__${toStopId}`;
  if (mtrIndoorTransferCache.has(cacheKey)) return mtrIndoorTransferCache.get(cacheKey);

  let result = null;
  try {
    const fromInfo = etaDb?.stopList?.[fromStopId];
    const toInfo = etaDb?.stopList?.[toStopId];
    const fromLoc = fromInfo?.location;
    const toLoc = toInfo?.location;
    if (fromLoc && toLoc) {
      const fromVenueId = await _resolveMtrIndoorVenueId(fromInfo?.name?.zh, fromInfo?.name?.en);
      const toVenueId = await _resolveMtrIndoorVenueId(toInfo?.name?.zh, toInfo?.name?.en);
      // 唔同 venue（或者任何一個解析失敗）代表呢兩個站唔屬於同一個站體，
      // 唔係真正嘅「站內」轉乘，交返落級戶外計法處理
      if (fromVenueId && toVenueId && fromVenueId === toVenueId) {
        const network = await _loadMtrIndoorNetwork(fromVenueId);
        if (network && network.nodes.length) {
          // 【只揀月台分區做起訖點】唔可以再用 _mtrIndoorNearestUnit()
          // 揾「全場最近」——etaDb 存嘅站點座標通常貼近出入口/大堂,直接
          // 揾全場最近分區好易撞正大堂/通道,令條路徑變成「出入口→
          // 出入口」。呢度揸實喺 isPlatform 嘅分區入面揾最近,保證起訖
          // 點一定係月台本身,先反映到真正嘅「月台↔月台」室內轉乘。
          const platformIdxSet = new Set();
          network.nodes.forEach((nd, i) => { if (nd.isPlatform) platformIdxSet.add(i); });
          if (platformIdxSet.size) {
            const fromUnitIdx = _mtrIndoorNearestPlatformUnit(network, fromLoc, platformIdxSet);
            const toUnitIdx = _mtrIndoorNearestPlatformUnit(network, toLoc, platformIdxSet);
            if (fromUnitIdx >= 0 && toUnitIdx >= 0) {
              if (fromUnitIdx === toUnitIdx) {
                result = 0; // 同一個室內分區（例如同層對面月台轉乘）
              } else {
                const d = _mtrIndoorDijkstra(network, fromUnitIdx, new Set([toUnitIdx]));
                if (Number.isFinite(d)) result = d;
              }
            }
          }
        }
      }
    }
  } catch (err) {
    console.warn(`地政總署室內路網（站內轉乘月台↔月台）距離計算失敗 (${fromStopId} → ${toStopId}):`, err);
    result = null;
  }
  mtrIndoorTransferCache.set(cacheKey, result);
  return result;
}


function buildGridIndex(stopList){
  gridIndex = new Map();
  for (const [stopId, s] of Object.entries(stopList)) {
    if (!s || !s.location) continue;
    const key = cellKey(s.location.lat, s.location.lng);
    if (!gridIndex.has(key)) gridIndex.set(key, []);
    gridIndex.get(key).push(stopId);
  }
}

/* === 站點合併與緩衝區判定 === */
// 【邏輯修正】原本合併半徑 150 米，對於大型總站/公共運輸交匯處（例如
// 「馬鞍山市中心」「機場地面運輸中心」呢類多月台大站）經常唔夠——同一個
// 總站入面唔同公司/唔同月台嘅站牌，實際相距超過 150 米係好平常嘅事，令
// 名稱相符但距離啱啱好踩過界嘅站牌被誤判做「唔同站」。放寬到 220 米，
// 並將「純距離兜底」門檻由 40 米放寬到 60 米（頂住兩個站名寫法完全唔同、
// 但實際上係同一個處所嘅邊緣情況）。
const MERGE_RADIUS_M = 220;
const MERGE_FALLBACK_DIST_M = 60;

// 常見「總站/交匯處」類後綴詞——呢類字眼喺唔同資料源（KMB/CTB/GMB/MTR
// 巴士）入面有冇、寫法都可能唔一致（例如「馬鞍山市中心總站」對比
// 「馬鞍山市中心」），但實際上係指緊同一個處所。比較站名之前先將呢啲
// 後綴詞剝走，減少因為呢類寫法差異導致嘅假陰性（誤判做唔同站）。
// 由長到短排列，確保長後綴（如「巴士總站」）優先於短後綴（如「站」）被
// 剝走，避免斬多咗令原本有意義嘅字眼都被切走。
const STOP_SUFFIX_WORDS = [
  "公共運輸交匯處", "公共交通交匯處", "運輸交匯處", "交匯處",
  "巴士總站", "小巴總站", "總站", "巴士站", "小巴站"
];

function cleanStopName(name) {
  if (!name) return "";
  let s = name.toString()
             .replace(/[\(（].*?[\)）]/g, "") // 移除括號及其內容，例如 (B1)、（落客站）
             .replace(/[\s,，.。\-_]/g, "")
             .toLowerCase()
             .trim();
  for (const suffix of STOP_SUFFIX_WORDS) {
    if (s.length > suffix.length && s.endsWith(suffix)) {
      s = s.slice(0, -suffix.length);
      break; // 剝一次就夠，避免連環誤剝
    }
  }
  return s;
}

function isSameTransferPoint(stopA, stopB) {
    if (!stopA || !stopB) return false;
    const dist = distM(stopA.location, stopB.location);
    if (dist > MERGE_RADIUS_M) return false;
    
    const zhA = cleanStopName(stopA.name.zh);
    const zhB = cleanStopName(stopB.name.zh);
    const enA = cleanStopName(stopA.name.en);
    const enB = cleanStopName(stopB.name.en);
    
    // 1. 中文名稱完全相同或包含關係 (例如 "創紀之城" vs "創紀之城(B1)")
    if (zhA && zhB) {
        if (zhA === zhB || zhA.includes(zhB) || zhB.includes(zhA)) return true;
    }
    // 2. 英文名稱完全相同或包含關係
    if (enA && enB) {
        if (enA === enB || enA.includes(enB) || enB.includes(enA)) return true;
    }
    // 3. 極近距離（如60米內），即使命名略有不同，也視為同站群（防止跨公司命名細微差異）
    if (dist <= MERGE_FALLBACK_DIST_M) return true;
    
    return false;
}

function nearbyStops(lat, lng, radiusM) {
    const found = [];
    const seenStopIds = new Set();

    // 【效能修正】上次為咗唔漏站，一律喺 latSpan/lngSpan 度多加一格緩衝，
    // 保證半徑內嘅站一定掃得到，但代價係好多時候會掃多過實際需要嘅格數
    // （呢個 function 喺搜尋主迴圈入面——尤其係轉車步行搜尋——會被逐個
    // 候選狀態調用，多掃嘅格數會逐輪疊加，直接拖慢撳「搜尋」之後嘅等候
    // 時間）。而家改為根據起點喺佢所在格仔入面嘅實際偏移量，分別計算四
    // 個方向（南／北／東／西）各自需要幾多格先夠覆蓋 radiusM，唔再無條件
    // 兩邊都加多一格——結果保證一樣完整（半徑內嘅站保證掃得到），但一般
    // 情況下要掃嘅格仔會少好多。
    const latMPerDeg = 111320;
    const lngMPerDeg = Math.max(111320 * Math.cos(lat * Math.PI / 180), 1);
    const latCellM = latMPerDeg * CELL;
    const lngCellM = lngMPerDeg * CELL;

    const latCell = Math.floor(lat / CELL), lngCell = Math.floor(lng / CELL);
    const latOffsetM = (lat - latCell * CELL) * latMPerDeg;   // 起點喺格內嘅偏移（南面起計）
    const lngOffsetM = (lng - lngCell * CELL) * lngMPerDeg;   // 起點喺格內嘅偏移（西面起計）

    const negLatSpan = Math.max(0, Math.ceil((radiusM - latOffsetM) / latCellM));
    const posLatSpan = Math.max(0, Math.ceil((radiusM - (latCellM - latOffsetM)) / latCellM));
    const negLngSpan = Math.max(0, Math.ceil((radiusM - lngOffsetM) / lngCellM));
    const posLngSpan = Math.max(0, Math.ceil((radiusM - (lngCellM - lngOffsetM)) / lngCellM));

    for (let dlat=-negLatSpan; dlat<=posLatSpan; dlat++){
        for (let dlng=-negLngSpan; dlng<=posLngSpan; dlng++){
            const bucket = gridIndex.get((latCell+dlat)+","+(lngCell+dlng));
            if (!bucket) continue;
            for (const stopId of bucket){
                if (seenStopIds.has(stopId)) continue;
                const s = etaDb.stopList[stopId];
                if (!s) continue;
                const d = distM({lat,lng}, s.location);
                if (d <= radiusM) {
                    found.push({stopId, dist: d});
                    seenStopIds.add(stopId);
                }
            }
        }
    }
    
    // 合併同轉乘點的站點：呢類「其他站牌屬於同一轉乘點」嘅站牌，行過去嘅
    // 步行距離應該同已經量度過嘅嗰個代表站牌相若，但必須保留所有站點以
    // 獲取完整的路線覆蓋
    //
    // 【修正】isSameTransferPoint(m, f) 判斷嘅係 m 同 f 呢兩個站牌之間嘅
    // 距離（或者名稱相似度），並唔係話 f 距離查詢點（起點/終點座標）
    // 一定係 0 米。舊版一撞中就將 f.dist 硬set做 0，等於話「凡係同一
    // 站群嘅站牌，全部當企喺用戶腳下」——如果 m 本身真係好近（例如 5
    // 米），噉都仲勉強收貨；但如果 m 只不過喺 40 米 / 150 米合併半徑
    // 邊緣，f 實際距離查詢點可以仲有好幾百米，卻顯示做「步行約 0
    // 米」，同現實唔符（例如彩虹邨同啟晴邨實際上唔可能 0 米）。而家
    // 改為用返 existing（已經用真實 distM() 量度過）嗰個距離，代表
    // 「呢個站牌大約同代表站牌一樣近」，唔會再無中生有噏一個唔存在
    // 嘅 0 米出嚟。
    const merged = [];
    found.forEach(f => {
        const existing = merged.find(m => isSameTransferPoint(etaDb.stopList[m.stopId], etaDb.stopList[f.stopId]));
        if (!existing) {
            merged.push(f);
        } else {
            f.dist = existing.dist; // 同一站群的不同站牌，步行距離約等於代表站牌嘅實際距離
            merged.push(f); // 必須保留！否則該站牌特有的路線會被過濾，造成搜尋結果缺失
        }
    });
    
    merged.sort((a,b) => a.dist - b.dist);
    return merged;
}

// 【新增修正：唔同公司獨立 stopId、但實際係同一個物理站】stopRouteIndex.
// get(stopId) 只會攞到「呢個 stopId 自己」直接屬於嘅路線（連埋
// buildIndices() 已經補嘅、同一條路線嘅其他公司變體）。但如果起點／轉
// 車站用戶揀（或者 beam search 行到）嗰個 stopId 淨係屬於 A 公司，而
// 喺同一個物理位置仲有 B 公司自己另一個完全獨立嘅 stopId（兩個 stopId
// 之間冇任何 routeId 關聯，純粹座標／名稱啱啱好近），而用戶想搭嗰條
// 路線淨係喺 B 公司嗰個 stopId 先有記錄——噉 stopRouteIndex.get(A 個
// stopId) 就永遠搵唔到呢條路線，逼住個搜尋行去路線嘅下一個站先上到
// 車（明明個站已經企喺路線嘅站腳下）。而家用返 MERGE_RADIUS_M 範圍 +
// isSameTransferPoint() 判斷，搵埋附近所有「同一個轉乘點」嘅站牌，將
// 佢哋各自嘅可達路線都合併埋一齊，當呢個站都搭得到（0 米，冇額外步
// 行）。用 Map 做 cache，避免同一個 stopId 喺 beam search 入面每次擴展
// 都重新掃一次附近站。
// 【站群化】以前「搵呢個站有咩路線」／「搵起點附近有咩路線」兩處各自
// 用 nearbyStops()+isSameTransferPoint() 逐個站牌掃一次，等於將「轉乘
// 點/站群」呢個概念拆散做逐個站牌獨立處理，唔同函數重複計、亦好易走
// 漏（例如某個站牌啱啱好喺半徑邊緣就唔覆蓋到）。而家統一抽出呢個
// getStationGroupIds()：俾一個 stopId，一次過用 MERGE_RADIUS_M +
// isSameTransferPoint() 搵晒成個轉乘點/站群入面所有 stopId（包括自己），
// 結果 cache 埋，等成個搜尋（唔理係搵起點候選、定係 beam search 行到
// 中途任何一個站）都可以一致噉「成個站群」為單位嚟諗，而唔係每次淨係
// 掂到邊個站牌就淨係睇嗰個站牌自己。
function getStationGroupIds(stopId) {
  if (_stationGroupCache.has(stopId)) return _stationGroupCache.get(stopId);

  // 【優先用 data_full.json 官方 stopMap 站群】呢份資料係官方/上游預先
  // 核實過嘅跨公司轉乘點分組（見上面 authoritativeStopGroups 頂部
  // 註解）,唔使再靠底下嗰套「清洗站名 + 距離」heuristic 估——如果呢個
  // stopId 有收錄喺官方 stopMap 入面,直接用官方分組,唔行落面。淨係
  // stopMap 完全冇收錄嗰啲 stopId（例如新站,或者本 app 自己砌出嚟嘅
  // `LR-<code>` 虛擬輕鐧 stopId）先退落用返 heuristic。
  if (authoritativeStopGroups && authoritativeStopGroups.has(stopId)) {
    const officialGroup = authoritativeStopGroups.get(stopId);
    _stationGroupCache.set(stopId, officialGroup);
    return officialGroup;
  }

  const stopObj = etaDb.stopList[stopId];
  if (!stopObj || !stopObj.location) {
    const solo = [stopId];
    _stationGroupCache.set(stopId, solo);
    return solo;
  }

  const groupIds = [stopId];
  const nearby = nearbyStops(stopObj.location.lat, stopObj.location.lng, MERGE_RADIUS_M);
  for (const ns of nearby) {
    if (ns.stopId === stopId) continue;
    const siblingObj = etaDb.stopList[ns.stopId];
    if (!siblingObj || !isSameTransferPoint(stopObj, siblingObj)) continue;
    groupIds.push(ns.stopId);
  }

  // 由於群組關係係雙向、對稱嘅（A 同 B 同一站群，B 睇返 A 都一定係同一
  // 站群），呢度將計到嘅結果，連埋每個成員嘅角度都一拼寫入 cache，避免
  // 之後逐個成員再重新掃一次（大幅減少 beam search 密集調用時嘅重複
  // 運算）。
  for (const gid of groupIds) {
    if (!_stationGroupCache.has(gid)) _stationGroupCache.set(gid, groupIds);
  }
  return groupIds;
}

function getRoutesAtStopWithColocated(stopId) {
  if (_coLocatedRoutesCache.has(stopId)) return _coLocatedRoutesCache.get(stopId);

  const own = stopRouteIndex.get(stopId) || [];
  const stopObj = etaDb.stopList[stopId];
  if (!stopObj || !stopObj.location) {
    _coLocatedRoutesCache.set(stopId, own);
    return own;
  }

  const ownRouteIds = new Set(own.map(e => e.routeId));
  const merged = own.slice();

  // 【成個站群一齊搵，而唔係逐個站牌搵】用 getStationGroupIds() 一次過
  // 攞返成個轉乘點/站群嘅全部 stopId，將群入面每個成員自己嘅路線都合埋
  // 一齊，代表「呢個站群」整體覆蓋到嘅路線範圍，唔會因為某條路線淨係
  // 喺群入面另一個站牌先有記錄就漏走。
  const groupIds = getStationGroupIds(stopId);
  for (const gid of groupIds) {
    if (gid === stopId) continue;
    const siblingRoutes = stopRouteIndex.get(gid) || [];
    for (const entry of siblingRoutes) {
      if (ownRouteIds.has(entry.routeId)) continue; // 呢條路線本身站牌已經搭得到，唔使補
      ownRouteIds.add(entry.routeId);
      merged.push(entry);
    }
  }

  _coLocatedRoutesCache.set(stopId, merged);
  return merged;
}

function stopName(stopId){
  const s = etaDb.stopList[stopId];
  if (!s) return stopId;
  return s.name.zh || s.name.en || stopId;
}
// 【聯營路線・行程結果跟返實際承辦公司嘅站名】九巴／城巴聯營路線,兩間
// 公司對同一個實體站可能有唔同站名／唔同站序 ID。boardStopId／
// alightStopId 喺搜尋過程可能係跟其中一間公司（primaryCo）嘅站陣揀出
// 嚟,但呢一程實際上車嗰間公司（leg.co／dep._resolvedCo）可能係另一
// 間——顯示畀用戶睇嘅站名應該跟返實際搭嗰間公司嘅版本,唔應該死咬住
// 揾站當初用嗰個 ID 屬於邊間公司。如果 leg.co 呢間公司喺 r.stops 有
// 自己一套站陣、而 stopId 唔屬於嗰套,就用 findEquivalentStopIdx() 搵返
// 呢間公司對應嘅等價站,改用嗰個站嘅名；搵唔到就跌返用原本嗰個 stopId
// 嘅名，確保永遠有得顯示。
function legDisplayStopName(leg, stopId) {
  if (!stopId) return stopName(stopId);
  const co = leg && leg.co;
  const r = leg && leg.r;
  if (!co || !r || !r.stops || !r.stops[co] || !r.stops[co].length) return stopName(stopId);
  if (r.stops[co].includes(stopId)) return stopName(stopId);
  const idx = findEquivalentStopIdx(r, co, stopId);
  if (idx >= 0 && r.stops[co][idx]) return stopName(r.stops[co][idx]);
  return stopName(stopId);
}
function fmtTime(d){
  if (!d || isNaN(d)) return "--:--";
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function fmtDist(m){
  return m < 1000 ? Math.round(m)+"米" : (m/1000).toFixed(1)+"公里";
}

/* ---------------- Route Scoring System ---------------- */
const PENALTY_TRANSFER = 3;      
const PENALTY_CROSS_CO = 5;     
// 【整合：以前 MULTIPLIER_WALK(=1.1，用喺 minutes 嘅最終評分) 同
// runBeamSearch() 入面 local 嘅 walkPenaltyMultiplier(=1.5，用喺 metres
// 嘅搜尋 heuristic) 係兩個完全獨立、數值都唔一致嘅「步行懲罰倍數」，
// 兩個地方各自維護，好易愈行愈唔一致。而家統一用返一個全域常數，令
// 「步行應該比搭車辛苦幾多倍」呢個判斷全個 file 一致。
// WALK_PENALTY_MULTIPLIER：origin 附近有另一個站已經覆蓋緊「目標路線」
// 嗰陣用嘅「維持懲罰」倍數——呢種情況行去第二個站係無謂嘅，要用力勸退。
const WALK_PENALTY_MULTIPLIER = 1.5;
const WALK_PENALTY_MULTIPLIER_RELAXED = 1.0;

/* ==================================================================
 * 轉乘質性評分機制 (Transfer Quality Score) —— 全面重構
 * ------------------------------------------------------------------
 * 背景：以往「轉車判斷」相關嘅賞罰分同「行程耗時」混埋喺同一條
 * score 度計，一個轉車位揀得幾好，都可能因為總耗時稍為長咗少少就
 * 被拖累排名，甚至喺仲未用真實班次評估之前就被搜尋/篩選階段當「差
 * 方案」提早淘汰。而家將「轉乘質性」獨立開一套 100 分為滿分、完全
 * 唔理耗時嘅評分（calculateTransferQualityScore()），有賞有罰：
 *
 *   能覆蓋行程起終點的直達車               +20
 *   次程路線能直達終點                     +20
 *   官方轉車站 / 九巴 BBI 官方轉乘站        +15
 *   同一轉乘點／同站群轉乘                  +15
 *   使用大型轉車站（樞紐站）                +5
 *   同公司轉乘（輕鐵/港鐵巴士同港鐵當同一
 *              公司；九巴同龍運喺呢個 app
 *              入面本身已經統一歸類做同一
 *              個 co，毋須額外處理）         +10
 *   次程路線能直達終點（轉完呢一程之後
 *              唔會再需要轉第三程）          +20
 *   非必要跨公司轉乘                        -10
 *   非必要轉乘／無謂駁腳                    -20
 *   無謂步行                                -15
 *
 * 保留嘅原有豁免：
 *   - 從區內前往位於區內轉車站嘅轉車：官方轉車站／BBI 轉乘站本身已經
 *     代表呢一步轉車有正當理由，豁免「非必要跨公司轉乘」呢項扣分
 *     （只計賞、唔計呢項罰）。
 *   - 深夜 (00:00-06:00)：「非必要跨公司轉乘」同「非必要轉乘/無謂
 *     駁腳」呢兩項扣分全部豁免，賞分（官方轉車站/同站群/大型轉車站/
 *     同公司）照計。
 *
 * 「非必要轉乘/無謂駁腳」嘅判斷（上一程坐到底其實已經夠近終點）唔設
 * 官方轉車站豁免——呢個轉車本身就唔應該發生，唔會因為揀啱轉車站而
 * 變成應該。呢個轉車發生嗰陣，所有「賞」都唔會發放（見下面實作），
 * 避免獎勵分抵銷返「呢步轉車根本無謂」呢個訊號。
 * 其餘未被明確提及、但原本已經存在嘅轉乘相關懲罰／獎勵（例如九巴
 * 自家轉車站 bonus），已經摺埋落上面呢 8 條規則入面，唔再獨立另計。
 * ================================================================== */
const TQS_MAX = 100;
const TQS_MIN = 0;
const TQS_BONUS_DIRECT = 70;
const TQS_BONUS_NEXT_LEG_DIRECT_TO_DEST = 20;
const TQS_BONUS_OFFICIAL_INTERCHANGE = 10;
const TQS_BONUS_SAME_STOP_GROUP = 10;
const TQS_BONUS_LARGE_INTERCHANGE = 5;
const TQS_BONUS_SAME_COMPANY = 10;
const TQS_PENALTY_CROSS_COMPANY = 10;
const TQS_PENALTY_REDUNDANT_TRANSFER = 20;
const TQS_PENALTY_UNNECESSARY_WALK = 15;


// 站群本身有唔同路線經過，就應該當佢係轉車站，畀返應得
// 嘅轉乘 bonus／搜尋豁免，等 beam search 唔會漏搵到「呢度轉車其實
// 更平更快」呢類方案。
// getStationGroupRouteCount()：攞返呢個 stopId 所屬站群，一共有幾多
// 條唔同嘅路線經過（用 getRoutesAtStopWithColocated() 已經合埋成個
// 站群嘅路線，再用 routeId 去重）。
function getStationGroupRouteCount(stopId) {
  if (_stationGroupRouteCountCache.has(stopId)) return _stationGroupRouteCountCache.get(stopId);
  if (!etaDb || !etaDb.stopList[stopId]) {
    _stationGroupRouteCountCache.set(stopId, 0);
    return 0;
  }
  const routes = getRoutesAtStopWithColocated(stopId);
  const uniqueRouteIds = new Set(routes.map(r => r.routeId));
  const count = uniqueRouteIds.size;
  // 成個站群嘅路線數量本身就係「呢個站群」嘅屬性，唔理你問嘅係群入面
  // 邊一個具體 stopId，答案應該一致——將計到嘅結果，連埋每個成員都一
  // 拼寫入 cache，避免之後逐個成員再重新計一次。
  const groupIds = getStationGroupIds(stopId);
  for (const gid of groupIds) {
    if (!_stationGroupRouteCountCache.has(gid)) _stationGroupRouteCountCache.set(gid, count);
  }
  return count;
}

// 「有幾多條路線先算多」嘅門檻：普通一個巴士站牌一般得幾條路線
// （2-8條左右），真正好似怡和大廈、彩虹、旺角站咁「乜路線都經過」
// 嘅實務樞紐，通常都成 10 條以上。呢個數值日後可以按實際搜尋結果
// 微調。
const HUB_ROUTE_COUNT_THRESHOLD = 10;
function isDataDrivenHubStop(stopId) {
  if (!stopId) return false;
  return getStationGroupRouteCount(stopId) >= HUB_ROUTE_COUNT_THRESHOLD;
}

// 統一轉車站判斷 結合官方/正式命名嘅轉乘設施同站群路線好多嚟判斷
function isInterchangeHub(stopId) {
  if (!stopId) return false;
  const s = etaDb && etaDb.stopList ? etaDb.stopList[stopId] : null;
  const zh = s?.name?.zh || "";
  const en = s?.name?.en || "";
  if (isOfficialInterchangeName(zh) || isOfficialInterchangeName(en)) return true;
  return isDataDrivenHubStop(stopId);
}

// 公司分組：輕鐵／港鐵巴士 同 港鐵 當同一集團
function transferCompanyGroupId(co) {
  if (!co) return co;
  if (co === "mtr" || co === "lightrail" || co === "mtrb" || co === "mtr-bus") return "mtr-group";
  return co;
}

// 判斷「上一程坐到底其實已經夠近終點」——即依家呢次轉車係咪無謂駁腳。
// 判斷邏輯同 runBeamSearch() 入面嘅 prevRouteAlreadyReachesDest 一致
// （見該處註解），呢度獨立實作一份輕量版本畀 calculateTransferQualityScore()
// 用，避免要抽出成個 beam search 嘅 state 先計到。
function _legRouteAlreadyReachesDestination(rideLeg, destPoint) {
  if (!rideLeg || rideLeg.type !== "ride" || !rideLeg.r || !rideLeg.co || !destPoint) return false;
  const stopsArr = rideLeg.r.stops && rideLeg.r.stops[rideLeg.co];
  if (!stopsArr) return false;
  const alightIdx = stopsArr.indexOf(rideLeg.alightStopId);
  if (alightIdx < 0) return false;
  const walkLimit = Math.max(ENDPOINT_WALK_RADIUS_M, MAX_TRANSFER_WALK_M);
  for (let k = alightIdx; k < stopsArr.length; k++) {
    const laterStop = etaDb.stopList[stopsArr[k]];
    if (!laterStop || !laterStop.location) continue;
    if (distM(laterStop.location, destPoint) <= walkLimit) return true;
  }
  return false;
}

// 判斷次程路線能唔能夠直達終點
function _legRouteCanReachDestinationDirectly(rideLeg, destPoint) {
  if (!rideLeg || rideLeg.type !== "ride" || !rideLeg.r || !rideLeg.co || !destPoint) return false;
  const stopsArr = rideLeg.r.stops && rideLeg.r.stops[rideLeg.co];
  if (!stopsArr) return false;
  const boardIdx = stopsArr.indexOf(rideLeg.boardStopId);
  if (boardIdx < 0) return false;
  const walkLimit = Math.max(ENDPOINT_WALK_RADIUS_M, MAX_TRANSFER_WALK_M);
  for (let k = boardIdx; k < stopsArr.length; k++) {
    const laterStop = etaDb.stopList[stopsArr[k]];
    if (!laterStop || !laterStop.location) continue;
    if (distM(laterStop.location, destPoint) <= walkLimit) return true;
  }
  return false;
}

// 計算轉乘評分：100 分為滿分，完全獨立於行程耗時，有賞有罰。
function calculateTransferQualityScore(legs, directExists, isDeepNight, destPoint) {
  let scoreAdjust = 0;
  const rideLegs = legs.filter(l => l.type === "ride");

  // 能覆蓋行程起終點的直達車：全程淨係一程車，唔使轉乘
  if (rideLegs.length === 1 && directExists) {
    scoreAdjust += TQS_BONUS_DIRECT;
  }

  let prevCompany = null;
  let prevRideLeg = null;

  legs.forEach((leg, idx) => {
    if (leg.type === "walk") {
      const isTransferWalk = !directExists && idx > 0 && idx < legs.length - 1;
      if (isTransferWalk) {
        const fromStop = leg.fromStopId ? etaDb.stopList[leg.fromStopId] : null;
        const toStop = leg.toStopId ? etaDb.stopList[leg.toStopId] : null;
        const isSameGroupWalk = isSameTransferPoint(fromStop, toStop);
        const isOfficialWalk = isOfficialInterchangeName(fromStop?.name?.zh || "") ||
                                isOfficialInterchangeName(toStop?.name?.zh || "");
        // 無謂步行：轉乘步行揀咗一個唔屬於官方轉車站、亦唔屬於同一轉乘
        // 點/站群嘅站去轉車，純粹搜尋行去另一個唔相干嘅站，屬於無謂駁腳。
        if (!isSameGroupWalk && !isOfficialWalk) {
          scoreAdjust -= TQS_PENALTY_UNNECESSARY_WALK;
        }
      }
      return;
    }

    // leg.type === "ride"
    if (prevCompany !== null) {
      const isRedundantTransfer = _legRouteAlreadyReachesDestination(prevRideLeg, destPoint);

      if (isRedundantTransfer) {
        // 深夜取消轉乘及跨公司懲罰
        if (!isDeepNight) scoreAdjust -= TQS_PENALTY_REDUNDANT_TRANSFER;
        // 無謂駁腳唔會再攞任何賞分（同站群/官方轉車站/大型站/同公司）
      } else {
        const alightStopObj = prevRideLeg ? etaDb.stopList[prevRideLeg.alightStopId] : null;
        const boardStopObj = etaDb.stopList[leg.boardStopId];
        const alightStopName = alightStopObj?.name?.zh || "";
        const boardStopName = boardStopObj?.name?.zh || "";

        const isOfficialInterchange = isOfficialInterchangeName(alightStopName) || isOfficialInterchangeName(boardStopName);
        const isSameStopGroup = isSameTransferPoint(alightStopObj, boardStopObj);
        // 站群本身路線好多（唔理有冇特別命名），都當佢係大型轉車站
        const isLargeInterchange = isDataDrivenHubStop(prevRideLeg?.alightStopId) || isDataDrivenHubStop(leg.boardStopId);
        const isSameCompany = transferCompanyGroupId(leg.co) === transferCompanyGroupId(prevCompany);
        // 【修正二】聯營路線（一條路線本身由幾間公司夾埋一齊營運，例如
        // 城巴/新巴聯營、九巴/龍運聯營）嘅 leg.co／primaryCo 淨係揀咗其
        // 中一間公司做代表，唔反映真正嘅「呢步轉車係唔係跨公司」——用呢
        // 個代表 co 嚟判斷 isSameCompany，攞嚟加分或減分都冧唔到道理
        // （例如同一程聯營路線,可能純粹因為評估時揀咗唔同代表 co,就分別
        // 撞正「同公司」或者「跨公司」,結果同一個轉車位竟然可以因為代表
        // co 揀法唔同而評分唔一樣）。只要轆前／後任何一程本身係聯營路線
        // （companies.length > 1），呢一步轉車就完全唔應該因為代表 co
        // 啱唔啱而加或減分，一律中立處理（其他同轉車質性無關嘅賞分，例
        // 如官方轉車站／同站群／大型轉車站，唔受影響）。
        const isJointRouteTransfer =
          (Array.isArray(prevRideLeg?.companies) && prevRideLeg.companies.length > 1) ||
          (Array.isArray(leg?.companies) && leg.companies.length > 1);

        if (isOfficialInterchange) scoreAdjust += TQS_BONUS_OFFICIAL_INTERCHANGE;
        if (isSameStopGroup) scoreAdjust += TQS_BONUS_SAME_STOP_GROUP;
        if (isLargeInterchange) scoreAdjust += TQS_BONUS_LARGE_INTERCHANGE;
        if (isSameCompany && !isJointRouteTransfer) scoreAdjust += TQS_BONUS_SAME_COMPANY;

        // 次程路線能直達終點：轉呢一程之後就唔會再需要轉第三程，避免
        // 無謂轉車。
        const isNextLegDirectToDest = _legRouteCanReachDestinationDirectly(leg, destPoint);
        if (isNextLegDirectToDest) scoreAdjust += TQS_BONUS_NEXT_LEG_DIRECT_TO_DEST;

        // 非必要跨公司轉乘：官方轉車站／BBI 轉乘站＝「從區內前往位於區內
        // 轉車站」，豁免呢項罰分；深夜同樣豁免；聯營路線（見上面
        // isJointRouteTransfer 註解）亦豁免。
        if (!isSameCompany && !isOfficialInterchange && !isDeepNight && !isJointRouteTransfer) {
          scoreAdjust -= TQS_PENALTY_CROSS_COMPANY;
        }
      }
    }

    prevCompany = leg.co;
    prevRideLeg = leg;
  });

  return Math.max(TQS_MIN, Math.min(TQS_MAX, scoreAdjust));
}

// 轉車站群感知上車站搜尋
// 循環線判斷

// 【城巴 ctb_route_ids.json 站序範圍輔助判斷】id／longId 入面「CTB||路線
// 分支代號||起始站序||結束站序||內部編號||方向」，例如 701 的
// "CTB||701-HOL-1||6||16||10574||I"：代表官方將同一條圈嘅站序（0/1 開
// 始一直數到圈尾）拆開兩段分別標做「去程」「回程」範圍，起始／結束站序
// 就係第 3、4 個 "||" 分隔嘅欄位。真正嘅點對點（非循環）路線，O／I 兩
// 個方向各自係獨立嘅站序，唔會共用、重疊同一個範圍；淨係循環線先會出現
// O 同 I 嘅站序範圍互相重疊（例如 701：O=1~11、I=6~16，6~11 呢一段
// 兩邊都算入去）。
function _parseCtbRouteIdRange(idStr) {
  if (!idStr) return null;
  const parts = String(idStr).split("||");
  if (parts.length < 4) return null;
  const start = parseInt(parts[2], 10);
  const end = parseInt(parts[3], 10);
  if (!Number.isFinite(start) || !Number.isFinite(end)) return null;
  return { start, end };
}

function _ctbBoundRangesOverlap(routeNo) {
  if (!ctbRouteIdsDb) return false;
  const boundsObj = ctbRouteIdsDb[String(routeNo || "").toUpperCase().trim()];
  if (!boundsObj) return false;
  const oRange = _parseCtbRouteIdRange(boundsObj.O && boundsObj.O.id);
  const iRange = _parseCtbRouteIdRange(boundsObj.I && boundsObj.I.id);
  if (!oRange || !iRange) return false;
  return oRange.start <= iRange.end && iRange.start <= oRange.end;
}

let circularRouteCos = new Map(); // "co|route" -> true(呢間公司行呢條路線係循環線)
function _markCircularRoutes(fareDb) {
  circularRouteCos = new Map();
  if (!fareDb || typeof fareDb !== "object") return;
  const hasInbound = new Map(); // "co|route" -> boolean（曾經見過 "I" 就係 true，"OI" 唔計入呢個 map）
  const hasOI = new Set();      // "co|route" -> 曾經撞中明確嘅 "OI" 循環線標記
  for (const routeData of Object.values(fareDb)) {
    if (!routeData || !routeData.route || !routeData.bound || typeof routeData.bound !== "object") continue;
    const coList = Array.isArray(routeData.co) ? routeData.co : (routeData.co ? [routeData.co] : []);
    for (const co of coList) {
      const boundVal = routeData.bound[co];
      if (boundVal === undefined || boundVal === null || boundVal === "") continue;
      const key = `${co}|${routeData.route}`;
      const boundUpper = String(boundVal).toUpperCase();
      // 【OI 優先於 O／I】"OI" 本身已經係 routeFareList.min.json 官方明確
      // 標記嘅循環線（去、返程共用同一個圈），一定要蓋過同一條路線底下
      // 其他 serviceType 變體零散出現嘅 "O"／"I"（好多時淨係方向拆件、
      // 冇 gtfsId／freq 嘅殘留半圈記錄，例如 701 服務類型 1 除咗真正
      // 嘅 "OI" 圈之外，仲有一對冇資料嘅 "O"／"I" 記錄），否則會誤判
      // 成「見過 I，唔係循環線」。
      if (boundUpper === "OI") {
        hasOI.add(key);
        continue;
      }
      const isInbound = boundUpper.startsWith("I");
      if (isInbound) {
        hasInbound.set(key, true);
      } else if (!hasInbound.has(key)) {
        hasInbound.set(key, false);
      }
    }
  }
  const allKeys = new Set([...hasInbound.keys(), ...hasOI]);
  for (const key of allKeys) {
    if (hasOI.has(key)) {
      circularRouteCos.set(key, true); // 撞中「OI」就一定係循環線，優先於任何 O/I 分支判斷
      continue;
    }
    const inbound = hasInbound.get(key) === true;
    if (inbound) {
      // 【城巴專屬補強】routeFareList.min.json 呢邊冇撞中明確嘅 "OI"，
      // 但都見過 "I"，唔代表一定唔係循環線——再用 ctb_route_ids.json
      // 嘅 O／I 站序範圍係咪重疊核實一次（見 _ctbBoundRangesOverlap
      // 註解），重疊即代表官方將同一個圈拆咗做兩段標，實質仍然係循環線。
      const [co, routeNo] = key.split("|");
      if (co === "ctb" && _ctbBoundRangesOverlap(routeNo)) {
        circularRouteCos.set(key, true);
        continue;
      }
    }
    circularRouteCos.set(key, !inbound); // 從來冇見過 "I"／"OI" 就當循環線
  }
}

function isCircularRouteCo(routeNo, co) {
  if (!routeNo || !co) return false;
  return circularRouteCos.get(`${co}|${routeNo}`) === true;
}

function _groupBoardIndices(r, co, boardStopId) {
  const stops = r && r.stops ? r.stops[co] : null;
  if (!stops || !etaDb || !etaDb.stopList) return [];
  const anchorStop = etaDb.stopList[boardStopId];
  const out = [];
  const seenStopIds = new Set();
  // 【循環線例外】呢條路線（呢間公司）冇 "I"（回程）——成程都係一個單向
  // 嘅圈，圈入面隨時有兩個名/位置好似（甚至一樣）嘅站牌，分別代表「啱啱
  // 出發」同「兜完成個圈」兩個完全唔同嘅位置。如果照舊靠 isSameTransferPoint
  // 撈埋，就會將用戶揀嗰個站，同圈入面第二次經過嘅同名站混做一齊，落面
  // 撈 ETA 隨時錯攞咗「兜完圈」嗰個站嘅實時資料，變成顯示錯咗上車站。
  // 所以循環線淨係認返 stopId 完全一樣嗰個，唔再靠名/位置撈第二個候選。
  const routeCircular = isCircularRouteCo(r?.route, co);
  stops.forEach((stopId, idx) => {
    if (!stopId || seenStopIds.has(stopId)) return;
    if (stopId === boardStopId) {
      out.push({ idx, stopId });
      seenStopIds.add(stopId);
      return;
    }
    if (routeCircular) return;
    const s = etaDb.stopList[stopId];
    if (anchorStop && s && isSameTransferPoint(anchorStop, s)) {
      out.push({ idx, stopId });
      seenStopIds.add(stopId);
    }
  });
  return out;
}

// 檢查某條路線喺附近時段內係咪有班次

// freq 日子類型判定某日子係否官方公佈嘅公眾假期
function _isDesignatedPublicHoliday(when) {
  if (!routeFareDb || !Array.isArray(routeFareDb.holidays)) return false;
  const yyyy = when.getFullYear();
  const mm = String(when.getMonth() + 1).padStart(2, '0');
  const dd = String(when.getDate()).padStart(2, '0');
  return routeFareDb.holidays.includes(`${yyyy}${mm}${dd}`);
}

// 【freq 日子類型核實，加強版】routeFareList.min.json 入面 freq 嘅最外層
// 「日子類型」key，原來因應唔同巴士公司嘅爬蟲寫法，其實有兩種完全唔同
// 嘅格式：
//   1) 文字格式：部分公司直接寫 "weekday"/"saturday"/"sunday"/"holiday"
//      呢類可讀字串。
//   2) 數字 bitmask 格式（用戶提供咗實際數據反推確認）：例如城巴 1 號線
//      嘅 freq key 係 "287"/"288"/"448"，同官方時間表（06:00-18:35
//      15-20分鐘／18:35-23:00 20-25分鐘 = 平日；06:00-10:00 20分鐘／
//      10:00-19:00 12-15分鐘／19:00-23:00 20-25分鐘 = 星期六；06:00-19:00
//      15-20分鐘／19:00-23:00 20-25分鐘 = 星期日及公眾假期）逐段核對後，
//      得出嚴格對應嘅位元定義：
//        bit0 (1)   = 星期一      bit4 (16)  = 星期五
//        bit1 (2)   = 星期二      bit5 (32)  = 星期六
//        bit2 (4)   = 星期三      bit6 (64)  = 星期日
//        bit3 (8)   = 星期四      bit7 (128) = 公眾假期
//      287 = 1+2+4+8+16+256 = 星期一至五（+256 係三個範例都出現嘅固定
//      基數，同日子判斷無關，判斷時要 &0xFF 篩走佢先比對）；
//      288 = 32+256 = 星期六；
//      448 = 64+128+256 = 星期日＋公眾假期（合併做一個 block，同官方
//      時間表「星期日及公眾假期」呢個分類完全對應）。
function _resolveFreqDayTypeKey(freq, when) {
  if (!freq) return null;
  const dayTypes = Object.keys(freq);
  if (!dayTypes.length) return null;

  const day = when.getDay(); // 0 = 星期日, 1 = 星期一, ..., 6 = 星期六

  // 1. 文字格式處理（如 "weekday", "saturday", "sunday", "holiday" 等）
  let textKey = null;
  if (day === 0) {
    textKey = dayTypes.find(k => /sun|holiday/i.test(k));
  } else if (day === 6) {
    textKey = dayTypes.find(k => /sat/i.test(k)) || dayTypes.find(k => /weekend|holiday/i.test(k));
  } else {
    textKey = dayTypes.find(k => /weekday|normal/i.test(k)) || dayTypes.find(k => /mon|tue|wed|thu|fri/i.test(k));
  }
  if (textKey) return textKey;

  // 2. 檢查是否全為數字 Bitmask 格式
  const allNumeric = dayTypes.every(k => /^\d+$/.test(k));
  if (!allNumeric) return null;

  // 位元定義:
  // bit0(1) = 一, bit1(2) = 二, bit2(4) = 三, bit3(8) = 四, bit4(16) = 五, bit5(32) = 六, bit6(64) = 日, bit7(128) = 公眾假期
  const DOW_BIT = [64, 1, 2, 4, 8, 16, 32]; // 索引對應 Date.getDay()
  const dowBit = DOW_BIT[day];
  const isHoliday = _isDesignatedPublicHoliday(when);

  // 解析所有 Key 並以 & 0xFF 取得純 8-bit 遮罩（自動消除 256 基數）
  const parsedKeys = dayTypes.map(k => ({
    key: k,
    mask: parseInt(k, 10) & 0xff
  }));

  // 計算設定的 Bit 數（用於精確度排序，包含越少非相關日子的 Block 優先）
  const countBits = (n) => {
    let count = 0;
    let val = n;
    while (val > 0) {
      if (val & 1) count++;
      val >>= 1;
    }
    return count;
  };

  // 情境 A：今日係公眾假期
  if (isHoliday) {
    // 優先 1：尋找有 set 128 bit (公眾假期) 的 Key（如 448 [192], 480 [224], 511 [255]）
    const holidayKeys = parsedKeys.filter(item => (item.mask & 128) === 128);
    if (holidayKeys.length > 0) {
      holidayKeys.sort((a, b) => countBits(a.mask) - countBits(b.mask));
      return holidayKeys[0].key;
    }

    // 優先 2：若沒有任何 Key set 128 bit（例如小巴只有 "31" [平日] 和 "96" [六日/假期]）
    // 假期自動降級套用包含 星期日 (64) 或 星期六 (32) 的假日 Block
    const weekendOrSunKeys = parsedKeys.filter(item => (item.mask & (64 | 32)) > 0);
    if (weekendOrSunKeys.length > 0) {
      weekendOrSunKeys.sort((a, b) => countBits(a.mask) - countBits(b.mask));
      return weekendOrSunKeys[0].key;
    }
  }

  // 情境 B：非公眾假期
  // 優先 1：符合今日星期幾 (dowBit)，且沒有 set 128 bit（避免平峰期誤配假期專用 Block）
  const strictDowKeys = parsedKeys.filter(item => (item.mask & dowBit) === dowBit && (item.mask & 128) === 0);
  if (strictDowKeys.length > 0) {
    strictDowKeys.sort((a, b) => countBits(a.mask) - countBits(b.mask));
    return strictDowKeys[0].key;
  }

  // 優先 2：放寬條件，只要包含今日 dowBit 即可（例如正常星期日匹配 448 [192]，或每日服務 511 [255]）
  const anyDowKeys = parsedKeys.filter(item => (item.mask & dowBit) === dowBit);
  if (anyDowKeys.length > 0) {
    anyDowKeys.sort((a, b) => countBits(a.mask) - countBits(b.mask));
    return anyDowKeys[0].key;
  }

  return null;
}

// 【freq 數值格式核實】routeFareList.min.json 嘅 freq 內層，每個時段 key
// 對應嘅值，用戶提供咗實際 API 回應確認真正格式係一個陣列
// [結束時間字串, 班距秒數字串]，例如 "0600": ["0720", "1200"] 代表
// 06:00-07:20 呢一段，班距係 1200 秒（= 20 分鐘），唔係之前程式碼一直
// 假設嗰種「15-20」直接寫明分鐘範圍嘅字串。
function _freqEntryToMinutes(entry) {
  if (entry == null) return null;
  if (Array.isArray(entry)) {
    const headwaySecs = Number(entry[1]);
    if (Number.isFinite(headwaySecs) && headwaySecs > 0) {
      return Math.max(1, Math.round(headwaySecs / 60));
    }
    return null;
  }
  const nums = String(entry).match(/\d+/g);
  if (!nums) return null;
  return Math.max(...nums.map(Number));
}

// 【共用、修正「null 值」同「搵唔到」混淆嘅根本 bug】routeFareList.min.json
// 嘅 freq 內層，每個時段 key 對應嘅值，其實有兩種完全唔同嘅語義（用戶提供
// 咗 E42／N281／N42 嘅實際數據反推確認）：
//   1) 陣列 [結束時間, 班距秒數]：呢個 key 代表一個「由 key 到結束時間」嘅
//      連續行車時段，程入面每隔「班距秒數」就有一班車（例如 E42 嘅
//      "0530": ["0710","1200"] = 05:30-07:10 呢段，每 1200 秒＝20 分鐘一班）。
//   2) null：呢個 key 本身就係一個獨立、已知嘅實際開車時刻，唔存在「班距」
//      呢回事——常見於通宵線、每日得兩三班嘅超低頻路線。例如 N42（耀安→
//      東涌）成日淨係 "0350": null 同 "0450": null 兩個 key，代表淨係得
//      呢兩班車，唔係一個由 03:50 開始、每隔某個班距一班嘅時段。
//
// 舊寫法一律用 `matchedEntry = table[key]` 之後淨係靠 `matchedEntry == null`
// 判斷「有冇搵到啱嘅時段」——完全冇考慮到「搵到咗個 key、但佢個值本身合法
// 咁就係 null（即上面情況 2 嘅獨立班次）」同「乜嘢 key 都冇搵到」根本係
// 兩回事，前者被誤判做後者，跌落去攞完全唔啱嘅「保底估算」邏輯，就係
// 分站時間亂晒、深夜／清晨顯示唔存在班次嘅根本原因。而家用明確嘅「揾到
// 未揾到」控制流程（唔靠值嘅 truthy/falsy）,並且將「陣列時段」同「null
// 單點」分開處理，各自用返啱嘅語義：
//   - 陣列時段：而家啱啱好跌喺呢個時段入面 = 即刻開始等，等候時間 = 呢個
//     時段嘅班距；
//   - null 單點：呢個 key 本身就已經係實際開車時刻，唔使再加任何班距
//     估算，只要計返「距離呢一刻仲有幾耐」就得（如果已經過咗，就搵下一個
//     未過嘅單點／時段）。
// 傳返 { etaDate, isFutureBlock, isPointDeparture } 或者 null
// （代表喺呢個 lookaheadMin 範圍內，今日確實冇更多已知班次）。
function _nextGridDeparture(blockStartMins, headwayMins, nowMins) {
  const elapsed = nowMins - blockStartMins;
  const steps = Math.ceil(elapsed / headwayMins);
  return blockStartMins + Math.max(0, steps) * headwayMins;
}

function _toMinutes(timeStr) {
  if (!timeStr) return 0;
  const s = String(timeStr).padStart(4, '0');
  const hh = parseInt(s.substring(0, s.length - 2), 10) || 0;
  const mm = parseInt(s.substring(s.length - 2), 10) || 0;
  return hh * 60 + mm;
}

// 【第三種 freq 格式：自我對應嘅「退化陣列」，實際係單點班次，唔係
// 連續時段】上面兩種已知格式係：1) 陣列 [結束時間,班距秒] 代表一個
// 「開始到結束」嘅連續行車時段；2) null 代表一個獨立、已知嘅實際開車
// 時刻。用戶提供嘅 49S（灣仔 專線小巴）數據反映出第三種格式：陣列嘅
// 第一個元素同個 key 本身完全一樣（例如 "0030": ["0030","60"]），即係
// 一個「開始時間＝結束時間」嘅零闊度「時段」。
// 如果盲目跌落去用第一種格式嘅邏輯（endMins<=startMins 就當跨午夜，
// 加 24 小時），就會將呢個本應係單點班次嘅記錄，誤判做「由呢一刻一路
// 去到翌日同一時刻都有車，班距=entry[1]/60 分鐘」——49S 嘅 entry[1]
// 全部都係 "60"，除以 60 秒得出嘅班距淨係 1 分鐘，於是 8 個時刻嘅假
// 「1 分鐘一班、成日 24 小時」時段疊埋一齊，幾乎覆蓋成日，令任何一個
// 時間點都被誤判「有車」——同 49S 實際上只喺 00:00/00:30/01:00/01:40/
// 03:00/03:25/03:50/04:15 呢 8 個唔規則、獨立嘅時刻先有一班車嘅事實
// 完全唔符，亦係「07:30 都顯示 49S 有推算班次」呢個誤報嘅根因。
// 而家專門偵測「結束時間同開始時間（同一個 key）完全一樣」呢種退化
// 陣列，將佢當同 null 一樣嘅單點班次處理，唔會再膨脹做假時段。
function _isDegenerateArrayEntry(entry, startMins) {
  if (!Array.isArray(entry)) return false;
  return _toMinutes(entry[0]) === startMins;
}

function _computeFreqDeparture(table, now, lookaheadMin) {
  if (!table) return null;
  const keys = Object.keys(table);
  if (!keys.length) return null;

  const nowMins = now.getHours() * 60 + now.getMinutes();
  const sortedKeys = keys.slice().sort((a, b) => _toMinutes(a) - _toMinutes(b));

  // 【唔再「搵到第一個岩就即刻 return」】sortedKeys 係按鐘面時間排序（例如
  // 0600 排喺 2300 之前），但如果最後一個時段跨咗午夜（例如尾班車時段
  // "2300": ["0100",...]，代表 23:00 至翌日 01:00），喺凌晨查詢嗰陣，真正
  // 生效緊嘅正正係呢一段排得最後嘅時段，但按列表順序行落去之前，會俾一個
  // 排得前啲、其實仲未開始嘅日頭時段（例如 0600 嗰段）當成「未來第一個
  // 時段」提早 return 咗。所以而家逐個 key 都收集齊晒合資格嘅候選，最後
  // 先揀「等候時間最短」嗰一個，唔受列表排序影響。
  let best = null; // { diffMins, etaDate, isFutureBlock, isPointDeparture }
  const consider = (diffMins, isFutureBlock, isPointDeparture) => {
    if (diffMins < 0 || diffMins > lookaheadMin) return;
    if (!best || diffMins < best.diffMins) {
      best = {
        diffMins,
        etaDate: new Date(now.getTime() + diffMins * 60000),
        isFutureBlock,
        isPointDeparture
      };
    }
  };

  for (let i = 0; i < sortedKeys.length; i++) {
    const startKey = sortedKeys[i];
    const entry = table[startKey];

    let startMins = _toMinutes(startKey);
    let endMins = 0;
    let headwayMins = 20;

    if (entry === null || _isDegenerateArrayEntry(entry, startMins)) {
      // 處理單點定時班次 (如通宵線/特別班；亦包括 49S 呢類「結束時間同
      // 開始時間一樣」嘅退化陣列，見 _isDegenerateArrayEntry() 頂部註解)
      if (startMins >= nowMins) {
        consider(startMins - nowMins, true, true);
      }
      continue;
    } else if (Array.isArray(entry)) {
      // 解析 ["1920", "1200"] 格式 -> [結束時間字串, 班距秒數]
      endMins = _toMinutes(entry[0]);
      // 修正跨午夜時段
      if (endMins <= startMins) endMins += 24 * 60;
      headwayMins = Math.max(1, Math.round(Number(entry[1]) / 60));
    } else if (typeof entry === 'string' || typeof entry === 'number') {
      headwayMins = _freqEntryToMinutes(entry) || 20;
      const nextKey = i < sortedKeys.length - 1 ? sortedKeys[i + 1] : null;
      endMins = nextKey ? _toMinutes(nextKey) : 1440;
    }

    // 【修正尾班車邊界：結束時間本身就係「尾班車開出時刻」，唔係一個
    // 純粹排他性嘅截止刻】用戶提供實際 routeFareList.min.json 數據反推
    // 證實：陣列時段嘅結束時間，同 GTFS frequencies.txt 嗰種「結束
    // 時間不包含在內」語義唔一樣——結束時間同開始時間之間嘅跨度，一定
    // 啱啱好係班距嘅整數倍（例如 "2330":["2430","900"] 即 23:30 到翌日
    // 00:30，跨度 60 分鐘，啱啱好係 15 分鐘班距嘅 4 倍，代表尾班車就係
    // 響 00:30 開；"1850":["2330","1200"] 跨度 280 分鐘，啱啱好係 20
    // 分鐘班距嘅 14 倍，代表尾班車就係響 23:30 開），官方時間表明確噉
    // 將「結束時間」訂為呢個時段最後一班車實際開出嗰一刻，並非純粹一個
    // 「時段到此為止、留畀下一個時段接手」嘅界線。
    // 舊寫法一律用嚴格 `<`（入段檢查用 `<endMins`，出段檢查用
    // `<endMins`）將呢一刻排除咗，導致兩種症狀：(1) 如果呢個係全個
    // 時段表最後一段（真正嘅尾班車時段），啱啱好計到尾班車嗰一班會被
    // 拒收，冇任何候選頂替，令 _computeFreqDeparture() 錯誤噉話「今日
    // 已經冇車」，其實尾班車重未開（搵唔到尾班車）；(2) 呢個「表面睇
    // 落有時段資料、但實際完全揾唔到結果」嘅假陰性，會令下面 caller
    // （例如 scheduleFallback／isRouteActiveAroundTime）誤判做「呢個
    // 時段冇資料」，跌落去缺乏時段表約束嘅保底估算分支（例如通宵線嘅
    // 「35 分鐘後有車」常識估算），變相對一條其實有明確官方時段表嘅
    // 路線，做冇邊界約束嘅臆測（無限估算）。而家將入段檢查同出段檢查
    // 都改用 `<=`，令「啱啱好落喺結束時間嗰一刻」都算入呢個時段之內，
    // 並且的確有一班車響嗰一刻開出——呢個改動只會喺跨度啱啱好係班距
    // 整數倍（即官方特登噉設計）先會生效，對唔啱啱對齊嘅一般時段
    // （結束時間純粹係下一段接手嘅界線）完全冇影響，因為嗰種情況推算
    // 出嘅 nextDepMins 本身就唔會啱啱好等於 endMins。
    let effectiveNowMins = null;
    if (nowMins >= startMins && nowMins <= endMins) {
      effectiveNowMins = nowMins;
    } else if (endMins > 1440 && (nowMins + 1440) >= startMins && (nowMins + 1440) <= endMins) {
      effectiveNowMins = nowMins + 1440;
    }

    if (effectiveNowMins !== null) {
      const elapsed = effectiveNowMins - startMins;
      const steps = Math.ceil(elapsed / headwayMins);
      const nextDepMins = startMins + steps * headwayMins;

      // 若算出的班次已超出該區間 endMins，絕不向外推演，直接跳至下個
      // 時段；但結束時間本身係尾班車開出時刻（見上面註解），所以呢度
      // 用 <=（唔係 <）先岩，避免將尾班車嗰一班誤判做「超出時段」。
      if (nextDepMins <= endMins) {
        consider(nextDepMins - effectiveNowMins, false, false);
      }
      continue;
    }

    // 當前時間尚未到達該時段（未來第一個時段）
    if (nowMins < startMins) {
      consider(startMins - nowMins, true, false);
    }
  }

  // 找不到任何符合的時間區間，直接返回 null，不進行任何臆測或虛假班次補算
  if (!best) return null;
  return {
    etaDate: best.etaDate,
    isFutureBlock: best.isFutureBlock,
    isPointDeparture: best.isPointDeparture
  };
}

// 【serviceType 兄弟變體：索引建立】喺 etaDb.routeList 已經齊全（包括
// loadRouteFareData() 有可能額外補入嘅路線）之後，將每一條 route 物件
// 按「路線編號＋營辦商＋方向」分組。同一個分組入面嘅物件，即係同一條
// 路線、同一個方向、唔同 serviceType 嘅變體。
function _routeBoundValue(r, co) {
  if (!r || !r.bound) return "";
  return (typeof r.bound === "object") ? (r.bound[co] || "") : (r.bound || "");
}

function _routeSiblingKey(routeNo, co, boundVal) {
  return `${String(routeNo || "").toUpperCase()}|${co}|${boundVal || ""}`;
}

function buildRouteSiblingIndex() {
  if (!etaDb || !etaDb.routeList) return;
  routeSiblingIndex = new Map();
  for (const r of Object.values(etaDb.routeList)) {
    if (!r || !r.route || !Array.isArray(r.co)) continue;
    for (const co of r.co) {
      if (!r.stops || !r.stops[co] || !r.stops[co].length) continue;
      const key = _routeSiblingKey(r.route, co, _routeBoundValue(r, co));
      if (!routeSiblingIndex.has(key)) routeSiblingIndex.set(key, []);
