function getCompanies(r) {
  const companies = [];
  if (!r || !r.co) return companies;
  const coList = Array.isArray(r.co) ? r.co : [r.co];
  for (const c of coList) {
    if (r.stops && r.stops[c] && r.stops[c].length) {
      companies.push(c);
    }
  }
  return companies;
}

// 【循環線方向修正輔助】搵返某個 stopId 喺一條路線嘅站序陣列入面
// 出現喺邊個 idx（跨晒所有公司變體搵，搵到第一個就返）。搵唔到就
// 返 -1。畀「揀返上車站」嗰步用嚟比較「去程」同「回程」邊個先出現。
function _stopIdxInRoute(rr, stopId) {
  if (!rr || !rr.stops || !stopId) return -1;
  const cos = getCompanies(rr);
  for (const co of cos) {
    const arr = rr.stops[co];
    if (!arr) continue;
    const idx = arr.indexOf(stopId);
    if (idx !== -1) return idx;
  }
  return -1;
}

// 【判斷一個站序係咪另一個站序嘅「有序超集」】用嚟安全咁合併
// routeFareList.min.json 嘅 stops 資料——如果 fareList 嗰個版本包含晒
// 現有版本嘅全部站、順序又冇打亂（唔需要連續，容許中間插多咗漏咗嘅
// 分站），先至當佢係「補漏版」，可以放心攞嚟代替；如果唔係超集關係
// （例如兩份資料根本對唔上、次序有出入），就寧願保留現有、已經驗證
// 過嘅站序，唔好胡亂覆蓋。
function _isStopSeqSuperset(superArr, subArr) {
  if (!Array.isArray(superArr) || !Array.isArray(subArr)) return false;
  let i = 0;
  for (const s of superArr) {
    if (i < subArr.length && s === subArr[i]) i++;
  }
  return i === subArr.length;
}

// ============================================================
// 【聯營路線・跨公司 serviceType 錯配偵測／合併】
// ------------------------------------------------------------
// 背景：少數聯營路線（例如 118P、118R），九巴同城巴各自嘅原始資料對
// 「同一條實際行車路線」定義咗唔同嘅 serviceType（甚至同一條記錄入面
// co 陣列雖然寫齊晒兩間公司，但 stops 實際上得一間公司有齊資料）。結果
// etaDb.routeList 會出現兩條獨立嘅 key，各自淨係得一間公司嘅站序，但
// 佢哋停嘅站、行嘅路線本質上係同一條分支——落到用戶眼中會誤以為係兩
// 條唔同嘅分支揀，路線搜尋、鄰近站搜尋、beam search 擴展都會各自得返
// 一半公司嘅資料，唔完整。
//
// 呢個 function 用「同路線編號＋同方向＋站數相符＋實際公司資料互不重
// 疊＋起訖站文字大致夾得住」呢幾個信號一齊判斷，先確認兩條記錄真係屬
// 於同一條分支，然後將佢哋合併做一條記錄（stops／bound／co 攞埋兩邊、
// serviceType／seq 轉做「co -> 原本嗰個公司自己嘅數值」嘅物件，同其他
// 地方 r.serviceType[coKey] / r.seq[coKey] 嘅讀法一致），刪走多餘嗰條
// key，等呢種情況都當返做同一個分支處理。
function _coArrOf(r) {
  if (!r || !r.co) return [];
  return Array.isArray(r.co) ? r.co.filter(Boolean) : [r.co];
}

function _jointBranchLabelText(obj) {
  if (!obj) return "";
  if (typeof obj === "string") return obj;
  return obj.zh || obj.en || "";
}

function _jointBranchNormText(s) {
  if (!s) return "";
  return String(s).toUpperCase().replace(/[^A-Z0-9\u4e00-\u9fff]/g, "");
}

// 兩個站名文字經正規化（去晒標點/空格、轉大寫）之後，只要其中一個係
// 另一個嘅子字串就當夾得住——處理「城巴/聯營資料版本」用全稱（例如
// 「基榮小學, 荔枝角道」）、「九巴自己版本」用簡稱（「基榮小學」）呢
// 種常見落差。
function _jointBranchTextOverlaps(a, b) {
  const na = _jointBranchNormText(a);
  const nb = _jointBranchNormText(b);
  if (!na || !nb) return false;
  return na.includes(nb) || nb.includes(na);
}

// 方向：唔理邊間公司，撈第一個非空嘅 O/I（或者 OI）出嚟。
function _jointBranchDirection(r) {
  if (!r || !r.bound) return null;
  if (typeof r.bound === "string") return r.bound.trim().toUpperCase() || null;
  for (const v of Object.values(r.bound)) {
    if (v) return String(v).trim().toUpperCase();
  }
  return null;
}

// 站數：優先用實際已有站序資料嘅公司嗰邊 stops[co].length；完全冇站序
// 資料先跌返用 seq（呢個 schema 入面 seq 本身就係代表分站數目，見
// _ctbExpectedStopCount() 嘅同一套 fallback 邏輯）。
function _jointBranchStopCount(r) {
  if (!r) return null;
  const companies = getCompanies(r);
  let maxLen = 0;
  for (const co of companies) {
    const arr = r.stops && r.stops[co];
    if (Array.isArray(arr) && arr.length > maxLen) maxLen = arr.length;
  }
  if (maxLen) return maxLen;
  if (r.seq != null) {
    if (typeof r.seq === "object") {
      const vals = Object.values(r.seq).map(v => parseInt(v, 10)).filter(Number.isFinite);
      if (vals.length) return Math.max(...vals);
    } else {
      const n = parseInt(r.seq, 10);
      if (Number.isFinite(n)) return n;
    }
  }
  return null;
}

// 判斷 rA／rB 係咪應該當做同一分支嘅「serviceType 兄弟記錄」（而唔係
// 兩條真係唔同嘅分支）。要幾個信號一齊夾得住先算數，寧缺莫濫：
//   1. 路線編號一樣
//   2. 方向一樣（O/I/OI）
//   3. 兩邊實際有站序資料嘅公司完全冇重疊（唔重疊先代表係「同一條路
//      線、兩間公司各自得返一半資料」，如果重疊即係同一間公司自己都
//      有兩個唔同 serviceType，好可能係真係唔同嘅分支，唔應該夾埋）
//   4. 分站數目一致（兩邊都有得核實嘅情況下）
//   5. 起訖站文字大致夾得住（防止純粹路線編號、方向、站數啱好撞埋一
//      齊嘅唔相關記錄被錯誤合併）
function _areJointServiceTypeSiblings(rA, rB) {
  if (!rA || !rB || rA === rB) return false;
  if (!rA.route || !rB.route) return false;
  if (String(rA.route).toUpperCase().trim() !== String(rB.route).toUpperCase().trim()) return false;

  const dirA = _jointBranchDirection(rA);
  const dirB = _jointBranchDirection(rB);
  if (!dirA || !dirB || dirA !== dirB) return false;

  const companiesA = getCompanies(rA);
  const companiesB = getCompanies(rB);
  if (!companiesA.length || !companiesB.length) return false;
  const setA = new Set(companiesA);
  if (companiesB.some(c => setA.has(c))) return false; // 有重疊，唔算兄弟記錄

  const countA = _jointBranchStopCount(rA);
  const countB = _jointBranchStopCount(rB);
  if (countA != null && countB != null && countA !== countB) return false;

  const origOverlap = _jointBranchTextOverlaps(_jointBranchLabelText(rA.orig), _jointBranchLabelText(rB.orig));
  const destOverlap = _jointBranchTextOverlaps(_jointBranchLabelText(rA.dest), _jointBranchLabelText(rB.dest));
  if (!origOverlap || !destOverlap) return false;

  return true;
}

// 幫一個「原本淨係得單一 scalar serviceType／seq」嘅記錄，轉做
// 「co -> 呢間公司自己嗰個數值」嘅物件，等合併之後其他地方讀
// r.serviceType[coKey] / r.seq[coKey] 都攞得返正確數值。如果原本已經
// 係物件，就直接攞返嚟用（保留佢已有嘅其他公司 key）。
function _jointBranchToPerCoMap(rawVal, companies) {
  if (rawVal && typeof rawVal === "object" && !Array.isArray(rawVal)) return { ...rawVal };
  const out = {};
  if (rawVal == null) return out;
  for (const co of companies) out[co] = rawVal;
  return out;
}

// 將 secondary 呢條記錄嘅資料併入 primary（喺原地修改 primary），然後
// 由 caller 負責喺 routeList 度刪走 secondary 個 key。
function _mergeJointServiceTypeSiblingInto(primary, secondary) {
  const companiesPrimary = getCompanies(primary);
  const companiesSecondary = getCompanies(secondary);

  // co：兩邊實際公司做聯集
  const mergedCo = new Set([..._coArrOf(primary), ..._coArrOf(secondary), ...companiesPrimary, ...companiesSecondary]);
  primary.co = Array.from(mergedCo);

  // stops：secondary 補返 primary 未有嘅公司
  primary.stops = primary.stops || {};
  for (const co of companiesSecondary) {
    if (!primary.stops[co] && secondary.stops && secondary.stops[co]) {
      primary.stops[co] = secondary.stops[co];
    }
  }

  // bound：一樣，補返未有嘅公司（方向已經喺 _areJointServiceTypeSiblings
  // 核實過一致，呢度純粹補齊 key）
  primary.bound = primary.bound && typeof primary.bound === "object" ? { ...primary.bound } : {};
  if (secondary.bound && typeof secondary.bound === "object") {
    for (const [co, dir] of Object.entries(secondary.bound)) {
      if (primary.bound[co] === undefined) primary.bound[co] = dir;
    }
  } else if (secondary.bound && companiesSecondary.length && primary.bound[companiesSecondary[0]] === undefined) {
    primary.bound[companiesSecondary[0]] = secondary.bound;
  }

  // serviceType／seq：轉做 co -> 數值嘅物件，兩邊夾埋
  const svcPrimary = _jointBranchToPerCoMap(primary.serviceType, companiesPrimary);
  const svcSecondary = _jointBranchToPerCoMap(secondary.serviceType, companiesSecondary);
  primary.serviceType = { ...svcPrimary, ...svcSecondary };

  const seqPrimary = _jointBranchToPerCoMap(primary.seq, companiesPrimary);
  const seqSecondary = _jointBranchToPerCoMap(secondary.seq, companiesSecondary);
  const mergedSeq = { ...seqPrimary, ...seqSecondary };
  primary.seq = Object.keys(mergedSeq).length ? mergedSeq : primary.seq;

  // 車費／班次相關：邊條有真實資料就用邊條，primary 優先
  for (const field of ["fares", "faresHoliday", "freq", "gtfsId", "jt", "nlbId"]) {
    if ((primary[field] === undefined || primary[field] === null) &&
        secondary[field] !== undefined && secondary[field] !== null) {
      primary[field] = secondary[field];
    }
  }

  // 記低合併過嘅來源，方便 debug 追查
  primary._jointMergedFrom = Array.isArray(primary._jointMergedFrom) ? primary._jointMergedFrom : [];
  primary._jointMergedFrom.push(secondary.route + "|" + (secondary._jointBranchKeyId || ""));
}

// 主入口：掃描 routeList，將符合「serviceType 兄弟記錄」條件嘅記錄夾埋
// 一齊，回傳實際合併咗幾多對，方便 DEBUG_MODE 落 log 核實。
function mergeJointServiceTypeSiblingBranches(routeList) {
  if (!routeList) return 0;

  // 用「路線編號＋方向」粗略分組，避免成個 routeList O(n^2) 逐條比對。
  const groups = new Map();
  for (const [routeId, r] of Object.entries(routeList)) {
    if (!r || !r.route) continue;
    r._jointBranchKeyId = routeId;
    const dir = _jointBranchDirection(r);
    if (!dir) continue;
    const gk = `${String(r.route).toUpperCase().trim()}|${dir}`;
    if (!groups.has(gk)) groups.set(gk, []);
    groups.get(gk).push(routeId);
  }

  let mergedCount = 0;
  for (const ids of groups.values()) {
    if (ids.length < 2) continue;
    for (let i = 0; i < ids.length; i++) {
      const idA = ids[i];
      const rA = routeList[idA];
      if (!rA) continue; // 已經俾人合併走咗
      for (let j = i + 1; j < ids.length; j++) {
        const idB = ids[j];
        const rB = routeList[idB];
        if (!rB) continue;
        if (!_areJointServiceTypeSiblings(rA, rB)) continue;

        // 邊條做 primary：優先揀已經有車費／班次資料、或者已覆蓋較多
        // 公司嗰一條，減少之後仲要靠 loadRouteFareData() 補漏。
        const scoreA = (rA.fares ? 1 : 0) + (rA.freq ? 1 : 0) + (rA.gtfsId ? 1 : 0) + _coArrOf(rA).length;
        const scoreB = (rB.fares ? 1 : 0) + (rB.freq ? 1 : 0) + (rB.gtfsId ? 1 : 0) + _coArrOf(rB).length;
        const [primaryId, secondaryId] = scoreA >= scoreB ? [idA, idB] : [idB, idA];
        const primary = routeList[primaryId];
        const secondary = routeList[secondaryId];

        _mergeJointServiceTypeSiblingInto(primary, secondary);
        delete routeList[secondaryId];
        mergedCount++;

        if (DEBUG_MODE) {
          console.log(`[聯營 serviceType 兄弟分支合併] ${primary.route} 將 ${secondaryId} 併入 ${primaryId}（合併後公司：${_coArrOf(primary).join("、")}）`);
        }

        // secondaryId 已經冇咗，跳去比較下一個 j
      }
    }
  }
  return mergedCount;
}

function buildIndices(){
  // 【聯營路線・跨公司 serviceType 錯配偵測】喺起 stopRouteIndex 之前
  // 先行合併，等下面逐條路線起 index 嗰陣，已經係合併完、公司資料齊
  // 晒嘅版本，唔會將本質上同一條分支拆開兩份、各自得一半公司嘅資料。
  mergeJointServiceTypeSiblingBranches(etaDb.routeList);

  stopRouteIndex = new Map();
  _coLocatedRoutesCache.clear(); _stationGroupCache.clear(); _stationGroupRouteCountCache.clear(); // stopRouteIndex 重建，舊 cache 已經過期
  for (const [routeId, r] of Object.entries(etaDb.routeList)){
    const companies = getCompanies(r);
    if (!companies.length) continue;

    const primaryCo = companies[0];
    const primaryStops = r.stops[primaryCo];
    const primaryStopSet = new Set(primaryStops);
    primaryStops.forEach((stopId, idx) => {
      if (!stopId) return;
      if (!stopRouteIndex.has(stopId)) stopRouteIndex.set(stopId, []);
      stopRouteIndex.get(stopId).push({routeId, idx, companies, primaryCo});
    });

    // 【修正：補返其餘公司變體先有嘅站】部分聯營／同號多公司路線，唔同
    // 公司變體嘅站陣列唔完全一致——常見於總站/起點站淨係出現喺某個
    // 非 primaryCo 嘅公司變體入面，primaryCo 本身完全冇呢個站。之前呢
    // 度淨係用 primaryCo 起 stopRouteIndex，會令到兩個地方唔一致：
    // 「搵候選上車站」嗰步（見改善上車站搜尋段落）係跨晒 companies 全
    // 部變體去搵最近站，可以搵到一個 0 米（即起點正正就喺嗰個站）嘅
    // 候選；但去到實際 beam search 擴展（`stopRouteIndex.get(stopId)`）
    // 嗰陣，因為 primaryCo 冇呢個站，條路線根本唔會出現喺 routesHere
    // 度，結果呢個「應該最近、唔使行」嘅上車站其實用唔到，逼住搜尋
    // 揀第二個遠好多嘅站上車（例如要多行成公里）。而家將其餘公司變
    // 體入面、primaryCo 未覆蓋到嘅站都一拼補落 stopRouteIndex，等呢啲
    // 站喺實際搜尋擴展都真係用得返。
    for (const co of companies) {
      if (co === primaryCo) continue;
      const stops = r.stops[co];
      if (!stops) continue;
      stops.forEach((stopId, idx) => {
        if (!stopId || primaryStopSet.has(stopId)) return;
        if (!stopRouteIndex.has(stopId)) stopRouteIndex.set(stopId, []);
        stopRouteIndex.get(stopId).push({routeId, idx, companies, primaryCo: co});
      });
    }
  }
  buildGridIndex(etaDb.stopList);
  // 建立 serviceType 兄弟變體索引（見上面 routeSiblingIndex 頂部註解）。
  // loadRouteFareData() 有機會之後再補入額外路線（例如純粹存在於
  // routeFareList.min.json 但唔喺主 etaDb 入面嘅變體），所以嗰邊完成
  // 之後會再呼叫一次呢個 function 重建索引，確保新補入嘅路線都計得到。
  buildRouteSiblingIndex();
}

init();

/* ---------------- stop search / autocomplete ---------------- */
function searchStops(query, limit=18){
  const q = query.trim();
  if (!q || !etaDb) return [];
  const qLower = q.toLowerCase();
  const out = [];
  for (const [stopId, s] of Object.entries(etaDb.stopList)){
    const entries = stopRouteIndex.get(stopId);
    if (!entries) continue;
    const zh = s.name.zh || "";
    const en = s.name.en || "";
    if (zh.includes(q) || en.toLowerCase().includes(qLower)){
      if (!s.location) continue; // 防禦：個別站（例如座標比對失敗嘅港鐵站）可能冇座標
      const isMtr = entries.some(e => Array.isArray(e.companies) && e.companies.includes("mtr"));
      // 【修正：輕鐵 logo 而家只認真正嘅輕鐵站,唔再靠撞名】以前呢度淨係
      // 撞 lightRailDb.stopNameSet（純粹中文名一樣就算），會令好多同名
      // 但其實係普通巴士/小巴站嘅站牌都被加咗個輕鐵 logo，睇落好似「呢
      // 個巴士站係輕鐵站」，容易誤導。真正嘅輕鐧站喺 _buildLightRailRouteList()
      // 注入 etaDb.stopList 嗰陣，stopId 一定係 `LR-<code>` 呢個固定格式
      // （見 7195 行 stopIds = stationCodes.map(code => `LR-${code}`)），
      // 同任何巴士/小巴/港鐧嘅 stopId 都唔會撞——而家直接用呢個 stopId
      // 格式嚴格判斷,唔再用名稱比對咁寬鬆。
      const isLightRail = stopId.startsWith("LR-");
      out.push({stopId, zh, en, lat:s.location.lat, lng:s.location.lng, isMtr, isLightRail});
      if (out.length >= 400) break;
    }
  }
  out.sort((a,b)=>{
    const aS = a.zh.startsWith(q) ? 0 : 1;
    const bS = b.zh.startsWith(q) ? 0 : 1;
    if (aS !== bS) return aS - bS;
    return a.zh.length - b.zh.length;
  });

  // 取消將名稱相同/相似＋位置相近的站牌合併做代表性選項：
  // 站牌合併會將實際位置不同（例如市中心上車點 vs 總站）嘅站隱藏埋，
  // 令用戶無法喺 autocomplete 揀返最啱嘅實際上車站（例如 E42 喺市中心
  // 已經可以上車，但合併後只剩總站選項，變相迫用戶步行去總站）。
  // 現直接列出所有比對到嘅站牌，唔再經 isSameTransferPoint() 合併；
  // 路線搜尋（runBeamSearch/nearbyStops）本身已經會涵蓋鄰近站牌的路線，
  // 呢度只需要如實反映實際存在嘅每一個站牌畀用戶自行揀選。
  return out.slice(0, limit);
}

function wireAutocomplete(input, suggestEl, onPick){
  let debounce;
  input.addEventListener("input", () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      const results = searchStops(input.value);
      renderSuggest(suggestEl, results, onPick);
    }, 120);
  });
  input.addEventListener("focus", () => {
    if (input.value.trim()) {
      renderSuggest(suggestEl, searchStops(input.value), onPick);
    }
  });
  document.addEventListener("click", (e) => {
    if (!suggestEl.contains(e.target) && e.target !== input) suggestEl.hidden = true;
  });
}
function renderSuggest(suggestEl, results, onPick){
  suggestEl.innerHTML = "";
  if (!results.length){
    suggestEl.innerHTML = `<div class="empty">搵唔到相符嘅站</div>`;
    suggestEl.hidden = false;
    return;
  }
  for (const r of results){
    const btn = document.createElement("button");
    btn.type = "button";
    // 港鐵 logo：呢個站牌本身有港鐵路線提供服務（見 searchStops() 嘅
    // isMtr）。輕鐧 logo：見上面 searchStops() 嘅 isLightRail——已經改用
    // stopId 係唔係 `LR-` 開頭嚴格判斷（只有真正嘅輕鐧站，見
    // _buildLightRailRouteList()），唔再靠站名撞中 CSV 名單，所以唔會再
    // 對同名嘅普通巴士/小巴站錯誤加呢個 logo。兩個 logo 依家擺喺中文
    // 站名右邊（而唔係前面），避免遮住站名開頭嗰個字。
    const mtrIconHtml = r.isMtr
      ? `<img class="station-mode-icon" src="https://upload.wikimedia.org/wikipedia/en/archive/b/b9/20210510163405%21HK_MTR_logo.svg" title="港鐵">`
      : "";
    const lrIconHtml = r.isLightRail
      ? `<img class="station-mode-icon" src="https://static.wikia.nocookie.net/hk-rail/images/1/1d/LR_old.svg/revision/latest/scale-to-width-down/250?cb=20090629110056&path-prefix=zh" alt="輕鐵" title="鄰近輕鐵站">`
      : "";
    btn.innerHTML = `${escapeHtml(r.zh||r.en)}${mtrIconHtml}${lrIconHtml}<small>${escapeHtml(r.en||"")}</small>`;
    btn.addEventListener("click", () => {
      onPick({stopId:r.stopId, name:r.zh||r.en, lat:r.lat, lng:r.lng});
      suggestEl.hidden = true;
    });
    suggestEl.appendChild(btn);
  }
  suggestEl.hidden = false;
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

wireAutocomplete(originInput, originSuggest, (stop) => {
  origin = stop;
  originInput.value = stop.name;
  updatePickedMarkersOnMap();
  fitStopMapToPicked();
});
wireAutocomplete(destInput, destSuggest, (stop) => {
  destination = stop;
  destInput.value = stop.name;

});

$("#swapBtn").addEventListener("click", () => {

  updatePickedMarkersOnMap();

});

/* ---------------- 巴士站選點地圖 (Leaflet + OpenStreetMap) ---------------- */
let stopMap = null;
let stopMarkersLayer = null;
let originPickMarker = null;
let destPickMarker = null;
const MAP_STOP_VIEW_SPAN_M = 2000; // 地圖視窗闊度縮到幾多米內先顯示站牌
const MAP_STOP_MAX_MARKERS = 80;   // 效能上限,最多同時顯示幾多個站牌

let mapWasDragged = false;
let openStopMarker = null;

function initStopMap(){
  if (typeof L === "undefined") return; // Leaflet CDN 未載入就靜默跳過,唔阻住主功能
  stopMap = L.map("stopMap", { zoomControl: true }).setView([22.3193, 114.1694], 13); // 預設香港中心

  // 改用 CARTO 底圖
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    maxZoom: 19,
    subdomains: 'abcd',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(stopMap);

  stopMarkersLayer = L.layerGroup().addTo(stopMap);

  // 一開始郁地圖(拖曳/縮放)就即刻收埋現正顯示緊嘅站牌彈出視窗,唔會
  // 卡住喺畫面度跟住個地圖到處飄
  stopMap.on("movestart", () => {
    if (openStopMarker) { openStopMarker.closePopup(); openStopMarker = null; }
    mapWasDragged = false;
  });
  stopMap.on("drag", () => { mapWasDragged = true; });
  stopMap.on("dragend", () => {
    // 延遲少少先重設,等鬆手嗰一刻可能誤觸嘅 marker click handler
    // 都仲檢查得到呢個 flag,擋走呢個「假 click」
    setTimeout(() => { mapWasDragged = false; }, 60);
  });

  stopMap.on("moveend", refreshMapStops);
  refreshMapStops();
}

// 計算現時地圖視窗嘅實際闊/高度 (米),用嚟判斷有冇拉近到約 1 公里範圍
function mapViewSpanM(map){
  const b = map.getBounds();
  const sw = b.getSouthWest(), ne = b.getNorthEast();
  const widthM = L.latLng(sw.lat, sw.lng).distanceTo(L.latLng(sw.lat, ne.lng));
  const heightM = L.latLng(sw.lat, sw.lng).distanceTo(L.latLng(ne.lat, sw.lng));
  return Math.max(widthM, heightM);
}

function refreshMapStops(){
  if (!stopMap || !stopMarkersLayer) return;
  const hintEl = $("#mapZoomHint");
  stopMarkersLayer.clearLayers();
  openStopMarker = null; // 舊 marker 已經連同佢哋嘅 popup 一齊清走,追蹤變數都要一齊重設

  if (!etaDb || !etaDb.stopList){
    if (hintEl){ hintEl.textContent = "地圖載入中"; hintEl.classList.remove("active"); }
    return;
  }

  const spanM = mapViewSpanM(stopMap);
  if (spanM > MAP_STOP_VIEW_SPAN_M){
    if (hintEl){ hintEl.textContent = "放大地圖至 2 公里範圍，即顯示附近可供選擇巴士站"; hintEl.classList.remove("active"); }
    return;
  }

  const center = stopMap.getCenter();
  const radius = Math.min(spanM, MAP_STOP_VIEW_SPAN_M);
  const near = nearbyStops(center.lat, center.lng, radius)
    .sort((a, b) => a.dist - b.dist)
    .slice(0, MAP_STOP_MAX_MARKERS);

  if (hintEl){
    hintEl.textContent = near.length
      ? `顯示附近 ${near.length} 個巴士站，選擇站牌設定起點/終點`
      : "範圍沒有巴士站可供選擇";
    hintEl.classList.add("active");
  }

  for (const { stopId, dist } of near){
    const s = etaDb.stopList[stopId];
    if (!s || !s.location || !Number.isFinite(s.location.lat) || !Number.isFinite(s.location.lng)) continue;
    const zhName = (s.name && (s.name.zh || s.name.en)) || "未知站點";
    const enName = (s.name && s.name.en) || "";
    const marker = L.marker([s.location.lat, s.location.lng]);

    const popupEl = document.createElement("div");
    popupEl.innerHTML = `
      <div class="map-popup-title">${escapeHtml(zhName)}</div>
      <div class="map-popup-sub">${escapeHtml(enName)} · 距離約 ${Math.round(dist)} 米</div>
      <div class="map-pick-btns">
        <button type="button" class="origin-btn">設為起點</button>
        <button type="button" class="dest-btn">設為終點</button>
      </div>
    `;
    const stopForPick = { stopId, name: zhName, lat: s.location.lat, lng: s.location.lng };
    popupEl.querySelector(".origin-btn").addEventListener("click", () => {
      origin = stopForPick;
      originInput.value = zhName;
      marker.closePopup();
      updatePickedMarkersOnMap();
      fitStopMapToPicked();
    });
    popupEl.querySelector(".dest-btn").addEventListener("click", () => {
      destination = stopForPick;
      destInput.value = zhName;
      marker.closePopup();
      updatePickedMarkersOnMap();
      fitStopMapToPicked();
    });
    marker.bindPopup(popupEl);
    // 移除 bindPopup() 預設加落嘅 click handler,換成自己揸,先可以喺
    // 「啱啱拖曳緊/拖曳完」嘅時候主動忽略呢下 click,唔畀誤觸嘅彈出
    // 視窗卡住唔識自動收埋(詳見 initStopMap() 頂部註解)
    marker.off("click", marker._openPopup, marker);
    marker.on("click", () => {
      if (mapWasDragged) return; // 拖曳緊/啱啱拖曳完,呢下 click 好可能係誤觸,唔理佢
      if (openStopMarker && openStopMarker !== marker) openStopMarker.closePopup();
      openStopMarker = marker;
      marker.openPopup();
    });
    marker.on("popupclose", () => {
      if (openStopMarker === marker) openStopMarker = null;
    });
    marker.addTo(stopMarkersLayer);
  }
}

function updatePickedMarkersOnMap(){

  if (destPickMarker){ stopMap.removeLayer(destPickMarker); destPickMarker = null; }

    className: "",
    html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2.5px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.5);"></div>`,
    iconSize: [16, 16], iconAnchor: [8, 8]
  });

  if (origin && Number.isFinite(origin.lat) && Number.isFinite(origin.lng)){

      .bindTooltip("起點")

    destPickMarker = L.marker([destination.lat, destination.lng], { icon: mkIcon("#f6a800"), zIndexOffset: 1000 })

// 【起點／終點揀晒之後，自動縮放去成個起訖點範圍】用戶揀齊起點同終點
// （唔理係喺地圖度撳、GPS 定位、抑或自動完成搜尋揀），地圖都應該自動
// 縮放去啱啱好覆蓋到起訖點兩點嘅範圍，等用戶一眼睇晒成條路線大約行
// 邊，唔使自己手動拖/縮。如果淨係揀咗其中一邊（例如淨係得起點），就
// 縮去嗰一點附近嘅範圍，方便再喺地圖上揀返精準站牌。
function fitStopMapToPicked(){
  if (!stopMap) return;
  const pts = [];
  if (origin && Number.isFinite(origin.lat) && Number.isFinite(origin.lng)) pts.push([origin.lat, origin.lng]);
  if (destination && Number.isFinite(destination.lat) && Number.isFinite(destination.lng)) pts.push([destination.lat, destination.lng]);
  if (pts.length === 2) {
    stopMap.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
  } else if (pts.length === 1) {
    stopMap.setView(pts[0], 16);
  }
}

/* ---------------- Check Shape of Route ---------------- */
function analyzeCandidateShape(segs, straightLineTotalM){
  let accumulated = 0;
  const rideLegs = [];
  for (const s of segs){
    if (s.type === "ride"){
      const bLoc = etaDb.stopList[s.boardStopId];
      const aLoc = etaDb.stopList[s.alightStopId];
      if (bLoc && aLoc) accumulated += distM(bLoc.location, aLoc.location);
      rideLegs.push(s);
    } else if (s.type === "walk"){
      accumulated += s.distM || 0;
    }
  }

  let isCircuitous = false;
  if (straightLineTotalM > 300){
    const ratio = accumulated / straightLineTotalM;
    //放寬至 4.5 倍
    if (ratio > 4.5) isCircuitous = true;
  }

  let hasRedundantHop = false;

  for (let i = 0; i < rideLegs.length; i++) {
    const seg = rideLegs[i];
    const alightLoc = etaDb.stopList[seg.alightStopId]?.location;
    
    if (alightLoc) {
      const distToOrigin = distM(alightLoc, { lat: origin.lat, lng: origin.lng });
      if (distToOrigin <= 400) {
        hasRedundantHop = true;
        break;
      }
    }

    const nextSeg = segs[segs.indexOf(seg) + 1];
    if (nextSeg && nextSeg.type === "walk" && nextSeg.toStopId) {
      const walkToLoc = etaDb.stopList[nextSeg.toStopId]?.location;
      if (walkToLoc) {
        const distToOrigin = distM(walkToLoc, { lat: origin.lat, lng: origin.lng });
        if (distToOrigin <= 400) {
          hasRedundantHop = true;
          break;
        }
      }
    }
  }

  // 【修正一：聯營路線嘅站可能只出現喺另一個公司變體度】以前呢個掃描
  // 淨係睇 prevSeg.r.stops[prevSeg.primaryCo] 一個公司變體嘅站序，但同
  // 一條路線如果係聯營路線（例如城巴/新巴聯營、九巴/龍運聯營），呢程
  // 實際評估用嗰個 primaryCo（純粹搜尋過程隨機揀咗其中一間做代表）未
  // 必包含晒成條實際路線行經嘅全部站——某段可能淨係登記喺另一個公司
  // 變體嘅站序入面。結果就係好似「九龍城→紅磡→（轉車）→中環，中途
  // 115 本身已經行到去金鐘」呢類情況，因為金鐘嗰個站淨係出現喺 115 嘅
  // 另一個公司變體，用返 primaryCo 完全睇唔到，令最後一程（104）被誤
  // 判成「必要」，明明搭 115 已經可以直達，都照樣顯示多餘一程轉車。而
  // 家改用同「後便先至搭」檢測（下面）一致嘅做法：primaryCo 變體維持
  // 「淨係睇實際上車站之後 LOOKAHEAD_STOPS 個站」嘅窗口，其餘變體因為
  // 冇對得上嘅 boardIdx 基準，就掃晒成條站序。
  function _prevLegPassesNear(prevSeg, targetLoc) {
    if (!targetLoc) return false;
    const companies = Array.isArray(prevSeg.companies) && prevSeg.companies.length
      ? prevSeg.companies
      : (prevSeg.primaryCo ? [prevSeg.primaryCo] : []);
    for (const co of companies) {
      const stopsForCo = prevSeg.r.stops[co];
      if (!stopsForCo) continue;
      const isPrimary = co === prevSeg.primaryCo && Number.isFinite(prevSeg.boardIdx);
      const startK = isPrimary ? prevSeg.boardIdx + 1 : 0;
      const endK = isPrimary ? Math.min(stopsForCo.length - 1, prevSeg.boardIdx + LOOKAHEAD_STOPS) : stopsForCo.length - 1;
      for (let k = startK; k <= endK; k++) {
        const cLoc = etaDb.stopList[stopsForCo[k]]?.location;
        if (!cLoc) continue;
        if (distM(cLoc, targetLoc.location) <= MAX_TRANSFER_WALK_M) return true;
      }
    }
    return false;
  }

  if (!hasRedundantHop) {
    for (let i = 0; i < rideLegs.length && !hasRedundantHop; i++){
      const prevSeg = rideLegs[i];
      if (!prevSeg.r || !prevSeg.r.stops) continue;

      for (let j = i + 2; j < rideLegs.length && !hasRedundantHop; j++){
        const laterSeg = rideLegs[j];
        const targetLoc = etaDb.stopList[laterSeg.boardStopId];
        if (_prevLegPassesNear(prevSeg, targetLoc)) { hasRedundantHop = true; break; }
      }

      for (let j = i + 1; j < rideLegs.length && !hasRedundantHop; j++){
        const laterSeg = rideLegs[j];
        const targetLoc = etaDb.stopList[laterSeg.alightStopId];
        if (_prevLegPassesNear(prevSeg, targetLoc)) { hasRedundantHop = true; break; }
      }
    }
  }

  // 【新增偵測：後便先至搭嗰條路線，原來一開始已經上到】常見情況：
  // 喺起點搭路線 A 去到某站先轉搭路線 B，但其實路線 B 本身喺起點（或者
  // 好近起點）已經有站，根本唔使搭 A 先至轉車——一開始就等路線 B 就得。
  // 判斷方法：睇下呢程（第 2 程或之後）嘅路線，喺佢「實際上車站」之前
  // 嘅站序入面，係咪已經有一個站企埋喺原本起點好近（用返同轉車一樣嘅
  // MAX_TRANSFER_WALK_M 做門檻）——如果係，即係話呢班車一開始已經截得
  // 到，中間嗰程完全係多餘。
  // 【修正】呢條路線可能有幾個公司變體（例如同號多間公司聯營），起點
  // 附近嗰個站可能淨係出現喺另一個變體嘅站陣列度，而唔喺呢程實際用嗰
  // 個 primaryCo 度——所以呢度改為掃晒條路線嘅全部公司變體，唔止睇
  // laterSeg.primaryCo 嗰個。primaryCo 嗰個變體仲會額外限制淨係睇
  // 「實際上車站之前」嘅站（避免將順住路線去到好後面、方向可能已經唔
  // 同嘅站都當做「一開始已經上到」）；其餘變體因為冇對得上嘅 boardIdx
  // 基準，就掃晒成條站序。
  if (!hasRedundantHop && origin) {
    const originLocForRedundant = { lat: origin.lat, lng: origin.lng };
    for (let j = 1; j < rideLegs.length && !hasRedundantHop; j++) {
      const laterSeg = rideLegs[j];
      const laterCompanies = Array.isArray(laterSeg.companies) && laterSeg.companies.length
        ? laterSeg.companies
        : (laterSeg.primaryCo ? [laterSeg.primaryCo] : []);
      for (const co of laterCompanies) {
        const stopsForCo = laterSeg.r?.stops?.[co];
        if (!stopsForCo) continue;
        const scanEnd = (co === laterSeg.primaryCo && Number.isFinite(laterSeg.boardIdx))
          ? laterSeg.boardIdx
          : stopsForCo.length;
        for (let k = 0; k < scanEnd; k++) {
          const cLoc = etaDb.stopList[stopsForCo[k]]?.location;
          if (!cLoc) continue;
          if (distM(cLoc, originLocForRedundant) <= MAX_TRANSFER_WALK_M) {
            hasRedundantHop = true;
            break;
          }
        }
        if (hasRedundantHop) break;
      }
    }
  }

  return {isCircuitous, hasRedundantHop};
}

/* ---------------- Route Graph Beam Search ---------------- */
// 【改善路線多樣性】以往每個 leg-count bucket 淨係揀返 heuristic（純粹
// 距離／detour／轉車懲罰嘅靜態分數，同真實班次疏密完全無關）排名最好嗰
// minQuotaPerBucket 個候選，好容易畀「heuristic 相近嘅同一條路線」霸咗
// 晒個 quota，令另一條實際班次密好多嘅路線連入去 evaluateCandidate()
// 用實時／推算班次重新評估嘅機會都冇，最終結果死咬住某一條路線，唔理
// 佢等車等成點。
//
// 【v2：擴展到次程】以往嘅多樣性判斷淨係睇「最後一程」嘅路線編號，會
// 漏咗一種常見情況：首程唔同、但次程（轉車之後嗰一程）全部撞埋用同
// 一條路線嘅候選，一樣可以毫無限制咁樣塞滿個 bucket——如果嗰條次程
// 路線 heuristic 稍為好少少，就會將所有用其他次程路線嘅候選擠出
// quota，落到 evaluateCandidate() 先發現呢條次程路線其實班次疏、落車
// 後要等成 20 分鐘先有下一班，但已經冇其他次程路線嘅候選入圍比較。
// 用戶反映嘅「次程等待太耐，應該考慮返其他路線」正正就係呢個根因。
//
// 而家攞成程（唔止最後一程）每一程用過嘅路線編號，逐一計入多樣性判斷：
// 只要候選入面任何一程嘅路線已經用滿 perRouteCap，就當呢個候選「唔夠
// 多樣化」，推遲去 deferred，優先畀真正用緊其他路線（包括其他次程路線）
// 嘅候選入選，等佢哋都有機會入到 evaluateCandidate() 用真實班次重新
// 評估、比較邊條路線落車後等車時間較短。如果因為呢個上限令 quota 未
// 揾夠數，就放寬上限、跟返 heuristic 順序補滿，確保唔會無故減少總候選
// 數量。
function _rideRouteIdsOf(cand){
  return cand.segs.filter(s => s.type === "ride").map(s => s.routeId);
}

function _pickDiverseFromBucket(bucket, quota, perRouteCap){
  const picked = [];
  const routeUseCount = new Map();
  const deferred = [];
  for (const c of bucket){
    if (picked.length >= quota) { deferred.push(c); continue; }
    const routeIds = _rideRouteIdsOf(c);
    const maxUsed = routeIds.length
      ? Math.max(...routeIds.map(id => routeUseCount.get(id) || 0))
      : 0;
    if (maxUsed < perRouteCap){
      picked.push(c);
      for (const id of routeIds) routeUseCount.set(id, (routeUseCount.get(id) || 0) + 1);
    } else {
      deferred.push(c);
    }
  }
  // 上限太嚴令 quota 未填滿：跟返原本 heuristic 順序（deferred 已保持
  // 順序）放寬補位，唔會因為多樣性檢查反而揀少咗候選。
  let idx = 0;
  while (picked.length < quota && idx < deferred.length){
    picked.push(deferred[idx]);
    idx++;
  }
  return { picked, leftover: deferred.slice(idx) };
}

function selectDiverseCandidates(candidates, limit){
  if (candidates.length <= limit) return candidates.slice();

  const byLegs = new Map();
  for (const c of candidates){
    if (!byLegs.has(c.legs)) byLegs.set(c.legs, []);
    byLegs.get(c.legs).push(c);
  }
  for (const arr of byLegs.values()) arr.sort((a,b) => a.heuristic - b.heuristic);

  const legCounts = [...byLegs.keys()].sort((a,b) => a - b);
  const minQuotaPerBucket = Math.max(4, Math.floor(limit / Math.max(1, legCounts.length)));
  const perRouteCap = Math.max(1, Math.ceil(minQuotaPerBucket / 3));

  const result = [];
  const leftoverByLegs = new Map();
  for (const lc of legCounts){
    const bucket = byLegs.get(lc);
    const { picked, leftover } = _pickDiverseFromBucket(bucket, minQuotaPerBucket, perRouteCap);
    result.push(...picked);
    leftoverByLegs.set(lc, leftover);
  }

  if (result.length < limit){
    const rest = [];
    for (const lc of legCounts) rest.push(...leftoverByLegs.get(lc));
    rest.sort((a,b) => a.legs - b.legs || a.heuristic - b.heuristic);
    result.push(...rest.slice(0, limit - result.length));
  }

  result.sort((a,b) => a.legs - b.legs || a.heuristic - b.heuristic);
  return result.slice(0, limit);
}

// 【Beam search 樞紐站救援用嘅判斷】用返統一嘅 isInterchangeHub()
// （官方轉車站／大型轉車站關鍵字／資料驅動嘅「路線好多」判斷），加
// 埋港鐵站本身天然係樞紐呢一項，畀落面 beam cut 之後嘅救援機制用（見
// runBeamSearch() 入面 HUB_RESCUE_MAX 一段）。成本低，可以隨便喺搜尋
// 主迴圈入面逐個候選調用。
function _isHubRescueStop(stopId) {
  if (!etaDb.stopList[stopId]) return false;
  if (isInterchangeHub(stopId)) return true;
  // 港鐵站本身就係天然嘅樞紐（可以轉去任何一條港鐵線／再轉出去接駁巴士），
  // 淨係要睇呢個站有冇 mtr 公司嘅路線經過。
  const entries = stopRouteIndex.get(stopId);
  if (entries && entries.some(rt => rt.companies && rt.companies.includes("mtr"))) return true;
  return false;
}

// 呢個 function 本身唔會直接打行人路網 API（真實步行距離計算留返去
// evaluateCandidate() 等後續階段先做）
async function runBeamSearch(origin, destination, blacklist = new Set(), atTime = new Date()) {
  // walkPenaltyMultiplier 已經整合去全域嘅 WALK_PENALTY_MULTIPLIER／
  // WALK_PENALTY_MULTIPLIER_RELAXED（見頂部 Route Scoring System 一段），
  // 呢度唔再重複宣告。
  const isLantauTrip = computeIsLantauTrip(origin, destination);
  // 起點同終點本身係唔係都同香港島冇關（唔喺島上，名稱又冇撞中港島地區關鍵字）。
  // 如果係，代表呢趟行程根本冇任何一端需要去香港島，途中如果兜咗去香港島
  // （例如新界去離島，中途經中環轉車），就純粹係搜尋邏輯揀錯方向嘅無謂detour，
  // 下面 hkIslandDetourPenalty 會靠呢個 flag 嚴懲呢種情況，唔會好似
  // crossHarbourPenalty 咁因為落車站係「官方轉車站」就豁免。
  const tripTouchesHKIsland =
      HK_ISLAND_KEYWORDS.test(origin.name || "") || isHKIslandCoord(origin.lat, origin.lng) ||
      HK_ISLAND_KEYWORDS.test(destination.name || "") || isHKIslandCoord(destination.lat, destination.lng);
  const straightLineTotalM = distM({lat:origin.lat,lng:origin.lng},{lat:destination.lat,lng:destination.lng});
  // 【長途行程專用闊 beam】BEAM_WIDTH=400 呢個上限係跨全部候選狀態用同一個
  // 「距終點仲有幾遠」嘅 heuristic 一齊排、一齊斬——對於好多本地、短途嘅
  // O-D 嚟講冇問題，但對於好似馬鞍山去嶺南大學／調景嶺／石澳呢種真正需要
  // 2-3 次轉車嘅跨大區行程，第一程（甚至第二程）落車之後往往仲離終點好遠
  // （呢個係去程必經嘅過程，唔係行錯路），喺 heuristic 排序上天然會輸畀好多
  // 「睇落好似幾近咗少少、但其實去唔到／唔係啱路線」嘅本地短途候選，喺
  // 400 個名額入面被擠走，令搜尋去到後續 round 之前就已經冇咗呢條正確
  // 路徑嘅苗頭。呢度按直線距離判斷係唔係「跨大區長途」，係就用兩倍
  // BEAM_WIDTH，等呢類必要嘅多程候選有更大機會捱到落去後續 round。
  const LONG_HAUL_STRAIGHT_LINE_M = 12000;
  // 【新增：市區中長途／跨海行程門檻】以前 LONG_HAUL 門檻定得太高
  // （12公里），令好多好似大角咀↔香港仔呢類直線距離喺 6-12 公里之間、
  // 但實際需要過海／跨區轉車（例如經隧道巴士或港鐧轉一次）嘅市區行程，
  // 完全攞唔到任何 beam width／detour 容忍度嘅放寬，同真正嘅本地短途
  // 行程一樣淨係得基本 400 個名額、scale=1——但呢類行程明明已經需要
  // 「暫時偏離直線方向」先接得上轉車走廊，跟本地短途行程嘅搜尋難度完
  // 全唔同，結果好易完全搵唔到任何候選（beam search 一開始已經冚咗）。
  // 而家加多一級：直線距離超過 6 公里就當「中長途」，開始漸進放寬。
  const MID_HAUL_STRAIGHT_LINE_M = 6000;
  // 【新增第三級：極長途跨區行程】屯門↔小西灣、天水圍↔石澳呢類幾乎
  // 打斜貫穿成個香港嘅行程，直線距離通常喺 20 公里以上，往往需要 2-3
  // 次轉車先接得上（例如新界西→市區→港島東），中途每一個交匯點都可能
  // 有唔止一種合理組合（例如荃灣轉一次 vs 美孚轉一次，都去得到）。
  // 2.5 倍闊 beam 對於呢類要捱到第 3、4 程先分出勝負嘅行程，好多時仍
  // 然唔夠闊——後段真正行得通嘅組合，可能喺仲未行到嗰度之前，已經因
  // 為前幾程 heuristic 稍為輸畀啲「睇落較近、但其實去唔到／去錯方向」
  // 嘅候選而被擠走。呢度加多一級，直線距離再遠啲就用返更闊嘅 4 倍
  // BEAM_WIDTH，等呢類極長途、多程先分勝負嘅行程有更大機會保留多過
  // 一種可行組合捱到落去後續 round。
  const VERY_LONG_HAUL_STRAIGHT_LINE_M = 20000;
  const isVeryLongHaulTrip = straightLineTotalM > VERY_LONG_HAUL_STRAIGHT_LINE_M;
  const effectiveBeamWidth = isVeryLongHaulTrip
      ? BEAM_WIDTH * 4
      : (straightLineTotalM > LONG_HAUL_STRAIGHT_LINE_M) ? BEAM_WIDTH * 2.5
      : (straightLineTotalM > MID_HAUL_STRAIGHT_LINE_M) ? BEAM_WIDTH * 1.5
      : BEAM_WIDTH;
  // 【通用、唔靠地方名嘅遠途剪枝容忍度】以前靠 REMOTE_PENINSULA_KEYWORDS
  // 人手歸納「呢類半島/偏遠地方通常要兜路」，而家改用直線距離本身做
  // 連續縮放——距離越遠，路線本身越有可能需要「暫時偏離直線方向」先
  // 接得上必經嘅轉車走廊（例如新界東去港島東南、新界東去大嶼山西，
  // 途中必經市區/機場走廊，中途嗰幾程 dGoal 未必單調收窄），對邊個
  // 地方都一致生效，唔理個名叫咩。
  // 【放寬起始點】以前呢個放寬淨係喺 LONG_HAUL 門檻（12公里）先開始，
  // 12公里以下一律維持 scale=1，令上面提到嘅市區中長途／跨海行程（例如
  // 大角咀↔香港仔，直線約 8 公里）完全攞唔到任何容忍度。而家改為由
  // MID_HAUL 門檻（6公里）就開始線性放寬，一路連續遞增到原有嘅 2.2 倍
  // 封頂（依然對應約 26.4 公里或以上），6公里以下嘅真正本地短途行程
  // 完全唔受影響，維持原有剪枝力度。
  const DETOUR_TOLERANCE_RAMP_END_M = MID_HAUL_STRAIGHT_LINE_M * 4.4; // 26.4km，維持原有封頂距離
  const detourToleranceScale = straightLineTotalM <= MID_HAUL_STRAIGHT_LINE_M
      ? 1
      : Math.min(2.2, 1 + (straightLineTotalM - MID_HAUL_STRAIGHT_LINE_M) / (DETOUR_TOLERANCE_RAMP_END_M - MID_HAUL_STRAIGHT_LINE_M) * 1.2);
  // 【精簡】唔再按直線距離分長途／極長途，統一用固定嘅步行半徑
  // （ENDPOINT_WALK_RADIUS_M＝650米／MAX_TRANSFER_WALK_M）同懲罰係數。
  const adaptiveTransferWalkM = MAX_TRANSFER_WALK_M;
  const adaptiveEndpointWalkM = ENDPOINT_WALK_RADIUS_M;
  const detourScale = 0.6;
  const backtrackScale = 1.0;
  const transferScale = 1.0;

  // 【效能：本次搜尋固定值／memo cache】
  // 以下結果只依賴今次 O-D、atTime 或固定站資料；以前會喺每個
  // state／route／落車站重複計。cache 只存在本次 runBeamSearch()，
  // 唔改任何原有判斷，只減少重複 CPU work。
  const destinationPoint = { lat: destination.lat, lng: destination.lng };
  const allowedFinalWalk = getRegionWalkLimit(destination.lat, destination.lng, destination.name);
  const alightPruneRadiusM = Math.max(adaptiveEndpointWalkM, allowedFinalWalk);
  const destDistCache = new Map();
  const colocatedRoutesCache = new Map();
  const routeActivityCache = new Map();
  const nearbyTransferCache = new Map();
  const hubCache = new Map();
  const routeMetaCache = new Map();

  const getDestDist = (stopId, location) => {
    if (destDistCache.has(stopId)) return destDistCache.get(stopId);
    const d = location ? distM(location, destinationPoint) : Infinity;
    destDistCache.set(stopId, d);
    return d;
  };
  const getRoutesCached = (stopId) => {
    if (colocatedRoutesCache.has(stopId)) return colocatedRoutesCache.get(stopId);
    const routes = getRoutesAtStopWithColocated(stopId);
    colocatedRoutesCache.set(stopId, routes);
    return routes;
  };
  const isRouteActiveCached = (routeId, r, stopId) => {
    if (!atTime) return true;
    const key = `${routeId}::${stopId}`;
    if (routeActivityCache.has(key)) return routeActivityCache.get(key);
    const active = isRouteActiveAroundTime(r, atTime, stopId, 90);
    routeActivityCache.set(key, active);
    return active;
  };
  const getNearbyTransferCached = (stopId, location) => {
    if (nearbyTransferCache.has(stopId)) return nearbyTransferCache.get(stopId);
    const near = (location && Number.isFinite(location.lat) && Number.isFinite(location.lng))
      ? nearbyStops(location.lat, location.lng, adaptiveTransferWalkM)
      : [];
    nearbyTransferCache.set(stopId, near);
    return near;
  };
  const isHubCached = (stopId) => {
    if (hubCache.has(stopId)) return hubCache.get(stopId);
    const value = isInterchangeHub(stopId);
    hubCache.set(stopId, value);
    return value;
  };
  const getRouteMeta = (routeId, r) => {
    if (routeMetaCache.has(routeId)) return routeMetaCache.get(routeId);
    const routePrefixText = r.route || "";
    const routeText = (r.route || "") + (r.orig?.zh || "") + (r.dest?.zh || "");
    const meta = {
      routePrefixText,
      routeText,
      isExpress: /機場|快速|公路|幹線|大橋|快線|北大嶼山/.test(routeText),
      isCrossHarbour: /^(1|3|6|9)\d{2}[A-Z]?$/.test(routeText) || /^N(1|3{6|9)\d{2}$/.test(routeText),
      isAE: /^[AE]/i.test(routePrefixText),
      isBlockedNight: /^[RH]\d/i.test(routePrefixText),
      isCitybound: !LANTAU_KEYWORDS.test(r.dest?.zh || "")
    };
    routeMetaCache.set(routeId, meta);
    return meta;
  };

  // 【效能：搜尋層面常數提前計算一次】isOriginNonHKI／isDestNonHKI 淨係
  // 睇起點／終點座標，成個搜尋過程（唔理邊個 round／state／route／落車
  // 候選）答案都一樣。以前呢兩行擺喺 beam search 最內層嘅逐個落車候選
  // 迴圈入面，即係話同一個比較，喺一次搜尋入面可能會重複做幾千次；而家
  // 挪去呢度全程只計一次，內層迴圈直接讀返呢兩個常數。
  const isOriginNonHKI = origin.lat > 22.290;
  const isDestNonHKI = destination.lat > 22.290;

  let legsAllowed = MAX_LEGS;

  const directExists = hasDirectService(origin, destination, atTime);

  // 【搜尋失敗診斷】呢個物件全程收集緊呢次搜尋嘅內部數據，唔理
  // DEBUG_MODE 開唔開都會收集（成本好低，淨係推少少數字入陣列），
  // 但淨係喺 DEBUG_MODE 開咗嘅時候先會拎出嚟畀用戶睇。
  const searchDebugInfo = {
    originName: origin.name || (origin.stopId ? origin.stopId : "(GPS)"),
    destName: destination.name || (destination.stopId ? destination.stopId : "(GPS)"),
    straightLineTotalM: Math.round(straightLineTotalM),
    effectiveBeamWidth,
    isLantauTrip,
    isVeryLongHaulTrip,
    directExists,
    discoveryRadiusM: null,
    nearbyRouteCount: 0,
    boardCandidates: [], // 逐條路線最近嘅上車站（直線 + 真實步行距離）
    rounds: [],          // 逐個 round 嘅搜尋進度
    finalCandidateCount: 0
  };

  let originAlts = [];
  let origStopId = origin.stopId;

  if (!origStopId) {
    // 支援 GPS 起點：尋找 150 米內最接近的車站
    let closestId = null;
    let minD = Infinity;
    for (const [stopId, s] of Object.entries(etaDb.stopList)) {
      const d = distM({lat: origin.lat, lng: origin.lng}, s.location);
      if (d < minD) {
        minD = d;
        closestId = stopId;
      }
    }
    if (minD <= 150) {
      origStopId = closestId;
    }
  }

  // 同一站群嘅所有站牌 —— 步行距離視為 0
  // 【改用 getStationGroupIds() cache，唔再逐個站牌掃成個 etaDb.stopList】
  // 以前呢度每次搜尋都要 for...of Object.entries(etaDb.stopList) 成個
  // stopList 行一次先搵到起點嘅站群成員，係一個逐站牌比對嘅 O(全部站數)
  // 線性掃描；而家改用 getStationGroupIds()（一次過用 MERGE_RADIUS_M +
  // isSameTransferPoint() 搵晒成個站群、並且結果有 cache），除咗快好多
  // 之外，仲令「呢個站群有邊幾個成員」呢件事全個檔案（起點搜尋、beam
  // search 途中嘅 getRoutesAtStopWithColocated 等）用返同一份、一致嘅
  // 定義，唔會出現兩個地方對「同一站群」計出唔同答案。
  const groupStopsMap = new Map();
  if (origStopId && etaDb.stopList[origStopId]) {
    for (const gid of getStationGroupIds(origStopId)) {
      groupStopsMap.set(gid, { stopId: gid, dist: 0 });
    }
  }

  // 有冇搵到直達站，等步行轉乘方案都有平等機會入圍
  const nearbyAltsList = origin.stopId
    ? [{stopId: origin.stopId, dist: 0}].concat(nearbyStops(origin.lat, origin.lng, adaptiveEndpointWalkM).filter(s => s.stopId !== origin.stopId))
    : nearbyStops(origin.lat, origin.lng, adaptiveEndpointWalkM);

  // (1) 同 (2) 取聯集，同一個 stopId 出現喺兩邊就揀較細嘅步行距離
  const originAltsMap = new Map(groupStopsMap);
  for (const alt of nearbyAltsList) {
    const existing = originAltsMap.get(alt.stopId);
    if (!existing || alt.dist < existing.dist) originAltsMap.set(alt.stopId, alt);
  }
  originAlts = Array.from(originAltsMap.values());

  // 改善上車站搜尋
  // 【統一半徑邏輯】發現半徑同接受半徑一律用同一個 ENDPOINT_WALK_RADIUS_M
  // （650 米），唔再用「發現用兩倍闊半徑、接受用窄啲嘅半徑」咁分開處理。
  // 呢個統一嘅半徑就係用戶願意由起點行去搭車嘅上限；搵到附近有路線
  // 經過就用返範圍入面最近嗰個站，唔應該搵到之後又要行出範圍之外。
  {
    const routeDiscoveryRadiusM = adaptiveEndpointWalkM;
    const discoveryStops = nearbyStops(origin.lat, origin.lng, routeDiscoveryRadiusM);

    // 【修正「輸入同一個總站嘅唔同站牌，結果完全唔一樣」】以前呢度淨係
    // 用起點原始座標做半徑搜索，完全冇理會上面 groupStopsMap 已經靠
    // 站名＋距離識別到嘅「同一個站群」。如果一個總站入面某個站牌（例如
    // 巴士總站嗰邊嘅上車位）啱啱好企出咗 routeDiscoveryRadiusM 之外，
    // 但佗其實同起點係同一個站群（isSameTransferPoint 已經確認），呢條
    // 路線就會完全冇被搵到，落面成個「揾最近上車站」機制都無從得知佗
    // 存在——結果就係輸入同一個總站嘅唔同站牌，因為邊個站牌啱啱好喺
    // 半徑之內，搜出嚟嘅方案可以完全唔一樣（本應搭到嘅短途直達車，變
    // 成要行遠好多、轉車先到）。而家將 groupStopsMap 嘅成員都當成 0 米
    // 補落 discoveryStops，等同一個站群入面任何一個站牌有嘅路線，都一
    // 定會被搵到，唔會因為半徑差幾米就整條漏走。
    for (const g of groupStopsMap.values()) {
      if (!discoveryStops.some(ds => ds.stopId === g.stopId)) {
        discoveryStops.push({ stopId: g.stopId, dist: 0 });
      }
    }

    // 【搵路線改為「成個站群」為單位，唔再逐個站牌獨立搵】以前呢度淨係
    // 用 stopRouteIndex.get(ds.stopId) 攞返「呢個站牌自己」直接屬於嘅
    // 路線——如果某條路線嘅站牌記錄剛好落喺同一站群入面另一個 stopId
    // （例如巴士總站分咗上落客位、又或者唔同公司各自獨立嘅 stopId），
    // 但 discoveryStops 入面掃到嘅係呢個站群嘅另一個站牌，就會完全睇
    // 唔到呢條路線嘅存在。而家改用 getRoutesAtStopWithColocated()——
    // 佢會自動用 getStationGroupIds() 將成個站群（轉乘點）嘅路線合埋
    // 一齊先至回傳，等發現路線嗰步真正做到「以站群為單位」，唔會因為
    // 途經路線記錄落喺群入面邊一個具體站牌而漏走。
    const candidateRouteKeys = new Set(); // "routeId"（唔再綁死單一 co）
    for (const ds of discoveryStops) {
      const routesHereForDiscovery = getRoutesAtStopWithColocated(ds.stopId);
      for (const rt of routesHereForDiscovery) {
        candidateRouteKeys.add(rt.routeId);
      }
    }

    // 【方向（bearing）救援機制】以前呢個機制淨係喺正常發現半徑
    // （routeDiscoveryRadiusM）之內完全搵唔到任何路線先會觸發——但呢個
    // 「一有路線就收手」嘅做法,會漏走「起點附近已經有一條普通/兜路嘅
    // 路線,但仲有一條再行遠少少（例如由屋苑行到去市中心總站）先搭到、
    // 車費平好多／直接經隧道走廊唔使轉車嘅『幹線』路線」呢種情況——因
    // 為半徑之內已經搵到（起碼一條）路線,就完全唔會再擴大搜索範圍,令
    // 呢類幹線總站路線永遠冇機會入到 candidateRouteKeys,beam search 根本
    // 由頭到尾都唔知佢存在,先會出現「拣咗一條要轉兩程車、車費貴嘅方
    // 案,但其實行遠少少就有一程更平／更少轉車嘅幹線巴士」呢種漏網。
    // 而家改為唔理正常半徑之內搵唔搵到路線,都一律用 bearing 判斷做多
    // 一次擴大搜索：攞返「起點望向目的地」嘅方位角做基準，喺一個放大
    // 咗嘅半徑之內重新搵過附近站，淨係揀返「呢條車由候選上車站出發、
    // 沿住自己站序去多幾個站之後」嘅方位角，同基準夾角喺 90 度之內
    // （即係大致朝住目的地方向，唔係背道而馳）嘅路線，先當佢係值得一
    // 試嘅候選——等呢批路線都有機會入到落面嘅 beam search，由 beam
    // search 自己逐步判斷沿途有冇合適嘅站可以轉車去終點，唔會因為起點
    // 就近已經有（未必係最好）路線而完全冇機會考慮埋呢批幹線候選。
    const bearingRescuedRouteIds = new Set();
    let bearingRescueRadiusM = routeDiscoveryRadiusM;
    {
      const goalBearing = bearingDeg(
        { lat: origin.lat, lng: origin.lng },
        { lat: destination.lat, lng: destination.lng }
      );
      bearingRescueRadiusM = routeDiscoveryRadiusM * 2;
      const BEARING_RESCUE_MAX_DIFF = 90;
      const BEARING_AHEAD_STOPS = 6; // 用返上車站之後第幾個站嚟判斷「呢條車實際去緊邊」
      const rescueStops = nearbyStops(origin.lat, origin.lng, bearingRescueRadiusM);
      for (const rs of rescueStops) {
        const routesHere = getRoutesAtStopWithColocated(rs.stopId);
        for (const rt of routesHere) {
          if (candidateRouteKeys.has(rt.routeId) || bearingRescuedRouteIds.has(rt.routeId)) continue;
          const rr = etaDb.routeList[rt.routeId];
          if (!rr) continue;
          const routeCompanies = getCompanies(rr);
          let aligned = false;
          for (const co of routeCompanies) {
            const stopsArrForRoute = rr.stops[co];
            if (!stopsArrForRoute) continue;
            const boardIdx = stopsArrForRoute.indexOf(rs.stopId);
            if (boardIdx < 0) continue;
            const aheadIdx = Math.min(stopsArrForRoute.length - 1, boardIdx + BEARING_AHEAD_STOPS);
            if (aheadIdx <= boardIdx) continue;
            const boardLoc = etaDb.stopList[rs.stopId]?.location;
            const aheadLoc = etaDb.stopList[stopsArrForRoute[aheadIdx]]?.location;
            const rideBearing = bearingDeg(boardLoc, aheadLoc);
            const diff = bearingDiffDeg(rideBearing, goalBearing);
            if (diff !== null && diff <= BEARING_RESCUE_MAX_DIFF) { aligned = true; break; }
          }
          if (aligned) {
            candidateRouteKeys.add(rt.routeId);
            bearingRescuedRouteIds.add(rt.routeId);
            if (!discoveryStops.some(ds => ds.stopId === rs.stopId)) {
              discoveryStops.push({ stopId: rs.stopId, dist: rs.dist });
            }
          }
        }
      }
      if (DEBUG_MODE) {
        console.log(
          `[方向救援] 起點=${origin.name || ""}｜正常半徑（${Math.round(routeDiscoveryRadiusM)}米）內搵到 ${candidateRouteKeys.size} 條路線，` +
          `另外用方位角喺 ${Math.round(bearingRescueRadiusM)} 米內加搵到 ${bearingRescuedRouteIds.size} 條方向大致啱（同終點方位角相差 ≤${BEARING_RESCUE_MAX_DIFF}°）嘅額外候選路線。`
        );
      }
    }

    const bestPerOrigin = new Map(); // stopId -> {stopId, dist}
    for (const o of originAlts) {
      const existing = bestPerOrigin.get(o.stopId);
      if (!existing || o.dist < existing.dist) bestPerOrigin.set(o.stopId, o);
    }

    // 網址加 ?debug=1，可以喺 console 睇返實際發現咗邊啲路線。
    const debugRows = [];

    // 【第一輪：搜尋階段，繼續用 distM() 直線距離】沿住每條候選路線嘅
    // 成條站序，搵返直線距離最近嘅頭 3 個候選上車站。呢一步純粹用嚟
    // 快速篩選，唔應該喺呢度就直接落實佢做「真正最近」——直線距離
    // 完全冇考慮實際路網（例如中間隔咗條河、要過天橋兜大圈），所以
    // 落面會揀返呢批候選入面嘅少數幾個，再用真實步行路線重新排位。
    const routeTopCandidates = new Map(); // routeId -> {rr, topCandidates:[{stopId,dist}]}
    for (const routeId of candidateRouteKeys) {
      const rr = etaDb.routeList[routeId];
      if (!rr) continue;
      const routeCompanies = getCompanies(rr);
      if (!routeCompanies.length) continue;

      // 沿路線成條站序搵返直線距離最近嗰幾個站
      const topCandidates = []; // [{stopId, dist}]，由近到遠，最多 3 個
      const TOP_K = 3;
      for (const co of routeCompanies) {
        const stopsArrForRoute = rr.stops[co];
        if (!stopsArrForRoute) continue;
        for (const candId of stopsArrForRoute) {
          const cs = etaDb.stopList[candId];
          if (!cs || !cs.location) continue;
          const d = distM({lat: origin.lat, lng: origin.lng}, cs.location);
          if (topCandidates.length < TOP_K) {
            topCandidates.push({ stopId: candId, dist: d });
            topCandidates.sort((a, b) => a.dist - b.dist);
          } else if (d < topCandidates[TOP_K - 1].dist) {
            // 同一個 stopId（唔同公司變體撞到同一個實際站）唔重複佔位
            if (!topCandidates.some(c => c.stopId === candId)) {
              topCandidates[TOP_K - 1] = { stopId: candId, dist: d };
              topCandidates.sort((a, b) => a.dist - b.dist);
            }
          }
        }
      }
      if (topCandidates.length) {
        routeTopCandidates.set(routeId, { rr, topCandidates });
      }
    }

    // 【第二輪：用真實步行距離重新判斷邊個先係真正近嘅上車站】收集晒
    // 全部候選路線嘅頭 3 個候選站，去重之後先至逐個叫一次
    // getRealWalkingDataCached()——好多路線喺同一帶會撞正同一批候選
    // 站，去重可以大幅減少實際發出嘅行人路網 API 請求數量；而且 walkCache
    // 本身都有記憶化，就算冧咗去重都唔會重複打 API。
    const uniqueCandLocs = new Map(); // stopId -> location
    for (const { topCandidates } of routeTopCandidates.values()) {
      for (const cand of topCandidates) {
        if (!uniqueCandLocs.has(cand.stopId)) {
          const loc = etaDb.stopList[cand.stopId]?.location;
          if (loc) uniqueCandLocs.set(cand.stopId, loc);
        }
      }
    }
    const originLoc = { lat: origin.lat, lng: origin.lng };
    const realDistByStop = new Map(); // stopId -> 真實步行距離（米），攞唔到就冇呢個 key
    await Promise.all(Array.from(uniqueCandLocs.entries()).map(async ([stopId, loc]) => {
      const cacheKey = `boardcand_${origin.lat.toFixed(5)},${origin.lng.toFixed(5)}_${stopId}`;
      const realWalk = await getRealWalkingDataCached(cacheKey, originLoc, loc);
      if (realWalk && realWalk.success && Number.isFinite(realWalk.distM)) {
        realDistByStop.set(stopId, realWalk.distM);
      }
    }));

    // 【修正：已經存在嘅候選站要用返真實距離校正，唔可以畀 accept-radius
    // 卡住】`bestPerOrigin` 入面好多站係之前用「附近隨便搵站」（直線距
    // 離、見上面 originAlts 初始化）已經預先擺低嘅，本身唔受下面嗰個
    // 「每條路線嘅接受半徑」把關限制。落面嗰個 accept-radius 迴圈淨係
    // 負責「應唔應該新增一個站做候選」，如果一個站本身已經存在
    // （pre-seed 嗰陣用緊直線距離），但佢真實步行距離超出咗接受半徑，
    // 個迴圈會直接 skip 唔更新——結果呢個站嘅距離就會一直停留喺個舊
    // 直線估算（例如 148 米），永遠冇機會校正做真實嘅 734／367 米，
    // 令 heuristic 一直用緊錯嘅（偏細嘅）數字去計分。而家喺呢度加一步：
    // 唔理接受半徑點話，凡係已經有真實步行距離嘅站，如果佢本身已經喺
    // bestPerOrigin 度，就直接校正做真實距離——呢個純粹係「修正一個已
    // 經存在嘅候選嘅距離數字」，唔係「新增候選」，所以唔應該受接受半徑
    // 呢個入場門檻限制。
    for (const [stopId, realDist] of realDistByStop.entries()) {
      const existing = bestPerOrigin.get(stopId);
      if (existing) existing.dist = realDist;
    }

    for (const [routeId, { rr, topCandidates }] of routeTopCandidates.entries()) {
      // 攞得到真實步行距離就用真實嘅，攞唔到（例如行人路網 API 請求失敗）就
      // 保底跌返用直線距離，唔會令成條路線因為單一次網絡失敗就消失。
      const rankedCandidates = topCandidates
        .map(c => ({ stopId: c.stopId, straightDist: c.dist, dist: realDistByStop.has(c.stopId) ? realDistByStop.get(c.stopId) : c.dist }))
        .sort((a, b) => a.dist - b.dist);

      // 【修正循環線錯攞「對面鄰近回程站」做上車站】以前呢度一律揀
      // 返真實步行距離最近嗰個候選做上車站。但循環線（成條路線得一圈
      // 站序，冇分開去程／回程公司變體）好多時會喺去程行一次、回程
      // （已經行咗大半個圈準備返總站）又再經過同一帶——馬路兩邊各有
      // 一個實體站牌，物理位置好近但喺路線站序入面 idx 差好遠。純粹
      // 揀步行距離最近，隨時撞正嗰個「回程」站牌，變成成程都由差唔多
      // 行埋成個圈嘅位置先開始計，令估到嘅車程／班次完全錯晒（睇落
      // 好短，其實係漏晒中間一大截）。而家：如果最近同其後幾個候選
      // 之間步行距離相差好細（DIRECTION_TOLERANCE_M 之內），並且經
      // isSameTransferPoint() 確認佢哋其實係同一個實體站群，就喺呢批
      // 「差唔多近」嘅候選入面，揀返路線站序上 idx 最細（即係最早出
      // 現、去程果次）嗰一個，而唔係盲目揀返步行距離嗰幾米之差嘅嗰個。
      const DIRECTION_TOLERANCE_M = 80;
      let chosenCandidate = rankedCandidates[0] || null;
      if (chosenCandidate && rankedCandidates.length > 1) {
        const anchorStopObj = etaDb.stopList[chosenCandidate.stopId];
        for (let ci = 1; ci < rankedCandidates.length; ci++) {
          const cand = rankedCandidates[ci];
          if (cand.dist - chosenCandidate.dist > DIRECTION_TOLERANCE_M) break; // 已排序，之後只會更遠
          const candStopObj = etaDb.stopList[cand.stopId];
          if (!anchorStopObj || !candStopObj || !isSameTransferPoint(anchorStopObj, candStopObj)) continue;
          const chosenIdx = _stopIdxInRoute(rr, chosenCandidate.stopId);
          const candIdx = _stopIdxInRoute(rr, cand.stopId);
          if (chosenIdx === -1 || candIdx === -1) continue;
          if (candIdx < chosenIdx) chosenCandidate = cand; // 揀返站序上更早出現（去程）嗰個
        }
      }
      const bestStopId = chosenCandidate?.stopId || null;
      const bestDist = chosenCandidate?.dist ?? Infinity;

      if (DEBUG_MODE) {
        const bestName = bestStopId ? (etaDb.stopList[bestStopId]?.name?.zh || etaDb.stopList[bestStopId]?.name?.en || bestStopId) : "(冇搵到有效站)";
        debugRows.push({
          route: rr.route || routeId,
          routeId,
          bestStopId, bestName,
          bestDistM: Math.round(bestDist),
          straightDistM: Math.round(rankedCandidates[0]?.straightDist ?? Infinity),
          usedRealWalk: realDistByStop.has(bestStopId)
        });
      }

      // 【接受半徑同發現半徑統一】兩者一律用返同一個 routeDiscoveryRadiusM
      // （即 ENDPOINT_WALK_RADIUS_M＝650 米），唔再用任何倍數放大或收窄。
      // 一個站喺發現階段搵得到，代表佢喺 650 米之內，接受把關就理應直接
      // 放行，唔會再出現「發現半徑放行、接受半徑又剔走」嘅自相矛盾；亦
      // 唔會再有 1.1／1.3／2 倍呢類令用戶行超出 650 米先上到車嘅情況。
      // 【方向救援例外】如果呢條路線係上面 bearing 救援機制先搵到嘅
      // （即正常半徑內原本冇任何路線），就要用返嗰個放大咗嘅
      // bearingRescueRadiusM 嚟接受佢嘅上車站，唔可以又用返窄嗰個
      // routeDiscoveryRadiusM——如果咁做，個路線啱啱先喺救援步驟入面用
      // 闊半徑搵到，落到呢度又即刻因為窄半徑而俾剔走，等於白搵。
      const acceptRadiusM = bearingRescuedRouteIds.has(routeId) ? bearingRescueRadiusM : routeDiscoveryRadiusM;
      // 頭三近嘅候選站（跨埋所有公司變體、已經用真實步行距離排過位）
      // 逐個攞去把關，過到就放入 bestPerOrigin，等佢哋都有機會入到
      // beam search，落到 evaluateCandidate() 嗰陣再用真實行人路網步行
      // 距離重新評估一次（嗰邊仲會有 3 倍/1.3 倍嘅嚴格淘汰檢查）。
      for (const cand of rankedCandidates) {
        if (cand.dist > acceptRadiusM) continue;
        const existing = bestPerOrigin.get(cand.stopId);
        if (!existing || cand.dist < existing.dist) {
          bestPerOrigin.set(cand.stopId, { stopId: cand.stopId, dist: cand.dist });
        }
      }
    }

    searchDebugInfo.discoveryRadiusM = Math.round(routeDiscoveryRadiusM);
    searchDebugInfo.nearbyRouteCount = candidateRouteKeys.size;
    searchDebugInfo.boardCandidates = debugRows.slice();

    if (DEBUG_MODE) {
      debugRows.sort((a,b) => a.bestDistM - b.bestDistM);
      console.log(
        `[上車站偵錯] 起點=${origin.name || ""}｜發現半徑=${Math.round(routeDiscoveryRadiusM)}米｜` +
        `喺附近搵到 ${discoveryStops.length} 個鄰近站，涉及 ${candidateRouteKeys.size} 條路線變體。` +
        `逐條路線嘅最近上車站（由近到遠，已用真實步行距離重新排位）：`
      );
      console.table(debugRows);
    }

    originAlts = Array.from(bestPerOrigin.values());
  }

  let frontier = [];
  // 【改善 walkPenaltyMultiplier：唔應該對所有候選上車站一律用同一個
  // 懲罰倍數】以前唔理三七廿一，成條 originAlts 入面所有候選都用返
  // WALK_PENALTY_MULTIPLIER(1.8) 懲罰佢嘅步行距離。但如果起點本身（即
  // dist===0 嗰個站）根本冇服務到某個候選站先有嘅路線，行去嗰個候選站
  // 其實係唯一方法先搭到嗰條路線，唔應該懲罰到好似「明明有得揀、卻要
  // 行」咁重。而家先計起點本身（0 米）覆蓋到邊啲路線，落面逐個候選
  // 站再睇：如果佢自己嗰啲路線,起點本身都已經有(即係行呢步係無謂嘅)，
  // 就維持 WALK_PENALTY_MULTIPLIER；如果起點完全冇任何一條佢嘅路線
  // (行呢步係必要嘅)，就放寬用 WALK_PENALTY_MULTIPLIER_RELAXED。
  const ownStopRouteIds = new Set();
  for (const o2 of originAlts) {
    if ((o2.dist || 0) === 0) {
      for (const rt of getRoutesCached(o2.stopId)) ownStopRouteIds.add(rt.routeId);
    }
  }

  for (const oc of originAlts){
    // 【修正：起點候選過濾要同落面 beam search 擴展步驟（getRoutesAtStopWithColocated）
    // 用返同一套「站群」判斷】以前呢度淨係用 stopRouteIndex.has(oc.stopId)——即係
    // 「呢個 stopId 自己」有冇直接 index 到任何路線——嚟決定呢個候選起點值唔值得擺
    // 入 frontier。但如果起點本身（0 米，即 origin.stopId）同附近某條路線嘅記錄剛好
    // 落喺同一站群入面另一個 stopId（例如巴士總站分咗幾個上落客位、或者第二間公司
    // 獨立登記嘅 stopId），stopRouteIndex.has(origin.stopId) 就會答「冇」，令呢個
    // 0 米候選喺呢一步已經被 continue 剔走，永遠冇機會入 frontier 同其他候選比較——
    // 搜尋結果就會變成一定要行去下一個（直接 index 到嘅）站先上到車，即使起點自己
    // 個站群其實已經有呢條路線經過（例如：大澳總站同龍田邨屬同一站群，但路線淨係
    // 直接 index 喺龍田邨個 stopId，令 0 米嘅大澳候選被漏走，逼用戶行 277 米去龍田
    // 邨，得出一個「本來唔使行」嘅方案）。而家改用 getRoutesAtStopWithColocated()
    // ——同落面 round 0 開始嘅路線擴展用返完全一致嘅「成個站群」定義——確保只要
    // 候選嘅站群入面有任何一個站牌搭得到路線，呢個候選就一定會入到 frontier。
    if (getRoutesCached(oc.stopId).length === 0) continue;

    const ocLoc = etaDb.stopList[oc.stopId]?.location;

    // 【修正：唔再用直線距離蓋過已經改善咗嘅真實步行距離】以前呢度會
    // 用 distM() 對 ocLoc 重新計一次直線距離，話係要「計真實物理距離」
    // ——但 oc.dist 本身喺「改善上車步行距離估算」嗰個修正入面，已經係
    // 用 getRealWalkingDataCached() 攞返嚟嘅真實步行路面距離（唔再係
    // 粗疏嘅直線距離）。喺呢度再用 distM() 蓋番一次，等於將個已經改善
    // 咗嘅步行距離打番做直線距離——如果起點同上車站之間隔咗河、要兜
    // 一大段路先返到出去（例如直線得 148 米，實際要行 734 米），
    // heuristic 就會用嗰個嚴重低估嘅 148 米去計分，令呢個「睇落好近」
    // 但實際要行好遠嘅站，喺 beam search 度攞到同一個真正 0 米上車嘅
    // 站幾乎一樣高嘅評分，累到搜尋亂咁揀，同埋落面顯示畀用戶睇嘅步行
    // 距離（用返 oc.dist，即係 734 米）同實際評分用嘅唔一致。而家統一
    // 直接用返 oc.dist，淨係保留「起點本身就係呢個站」（強制 0）呢個
    // 特例。同時將以前重複 push 兩次 walk seg（一次用 oc.dist 冇
    // minutes，一次用重新計嘅 actualWalkDist 有 minutes）合併做一次，
    // 避免同一段步行喺 segs 度出現兩次。
    const actualWalkDist = (origin.stopId && oc.stopId === origin.stopId) ? 0 : oc.dist;

    const segs = [];
    if (actualWalkDist > 0){
      const walkMinutes = Math.max(1, Math.ceil(actualWalkDist / WALK_SPEED_MPS / 60));
      segs.push({type:"walk", fromLat:origin.lat, fromLng:origin.lng, fromName:origin.name, toStopId:oc.stopId, distM:actualWalkDist, minutes:walkMinutes});
    }

    // 計算替代車站到終點的實際距離
    const dGoal = ocLoc ? distM(ocLoc, {lat:destination.lat, lng:destination.lng}) : distM({lat:origin.lat,lng:origin.lng},{lat:destination.lat,lng:destination.lng});

    // 呢個候選站有嘅路線，起點本身（0米）係唔係已經全部／部分都有——
    // 有重疊代表行去呢個站至少有一部分係無謂嘅，要維持全額懲罰；完全
    // 冇重疊代表行呢步係搭到呢啲路線嘅唯一方法，放寬懲罰。
    const ocRouteIds = getRoutesCached(oc.stopId).map(rt => rt.routeId);
    const ocHasOwnStopOverlap = actualWalkDist === 0 || ocRouteIds.some(rid => ownStopRouteIds.has(rid));
    const effectiveWalkMultiplier = ocHasOwnStopOverlap ? WALK_PENALTY_MULTIPLIER : WALK_PENALTY_MULTIPLIER_RELAXED;

     frontier.push({
  stopId: oc.stopId, 
  legs: 0, 
  usedRoutes: new Set(), 
  lastRouteId: null, 
  lastCo: null, 
  // 阻止重複上返同一條路線嘅 lastRouteId／lastCo
  // 同「真正上一程實際搭緊嘅路線」嘅 lastRideRouteId／lastRideCo】：
  // 落面 transfer-walk 嘅擴展步驟會刻意將 lastRouteId／lastCo 清做
  // null（等行完一段轉車步行之後，仍然可以喺另一個站重新上返同一條
  // 路線），但呢個清空唔應該連帶累事——好多評分邏輯（跨公司轉車懲罰、
  // 九巴官方轉車站 bonus、「上一程坐到底其實已經夠近終點」嘅無謂轉車
  // 檢查等）都需要知道「就算行緊緊轉車，實際上一程搭嘅係邊條路線／
  // 邊間公司」，先計得啱。lastRideRouteId／lastRideCo 就係專門用嚟保留
  // 呢個「真實上一程」資訊，唔會被轉車步行清走。
  lastRideRouteId: null,
  lastRideCo: null,
  // 【修正根本問題：初始步行距離一路冚咗喺 accumulatedDist 度】以前呢

  // ============================================================
  const BEAM_DIMENSIONS = [
    { key: "distToGoal",         weight: 1.0 }, // 距終點直線距離，越細越好
    { key: "bestProgressM",      weight: 0.6 }, // 呢條路徑歷史上試過最貼近終點嘅距離，越細越好

    { key: "accumulatedWalkDist",weight: 0.5 }, // 累積步行距離，越細越好
    { key: "legs",                weight: 0.4 }, // 轉車次數，越少越好

  const BEAM_OBJECTIVE_QUOTA_RATIO = 0.3;

  function _selectByObjectiveQuota(states, quotaTotal) {

  function selectBeamStatesMultiDimensional(states, width) {
