const customLegsContainer = $("#customLegsContainer");
const addCustomLegBtn = $("#addCustomLegBtn");
const calcCustomBtn = $("#calcCustomBtn");
let customLegCount = 0;

function addCustomLeg() {
  customLegCount++;
  const id = customLegCount;
  
  const card = document.createElement("div");
  card.className = "custom-leg-card";
  card.id = `customLeg_${id}`;
  card.innerHTML = `
    <div class="leg-title">
      <span class="leg-title-text">第 ${id} 程</span>
      <div class="leg-title-actions">
        <button type="button" class="move-up-btn" title="上移">▲</button>
        <button type="button" class="move-down-btn" title="下移">▼</button>
        <button type="button" class="delete-leg-btn">❌ 刪除</button>
      </div>
    </div>
    <div>
      <input type="text" class="custom-route-input" placeholder="輸入路線" autocomplete="off">
      <div class="suggest custom-route-suggest" hidden></div>
    </div>
    <div class="grid-2">
      <div>
        <label style="font-size: 10px; font-weight: bold; color: var(--muted); display:block; margin-bottom: 4px;">起點</label>
        <select class="custom-board-select"><option value="">先輸入並選擇路線</option></select>
      </div>
      <div>
        <label style="font-size: 10px; font-weight: bold; color: var(--muted); display:block; margin-bottom: 4px;">終點</label>
        <select class="custom-alight-select"><option value="">先輸入並選擇路線</option></select>
      </div>
    </div>
  `;


// 自選行程・容許調換第 X 程次序
  card.querySelector(".move-up-btn").addEventListener("click", () => moveCustomLeg(id, -1));
  card.querySelector(".move-down-btn").addEventListener("click", () => moveCustomLeg(id, 1));
  card.querySelector(".delete-leg-btn").addEventListener("click", () => deleteCustomLeg(id));

  customLegsContainer.appendChild(card);
  wireCustomLegEvents(card);
  renumberCustomLegs();
}

// 自選行程・容許調換第 X 程次序
function renumberCustomLegs() {
  const cards = customLegsContainer.querySelectorAll(".custom-leg-card");
  cards.forEach((card, idx) => {
    const titleText = card.querySelector(".leg-title-text");
    if (titleText) titleText.textContent = `第 ${idx + 1} 程`;
    const upBtn = card.querySelector(".move-up-btn");
    const downBtn = card.querySelector(".move-down-btn");
    if (upBtn) upBtn.disabled = (idx === 0);
    if (downBtn) downBtn.disabled = (idx === cards.length - 1);
  });
}

// direction: -1＝同上一張卡調換（上移），1＝同下一張卡調換（下移）。
function moveCustomLeg(id, direction) {
  const card = document.getElementById(`customLeg_${id}`);
  if (!card) return;
  if (direction < 0) {
    const prev = card.previousElementSibling;
    if (prev) customLegsContainer.insertBefore(card, prev);
  } else {
    const next = card.nextElementSibling;
    if (next) customLegsContainer.insertBefore(next, card);
  }
  renumberCustomLegs();
}

function deleteCustomLeg(id) {
  const card = document.getElementById(`customLeg_${id}`);
  if (card) card.remove();
  renumberCustomLegs();
}

addCustomLegBtn.addEventListener("click", addCustomLeg);

// 【城巴分支變體比對輔助】ctb_route_ids.json 同一個 bound 底下可能有
// 多過一個 variant（例如 N691："1"=正常路線、"2"=臨時交通安排，不經
// 寶寧路），淨係用 routeFareList.min.json 嘅 serviceType 去直接 index
// variants[svcKey] 未必準確——尤其聯營路線（好似 N691 由 kmb／ctb 聯合
// 經營），routeFareList 嗰個 serviceType 未必跟足 CTB 自己嗰套編號，
// 兩間公司對「服務類型」嘅編號可能各自為政。所以呢度優先用分站數目
// （id 入面「起始站序||結束站序」推出嚟嘅站數，對應 routeFareList
// 嘅 stops[co].length／seq）做內容比對——呢個先係最貼實際行車情況嘅
// 信號；撞唔中或者撞中多過一個先跌返用 longId 第一個數字（CTB 自己嘅
// serviceType 編號）做次選；最後先跌返 main-variant。
function _ctbVariantStopCount(variant) {
  if (!variant || !variant.id) return null;
  const parts = String(variant.id).split("||");
  const start = parseInt(parts[2], 10);
  const end = parseInt(parts[3], 10);
  return (Number.isFinite(start) && Number.isFinite(end)) ? (end - start + 1) : null;
}

function _ctbExpectedStopCount(r, coKey) {
  const stopsArr = r.stops && r.stops[coKey];
  if (Array.isArray(stopsArr)) return stopsArr.length;
  const rawSeq = r.seq && typeof r.seq === "object" ? r.seq[coKey] : r.seq;
  const n = parseInt(rawSeq, 10);
  return Number.isFinite(n) ? n : null;
}

function _ctbSvcTypeKey(r, coKey) {
  const rawSvcType = r.serviceType && typeof r.serviceType === "object" ? r.serviceType[coKey] : r.serviceType;
  return rawSvcType != null && rawSvcType !== "" ? String(rawSvcType).trim() : null;
}

// 一般情況（bound 喺 ctb_route_ids.json 有直接對應，例如 "O"／"I"）：
// 分站數目 -> serviceType -> main-variant，逐級收窄。
// 【嚴謹比對】如果有分站數目可以核實，就一定要真係撞中先算數——撞唔中
// 就即係話呢個 serviceType 喺 ctb_route_ids.json 入面根本冇對應資料
// （例如 116 serviceType "2" 淨係 25 個站嘅短途區間班次，O 方向嗰邊
// ctb_route_ids.json 完全冇呢個 serviceType，同「正常路線」32 個站
// 對唔上），呢種情況寧願回傳 null 交返俾 getCtbVariantDesc 用 orig
// 產生「從 XXX 開出」，都好過夾硬揀第一個／main-variant 標錯「正常
// 路線」。
function _ctbFindMatchingVariant(boundData, r, coKey) {
  if (!boundData || !boundData.variants) return null;
  const variantKeys = Object.keys(boundData.variants);
  if (!variantKeys.length) return null;
  const svcKeyStr = _ctbSvcTypeKey(r, coKey);
  const expectedStopCount = _ctbExpectedStopCount(r, coKey);
  const mainKey = boundData["main-variant"];

  if (expectedStopCount != null) {
    let candidates = variantKeys.filter(k => _ctbVariantStopCount(boundData.variants[k]) === expectedStopCount);
    if (!candidates.length) return null; // 完全撞唔中，唔好夾硬揀
    if (candidates.length !== 1 && svcKeyStr && candidates.includes(svcKeyStr)) {
      candidates = [svcKeyStr];
    }
    const chosenKey = candidates.length === 1 ? candidates[0]
      : (candidates.includes(mainKey) ? mainKey : candidates[0]);
    return chosenKey ? boundData.variants[chosenKey] : null;
  }

  // 冇分站數目可以核實（冇 stops／seq 資料）：跌返用 serviceType ->
  // main-variant 做盡量準確嘅估計，呢種情況先保留舊有 fallback 行為。
  let candidates = variantKeys;
  if (svcKeyStr && candidates.includes(svcKeyStr)) candidates = [svcKeyStr];
  const chosenKey = candidates.length === 1 ? candidates[0]
    : (candidates.includes(mainKey) ? mainKey : candidates[0]);
  return chosenKey ? boundData.variants[chosenKey] : null;
}

// 【"OI" 循環線 fallback 專用】OI 係全個圈嘅站，同 O／I 半圈嘅分站數目
// 本身唔會啱好對得上，所以呢種情況唔用分站數目比對，改用
// serviceType -> main-variant 揀返最合理嘅一個。
function _ctbPickVariantBySvcType(boundData, r, coKey) {
  if (!boundData || !boundData.variants) return null;
  const svcKeyStr = _ctbSvcTypeKey(r, coKey);
  if (svcKeyStr && boundData.variants[svcKeyStr]) return boundData.variants[svcKeyStr];
  const mainKey = boundData["main-variant"];
  if (mainKey && boundData.variants[mainKey]) return boundData.variants[mainKey];
  const firstKey = Object.keys(boundData.variants)[0];
  return firstKey ? boundData.variants[firstKey] : null;
}

// 城巴分支標籤
// 【冇資料 fallback】搵唔到 ctb_route_ids.json 對應資料（成條路線都
// 冇、bound 都冇、或者 serviceType 嘅分站數目撞唔中任何已知 variant，
// 好多時係短途／區間特別班次）嘅時候，唔好夾硬標「正常路線」，改用
// orig（開出站）產生「從 XXX 開出」呢種描述性標籤。
function _ctbOrigFallbackLabel(r) {
  const origObj = r && r.orig;
  const origText = origObj && typeof origObj === "object"
    ? (origObj.zh || origObj.en)
    : (typeof origObj === "string" ? origObj : "");
  const trimmed = origText ? String(origText).trim() : "";
  return trimmed ? `由${trimmed}開出` : null;
}

function getCtbVariantDesc(r) {
  if (!r || !ctbRouteIdsDb) return null;
  const coList = r.co;
  const isCtb = Array.isArray(coList)
    ? coList.includes("ctb")
    : typeof coList === "string"
      ? coList.toLowerCase().includes("ctb")
      : false;
  if (!isCtb) return null;
  const rawBound = r.bound && typeof r.bound === "object" ? r.bound.ctb : r.bound;
  if (!rawBound) return null;
  const routeKey = String(r.route || "").toUpperCase().trim();
  const boundsObj = ctbRouteIdsDb[routeKey];
  if (!boundsObj) return _ctbOrigFallbackLabel(r);
  const boundUpper = String(rawBound).toUpperCase();
  let boundData = boundsObj[rawBound] || boundsObj[boundUpper] || boundsObj[String(rawBound).toLowerCase()];
  let isOiFallback = false;
  if (!boundData && boundUpper === "OI") {
    // ctb_route_ids.json 通常冇獨立嘅 "OI" key（真正嗰條圈本身官方分類
    // 都係跌返用 O／I 兩個方向去標記，例如 701），所以呢種情況要跌返
    // 用 O 或 I（優先 O，冇先試 I）攞返呢條循環線嘅 G/R 旗同描述，等
    // "現正服務" 嗰個 OI 記錄一樣有返「正常路線」／「特別班次」標籤。
    boundData = boundsObj.O || boundsObj.I;
    isOiFallback = true;
  }
  if (!boundData || !boundData.variants) return _ctbOrigFallbackLabel(r);

  const variant = isOiFallback
    ? _ctbPickVariantBySvcType(boundData, r, "ctb")
    : _ctbFindMatchingVariant(boundData, r, "ctb");
  if (!variant || !variant.longId) return _ctbOrigFallbackLabel(r);
  const parts = String(variant.longId).split("||");
  // longId 格式：<主分支>||<G/R 旗>||<路線分支代號>||<中文描述>||<id>||
  // parts[1] 嘅 "G"(正常路線)／"R"(特別班次) 係官方明確嘅分類旗，比淨係
  // 睇 parts[3] 中文描述得唔得空白嚴謹好多——描述文字有時得返「不停
  // 保安道」呢類備註，唔一定代表呢個係特別分支；反過來都可能有正常
  // 路線因為某啲原因冇填描述文字。所以呢度優先信 G/R 旗，冇旗先跌返
  // 用描述文字有冇嘢判斷。
  const flag = (parts[1] || "").trim().toUpperCase();
  const descText = parts[3] ? parts[3].trim() : "";
  if (flag === "R") return descText || "特別班次";
  if (flag === "G") return descText || "正常路線";
  return descText || _ctbOrigFallbackLabel(r);
}


// 嶼巴分支標籤
//
// 判斷次序：
//   1) 官方 routeName_c 明確寫「XXX（YYY開）」／「XXX (from YYY)」
//      → 視為短途開出，顯示「由 YYY 開出」，唔再誤顯示「正常路線」。
//   2) 再睇較保守嘅 route-level 「經」標籤。
//   3) 完全冇 variant 資料就唔顯示任何標籤。
function getNlbVariantDesc(r) {
  if (!r || !r.nlbId) return null;
  const isNlb = r.co
    ? (Array.isArray(r.co) ? r.co.includes("nlb") : String(r.co).toLowerCase().includes("nlb"))
    : false;
  if (!isNlb) return null;

  const routeId = String(r.nlbId);
  const info = nlbRouteInfoDb && nlbRouteInfoDb.get(routeId);
  const viaInfo = nlbRouteViaTagDb && nlbRouteViaTagDb.get(routeId);

  // 短途開出唔等於「冇特別繞經」：短途分支本身可以再繞經 A/B。
  // 所以呢度唔可以一見 shortDeparture 就立即 return；必須繼續做 branch-level via 比對。
  const shortLabel = info && info.shortDeparture && info.departureFrom
    ? `由${info.departureFrom}開出`
    : null;

  // 官方站序已經完整查到，而且全線 someDepartureObserveOnly 都係 0：
  // 呢個 routeId 本身冇任何「只限部分班次先經」嘅站。
  // 注意：如果本身係短途開出，仍然保留「由 XXX 開出」呢個 variant 資訊；
  // 「正常路線」只用於冇短途開出、亦冇 branch-level 特別繞經嘅情況。
  if (viaInfo && viaInfo.complete && viaInfo.allZero) {
    return shortLabel || "正常路線";
  }

  if (viaInfo === null || viaInfo === undefined) {
    return shortLabel;
  }

  // 有 flagged stops，但必須再對返 r 所代表嘅 routeFareList 分支站序。
  // 呢一步係修正「另一個分支經 A/B，結果所有分支都顯示經 A/B」嘅核心。
  const matched = _nlbRouteViaMatchesBranch(r, viaInfo);

  // 有 NLB 官方旗標，但 r 冇可用嘅分支站序資料：寧願保守唔顯示「經」，
  // 避免誤報；短途開出標籤仍可安全保留。
  if (matched === null) return shortLabel;

  if (matched.length) {
    const viaLabel = `經: ${matched.join("、")}`;
    return shortLabel ? `${shortLabel}・${viaLabel}` : viaLabel;
  }

  return shortLabel || "正常路線";
}

// 港鐵巴士「母線代號」：優先用 loadMtrBusStaticData() 靠 CSV REFERENCE_ID
// 分出嚟嘅 motherRouteId；冇（例如成條路線直接由 routeFareList.min.json
// 補入、CSV 完全冇對應記錄）就跌返用 r.route 自己。loadRouteFareData()
// 嘅 freq 補漏邏輯同下面嘅短途車站陣比對都共用呢個，等分組準則一致。
function _mtrbMotherCode(r) {
  if (r && r.motherRouteId) return String(r.motherRouteId).toUpperCase().trim();
  return String((r && r.route) || "").toUpperCase().trim();
}

// CSV 嘅站 id 內部帶 "MTRB_" 前綴（見 loadMtrBusStaticData()），但
// routeFareList.min.json 嘅 stops 用返原始（冇前綴）站 id；比對站陣之前
// 要先去返呢個前綴，先至可以兩邊資料源撞得住。
function _mtrbStopKey(id) {
  return typeof id === "string" && id.startsWith("MTRB_") ? id.slice(5) : id;
}

// 「母線代號＋方向」→ 呢組入面站數最多嗰條嘅（已去前綴）站陣，當正線。
// 淨係喺第一次要用先計、算完就快取住（etaDb 呢個 session 入面唔會再變）。
const _mtrbMainlineStopsCache = new Map();
function _getMtrbMainlineStops(motherCode, dir) {
  const cacheKey = `${motherCode}|${dir}`;
  if (_mtrbMainlineStopsCache.has(cacheKey)) return _mtrbMainlineStopsCache.get(cacheKey);
  let best = null;
  if (etaDb && etaDb.routeList) {
    for (const cand of Object.values(etaDb.routeList)) {
      if (!cand || !cand.co) continue;
      const isMtrb = Array.isArray(cand.co) ? cand.co.includes("mtrb") : String(cand.co).toLowerCase().includes("mtrb");
      if (!isMtrb) continue;
      if (_mtrbMotherCode(cand) !== motherCode) continue;
      const candDir = cand.bound && (cand.bound.mtrb || cand.bound["mtr-bus"]);
      if (candDir !== dir) continue;
      const stops = cand.stops && cand.stops.mtrb;
      if (!Array.isArray(stops) || stops.length < 2) continue;
      if (!best || stops.length > best.length) best = stops;
    }
  }
  const normalized = best ? best.map(_mtrbStopKey) : null;
  _mtrbMainlineStopsCache.set(cacheKey, normalized);
  return normalized;
}

// 【短途／區間車：靠站陣比對，唔靠路線編號】好多港鐵巴士分支（例如 K66
// 嘅區間車）巴士牌同 routeFareList.min.json 都冇獨立分支代號畀 CSV
// REFERENCE_ID 分——isBranch／motherRouteId 呢兩個欄位判斷唔到，個
// 「route」顯示欄位淨係得返同正線一樣嘅「K66」，用戶完全睇唔出分別。
// 呢度改為：同一組（母線代號＋方向）入面揾返站數最多嗰條當正線，睇自己
// 嘅站陣係咪正線嘅尾段子集（終點一致、中途站按次序夾得住）——係就代表
// 呢條係「中途上車、跟正線行到尾」嘅短途／區間班次，加返個「由 XXX
// 開出」標籤講返實際開出站。
function _mtrbShortWorkingLabel(r) {
  const ownStopsRaw = r && r.stops && r.stops.mtrb;
  if (!Array.isArray(ownStopsRaw) || ownStopsRaw.length < 2) return null;
  const dir = r.bound && (r.bound.mtrb || r.bound["mtr-bus"]);
  if (!dir) return null;

  const motherCode = _mtrbMotherCode(r);
  const mainline = _getMtrbMainlineStops(motherCode, dir);
  if (!mainline || mainline.length <= ownStopsRaw.length) return null;

  const own = ownStopsRaw.map(_mtrbStopKey);
  // 終點都對唔上就唔算短途／區間車，好可能係另一條行唔同路嘅獨立分支，
  // 唔好夾硬標籤。
  if (mainline[mainline.length - 1] !== own[own.length - 1]) return null;

  let matchStart = -1;
  for (let mi = mainline.length - own.length; mi >= 0; mi--) {
    let ok = true;
    for (let oi = 0; oi < own.length; oi++) {
      if (mainline[mi + oi] !== own[oi]) { ok = false; break; }
    }
    if (ok) { matchStart = mi; break; }
  }
  if (matchStart < 0) return null;

  const firstStopId = ownStopsRaw[0];
  const stopInfo = etaDb && etaDb.stopList && etaDb.stopList[firstStopId];
  const name = stopInfo && stopInfo.name ? (stopInfo.name.zh || stopInfo.name.en) : null;
  return name ? `由 ${name} 開出` : null;
}

// 港鐵巴士分支標籤
function getMtrbVariantDesc(r) {
  if (!r) return null;
  const coList = r.co;
  const isMtrb = Array.isArray(coList)
    ? coList.includes("mtrb")
    : typeof coList === "string" ? coList.toLowerCase().includes("mtrb") : false;
  if (!isMtrb) return null;

  const parts = [];
  if (r.isBranch && r.motherRouteId) {
    parts.push(`${r.motherRouteId} 特別班次`);
  }
  const shortWorkingLabel = _mtrbShortWorkingLabel(r);
  if (shortWorkingLabel) parts.push(shortWorkingLabel);

  const rawSvcType = r.serviceType && typeof r.serviceType === "object"
    ? (r.serviceType.mtrb ?? r.serviceType["mtr-bus"] ?? r.serviceType.lrtfeeder)
    : r.serviceType;
  const svcKey = rawSvcType !== undefined && rawSvcType !== null ? String(rawSvcType).trim() : "";
  // serviceType "1"／"01" 一般代表正常主要班次，唔使特登標；淨係喺唔係
  // "1" 嗰陣（即係真係有額外細分）先加落標籤度，避免每條路線都畀個
  // 冇資訊量嘅「服務類型 1」標籤阻眼。
  if (svcKey && svcKey.replace(/^0+(?=\d)/, "") !== "1") {
    parts.push(`服務類型 ${svcKey}`);
  }
  return parts.length ? parts.join("・") : null;
}

// 港鐵巴士分支：路線編號顯示直接跟返母線
function _mtrbDisplayRoute(r) {
  if (!r || !r.route) return r ? r.route : "";
  const coList = r.co;
  const isMtrb = Array.isArray(coList)
    ? coList.includes("mtrb")
    : typeof coList === "string" ? coList.toLowerCase().includes("mtrb") : false;
  if (isMtrb && r.isMtrBusVerified && r.isBranch && r.motherRouteId) {
    return r.motherRouteId;
  }
  return r.route;
}

// 九巴服務標籤
const kmbSpecialRouteCache = new Map();
// routeFareList.min.json 嘅 bound 用 "O"(outbound)／"I"(inbound)，但九巴
// 呢個 API 要求嘅係數字 "1"／"2"，且已知 "1" 對應 "O"（見用戶提供對照）。
const KMB_BOUND_TO_API = { O: "1", I: "2" };

function fetchKmbSpecialRoute(routeNo, boundApi) {
  const cacheKey = `${routeNo}|${boundApi}`;
  if (kmbSpecialRouteCache.has(cacheKey)) return kmbSpecialRouteCache.get(cacheKey);

  const targetUrl = `https://search.kmb.hk/KMBWebSite/Function/FunctionRequest.ashx?action=getSpecialRoute&route=${encodeURIComponent(routeNo)}&bound=${boundApi}`;
  const promise = fetch(`https://seep.eu.org/${targetUrl}`)
    .then(res => res.ok ? res.json() : null)
    .then(json => (json && json.result && json.data && Array.isArray(json.data.routes)) ? json.data.routes : [])
    .catch(err => {
      console.error(`九巴路線資料載入失敗 (${routeNo} bound=${boundApi}):`, err);
      return [];
    });

  kmbSpecialRouteCache.set(cacheKey, promise);
  return promise;
}

// ServiceType 兩邊格式唔一致：routeFareList.min.json 已經去咗前導零
// （例如 "1"），但 KMB API 原始回傳係帶前導零＋尾隨空格（例如 "01   "），
// 要兩邊都 trim 走空格、去前導零先岩岩夾得住。
function _normalizeKmbServiceType(v) {
  return String(v || "").trim().replace(/^0+(?=\d)/, "");
}

// 回傳 { label, kind } 或 null（唔適用／查詢失敗先係 null，唔畀任何標籤）。
// kind:"special" = Desc_CHI 有文字嘅特別班次／分支；kind:"normal" = 撞中
// 記錄但 Desc_CHI 空白（即正常路線），都要畀個「正常路線」標籤，等用戶
// 一睇就知呢個變體已經查過、確認唔係特別分支，唔使自己估。
async function getKmbVariantDesc(r) {
  if (!r) return null;
  const coList = r.co;
  const isKmb = Array.isArray(coList)
    ? coList.includes("kmb")
    : typeof coList === "string" ? coList.toLowerCase().includes("kmb") : false;
  if (!isKmb) return null;

  // 聯營路線城巴負責標籤
  // 城巴冇資料嗰啲照樣跌落嚟自己查九巴標籤
  const ctbHasBoundHere = !!(r.bound && typeof r.bound === "object" && r.bound.ctb);
  const isCtbJoint = ctbHasBoundHere && (Array.isArray(coList)
    ? coList.includes("ctb")
    : typeof coList === "string" ? coList.toLowerCase().includes("ctb") : false);
  if (isCtbJoint) return null;

  const routeNo = String(r.route || "").toUpperCase().trim();
  if (!routeNo) return null;

  const rawBound = r.bound && typeof r.bound === "object" ? r.bound.kmb : r.bound;
  const boundApi = KMB_BOUND_TO_API[String(rawBound || "").toUpperCase()];
  if (!boundApi) return null;

  const rawSvcType = r.serviceType && typeof r.serviceType === "object" ? r.serviceType.kmb : r.serviceType;
  if (!rawSvcType) return null;
  const svcKey = _normalizeKmbServiceType(rawSvcType);

  try {
    const routes = await fetchKmbSpecialRoute(routeNo, boundApi);
    if (!routes.length) return null;
    const match = routes.find(row => _normalizeKmbServiceType(row.ServiceType) === svcKey);
    if (!match) return null;
    const desc = String(match.Desc_CHI || "").trim();
    return desc ? { label: desc, kind: "special" } : { label: "正常路線", kind: "normal" };
  } catch (e) {
    return null;
  }
}

function isUnusableNativeMtrEntry(r) {
  if (!r || !r.co) return false;
  const isMtrCo = Array.isArray(r.co) ? r.co.includes("mtr") : String(r.co).toLowerCase().includes("mtr");
  return isMtrCo && !r.isMtr;
}

// 移除港巴士 dummy 資料
function isUnusableNativeMtrbEntry(r) {
  if (!r || !r.co) return false;
  const isMtrbCo = Array.isArray(r.co) ? r.co.includes("mtrb") : String(r.co).toLowerCase().includes("mtrb");
  return isMtrbCo && !r.isMtrBusVerified;
}

// 搜尋邏輯
function searchRoutes(query, limit = 20) {
  const q = query.trim().toUpperCase();
  if (!q || !etaDb || !etaDb.routeList) return [];
  
  const out = [];
  for (const [routeId, r] of Object.entries(etaDb.routeList)) {
    if (!r || !r.route) continue;
    if (isUnusableNativeMtrEntry(r)) continue;
    if (isUnusableNativeMtrbEntry(r)) continue;
    // 【修正「路線冇站位資料就揀唔到」】自選行程揀咗條路線之後,populateStops()
    // 靠 getCompanies(r) 揾返有齊站點資料嘅公司先至填得到上車/下車站選單；
    // 如果一條路線根本冇任何公司有齊站點資料（例如 etaDb 原始資料自帶嘅
    // 不完整/dummy 路線),揀落去只會見到兩個空嘅選單、乜都揀唔到。而家
    // 喺呢度提早用返同一個 getCompanies() 檢查,冇齊站點資料嘅路線直接
    // 唔會出現喺建議清單,唔止靠上面兩個 mtr/mtrb 專門 case,亦一併防到
    // 其他公司嘅類似情況。
    if (!getCompanies(r).length) continue;
    
    const routeStr = String(r.route).toUpperCase();
    const mtrCodeMatch = r.mtrLineCode && String(r.mtrLineCode).toUpperCase().includes(q);
    if (routeStr.includes(q) || mtrCodeMatch) {
      out.push({ 
        routeId, 
        route: _mtrbDisplayRoute(r), 
        orig: r.orig?.zh || r.orig || "", 
        dest: r.dest?.zh || r.dest || "",
        ctbVariant: getCtbVariantDesc(r),
        nlbTag: getNlbVariantDesc(r),
        mtrbVariant: getMtrbVariantDesc(r)
      });
    }
  }

  out.sort((a, b) => {
    const aRoute = String(a.route).toUpperCase();
    const bRoute = String(b.route).toUpperCase();
    
    const aExact = aRoute === q;
    const bExact = bRoute === q;
    if (aExact && !bExact) return -1;
    if (!aExact && bExact) return 1;
    
    const aStart = aRoute.startsWith(q);
    const bStart = bRoute.startsWith(q);
    if (aStart && !bStart) return -1;
    if (!aStart && bStart) return 1;
    
    if (aRoute.length !== bRoute.length) {
      return aRoute.length - bRoute.length;
    }
    
    return aRoute.localeCompare(bRoute, undefined, { numeric: true });
  });

  return out.slice(0, limit);
}

// 港鐵轉乘附近巴士／小巴路線
function getNearbyBusRoutesFromMtr(card, radiusM = ENDPOINT_WALK_RADIUS_M, limit = 20) {
  if (!etaDb || !stopRouteIndex || !gridIndex) return [];
  const prevCard = card.previousElementSibling;
  if (!prevCard || !prevCard.classList || !prevCard.classList.contains("custom-leg-card")) return [];

  const prevRouteId = prevCard.dataset.routeId;
  const prevRoute = prevRouteId ? etaDb.routeList[prevRouteId] : null;
  const isPrevMtr = prevRoute && prevRoute.co
    ? (Array.isArray(prevRoute.co) ? prevRoute.co.includes("mtr") : String(prevRoute.co).toLowerCase().includes("mtr"))
    : false;
  if (!isPrevMtr) return [];

  const alightSelect = prevCard.querySelector(".custom-alight-select");
  if (!alightSelect || !alightSelect.value) return [];
  let alight;
  try { alight = JSON.parse(alightSelect.value); } catch (e) { return []; }
  const loc = alight && alight.location;
  if (!loc || !Number.isFinite(loc.lat) || !Number.isFinite(loc.lng)) return [];

  // 統一半徑邏輯
  return _collectNearbyBusRoutes(loc, radiusM, limit);
}

// 由 getNearbyBusRoutesFromMtr() 抽出嘅實際收集邏輯,等上面果個 function
// 可以用唔同半徑重複調用嚌住做「逐步擴大搜尋範圍」。
function _collectNearbyBusRoutes(loc, radiusM, limit) {
  const nearby = nearbyStops(loc.lat, loc.lng, radiusM);
  nearby.sort((a, b) => a.dist - b.dist);

  const seenRoutes = new Set();
  const out = [];
  for (const ns of nearby) {
    const entries = stopRouteIndex.get(ns.stopId);
    if (!entries) continue;
    for (const e of entries) {
      if (seenRoutes.has(e.routeId)) continue;
      const r = etaDb.routeList[e.routeId];
      if (!r || !r.route) continue;
      if (isUnusableNativeMtrEntry(r)) continue;
      if (isUnusableNativeMtrbEntry(r)) continue;
      // 呢度想搵嘅係轉乘巴士，港鐵轉港鐵留返用路線編號直接搜
      const isMtrRoute = r.co
        ? (Array.isArray(r.co) ? r.co.includes("mtr") : String(r.co).toLowerCase().includes("mtr"))
        : false;
      if (isMtrRoute) continue;

      seenRoutes.add(e.routeId);
      const stopMeta = etaDb.stopList[ns.stopId];
      out.push({
        routeId: e.routeId,
        route: _mtrbDisplayRoute(r),
        orig: r.orig?.zh || r.orig || "",
        dest: r.dest?.zh || r.dest || "",
        ctbVariant: getCtbVariantDesc(r),
        nlbTag: getNlbVariantDesc(r),
        mtrbVariant: getMtrbVariantDesc(r),
        nearbyIdx: e.idx,
        nearbyStopName: (stopMeta && stopMeta.name && stopMeta.name.zh) || "",
        nearbyDistM: Math.round(ns.dist)
      });
      if (out.length >= limit) break;
    }
    if (out.length >= limit) break;
  }
  return out;
}

function wireCustomLegEvents(card) {
  const routeInput = card.querySelector(".custom-route-input");
  const routeSuggest = card.querySelector(".custom-route-suggest");
  const boardSelect = card.querySelector(".custom-board-select");
  const alightSelect = card.querySelector(".custom-alight-select");
  
  let selectedRoute = null;
  let debounce;
  
  function getCleanQuery(val) {
    let q = val.trim();
    const bracketIdx = q.indexOf(" (往");
    if (bracketIdx !== -1) {
      q = q.substring(0, bracketIdx);
    }
    return q;
  }

  // 統一嘅「揀咗一條路線」處理：搜尋結果／附近路線結果都共用呢個。
  // 如果 routeObj 帶有 nearbyIdx（即係由「附近路線」建議揀出嚟），
  // populateStops() 完成之後仲會自動幫手揀返嗰個貼近港鐵站嘅上車站，
  // 唔使用戶自己再喺一大堆站之中搵返啱嗰個。
  function selectRoute(routeObj) {
    selectedRoute = etaDb.routeList[routeObj.routeId];
    selectedRoute.routeId = routeObj.routeId;
    const variantDesc = routeObj.ctbVariant || routeObj.nlbTag || routeObj.mtrbVariant
      || getCtbVariantDesc(selectedRoute) || getNlbVariantDesc(selectedRoute) || getMtrbVariantDesc(selectedRoute);
    const destName = selectedRoute.dest.zh || selectedRoute.dest;
    // 【顯示跟返 routeObj.route】routeObj.route 喺 searchRoutes()／
    // _collectNearbyBusRoutes() 已經用 _mtrbDisplayRoute() 處理過（港鐵
    // 巴士分支會顯示返母線代號），呢度直接沿用嗰個顯示值，唔好走去用
    // selectedRoute.route（即 etaDb 入面嗰個未經處理、分支自己
    // REFERENCE_ID 嘅原始值），否則揀完之後輸入框個名又打番回分支代號。
    const displayRoute = routeObj.route || _mtrbDisplayRoute(selectedRoute);
    routeInput.value = variantDesc
      ? `${displayRoute} (往 ${destName}・${variantDesc})`
      : `${displayRoute} (往 ${destName})`;
    card.dataset.routeId = routeObj.routeId;

    // 九巴嘅服務標籤要即時查 API 先知（見 getKmbVariantDesc()），冇 CTB／
    // NLB 咁一次過同步查表，所以先用返冚唔帶標籤嗰個名顯示，遲少少查到
    // 先補上「・標籤」。用 card.dataset.routeId 判斷返用戶有冇喺呢段時間
    // 內又揀咗第二條路線，唔會將舊標籤錯誤咁蓋落新選擇度。
    if (!variantDesc) {
      getKmbVariantDesc(selectedRoute).then(tag => {
        if (!tag) return;
        if (card.dataset.routeId !== routeObj.routeId) return;
        routeInput.value = `${displayRoute} (往 ${destName}・${tag.label})`;
      }).catch(() => {});
    }

    populateStops(selectedRoute, boardSelect, alightSelect);

    if (Number.isFinite(routeObj.nearbyIdx)) {
      for (const opt of boardSelect.options) {
        if (!opt.value) continue;
        try {
          if (JSON.parse(opt.value).idx === routeObj.nearbyIdx) {
            boardSelect.value = opt.value;
            break;
          }
        } catch (e) { /* 忽略單一 option 解析失敗 */ }
      }
    }

    // 揀路線／自動揀返貼近港鐵站嘅上車站之後，終點欄要即時跟住重新
    // 篩選（先前選好嘅路線可能仲殘留住舊嘅起點篩選結果）。
    {
      let boardIdx = -1;
      if (boardSelect.value) {
        try { boardIdx = JSON.parse(boardSelect.value).idx; } catch (e) { /* 忽略 */ }
      }
      rebuildAlightOptions(alightSelect, boardIdx);
    }
  }
  
  routeInput.addEventListener("input", () => {
    clearTimeout(debounce);
    const cleanVal = getCleanQuery(routeInput.value);
    
    if (!cleanVal) {
      // 【港鐵轉乘巴士】輸入框打到清空咗,如果上一程係港鐧就同 focus
      const nearby = getNearbyBusRoutesFromMtr(card);
      if (nearby.length) {
        renderRouteSuggest(routeSuggest, nearby, selectRoute, { headerText: "港鐵站附近巴士路線" });
      } else {
        routeSuggest.innerHTML = "";
        routeSuggest.hidden = true;
      }
      return;
    }
    
    debounce = setTimeout(() => {
      const results = searchRoutes(cleanVal);
      // 港鐵轉乘巴士附近路線建議
      const nearby = getNearbyBusRoutesFromMtr(card);
      if (nearby.length) {
        const nearbyFiltered = nearby.filter(n => !results.some(r => r.routeId === n.routeId));
        renderRouteSuggest(routeSuggest, results, selectRoute, {
          extra: nearbyFiltered.length ? { results: nearbyFiltered, headerText: "港鐵站附近巴士路線" } : null
        });
      } else {
        renderRouteSuggest(routeSuggest, results, selectRoute);
      }
    }, 120);
  });
  
  routeInput.addEventListener("focus", () => {
    routeInput.select();
    
    const cleanVal = getCleanQuery(routeInput.value);
    if (cleanVal) {
      const results = searchRoutes(cleanVal);
      const nearby = getNearbyBusRoutesFromMtr(card);
      if (nearby.length) {
        const nearbyFiltered = nearby.filter(n => !results.some(r => r.routeId === n.routeId));
        renderRouteSuggest(routeSuggest, results, selectRoute, {
          extra: nearbyFiltered.length ? { results: nearbyFiltered, headerText: "港鐵站附近巴士路線" } : null
        });
      } else {
        renderRouteSuggest(routeSuggest, results, selectRoute);
      }
      return;
    }

    // 港鐵轉乘巴士附近路線建議，直接列出港鐵站附近巴士／小巴路線。
    const nearby = getNearbyBusRoutesFromMtr(card);
    if (nearby.length) {
      renderRouteSuggest(routeSuggest, nearby, selectRoute, { headerText: " 港鐵站附近巴士路線" });
    }
  });
  
  document.addEventListener("click", (e) => {
    if (!routeSuggest.contains(e.target) && e.target !== routeInput) routeSuggest.hidden = true;
  });

  // 起點欄一改動，終點欄即刻按站序重新篩選，只留低起點之後嘅站。
  boardSelect.addEventListener("change", () => {
    let boardIdx = -1;
    if (boardSelect.value) {
      try { boardIdx = JSON.parse(boardSelect.value).idx; } catch (e) { /* 忽略 */ }
    }
    rebuildAlightOptions(alightSelect, boardIdx);
  });
}

function renderRouteSuggest(suggestEl, results, onPick, opts = {}) {
  suggestEl.innerHTML = "";

  const hasExtra = !!(opts.extra && opts.extra.results && opts.extra.results.length);
  if (!results.length && !hasExtra) {
    suggestEl.innerHTML = `<div class="empty">搵唔到相符嘅路線</div>`;
    suggestEl.hidden = false;
    return;
  }

  const renderGroup = (list, headerText) => {
    if (headerText) {
      const header = document.createElement("div");
      header.style.cssText = "padding:6px 10px; font-size:11px; font-weight:700; color:var(--muted); letter-spacing:.3px;";
      header.textContent = headerText;
      suggestEl.appendChild(header);
    }
    for (const r of list) {
      const btn = document.createElement("button");
      btn.type = "button";
      const variantBadge = r.ctbVariant
        ? `<small style="display:inline-block; color:var(--ctb); background:rgba(246,168,0,.14); padding:1px 7px; margin-left:6px; font-weight:700;">${escapeHtml(r.ctbVariant)}</small>`
        : r.nlbTag
          ? `<small style="display:inline-block; color:var(--nlb); background:rgba(15,107,63,.12); padding:1px 7px; margin-left:6px; font-weight:700;">${escapeHtml(r.nlbTag)}</small>`
          : r.mtrbVariant
            ? `<small style="display:inline-block; color:var(--mtrb); background:rgba(165,28,48,.12); padding:1px 7px; margin-left:6px; font-weight:700;">${escapeHtml(r.mtrbVariant)}</small>`
            : "";
      const nearbyBadge = Number.isFinite(r.nearbyDistM)
        ? `<small style="display:inline-block; color:var(--walk); background:rgba(138,131,119,.16); border-radius:8px; padding:1px 7px; margin-left:6px; font-weight:700;">${escapeHtml(r.nearbyStopName || "附近")}${r.nearbyDistM}米</small>`
        : "";
      // 自選模式現正服務標籤
      let activeBadge = "";
      let fullRoute = null;
      try {
        fullRoute = etaDb && etaDb.routeList ? etaDb.routeList[r.routeId] : null;
        if (fullRoute && _hasConfirmedFreqServiceNow(fullRoute, new Date(), 60)) {
          activeBadge = `<small style="display:inline-block; color:#2ecc71; background:rgba(46,204,113,.16); padding:1px 7px; margin-left:6px; font-weight:700;">現正服務</small>`;
        }
      } catch (e) { /* 純粹視覺提示，靜默忽略 */ }
      // 九巴特別班次分支標籤
      const kmbTagSlotId = `kmbtag_${Math.random().toString(36).slice(2)}`;
      const kmbTagSlot = `<span id="${kmbTagSlotId}"></span>`;
      btn.innerHTML = `<b style="font-size:15px; color:var(--kmb);">${escapeHtml(r.route)}</b> <small style="display:inline; color:var(--muted); margin-left:8px;">往 ${escapeHtml(r.dest)}</small>${activeBadge}${variantBadge}${kmbTagSlot}${nearbyBadge}`;
      if (fullRoute) {
        getKmbVariantDesc(fullRoute).then(tag => {
          if (!tag) return;
          const slot = document.getElementById(kmbTagSlotId);
          if (!slot) return; // 建議清單已經重新渲染／消失，唔使補
          const style = tag.kind === "special"
            ? "display:inline-block; color:var(--kmb); background:rgba(200,16,46,.12); padding:1px 7px; margin-left:6px; font-weight:700;"
            : "display:inline-block; color:var(--kmb); background:rgba(200,16,46,.12); padding:1px 7px; margin-left:6px; font-weight:700;";
          slot.outerHTML = `<small style="${style}">${escapeHtml(tag.label)}</small>`;
        }).catch(() => {});
      }
      btn.addEventListener("click", () => {
        onPick(r);
        suggestEl.hidden = true;
      });
      suggestEl.appendChild(btn);
    }
  };


  if (results.length) {
    renderGroup(results, opts.headerText);
  }
  // 港鐵轉乘巴士附近路線建議
  if (hasExtra) {
    renderGroup(opts.extra.results, opts.extra.headerText);
  }

  suggestEl.hidden = false;
}

// 填充站點安全化
function populateStops(route, boardSelect, alightSelect) {
  boardSelect.innerHTML = `<option value="">請選擇起點</option>`;
  alightSelect.innerHTML = `<option value="">請選擇終點</option>`;
  alightSelect._allStopEntries = [];
  
  const companies = getCompanies(route);
  if (!companies || !companies.length) return;
  
  // 聯營路線・自選模式優先用城巴站序
  const preferredCo = (companies.includes("ctb") && companies.includes("kmb"))
    ? "ctb"
    : companies[0];
  
  const stops = (route.stops && route.stops[preferredCo]) ? route.stops[preferredCo] : null;
  if (!stops) return;
  
  // 儲存埋成條路線嘅站陣列（連 idx），等揀完起點之後，終點欄可以按
  // 站序過濾，只顯示喺起點之後嘅站——終點必然後於起點，冇可能揀到
  // 同一個站或者起點前面嘅站。
  const entries = [];
  
  stops.forEach((stopId, idx) => {
    const s = etaDb.stopList ? etaDb.stopList[stopId] : null;
    if (!s) return;
    
    // 確保取得有效的中英文站名
    const zhName = s.name?.zh || s.name || "未知站點";
    const enName = s.name?.en || "";
    const displayName = `${idx + 1}. ${zhName}`;
    
    // 將站點的所有必要關鍵欄位打包進 option.value，防止後面取值時丟失
    const stopData = { 
      stopId, 
      idx, 
      co: preferredCo,
      name: { zh: zhName, en: enName },
      location: s.location || null
    };
    
    const optValue = JSON.stringify(stopData);
    entries.push({ value: optValue, text: displayName, idx });
    
    const optBoard = document.createElement("option");
    optBoard.value = optValue;
    optBoard.textContent = displayName;
    boardSelect.appendChild(optBoard);
  });
  
  // 終點欄嘅完整站名單暫存喺 select 元素度，落面 rebuildAlightOptions()
  // 揀咗起點之後就會用嚟重新篩選。未揀起點之前，先顯示晒全部站。
  alightSelect._allStopEntries = entries;
  rebuildAlightOptions(alightSelect, -1);
}

// 按起點喺站序入面嘅 idx，重新整理終點欄可以揀嘅站——只保留排喺
// 起點之後（idx 較大）嘅站，確保終點必然後於起點。如果之前揀咗嘅
// 終點喺新名單入面仲有效，就保留返個揀擇；冇效就打番做「請選擇終點」。
function rebuildAlightOptions(alightSelect, boardIdx) {
  const entries = alightSelect._allStopEntries || [];
  const prevValue = alightSelect.value;
  alightSelect.innerHTML = `<option value="">請選擇終點</option>`;
  entries.forEach(entry => {
    if (entry.idx <= boardIdx) return;
    const opt = document.createElement("option");
    opt.value = entry.value;
    opt.textContent = entry.text;
    alightSelect.appendChild(opt);
  });
  if (prevValue) {
    const stillValid = Array.from(alightSelect.options).some(o => o.value === prevValue);
    alightSelect.value = stillValid ? prevValue : "";
  }
}

calcCustomBtn.addEventListener("click", async () => {
  const cards = customLegsContainer.querySelectorAll(".custom-leg-card");
  if (!cards.length) return;
  
  statusLine.textContent = "";
  statusLine.classList.remove("err");
  calcCustomBtn.disabled = true;
  calcCustomBtn.textContent = "正在搜尋行程中";
  resultsWrap.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      正在搜尋
    </div>
  `;
  
  try {
    if (typeof etaCache !== 'undefined' && etaCache.clear) {
      etaCache.clear();
    }
    const startTime = useSpecifiedTime ? new Date(customTimeInput.value) : new Date();
    
    // 構建自選路線虛擬 Candidate
    const segs = [];
    
    for (let i = 0; i < cards.length; i++) {
      const card = cards[i];
      const routeId = card.dataset.routeId;
      const boardVal = card.querySelector(".custom-board-select").value;
      const alightVal = card.querySelector(".custom-alight-select").value;
      
      if (!routeId || !boardVal || !alightVal) {
        throw new Error(`請填妥第 ${i+1} 程的所有路線及起點終點`);
      }
      
      const route = etaDb.routeList[routeId];
      const board = JSON.parse(boardVal);
      const alight = JSON.parse(alightVal);
      
      if (board.idx >= alight.idx) {
        throw new Error(`第 ${i+1} 程的終點必須在車程起點之後`);
      }
      
      // 🚨 【超級安全防護門】：注入虛擬站點至 etaDb.stopList 中！
      // 避免核心計算/渲染引擎試圖用 stopId 查表卻查到 null，進而噴出 "Cannot read properties of null (reading 'name')"
      if (etaDb && etaDb.stopList) {
        if (!etaDb.stopList[board.stopId]) {
          etaDb.stopList[board.stopId] = { name: board.name, location: board.location };
        }
        if (!etaDb.stopList[alight.stopId]) {
          etaDb.stopList[alight.stopId] = { name: alight.name, location: alight.location };
        }
      }
      
      // 如果不是第一程，且上一程下車和本程上車屬於不同物理位置，自動插入步行
      if (i > 0) {
        const prevAlightVal = cards[i-1].querySelector(".custom-alight-select").value;
        const prevAlight = JSON.parse(prevAlightVal);
        
        // 取得位置的安全防禦
        const prevLoc = prevAlight.location || (etaDb.stopList[prevAlight.stopId] ? etaDb.stopList[prevAlight.stopId].location : null);
        const currLoc = board.location || (etaDb.stopList[board.stopId] ? etaDb.stopList[board.stopId].location : null);
        
        if (prevLoc && currLoc) {
          const distance = distM(prevLoc, currLoc);
          if (distance > 15) { // 超過 15 米視為需要步行/移動
            segs.push({
              type: "walk",
              fromStopId: prevAlight.stopId,
              toStopId: board.stopId,
              distM: distance
            });
          }
        }
      }
      
      segs.push({
        type: "ride",
        routeId,
        companies: getCompanies(route),
        primaryCo: board.co,
        r: route,
        boardStopId: board.stopId,
        boardIdx: board.idx,
        alightStopId: alight.stopId,
        alightIdx: alight.idx
      });
    }
    
    const virtualCandidate = { segs, isCircuitous: false, hasRedundantHop: false };
    // 自選行程：
    // 1) 若用戶揀咗「指定時間出發」，未來時段未必有實時 ETA，全程一律用
    //    寬鬆模式，靠 GTFS 估算是否有服務。
    // 2) 就算係「現在出發」，第一程之後嘅車程都應該用寬鬆模式（見
    //    treatSecondaryLegsRelaxed），確保用戶自己揀嘅組合唔會因為個別
    //    車程冇實時 ETA 就令成程「無法計算」。
    const plan = await evaluateCandidate(virtualCandidate, startTime, useSpecifiedTime, { treatSecondaryLegsRelaxed: true, skipTransferReopt: true });
    
    if (!plan) {
      resultsWrap.innerHTML = `<div class="empty-state">無法計算該行程。可能是所選路線今日已過尾班車，或實時數據連接失敗</div>`;
      return;
    }
    
    renderResults([plan]);
    
  } catch (err) {
    statusLine.textContent = err.message || "計算行程出錯";
    statusLine.classList.add("err");
    resultsWrap.innerHTML = "";
  } finally {
    calcCustomBtn.disabled = false;
    calcCustomBtn.textContent = "計算行程時間";
  }
});
</script>
