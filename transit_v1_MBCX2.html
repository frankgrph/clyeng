let tripLeafletMap = null;
let tripMapLayerGroup = null;
const CO_ROUTE_COLOR = {
  kmb: "#c8102e", ctb: "#f6a800", nlb: "#0f6b3f", gmb: "#1b6e6e",
  mtr: "#a3004c", mtrb: "#a51c30", lightrail: "#6b8e23",
  sunferry: "#0077b6", hkkf: "#00838f", fortuneferry: "#005f73"
};

// gzip 解壓 + parse 做 JSON 嘅共用 helper（用瀏覽器原生
// DecompressionStream，唔使額外載第三方 gzip lib）。
async function _fetchGzipJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const buf = await res.arrayBuffer();
  let text;
  if (typeof DecompressionStream === "function") {
    const ds = new DecompressionStream("gzip");
    const stream = new Blob([buf]).stream().pipeThrough(ds);
    text = await new Response(stream).text();
  } else {
    // 冇 DecompressionStream 支援（好舊嘅瀏覽器）：當佢本身可能已經
    // 係未經壓縮嘅內容，直接試 parse。
    text = new TextDecoder("utf-8").decode(buf);
  }
  return JSON.parse(text);
}

// 由一個 GeoJSON Feature（或 FeatureCollection）攞出嚟一條 {lat,lng}
// 座標陣列，支援 LineString／MultiLineString（hkbus/route-waypoints
// 出品嘅檔案一律用呢兩種），注意 GeoJSON 標準座標順序係 [lng, lat]。
function _geoJsonToLatLngPath(json) {
  if (!json) return null;
  const feature = json.type === "FeatureCollection"
    ? (json.features && json.features[0])
    : json;
  const geom = feature && feature.geometry;
  if (!geom) return null;
  let coordsGroups;
  if (geom.type === "MultiLineString") coordsGroups = geom.coordinates;
  else if (geom.type === "LineString") coordsGroups = [geom.coordinates];
  else return null;
  const path = [];
  for (const line of coordsGroups) {
    for (const pt of line) {
      const lng = pt[0], lat = pt[1];
      if (Number.isFinite(lat) && Number.isFinite(lng)) path.push({ lat, lng });
    }
  }
  return path.length >= 2 ? path : null;
}

// 由 leg 攞出頭／尾座標（唔理係用 stopId 定係直接 lat/lng 表示，兩種
// 寫法喺呢個 app 嘅 walk leg 都有出現）。which 係 "from"/"to"（步行
// leg）或 "board"/"alight"（搭車 leg）。
// 由 leg 攞出頭／尾座標（唔理係用 stopId 定係直接 lat/lng 表示，兩種
// 寫法喺呢個 app 嘅 walk leg 都有出現）。which 係 "from"/"to"（步行
// leg）或 "board"/"alight"（搭車 leg）。
function _legEndCoord(leg, which) {
  const stopIdKey = which + "StopId";
  const latKey = which + "Lat";
  const lngKey = which + "Lng";
  if (leg[stopIdKey] && etaDb && etaDb.stopList[leg[stopIdKey]]) {
    return etaDb.stopList[leg[stopIdKey]].location || null;
  }
  if (Number.isFinite(leg[latKey]) && Number.isFinite(leg[lngKey])) {
    return { lat: leg[latKey], lng: leg[lngKey] };
  }
  if (which === "from" && leg.boardStopId && etaDb.stopList[leg.boardStopId]) {
    return etaDb.stopList[leg.boardStopId].location || null;
  }
  if (which === "to" && leg.alightStopId && etaDb.stopList[leg.alightStopId]) {
    return etaDb.stopList[leg.alightStopId].location || null;
  }
  return null;
}

// 港鐵出口配對輔助
function _pointBeforeLeg(plan, lIdx) {
  if (lIdx <= 0) return (origin && Number.isFinite(origin.lat) && Number.isFinite(origin.lng)) ? { lat: origin.lat, lng: origin.lng } : null;
  const prevLeg = plan.legs[lIdx - 1];
  if (!prevLeg) return null;
  if (prevLeg.type === "walk") return _legEndCoord(prevLeg, "from");
  return _legEndCoord(prevLeg, "alight");
}
function _pointAfterLeg(plan, lIdx) {
  const nextLeg = plan.legs[lIdx + 1];
  if (!nextLeg) return (destination && Number.isFinite(destination.lat) && Number.isFinite(destination.lng)) ? { lat: destination.lat, lng: destination.lng } : null;
  if (nextLeg.type === "walk") return _legEndCoord(nextLeg, "to");
  return _legEndCoord(nextLeg, "board");
}


// Fallback：沿住路線嘅實際站序，將上車站到落車站之間途經嘅每個站直
// 接駁成折線（唔係貼實際行車路，但全部都係真實巴士站位置）。
function _rideStopSequenceCoords(leg) {
  const co = leg.co || leg.primaryCo;
  const r = leg.r;
  const stopsArr = r && r.stops && (r.stops[co] || (r.primaryCo && r.stops[r.primaryCo]));
  if (!stopsArr || !stopsArr.length) return null;
  let bIdx = Number.isFinite(leg.boardIdx) ? leg.boardIdx : stopsArr.indexOf(leg.boardStopId);
  let aIdx = Number.isFinite(leg.alightIdx) ? leg.alightIdx : stopsArr.indexOf(leg.alightStopId);
  if (bIdx < 0 || aIdx < 0) return null;
  const lo = Math.min(bIdx, aIdx), hi = Math.max(bIdx, aIdx);
  const slice = stopsArr.slice(lo, hi + 1);
  let coords = slice
    .map(sid => etaDb.stopList[sid] && etaDb.stopList[sid].location)
    .filter(l => l && Number.isFinite(l.lat) && Number.isFinite(l.lng));
  if (bIdx > aIdx) coords.reverse();
  return coords.length >= 2 ? coords : null;
}

function _pathLengthM(path) {
  let total = 0;
  for (let i = 1; i < path.length; i++) total += distM(path[i - 1], path[i]);
  return total;
}
// 「攞返嚟嘅路線形狀是否合理」嘅粗略檢查——如果同直線距離差太遠
// （例如比直線仲短，好大機會係攞錯咗資料／座標亂咗序），就當呢個
// 形狀唔可靠，改用 fallback。
function _isPlausibleShape(path, boardCoord, alightCoord) {
  if (!path || path.length < 2 || !boardCoord || !alightCoord) return false;
  const straight = distM(boardCoord, alightCoord);
  const total = _pathLengthM(path);
  if (straight < 30) return true;
  return total >= straight * 0.8 && total <= straight * 8;
}

// 將一條完整（總站到總站）嘅路線折線，按實際上車／落車座標裁一截出
// 嚟，避免地圖上顯示成程冇乘搭到嘅路段。做法：搵返成條線入面離上車
// /落車座標最近嘅兩個點嘅 index，裁返中間嗰截。
function _clipPathToEndpoints(path, boardCoord, alightCoord) {
  if (!path || !boardCoord || !alightCoord || path.length < 3) return path;
  let bi = 0, bd = Infinity, ai = path.length - 1, ad = Infinity;
  for (let i = 0; i < path.length; i++) {
    const db = distM(path[i], boardCoord);
    const da = distM(path[i], alightCoord);
    if (db < bd) { bd = db; bi = i; }
    if (da < ad) { ad = da; ai = i; }
  }
  if (bi === ai) return path;
  const lo = Math.min(bi, ai), hi = Math.max(bi, ai);
  const clipped = path.slice(lo, hi + 1);
  return clipped.length >= 2 ? clipped : path;
}

const _hkbusetaShapeCache = new Map();
async function _fetchHkbusetaShape(fileId) {
  let p = _hkbusetaShapeCache.get(fileId);
  if (p) return p;
  p = (async () => {
    const url = `https://waypoints.hkbuseta.com/waypoints_gzip/${fileId}.json.gz`;
    const json = await _fetchGzipJson(url);
    return _geoJsonToLatLngPath(json);
  })().catch(() => null);
  _hkbusetaShapeCache.set(fileId, p);
  return p;
}

// 港鐵
async function fetchMtrLineShape(leg) {
  const lineCode = leg.r && leg.r.mtrLineCode;
  if (!lineCode) return null;
  const path = await _fetchHkbusetaShape(String(lineCode).toLowerCase());
  if (!path) return null;
  return _clipPathToEndpoints(path, _legEndCoord(leg, "board"), _legEndCoord(leg, "alight"));
}

// 輕鐵：檔名格式係 {路線編號}_{O|I}，但部份循環線（例如 705/706）冇
// 方向後綴。兩種都試，揀返個頭/尾最貼近實際上車/落車站嘅嗰個。
async function fetchLightRailShape(leg) {
  // 修正提取 routeNo 的邏輯，加入 fallback 確保攞到 "614P" 等字串
  const routeNo = leg.routeNo || (leg.r && (leg.r.lrRouteCode || leg.r.route));
  if (!routeNo) return null;
  
  const boardCoord = _legEndCoord(leg, "board");
  const alightCoord = _legEndCoord(leg, "alight");
  const candidates = await Promise.all([
    _fetchHkbusetaShape(`${routeNo}_O`),
    _fetchHkbusetaShape(`${routeNo}_I`),
    _fetchHkbusetaShape(`${routeNo}`)
  ]);
  let best = null, bestScore = Infinity;
  for (const path of candidates) {
    if (!path) continue;
    if (boardCoord && alightCoord) {
      const dStart = Math.min(distM(path[0], boardCoord), distM(path[path.length - 1], boardCoord));
      const dEnd = Math.min(distM(path[0], alightCoord), distM(path[path.length - 1], alightCoord));
      const score = dStart + dEnd;
      if (score < bestScore) { bestScore = score; best = path; }
    } else if (!best) best = path;
  }
  if (!best) return null;
  return _clipPathToEndpoints(best, boardCoord, alightCoord);
}

// 巴士／專線小巴／港鐵巴士／城巴
async function fetchGtfsWaypointsShape(leg) {
  const r = leg.r;
  const gtfsId = r && r.gtfsId;
  if (!gtfsId) return null;
  // 【聯營路線方向要跟 routeFareList.min.json 寫法】gtfsId-O/I 呢個檔名嘅
  // 方向字母,唔可以用 leg.co(即係用戶實際上車嗰間公司)去揀,因為同一個
  // 實際行車方向,聯營嗰幾間公司各自喺 bound 度寫嘅字母可能唔一樣(例如
  // "co":["kmb","ctb"] 嗰條,bound 係 {"ctb":"O","kmb":"I"})。routeFareList
  // 嘅慣例係 co 陣列邊個排第一就用邊個嘅 bound,所以呢度要優先用 r.co[0]
  // (即 r.primaryCo),leg.co 只做冧位冇 primaryCo 先至 fallback。
  const primaryCo = r.primaryCo || (Array.isArray(r.co) ? r.co[0] : null);
  const co = primaryCo || leg.co || leg.primaryCo;
  const boundVal = _routeBoundValue(r, co) || (r.bound && typeof r.bound === "object" ? Object.values(r.bound)[0] : r.bound);
  const boundLetter = String(boundVal || "").toUpperCase().startsWith("I") ? "I" : "O";
  const boardCoord = _legEndCoord(leg, "board");
  const alightCoord = _legEndCoord(leg, "alight");

  const primary = await _fetchHkbusetaShape(`${gtfsId}-${boundLetter}`);
  let best = primary;
  const primaryClipped = primary ? _clipPathToEndpoints(primary, boardCoord, alightCoord) : null;
  if (!primaryClipped || !_isPlausibleShape(primaryClipped, boardCoord, alightCoord)) {
    const otherLetter = boundLetter === "O" ? "I" : "O";
    const alt = await _fetchHkbusetaShape(`${gtfsId}-${otherLetter}`);
    if (alt) {
      if (!best) {
        best = alt;
      } else if (boardCoord && alightCoord) {
        const scoreOf = (path) => {
          const dStart = Math.min(distM(path[0], boardCoord), distM(path[path.length - 1], boardCoord));
          const dEnd = Math.min(distM(path[0], alightCoord), distM(path[path.length - 1], alightCoord));
          return dStart + dEnd;
        };
        if (scoreOf(alt) < scoreOf(best)) best = alt;
      }
    }
  }
  if (!best) return null;
  return _clipPathToEndpoints(best, boardCoord, alightCoord);
}

// 渡輪：新渡輪（sunferry）、港九小輪（hkkf）同富裕小輪（fortuneferry）
// 喺 waypoints.hkbuseta.com 嗰個檔名唔跟通用嘅 {gtfsId}-{O|I} 格式，要各自砌返啱嘅檔名。
async function fetchFerryWaypointsShape(leg) {
  const r = leg.r;
  const co = leg.co || leg.primaryCo;
  let fileId = null;
  
  // 修正各間渡輪公司嘅檔名格式
  if (co === "sunferry") {
    fileId = r && r.route ? String(r.route).toUpperCase() : null;
  } else if (co === "hkkf") {
    fileId = r && r.route ? `${r.route}` : null;
  } else if (co === "fortuneferry") {
    // 富裕小輪檔名
    const routeNo = leg.routeNo || (r && r.route);
    fileId = routeNo ? `${routeNo}` : null;
  }
  
  if (!fileId) return null;
  const path = await _fetchHkbusetaShape(fileId);
  if (!path) return null;
  return _clipPathToEndpoints(path, _legEndCoord(leg, "board"), _legEndCoord(leg, "alight"));
}

// 統一入口：按公司揀返啱嘅資料來源攞路線形狀，全部失敗就跌落用真實
// 站序折線 fallback。永遠都會有嘢畫得出，唔會因為外部 API 有變／冇
// 對應資料而完全冇顯示。
async function resolveRideLegShape(leg) {
  const co = leg.co || leg.primaryCo;
  let path = null;
  try {
    if (co === "mtr") path = await fetchMtrLineShape(leg);
    else if (co === "lightrail") path = await fetchLightRailShape(leg);
    else if (co === "kmb" || co === "ctb" || co === "nlb" || co === "gmb" || co === "mtrb") path = await fetchGtfsWaypointsShape(leg);
    else if (co === "sunferry" || co === "hkkf" || co === "fortuneferry") path = await fetchFerryWaypointsShape(leg);
  } catch (err) {
    console.warn("行程地圖載入失敗:", leg.routeNo, err);
    path = null;
  }
  const boardCoord = _legEndCoord(leg, "board");
  const alightCoord = _legEndCoord(leg, "alight");
  let isApprox = false;
  if (!path || !_isPlausibleShape(path, boardCoord, alightCoord)) {
    path = _rideStopSequenceCoords(leg);
    isApprox = true;
  }
  if (!path && boardCoord && alightCoord) {
    path = [boardCoord, alightCoord];
    isApprox = true;
  }
  return { path, isApprox };
}

/* ---------------- 地圖繪畫 ---------------- */
function _ensureTripLeafletMap() {
  if (tripLeafletMap) return tripLeafletMap;
  tripLeafletMap = L.map("tripMapCanvas", { zoomControl: true });
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "© OpenStreetMap"
  }).addTo(tripLeafletMap);
  return tripLeafletMap;
}

function _tripEndpointIcon(color, label) {
  return L.divIcon({
    className: "trip-endpoint-icon",
    html: `<div style="width:22px;height:22px;border-radius:50% 50% 50% 0;background:${color};transform:rotate(-45deg);box-shadow:0 1px 3px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;">
             <span style="transform:rotate(45deg);color:#fff;font-size:10px;font-weight:900;">${label}</span>
           </div>`,
    iconSize: [22, 22],
    iconAnchor: [11, 20]
  });
}

async function showTripMap(plan, rankText) {
  const overlay = document.getElementById("tripMapOverlay");
  const statusEl = document.getElementById("tripMapStatus");
  const subEl = document.getElementById("tripMapSub");
  document.getElementById("tripMapTitle").textContent = `${rankText} 行程地圖`;
  const lastLeg = plan.legs[plan.legs.length - 1];
  const startTime = plan.searchStartTime || plan.legs[0].departTime;
  subEl.textContent = `${fmtTime(startTime)} ➔ ${fmtTime(lastLeg.arriveTime)}　約 ${plan.totalMinutes} 分鐘`;
  statusEl.textContent = "載入路線資料中";
  overlay.hidden = false;

  const map = _ensureTripLeafletMap();
  await new Promise(resolve => requestAnimationFrame(resolve));
  map.invalidateSize();

  if (tripMapLayerGroup) tripMapLayerGroup.remove();
  tripMapLayerGroup = L.layerGroup().addTo(map);

  const allBounds = [];
  let approxCount = 0;
  let totalRideLegs = 0;

  for (const leg of plan.legs) {
    if (leg.type === "walk") {
      const from = _legEndCoord(leg, "from");
      const to = _legEndCoord(leg, "to");
      if (from && to) {
        L.polyline([[from.lat, from.lng], [to.lat, to.lng]], {
          color: "#8a8377", weight: 3, dashArray: "2 8", opacity: .9
        }).addTo(tripMapLayerGroup);
        allBounds.push([from.lat, from.lng], [to.lat, to.lng]);
      }
      continue;
    }

    totalRideLegs++;
    const co = String(leg.co || leg.primaryCo || "").toLowerCase();
    const color = CO_ROUTE_COLOR[co] || "#14181c";
    const { path, isApprox } = await resolveRideLegShape(leg);
    if (isApprox) approxCount++;
    if (path && path.length >= 2) {
      const latlngs = path.map(p => [p.lat, p.lng]);
      L.polyline(latlngs, {
        color, weight: isApprox ? 4 : 5, opacity: isApprox ? .65 : .9,
        dashArray: isApprox ? "1 7" : null
      }).addTo(tripMapLayerGroup);
      latlngs.forEach(p => allBounds.push(p));
    }

    const boardCoord = _legEndCoord(leg, "board");
    const alightCoord = _legEndCoord(leg, "alight");
    if (boardCoord) {
      L.circleMarker([boardCoord.lat, boardCoord.lng], {
        radius: 6, color: "#14181c", weight: 2, fillColor: color, fillOpacity: 1
      }).bindPopup(`<b>${escapeHtml(leg.routeNo)}</b> 上車：${escapeHtml(stopName(leg.boardStopId))}`).addTo(tripMapLayerGroup);
      allBounds.push([boardCoord.lat, boardCoord.lng]);
    }
    if (alightCoord) {
      L.circleMarker([alightCoord.lat, alightCoord.lng], {
        radius: 6, color: "#14181c", weight: 2, fillColor: "#fff", fillOpacity: 1
      }).bindPopup(`<b>${escapeHtml(leg.routeNo)}</b> 落車：${escapeHtml(stopName(leg.alightStopId))}`).addTo(tripMapLayerGroup);
      allBounds.push([alightCoord.lat, alightCoord.lng]);
    }
  }

  // 起點／終點用大一點嘅圖釘標示，方便一眼認得晒個起訖。
  const firstLeg = plan.legs[0];
  const originCoord = _legEndCoord(firstLeg, "from") || _legEndCoord(firstLeg, "board");
  const destCoord = _legEndCoord(lastLeg, "to") || _legEndCoord(lastLeg, "alight");
  if (originCoord) {
    L.marker([originCoord.lat, originCoord.lng], { icon: _tripEndpointIcon("#c8102e", "起") }).addTo(tripMapLayerGroup);
    allBounds.push([originCoord.lat, originCoord.lng]);
  }
  if (destCoord) {
    L.marker([destCoord.lat, destCoord.lng], { icon: _tripEndpointIcon("#14181c", "終") }).addTo(tripMapLayerGroup);
    allBounds.push([destCoord.lat, destCoord.lng]);
  }

  // 再校正多一次尺寸先至 fitBounds／setView，保險吓萬一 modal 期間
  // 又觸發過其他 reflow（例如視窗轉向、字體遲入等），確保呢下真係跟
  // 最新、正確嘅 container 尺寸嚟計算範圍，唔會又要撳多次先啱返。
  map.invalidateSize();
  if (allBounds.length) {
    map.fitBounds(allBounds, { padding: [28, 28], maxZoom: 17 });
  } else {
    map.setView([22.3193, 114.1694], 12);
  }

  if (totalRideLegs === 0) {
    statusEl.textContent = "呢個行程淨係涉及步行，冇搭車路段。";
  } else if (approxCount === 0) {
    statusEl.textContent = "已顯示各程實際行車路線。";
  } else {
    statusEl.innerHTML = `已顯示行車路線； <span class="trip-map-approx">${approxCount}/${totalRideLegs}</span> 程未能載入路線幾何資料，改用巴士站連線顯示`;
  }
}

});

});


/*                    🚇 港鐵 (MTR) 資料模組                    */

let mtrDb = null;              // { lines:{LINE:{DIR:[{code,seq}]}}, stationIdByCode, stationNameByCode, stationCoordByCode }
let mtrFareDb = null;          // { [fromStationId]: { [toStationId]: {oct, single} } }
let mtrRouteList = null;       // 港鐵虛擬「路線」清單，格式仿 etaDb.routeList 個別 record
let mtrLoadPromise = null;
const mtrIntervalCache = new Map();
// 【輕鐵擴充】exits.mtr.json 出口座標聚合結果，喺 loadMtrData() 入面填入，
// 供 _lightRailStationCoord() 借用嚟幫輕鐵站（CSV 本身冇座標）搵返座標。
let mtrExitSumByZh = null;
let mtrExitSumByEn = null;
// 港鐵站個別出口資料
let mtrExitsByStaCode = null;

// 港鐵出口配對結合 exits.mtr.json（出口座標）同地政總署三維行人路線搜尋 API
const EXIT_STRAIGHT_PREFILTER_K = 4;
async function pickBestMtrExit(stopId, targetLoc) {
  if (!stopId || !stopId.startsWith("MTR-") || !targetLoc || !Number.isFinite(targetLoc.lat) || !Number.isFinite(targetLoc.lng)) return null;
  if (!mtrExitsByStaCode) {
    try { await (mtrLoadPromise || loadMtrData()); } catch (_e) {}
  }
  if (!mtrExitsByStaCode) return null;
  const staCode = stopId.slice(4);
  const exits = mtrExitsByStaCode.get(staCode);
  if (!exits || !exits.length) return null;
  if (exits.length === 1) return exits[0];

  const ranked = exits
    .map(ex => ({ ex, straightDist: distM({ lat: ex.lat, lng: ex.lng }, targetLoc) }))
    .sort((a, b) => a.straightDist - b.straightDist)
    .slice(0, EXIT_STRAIGHT_PREFILTER_K);

  let best = ranked[0].ex;
  let bestDist = ranked[0].straightDist + await getMtrIndoorSupplementM(stopId, { lat: ranked[0].ex.lat, lng: ranked[0].ex.lng });
  for (const cand of ranked) {
    const cacheKey = `exitpick_${staCode}_${cand.ex.exit}_${roundCoordForCache(targetLoc.lat)},${roundCoordForCache(targetLoc.lng)}`;
    const [walk, indoorM] = await Promise.all([
      getRealWalkingDataCached(cacheKey, { lat: cand.ex.lat, lng: cand.ex.lng }, targetLoc),
      getMtrIndoorSupplementM(stopId, { lat: cand.ex.lat, lng: cand.ex.lng })
    ]);
    // 【地政總署室內步行路網】揀出口唔應該淨係睇「出口去目的地」嗰段
    // 戶外距離——同一個站入面，唔同出口去月台嘅室內距離可以差好遠
    // （例如金鐘站某啲出口貼近月台，某啲就要行成幾百米先出到閘），加返
    // 呢段室內距離先真正反映邊個出口成程（月台→出口→目的地）計計埋
    // 一齊最快。
    const d = ((walk && walk.success) ? walk.distM : cand.straightDist) + indoorM;
    if (d < bestDist) { bestDist = d; best = cand.ex; }
  }
  return best;
}

// 【輕鐵站資料／路線】以往淨係載入、parse 好放埋喺度做「站名撞名」badge
// 用途，唔會接入實際嘅行程計算引擎。而家喺 loadLightRailData() 順便多
// 解析埋 Direction／建立 stationNameByCode 同 lines（路線代號→方向→
// 站序），等 _buildLightRailRouteList() 可以砌返一套仿 mtrRouteList 嘅
// 輕鐵虛擬路線,接入自選行程模式。
let lightRailDb = null;          // { stopNameSet, stops, stopNameByCode:{code:{zh,en}}, lines:{routeCode:{dirKey:[{code,seq}]}} }
let lightRailLoadPromise = null;
let lrFareDb = null;             // { [fromCode]: { [toCode]: {oct, single} } }
let lrRouteList = null;          // 輕鐵虛擬「路線」清單，格式仿 mtrRouteList
let lrFullLoadPromise = null;
const lrIntervalCache = new Map();

async function loadLightRailData() {
  if (lightRailDb) return;
  if (lightRailLoadPromise) return lightRailLoadPromise;

  lightRailLoadPromise = (async () => {
    try {
      const res = await fetch("https://seep.eu.org/https://opendata.mtr.com.hk/data/light_rail_routes_and_stops.csv");
      const text = await res.text();
      const rows = _mtrParseCsv(text);
      if (!rows.length) { lightRailDb = { stopNameSet: new Set(), stops: [], stopNameByCode: {}, lines: {} }; return; }

      const header = rows[0].map(h => String(h || "").trim().toLowerCase());
      const idxOf = (...keywords) => {
        for (const k of keywords) {
          const exact = header.findIndex(h => h === k);
          if (exact !== -1) return exact;
        }
        for (const k of keywords) {
          const idx = header.findIndex(h => h.includes(k) && !h.includes("name"));
          if (idx !== -1) return idx;
        }
        return header.findIndex(h => keywords.some(k => h.includes(k)));
      };
      const zhIdx = idxOf("chinese", "中文");
      const enIdx = idxOf("english", "英文");
      const codeIdx = idxOf("stop_id", "station_id", "stop id", "station id", "stop_code", "station_code", "stop code", "station code");
      const routeIdx = idxOf("route");
      const dirIdx = idxOf("direction", "方向", "bound");
      const seqIdx = idxOf("sequence");

      const stopNameSet = new Set();
      const stops = [];
      const stopNameByCode = {};
      const lines = {};

      if (zhIdx !== -1) {
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || !row[zhIdx]) continue;
          const zh = row[zhIdx].trim();
          if (!zh) continue;
          const code = codeIdx !== -1 ? (row[codeIdx] || "").trim() : "";
          const en = enIdx !== -1 ? (row[enIdx] || "").trim() : "";
          const routeCode = routeIdx !== -1 ? (row[routeIdx] || "").trim() : "";
          // 冇 Direction 欄嗰陣退而求其次，全部行當同一個方向（dirKey
          // 固定做 "0"），起碼仲砌得到一條（單方向）虛擬路線，好過完全
          // 冇得揀。
          const dirKey = dirIdx !== -1 ? (row[dirIdx] || "").trim() : "0";
          // 冇 Sequence 欄就用返行喺 CSV 入面出現嗰個次序做序（假設 CSV
          // 本身已經按站序排好）。
          const seq = seqIdx !== -1 ? parseFloat(row[seqIdx]) : i;

          stopNameSet.add(_mtrNormalizeStationName(zh));
          stops.push({ zh, en, code, routeCode, seq: Number.isFinite(seq) ? seq : null });

          if (code && !stopNameByCode[code]) stopNameByCode[code] = { zh, en };

          if (routeCode && code && Number.isFinite(seq)) {
            lines[routeCode] = lines[routeCode] || {};
            lines[routeCode][dirKey] = lines[routeCode][dirKey] || [];
            lines[routeCode][dirKey].push({ code, seq });
          }
        }
      }

      for (const routeCode of Object.keys(lines)) {
        for (const dirKey of Object.keys(lines[routeCode])) {
          lines[routeCode][dirKey].sort((a, b) => a.seq - b.seq);
        }
      }

      lightRailDb = { stopNameSet, stops, stopNameByCode, lines };
    } catch (err) {
      console.error("載入輕鐵路線資料失敗", err);
      lightRailDb = { stopNameSet: new Set(), stops: [], stopNameByCode: {}, lines: {} };
    }
  })();

  return lightRailLoadPromise;
}

const MTR_LINE_NAME_ZH = {
  AEL: "機場快綫", TCL: "東涌綫", TWL: "荃灣綫", ISL: "港島綫",
  KTL: "觀塘綫", SIL: "南港島綫", TKL: "將軍澳綫", EAL: "東鐵綫",
  TML: "屯馬綫", DRL: "迪士尼綫"
};

function _mtrParseCsv(text) {
  // 改用共用 parseCsvRows()（見 parseHeadwayCsv 上面）。parseCsvRows 本身
  // 對於淨係換行嘅空行都唔會 push（field/row 都係空），同原本呢度逐行
  // .trim() 檢查空行嘅效果一致；同時修正咗原本呢度冇處理 CSV 標準 ""
  // 轉義引號嘅問題。
  return parseCsvRows(text);
}

// 異體字對照表
const MTR_STATION_NAME_CHAR_VARIANTS = { "茘": "荔" };
function _mtrNormalizeStationName(name) {
  if (!name) return "";
  let s = String(name).trim();
  for (const [from, to] of Object.entries(MTR_STATION_NAME_CHAR_VARIANTS)) {
    s = s.split(from).join(to);
  }
  return s;
}

// 【座標硬後備】以下 4 個站喺 exits.mtr.json（社群眾包出口座標）入面
// 經常搵唔到有效座標，令 location 變成 null，再撞正 distM() 對 null
// 座標「當呢一段冇額外距離」嘅防禦邏輯（見上面 distM() 註解），結果呢
// 幾個站嘅步行/heuristic 距離會被誤判做 0，喺搜尋入面詐帝好近任何
// 起訖點、混入唔啱嘅地區。原因分兩類：
// 1) 羅湖／落馬洲：位處邊境禁區，一般市民冇辦法入去影出口相，所以
//    社群眾包資料源頭上就冇呢兩個站嘅出口座標，唔係比對唔中，而係
//    根本冇資料。
// 2) 荔景／荔枝角：官方站名用嘅係康熙字典正字「茘」（三個「刀」），
//    唔係坊間常用嘅「荔」（三個「力」）；雖然上面已經有做「茘→荔」
//    異體字歸一化，但實際上仲有可能因為 exits 資料源入面嘅寫法／
//    命名差異對唔中。
// 座標數值來自維基百科各站條目嘅官方座標，作為 exits.mtr.json 比對
// 唔中時嘅最後保底，唔會覆蓋比對成功嘅真實出口平均座標。
const MTR_STATION_COORD_OVERRIDE = {
  "LOW": { lat: 22.5283, lng: 114.1134 }, // 羅湖
  "LMC": { lat: 22.5144, lng: 114.0657 }, // 落馬洲
  "LAK": { lat: 22.3484, lng: 114.1261 }, // 荔景
  "LCK": { lat: 22.3373, lng: 114.1482 }  // 荔枝角
};

async function loadMtrData() {
  if (mtrDb && mtrRouteList) return;
  if (mtrLoadPromise) return mtrLoadPromise;

  mtrLoadPromise = (async () => {
    try {
      // 【路線基礎資料源頭：完全淨係用 CSV，唔再靠 routeFareDb 補漏】試過
      // 用 routeFareList.min.json 起路線之後,發現實際即時班次查唔到——政府
      // 即時班次 API（getSchedule.php）回傳嘅每班車 dest 代號,反映嘅係
      // 「而家實際運行」嘅終點（例如東鐧綫已經同屯馬綫過海段貫通,經
      // 紅磡直達金鐧／烏溪沙,dest 會係 "ADM"／"WKS" 呢類）,呢個終點
      // 必須同 mtrStationCodes 最後一個站一致先撞得中(fetchMtrNextTrain()
      // 靠 destCode 篩選)。routeFareList.min.json 嗰邊嘅 MTR 資料由
      // hk-bus-crawling 呢個以巴士為主嘅第三方項目維護,更新未必跟得上
      // 港鐧最新嘅貫通／改動,stops.mtr 嘅終點可能仍然停留在舊嘅（例如
      // 紅磡）,令 destCode 對唔中真實班次,查詢永遠得返「推算班次」而唔
      // 係「實時班次」。就算淨係用嚟「補漏」（CSV 冇嘅綫先頂上），一樣
      // 會整多一條 dest/destCode 對唔中即時班次 API、搜尋結果度得返
      // 「推算班次」嘅虛擬路線同 CSV 嗰條撞埋一齊。mtr_lines_and_
      // stations.csv 本身就係即時班次系統用緊嗰份官方資料,十條重鐧綫
      // 全部覆蓋,查詢一定撞得中,所以徹底刪走 routeFareDb 補漏呢一步,
      // 重鐧路線一律、完全淨係用呢份 CSV。

      const [linesRes, faresRes, exitsRes] = await Promise.all([
        fetch("https://seep.eu.org/https://opendata.mtr.com.hk/data/mtr_lines_and_stations.csv"),
        fetch("https://seep.eu.org/https://opendata.mtr.com.hk/data/mtr_lines_fares.csv"),
        fetch("https://data.hkbus.app/exits.mtr.json").catch(() => null)
      ]);

      const linesText = await linesRes.text();
      const linesRows = _mtrParseCsv(linesText);

      const db = { lines: {}, stationIdByCode: {}, stationNameByCode: {}, stationCoordByCode: {} };
      // 標頭: Line Code, Direction, Station Code, Station ID, Chinese Name, English Name, Sequence
      for (let i = 1; i < linesRows.length; i++) {
        const row = linesRows[i];
        if (!row || row.length < 7 || !row[0]) continue;
        const [lineCode, direction, staCode, staId, zhName, enName, seqStr] = row;
        const seq = parseFloat(seqStr);
        if (!lineCode || !staCode || !Number.isFinite(seq)) continue;
        db.lines[lineCode] = db.lines[lineCode] || {};
        db.lines[lineCode][direction] = db.lines[lineCode][direction] || [];
        db.lines[lineCode][direction].push({ code: staCode, seq });
        db.stationIdByCode[staCode] = staId;
        db.stationNameByCode[staCode] = { zh: zhName, en: enName };
      }
      for (const lineCode of Object.keys(db.lines)) {
        for (const dir of Object.keys(db.lines[lineCode])) {
          db.lines[lineCode][dir].sort((a, b) => a.seq - b.seq);
        }
      }

      // 【已徹底刪除 routeFareDb 補漏】港鐵重鐵路線一律、完全淨係用
      // mtr_lines_and_stations.csv 呢份官方資料起 db.lines，唔會再用
      // routeFareDb（routeFareList.min.json）嘅記錄去填補任何一條綫，
      // 避免搜尋結果出現 dest 對唔中即時班次 API、淨係得「推算班次」嘅
      // 額外虛擬路線。

      // 出口座標：用嚟做每個站嘅大約中心點（各出口平均），純粹畫圖／步行
      // 距離估算用，唔影響班次或收費計算。exits.mtr.json 用車站中文/英文
      // 名做 key，唔係站代號，所以要用返 db.stationNameByCode 對照。

      // 【輕鐵擴充】呢兩個 Map 而家提升做模組層變數（mtrExitSumByZh／
      // mtrExitSumByEn），等 _buildLightRailRouteList() 之後可以借用嚟
      // 幫輕鐵站（CSV 本身冇座標）搵返座標——exits.mtr.json 係社群統整
      // 「全部港鐧出口」資料，唔止得重鐧站，好多輕鐧站（尤其同西鐧共用
      // 名嘅屯門／兆康／天水圍／朗屏／元朗）都撞得中。
      if (exitsRes && exitsRes.ok) {
        try {
          const exits = await exitsRes.json();
          const sumByZh = new Map(); // normalize 過嘅 zhName -> {sumLat,sumLng,count}
          const sumByEn = new Map(); // normalize 過嘅 enName -> {sumLat,sumLng,count}
          // 【個別出口索引輔助】用車站中/英文名反查 staCode，畀落面「揾
          // 唔到 ex.station 對應嘅已知站代號」嗰陣做後備比對（例如
          // exits.mtr.json 用緊舊版/唔同嘅站代號寫法）。
          const staCodeByZh = new Map();
          const staCodeByEn = new Map();
          for (const [code, meta] of Object.entries(db.stationNameByCode)) {
            staCodeByZh.set(_mtrNormalizeStationName(meta.zh), code);
            if (meta.en) staCodeByEn.set(String(meta.en).trim().toUpperCase(), code);
          }
          const exitsByStaCode = new Map(); // staCode -> [{exit, lat, lng}]
          for (const ex of exits) {
            if (!Number.isFinite(ex.lat) || !Number.isFinite(ex.lng)) continue;
            const zh = ex.name_zh || (ex.name && ex.name.zh);
            const en = ex.name_en || (ex.name && ex.name.en);
            if (zh) {
              const key = _mtrNormalizeStationName(zh);
              const cur = sumByZh.get(key) || { sumLat: 0, sumLng: 0, count: 0 };
              cur.sumLat += ex.lat; cur.sumLng += ex.lng; cur.count++;
              sumByZh.set(key, cur);
            }
            if (en) {
              const key = String(en).trim().toUpperCase();
              const cur = sumByEn.get(key) || { sumLat: 0, sumLng: 0, count: 0 };
              cur.sumLat += ex.lat; cur.sumLng += ex.lng; cur.count++;
              sumByEn.set(key, cur);
            }

            // 個別出口記錄：優先信 ex.station（同 MTR 官方站代號一致就
            // 直接用），對唔中先跌落用站名反查。
            let staCode = (ex.station && db.stationNameByCode[ex.station]) ? ex.station : null;
            if (!staCode) {
              staCode = (zh && staCodeByZh.get(_mtrNormalizeStationName(zh)))
                || (en && staCodeByEn.get(String(en).trim().toUpperCase()))
                || null;
            }
            if (!staCode || !ex.exit) continue;
            if (!exitsByStaCode.has(staCode)) exitsByStaCode.set(staCode, []);
            exitsByStaCode.get(staCode).push({ exit: String(ex.exit), lat: ex.lat, lng: ex.lng });
          }
          mtrExitSumByZh = sumByZh;
          mtrExitSumByEn = sumByEn;
          mtrExitsByStaCode = exitsByStaCode;
          for (const staCode of Object.keys(db.stationNameByCode)) {
            const meta = db.stationNameByCode[staCode];
            let agg = sumByZh.get(_mtrNormalizeStationName(meta.zh));
            if (!agg || !agg.count) {
              agg = sumByEn.get(String(meta.en || "").trim().toUpperCase());
            }
            if (agg && agg.count) {
              db.stationCoordByCode[staCode] = { lat: agg.sumLat / agg.count, lng: agg.sumLng / agg.count };
            }
          }
        } catch (e) { /* 出口座標非必要，出錯就跳過 */ }
      }

      // 【套用座標硬後備】唔理上面 exits.mtr.json 比對成唔成功（甚至
      // 成個 exitsRes fetch 都失敗），呢幾個已知會冧嘅站一律用返硬編碼
      // 座標補底，避免 location 一直維持 null，累到 distM() 將呢啲站
      // 當做「同任何起訖點都係 0 距離」，喺搜尋結果度詐帝出現喺唔啱嘅
      // 地方。淨係喺仲未有座標（即上面比對失敗）先補，唔會覆蓋比對
      // 成功嘅真實出口平均座標。
      for (const [staCode, coord] of Object.entries(MTR_STATION_COORD_OVERRIDE)) {
        if (db.stationNameByCode[staCode] && !db.stationCoordByCode[staCode]) {
          db.stationCoordByCode[staCode] = coord;
        }
      }


      const faresText = await faresRes.text();
      const faresRows = _mtrParseCsv(faresText);
      const fareDb = {};
      // 標頭: SRC_STATION_NAME, SRC_STATION_ID, DEST_STATION_NAME, DEST_STATION_ID,
      // OCT_ADT_FARE, OCT_STD_FARE, OCT_JOYYOU_SIXTY_FARE, SINGLE_ADT_FARE, ...
      for (let i = 1; i < faresRows.length; i++) {
        const row = faresRows[i];
        if (!row || row.length < 8) continue;
        const srcId = row[1], destId = row[3];
        const octAdt = parseFloat(row[4]);
        const singleAdt = parseFloat(row[7]);
        if (!srcId || !destId) continue;
        fareDb[srcId] = fareDb[srcId] || {};
        fareDb[srcId][destId] = {
          oct: Number.isFinite(octAdt) ? octAdt : null,
          single: Number.isFinite(singleAdt) ? singleAdt : null
        };
      }

      mtrDb = db;
      mtrFareDb = fareDb;
      _buildMtrRouteList();
      _injectMtrIntoSearchIndices();
    } catch (err) {
      mtrDb = null;
      mtrFareDb = null;
      mtrRouteList = null;
    }
  })();

  return mtrLoadPromise;
}

// 將港鐵每一綫、每一個方向組裝成一個「虛擬路線」，格式仿 etaDb.routeList
// 入面單一 record 嘅形狀（.route/.orig/.dest/.stops[co]），咁樣先可以直接
// 沿用現有 searchRoutes()／populateStops()／getCompanies() 呢一套邏輯，
// 唔使另外寫一套自選 UI。同時將每個站注入 etaDb.stopList，行程組合結果
// 頁面（renderResults）先搵到站名／座標。
function _buildMtrRouteList() {
  mtrRouteList = {};
  if (!mtrDb || !etaDb || !etaDb.stopList) return;

  for (const lineCode of Object.keys(mtrDb.lines)) {
    for (const dir of Object.keys(mtrDb.lines[lineCode])) {
      const seq = mtrDb.lines[lineCode][dir];
      if (!seq.length) continue;
      const stationCodes = seq.map(s => s.code);
      const stopIds = stationCodes.map(code => `MTR-${code}`);

      stopIds.forEach((stopId, idx) => {
        if (etaDb.stopList[stopId]) return;
        const code = stationCodes[idx];
        const meta = mtrDb.stationNameByCode[code] || {};
        const coord = mtrDb.stationCoordByCode[code] || null;
        etaDb.stopList[stopId] = {
          name: { zh: meta.zh || code, en: meta.en || code },
          location: coord
        };
      });

      const origMeta = mtrDb.stationNameByCode[stationCodes[0]] || {};
      const destMeta = mtrDb.stationNameByCode[stationCodes[stationCodes.length - 1]] || {};
      const routeId = `MTR-${lineCode}-${dir}`;
      mtrRouteList[routeId] = {
        route: lineCode, // 只用英文簡寫顯示（例如 "TML"），唔再用 MTR_LINE_NAME_ZH 嘅中文全名，
                          // 避免同一條線／方向喺自選行程選單度同時見到中英文兩個選擇
        mtrLineCode: lineCode,
        mtrDirection: dir,
        mtrStationCodes: stationCodes,
        co: "mtr",
        primaryCo: "mtr",
        orig: { zh: origMeta.zh || stationCodes[0] },
        dest: { zh: destMeta.zh || stationCodes[stationCodes.length - 1] },
        stops: { mtr: stopIds },
        isMtr: true
      };
    }
  }

  // 併入 etaDb.routeList，令 searchRoutes() 一齊搵到。
  if (etaDb && etaDb.routeList) {
    Object.assign(etaDb.routeList, mtrRouteList);
  }
}

// 港鐵轉乘巴士搜尋
function _injectMtrIntoSearchIndices() {
  if (!etaDb || !etaDb.routeList || !stopRouteIndex || !mtrRouteList) return;

  for (const [routeId, r] of Object.entries(mtrRouteList)) {
    const companies = getCompanies(r); // getCompanies() 直接跟 r.co（呢度即係 "mtr"）判斷,唔再靠任何固定公司名單
    if (!companies.length) continue;
    const primaryCo = companies[0];
    const stops = r.stops[primaryCo];
    if (!stops) continue;
    stops.forEach((stopId, idx) => {
      if (!stopId) return;
      if (!stopRouteIndex.has(stopId)) stopRouteIndex.set(stopId, []);
      stopRouteIndex.get(stopId).push({ routeId, idx, companies, primaryCo });
    });
  }

  // 港鐵站已經加入咗 etaDb.stopList（連座標），重新起一次 gridIndex 先至
  // 令 nearbyStops() 搵到呢批新增嘅站。呢個操作只係重新掃一次
  // etaDb.stopList 起返個 hashmap，成本好細，唔會影響效能。
  buildGridIndex(etaDb.stopList);
  _coLocatedRoutesCache.clear(); _stationGroupCache.clear(); _stationGroupRouteCountCache.clear(); // stopRouteIndex／gridIndex 有新資料，舊 cache 已經過期
}

// 港鐵實時到站：揀返「目的地站代號同呢個方向嘅終點站一致」嗰批班次，
// 唔靠寫死嘅 UP/DOWN 對應方向（因為唔同綫 UP/DOWN 代表嘅實際方向唔一致，
// 用官方回應入面嘅 dest 站代號自己核實方向會穩陣好多）。
async function fetchMtrNextTrain(r, idx) {
  if (!r || !r.mtrLineCode || !r.mtrStationCodes) return [];
  const staCode = r.mtrStationCodes[idx];
  if (!staCode) return [];
  const destCode = r.mtrStationCodes[r.mtrStationCodes.length - 1];

  try {
    const resp = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${encodeURIComponent(r.mtrLineCode)}&sta=${encodeURIComponent(staCode)}`);
    const json = await resp.json();
    if (!json || json.status !== 1 || !json.data) return [];
    const entry = json.data[`${r.mtrLineCode}-${staCode}`];
    if (!entry) return [];

    const upList = Array.isArray(entry.UP) ? entry.UP : [];
    const downList = Array.isArray(entry.DOWN) ? entry.DOWN : [];
    const all = [...upList, ...downList];
    const matched = all.filter(t => String(t.dest || "").toUpperCase() === destCode.toUpperCase());
    const candidates = matched.length ? matched : all; // 完全冇 dest 對得上先兜底用全部

    return candidates
      .map(t => ({
        etaDate: new Date(String(t.time || "").replace(" ", "T")),
        rmk: t.valid === "N" ? "非正常班次" : "",
        isFallback: false
      }))
      .filter(e => !isNaN(e.etaDate))
      .sort((a, b) => a.etaDate - b.etaDate);
  } catch (err) {
    return [];
  }
}

// 逐站觀測車程（hketa，timeinterval.hkbuseta.com）：檔案以「星期＋鐘頭＋
// 站代號首兩個字母」分割，例如 3/08/WK.json（星期三 08 時，WK 開頭嘅站）。
// getDay() 本身 0=日 1=一 2=二 3=三……剛好同「3 代表星期三」對應，唔使轉換。
async function getMtrIntervalSeconds(fromCode, toCode, when) {
  const dow = when.getDay();
  const hh = String(when.getHours()).padStart(2, "0");
  const prefix = fromCode.substring(0, 2).toUpperCase();
  const cacheKey = `${dow}/${hh}/${prefix}`;

  if (!mtrIntervalCache.has(cacheKey)) {
    const p = fetch(`https://timeinterval.hkbuseta.com/times_hourly/${dow}/${hh}/${prefix}.json`)
      .then(res => res.ok ? res.json() : null)
      .catch(() => null);
    mtrIntervalCache.set(cacheKey, p);
  }

  const json = await mtrIntervalCache.get(cacheKey);
  if (!json || !json[fromCode]) return null;
  const sec = Number(json[fromCode][toCode]);
  return (Number.isFinite(sec) && sec > 0) ? sec : null;
}

// 逐站加總 boardIdx→alightIdx 之間嘅觀測車程；任何一段冇數據就當唔完整，
// 傳 null 交返上層用啟發式估算頂住。
async function getMtrSegmentMinutes(stationCodes, boardIdx, alightIdx, when) {
  let totalSec = 0;
  for (let i = boardIdx; i < alightIdx; i++) {
    const sec = await getMtrIntervalSeconds(stationCodes[i], stationCodes[i + 1], when);
    if (sec === null) return null;
    totalSec += sec;
  }
  return totalSec / 60;
}

// 車費：用 SRC/DEST 站 ID 對照 mtr_lines_fares.csv。預設用八達通成人票價
// (OCT_ADT_FARE)，冇嘅話退用單程票 (SINGLE_ADT_FARE)。
function getMtrFare(fromCode, toCode) {
  if (!mtrFareDb || !mtrDb) return null;
  const fromId = mtrDb.stationIdByCode[fromCode];
  const toId = mtrDb.stationIdByCode[toCode];
  if (fromId == null || toId == null) return null;
  const row = mtrFareDb[fromId] && mtrFareDb[fromId][toId];
  if (!row) return null;
  return Number.isFinite(row.oct) ? row.oct : row.single;
}


// ==================================================
//                🚈 輕鐵 (Light Rail) 資料模組
// ==================================================

// 輕鐧 CSV 本身冇座標,借用 exits.mtr.json 出口座標（見 loadMtrData() 入面
// mtrExitSumByZh／mtrExitSumByEn）做第一層後備；比對唔中再退而求其次,
// 睇下現有巴士/小巴站入面有冇一個一字不差撞名嘅站,借用佢嘅座標——好多
// 輕鐧站本身就同附近巴士站叫同一個名。兩者都搵唔到就回傳 null（等上層
// 嘅步行距離計算自然跳過呢一段,唔會整個計算爆錶）。
function _lightRailStationCoord(zh, en) {
  if (mtrExitSumByZh) {
    const agg = mtrExitSumByZh.get(_mtrNormalizeStationName(zh || ""));
    if (agg && agg.count) return { lat: agg.sumLat / agg.count, lng: agg.sumLng / agg.count };
  }
  if (mtrExitSumByEn && en) {
    const agg = mtrExitSumByEn.get(String(en).trim().toUpperCase());
    if (agg && agg.count) return { lat: agg.sumLat / agg.count, lng: agg.sumLng / agg.count };
  }
  if (etaDb && etaDb.stopList && zh) {
    const target = _mtrNormalizeStationName(zh);
    for (const s of Object.values(etaDb.stopList)) {
      if (!s || !s.location || !s.name) continue;
      if (_mtrNormalizeStationName(s.name.zh || "") === target) return s.location;
    }
  }
  return null;
}

// 【車費數值容錯解析】部分開放資料嘅車費數值可能夾雜貨幣符號（$）、
// 千分位逗號、前後空白（例如 "$5.10"、"5,000.00"），直接 parseFloat
// 遇到開頭係 "$" 呢類非數字字元就會即刻回傳 NaN，令原本有效嘅車費被
// 當做「冇資料」。呢度先用正則抽走逗號同 [^0-9.\-] 呢類雜質，先至
// parseFloat，令車費數值解析對呢類雜質格式更加寬容。
function _mtrParseFareNumber(raw) {
  if (raw === null || raw === undefined) return NaN;
  const cleaned = String(raw).replace(/,/g, "").replace(/[^0-9.\-]/g, "").trim();
  if (!cleaned) return NaN;
  return parseFloat(cleaned);
}

// 車費 CSV 載入,做法同 loadMtrData() 嘅 faresRes 一段一致,用關鍵字搵返
// SRC/DEST 及車費所在欄,唔寫死欄位位置。
async function _loadLightRailFareDb() {
  try {
    const res = await fetch("https://seep.eu.org/https://opendata.mtr.com.hk/data/light_rail_fares.csv");
    const text = await res.text();
    const rows = _mtrParseCsv(text);
    if (!rows.length) return {};

    const header = rows[0].map(h => String(h || "").trim().toLowerCase());
    // 【修正輕鐧車費完全冇顯示嘅真正原因】以前呢度嘅關鍵字清單淨係識
    // "src_..."／"dest_..."／"oct_adt_fare" 呢類命名，但 MTR 實際派發嘅
    // light_rail_fares.csv 用嘅係 from_station_id／to_station_id／
    // fare_octo_adult 呢套完全唔同嘅命名。srcIdx／destIdx 兩個都搵唔到
    // （bare "src"／"dest" 呢兩個字完全唔會撞中 "from"／"to"），跌落
    // `if (srcIdx === -1 || destIdx === -1) return fareDb;` 呢個保護，
    // 令個 fareDb 一直都係得個空物件，之後查嚟查去都梗係查唔到，睇落
    // 就好似「CSV 明明載入咗，但車費完全唔顯示」。而家加返實際欄名做
    // 關鍵字（放最前，靠精確 exact match 優先撞中），舊嘅 src/dest 寫法
    // 留低做後備，唔怕第日 MTR 又換第二套命名。
    const idxOf = (...keywords) => {
      for (const k of keywords) {
        const exact = header.findIndex(h => h === k);
        if (exact !== -1) return exact;
      }
      for (const k of keywords) {
        const idx = header.findIndex(h => h.includes(k) && !h.includes("name"));
        if (idx !== -1) return idx;
      }
      return header.findIndex(h => keywords.some(k => h.includes(k)));
    };
    const srcIdx0 = idxOf("from_station_id", "from_stop_id", "from_station_code", "from_stop", "from_station", "src_station_id", "src_stop_id", "src_stop", "src_station_code", "src_station", "src");
    const destIdx0 = idxOf("to_station_id", "to_stop_id", "to_station_code", "to_stop", "to_station", "dest_station_id", "dest_stop_id", "dest_stop", "dest_station_code", "dest_station", "dest");
    // 【位置後備】上面成套關鍵字都係靠估估吓 MTR 實際用嘅欄名，一旦第日
    // 又換一套完全冇覆蓋到嘅命名（好似之前由 src_.../oct_adt_fare 改做
    // from_station_id/fare_octo_adult 嗰次咁），就會即刻打空 fareDb，成個
    // 輕鐵車費功能形同冇咗。但呢類「車費矩陣」CSV 幾乎肯定第 1、2 欄就
    // 係「上車站」「落車站」（呢個檔案本身都係咁），所以關鍵字完全撞唔
    // 中都仲有位置後備可以頂住，唔使即刻放棄。
    const srcIdx = srcIdx0 !== -1 ? srcIdx0 : (header.length >= 2 ? 0 : -1);
    const destIdx = destIdx0 !== -1 ? destIdx0 : (header.length >= 2 ? 1 : -1);
    const octIdx = idxOf("fare_octo_adult", "fare_octopus_adult", "oct_adt_fare", "oct_adt", "octopus_adult", "oct");
    const singleIdx = idxOf("fare_single_adult", "single_adt_fare", "single_adt", "single");

    const fareDb = {};
    if (DEBUG_MODE) {
      console.log(
        `[輕鐵車費 CSV 欄位偵測] header=${JSON.stringify(header)}｜` +
        `srcIdx=${srcIdx}(${srcIdx !== -1 ? header[srcIdx] : "搵唔到"}${srcIdx0 === -1 && srcIdx !== -1 ? "，靠位置後備" : ""})｜` +
        `destIdx=${destIdx}(${destIdx !== -1 ? header[destIdx] : "搵唔到"}${destIdx0 === -1 && destIdx !== -1 ? "，靠位置後備" : ""})｜` +
        `octIdx=${octIdx}(${octIdx !== -1 ? header[octIdx] : "搵唔到"})｜` +
        `singleIdx=${singleIdx}(${singleIdx !== -1 ? header[singleIdx] : "搵唔到"})`
      );
    }
    if (srcIdx === -1 || destIdx === -1) {
      if (DEBUG_MODE) console.log("[輕鐵車費 CSV 欄位偵測] 搵唔到上車站／落車站嗰欄，跌返用空 fareDb（睇返上面個 header 陣列，確認實際欄名）。");
      return fareDb;
    }
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      if (!row) continue;
      const src = (row[srcIdx] || "").trim();
      const dest = (row[destIdx] || "").trim();
      if (!src || !dest) continue;
      const oct = octIdx !== -1 ? _mtrParseFareNumber(row[octIdx]) : NaN;
      const single = singleIdx !== -1 ? _mtrParseFareNumber(row[singleIdx]) : NaN;
      fareDb[src] = fareDb[src] || {};
      fareDb[src][dest] = {
        oct: Number.isFinite(oct) ? oct : null,
        single: Number.isFinite(single) ? single : null
      };
    }
    if (DEBUG_MODE) console.log(`[輕鐵車費 CSV 欄位偵測] 成功解析 ${Object.keys(fareDb).length} 個上車站，共 ${rows.length - 1} 行原始資料。`);
    return fareDb;
  } catch (err) {
    console.error("載入輕鐧車費資料失敗:", err);
    return {};
  }
}

// 將輕鐧每一條路線、每一個方向組裝成一個「虛擬路線」,格式仿 mtrRouteList，
// 等 searchRoutes()／populateStops()／getCompanies() 呢一套現成邏輯可以
// 直接攞嚟用。同時將每個站注入 etaDb.stopList,行程組合結果頁面
// （renderResults）先搵到站名。
function _injectLightRailIntoSearchIndices() {
  if (!etaDb || !etaDb.routeList || !stopRouteIndex || !lrRouteList) return;

  for (const [routeId, r] of Object.entries(lrRouteList)) {
    const companies = getCompanies(r); // 即 ["lightrail"]
    if (!companies.length) continue;
    const primaryCo = companies[0];
    const stops = r.stops[primaryCo];
    if (!stops) continue;
    stops.forEach((stopId, idx) => {
      if (!stopId) return;
      if (!stopRouteIndex.has(stopId)) stopRouteIndex.set(stopId, []);
      stopRouteIndex.get(stopId).push({ routeId, idx, companies, primaryCo });
    });
  }

  // 輕鐵站已經加入咗 etaDb.stopList（連座標，見 _buildLightRailRouteList()），
  // 同 _injectMtrIntoSearchIndices() 一樣，重新起一次 gridIndex 先至令
  // nearbyStops() 搵到呢批新增嘅站。
  buildGridIndex(etaDb.stopList);
  _coLocatedRoutesCache.clear(); _stationGroupCache.clear(); _stationGroupRouteCountCache.clear(); // stopRouteIndex／gridIndex 有新資料，舊 cache 已經過期
}

function _buildLightRailRouteList() {
  lrRouteList = {};
  if (!lightRailDb || !lightRailDb.lines || !etaDb || !etaDb.stopList) return;

  for (const routeCode of Object.keys(lightRailDb.lines)) {
    for (const dirKey of Object.keys(lightRailDb.lines[routeCode])) {
      const seq = lightRailDb.lines[routeCode][dirKey];
      if (!seq.length) continue;
      const stationCodes = seq.map(s => s.code);
      const stopIds = stationCodes.map(code => `LR-${code}`);

      stopIds.forEach((stopId, idx) => {
        if (etaDb.stopList[stopId]) return;
        const code = stationCodes[idx];
        const meta = (lightRailDb.stopNameByCode && lightRailDb.stopNameByCode[code]) || {};
        const coord = _lightRailStationCoord(meta.zh, meta.en);
        etaDb.stopList[stopId] = {
          name: { zh: meta.zh || code, en: meta.en || code },
          location: coord
        };
      });

      const origMeta = (lightRailDb.stopNameByCode && lightRailDb.stopNameByCode[stationCodes[0]]) || {};
      const destMeta = (lightRailDb.stopNameByCode && lightRailDb.stopNameByCode[stationCodes[stationCodes.length - 1]]) || {};
      const routeId = `LR-${routeCode}-${dirKey}`;
      lrRouteList[routeId] = {
        route: routeCode,
        lrRouteCode: routeCode,
        lrDirection: dirKey,
        lrStationCodes: stationCodes,
        co: "lightrail",
        primaryCo: "lightrail",
        orig: { zh: origMeta.zh || stationCodes[0] },
        dest: { zh: destMeta.zh || stationCodes[stationCodes.length - 1] },
        stops: { lightrail: stopIds },
        isLightRailRoute: true
      };
    }
  }

  if (etaDb && etaDb.routeList) {
    Object.assign(etaDb.routeList, lrRouteList);
  }
}

// 輕鐵資料載入
async function loadLightRailFullData() {
  if (lrRouteList) return;
  if (lrFullLoadPromise) return lrFullLoadPromise;

  lrFullLoadPromise = (async () => {
    try {
      await Promise.all([loadLightRailData(), loadMtrData()]);
      _buildLightRailRouteList();
      _injectLightRailIntoSearchIndices();
      lrFareDb = await _loadLightRailFareDb();
    } catch (err) {
      console.error("輕鐧行程資料整合失敗:", err);
    }
  })();

  return lrFullLoadPromise;
}

// 輕鐵實時到站
async function fetchLightRailNextTrain(r, idx) {
  if (!r || !r.lrStationCodes) return [];
  const staCode = r.lrStationCodes[idx];
  if (!staCode) return [];

  try {
    const resp = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=${encodeURIComponent(staCode)}`);
    const json = await resp.json();
    if (!json) return [];

    const platformList = json.platform_list || json.platformList || [];
    const nowBase = _parseLrSystemTime(json.system_time || json.systemTime) || new Date();
    const destZh = String((r.dest && r.dest.zh) || "").trim();
    const routeNo = String(r.route || r.lrRouteCode || "").trim();

    const entries = [];
    for (const plat of platformList) {
      const routeArr = plat.route_list || plat.routeList || [];
      for (const item of routeArr) {
        const itemRouteNo = String(item.route_no || item.routeNo || "").trim();
        if (routeNo && itemRouteNo && itemRouteNo !== routeNo) continue;

        const itemDest = String(item.dest_ch || item.destCh || item.dest_en || item.destEn || "").trim();
        if (destZh && itemDest && !(itemDest.includes(destZh) || destZh.includes(itemDest))) continue;

        const timeStr = String(item.time_ch || item.timeCh || item.time_en || item.timeEn || "");
        const mins = _parseLrEtaMinutes(timeStr);
        if (mins === null) continue;

        entries.push({
          etaDate: new Date(nowBase.getTime() + mins * 60000),
          rmk: "",
          isFallback: false
        });
      }
    }

    return entries.sort((a, b) => a.etaDate - b.etaDate);
  } catch (err) {
    return [];
  }
}

function _parseLrSystemTime(s) {
  if (!s) return null;
  const d = new Date(String(s).replace(" ", "T"));
  return isNaN(d) ? null : d;
}

// 解析「3 min.」「3 分鐧」「即將抵達」「-」呢類到站時間文字,揈出分鐧數。
function _parseLrEtaMinutes(s) {
  const str = String(s || "").trim();
  if (!str) return null;
  if (/即將|arriving/i.test(str)) return 0;
  const m = str.match(/-?\d+(\.\d+)?/);
  if (!m) return null;
  const v = parseFloat(m[0]);
  return Number.isFinite(v) ? Math.max(0, v) : null;
}

// 逐站觀測車程（hketa，timeinterval.hkbuseta.com）：輕鐧固定用 "LR" 做
// 檔案名前綴（唔似重鐧用返站代號首兩位嗰種分組法——輕鐧站代號係純數字,
// 冇意義嘅字母前綴,hketa 索性將全部輕鐧站歸做一份 LR.json）。
async function getLightRailIntervalSeconds(fromCode, toCode, when) {
  const dow = when.getDay();
  const hh = String(when.getHours()).padStart(2, "0");
  const cacheKey = `${dow}/${hh}/LR`;

  if (!lrIntervalCache.has(cacheKey)) {
    const p = fetch(`https://timeinterval.hkbuseta.com/times_hourly/${dow}/${hh}/LR.json`)
      .then(res => res.ok ? res.json() : null)
      .catch(() => null);
    lrIntervalCache.set(cacheKey, p);
  }

  const json = await lrIntervalCache.get(cacheKey);
  if (!json) return null;

  // 【修正：Beam Search 預估輕鐵必須真正命中 hkbuseta LR.json】
  // r.lrStationCodes 由 light_rail_routes_and_stops.csv 產生，實際通常係
  // "LR1"／"LR010"；而 hkbuseta LR.json 可能使用 "1"、"01"、"LR1"、
  // "LR001" 等不同表示法。之前呢度用 Number("LR1")，會得到 NaN，
  // 令所有 LR* 站號永遠撞唔中，getLightRailIntervalSeconds() 雖然有 fetch，
  // 但最後永遠回傳 null，estimateSegmentDuration() 只可以跌落 1.6 分鐘/站
  // 嘅粗略估算。
  // 統一使用已經用喺 lrtData／頭尾班車查表嘅 _lrCodeCandidates()，確保
  // 「實際未來出發時間」所需嘅星期＋小時 LR.json 真正參與車程估算。
  const fromCandidates = (typeof _lrCodeCandidates === "function")
    ? _lrCodeCandidates(fromCode)
    : [String(fromCode ?? "").trim()];
  const toCandidates = (typeof _lrCodeCandidates === "function")
    ? _lrCodeCandidates(toCode)
    : [String(toCode ?? "").trim()];

  for (const fc of fromCandidates) {
    const inner = json[fc];
    if (!inner) continue;
    for (const tc of toCandidates) {
      const sec = Number(inner[tc]);
      if (Number.isFinite(sec) && sec > 0) return sec;
    }
  }
  return null;
}

// 輕鐧站與站之間搵唔到觀測數據時嘅單一段粗略估算（分鐘）
const LR_SEGMENT_FALLBACK_MIN_PER_STOP = 1.6;

async function getLightRailSegmentMinutes(stationCodes, boardIdx, alightIdx, when) {
  let totalSec = 0;
  let hasAnyRealData = false;
  for (let i = boardIdx; i < alightIdx; i++) {
    const sec = await getLightRailIntervalSeconds(stationCodes[i], stationCodes[i + 1], when);
    if (sec === null) {
      totalSec += LR_SEGMENT_FALLBACK_MIN_PER_STOP * 60;
    } else {
      totalSec += sec;
      hasAnyRealData = true;
    }
  }
  // 全部分段都搵唔到真實數據（例如 LR.json 呢個鐘數完全冇資料）：交返
  // null，等上層用返佢自己嗰套整體粗略估算，行為同以往一致，唔會扭曲
  // 個「搵唔到就用返粗略估算」嘅語義。
  if (!hasAnyRealData) return null;
  return totalSec / 60;
}

// 【修正：車費 CSV 同路線/站 CSV 用緊兩套唔同嘅代號格式】
// light_rail_fares.csv 嘅 from_station_id／to_station_id 係淨數字
// （例如 "1"、"250"），但 light_rail_routes_and_stops.csv／LR.json 嗰邊
// 嘅站代號係帶「LR」字首（例如 "LR1"、"LR250"）——stationCodes（即
// r.lrStationCodes，一路帶到 getLightRailFare() 嘅 fromCode/toCode）用
// 嘅正正係後者呢種格式，同 fareDb 用嚟起 key 嗰種完全對唔上，令查表
// 永遠打空。而家加返呢個正規化：淨係抽走大小寫不拘嘅開頭「LR」字
// 首，兩種格式都會變返做同一種純數字字串，等查表對得上。
function _normalizeLrStationCode(code) {
  return String(code || "").trim().replace(/^LR/i, "");
}

// 車費：用站代號直接對照 light_rail_fares.csv
// 預設用八達通成人票價。
// 【修正「仲未見到有輕鐵車費」】lrFareDb 淨係喺 loadLightRailFullData()
// 背景載入鏈嘅最後一步先賦值，但輕鐧路線本身喺 _injectLightRailIntoSearchIndices()
// 呢一步（早過 lrFareDb 攞到手）已經加咗入搜尋索引，令用戶可以搵到輕鐧
// 路線並觸發 evaluateCandidate。如果用戶喺 lrFareDb 都仲未 fetch 完（例如
// 岩岩開咗頁就即刻搜尋）嗰陣撞正呢個時間差，舊寫法會即刻 return null，而
// 呢個 null 會直接寫死入 newLegs 嘅 fare 欄位，之後即使 lrFareDb 遲吓載入
// 完成都唔會再重新計算，變成成程搜尋結果永遠冇輕鐧車費。而家改做 async，
// 如果 lrFareDb 仲未有但背景載入 promise（lrFullLoadPromise）已經存在，
// 就等埋佢載入完先查，確保只要車費 CSV 最終攞到手,就一定會反映落結果度。
function _lrFareNumber(value) {
  if (value === null || value === undefined) return null;
  if (typeof value === "number") return Number.isFinite(value) ? value : null;
  if (typeof value === "string") {
    const n = _mtrParseFareNumber(value);
    return Number.isFinite(n) ? n : null;
  }
  if (Array.isArray(value)) {
    for (const item of value) {
      const n = _lrFareNumber(item);
      if (n !== null) return n;
    }
    return null;
  }
  if (typeof value === "object") {
    const keys = [
      "oct", "octopus", "octopus_adult", "octopusAdult",
      "oct_adt", "fare_octo_adult", "adult", "single",
      "single_adult", "singleAdult", "fare_single_adult",
      "fare", "value", "amount"
    ];
    for (const key of keys) {
      if (Object.prototype.hasOwnProperty.call(value, key)) {
        const n = _lrFareNumber(value[key]);
        if (n !== null) return n;
      }
    }
  }
  return null;
}

function _getLrtDataFare(fromCode, toCode) {
  const db = lrtFirstLastDb;
  if (!db || typeof db !== "object") return null;

  const fromCandidates = [...new Set([
    String(fromCode || "").trim(),
    _normalizeLrStationCode(fromCode),
    `LR${_normalizeLrStationCode(fromCode)}`
  ].filter(Boolean))];
  const toCandidates = [...new Set([
    String(toCode || "").trim(),
    _normalizeLrStationCode(toCode),
    `LR${_normalizeLrStationCode(toCode)}`
  ].filter(Boolean))];

  for (const fk of fromCandidates) {
    const stationData = db[fk];
    if (!stationData || typeof stationData !== "object") continue;

    // data_full.json：lrtData[X].fares[Y]
    const fareTable = stationData.fares;
    if (!fareTable || typeof fareTable !== "object") continue;

    for (const tk of toCandidates) {
      if (!Object.prototype.hasOwnProperty.call(fareTable, tk)) continue;
      const fare = _lrFareNumber(fareTable[tk]);
      if (fare !== null) return fare;
    }
  }
  return null;
}

// 車費優先使用 data_full.json 的 lrtData[X].fares[Y]；
// 舊有 light_rail_fares.csv 保留作 fallback，避免 data_full.json 某些站對暫時缺漏時整個車費失效。
async function getLightRailFare(fromCode, toCode) {
  // data_full.json 通常已由 init() 平行載入；如果因其他入口較早觸發，補等一次。
  if (!lrtFirstLastDb && typeof loadFullStationData === "function") {
    try {
      const full = await loadFullStationData();
      if (full && full.lrtData) lrtFirstLastDb = full.lrtData;
    } catch (e) {}
  }

  const fullDataFare = _getLrtDataFare(fromCode, toCode);
  if (fullDataFare !== null) {
    if (DEBUG_MODE) {
      console.log(`[輕鐵車費查表:data_full] ${fromCode}→${toCode} = ${fullDataFare}`);
    }
    return fullDataFare;
  }

  // CSV fallback：兩邊代號都做正規化（去掉「LR」字首）。
  if (!lrFareDb) {
    if (lrFullLoadPromise) {
      try { await lrFullLoadPromise; } catch (e) {}
    }
    if (!lrFareDb) return null;
  }

  const fromKey = _normalizeLrStationCode(fromCode);
  const toKey = _normalizeLrStationCode(toCode);
  const row = lrFareDb[fromKey] && lrFareDb[fromKey][toKey];
  if (DEBUG_MODE) {
    console.log(`[輕鐵車費查表:CSV fallback] fromCode=${fromCode}→${fromKey}｜toCode=${toCode}→${toKey}｜${row ? `搵到 oct=${row.oct}／single=${row.single}` : "搵唔到"}`);
  }
  if (!row) return null;
  return Number.isFinite(row.oct) ? row.oct : row.single;
}
