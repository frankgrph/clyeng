      routeSiblingIndex.get(key).push(r);
    }
  }
}

// 搵返同一個路線編號＋方向＋營辦商底下，其他有停靠 boardStopId 嘅
// serviceType 兄弟變體（唔包括 r 本身）。冇 boardStopId 就放寬做「淨係
// 排走 r 本身」，交由 caller（例如冇分站資訊嘅呼叫情況）自行決定點用。
//
// 【alightStopId：唔只停埋上車站，仲要真係去到落車站先算「兄弟」】
// 用戶反映 87D（紅磡站總站→錦英苑・正常路線）用 r.freq 估算下一班車，
// 12 分鐧一班嘅時段錯誤咁計成 6 分鐧一班。追查落去，成因係「揀最快」
// 嗰個合併邏輯（_resolveAllEffectiveFreqTables／_computeEarliestFreqDeparture）
// 淨係核實兄弟 serviceType 變體「有冇停靠上車站」，就將佢嘅 freq 表一
// 齊攞嚟同 r 自己嗰個比較揀最快——但 87D 喺紅磡站總站呢一個總站底下，
// 好可能仲有其他 serviceType（例如唔同繞經、去唔到「錦英苑」正常路線
// 終點嘅特別班次）都喺同一個總站上車，佢哋自己嘅 freq 表可能因為擔任
// 緊完全唔同時段／密度嘅角色而密好多。呢啲變體乘客根本上唔到（去唔到
// 用戶實際要去嘅落車站），將佢哋嘅班次密度混落嚟估算「下一班車」，
// 就會產生一個唔存在嘅過快估算。而家加返 alightStopId 呢個可選參數：
// 有提供嘅話，兄弟變體仲要喺同一個 co 嘅站序陣列入面，喺 boardStopId
// 之後嘅位置搵到 alightStopId（即係「呢班車坐落去真係會經過你想落嘅
// 站」），先當佢係一個可以用嚟估算等車時間嘅真兄弟；冇提供 alightStopId
// 就維持返舊有行為（淨係核實上車站），等冇落車站資訊嘅呼叫情況（例如
// _resolveFreqLastDepartureCutoff 淨係想知尾班車上限，唔關心落唔落到
// 落車站）唔會受影響。
function _findSiblingRoutesForStop(r, co, boardStopId, alightStopId) {
  if (!routeSiblingIndex || !r) return [];
  const key = _routeSiblingKey(r.route, co, _routeBoundValue(r, co));
  const list = routeSiblingIndex.get(key);
  if (!list || !list.length) return [];
  return list.filter(sib => {
    if (sib === r) return false;
    if (!boardStopId) return true;
    const sibStops = sib.stops && sib.stops[co];
    if (!sibStops || !sibStops.includes(boardStopId)) return false;
    if (!alightStopId) return true;
    const boardIdx = sibStops.indexOf(boardStopId);
    const alightIdx = sibStops.indexOf(alightStopId);
    return alightIdx > boardIdx;
  });
}

// 【共用】揾返 r 本身、或者（如果 r 自己嗰個 serviceType 冇資料）佢嘅
// serviceType 兄弟變體入面，喺 atTime 呢一刻真正有得比對嘅 freq 時段表。
// 只有「揾到 dayKey，並且嗰個 dayKey 底下確實有非空嘅時段表」先算「有
// 資料」；如果 r 自己冇（freq 缺失、搵唔到日子類型、或者嗰個日子類型
// 底下係空表），先至去試兄弟變體（限於同樣停靠 boardStopId 嗰啲，避免
// 借用一個根本冇經過呢個站嘅變體嘅班次表）。搵到就連埋來源（source）
// 一齊傳返，等 caller 有需要時可以知道實際係邊一個 serviceType 變體
// 提供緊呢個時段表。搵唔到就傳 null，等 caller 自行決定跌落去乜嘢保底
// 邏輯（例如通宵線冇任何 freq 資料時嘅粗略估算）。
function _resolveEffectiveFreqTable(r, atTime, boardStopId, primaryCo, alightStopId) {
  if (!r) return null;
  const co = primaryCo || r.primaryCo || (Array.isArray(r.co) ? r.co[0] : null);

  const tryOne = (candidate) => {
    if (!candidate || !candidate.freq) return null;
    const dayKey = _resolveFreqDayTypeKey(candidate.freq, atTime);
    if (!dayKey) return null;
    const table = candidate.freq[dayKey];
    if (!table || !Object.keys(table).length) return null;
    return table;
  };

  const ownTable = tryOne(r);
  if (ownTable) return { table: ownTable, source: r };

  if (!co) return null;
  const siblings = _findSiblingRoutesForStop(r, co, boardStopId, alightStopId);
  for (const sib of siblings) {
    const table = tryOne(sib);
    if (table) return { table, source: sib };
  }
  return null;
}

// 【班次估算 - 合併全部 serviceType 變體】_resolveEffectiveFreqTable() 本身
// 只會喺 r 自己嗰個 serviceType 完全冇 freq 資料先去揾第一個搵到嘅兄弟
// 變體頂住，一旦 r 自己有 freq（哪怕淨係得好疏嘅班距），就永遠唔會理其他
// 兄弟變體嘅班次表——但同一個路線編號＋方向＋公司（例如 11 號線），好多
// 時官方會拆成幾個 serviceType（例如假日特別班、繁忙時間加班、繞經
// 變體），各自得返一份唔完整嘅 freq，實際嗰個站嘅真正候車時間，應該係
// 「呢幾個變體之中，最快到嘅一班」，而唔係死咬住搜尋揀中嗰一個 serviceType
// 嘅班次表。用戶反映東涌等 11 號線去大澉，成程等咗接近一個鐘，但如果連埋
// 11 嘅其他 serviceType 變體嘅 freq 一齊考慮，好可能其中一個變體喺呢個
// 時段其實仲有更密嘅班次。而家新增呢個函數，攞返 r 自己（如果有資料）＋
// 全部有停靠 boardStopId 嘅兄弟變體嘅 freq 表（唔止揾到第一個就停），
// 等 caller 可以逐個表計出候車時間，揀返全部之中最快嘅一班。
function _resolveAllEffectiveFreqTables(r, atTime, boardStopId, primaryCo, alightStopId) {
  if (!r) return [];
  const co = primaryCo || r.primaryCo || (Array.isArray(r.co) ? r.co[0] : null);
  const results = [];

  const tryOne = (candidate) => {
    if (!candidate || !candidate.freq) return null;
    const dayKey = _resolveFreqDayTypeKey(candidate.freq, atTime);
    if (!dayKey) return null;
    const table = candidate.freq[dayKey];
    if (!table || !Object.keys(table).length) return null;
    return table;
  };

  const ownTable = tryOne(r);
  if (ownTable) results.push({ table: ownTable, source: r });

  if (co) {
    // 【落車站都要撞得中先算真兄弟】見 _findSiblingRoutesForStop() 頂部
    // 註解——冇呢個 alightStopId 篩選嘅話，「揀最快」會誤將去唔到用戶
    // 實際落車站嘅特別班次變體嘅密集班次都計落嚟，產生一個乘客實際上
    // 唔到嘅過快估算（例如 87D 12 分鐧一段被錯誤計成 6 分鐧一班）。
    const siblings = _findSiblingRoutesForStop(r, co, boardStopId, alightStopId);
    for (const sib of siblings) {
      const table = tryOne(sib);
      if (table) results.push({ table, source: sib });
    }
  }
  return results;
}

// 【班次估算 - 合併全部變體之中最快一班】用上面攞返嘅一批 freq 表，逐個
// call _computeFreqDeparture()，揀返「等候時間最短」嗰一個結果（連埋佢
// 嘅 source route 物件一齊傳返，等 caller 需要嘅話知道實際係邊個
// serviceType 變體提供緊呢班車）。搵唔到就傳 null。
function _computeEarliestFreqDeparture(tables, now, lookaheadMin) {
  let best = null; // { etaDate, isFutureBlock, isPointDeparture, source }
  for (const { table, source } of tables) {
    const result = _computeFreqDeparture(table, now, lookaheadMin);
    if (!result) continue;
    if (!best || result.etaDate < best.etaDate) {
      best = { ...result, source };
    }
  }
  return best;
}

// 【r.freq 尾班車時間上限：GTFS 靜態時間表唔應該比 routeFareList.min.json
// 本身嘅官方尾班車時間仲遲】用戶反映 681（馬鞍山市中心→中環）刻意用過咗
// 官方尾班車 23:20（r.freq 呢個 dayType 最後一個時段 "2250":["2320","1800"]
// 嘅結束時間，即尾班車開出時刻——見 _computeFreqDeparture() 頂部註解）嘅
// 23:32 去測試，系統都照樣估計咗一個 23:20 之後、根本唔存在嘅班次（例如
// 23:43）出嚟。追查落去，成因係下面 dfs() 嘅 tryFallbackForCo() 揾唔到
// 實時 ETA 嗰陣，第一優先會靠 getStopArrivalScheduleList()（GTFS
// stop_times.txt／frequencies.txt 靜態時間表）搵「未來窗口內嘅班次」，
// 揾到就直接 return，完全冇經過任何 r.freq 校對；如果 GTFS 資料本身有
// 誤差（例如 frequencies.txt 展開時 bestNode 配對用嘅 220 米容錯撞中錯
// 嘅站、或者 GTFS 靜態時間表本身冇跟實際尾班車已經提早咗嘅最新公告
// 更新），就會畀一個 routeFareList.min.json 明確話「已經冇車」嘅時段，
// 憑空生出一個唔存在嘅「預定」班次。routeFareList.min.json 嘅 freq 係
// 官方票價／班次表資料，喺呢個 app 一直當權威來源用（例如
// isRouteActiveAroundTime()／scheduleFallback() 全部信佢），所以呢度
// 加一個上限檢查：揾返 r 本身（連埋兄弟 serviceType 變體）喺 atTime 呢個
// dayType 底下,今日（考慮跨午夜）最遲一個時段嘅結束時間（＝尾班車開出
// 時刻），如果 GTFS 話有嘅「未來班次」遲過呢個上限（容許 5 分鐧誤差,
// 應付兩份資料源之間好正常嘅少量落差),就當呢班 GTFS 班次唔可信,過濾走,
// 唔會直接攞嚟用。搵唔到 r.freq 資料（連兄弟變體都冇）就傳 null,等
// caller 當冇上限,維持原有行為,唔會因為冇資料就誤攔截合法嘅 GTFS 班次。
function _resolveFreqLastDepartureCutoff(r, atTime, boardStopId, primaryCo) {
  try {
    const tables = _resolveAllEffectiveFreqTables(r, atTime, boardStopId, primaryCo);
    if (!tables.length) return null;

    const baseDate = new Date(atTime.getFullYear(), atTime.getMonth(), atTime.getDate());
    let latestMins = null; // 以 atTime 嗰日 00:00 為基準嘅分鐘數；跨午夜時段會 >1440

    for (const { table } of tables) {
      if (!table) continue;
      for (const key of Object.keys(table)) {
        const entry = table[key];
        const startMins = _toMinutes(key);
        let endMins;
        if (entry === null || _isDegenerateArrayEntry(entry, startMins)) {
          endMins = startMins; // 單點定時班次（包括 49S 呢類退化陣列）：呢一刻本身就係開車時刻
        } else if (Array.isArray(entry)) {
          endMins = _toMinutes(entry[0]);
          if (endMins <= startMins) endMins += 24 * 60; // 跨午夜時段
        } else {
          continue;
        }
        if (latestMins === null || endMins > latestMins) latestMins = endMins;
      }
    }

    if (latestMins === null) return null;
    return new Date(baseDate.getTime() + latestMins * 60000);
  } catch (e) {
    return null;
  }
}

// 【r.freq 班距一致性檢查：GTFS 靜態時間表逐班時間，唔應該同
// routeFareList.min.json 官方班距對唔上】上面 _resolveFreqLastDepartureCutoff()
// 淨係核實 GTFS 話有嘅未來班次唔會遲過官方尾班車開出時刻（上限），但完全
// 冇核實呢班車嘅開出時間本身係咪貼近官方班距嘅發車格仔——用戶反映 87D
// （紅磡站總站→錦英苑）測試 23:31 查詢，官方 freq 表 22:36-23:06 之後
// 應該係 12 分鐘一班（23:06/18/30/42/54...），但 GTFS
// frequencies.txt 展開出嚟嘅其中一班係 23:36，啱啱好貼喺前一個時段
// （22:36-23:06，10 分鐘一班）嘅格仔延伸落嚟，雖然仲喺尾班車 00:30
// 之前（冇被 freqCutoff 攔到），但同官方 12 分鐘班距完全對唔上，實際上
// 唔存在。呢個函數核實 candidateTime 係咪貼近（容許
// FREQ_GRID_TOLERANCE_MIN 分鐘誤差，應付兩份資料源之間好正常嘅少量落差）
// r.freq（連埋兄弟 serviceType 變體，一樣要真係去到 alightStopId 先計，
// 見 _findSiblingRoutesForStop() 頂部註解）喺呢個 dayType 底下，任何一個
// 時段嘅發車格仔——逐個時段（陣列 [結束時間,班距] 或者 null 單點）都會
// 檢查，並且處理埋跨午夜移位，唔止睇 candidateTime 落喺邊一個時段。搵唔到
// 任何有效 freq 資料就當「冇官方資料可以對比」，唔阻攔（傳 true），維持
// 原有行為，唔會因為冇資料就誤殺合法嘅 GTFS 班次。
const FREQ_GRID_TOLERANCE_MIN = 5;
function _isTimeConsistentWithFreqGrid(r, candidateTime, boardStopId, co, alightStopId) {
  try {
    const tables = _resolveAllEffectiveFreqTables(r, candidateTime, boardStopId, co, alightStopId);
    if (!tables.length) return true; // 冇官方資料可對比，唔阻攔

    const candMins = candidateTime.getHours() * 60 + candidateTime.getMinutes();
    const SHIFTS = [0, 1440, -1440]; // 處理跨午夜時段

    for (const { table } of tables) {
      if (!table) continue;
      for (const key of Object.keys(table)) {
        const entry = table[key];
        const startMins = _toMinutes(key);

        if (entry === null || _isDegenerateArrayEntry(entry, startMins)) {
          // 單點定時班次（包括 49S 呢類退化陣列）：直接比較呢一點本身（連埋跨午夜移位）
          for (const shift of SHIFTS) {
            if (Math.abs((startMins + shift) - candMins) <= FREQ_GRID_TOLERANCE_MIN) return true;
          }
          continue;
        }
        if (!Array.isArray(entry)) continue;

        let endMins = _toMinutes(entry[0]);
        if (endMins <= startMins) endMins += 24 * 60; // 跨午夜時段
        const headwayMins = Math.max(1, Math.round(Number(entry[1]) / 60));
        if (!Number.isFinite(headwayMins) || headwayMins <= 0) continue;

        for (const shift of SHIFTS) {
          const shiftedCandMins = candMins + shift;
          // 完全喺呢個時段範圍以外（連容錯都超出）就唔使再計呢個時段
          if (shiftedCandMins < startMins - FREQ_GRID_TOLERANCE_MIN || shiftedCandMins > endMins + FREQ_GRID_TOLERANCE_MIN) continue;
          const clamped = Math.min(Math.max(shiftedCandMins, startMins), endMins);
          const steps = Math.round((clamped - startMins) / headwayMins);
          const gridMins = startMins + steps * headwayMins;
          if (Math.abs(gridMins - shiftedCandMins) <= FREQ_GRID_TOLERANCE_MIN) return true;
        }
      }
    }
    return false;
  } catch (e) {
    return true; // 核實過程出錯，保守放行，唔阻攔原有邏輯
  }
}

// 【專門畀「現正服務」標籤用嘅保守版本】isRouteActiveAroundTime()
// 喺完全搵唔到任何 freq 時段表（連兄弟變體都冇，即係 freq 本身係 null／
// 冇呢個欄位）嗰陣，為咗唔拖累正常搵路線嘅搜尋功能（漏搵一條其實有服務
// 嘅路線，好過捉少一條累搜尋結果消失），會保守假設「可能運作」，除非
// 係次要 serviceType（>1）先當冇服務——呢個假設留畀 isRouteActiveAroundTime()
// 其他用開嘅地方（例如 hasDirectService()）繼續用，唔可以喺呢度改，因為
// 會令核心搵路線功能漏咗本身有效嘅直達路線。
// 但「現正服務」標籤純粹係畀用戶睇嘅視覺提示，取態應該啱啱相反：寧願
// 少畀（false negative，冇標籤但其實可能有服務），都好過亂畀（false
// positive，一大堆校巴／特別班次、freq 根本冇資料嘅變體，例如 N42A、
// N48 呢類，冧咗都照樣貼住個「現正服務」）。所以呢度淨係喺真係揾到有效
// freq 時段表、並且表入面確實計到未來 windowMin 分鐘內有班次先算 true；
// 完全冇 freq 資料（連 KMB 官方路線列表都話呢個 service_type 已經唔存在，
// 或者根本冇任何時段表可查、亦冇實時 ETA 撐住）一律當「特別路線，冇
// 服務」，唔畀標籤。
// 【只信自己，唔好問兄弟】呢度特登唔用 _resolveEffectiveFreqTable()——
// 嗰個函數會喺 r 自己冇有效 freq 表嘅時候，借第一個有停靠嘅兄弟
// serviceType 變體嘅班次表頂住，呢個做法喺 ETA／等車時間估算入面啱嘅
// （寧願粗略估都好過乜都冇），但用喺「現正服務」標籤度就會出事：例如
// 107 O 方向 serviceType "2"（「星期日及假日班次，經海洋公園」，freq
// 淨係得 448 呢個「星期日＋假日」bitmask key）平日搜尋時，自己嘅
// freq 表撞唔中今日（平日）嘅日子類型，理應冇資料；但如果借咗隔籬
// serviceType "1"（平日正常班次）嘅班次表頂住，就會令呢個星期日先開
// 嘅特別分支，喺平日都錯誤咁貼埋個「現正服務」標籤。搜尋結果入面每個
// serviceType 都係獨立一行，兄弟變體真係有服務嘅話會自己嗰行有自己嘅
// 標籤，唔需要（都唔應該）靠呢度借用嚟頂替。所以呢度淨係核實 r 自己
// 嘅 freq 表同日子類型，唔會 fallback 去兄弟變體。
function _hasConfirmedFreqServiceNow(r, atTime, windowMin) {
  if (!r) return false;
  try {
    if (r.primaryCo === "kmb" && r.service_type) {
      const liveCheck = isKmbServiceTypeLive(r.route, r.service_type);
      if (liveCheck === false) return false;
    }
    if (!r.freq) return false; // 呢個分支本身冇 freq 時段表：當特別路線冇服務
    const dayKey = _resolveFreqDayTypeKey(r.freq, atTime);
    if (!dayKey) return false; // 揾唔到同今日日子類型對應嘅 key（例如平日撞去星期日限定嘅分支）
    const table = r.freq[dayKey];
    if (!table || !Object.keys(table).length) return false;
    const result = _computeFreqDeparture(table, atTime, windowMin);
    return !!result;
  } catch (e) {
    return false;
  }
}

function isRouteActiveAroundTime(r, atTime, boardStopId = null, windowMin = 90) {
  if (!r || !atTime) return false;
  
  // 1. 如果資料庫的路線已區分 service_type 且 freq 綁定在變體上
  // 我們需要確保目前查詢的 boardStopId 真的屬於這個變體的營運區間
  // 【修正】以前呢度淨係睇 r.stops[r.primaryCo]（單一公司變體）有冇
  // 呢個站，如果 boardStopId 淨係存在喺呢條路線嘅另一個公司變體
  // （同「改善上車步行距離估算」／stopRouteIndex 之前撞到嗰個 bug
  // 一模一樣嘅成因），就會誤判做「呢個站根本唔屬於呢條路線」，直接
  // return false——喺 beam search 嗰步造成緊「呢個上車站對呢條路線
  // 完全靜靜雞消失」，連 evaluateCandidate 都未行到就已經冚咗，亦都
  // 唔會有任何 [候選被淘汰] log（因為個 log 喺 evaluateCandidate 度，
  // 呢度仲未去到嗰步）。而家改為掃晒條路線嘅全部公司變體，唔止睇
  // primaryCo 嗰個。
  if (boardStopId && r.stops) {
    const companiesToCheck = (typeof getCompanies === "function" ? getCompanies(r) : null) || (r.primaryCo ? [r.primaryCo] : []);
    const foundInAnyCo = companiesToCheck.some(co => Array.isArray(r.stops[co]) && r.stops[co].includes(boardStopId));
    if (!foundInAnyCo) return false;
  }

  // 0. 快速核實：就住九巴路線，先用官方路線列表 API（比慢速 GTFS 快）核實
  // 呢個 service_type 變體係咪現時依然存在。搵到明確「唔存在」就即刻當
  // 冇服務，唔使再行落去等 GTFS 逐個 trip 慢慢比對——呢一步專門針對
  // 資料庫入面殘留咗已停辦嘅特別班次變體（例如已取消嘅特別繁忙時間班次）
  // 而導致誤判「有直達車」嘅情況。
  if (r.primaryCo === "kmb" && r.service_type) {
    const liveCheck = isKmbServiceTypeLive(r.route, r.service_type);
    if (liveCheck === false) return false;
  }

  try {
    const freq = r.freq;
    if (freq) {
      const dayTypes = Object.keys(freq);
      if (!dayTypes.length) return true;
    }

    // 【serviceType 兄弟變體】r 自己嗰個 serviceType 嘅 freq 如果冇資料
    // （缺失、搵唔到今日日子類型、或者嗰個日子類型底下係空表），先至去
    // 睇下同一條路線編號＋方向＋營辦商底下，其他有停靠 boardStopId 嘅
    // serviceType 兄弟變體係咪有資料——例如九巴 3M 入向拆開咗
    // serviceType "1"（全程 12 站、全日 freq）同 serviceType "2"（只有
    // 前 8 站、freq 淨係得早上幾個校巴時段）兩個 route 物件，如果搜尋
    // 揀中嗰個係 serviceType "2"，但現時時段唔喺佣 freq 覆蓋範圍內，就
    // 應該問返 serviceType "1"（兩者共用嗰 8 個站）呢個時候係否有服務，
    // 而唔係即刻斷定「呢個站冇服務」。
    const resolved = _resolveEffectiveFreqTable(r, atTime, boardStopId, r.primaryCo);
    if (!resolved) {
      // 連兄弟變體都搵唔到任何有效嘅 freq 資料：如果 r 本身根本冇 freq
      // （常見於主線資料庫收錄唔齊全），保守假設「可能運作」；但如果 r
      // 屬於特別班次變體（r.service_type > 1，例如 A41 繞經國泰城），
      // 冇任何 freq 資料代表冇任何證據話呢個時段佢確實運作，寧願當佢
      // 冇服務，都好過畀一條唔啱嘅特別班次變體隨時當「有直達車」用。
      if (!freq) {
        return !(r.service_type && r.service_type > 1);
      }
      return false;
    }

    // 【修正同一個 null 單點 bug】以往呢度自己另外寫多一份 getIntervalRange
    // 逐個 key 比對嘅邏輯，對 null 單點（見 _computeFreqDeparture 頂部
    // 註解）一樣會誤判做「有一個 60 分鐘闊嘅時段」，令一個單一、獨立嘅
    // 已知開車時刻（例如 N42 尾班車 04:50），被當成「04:50-05:50 呢成
    // 個鐘都算有服務」，同事實唔符。而家改用返同 scheduleFallback／
    // evaluateCandidate 一致嘅 _computeFreqDeparture()，正確分辨陣列時段
    // 同 null 單點，只要佢傳返有效結果（唔理係啱啱好喺時段入面、定係
    // windowMin 之內即將有嘅未來班次），就當呢一刻合理有服務。
    const result = _computeFreqDeparture(resolved.table, atTime, windowMin);
    return !!result;
  } catch (err) {
    return false; 
  }
}

// 判定起點附近與終點附近是否存在任何一條直達巴士路線
// 判定範圍統一為起點半徑 650 米，唔再按車程遠近分長途／極長途另外調整。
// atTime：指定搜尋時間點，用嚟檢查「現時時段內」係咪真係有直達班次運作（見上面 isRouteActiveAroundTime）
function hasDirectService(orig, dest, atTime = null) {
  if (!etaDb || !stopRouteIndex || !orig || !dest) return false;

  const directCheckRadiusM = ENDPOINT_WALK_RADIUS_M;

  // 獲取起訖點半徑範圍內的所有站點
  const originStops = [{ stopId: orig.stopId, dist: 0 }]
    .concat(nearbyStops(orig.lat, orig.lng, directCheckRadiusM))
    .map(s => s.stopId);
  const uniqueOriginStops = [...new Set(originStops)];

  const destStops = [{ stopId: dest.stopId, dist: 0 }]
    .concat(nearbyStops(dest.lat, dest.lng, directCheckRadiusM))
    .map(s => s.stopId);
  const uniqueDestStops = [...new Set(destStops)];

  // 掃描是否存在直達路線
  for (const origId of uniqueOriginStops) {
    const origRoutes = stopRouteIndex.get(origId) || [];
    for (const origRoute of origRoutes) {
      const r = etaDb.routeList[origRoute.routeId];
      if (!r) continue;
      
      const companies = getCompanies(r);
      for (const co of companies) {
        const stops = r.stops[co];
        if (!stops) continue;
        const oIdx = stops.indexOf(origId);
        if (oIdx === -1) continue;
        
        for (const destId of uniqueDestStops) {
          const dIdx = stops.indexOf(destId);
          // 必須在同一條路線中，且起點在終點之前
          if (dIdx !== -1 && oIdx < dIdx) {
            // 只計現時時段內確實有運作嘅直達班次，
            if (atTime && !isRouteActiveAroundTime(r, atTime, origId)) continue;
            return true; 
          }
        }
      }
    }
  }
  return false;
}

async function calculateRouteScore(legs, searchTime) {
  if (!legs || legs.length === 0) return { actualDuration: 0, score: Infinity, transferQualityScore: 0, transferCount: 0 };
  
  // 定義深夜時段 (00:00-06:00)
  const tripStartTime = legs[0].departTime;
  const isDeepNight = tripStartTime.getHours() >= 0 && tripStartTime.getHours() < 6;

  // 判定是否存在現時時段內實際運作嘅直達服務
  const safeOrigin = origin || { name: "", lat: 0, lng: 0 };
  const safeDestination = destination || { name: "", lat: 0, lng: 0 };
  const directExists = hasDirectService(origin, destination, searchTime || tripStartTime);

  let transferCount = legs.filter(l => l.type === "ride").length - 1;
  if (transferCount < 0) transferCount = 0;

  const startTime = legs[0].departTime;
  const endTime = legs[legs.length - 1].arriveTime;
  const actualDuration = (endTime - startTime) / 60000; 
  
  const waitTime = searchTime ? Math.max(0, (startTime - searchTime) / 60000) : 0;
  const totalMinutes = actualDuration + waitTime;

  // ---- 耗時分數：只反映時間快慢，唔再混入轉乘判斷嘅賞罰 ----
  let score = Math.ceil(totalMinutes / 5) * 0.5;

  // 起點/終點嘅步行（唔係轉乘步行）辛苦程度按分鐘數額外計落耗時分數，
  // 呢個純粹反映「行路 vs 搭車」邊個辛苦啲，同轉乘質性判斷無關，維持
  // 喺呢度獨立計算。
  legs.forEach((leg, idx) => {
    if (leg.type !== "walk") return;
    const isTransferWalk = !directExists && (idx > 0 && idx < legs.length - 1);
    if (!isTransferWalk) {
      score += leg.minutes * WALK_PENALTY_MULTIPLIER;
    }
  });

  // ---- 轉乘質性評分：100 分為滿分，完全獨立於耗時（見上面「轉乘質性
  // 評分機制」說明），有賞有罰，唔會影響 score，避免拖累/提早淘汰好方案 ----
  const transferQualityScore = calculateTransferQualityScore(
    legs, directExists, isDeepNight, { lat: safeDestination.lat, lng: safeDestination.lng }
  );

  const isLantau = computeIsLantauTrip(safeOrigin, safeDestination);
  
  // 判定北大嶼山本地行程
  const isLocalTCOrAirport = isLantau && isTungChungOrAirportLocal(safeOrigin, safeDestination);

  // 大嶼山路線評分邏輯(路線偏好，不屬於轉乘判斷，維持獨立計落 score
  if (isLantau) {
    legs.forEach(leg => {
      if (leg.type !== "ride") return;
      if (isLocalTCOrAirport) {
        const isERoute = /^E\d+/i.test(leg.routeNo) && !/^E21/i.test(leg.routeNo);
        const isCityboundE = isERoute && leg.r && !LANTAU_KEYWORDS.test(leg.r.dest?.zh || "");
        const isSouthLantauRoute = /^(3M|11|23)$/i.test(leg.routeNo);
        const isSouthLantauOutbound = isSouthLantauRoute && leg.r && !/東涌|機場/i.test(leg.r.dest?.zh || "");

        if (isCityboundE || isSouthLantauOutbound) {
          score += 10; 
        }
      } else {
        const alightStopName = etaDb.stopList[leg.alightStopId]?.name?.zh || "";
        const isLantauGatewayInterchange = /青嶼幹線|屯門赤鱲角隧道/i.test(alightStopName);
        const isCityboundAE = /^[AE]/i.test(leg.routeNo) && leg.r && !LANTAU_KEYWORDS.test(leg.r.dest?.zh || "");
        const isExemptGateway = isLantauGatewayInterchange && isCityboundAE;

        const isPreferred = /^E21/i.test(leg.routeNo) || /^S/i.test(leg.routeNo) || leg.co === "nlb" || isExemptGateway;
        if (!isPreferred) {
          score += 40; 
        }
      }
    });
  }

// 如果用戶設定排序準則為車費，分數計算權重轉化為以車費為主，時間為次
  if (sortMode === "fare") {
    const rideLegsForScore = legs.filter(l => l.type === "ride");
    const fareResultForScore = await computeTripFare(rideLegsForScore);
    // 冇齊車費資料嘅組合，車費排序時要排到最後，唔應該當佢係 0 蚊而錯誤排前
    score = (typeof fareResultForScore.totalFare === "number" ? fareResultForScore.totalFare : 9999) * 10 + actualDuration * 0.1;
  }

  return { actualDuration, score, transferQualityScore, transferCount };
}

/* ---------------- Trip detection ---------------- */
const LANTAU_KEYWORDS = /機場|東涌|迪士尼|博覽館|港珠澳|大嶼山|赤鱲角|國泰城|航天城|後勤區|飛機|大澳|梅窩|塘福|石壁|石門甲|昂坪|愉景灣|欣澳|東邨|東薈城|空運|航空|大橋香港口岸|客運大樓|貨運站|地面運輸中心|維修區/i;
const OFFICIAL_INTERCHANGE_REGEX = /轉車站|轉乘站|城門隧道|大欖隧道|大老山隧道|獅子山隧道|青沙公路|屯門公路|粉嶺公路|將軍澳隧道|啟德隧道|西區海底隧道|海底隧道|東區海底隧道|青嶼幹線|屯門赤鱲角隧道|將藍隧道|香港仔隧道/i;

// 九巴路線，引用轉車站名單（kmb_bbi_stop_id.json）擴充官方轉車站嘅判斷。
let kmbBbiInterchangeNames = new Set();
function buildKmbBbiInterchangeNames(kmbBbiStopDb) {
  kmbBbiInterchangeNames = new Set();
  if (!kmbBbiStopDb) return;
  for (const entries of Object.values(kmbBbiStopDb)) {
    if (!Array.isArray(entries)) continue;
    for (const e of entries) {
      const zh = (e && e.zh) ? cleanStopName(e.zh) : "";
      if (zh) kmbBbiInterchangeNames.add(zh);
    }
  }
}
function isOfficialInterchangeName(name) {
  if (!name) return false;
  if (OFFICIAL_INTERCHANGE_REGEX.test(name)) return true;
  if (!kmbBbiInterchangeNames.size) return false;
  const cleaned = cleanStopName(name);
  if (!cleaned) return false;
  for (const bbiName of kmbBbiInterchangeNames) {
    if (cleaned.includes(bbiName) || bbiName.includes(cleaned)) return true;
  }
  return false;
}

/* ---------------- Stop Geo Classification（單一入口） ----------------
 * 呢個 module 係全站「呢個站／呢個座標喺邊區」判斷嘅唯一入口。
 * 判斷優先順序（geo polygon 做主，keyword 淨係保底）：
 *   1) 官方 GeoJSON polygon（民政事務總署《地方行政區分界》18 區）：
 *      座標落喺邊個官方 district polygon 入面就用嗰個——唔再自己揀一個
 *      經緯度方框話係邊區。
 *   2) subregion（第二層、更細緻——例如沙田／馬鞍山、西貢／將軍澳、
 *      大嶼山／其他離島）：官方冇提供呢層嘅 GeoJSON，先至用地方名關鍵字
 *      做輔助判斷；但仍然要求個站已經落咗喺第 1 層搵到嘅 district
 *      polygon 入面先算數。
 *   3) 完全冇經緯度、或者座標喺 18 區以外（例如 GeoJSON 未載入完）：
 *      先跌落去用返站名關鍵字做保底估算。
 * 舊有嘅 isHKIslandCoord()／isLantauCoord() 保留返同一個 function 名同
 * 簽名（唔使逐個改晒全部呼叫嘅地方），但內部已經改用呢度嘅 polygon 判斷
 * 取代咗原本手寫嘅經緯度方框。
 */

// 官方《地方行政區分界》GeoJSON（民政事務總署，18 區），app 啟動時
// prefetch 一次，之後全部判斷都用返 memory 入面呢份 cache（sync 查）。
//
// 【修正】原本淨係經第三方 CORS proxy（seep.eu.org）攞，呢類免費 proxy
// 好唔穩陣，一斷就令 _hkDistrictBoundaryFC 永遠攞唔到，全站 remark 地區
// 判斷會不知不覺跌落用 keyword fallback（即係站名冇包含「北區」「大埔」
// 等字眼就分唔到，例如「廣福邨廣智樓」「南運路」），效果同淨係靠
// HK_DISTRICT_META 冇分別。而家改做：
//   1) 官方 URL 直接攞（唔少政府 open data 端點本身有開放 CORS，唔一定
//      要經 proxy）；
//   2) 直連失敗先至用返 proxy 做保底；
//   3) 攞到之後 cache 落 localStorage（連份 GeoJSON 同時間戳一齊存），
//      下次載入優先用返呢份 cache，唔使每次都靠網絡先分到區；
//   4) 全程加返清晰嘅 console 診斷，等你响瀏覽器 DevTools 一眼睇到究竟
//      係邊一層攞成功／攞唔到。
const HK_DISTRICT_BOUNDARY_URL_DIRECT = "https://www.had.gov.hk/psi/hong-kong-administrative-boundaries/hksar_18_district_boundary.json";
const HK_DISTRICT_BOUNDARY_URL_PROXY = "https://seep.eu.org/https://www.had.gov.hk/psi/hong-kong-administrative-boundaries/hksar_18_district_boundary.json";
const HK_DISTRICT_BOUNDARY_CACHE_KEY = "hkDistrictBoundaryCache_v1";
// Cache 有效期：官方呢份資料極少更新（上一次已經係 2018 年），但都設一個
// 上限（30 日）避免長期用死一份舊 cache。
const HK_DISTRICT_BOUNDARY_CACHE_MAX_AGE_MS = 30 * 24 * 60 * 60 * 1000;

let _hkDistrictBoundaryFC = null;
let _hkDistrictBoundaryPromise = null;

function _loadHkDistrictBoundaryFromCache() {
  try {
    const raw = localStorage.getItem(HK_DISTRICT_BOUNDARY_CACHE_KEY);
    if (!raw) return null;
    const cached = JSON.parse(raw);
    if (!cached || !cached.fc || !Array.isArray(cached.fc.features)) return null;
    if (!Number.isFinite(cached.savedAt) || (Date.now() - cached.savedAt) > HK_DISTRICT_BOUNDARY_CACHE_MAX_AGE_MS) {
      return null;
    }
    return cached.fc;
  } catch (err) {
    console.warn("[HK Geo] 讀取本地 18 區 GeoJSON cache 失敗：", err);
    return null;
  }
}

function _saveHkDistrictBoundaryToCache(fc) {
  try {
    localStorage.setItem(HK_DISTRICT_BOUNDARY_CACHE_KEY, JSON.stringify({ savedAt: Date.now(), fc }));
  } catch (err) {
    // localStorage 滿咗／唔支援都唔緊要，淨係冇得 cache，唔影響本次判斷。
    console.warn("[HK Geo] 儲存 18 區 GeoJSON cache 失敗（唔影響本次使用）：", err);
  }
}

async function _fetchHkDistrictBoundaryFromUrl(url, label) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${label} HTTP ${res.status}`);
  const fc = await res.json();
  if (!fc || !Array.isArray(fc.features) || !fc.features.length) {
    throw new Error(`${label} 回傳嘅 GeoJSON 冇 features`);
  }
  return fc;
}

async function _ensureHkDistrictBoundary() {
  if (_hkDistrictBoundaryFC) return _hkDistrictBoundaryFC;
  if (_hkDistrictBoundaryPromise) return _hkDistrictBoundaryPromise;

  _hkDistrictBoundaryPromise = (async () => {
    // 第 0 層：本地 cache（上次成功攞到就唔使再靠網絡）。
    const cached = _loadHkDistrictBoundaryFromCache();
    if (cached) {
      console.info(`[HK Geo] 18 區 GeoJSON 用返本地 cache（${cached.features.length} 個 district polygon）`);
      _hkDistrictBoundaryFC = cached;
      return _hkDistrictBoundaryFC;
    }

    // 第 1 層：官方 URL 直連。
    try {
      const fc = await _fetchHkDistrictBoundaryFromUrl(HK_DISTRICT_BOUNDARY_URL_DIRECT, "官方直連");
      console.info(`[HK Geo] 18 區 GeoJSON 直連官方成功（${fc.features.length} 個 district polygon）`);
      _hkDistrictBoundaryFC = fc;
      _saveHkDistrictBoundaryToCache(fc);
      return _hkDistrictBoundaryFC;
    } catch (directErr) {
      console.warn("[HK Geo] 直連官方 18 區 GeoJSON 失敗（可能係 CORS），改用 proxy 保底：", directErr);
    }

    // 第 2 層：CORS proxy 保底。
    try {
      const fc = await _fetchHkDistrictBoundaryFromUrl(HK_DISTRICT_BOUNDARY_URL_PROXY, "Proxy");
      console.info(`[HK Geo] 18 區 GeoJSON 經 proxy 攞成功（${fc.features.length} 個 district polygon）`);
      _hkDistrictBoundaryFC = fc;
      _saveHkDistrictBoundaryToCache(fc);
      return _hkDistrictBoundaryFC;
    } catch (proxyErr) {
      console.error(
        "[HK Geo] 直連＋proxy 都攞唔到官方 18 區 GeoJSON，區域判斷將全面跌落用站名 keyword 保底" +
        "（呢個 fallback 對冇包含區名關鍵字嘅站名——例如純屋邨/道路名——會判斷唔到）：",
        proxyErr
      );
      _hkDistrictBoundaryFC = null;
      return null;
    }
  })();

  return _hkDistrictBoundaryPromise;
}

// 18 區（官方英文名）→ { code, region, aliases }。region 分
// hkisland／kowloon／nt，同全站現有嘅宏觀分法一致。「離島」呢個官方區
// 包晒大嶼山＋長洲／南丫島等其他離島，subregion 再細分（見下面
// HK_SUBREGION_RULES）。
const HK_DISTRICT_META = {

  "Wan Chai":          { code: "wan_chai",         region: "hkisland", aliases: ["灣仔", "銅鑼灣", "天后", "跑馬地"] },
  "Eastern":           { code: "eastern",          region: "hkisland", aliases: ["東區", "北角", "鰂魚涌", "太古", "西灣河", "筲箕灣", "柴灣", "小西灣"] },
  "Southern":          { code: "southern",         region: "hkisland", aliases: ["南區", "香港仔", "黃竹坑", "鴨脷洲", "赤柱", "淺水灣", "薄扶林", "數碼港"] },
  "Yau Tsim Mong":     { code: "yau_tsim_mong",    region: "kowloon",  aliases: ["油尖旺", "尖沙咀", "佐敦", "油麻地", "旺角"] },
  "Sham Shui Po":      { code: "sham_shui_po",     region: "kowloon",  aliases: ["深水埗", "長沙灣", "荔枝角", "美孚"] },
  "Kowloon City":      { code: "kowloon_city",     region: "kowloon",  aliases: ["九龍城", "土瓜灣", "紅磡", "啟德", "何文田"] },
  "Wong Tai Sin":      { code: "wong_tai_sin",     region: "kowloon",  aliases: ["黃大仙", "新蒲崗", "鑽石山", "慈雲山", "牛池灣"] },
  "Kwun Tong":         { code: "kwun_tong",        region: "kowloon",  aliases: ["觀塘", "九龍灣", "牛頭角", "藍田", "油塘", "秀茂坪"] },
  "Kwai Tsing":        { code: "kwai_tsing",       region: "nt",       aliases: ["葵青", "葵涌", "青衣"] },
  "Tsuen Wan":         { code: "tsuen_wan",        region: "nt",       aliases: ["荃灣", "汀九", "深井"] },
  "Tuen Mun":          { code: "tuen_mun",         region: "nt",       aliases: ["屯門"] },
  "Yuen Long":         { code: "yuen_long",        region: "nt",       aliases: ["元朗", "天水圍", "洪水橋"] },
  "North":             { code: "north",            region: "nt",       aliases: ["北區", "上水", "粉嶺", "沙頭角"] },
  "Tai Po":            { code: "tai_po",           region: "nt",       aliases: ["大埔"] },
  "Sha Tin":           { code: "shatin",           region: "nt",       aliases: ["沙田", "馬鞍山"] },
  "Sai Kung":          { code: "sai_kung",         region: "nt",       aliases: ["西貢", "將軍澳"] },
  "Islands":           { code: "islands",          region: "nt",       aliases: ["離島", "大嶼山", "東涌", "長洲", "南丫島", "坪洲"] }
};

// district → subregion 嘅保底判斷規則。呢層官方冇獨立 GeoJSON，先至用
// 地方名關鍵字補返（keyword 淨係做呢一層嘅保底，唔再係第一層 region／
// district 嘅判斷依據）。搵到官方更細緻嘅 GeoJSON（例如分區委員會分界）
// 之後，呢度應該改做 polygon 判斷。
const HK_SUBREGION_RULES = {
  shatin: [
    { subregion: "ma_on_shan", test: /馬鞍山/ },
    { subregion: "sha_tin", test: /.*/ }
  ],
  sai_kung: [
    { subregion: "tseung_kwan_o", test: /將軍澳/ },
    { subregion: "sai_kung", test: /.*/ }
  ],
  islands: [
    { subregion: "lantau", test: LANTAU_KEYWORDS },
    { subregion: "other_islands", test: /.*/ }
  ]
};

// 座標落喺邊一個官方 18 區 polygon 入面（sync，靠已經 prefetch 落 memory
// 嘅 _hkDistrictBoundaryFC；未載入完之前一律回傳 null，交返俾 keyword
// 保底）。重用返 MTR 室內地圖嗰個通用 point-in-polygon（_mtrIndoorPointInGeom）。
// 官方 GeoJSON 嘅 District 欄位本身已經係 district 身份證明；
// 唔應該因為 HK_DISTRICT_META 少咗一個 alias／metadata 就連 district 都判斷唔到。
// 直接由官方英文 district 名稱正規化成穩定 code，例如：
//   "North" -> "north"
//   "Tai Po" -> "tai_po"
//   "Yau Tsim Mong" -> "yau_tsim_mong"
function _hkOfficialDistrictCode(nameEn) {
  const s = String(nameEn || "").trim();
  if (!s) return null;
  return s
    .replace(/&/g, " and ")
    .replace(/[^A-Za-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "")
    .toLowerCase() || null;
}

const HK_DISTRICT_REGION_BY_CODE = {
  central_western: "hkisland",
  wan_chai: "hkisland",
  eastern: "hkisland",
  southern: "hkisland",
  yau_tsim_mong: "kowloon",
  sham_shui_po: "kowloon",
  kowloon_city: "kowloon",
  wong_tai_sin: "kowloon",
  kwun_tong: "kowloon",
  kwai_tsing: "nt",
  tsuen_wan: "nt",
  tuen_mun: "nt",
  yuen_long: "nt",
  north: "nt",
  tai_po: "nt",
  shatin: "nt",
  sai_kung: "nt",
  islands: "nt"
};

function _lookupHkDistrictByCoord(lat, lng) {
  if (!_hkDistrictBoundaryFC || !Number.isFinite(lat) || !Number.isFinite(lng)) return null;
  const pt = [lng, lat];
  for (const f of _hkDistrictBoundaryFC.features) {
    const nameEn = f.properties && f.properties["District"];
    const code = _hkOfficialDistrictCode(nameEn);
    if (!code) continue;
    if (_mtrIndoorPointInGeom(pt, f.geometry)) return code;
  }
  return null;
}

function _resolveHkSubregion(districtCode, name) {
  const rules = HK_SUBREGION_RULES[districtCode];
  // district 本身已經係完整行政區；冇官方更細 subregion 規則時，
  // subregion 應該保持 null，而唔係複製 district code。
  if (!rules) return null;
  const nm = name || "";
  for (const rule of rules) {
    if (rule.test.test(nm)) return rule.subregion;
  }
  return null;
}

// 核心分類 function：畀一個座標＋（可選）名稱，攞返完整 hierarchy。
// 呢個係俾冇現成 stopId 嘅物件（例如用戶自訂落腳點）用嘅低階版本；
// 有 stopId 嘅一律應該用下面嘅 getStopGeoClassification()。
function classifyHkGeo(lat, lng, name) {
  const nameStr = name || "";
  const districtCode = _lookupHkDistrictByCoord(lat, lng);

  if (districtCode) {
    const region = HK_DISTRICT_REGION_BY_CODE[districtCode] || null;
    const subregion = _resolveHkSubregion(districtCode, nameStr);
    const island = (districtCode === "islands" && subregion === "lantau") ? "lantau" : null;
    return {
      region,
      district: districtCode,
      subregion,
      island,
      areaIds: [region, districtCode, subregion].filter(Boolean),
      usedFallback: false
    };
  }

  // Polygon 判斷唔到（GeoJSON 未載完 / 座標喺 18 區以外 / 冇座標）——
  // 保底：keyword-only 估算，唔再靠自己畫嘅經緯度方框。
  if (HK_ISLAND_KEYWORDS.test(nameStr)) {
    return { region: "hkisland", district: null, subregion: null, island: null, areaIds: ["hkisland"], usedFallback: true };
  }
  if (LANTAU_KEYWORDS.test(nameStr)) {
    return { region: "nt", district: "islands", subregion: "lantau", island: "lantau", areaIds: ["nt", "islands", "lantau"], usedFallback: true };
  }
  return { region: null, district: null, subregion: null, island: null, areaIds: [], usedFallback: true };
}

// 【單一入口】畀一個 stopId，攞返呢個站完整嘅 geo hierarchy——Remark、
// route-area、搜尋 heuristic 等等應該共用呢個結果，唔應該再各自維護一套
// 經緯度方框或者關鍵字判斷。
function getStopGeoClassification(stopId) {
  if (!stopId || typeof etaDb === "undefined" || !etaDb.stopList) {
    return { region: null, district: null, subregion: null, island: null, areaIds: [], usedFallback: true };
  }
  const stop = etaDb.stopList[stopId];
  if (!stop) return { region: null, district: null, subregion: null, island: null, areaIds: [], usedFallback: true };
  const name = stop.name?.zh || stop.name || "";
  const loc = stop.location;
  return classifyHkGeo(loc?.lat, loc?.lng, name);
}

// 舊有 function 名／簽名保留（call site 好多，唔逐個改），但內部已經
// 改用官方 polygon（第 1 層）判斷，唔再係手寫嘅經緯度方框。
function isLantauCoord(lat, lng){
  return classifyHkGeo(lat, lng, "").district === "islands";
}
function isHKIslandCoord(lat, lng){
  return classifyHkGeo(lat, lng, "").region === "hkisland";
}

function computeIsLantauTrip(origin, destination){
  if (LANTAU_KEYWORDS.test(origin.name) || LANTAU_KEYWORDS.test(destination.name)) return true;
  if (isLantauCoord(origin.lat, origin.lng) || isLantauCoord(destination.lat, destination.lng)) return true;
  return false;
}

const HK_ISLAND_KEYWORDS = /中環|金鐘|灣仔|銅鑼灣|天后|炮台山|北角|鰂魚涌|太古|西灣河|筲箕灣|柴灣|小西灣|堅尼地城|西營盤|香港大學|薄扶林|數碼港|香港仔|黃竹坑|鴨脷洲|海洋公園|赤柱|淺水灣|跑馬地|大坑/i;

function computeIsCrossHarbourTrip(orig, dest){
  const origHKI = HK_ISLAND_KEYWORDS.test(orig.name) || isHKIslandCoord(orig.lat, orig.lng);
  const destHKI = HK_ISLAND_KEYWORDS.test(dest.name) || isHKIslandCoord(dest.lat, dest.lng);
  return origHKI !== destHKI;
}

// 落車半徑統一為 750 米
function getRegionWalkLimit(lat, lng, name) {
  return 750;
}

// 判定行程是否屬於「東涌市中心內」或「來往機場」的本地行程。
// 東涌／機場 vs 南大嶼山（大澳、梅窩等）官方 18 區 GeoJSON 冇再細分，
// 所以呢層淨係用地方名關鍵字做保底判斷；但第一層仍然要求個站真係落咗
// 喺官方「離島」district polygon 入面（isLantauCoord，見上面），唔再
// 靠自己畫嘅經緯度方框做把關。
const _TUNG_CHUNG_AIRPORT_KEYWORDS = /東涌|逸東|滿東|迎東|裕雅|富東|裕東|映灣園|藍天海岸|昇薈|東環|機場|博覽館|航天城|國泰城|後勤區|飛機維修區|民航處|客運大樓|地面運輸中心/i;

function isTungChungOrAirportLocal(orig, dest) {
  if (!orig || !dest) return false;
  const origLocal = _TUNG_CHUNG_AIRPORT_KEYWORDS.test(orig.name) && isLantauCoord(orig.lat, orig.lng);
  const destLocal = _TUNG_CHUNG_AIRPORT_KEYWORDS.test(dest.name) && isLantauCoord(dest.lat, dest.lng);
  return origLocal && destLocal;
}

// 單一個站嘅「東涌／機場（北大嶼山本地）」判斷，抽取自
// isTungChungOrAirportLocal() 入面嘅邏輯，但淨係睇一個站（唔需要
// origin+destination 一齊先判斷）。城巴 concessionApi remark 講嘅
// 「大嶼山各站」／「北大嶼山沿途各站」依官方原意其實係指「東涌或機場
// 範圍內」，唔包括大澳、梅窩、昂坪等南大嶼山。
function _isTungChungOrAirportStop(stop) {
  if (!stop) return false;
  const name = stop?.name?.zh || stop?.name || "";
  if (!_TUNG_CHUNG_AIRPORT_KEYWORDS.test(name)) return false;
  const loc = stop?.location;
  if (loc && Number.isFinite(loc.lat) && Number.isFinite(loc.lng)) {
    return isLantauCoord(loc.lat, loc.lng);
  }
  // 冇座標可以核對官方 district polygon，唯有信 keyword。
  return true;
}

/* ---------------- 車費計算 ---------------- */
function isHolidayFareDate(when) {
  const w = when || new Date();
  if (w.getDay() === 0) return true; // 星期日普遍當假日收費
  if (!routeFareDb || !Array.isArray(routeFareDb.holidays)) return false;
  const yyyy = w.getFullYear();
  const mm = String(w.getMonth() + 1).padStart(2, '0');
  const dd = String(w.getDate()).padStart(2, '0');
  return routeFareDb.holidays.includes(`${yyyy}${mm}${dd}`);
}

function _fareNameNorm(s) {
  return String(s || "")
    .replace(/[\s　]/g, "")
    .replace(/[#]/g, "")
    .trim();
}

// 一般九巴／嶼巴短途分段地名比對只使用正常化後的完整站名。
// 城巴官方 two_way 短途雙向分段則另外使用 _ctbFareNameVariants()
// 處理括號／斜線等多種官方寫法，避免將呢套較寬鬆規則擴散到其他資料源。

// 九巴短途分段雙向收費
function _findStopIdxByName(stops, targetName) {
  const target = _fareNameNorm(targetName);
  if (!target || !stops) return -1;

  for (let i = 0; i < stops.length; i++) {
    const s = etaDb.stopList[stops[i]];
    if (!s) continue;
    const stopName = _fareNameNorm(s.name?.zh || s.name?.en || "");
    if (!stopName) continue;
    if (stopName === target || stopName.includes(target) || target.includes(stopName)) return i;
  }
  return -1;
}

function getRegionalTwoWayFare(r, co, boardIdx, alightIdx) {
  if (!regionalTwoWayFareDb || !Array.isArray(regionalTwoWayFareDb.routes)) return null;
  if (co !== "kmb" && co !== "nlb") return null;
  const routeNo = String(r.route || "").toUpperCase();
  const candidates = regionalTwoWayFareDb.routes.filter(x => String(x.route_number || "").toUpperCase() === routeNo);
  if (!candidates.length) return null;
  const stops = (r.stops && (r.stops[co] || r.stops[r.primaryCo])) || null;
  if (!stops) return null;

  let bestFare = null;
  for (const cand of candidates) {
    const idxA = _findStopIdxByName(stops, cand.start);
    const idxB = _findStopIdxByName(stops, cand.end);
    if (idxA < 0 || idxB < 0) continue;
    const lo = Math.min(idxA, idxB), hi = Math.max(idxA, idxB);
    // 雙向收費：只要上車同落車都喺呢個範圍之內就適用（唔理方向）
    if (boardIdx >= lo && boardIdx <= hi && alightIdx >= lo && alightIdx <= hi) {
      const f = parseFloat(cand.fare);
      if (Number.isFinite(f) && (bestFare === null || f < bestFare)) bestFare = f;
    }
  }
  return bestFare;
}

// ---------------- 城巴短途雙向分段專用地名 variants ----------------
// 只供城巴官方 two_way 車費表使用：例如
// 「西灣河 (嘉亨灣)」要同時識別「西灣河」及「嘉亨灣」，
// 「赤柱炮台 (閘口)∕馬坑」要保留「赤柱炮台／閘口／馬坑」等 alias。
function _ctbFareNameVariants(s) {
  const raw = String(s || "").replace(/#/g, "").trim();
  if (!raw) return [];
  const variants = new Set();
  const add = (v) => {
    const n = _fareNameNorm(v);
    if (n) variants.add(n);
  };

  add(raw);

  const bracketRe = /[\(（]([^\)）]+)[\)）]/g;
  let main = raw;
  let m;
  while ((m = bracketRe.exec(raw))) add(m[1]);
  main = raw.replace(bracketRe, " ");
  add(main);

  for (const part of raw.split(/[\/∕、]/)) add(part);

  return [...variants];
}

function _ctbFareNameMatchesStop(stopName, fareName) {
  const stopVariants = _ctbFareNameVariants(stopName);
  const fareVariants = _ctbFareNameVariants(fareName);
  if (!stopVariants.length || !fareVariants.length) return false;

  for (const a of stopVariants) {
    for (const b of fareVariants) {
      if (a === b || a.includes(b) || b.includes(a)) return true;
    }
  }
  return false;
}


// 港鐵巴士全程劃一收費
function buildMtrBusFareIndex(mtrBusRoutesJson) {
  const out = {};
  if (!mtrBusRoutesJson || typeof mtrBusRoutesJson !== "object") return out;
  for (const rec of Object.values(mtrBusRoutesJson)) {
    if (!rec || !rec.route) continue;
    const bound = (rec.bound && rec.bound["mtr-bus"]) || "O";
    const fares = Array.isArray(rec.fares) ? rec.fares.map(parseFloat).filter(Number.isFinite) : [];
    const faresHol = Array.isArray(rec.faresHoliday) ? rec.faresHoliday.map(parseFloat).filter(Number.isFinite) : [];
    if (!fares.length) continue;
    const flatFare = fares[0];
    const flatFareHol = faresHol.length ? faresHol[0] : null;
    if (!out[rec.route]) out[rec.route] = {};
    out[rec.route][bound] = { fare: flatFare, fareHoliday: flatFareHol };
  }
  return out;
}

// 城巴官方車費 JSON 入面「地名」可能帶埋一個 "#" 尾碼（表示有備註,例如
// 拍卡機位置特殊）,同 _fareNameNorm() 一齊清理先可以同站名比對。
function _ctbFareNameClean(s) {
  return String(s || "").replace(/#/g, "").trim();
}

// 背景攞、解析某條城巴路線嘅官方分段車費表,並 cache 住個 Promise,
// 同一條路線之後再問就唔使重複發request。每個 route_desc_zh 係
// 「起點(可以有幾個候選地名,用逗號分隔) > 終點(同樣可以有幾個候選)」,
// 例如「龜背灣, 大潭道 \u003E 赤柱炮台 (閘口)∕馬坑」表示由「龜背灣」
// 或者「大潭道」呢兩個位隨便一個起計,去到「赤柱炮台」呢一段嘅收費。
// two_way = true 代表呢個係雙向都用同一個價嘅短途分段收費(通常喺總站
// 附近),唔理上車定落車喺邊個方向。
async function fetchCtbOfficialFare(routeNo) {
  const key = String(routeNo || "").toUpperCase().trim();
  if (!key) return null;
  if (ctbOfficialFareCache.has(key)) return ctbOfficialFareCache.get(key);

  const promise = (async () => {
    try {
      const res = await fetch(`https://seep.eu.org/https://www.citybus.com.hk/app/newfare/data/${encodeURIComponent(key)}.json`);
      if (!res.ok) return null;
      const json = await res.json();
      const arr = json && Array.isArray(json[key]) ? json[key] : null;
      if (!arr || !arr.length) return null;

      const parsed = [];
      for (const rec of arr) {
        if (!rec) continue;
        const desc = String(rec.route_desc_zh || "");
        // 官方 JSON 入面個箭嘴字元係 "\u003E"（即 ">"）,唔理原始字串
        // 用邊種寫法都兼顧埋
        const arrowIdx = desc.search(/>|\u003E/);
        if (arrowIdx === -1) continue;
        const origPart = desc.slice(0, arrowIdx);
        const destPart = desc.slice(arrowIdx + 1);
        const origNames = origPart.split(/[,，]/).map(_ctbFareNameClean).filter(Boolean);
        const destNames = destPart.split(/[,，]/).map(_ctbFareNameClean).filter(Boolean);
        const fare = parseFloat(rec.fare);
        if (!origNames.length || !destNames.length || !Number.isFinite(fare)) continue;
        parsed.push({
          origNames,
          destNames,
          fare,
          twoWay: String(rec.two_way).trim().toLowerCase() === "true"
        });
      }
      return parsed.length ? parsed : null;
    } catch (err) {
      console.error("背景載入城巴官方分段車費失敗:", routeNo, err);
      return null;
    }
  })();

  ctbOfficialFareCache.set(key, promise);
  return promise;
}

// 喺 stops 陣列度搵第一個同「候選地名列表」(names) 相符嘅站,搵唔到就
// 逐個試下一個候選
function _ctbFindStopIdxByNameList(stops, names) {
  if (!Array.isArray(names)) return -1;
  let best = -1;
  for (const n of names) {
    if (!stops) continue;
    for (let i = 0; i < stops.length; i++) {
      const s = etaDb.stopList[stops[i]];
      if (!s) continue;
      const stopName = s.name?.zh || s.name?.en || "";
      if (_ctbFareNameMatchesStop(stopName, n)) return i;
    }
  }
  return best;
}


// 根據城巴官方分段車費表,計算某程「上車站 boardIdx → 落車站
// alightIdx」實際應收幾多錢。搵唔到啱嘅分段就交返 null,等
// getSegFare() 用返其他方式(逐站陣列/估算)頂住。
async function getCtbOfficialSegFare(r, boardIdx, alightIdx, stops) {
  if (!r || !r.route || !stops) return null;
  const table = await fetchCtbOfficialFare(r.route);
  if (!table) return null;

  let bestFull = null;    // 全程／單向分段收費入面,最貼合呢程嘅一個
  let bestTwoWay = null;  // 短途雙向收費入面,最貼合呢程嘅一個

  for (const entry of table) {
    const oIdx = _ctbFindStopIdxByNameList(stops, entry.origNames);
    const dIdx = _ctbFindStopIdxByNameList(stops, entry.destNames);
    if (oIdx < 0 || dIdx < 0) continue;
    const lo = Math.min(oIdx, dIdx), hi = Math.max(oIdx, dIdx);

    if (entry.twoWay) {
      // 短途雙向收費:唔理乘搭方向,只要上車同落車都喺呢個區間之內就啱用
      if (boardIdx >= lo && boardIdx <= hi && alightIdx >= lo && alightIdx <= hi) {
        if (bestTwoWay === null || entry.fare < bestTwoWay) bestTwoWay = entry.fare;
      }
    } else {
      // 【修正：單向分段誤用落相反方向】stops 呢個陣列已經係「呢一個特定
      // 方向」（例如淨係「往中環」或者淨係「往馬鞍山」其中一個）嘅逐站
      // 順序。一個 two_way=false 嘅單向分段(例如「錦駿苑,馬鞍山路 >
      // 馬鞍山市中心」)理論上淨係喺「新界方向」(即返入馬鞍山市中心嗰個
      // 方向)先啱用；如果搭嗰程係「港島方向」(即由馬鞍山市中心出發去
      // 中環),喺呢個方向嘅 stops 陣列度，其實會係「馬鞍山市中心」行先
      // (index 細)、「錦駿苑」行後(index 大)，即 oIdx > dIdx——同官方
      // 資料寫嘅「起點在前、終點在後」順序啱好相反,証明呢個分段其實係
      // 形容緊相反方向,唔應該喺呢個方向度撞中。以前用 min/max 嘅寫法
      // 完全冧唔到方向,將 oIdx > dIdx 都當撞中,先會令新界方向專屬嘅
      // 分段錯誤咁套用埋落港島方向嘅行程。而家改為要求 oIdx <= dIdx
      // (即官方寫法嘅「起點在前」喺呢個方向嘅 stops 陣列入面都成立)
      // 先當呢個分段適用；oIdx > dIdx 就代表呢條分段屬於相反方向,直接
      // 跳過,交返嗰個相反方向嘅 route 物件(自己嗰份 stops 陣列入面
      // oIdx/dIdx 自然會啱返)先啱用。
      if (oIdx <= dIdx && boardIdx >= oIdx && alightIdx <= dIdx && boardIdx <= alightIdx) {
        if (bestFull === null || entry.fare < bestFull) bestFull = entry.fare;
      }
    }
  }

  // 短途雙向收費通常淨係涵蓋路線頭／尾一小段,如果啱啱好喺呢個區間
  // 之內、又平過全程／分段收費,先當佢啱用(同九巴短途分段邏輯
  // getRegionalTwoWayFare() 做法一致,避免地名配對誤中令車費計錯)。
  if (bestTwoWay !== null && (bestFull === null || bestTwoWay < bestFull)) {
    return Math.round(bestTwoWay * 10) / 10;
  }
  if (bestFull !== null) return Math.round(bestFull * 10) / 10;
  return null;
}

async function getSegFare(r, co, boardIdx, alightIdx, when) {
  if (!r || boardIdx == null || alightIdx == null || alightIdx <= boardIdx) return null;

const stops = (r.stops && (r.stops[co] || r.stops[r.primaryCo])) || null;

  // 城門隧道轉車站，途經路線必須使用上車站計算優惠的車費
  if (stops && boardIdx + 1 < stops.length) {
    const currentStopId = stops[boardIdx];
    const nextStopId = stops[boardIdx + 1];
    if (currentStopId && nextStopId) {
      const currentName = _fareNameNorm(etaDb.stopList[currentStopId]?.name?.zh || "");
      const nextName = _fareNameNorm(etaDb.stopList[nextStopId]?.name?.zh || "");
      if (currentName.includes("城門隧道轉車站") && nextName.includes("城門隧道轉車站")) {
        boardIdx = boardIdx + 1;
      }
    }
  }

  // 港鐵巴士劃一收費，唔理會上落車站
  if ((co === "mtrb" || co === "mtr-bus") && mtrBusRouteFareDb) {
    const routeEntry = mtrBusRouteFareDb[r.route];
    if (routeEntry) {
      const bound = (r.bound && (r.bound[co] || r.bound.mtrb || r.bound["mtr-bus"])) || Object.keys(routeEntry)[0];
      const info = routeEntry[bound] || routeEntry[Object.keys(routeEntry)[0]];
      if (info) {
        const isHol = isHolidayFareDate(when);
        const v = (isHol && Number.isFinite(info.fareHoliday)) ? info.fareHoliday : info.fare;
        if (Number.isFinite(v)) return Math.round(v * 10) / 10;
      }
    }
  }

  // 城巴官方逐程分段車費(優先於下面通用嘅逐站陣列/估算邏輯,因為呢份
  // 係城巴自己 app 用嘅權威資料,可以準確反映短途雙向分段收費)
  if (co === "ctb" && stops) {
    try {
      const ctbOfficialFare = await getCtbOfficialSegFare(r, boardIdx, alightIdx, stops);
      if (ctbOfficialFare !== null) return ctbOfficialFare;
    } catch (err) {
      console.error("城巴官方車費查詢失敗:", r.route, err);
    }
  }

  // 九巴短途雙向分段收費
  const regionalFare = getRegionalTwoWayFare(r, co, boardIdx, alightIdx);

  const isHol = isHolidayFareDate(when);
  const table = (isHol && Array.isArray(r.faresHoliday) && r.faresHoliday.length) ? r.faresHoliday : r.fares;

  let normalFare = null;
  if (Array.isArray(table) && table.length) {
    const stops = (r.stops && (r.stops[co] || r.stops[r.primaryCo])) || null;
    if (stops && table.length === stops.length - 1) {
      //直接讀取上車站對應的車費，不與落車站相減
      const fareVal = parseFloat(table[boardIdx]);
      if (Number.isFinite(fareVal)) {
        normalFare = Math.round(fareVal * 10) / 10;
      }
    } else if (table.length === 1) {
      // 修正 NLB 假日車費未能顯示
      const fareVal = parseFloat(table[0]);
      if (Number.isFinite(fareVal)) {
        normalFare = Math.round(fareVal * 10) / 10;
      }
    } else if (stops && stops.length > 1) {
      const ratio = boardIdx / (stops.length - 1);
      const idx = Math.min(table.length - 1, Math.max(0, Math.floor(ratio * table.length)));
      const fareVal = parseFloat(table[idx]);
      if (Number.isFinite(fareVal)) {
        normalFare = Math.round(fareVal * 10) / 10;
      }
    }
  }

  if (regionalFare !== null) {
    // 短途雙向收費只喺佢平過正常收費先套用，避免因為地名配對誤中而抬高／扣減錯車費
    if (normalFare === null || regionalFare < normalFare) return Math.round(regionalFare * 10) / 10;
  }
  return normalFare;
}

/* ---------------- 轉乘優惠計算 ----------------*/
function _routeKeyForBbi(routeNo) {
  return String(routeNo || "").toUpperCase().trim();
}

// 轉乘優惠時限
function _transferGapMinutes(prevLeg, nextLeg) {
  if (!prevLeg || !nextLeg || !prevLeg.arriveTime || !nextLeg.departTime) return null;
  return Math.max(0, (nextLeg.departTime.getTime() - prevLeg.arriveTime.getTime()) / 60000);
}

// 解析 recommended_bbi 欄位（例如「尖沙咀轉車站 - 中間道 (YT562)」），去
// 走尾段括號入面嘅站代碼（YT562），剩低可以同站名資料庫比對嘅純站名。
// 如果原文係「任何能接駁第二程路線的巴士站」（或類似冇指明具體站嘅寫
// 法），代表呢個優惠冇特定轉車站限制，回傳 null（落面嘅檢查會直接放行）。
function _extractBbiStopName(recommendedBbi) {
  const s = String(recommendedBbi || "").trim();
  if (!s) return null;
  if (/任何.*(巴士站|接駁)/.test(s)) return null;
  const stripped = s.replace(/\s*[（(][^）)]*[）)]\s*$/, "").trim();
  return stripped || null;
}

function _kmbBbiDiscountFor(prevLeg, nextLeg, transferIndex = 1) {
  if (!bbiHeavyLoaded || (!bbiF1Db && !bbiB1Db)) return 0;
  if (prevLeg.co !== "kmb" || nextLeg.co !== "kmb") return 0;
  const gap = _transferGapMinutes(prevLeg, nextLeg);
  if (gap === null) return 0;

  const key = _routeKeyForBbi(prevLeg.routeNo);
  const nextRoute = _routeKeyForBbi(nextLeg.routeNo);
  const tables = [bbiF1Db, bbiB1Db];

  let best = 0;
  for (const table of tables) {
    if (!table) continue;
    const entries = table[key] || table[prevLeg.routeNo] || null;
    if (!Array.isArray(entries)) continue;
    for (const e of entries) {
      if (_routeKeyForBbi(e.bbi_route_number) !== nextRoute) continue;

      // 【修正一】核實本程方向是否符合優惠要求嘅首程方向（bbi_direction 欄位）
      // bbi_f1/b1 每條記錄都有 bbi_direction 指明首程路線要去哪個方向先啱
      // 呢個優惠，唔核實就有機會將兩個方向都錯誤地當合資格。
      if (e.bbi_direction) {
        const prevDest = (prevLeg.r && prevLeg.r.dest && prevLeg.r.dest.zh) || "";
        if (prevDest && !prevDest.includes(e.bbi_direction) && !e.bbi_direction.includes(prevDest)) continue;
      }
      // 核實次程方向是否符合優惠要求嘅次程方向（destination 欄位）
      if (e.destination) {
        const nextDest = (nextLeg.r && nextLeg.r.dest && nextLeg.r.dest.zh) || "";
        if (nextDest && !nextDest.includes(e.destination) && !e.destination.includes(nextDest)) continue;
      }

      // 連續轉乘
      const maxChange = parseInt(e.max_change, 10);
      if (Number.isFinite(maxChange) && maxChange > 0 && transferIndex > maxChange) continue;

      const timeLimit = parseFloat(e.time_limit);
      if (Number.isFinite(timeLimit) && gap > timeLimit) continue;

      // 【建議轉車站位置檢定】轉乘優惠必須響資料列明嘅 recommended_bbi
      // （建議轉車站）或之後嘅分站先享有——以前呢個欄位得個「存底」冇被
      // 用嚟驗證，就算首程好早就落咗車轉車（未去到官方建議嘅轉車站），
      // 都照樣攞晒優惠。而家改為：搵到 recommended_bbi 對應响首程路線站
      // 序入面嘅位置，就要求首程實際落車站index ≥ 建議轉車站index，先
      // 當合資格。原始資料入面「任何能接駁第二程路線的巴士站」呢類冇指
      // 明具體站嘅寫法，代表冇位置限制，直接放行；搵唔到對應站（名稱喺
      // 站序表比對唔到）都保持「驗證唔到就放過」，避免因命名差異令本身
      // 有效嘅優惠被誤刪。
      const recommendedName = _extractBbiStopName(e.recommended_bbi);
      if (recommendedName) {
        const recIdx = _ctbFindAnchorIdx(prevLeg, recommendedName);
        const alightIdx = _legAlightIdx(prevLeg);
        if (recIdx !== null && alightIdx !== null && alightIdx < recIdx) continue;
      }

      // 正確處理方式：
      //   free          : discount_raw 係「免費」，第二程應該全免（要扣嘅
      //                   金額係第二程原價，而唔係原始資料入面嘅 0）
      //   discount/return: discount_raw 係「減 $X」/「回贈 $X」，$X 本身
      //                   就已經係應扣金額，可以直接使用
      //   combined_fare : discount_raw 係「兩程合共 $X」，要用「兩程車費
      //                   相加」減返 $X，先係應該扣減嘅金額
      //   fixed_fare    : discount_raw 係「付 $X」，即第二程固定收 $X，
      //                   要用「第二程原價」減返 $X，先係應該扣減嘅金額
      //   其餘／解析唔到嘅類型：寧願唔套用優惠，都好過亂計錯車費
      const rawVal = parseFloat(e.discount);
      let candidateDiscount = 0;
      switch (e.discount_type) {
        case "free":
          candidateDiscount = (typeof nextLeg.fare === "number") ? nextLeg.fare : 0;
          break;
        case "discount":
        case "return":
          if (Number.isFinite(rawVal)) candidateDiscount = rawVal;
          break;
        case "combined_fare":
          if (Number.isFinite(rawVal) && typeof prevLeg.fare === "number" && typeof nextLeg.fare === "number") {
            candidateDiscount = (prevLeg.fare + nextLeg.fare) - rawVal;
          }
          break;
        case "fixed_fare":
          if (Number.isFinite(rawVal) && typeof nextLeg.fare === "number") {
            candidateDiscount = nextLeg.fare - rawVal;
          }
          break;
        default:
          candidateDiscount = 0;
      }

      if (candidateDiscount > best) best = candidateDiscount;
    }
  }
  return Math.max(0, best);
}

// 龍運「E」線 ←→ 嶼巴大嶼山路線轉乘優惠
const NLB_E_TRANSFER_DISCOUNT = { "3M": 1.0, "11": 1.0, "23": 1.0, "36": 1.0, "37": 1.0, "37H": 1.0, "37M": 1.0, "38": 1.0, "38X": 1.0, "X11R": 2.0 };
const NLB_E_TRANSFER_TIME_LIMIT_MIN = 150; // 兩小時半

function _kmbNlbTransferDiscountFor(prevLeg, nextLeg) {
  if (!prevLeg || !nextLeg) return 0;

  // 龍運「E」線喺呢個 app 入面歸類做 co === "kmb"，用路線編號開首係否
  // "E" 加數字嚟識別（例如 E31、E32A、E36P），避免同九巴市區路線混淆。
  const isLwbERoute = (leg) => leg.co === "kmb" && /^E\d/i.test(String(leg.routeNo || "").trim());

  const nlbDiscountKeyFor = (leg) => {
    if (leg.co !== "nlb") return null;
    const rn = String(leg.routeNo || "").trim().toUpperCase();
    return Object.prototype.hasOwnProperty.call(NLB_E_TRANSFER_DISCOUNT, rn) ? rn : null;
  };

  let nlbKey = null;
  if (isLwbERoute(prevLeg)) {
    nlbKey = nlbDiscountKeyFor(nextLeg);
  } else if (isLwbERoute(nextLeg)) {
    nlbKey = nlbDiscountKeyFor(prevLeg);
  }
  if (!nlbKey) return 0;

  const gap = _transferGapMinutes(prevLeg, nextLeg);
  if (gap === null || gap > NLB_E_TRANSFER_TIME_LIMIT_MIN) return 0;

  return NLB_E_TRANSFER_DISCOUNT[nlbKey];
}

/* ---------------- 城巴 concessionApi 即時轉乘優惠查詢 ----------------
 * value.ir 係一個陣列，每個元素代表一個「次程」選擇，包含：
 *   secondProvider / route（次程公司／路線編號）、direction（次程方向）、
 *   stopName（建議轉車站名）、discount（"FR"/"TF"/"L1"/"L2"）、
 *   discountAmount.adult（FR/FF 用：次程減收金額）、totalFare.adult（TF 用：
 *   兩程合共車資）、timeLimit（轉乘時限，分鐘）、remark（附加條款）。
 */
function _ctbTrimUp(s) {
  return String(s || "").trim().toUpperCase();
}

// concessionApi 每條 entry 用「F」（Forward，去程）／「B」（Backward，回程）
// 表示嗰程車行緊邊個方向，同路線資料庫（r.bound，見 _routeBoundValue）慣用
// 嘅「O」（Outbound，去程）／「I」（Inbound，回程）係同一組概念，一一對
// 應：F=O，B=I。呢個換算之後，就可以攞嚟同 prevLeg/nextLeg 實際搭緊嗰程
// 車嘅真正方向直接比對——呢個係好穩陣嘅方向核對方法，唔靠「direction」
// 目的地名嘅子字串模糊比對（好多循環線／總站名寫法有出入嘅路線，單靠
// 目的地字串比對隨時會撞錯或撞唔中）。搵唔到或者唔識嘅值一律回傳 null
// （等於「冇資料驗證」，跟返呢個檔全局「驗證唔到就放過」嘅原則）。
function _ctbMapFbToOi(fb) {
  const v = _ctbTrimUp(fb);
  if (v === "F") return "O";
  if (v === "B") return "I";
  return null;
}

/* ---------------- 城巴轉乘適用登車範圍解析與核對 ----------------
 * concessionApi 每條 ir 記錄嘅 remark 欄位，係用嚟講明「呢個轉乘優惠淨係
 * 適用於響邊個範圍登車嘅乘客」。同一組 routeA→routeB，官方時常會回傳幾條
 * bound/direction/secondDirection 都完全一樣，但 discount 類型（L1/L2/FR/
 * TF）同 remark 唔同嘅記錄——即係話，淨係靠原有嘅「方向比對」評分，呢幾
 * 條記錄分數會打平手，變成永遠揀到排得最前嗰一條，完全冇理會乘客實際上
 * 車站係咪真係落喺呢條記錄講明嘅範圍入面，容易「撞中」錯誤嘅折扣類型。
 * 例如（實測 608→22 嘅其中一組）：
 *   discount:"L1"（回贈首程車費）remark:「只適用於在東區海底隧道巴士轉乘
 *     站或之後沿途各站登上首程路線的乘客。」
 *   discount:"L2"（次程免費）    remark:「只適用於在香港島沿途各站登上首
 *     程路線的乘客。」
 * 呢兩條記錄先前完全冇被 remark 篩走任何一條，最終揀邊條淨係睇邊條排先，
 * 同乘客實際喺邊度上首程車完全冇關係，車費就有機會計錯。
 */

// 1. 輔助函數：處理多重站點分隔符 (支援 "或", "/", ",", "、")
function _ctbSplitAnchors(str) {
  if (!str) return [];
  // 依據標點及連接詞分割，並自動移除站名尾部的空格
  return str.split(/[\/或,、]/).map(s => s.trim()).filter(Boolean);
}

// 2. 預處理及範圍解析
function _ctbParseRemarkConstraints(remarkText) {
  const out = [];
  const raw = String(remarkText || "").trim();
  if (!raw) return out;

  // 預處理：將「不適用於」替換為新句子，以便獨立解析為 exclude 規則
  const normalizedRaw = raw.replace(/不適用於/g, "。不適用於");

  // 拆分邏輯：以換行、句號分句，並處理 Markdown-like 列表符號 "-"
  const sentences = normalizedRaw
    .split(/[\r\n]+|(?<=。)/)
    // 【修正】原本 /(?:^- \s*)/ 個 ^ 淨係匹配「成個 remark string 嘅開
    // 頭」，唔係「每個 bullet 嘅開頭」。如果成個 remark 冇換行（例如
    // 「只適用於: - 轉車站前登上首程路線 - 在西灣河下車時須再以同一
    // 八達通確認。」淨係一句），"- " 出現响句子中間就完全拆唔開，兩個
    // 獨立條件會被錯誤合併成一個（甚至令第二個 bullet 嘅「下車」動作
    // 蓋晒去第一個 bullet 度）。而家改用「前面係行首或空白」嚟匹配
    // "- "，唔再要求一定喺成個 string 嘅最開頭。
    .flatMap(s => s.split(/(?:^|\s)-\s+/))

    .map(s => s.trim())
    .filter(Boolean)
    // 【修正】上面「不適用於」→「。不適用於」呢個替換，如果「不適用於」
    // 啱啱好响句子開頭／前面已經有句號，會拆出一句得返一個「。」、冇任
    // 何實質內容嘅假句子，跌落去落面會觸發一句誤導性嘅「remark 句子未
    // 能識別格式」warning（其實根本冇嘢要解析）。而家隔走淨係得標點、
    // 完全冇中文字／英文字母／數字嘅片段。
    .filter(s => /[\u3400-\u9fffA-Za-z0-9]/.test(s));

  for (let sentence of sentences) {
    let isExclude = false;
    
    // 檢查是否為排除條款
    if (sentence.includes("不適用於")) {
      isExclude = true;
      sentence = sentence.replace(/^不適用於\s*/, "");
    }

    // 清理句首干擾詞 (支援「優惠只適用於：」、「- 在」、「於」等)
    sentence = sentence.replace(/^(?:- \s*)?(?:優惠)?只適用於[：:]?\s*/, "");
    sentence = sentence.replace(/^(?:在|於)\s*/, "");

    if (!sentence) continue;

    const c = _ctbParseOneRemarkSentence(sentence);
    if (c) {
      if (isExclude) c.exclude = true;
      out.push(c);
    } else {
      console.debug(`[城巴轉乘] remark 句子未能識別格式，略過檢查：「${sentence}」`);
    }
  }
  return out;
}

// 3. 增強版 remark 句式解析器
function _ctbParseOneRemarkSentence(sentence) {
  let m;

  // 判定動作：預設為登車 (board)，若包含「下車」則為 alight
  const isAlight = sentence.includes("下車");
  const action = isAlight ? "alight" : "board";

  // 句式 A：繳付全程車資
  m = sentence.match(/(首程|次程)(?:繳付全程車資)/);
  if (m) {
    return { leg: m[1] === "次程" ? "second" : "first", action, type: "full_fare" };
  }

  // 句式 B：轉乘方向 (例如「轉乘往港珠澳大橋香港口岸」)
  m = sentence.match(/轉乘往(.+)/);
  if (m) {
    return { leg: "second", action: "board", type: "direction", anchors: _ctbSplitAnchors(m[1]) };
  }

  // 句式 C-boundary：「分段收費」入面帶埋「或之前／或之後」呢種位置
  // 界線（例如「不適用於次程享用在淺水灣海灘或之前分段收費的乘客」）。
  // 【修正】呢種寫法其實同「次程在 X 或之前下車」係同一組位置限制嘅
  // 兩種講法（分段收費本身就係八達通響邊個站「拍卡」嚟計，即係嗰程車
  // 嘅落車位置），但原本 D-C 個 generic 分支會將「在淺水灣海灘或之前」
  // 成嚿當做一個唔會撞中任何站名嘅 anchor，令呢條規則喺核對嗰邊完全
  // 冇分支處理，變相「驗證唔到就放過」，形同虛設。而家獨立揪出呢種
  // 「分段收費 + 之前/之後」寫法，拆做正式嘅 before/after 位置
  // constraint，action 定為 alight（分段收費係以落車拍卡點計）。
  m = sentence.match(/(首程|次程)?(?:享用)?(?:在|於)?(.+?)(?:或|及)?(之前|以前|之後|其後|後)分段收費/);
  if (m) {
    const finalLeg = (m[1] === "次程" || sentence.includes("次程")) ? "second" : "first";
    // 【修正】原本呢度誤用 m[2]（anchor 文字，例如「淺水灣海灘」）去測試
    // 係咪「之前」，但「之前／之後」呢個詞本身响 m[3]，令「或之前」永遠
    // 判斷唔中，錯誤變成 type:"after"。而家改用 m[3]。
    const isBeforeBoundary = /之前|以前/.test(m[3]);
    return {
      leg: finalLeg,
      action: "alight",
      type: isBeforeBoundary ? "before" : "after",
      // 【修正】m[2] 响主 regex 已經係剝走咗「首程/次程」「享用」「在/於」
      // 前綴之後嘅乾淨 anchor 文字，直接用返呢個 group 就夠，唔使再用
      // 另一條冇剝走前綴嘅 regex 去重新對 m[0] 分析一次（原本嗰種寫法
      // 一定會連「次程享用在」呢啲連接詞都當埋做 anchor 名嘅一部分）。
      anchors: _ctbSplitAnchors(String(m[2] || "").trim()),
    };
  }

  // 句式 C：分段收費 (例如「次程享用維港灣往弼街分段收費」)
  m = sentence.match(/(首程|次程)?(?:享用)?(.+?)(?:分段收費)/);
  if (m) {
    const leg = (m[1] === "次程" || sentence.includes("次程")) ? "second" : "first";
    return { leg, action, type: "section_fare", anchors: [m[2].trim()] };
  }

  // 句式 D-between：兩個具體站名之間嘅範圍 (車站類，例如
  // 「黃大仙站至觀塘警署之間沿途各站登上首程路線」)。
  // 呢類同 D-area 唔同：D-area 描述嘅係一條道路／一個地區（要用 aliases
  // 模糊比對），呢度就係兩個實際、具名嘅站，只要乘客實際上車站排喺
  // 呢兩個站之間（含首尾）就算滿足，要用 _ctbFindAnchorIdx 喺路線站序
  // 入面逐個搵位置嚟精準比對。要行喺 D-area 之前，否則 D-area 個 (.+?)
  // 會將「A至B之間」成句吞晒做一個（唔存在嘅）地區名，害呢類 remark
  // 錯誤跌落去用地區 aliases 比對，永遠撞唔中。
  // 【修正】「之間」二字其實可以冇——例如「首程在高樂花園至香港華人
  // 基督教聯會薄扶林道墳場各站登車」都係同一種「兩個具名站範圍」句式，
  // 只係冇寫「之間」。所以呢度將「之間」改做可選；但咁一嚟就會同下面
  // D0 果類「A至轉車站/轉乘站前」句式撞埋一齊（例如「葵涌交匯處至轉乘
  // 站前各站登車」都含「至」），所以要加返同 D-area 一樣嘅 guard：如果
  // 「至」後面嗰段（m[3]）仲有「之前/以前/前/之後/其後/後/至轉車站/
  // 至轉乘站」呢啲字眼，就唔當呢句係 between，留返俾落面專門嘅 D0/E/F
  // parser 處理。
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)至(.+?)(?:之間)?(?:沿途)?(?:各站)?(?:登(?:上.*?|車(?:往.*?)?)|下車)/);
  if (m && !/(之前|以前|前|之後|其後|後|至轉車站|至轉乘站)/.test(m[3])) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    return {
      leg: finalLeg,
      action,
      type: "between",
      anchors: [m[2].trim(), m[3].trim()]
    };
  }

  // 句式 D-between（與／同 變體）：官方 remark 有時唔用「A至B之間」，
  // 而係用「A與B之間」／「A同B之間」（例如「海怡半島與香港仔隧道巴士
  // 轉乘站之間登上首程路線」）。呢種寫法一定要有明文「之間」先算（同
  // 「至」可以獨立成立唔同），否則「A與B」隨時只係列舉兩個獨立地方，
  // 唔一定係範圍。
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)(?:與|同)(.+?)之間(?:沿途)?(?:各站)?(?:登(?:上.*?|車(?:往.*?)?)|下車)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    return {
      leg: finalLeg,
      action,
      type: "between",
      anchors: [m[2].trim(), m[3].trim()]
    };
  }

  // 句式 D-geo：官方 concession remark 直接以地區／區份限制首程登車。
  // 【重要】呢類句式必須喺一般 D-area parser 之前獨立解析，否則：
  //   「首程在北區及大埔各站登車」
  //   「首程在沙田區各站登車」
  //   「首程在九龍 / 將軍澳登車」
  //   「首程在港島東區各站登車」
  //   「首程在屯門各站登車」
  // 會跌入 generic area/alias 判斷，站名冇包含「北區」「大埔」等字就
  // 永遠撞唔中。呢度直接產生 geoSpec，matcher 再用 stopId ->
  // getStopGeoClassification() 做 district/subregion/region 比對。
  m = sentence.match(/^(首程|次程)?(?:在|於)?\s*(.+?)(?:沿途)?(?:各站)?登(?:上.*?|車(?:往.*?)?|車)$/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    const geoAreaText = String(m[2] || "").trim();
    const geoSpec = _ctbGeoAreaSpec(geoAreaText);
    if (geoSpec) {
      return {
        leg: finalLeg,
        action: "board",
        type: "geo_board",
        areaText: geoAreaText,
        geoSpec: {
          districts: [...geoSpec.districts],
          subregions: [...geoSpec.subregions],
          regions: [...geoSpec.regions]
        }
      };
    }
  }

  // 句式 D-area：指定沿線地區／道路「各站登車」
  // 例如：
  //   「首程在長沙灣道各站登車」
  //   「首程在青嶼幹線巴士轉乘站登車」
  //   「首程在青衣及葵涌道各站登車」
  //   「首程在東涌各站登車」
  // 呢類唔應該當成一個 concession stopName 去比對；佢描述的是首程沿線
  // 某個地區／道路範圍。先保留原文，落面再用 route stop names + aliases 判斷。
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)(?:沿途)?各站登(?:上.*?|車(?:往.*?)?)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    // 【修正】原本呢度成句 areaText（例如「香港島」「港島」「九龍」
    // 「新界」）淨係當一般 area_board，落面用文字子字串同「乘客實際上
    // 車站個名」比對——但根本冇任何巴士站個名淨係得「香港島」三個字，
    // 呢種比對一定撞唔中，令呢類 remark 完全失效（有效嘅轉乘優惠被誤判
    // 做唔適用）。「香港島／港島／九龍／新界」呢類四大宏觀地區，本質上
    // 唔係「搵唔搵到字串」嘅問題，而係「呢個站喺唔喺呢個地理範圍入面」
    // ——所以獨立做結構化嘅 Region constraint（第一層），parser 先判斷
    // 成句 areaText 係咪其中一個宏觀地區名，係就直接記低 region code，
    // 核對時改用 _ctbGuessHkRegion() 座標／關鍵字分類，唔再靠文字比對。
    // 唔係嘅話（例如長沙灣道／青衣及葵涌道／東涌呢類道路或地方名），先
    // 維持原本 area_board（第二層 Route-area），用 aliases 做文字比對。
    const areaText = String(m[2] || "").trim();
    // 已經有明確「之前／之後／至轉車站」句式的，交返前面專門 parser。
    if (areaText && !/(之前|以前|前|之後|其後|後|至轉車站|至轉乘站)/.test(areaText)) {
      const regionCode = _ctbRegionNameToCode(areaText);
      if (regionCode) {
        return {
          leg: finalLeg,
          action: "board",
          type: "region_board",
          region: regionCode
        };
      }

      // 第二層：地區級 GeoClassification。
      // 例：北區及大埔、沙田區、九龍／將軍澳、港島東區、屯門區。
      const geoSpec = _ctbGeoAreaSpec(areaText);
      if (geoSpec) {
        return {
          leg: finalLeg,
          action: "board",
          type: "geo_board",
          areaText,
          geoSpec: {
            districts: [...geoSpec.districts],
            subregions: [...geoSpec.subregions],
            regions: [...geoSpec.regions]
          }
        };
      }

      return {
        leg: finalLeg,
        action: "board",
        type: "area_board",
        areaText
      };
    }
  }

  // 句式 D0：以 concessionApi stopName 為「轉車站／轉乘站」上限
  // 例：「首程在轉車站前各站登車」
  //      「首程在青嶼幹線巴士轉乘站或之前各站登車」
  //      「首程在葵涌交匯處至轉乘站前各站登車」
  //      「首程在港島轉車站前站登車」
  // 呢類 remark 並冇直接重複 JSON 的 stopName；實際轉車站要由候選
  // concession record 自身的 c.stopName 提供，再喺首程站序入面定位。
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)(?:至)(?:轉車站|轉乘站)(?:或|及)?(?:之前|以前|前)(?:沿途)?(?:各站)?(?:登(?:上.*?|車)|下車)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    // 【修正】原本呢度直接將 m[2] 成嚿當做 anchor 名，但官方 remark 好
    // 多時會用「A及期後」「A及其後」「A或之後」呢類寫法表達「由 A 開始
    // （含 A）」，「及期後／及其後／或之後」係連接詞，唔係站名嘅一部
    // 分——例如「漁暉道及期後至轉車站前各站登車」，真正嘅下限站係
    // 「漁暉道」，跟住嗰句「及期後」淨係講緊「由呢度開始」。留低呢啲
    // 連接詞會令下面 _ctbFindAnchorIdx() 拎住成嚿「漁暉道及期後」去撞
    // 站名，通常撞唔中（要靠 anchorName.includes(zh) 呢種寬鬆比對先僥
    // 倖撞到），所以喺呢度就剝走先。
    const lowerText = String(m[2] || "").trim().replace(/(?:及|或)(?:其後|期後|之後)$/, "");
    return {
      leg: finalLeg,
      action,
      type: "before_stopname",
      lowerAnchors: _ctbSplitAnchors(lowerText),
      inclusiveUpper: /或之前|或以前|及之前|及以前/.test(sentence),
      region: /香港島|港島/.test(lowerText) ? "hkisland" : null
    };
  }

  m = sentence.match(/(首程|次程)?(?:在|於)?(?:香港島|港島)?(?:轉車站|轉乘站)(?:或)?(?:之前|以前|前)(?:站|各站)?(?:沿途)?(?:登(?:上.*?|車)|下車)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    return {
      leg: finalLeg,
      action,
      type: "before_stopname",
      lowerAnchors: [],
      inclusiveUpper: sentence.includes("或之前") || sentence.includes("或以前"),
      region: /香港島|港島/.test(sentence) ? "hkisland" : null
    };
  }

  // 句式 E：指定位置之前/前 (支援「各站前」、「以前」、「及之前」)
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)(?:站)?(?:各站)?(?:或|及)?(?:之前|以前|前)(?:沿途)?(?:各站)?(?:登(?:上.*?|車)|下車)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    return {
      leg: finalLeg,
      action,
      type: "before",
      anchors: _ctbSplitAnchors(m[2])
    };
  }

  // 句式 F：指定位置之後/後 (支援「後各站」、「及之後」)
  // 【修正】原本淨係認「或之後」，官方 remark 一樣常用「及之後」（例如
  // 「首程在香港仔及之後各站登車」），冇接受「及」會令「及」字被錯誤
  // 吞晒入 anchor 名（變成「香港仔及」，撞唔中真正站名「香港仔」）。
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)(?:站)?(?:各站)?(?:或|及)?(?:之後|其後|後)(?:沿途)?(?:各站)?(?:登(?:上.*?|車)|下車)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    return {
      leg: finalLeg,
      action,
      type: "after",
      anchors: _ctbSplitAnchors(m[2])
    };
  }

  // 句式 G：指定位置或區域登/下車 (支援 "/"、"或"、"," 分隔及括號)
  m = sentence.match(/(首程|次程)?(?:在|於)?(.+?)(?:沿途)?(?:各站)?(?:登(?:上.*?|車(?:往.*?)?)|下車)/);
  if (m) {
    const finalLeg = m[1] === "次程" ? "second" : (m[1] === "首程" ? "first" : (sentence.includes("次程") ? "second" : "first"));
    return {
      leg: finalLeg,
      action,
      type: "along",
      anchors: _ctbSplitAnchors(m[2])
    };
  }

  return null;
}

// 去除空白同全／半形括號，方便兩個站名之間做子字串比對
// （例如完整站名「德輔道西 (林士街)」對 remark 講嘅「德輔道西」）。
function _ctbNormalizeStopName(s) {
  return String(s || "").replace(/[\s()（）]/g, "").trim();
}

// 攞返某一程車嘅上車站，喺佢自己路線嘅站序陣列入面嘅索引（用嚟同 remark
// 講嘅「或之前／或之後」比先後）。搵唔到就回傳 null（代表冇資料驗證）。
function _ctbLegBoardIdx(leg) {
  if (!leg || !leg.r || !leg.r.stops || !leg.boardStopId) return null;
  const co = leg.co || leg.primaryCo;
  const stops = leg.r.stops[co] || leg.r.stops[Object.keys(leg.r.stops)[0]];
  if (!stops) return null;
  const idx = stops.indexOf(leg.boardStopId);
  return idx === -1 ? null : idx;
}

// 同上，但攞落車站（alightStopId）嘅站序索引——用嚟核對「首程係咪響
// 官方建議轉車站或之後先落車」（KMB recommended_bbi／城巴 stopName 都會
// 用到）。搵唔到就回傳 null（代表冇資料驗證）。
function _legAlightIdx(leg) {
  if (!leg || !leg.r || !leg.r.stops || !leg.alightStopId) return null;
  const co = leg.co || leg.primaryCo;
  const stops = leg.r.stops[co] || leg.r.stops[Object.keys(leg.r.stops)[0]];
  if (!stops) return null;
  const idx = stops.indexOf(leg.alightStopId);
  return idx === -1 ? null : idx;
}

// 喺某一程車嘅路線站序入面，用名稱子字串比對搵返 remark 提到嘅 anchor 站
// 排喺第幾個位（雙向 includes：完整站名包含 anchor，或者 anchor 包含完整
// 站名，都當撞中，應付「德輔道西」對「德輔道西 (林士街)」呢類簡寫）。
function _ctbFindAnchorIdx(leg, anchorNameRaw) {
  if (!leg || !leg.r || !leg.r.stops) return null;
  const anchorName = _ctbNormalizeStopName(anchorNameRaw);
  if (!anchorName) return null;
  const co = leg.co || leg.primaryCo;
  const stops = leg.r.stops[co] || leg.r.stops[Object.keys(leg.r.stops)[0]];
  if (!stops) return null;
  for (let i = 0; i < stops.length; i++) {
    const s = (typeof etaDb !== "undefined" && etaDb.stopList) ? etaDb.stopList[stops[i]] : null;
    if (!s) continue;
    const zh = _ctbNormalizeStopName(s.name?.zh || s.name || "");
    if (!zh) continue;
    if (zh.includes(anchorName) || anchorName.includes(zh)) return i;
  }
  return null;
}

/* ---------------- concessionApi 方向判斷 ----------------
 * direction 只負責「防止反方向」，唔再要求 concessionApi.direction 與
 * r.dest.zh 100% 字串相同。
 */
function _ctbDirectionTokens(nameRaw) {
  const name = _ctbNormalizeStopName(nameRaw).replace(/[，。、．·・\-—_~～:：\/\\]/g, "");
  if (!name) return [];
  const generic = new Set(["巴士", "總站", "总站", "轉車站", "轉乘站", "中心", "大樓", "方向", "往"]);
  const tokens = new Set();
  for (const m of name.matchAll(/[\u3400-\u9fff]{2,4}/g)) {
    const t = m[0];
    if (!generic.has(t)) tokens.add(t);
    if (t.length > 2) {
      for (let i = 0; i + 1 < t.length; i++) {
        const pair = t.slice(i, i + 2);
        if (!generic.has(pair)) tokens.add(pair);
      }
    }
  }
  return [...tokens];
}

function _ctbDirectionNameRelation(aRaw, bRaw) {
  const a = _ctbNormalizeStopName(aRaw);
  const b = _ctbNormalizeStopName(bRaw);
  if (!a || !b) return "unknown";
  if (a === b || a.includes(b) || b.includes(a)) return "same";
  const aTokens = _ctbDirectionTokens(a);
  const bTokens = new Set(_ctbDirectionTokens(b));
  if (aTokens.some(t => bTokens.has(t))) return "token";
  return "different";
}

function _ctbRouteTerminalEvidence(leg, concessionDirectionRaw, actualDestRaw) {
  if (!leg || !leg.r || !leg.r.stops) return { resolved: false, sameTerminal: false };
  const concessionIdx = _ctbFindAnchorIdx(leg, concessionDirectionRaw);
  const destinationIdx = _ctbFindAnchorIdx(leg, actualDestRaw);
  if (concessionIdx === null || destinationIdx === null) {
    return { resolved: false, sameTerminal: false, concessionIdx, destinationIdx };
  }
  // 「終點附近」唔再以整條路線最後 4 個站做絕對門檻，而係直接比較
  // concessionApi.direction 同 r.dest.zh 喺實際站序嘅距離。
  const TERMINAL_CLUSTER_STOPS = 4;
  return {
    resolved: true,
    concessionIdx,
    destinationIdx,
    sameTerminal: Math.abs(concessionIdx - destinationIdx) <= TERMINAL_CLUSTER_STOPS
  };
}

function _ctbDirectionEvidence(directionRaw, leg, actualDestRaw, boundValue, candidateBound) {
  const relation = _ctbDirectionNameRelation(directionRaw, actualDestRaw);
  if (relation === "same") return { ok: true, relation, reason: "name" };

  const terminal = _ctbRouteTerminalEvidence(leg, directionRaw, actualDestRaw);
  if (relation === "token") {
    return { ok: true, relation, reason: terminal.sameTerminal ? "token+terminal" : "token" };
  }
  if (terminal.sameTerminal) return { ok: true, relation, reason: "terminal" };

  const expectedBound = _ctbTrimUp(boundValue);
  const apiBound = _ctbTrimUp(candidateBound);
  if (expectedBound && apiBound) {
    if (expectedBound === apiBound) return { ok: true, relation, reason: "bound" };
    return { ok: false, relation, reason: "bound-conflict" };
  }

  return { ok: false, relation, reason: "name-conflict-no-bound" };
}


// 核對城巴 concessionApi 嘅 stopName 欄位（建議轉車站，例如「香港仔隧道
// 巴士轉乘站」）：stopName 係「次程上車位置」嘅門檻，唔係首程落車位置嘅門檻。
// 因此：
//   1) 首程可以喺 stopName 之前已經落車，只要優惠轉乘本身成立，唔因呢點剔走；
//   2) 次程上車站必須係 stopName 指定站，或者係其後少量鄰近站；
//   3) 如果 stopName／站序無法驗證，就維持「驗證唔到就放過」，避免資料差異誤殺有效優惠。
const _CTB_STOPNAME_BOARD_NEAR_RADIUS = 2; // stopName 之後最多再容許兩個鄰近站
function _ctbStopNameConstraintSatisfied(stopNameRaw, prevLeg, nextLeg) {
  const stopNameStr = String(stopNameRaw || "").trim();
  if (!stopNameStr) return true;

  // stopName 指向次程上車站；首程落車站完全唔參與呢個限制。
  const boardIdx = _ctbLegBoardIdx(nextLeg);
  if (boardIdx === null) return true;

  const recIdx = _ctbFindAnchorIdx(nextLeg, stopNameStr);
  if (recIdx === null) return true;

  return boardIdx >= recIdx && boardIdx <= recIdx + _CTB_STOPNAME_BOARD_NEAR_RADIUS;
}

// 少數 remark 用嘅係「香港島／九龍／新界」呢類大範圍地名（唔係具體站名），
// 冇辦法直接同單一站名做子字串比對，要靠 classifyHkGeo()／官方 18 區
// polygon 判斷個站實際屬於邊個宏觀地區（見上面 Stop Geo Classification
// 部分）；keyword 淨係做 polygon 判斷唔到（GeoJSON 未載完 / 座標喺 18 區
// 以外）先至用嘅保底。
const _CTB_KOWLOON_KEYWORDS = /尖沙咀|尖東|旺角|油麻地|佐敦|深水埗|長沙灣|荔枝角|美孚|九龍城|土瓜灣|紅磡|啟德|新蒲崗|黃大仙|鑽石山|慈雲山|牛池灣|九龍灣|牛頭角|觀塘|藍田|油塘|秀茂坪|順利|九龍塘|何文田|大角咀|石硤尾/;
function _ctbGuessHkRegion(name, lat, lng) {
  // 1) Polygon 優先：官方 18 區 GeoJSON 判斷落邊個 district，先再攞返
  //    佢對應嘅宏觀 region。「離島」呢個官方 district 底下要再用
  //    keyword 分「大嶼山」同「其他離島／唔識」——官方 remark 慣例將
  //    「大嶼山各站」同「新界各站」分開講，唔可以將大嶼山落去 "nt" 兜底。
  const geo = classifyHkGeo(lat, lng, name);
  if (!geo.usedFallback && geo.region) {
    if (geo.district === "islands") {
      return geo.subregion === "lantau" ? "lantau" : "nt";
    }
    return geo.region;
  }
  // 2) Polygon 判斷唔到（GeoJSON 未載完 / 座標喺 18 區以外）——keyword 保底。
  if (HK_ISLAND_KEYWORDS.test(name)) return "hkisland";
  if (_CTB_KOWLOON_KEYWORDS.test(name)) return "kowloon";
  if (LANTAU_KEYWORDS.test(name)) return "lantau";
  if (Number.isFinite(lat) && Number.isFinite(lng)) return "nt"; // 新界／離島等其餘地方
  return null;
}

// 將 remark 成句 areaText 對應做四大宏觀地區代號（Region constraint 第一
// 層）。刻意用「完全相等」而唔係 includes／子字串比對：呢度淨係想揪出
// 成句就係「香港島」「港島」「九龍」「新界」呢類單純宏觀地區名嘅
// remark，如果 areaText 仲有其他字（例如道路名、具體站名），就唔算，
// 留返俾第二層 Route-area（area_board）用 aliases 處理，避免誤判。
// 【注意】「大嶼山」「北大嶼山」刻意唔喺呢度處理——雖然文法上都好似
// 一個宏觀地區名，但根據城巴呢類 remark 嘅實際語意，「大嶼山各站」／
// 「北大嶼山各站」其實係指「東涌或機場範圍內」（唔包括大澳、梅窩、
// 昂坪等南大嶼山），比全大嶼山嘅地理範圍窄好多，所以繼續行 area_board
// 果條路，用 _isTungChungOrAirportStop() 做座標判斷（見上面
// _ctbStopMatchesRemarkArea），唔可以當成同「新界／九龍／港島」對等嘅
// 一個完整宏觀 region。
function _ctbRegionNameToCode(areaText) {
  const a = _ctbNormalizeStopName(areaText || "");
  if (!a) return null;
  if (a === "香港島" || a === "港島") return "hkisland";
  if (a === "九龍") return "kowloon";
  if (a === "新界") return "nt";
  return null;
}

// 地區級 remark 的 GeoClassification 規則。
// 優先按 stopId -> getStopGeoClassification() 得到嘅 district/subregion 判斷，
// 唔再靠站名文字是否包含「北區／大埔／沙田」等字眼。
// 每個 spec 內可以同時包含 districts / subregions / regions，屬於 OR。
function _ctbGeoAreaSpec(areaText) {
  const a = _ctbNormalizeStopName(areaText || "");
  if (!a) return null;

  const spec = { districts: new Set(), subregions: new Set(), regions: new Set() };

  // 先將「及／或／、／／」分開，並去掉句尾「各站」；
  // 地區 remark 應該比對「北區／大埔／沙田／屯門」呢個地理概念，
  // 而唔係要求實際 stop name 本身帶住該區文字。
  const parts = a
    .split(/[及或、與和,，\/／]/)
    .map(x => _ctbNormalizeStopName(x).replace(/各站$/, ""))
    .map(x => x.replace(/沿途$/, ""))
    .filter(Boolean);

  for (const part of parts) {
    // 行政區 district：直接對應 stop GeoClassification.district。
    if (part === "北區") spec.districts.add("north");
    else if (part === "大埔" || part === "大埔區") spec.districts.add("tai_po");
    else if (part === "沙田" || part === "沙田區") spec.districts.add("shatin");
    else if (part === "屯門" || part === "屯門區") spec.districts.add("tuen_mun");
    else if (part === "港島東" || part === "港島東區" || part === "東區") spec.districts.add("eastern");

    // 宏觀 region。
    else if (part === "九龍") spec.regions.add("kowloon");
    else if (part === "香港島" || part === "港島") spec.regions.add("hkisland");
    else if (part === "新界") spec.regions.add("nt");

    // 更細 subregion。
    else if (part === "將軍澳") spec.subregions.add("tseung_kwan_o");
    else if (part === "大嶼山" || part === "北大嶼山") spec.subregions.add("lantau");
  }

  if (!spec.districts.size && !spec.subregions.size && !spec.regions.size) return null;
  return spec;
}

function _ctbGeoSpecMatchesClassification(spec, geo) {
  if (!spec || !geo) return false;
  if (spec.districts.has(geo.district)) return true;
  if (spec.subregions.has(geo.subregion)) return true;
  if (spec.regions.has(geo.region)) return true;
  return false;
}

// 診斷用：記低邊啲 stopId 曾經跌落用 keyword fallback（而唔係 polygon）
// 判斷地區，方便响 DevTools console 一眼睇到邊啲站冇被 polygon 覆蓋到。
// 用 Set 去重複，避免同一個站每次搜尋都刷 log。
const _ctbGeoFallbackWarnedStopIds = new Set();

function _ctbStopMatchesGeoArea(stopId, stop, areaText, preparedSpec = null) {
  const spec = preparedSpec || _ctbGeoAreaSpec(areaText);
  if (!spec) return null; // 不是 GeoClassification 類 remark，交返舊邏輯

  // 第一層：直接用 stopId 對應嘅 GeoClassification。
  // 呢度係唯一應該優先使用嘅站本身地理分類來源；唔再要求 stop name
  // 一定出現「北區／大埔／沙田」等文字。
  if (stopId) {
    const geo = getStopGeoClassification(stopId);
    if (geo && (geo.district || geo.subregion || geo.region)) {
      // 有真正 GeoClassification 資料時，無論係 polygon result 定 fallback
      // result，都直接以分類結果為準，唔再用 keyword 把一個已確認唔符合嘅站
      // 「翻生」。
      if (geo.usedFallback && !_ctbGeoFallbackWarnedStopIds.has(stopId)) {
        _ctbGeoFallbackWarnedStopIds.add(stopId);
        console.debug(
          `[HK Geo] 站「${stop?.name?.zh || stop?.name || stopId}」冇跌入官方 polygon（可能係 GeoJSON 未載入，` +
          `或座標喺 18 區以外），靠 keyword 估算做 ${JSON.stringify(geo)}`
        );
      }
      return _ctbGeoSpecMatchesClassification(spec, geo);
    }
    if (!_ctbGeoFallbackWarnedStopIds.has(stopId)) {
      _ctbGeoFallbackWarnedStopIds.add(stopId);
      console.debug(
        `[HK Geo] 站「${stop?.name?.zh || stop?.name || stopId}」完全分類唔到（冇 district/subregion/region），` +
        `即將跌落用站名 keyword 逐個 alias 比對`
      );
    }
  }

  // 第二層 fallback：舊有座標／keyword 分類。
  const loc = stop?.location;
  const name = _ctbNormalizeStopName(stop?.name?.zh || stop?.name || "");
  const fallbackRegion = _ctbGuessHkRegion(name, loc?.lat, loc?.lng);

  // 可以靠現有 region fallback 判斷「九龍」，亦可以靠站名 fallback 判斷
  // 港島東／北區／大埔／沙田／屯門等；只有明確撞到先返回結果。
  if (spec.regions.has(fallbackRegion)) return true;

  if (spec.districts.size || spec.subregions.size) {
    const fallback = classifyHkGeo(loc?.lat, loc?.lng, name);
    if (fallback) {
      if (_ctbGeoSpecMatchesClassification(spec, fallback)) return true;
    }

    // 最後先容許現有 keyword fallback，避免官方 boundary 未載入時誤殺。
    if (spec.districts.has("north") && /北區|上水|粉嶺|沙頭角/.test(name)) return true;
    if (spec.districts.has("tai_po") && /大埔/.test(name)) return true;
    if (spec.districts.has("shatin") && /沙田|馬鞍山/.test(name)) return true;
    if (spec.subregions.has("tseung_kwan_o") && /將軍澳|調景嶺|坑口|寶琳|康城|日出康城/.test(name)) return true;
    if (spec.districts.has("eastern") && /東區|北角|鰂魚涌|太古|西灣河|筲箕灣|柴灣|小西灣/.test(name)) return true;
    if (spec.districts.has("tuen_mun") && /屯門/.test(name)) return true;
  }
  return false;
}
// 地名／區域識別
function _ctbAnchorRegion(anchorName) {
  if (/香港島|港島/.test(anchorName)) return "hkisland";
  if (/九龍/.test(anchorName)) return "kowloon";
  if (/大嶼山/.test(anchorName)) return "lantau";
  if (/新界|北區|大埔|元朗|屯門|沙田|葵青|荃灣|西貢|將軍澳/.test(anchorName)) return "nt";
  return null;
}

// 「along」型 constraint（登車地點）容許嘅「地區」範圍：anchor 響路線
// 站序表入面搵到嘅位置，同乘客實際上車站相差幾多個站之內都當「同一個
// 地區」（例如大型口岸／轉車總站，官方站序表可能拆成幾個相鄰但唔同名
// 嘅站）。數值刻意保守（唔會大到誤將完全唔相關嘅地點都當撞中）。
const _CTB_ALONG_AREA_RADIUS = 2;

// 將 concessionApi Remark 入面常見「沿線地區／道路」名稱轉成可比對 aliases。
// 只用於 concessionApi Remark，唔會影響其他車費資料源。
function _ctbRemarkAreaAliases(areaText) {
  const a = _ctbNormalizeStopName(areaText || "");
  if (!a) return [];
  const specs = [];
  if (a.includes("長沙灣道")) specs.push(["長沙灣道", "長沙灣"]);
  if (a.includes("青衣") || a.includes("葵涌道")) {
    const group = [];
    if (a.includes("青衣")) group.push("青衣");
    if (a.includes("葵涌道")) group.push("葵涌道", "葵涌");
    if (group.length) specs.push(group);
  }
  if (a.includes("東涌")) specs.push(["東涌"]);
  if (a.includes("青嶼幹線巴士轉乘站") || a.includes("青嶼幹線")) specs.push(["青嶼幹線巴士轉乘站", "青嶼幹線"]);
  // 一般情況：若係「X及Y」／「X、Y」等多個地區，拆成多組；每組只要命中其一 alias。
  if (!specs.length) {
    const parts = String(areaText).split(/[及、與和,，\/]/).map(x => _ctbNormalizeStopName(x)).filter(Boolean);
    if (parts.length) return parts.map(x => [x]);
    return [[a]];
  }
  return specs;
}

function _ctbStopMatchesRemarkArea(stop, areaText) {
  const normalizedArea = _ctbNormalizeStopName(areaText || "");
  // 「大嶼山」／「北大嶼山」呢類地方類 remark，官方原意其實係「東涌或
  // 機場範圍內」（唔包括大澳、梅窩、昂坪等南大嶼山），淨靠文字比對搵
  // 唔到（好多東涌／機場站根本冇「大嶼山」三個字），要改用站嘅座標
  // 範圍（同 isTungChungOrAirportLocal 果套邏輯）先分得到，唔可以當
  // 一般道路／地區咁樣直接做文字 alias 比對。
  if (/大嶼山/.test(normalizedArea)) {
    return _isTungChungOrAirportStop(stop);
  }
  const name = _ctbNormalizeStopName(stop?.name?.zh || stop?.name || "");
  if (!name) return false;
  const specs = _ctbRemarkAreaAliases(areaText);
  if (!specs.length) return false;
  // 「青衣及葵涌道」係兩個沿線範圍的聯集，因此任何一組 alias 命中即屬範圍。
  return specs.some(group => group.some(alias => {
    const a = _ctbNormalizeStopName(alias);
    return a && (name.includes(a) || a.includes(name));
  }));
}

// 核對單一個 constraint 係咪俾「乘客實際上車站」滿足。原則：只要冇足夠
// 資料去驗證（搵唔到 anchor 對應邊個站、攞唔到上車站索引等），就寧願放
// 過（回傳 true），好過因為解析／比對唔到就誤刪咗本身有效嘅優惠；但只
// 要搵到足夠資料證明唔滿足，就要老實咁擋走呢條記錄。
function _ctbConstraintSatisfied(constraint, prevLeg, nextLeg, candidateStopName = "") {
  const leg = constraint.leg === "second" ? nextLeg : prevLeg;
  if (!leg) return true;

  // 【可靠性修正】並非每種 constraint 都有 anchors（例如句式 A「首程/次程
  // 繳付全程車資」type:"full_fare" 就完全冇 anchors 呢個欄位，因為佢淨係
  // 講緊車資規則，唔涉及任何站名/地點）。以往落面幾段直接用
  // `constraint.anchors.length` / `for...of constraint.anchors`，一旦
  // 撞到冇 anchors 嘅 constraint（例如 full_fare、或者未來新增嘅句式）
  // 就會因為 anchors 係 undefined 而拋 "constraint.anchors is not
  // iterable" TypeError，累到成個候選（甚至成程搜尋）中斷。而家統一喺
  // 呢度將 anchors 正規化做一個保證存在嘅陣列，落面全部改用呢個本地
  // 變數，就算冇 anchors 都只會當「冇資料可以驗證」（沿用返呢個函數
  // 一貫嘅「驗證唔到就放過」原則），唔會再拋錯。
  const anchors = Array.isArray(constraint.anchors) ? constraint.anchors : [];

  // 「指定沿線地區／道路各站」型 remark。
  // 例如長沙灣道、青衣及葵涌道、東涌等，唔需要 remark 同實際站名 100% 相同；
  // 會用 aliases 同首程實際上車站名稱比對。驗證唔到時仍沿用「驗證唔到就放過」。
  // 「第一層：Region」型 remark（香港島／港島／九龍／新界）。呢類係結構化
  // constraint：唔再靠喺乘客實際上車站個名度搵「香港島」呢三個字（實際上
  // 冇任何站名會咁樣命名，搵極都搵唔到），而係直接用上車站嘅座標／關鍵字
  // 分類（_ctbGuessHkRegion）攞返佢實際屬於邊個宏觀地區，再同 remark 講
  // 嘅 region code 直接比較。判斷唔到（冇站資料／冇座標）就沿用「驗證
  // 唔到就放過」原則。
  if (constraint.type === "geo_board") {
    const boardStop = (typeof etaDb !== "undefined" && etaDb.stopList) ? etaDb.stopList[leg.boardStopId] : null;
    if (!boardStop) return true;

    const geoSpec = {
      districts: new Set(Array.isArray(constraint.geoSpec?.districts) ? constraint.geoSpec.districts : []),
      subregions: new Set(Array.isArray(constraint.geoSpec?.subregions) ? constraint.geoSpec.subregions : []),
      regions: new Set(Array.isArray(constraint.geoSpec?.regions) ? constraint.geoSpec.regions : [])
    };
    const matched = _ctbStopMatchesGeoArea(leg.boardStopId, boardStop, constraint.areaText, geoSpec);
    if (matched === null) return true;
    return matched;
